/* A floor with the outline of an odd-shaped box pencilled on it, and seven pieces of cardboard (the tangram
   pieces) to build it from. When it's built, a cat comes over and sits in it. */
.floor{--spot:#DCCFB6; --spot-edge:#8F7B5E; --floor:#E8DCC4;
  height:auto;aspect-ratio:9/11.4;background:var(--floor);border:3px solid var(--ink);border-radius:10px;overflow:hidden;

.floor svg{display:block;width:100%;height:100%;outline:none}
.spotEdge{fill:none;stroke:var(--spot-edge);stroke-width:.06;stroke-dasharray:.16 .1;stroke-linecap:round}
.spotFill{fill:var(--spot);stroke:var(--spot);stroke-width:.03;stroke-linejoin:round}
.spotLine{fill:none;stroke:var(--spot-edge);stroke-width:.03;stroke-dasharray:.09 .07;opacity:.8}
.trayLine{stroke:var(--spot-edge);stroke-width:.025;stroke-dasharray:.12 .1;opacity:.5}
.part{cursor:grab}
.part .art{pointer-events:none}
.part.lift{filter:drop-shadow(0 .12px .18px rgba(42,37,48,.45));cursor:grabbing}
.part.sel .rim{stroke:#4F8FA0;stroke-width:.08}
.sitter{pointer-events:none}
.sitter.settled .breath{animation:breathe 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes breathe{to{transform:scale(1.03,1.05)}}
.hintsq{stroke-width:5px}
.part.hinted .rim{stroke:#ECA818;stroke-width:.1}
@media (prefers-reduced-motion:reduce){.sitter.settled .breath{animation:none}}

/* ---------- shapes (plain functions, also run in a background worker) ---------- */

/* ---------- the floor ---------- */
// The floor is 9 wide: the box to build at the top, and the pieces waiting below it.

  for (const p of target) el("polygon", {points: pts(p), class: "spotFill"}, spot);
  el("path", {d: outline.map(([a, b]) => `M${a[0].toFixed(4)} ${a[1].toFixed(4)}L${b[0].toFixed(4)} ${b[1].toFixed(4)}`).join(""), class: "spotEdge"}, spot);
  const info = levelInfo(game.level);
  target.forEach((p, i) => { if (info.lines === "all" || (info.lines === "big" && SET[i] === "L")) el("polygon", {points: pts(p), class: "spotLine"}, spot); });
  el("line", {x1: 0.3, x2: VW - 0.3, y1: TOP + 0.05, y2: TOP + 0.05, class: "trayLine"}, svg);
  parts = [];
  for (let i = 0; i < 7; i++) { const g = el("g", {class: "part", "data-i": i}, svg); drawPart(i, g); parts.push(g); }
  el("polygon", {points: "", class: "hintsq", id: "hintsq", style: "display:none"}, svg);
  // draw parts in the order they were last touched, so the one you just moved is on top
  for (const i of game.order) svg.insertBefore(parts[i], $("hintsq"));
  for (let i = 0; i < 7; i++) place(i);
  update();
}
function place(i) {
  const p = game.pcs[i];
  parts[i].setAttribute("transform", `translate(${p.x.toFixed(4)} ${p.y.toFixed(4)}) rotate(${p.k * 45}) scale(${p.f ? -1 : 1} 1)`);
}
function toFront(i) {
  game.order = game.order.filter(j => j !== i).concat(i);
  $("svg").insertBefore(parts[i], $("hintsq"));
}

/* ---------- fitting ---------- */
// A piece fits when it's all inside the box's outline and not on top of another piece; all seven fitting builds the box.
function fits() {
  const polys = [0, 1, 2, 3, 4, 5, 6].map(polyOf), ok = [];
  for (let i = 0; i < 7; i++) {
    const a = Math.abs(polyArea(polys[i])), inside = target.reduce((s, t) => s + overlapArea(polys[i], t), 0);
    let on = 0; for (let j = 0; j < 7; j++) if (j !== i) on += overlapArea(polys[i], polys[j]);
    ok.push(a - inside < 0.02 && on < 0.02);
  }
  return ok;
}
function update() {
  const ok = fits(), n = ok.filter(Boolean).length;
  parts.forEach((g, i) => { g.classList.toggle("in", ok[i]); g.classList.toggle("sel", i === sel); });
  $("count").textContent = game.won ? "The box is built!" : n === 6 ? "One more piece to go" : `${n} of 7 pieces fit`;
  $("hintBtn").disabled = game.won;
  $("undoBtn").disabled = !game.history.length || game.won;
  $("restartBtn").disabled = !game.history.length || game.won;
  $("flipBtn").disabled = game.won || sel < 0;
  return n === 7;
}
// Snapping: a corner that ends up near a corner of the box or of another piece jumps onto it; failing that,
// an edge near an edge of the box or another piece slides flush against it.
function snap(i) {
  const me = polyOf(i), pts = [...corners], edges = outline.slice(), info = levelInfo(game.level);
  target.forEach((p, j) => { if (info.lines === "all" || (info.lines === "big" && SET[j] === "L")) p.forEach((q, m) => { pts.push(q); edges.push([q, p[(m + 1) % p.length]]); }); });
  for (let j = 0; j < 7; j++) if (j !== i) { const p = polyOf(j); p.forEach((q, m) => { pts.push(q); edges.push([q, p[(m + 1) % p.length]]); }); }
  let best = null, bd = 0.34;
  for (const v of me) for (const q of pts) { const d = Math.hypot(q[0] - v[0], q[1] - v[1]); if (d < bd) { bd = d; best = [q[0] - v[0], q[1] - v[1]]; } }
  if (!best) {
    bd = 0.22;
    me.forEach((v, m) => {
      const w = me[(m + 1) % me.length], ex = w[0] - v[0], ey = w[1] - v[1], el2 = Math.hypot(ex, ey);
      for (const [A, B] of edges) {
        const bx = B[0] - A[0], by = B[1] - A[1], bl = Math.hypot(bx, by);
        if (Math.abs(ex * by - ey * bx) / (el2 * bl) > 1e-3) continue;   // only edges lying the same way
        const nx = -by / bl, ny = bx / bl, d = (v[0] - A[0]) * nx + (v[1] - A[1]) * ny;
        // the two edges must overlap along their length
        const t1 = ((v[0] - A[0]) * bx + (v[1] - A[1]) * by) / bl, t2 = ((w[0] - A[0]) * bx + (w[1] - A[1]) * by) / bl;
        if (Math.max(t1, t2) < 0.05 || Math.min(t1, t2) > bl - 0.05) continue;
        if (Math.abs(d) < bd) { bd = Math.abs(d); best = [-d * nx, -d * ny]; }
      }
    });
  }
  if (best) { game.pcs[i].x += best[0]; game.pcs[i].y += best[1]; }
}
// Keep a piece's middle on the board.
function keepOn(i) {
  const [cx, cy] = mid(polyOf(i)), p = game.pcs[i];
  p.x += Math.min(Math.max(cx, 0.35), VW - 0.35) - cx; p.y += Math.min(Math.max(cy, 0.35), VH - 0.35) - cy;
}
const snapshot = () => game.pcs.map(p => ({...p}));
function changed() {
  for (let i = 0; i < 7; i++) place(i);
  if (update()) { win(); return; }
  save();
}

/* ---------- playing ---------- */
// Drag a piece to move it; tap it to turn it an eighth of a turn; hold it (or right-click) to turn it back.
function turn(i, dir, record = true) {
  if (record) game.history.push(snapshot());
  const p = game.pcs[i], [cx, cy] = mid(polyOf(i));
  Object.assign(p, poseAt(i, p.k + dir, p.f, cx, cy)); p.k = ((p.k % 8) + 8) % 8;
  snap(i); keepOn(i);
}
function flip(i) {
  game.history.push(snapshot());
  const p = game.pcs[i], [cx, cy] = mid(polyOf(i));
  Object.assign(p, poseAt(i, p.k, p.f ^ 1, cx, cy));
  snap(i); keepOn(i);
}
const svgPt = e => { const m = $("svg").getScreenCTM().inverse(); return [e.clientX * m.a + e.clientY * m.c + m.e, e.clientX * m.b + e.clientY * m.d + m.f]; };
let drag = null;
$("svg").addEventListener("pointerdown", e => {
  const g = e.target.closest(".part"); if (!g || !playing() || drag) return;
  e.preventDefault();
  const i = +g.dataset.i, [x, y] = svgPt(e), before = snapshot();
  sel = i; toFront(i); game.started = true; update();
  $("svg").setPointerCapture(e.pointerId);
  drag = {i, id: e.pointerId, x, y, px: game.pcs[i].x, py: game.pcs[i].y, moved: false, before, held: false,
    t: setTimeout(() => { if (drag && !drag.moved) { drag.held = true; game.history.push(before); turn(i, -1, false); changed(); } }, 450)};
});
$("svg").addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id || drag.held) return;
  const [x, y] = svgPt(e);
  if (!drag.moved && Math.hypot(x - drag.x, y - drag.y) < 0.12) return;
  drag.moved = true; clearTimeout(drag.t);
  const p = game.pcs[drag.i]; p.x = drag.px + x - drag.x; p.y = drag.py + y - drag.y;
  place(drag.i); parts[drag.i].classList.add("lift");
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null; clearTimeout(d.t); parts[d.i].classList.remove("lift");
  if (d.held) return;
  if (d.moved) { game.history.push(d.before); snap(d.i); keepOn(d.i); changed(); }
  else if (e.type === "pointerup") { turn(d.i, 1); changed(); }
}
$("svg").addEventListener("pointerup", endDrag);
$("svg").addEventListener("pointercancel", endDrag);
$("svg").addEventListener("contextmenu", e => {
  e.preventDefault();
  const g = e.target.closest(".part"); if (!g || !playing()) return;
  if (drag) { clearTimeout(drag.t); drag = null; }
  turn(+g.dataset.i, -1); changed();
});
$("flipBtn").onclick = () => { if (playing() && sel >= 0) { game.started = true; flip(sel); changed(); } };
// Keys: Tab picks a piece, arrows nudge it, R or Space turns it (Shift turns it back), F flips it.
$("svg").addEventListener("keydown", e => {
  if (!playing() || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "tab") {   // the next piece; past the last one, Tab leaves the board as usual
    const to = sel + (e.shiftKey ? -1 : 1);
    if (to < 0 || to > 6) { sel = -1; update(); return; }
    sel = to; toFront(sel); update(); e.preventDefault(); return;
  }
  if (sel < 0) sel = 0;
  const step = e.shiftKey ? 0.5 : 0.25, mv = {arrowup: [0, -step], arrowdown: [0, step], arrowleft: [-step, 0], arrowright: [step, 0]}[k];
  game.started = true;
  if (mv) { game.history.push(snapshot()); game.pcs[sel].x += mv[0]; game.pcs[sel].y += mv[1]; snap(sel); keepOn(sel); }
  else if (k === "r" || k === " ") turn(sel, e.shiftKey ? -1 : 1);
  else if (k === "f") flip(sel);
  else return;
  e.preventDefault(); changed();
});
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && playing()) { e.preventDefault(); undo(); } });

function undo() {
  if (!playing() || !game.history.length) return;
  game.undid = true; game.pcs = game.history.pop(); changed();
}
$("undoBtn").onclick = undo;
$("restartBtn").onclick = () => {
  if (!playing() || !game.history.length) return;
  game.undid = true; game.history.push(snapshot());
  game.pcs = game.start.map(p => ({...p})); sel = -1; changed();
  G.note("Every piece is back where it started. Undo brings your moves back.", 4000);
};
// Hint: a gold outline shows where one piece goes, and that piece is outlined in gold too; you move it there.
// A hint keeps you on the same level and costs the gold paw.
const near = (a, b) => a.length === b.length && a.every(p => b.some(q => Math.hypot(p[0] - q[0], p[1] - q[1]) < 0.05));
let hintTimer = null;
$("hintBtn").onclick = () => {
  if (!playing()) return;
  const polys = [0, 1, 2, 3, 4, 5, 6].map(polyOf);
  const open = target.map((t, j) => j).filter(j => !polys.some((p, i) => SET[i] === SET[j] && near(p, target[j])));
  if (!open.length) return;
  // a place next to pieces already in place, if there is one
  const done = target.filter((t, j) => !open.includes(j)), byDone = open.filter(j => done.some(t => outlineOf([t, target[j]]).length < t.length + target[j].length));
  const pool = byDone.length ? byDone : open, j = pool[Math.floor(Math.random() * pool.length)];
  const i = [0, 1, 2, 3, 4, 5, 6].find(i => SET[i] === SET[j] && !target.some(t => near(polys[i], t)));
  game.hinted = true; game.started = true; sel = i; toFront(i); update(); save();
  const box = $("hintsq"); box.setAttribute("points", pts(target[j])); box.style.display = "";
  parts.forEach((g, m) => g.classList.toggle("hinted", m === i));
  const inWay = polys.some((p, m) => m !== i && overlapArea(p, target[j]) > 0.02);
  G.note(`The gold ${PIECENAME[i]} goes in the gold outline${inWay ? ", once what's in the way is moved" : ""}.`, 6000);
  const g = game;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { if (game === g) { box.style.display = "none"; parts.forEach(p => p.classList.remove("hinted")); } }, 6000);
};
const PIECENAME = ["big triangle", "big triangle", "middle triangle", "small triangle", "small triangle", "square", "slanted piece"];

/* ---------- endings ---------- */
function win() {
  game.won = true; G.finishClock(game); sel = -1;
  const next = game.hinted ? game.level : Math.min(MAX_LEVEL, game.level + 1);
  settings.level = next; $("levelSel").value = next; save();
  update();
  G.track(`If It Fits solved level ${game.level}`);
  build.prefetch(next);
  const g = game; busy = true;
  sitCat(true, () => { busy = false; if (game === g) finishCard(); });
}
// A cat comes along, sees the box, hops in and curls up in its roomiest part.
function sitCat(walk, then) {
  if (!game.sitter) { game.sitter = settleSpot(); save(); }
  const c = game.sitter, cat = el("g", {class: "sitter"}, $("svg")), lie = el("g", {transform: `rotate(${c.deg.toFixed(1)}) scale(${c.flip} 1)`}, cat);
  el("image", {href: CAT_SRC[c.name] || CAT_DIR + c.name + ".webp", x: -c.w / 2, y: -c.h / 2, width: c.w, height: c.h, preserveAspectRatio: "none", class: "breath"}, lie);
  const pose = (dy, sc, op) => { cat.setAttribute("transform", `translate(${c.x.toFixed(3)} ${(c.y + dy).toFixed(3)}) scale(${sc.toFixed(3)})`); cat.setAttribute("opacity", op.toFixed(2)); };
  if (!walk || matchMedia("(prefers-reduced-motion: reduce)").matches) { pose(0, 1, 1); cat.classList.add("settled"); setTimeout(then, walk ? 900 : 0); return; }
  const t0 = performance.now(), g = game, HOP = 700;
  (function frame(now) {
    if (game !== g) { cat.remove(); return; }
    const f = Math.min(1, (now - t0) / HOP);
    // dropping in from above, landing with a little squash
    pose(-1.6 * (1 - f) * (1 - f), f < 0.85 ? 1.12 - 0.12 * f : 1 + Math.sin((f - 0.85) / 0.15 * Math.PI) * 0.04, Math.min(1, f * 3));
    if (f < 1) requestAnimationFrame(frame); else { cat.classList.add("settled"); setTimeout(then, 800); }
  })(t0);
}
function finishCard() {
  const next = settings.level;
  let text = "The box is built, and a cat came by. It fits, so it sits.";
  text += game.hinted ? ` You had a hint, so here's another at level ${next}.` : game.level === MAX_LEVEL ? " That's the hardest level; here's another." : ` Next up: level ${next}.`;
  G.winCard(text, () => { G.closeCard(); startLevel(next); }, "Admire my box", game.result,
    {title: "It fits, so it sits!", gold: !game.undid && !game.hinted, goldWhy: "No hints or undos!", next: `Next: level ${next}`, after: G.otherSize($("levelSel"), next, startLevel, "Or play a different level:")});
}

/* ---------- a new box ---------- */
function startLevel(n) { settings.level = n; $("levelSel").value = n; save(); newPuzzle(); }
// The pieces start in a muddle: each turned some way it isn't in the answer, waiting below the box.
function begin(p, level, start) {
  const rnd = n => Math.floor(Math.random() * n);
  start = start || p.sol.map(([k, f], i) => {
    let k2, f2 = SET[i] === "P" ? rnd(2) : 0;
    do k2 = SET[i] === "L" ? 2 * rnd(4) : rnd(8); while (k2 === k && f2 === f);
    return homePose(i, k2, f2);
  });
  game = {level, sol: p.sol, start: start.map(q => ({...q})), pcs: start.map(q => ({...q})), order: [0, 1, 2, 3, 4, 5, 6], history: [], won: false, ...G.freshClock()};
  sel = -1;
}
async function newPuzzle() {
  if (busy) return;
  busy = true;
  const n = settings.level;
  G.openCard("Drawing a box…", "", []);
  const p = await build.take(n);
  begin(p, n);
  busy = false; G.closeCard(); G.note("");
  draw(); save();
  build.prefetch(n);
  G.track(`If It Fits new puzzle level ${n}`);
}

/* ---------- sharing ---------- */
// The answer as each piece's turn, flip and exact place; with progress, where each piece is now.
$("shareBtn").onclick = () => { if (game && !busy) G.shareCard({name: "If It Fits", won: game.won,
  puzzle: () => ({g: "iffits", N: game.level, s: game.sol.map(q => q.join(".")).join("_")}),
  progress: () => game.pcs.map(q => [q.k, q.f, q.x.toFixed(3), q.y.toFixed(3)].join(".")).join("_")}); };
function openShared(d) {
  const sol = typeof d.s === "string" ? d.s.split("_").map(q => q.split(".").map(Number)) : null;
  const ok = sol && sol.length === 7 && sol.every(q => q.length === 6 && q.every(Number.isInteger) && q[0] >= 0 && q[0] < 8 && (q[1] === 0 || q[1] === 1) && q.slice(2).every(v => Math.abs(v) < 40));
  if (!ok || !levelInfo(d.N)) { G.note("That share link didn't work.", 5000); return; }
  const polys = sol.map(([k, f, a, b, c, e], i) => placeX(SET[i], k, f, [a, b, c, e]).map(toXY));
  if (polys.some((p, i) => polys.some((q, j) => j > i && overlapArea(p, q) > 1e-6))) { G.note("That share link didn't work.", 5000); return; }
  begin({sol}, d.N);
  if (typeof d.p === "string") {
    const parts = d.p.split("_").map(q => { const m = q.match(/^([0-7])\.([01])\.(-?\d+(?:\.\d+)?)\.(-?\d+(?:\.\d+)?)$/); return m && {k: +m[1], f: +m[2], x: +m[3], y: +m[4]}; });
    if (parts.length === 7 && parts.every(Boolean)) { game.pcs = parts; game.timed = false; }
  }
  settings.level = d.N; $("levelSel").value = d.N;
  draw(); save(); build.prefetch(d.N);
  if (d.p && fits().every(Boolean)) win();
}

/* ---------- how to play ---------- */
function showHelp() {
  settings.seenHelp = false; helpOnFirstVisit();
  if (!document.querySelector(".spot")) { settings.seenHelp = true; G.helpLater(); }
}
function helpOnFirstVisit() {
  if (settings.seenHelp || !game || !playing() || document.querySelector(".spot")) return;
  // a piece still waiting below, to show moving and turning
  const one = [5, 2, 0, 1, 3, 4, 6].find(i => !fits()[i]) ?? 5;
  const steps = [
    {say: "Build this box from the seven pieces of cardboard 📦", els: [$("box")]},
    {say: "Drag a piece to move it", els: [() => parts[one]]},
    {say: "Tap a piece to turn it. Hold it to turn it back", els: [() => parts[one]]},
    {say: "Flip turns over the last piece you touched. It only matters for the slanted one: see UP printed on it?", els: [$("flipBtn"), () => parts[6]]},
    {say: "Pieces snap into place against the edge of the box and against each other", els: [$("box")]},
    {say: "Fill the whole outline, with no piece sticking out or on top of another, and a cat will come to sit in it 🐈", els: [$("box")], tone: "ok"},
    {say: "Stuck? Hint outlines a piece and the place it goes in gold", els: [$("hintBtn")]},
  ];
  G.spotlight({grid: $("grid"), w: 1, h: 1, steps, done: () => { settings.seenHelp = true; save(); }});
}

for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(levelName(n).replace("Level ", "") + (n === MAX_LEVEL ? " (hardest)" : ""), n));
$("levelSel").onchange = e => { G.closeCard(); startLevel(+e.target.value); };
$("newBtn").onclick = () => { G.closeCard(); newPuzzle(); };
$("helpBtn").onclick = showHelp;

G.nav("iffits");
G.checkClock(game);
G.setupTimer({name: "iffits", game: () => game, playing: g => !g.won, save, label: levelName, noun: "level"});
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : settings.level);

if (!(settings.level >= 1 && settings.level <= MAX_LEVEL)) settings.level = 1;
$("levelSel").value = settings.level;
const shared = G.readShare("iffits");
if (game && Array.isArray(game.sol) && Array.isArray(game.pcs)) G.reopen(() => {
    if (!levelInfo(game.level) || game.sol.length !== 7 || game.pcs.length !== 7) throw new Error("the saved pieces don't fit their level");
    if (!Array.isArray(game.order) || game.order.length !== 7) game.order = [0, 1, 2, 3, 4, 5, 6];
    draw();
    if (game.won) { sitCat(false, () => {}); finishCard(); }
    build.prefetch(settings.level); helpOnFirstVisit();
  }, why => { game = null; newPuzzle().then(() => G.note(why, 0)); });
else if (!shared) newPuzzle().then(helpOnFirstVisit);
const shareOpts = () => ({name: "If It Fits", inProgress: !!(game && !game.won && game.history.length), open: openShared, after: helpOnFirstVisit});
if (shared) G.offerShare(shared, shareOpts());
window.addEventListener("hashchange", () => { const d = G.readShare("iffits"); if (d) G.offerShare(d, shareOpts()); });
</script>
