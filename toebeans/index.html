@media (orientation:landscape) and (max-height:500px){
  /* three columns: the paw, the numbers beside it in two columns of three, then everything else */

  body:not(.full) main > .play.stage .paw{order:-1;flex:none;width:var(--paw)}
  body:not(.full) main > .play.stage .pad .goal{font-size:calc(var(--paw) * .22)}
  body:not(.full) main > .play.stage .beans{flex:1;grid-template-columns:repeat(2,1fr);gap:8px 10px;padding:0}
  body:not(.full) main > .play.stage .num{font-size:clamp(18px,7vh,28px);aspect-ratio:1.25/1}

  body:not(.full) main > .play.stage .toe{font-size:clamp(20px,7vh,34px)}
}

.beans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px;padding:0 4%}
.paw{position:relative;width:100%;aspect-ratio:1/0.86}
.toe,.pad,.num{position:absolute;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;

.pad svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

<script src="../games.js?v=2026-11-01.7"></script>
<script>
/* ---------- puzzles ---------- */
// Each level: [fewest steps the goal needs, lowest goal, highest goal, the big numbers that can be dealt].
// Four small numbers (1 to 9, all different) and two big ones are dealt, and the goal is picked from
// everything they can make that needs exactly that many steps. (A function, so the puzzle worker gets it too.)
function levelInfo(n) { return [null,
  [2, 10, 60, [10, 11, 12, 15, 20]], [2, 20, 99, [10, 11, 12, 15, 20, 25]], [3, 30, 150, [10, 11, 12, 13, 15, 20, 25]],
  [3, 60, 220, [10, 11, 12, 13, 15, 20, 25]], [3, 100, 320, [11, 12, 13, 15, 17, 20, 25]], [4, 100, 400, [11, 12, 13, 15, 17, 20, 25]],
  [4, 150, 550, [11, 12, 13, 15, 17, 19, 20, 25]], [4, 200, 750, [11, 12, 13, 15, 17, 19, 20, 25]],
  [5, 200, 850, [11, 12, 13, 15, 17, 19, 20, 25]], [5, 300, 999, [11, 12, 13, 14, 15, 17, 19, 20, 23, 25]]][n]; }
const MAX_LEVEL = 10;

// a op b, or null when the answer would be zero, negative or a fraction.
function opResult(a, op, b) {
  if (op === "+") return a + b;
  if (op === "-") return a - b > 0 ? a - b : null;
  if (op === "*") return a * b;
  return b !== 0 && a % b === 0 ? a / b : null;
}
// Every value the numbers can make, with the fewest steps each one needs.
function reachable(nums) {
  const best = new Map(), seen = new Map();
  (function walk(arr, steps) {
    const key = arr.slice().sort((x, y) => x - y).join(",");
    if (seen.has(key) && seen.get(key) <= steps) return;
    seen.set(key, steps);
    for (const v of arr) if (!best.has(v) || best.get(v) > steps) best.set(v, steps);
    for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) {
      const a = Math.max(arr[i], arr[j]), b = Math.min(arr[i], arr[j]), rest = arr.filter((_, k) => k !== i && k !== j);
      for (const op of "+-*/") { const r = opResult(a, op, b); if (r !== null && r !== a && r !== b) walk(rest.concat(r), steps + 1); }
    }
  })(nums, 0);
  return best;
}
function makeToeBeans(level) {
  const [steps, lo, hi, bigPool] = levelInfo(level);
  for (let tries = 0; tries < 200; tries++) {
    const small = new Set(); while (small.size < 4) small.add(1 + Math.floor(Math.random() * 9));
    const big = new Set(); while (big.size < 2) big.add(bigPool[Math.floor(Math.random() * bigPool.length)]);
    const nums = [...small, ...big].sort((x, y) => x - y), best = reachable(nums);
    const fits = [...best].filter(([v, s]) => s === steps && v >= lo && v <= hi).map(([v]) => v);
    if (fits.length) return {nums, goal: fits[Math.floor(Math.random() * fits.length)]};
  }
  return null;
}
// One shortest way to make the goal, as steps [a, op, b, answer], to show after a game that missed it.
function oneWay(nums, goal) {
  for (let limit = 1; limit < nums.length; limit++) {
    const failed = new Set();
    const found = (function go(arr, left) {
      if (arr.includes(goal)) return [];
      if (!left) return null;
      const key = arr.slice().sort((x, y) => x - y).join(",");
      if (failed.has(key)) return null;
      for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) {
        const a = Math.max(arr[i], arr[j]), b = Math.min(arr[i], arr[j]), rest = arr.filter((_, k) => k !== i && k !== j);
        for (const op of "+-*/") {
          const r = opResult(a, op, b); if (r === null) continue;
          const more = go(rest.concat(r), left - 1);
          if (more) return [[a, op, b, r], ...more];
        }
      }
      failed.add(key); return null;
    })(nums, limit);
    if (found) return found;
  }
  return null;
}

/* ---------- Reverse mode ---------- */
// The pad starts on a number and comes down to 0. Every step uses up one tile (two tiles combine into one, or the
// pad combines with a tile and the answer goes on the pad), so a way to 0 takes as many steps as tiles it uses.
// For each set of tiles (a bitmask m): V[m], the numbers they can make using every one, and Z[m], the pad numbers
// they can bring to 0 using every one, each remembering how. Numbers above cap are left out.
function revTable(nums, cap) {
  const n = nums.length, V = [], Z = [];
  const bits = m => { let c = 0; for (; m; m &= m - 1) c++; return c; };
  const masks = [...Array(1 << n).keys()].sort((a, b) => bits(a) - bits(b));
  for (const m of masks) {
    const v = new Map(), z = new Map();
    if (!m) { V[m] = v; z.set(0, null); Z[m] = z; continue; }
    if (bits(m) === 1) v.set(nums[Math.log2(m)], null);
    else for (let a = (m - 1) & m; a; a = (a - 1) & m) {
      const b = m ^ a;
      for (const x of V[a].keys()) for (const y of V[b].keys()) for (const op of "+-*/") {
        const r = opResult(x, op, y);
        if (r !== null && r <= cap && !v.has(r)) v.set(r, [a, x, op, b, y]);
      }
    }
    V[m] = v;
    // the pad's first step uses a number u made from a group g of the tiles, landing on R, which the rest bring to 0
    for (let g = m; g; g = (g - 1) & m) for (const R of Z[m ^ g].keys()) for (const u of V[g].keys()) {
      const ways = R === 0 ? [[u, "-", "pad"]] : [[R - u, "+", "pad"], [R + u, "-", "pad"], [u - R, "-", "tile"],
        [R % u ? 0 : R / u, "*", "pad"], [R * u, "/", "pad"], [u % R ? 0 : u / R, "/", "tile"]];
      for (const [Q, op, first] of ways) if (Q > 0 && Q <= cap && !z.has(Q)) z.set(Q, [g, u, op, first, R]);
    }
    Z[m] = z;
  }
  return {V, Z, masks, bits};
}
// Every start number the tiles can bring to 0, with the fewest steps it needs.
function revStarts(nums, cap) {
  const {Z, masks, bits} = revTable(nums, cap), best = new Map();
  for (const m of masks) if (m) for (const Q of Z[m].keys()) if (!best.has(Q)) best.set(Q, bits(m));
  return best;
}
// A Reverse puzzle: numbers dealt as for the usual game, and a start in the level's range needing exactly its steps.
function makeReverse(level) {
  const [steps, lo, hi, bigPool] = levelInfo(level);
  for (let tries = 0; tries < 200; tries++) {
    const small = new Set(); while (small.size < 4) small.add(1 + Math.floor(Math.random() * 9));
    const big = new Set(); while (big.size < 2) big.add(bigPool[Math.floor(Math.random() * bigPool.length)]);
    const nums = [...small, ...big].sort((x, y) => x - y);
    const fits = [...revStarts(nums, 5000)].filter(([v, s]) => s === steps && v >= lo && v <= hi).map(([v]) => v);
    if (fits.length) return {nums, start: fits[Math.floor(Math.random() * fits.length)]};
  }
  return null;
}
// One shortest way to 0 from here, as steps [a, op, b, answer, onPad] in the order they're tapped; [] at 0; null if none.
function revWay(tiles, pad) {
  if (pad === 0) return [];
  const {V, Z, masks} = revTable(tiles, Math.max(5000, pad));
  const m = masks.find(m => m && Z[m].has(pad));
  if (m === undefined) return null;
  const make = (g, u) => { const w = V[g].get(u); if (!w) return []; const [a, x, op, b, y] = w; return [...make(a, x), ...make(b, y), [x, op, y, opResult(x, op, y), false]]; };
  const steps = [];
  for (let left = m, Q = pad; Q !== 0;) {
    const [g, u, op, first, R] = Z[left].get(Q);
    steps.push(...make(g, u), first === "pad" ? [Q, op, u, R, true] : [u, op, Q, R, true]);
    left ^= g; Q = R;
  }
  return steps;
}
// A sum with the pad in it: as opResult, except the pad may come down to exactly 0 (a number take itself).
const padResult = (a, op, b) => op === "-" && a === b ? 0 : opResult(a, op, b);

/* ---------- game ---------- */
const STORE = "catdoku.toebeans.v1";
const $ = G.$;
let state = G.load(STORE);
let settings = Object.assign({level: 1, levelRev: 1}, state.settings);
let game = state.game || null, busy = false, pick = null, op = null, popped = -1;
const build = G.builder([levelInfo, opResult, reachable, makeToeBeans], "makeToeBeans");
const buildRev = G.builder([levelInfo, opResult, revTable, revStarts, makeReverse], "makeReverse");
// Reverse mode keeps its own level; its best times are kept apart under level 100 + N.
const rev = () => !!settings.rev;
const builder = () => rev() ? buildRev : build;
const lvKey = () => rev() ? "levelRev" : "level";
const myLevel = () => settings[lvKey()];
const save = () => G.save(STORE, {settings, game});

const GOLD = ["#E8B422", "#2A2530"];   // a golden paw: the goal hit exactly

const SIGN = {"+": "+", "-": "−", "*": "×", "/": "÷"};
const playing = () => game && !game.won && !game.over && !busy;
const target = () => game.rev ? 0 : game.goal;
function closest() {
  if (game.rev) return game.pad;
  let c = null;
  for (const v of game.beans) if (v !== null && (c === null || Math.abs(v - game.goal) < Math.abs(c - game.goal))) c = v;
  return c;
}

const snap = () => game.rev ? {b: game.beans.slice(), p: game.pad} : game.beans.slice();
function tapBean(i) {
  if (!playing() || game.beans[i] === null) return;
  if (pick === "pad" && op !== null) return padStep(game.pad, op, game.beans[i], i);
  if (pick === null || op === null) pick = pick === i ? null : i;
  else if (pick === i) { pick = null; op = null; }
  else {
    const r = opResult(game.beans[pick], op, game.beans[i]);
    if (r === null) return;
    game.history.push(snap());
    game.beans[i] = r; game.beans[pick] = null; pick = null; op = null; popped = i;
    save();
    if (!game.rev && r === game.goal) return win();
  }
  render();
}
function tapToe(o) { if (!playing() || pick === null) return; op = op === o ? null : o; render(); }
// Reverse mode: tap the pad, a toe bean and a number, or a number, a toe bean and the pad; the answer goes on the pad.
function tapPad() {
  if (!playing() || !game.rev) return;
  if (pick !== null && pick !== "pad" && op !== null) return padStep(game.beans[pick], op, game.pad, pick);
  pick = pick === "pad" ? null : "pad"; op = null; render();
}
function padStep(a, o, b, tile) {
  const r = padResult(a, o, b);
  if (r === null) return;
  game.history.push(snap());
  game.pad = r; game.beans[tile] = null; pick = null; op = null; popped = "pad";
  save();
  if (r === 0) return win();
  render();
}
function undo() {
  if (!playing() || !game.history.length) return;
  const h = game.history.pop();
  if (game.rev) { game.beans = h.b; game.pad = h.p; } else game.beans = h;
  pick = null; op = null; render(); save();
}

// Hint: the first step of a shortest way to the goal from the numbers left: its two numbers and its toe bean glow,
// and the note says the sum (the first time, just the two numbers glow). The player taps it in. If the goal can't
// be made from here, it says to undo. A hint keeps you on this level and costs the gold paw.
const hints = G.hinter({game: () => game, key: () => game ? game.beans.join() + (game.rev ? "|" + game.pad : "") : "", draw: () => render()});   // marks {i, j, op, pad}
function hint() {
  if (!playing()) return;
  if (game.rev) return revHint();
  const left = game.beans.filter(v => v !== null), way = oneWay(left, game.goal);
  if (!way) { G.note(game.history.length ? "The goal can't be made from these numbers. Try Undo." : "Couldn't find a way to the goal.", 5000); return; }
  if (!way.length) return;
  game.hinted = true; save();
  const [a, o, b] = way[0], i = game.beans.indexOf(a), j = game.beans.findIndex((v, k) => v === b && k !== i);
  pick = null; op = null;
  if (!hints.level()) return hints.show({i, j}, `Try ${a} and ${b} together. Ask again for the sign.`);
  hints.show({i, j, op: o}, `Try ${a} ${SIGN[o]} ${b}: tap ${a}, then ${SIGN[o]}, then ${b}.`);
}
// Reverse mode's hint: the first step of a shortest way to 0, with the pad glowing if it's in it.
function revHint() {
  const left = game.beans.filter(v => v !== null), way = revWay(left, game.pad);
  if (!way) { G.note(game.history.length ? "The pad can't get to 0 from here. Try Undo." : "Couldn't find a way to 0.", 5000); return; }
  if (!way.length) return;
  game.hinted = true; save();
  const [a, o, b, , onPad] = way[0];
  let i, j, padFirst = false;
  if (!onPad) { i = game.beans.indexOf(a); j = game.beans.findIndex((v, k) => v === b && k !== i); }
  else if (a === game.pad) { padFirst = true; j = game.beans.indexOf(b); }
  else i = game.beans.indexOf(a);
  pick = null; op = null;
  if (!hints.level()) return hints.show({i, j, pad: onPad}, onPad ? `Try the glowing number with the pad. Ask again for the sign.` : `Try ${a} and ${b} together. Ask again for the sign.`);
  hints.show({i, j, op: o, pad: onPad}, onPad ? (padFirst ? `Try ${a} ${SIGN[o]} ${b}: tap the pad, then ${SIGN[o]}, then ${b}.` : `Try ${a} ${SIGN[o]} ${b}: tap ${a}, then ${SIGN[o]}, then the pad.`)
    : `Try ${a} ${SIGN[o]} ${b}: tap ${a}, then ${SIGN[o]}, then ${b}.`);
}

/* ---------- finishing ---------- */
const levelPick = (current, text) => G.otherSize($("levelSel"), current, startLevel, text || "Or play a different level:");
function win() {
  game.won = true; G.finishClock(game);
  const next = game.hinted ? game.N : Math.min(MAX_LEVEL, game.N + 1);
  settings[lvKey()] = next; $("levelSel").value = next; save(); render();
  G.track(`Toe Beans${game.rev ? " reverse" : ""} solved level ${game.N}`);
  builder().prefetch(next);
  const done = game;   // let the coloured paw show for a moment first
  setTimeout(() => { if (game === done) finishCard(); }, 1200);
}
function finishCard() {
  const next = myLevel(), top = game.N === MAX_LEVEL, did = game.rev ? `${game.start} all the way down to 0.` : `${game.goal} exactly.`;
  const text = game.hinted ? `${did} You had a hint, so here's another at level ${next}.`
    : top ? `${did} That's the hardest level, so the next one is level ${MAX_LEVEL} again.`
    : `${did} Level ${game.N} done; next up is level ${next}.`;
  G.winCard(text, () => { G.closeCard(); startLevel(next); }, "Admire my paw", game.result,
    {title: "Got it!", gold: !game.hinted, goldWhy: "Exactly right, with no hints!", top: top, next: next > game.N ? `Next: level ${next}` : "Next board", after: levelPick(next)});
}

// Close enough: finishing without the goal, once within 10 of it, keeps your level. (The button is greyed out until
// then; further off, a finish would move you back one.)
const nearEnough = d => d <= 10;
function finishHere() {
  if (!playing()) return;
  const c = closest(), d = Math.abs(c - target()), back = Math.max(1, game.N - 1);
  const result = nearEnough(d) ? `That's close enough to stay on level ${game.N}.`
    : game.N === 1 ? "You'll stay on level 1." : `Finishing now moves you back to level ${back}.`;
  G.openCard("Close enough?", game.rev ? `The pad's on ${c}, ${d} away from 0. ${result}` : `Your closest is ${c}, ${d} away from ${game.goal}. ${result}`,
    [["Finish", () => { G.closeCard(); giveUp(); }, true], ["Keep trying", G.closeCard]]);
}
function giveUp() {
  G.breakStreak();   // losing ends the win streak
  const c = closest(), d = Math.abs(c - target());
  game.over = true; game.closest = c;
  settings[lvKey()] = nearEnough(d) ? game.N : Math.max(1, game.N - 1);
  $("levelSel").value = myLevel(); pick = null; op = null;
  save(); render();
  G.track(`Toe Beans${game.rev ? " reverse" : ""} finished level ${game.N} ${d} away`);
  builder().prefetch(myLevel());
  overCard();
}
function overCard() {
  const d = Math.abs(game.closest - target()), next = myLevel();
  const media = document.createElement("div");
  const p = document.createElement("p");
  p.textContent = (game.rev ? `You got the pad down to ${game.closest}. ` : `You got to ${game.closest}, ${d} away from ${game.goal}. `) +
    (next === game.N ? `Next up is another level ${next}.` : `Next up is level ${next}.`);
  media.append(p);
  const way = game.rev ? revWay(game.nums, game.start) : oneWay(game.nums, game.goal);
  if (way) {
    const w = document.createElement("p"); w.className = "way";
    w.textContent = "One way: " + way.map(([a, o, b, r]) => `${a} ${SIGN[o]} ${b} = ${r}`).join(", then ");
    media.append(w);
  }
  G.openCard(nearEnough(d) ? `So close: ${d} away!` : "Not this time", "", [[next > game.N ? `Next: level ${next}` : "Next board", () => { G.closeCard(); startLevel(next); }, true],
    ["Look at my numbers", () => { G.closeCard(); G.note("Tap New puzzle when you're ready for another.", 0); }], G.homeBtn()], media, levelPick(next));
}

/* ---------- new puzzles ---------- */
function startLevel(n) { settings[lvKey()] = n; $("levelSel").value = n; save(); newPuzzle(); }
async function newPuzzle() {
  if (busy) return;
  busy = true;
  const N = myLevel(), r = rev();
  G.openCard("Dealing the numbers…", "", []);
  const p = await builder().take(N);
  game = {N, nums: p.nums, goal: p.goal, beans: p.nums.slice(), history: [], won: false, over: false, ...G.freshClock()};
  if (r) Object.assign(game, {rev: true, level: 100 + N, start: p.start, pad: p.start});
  busy = false; pick = null; op = null;
  G.closeCard(); render(); save(); G.note("");
  G.track(`Toe Beans${r ? " reverse" : ""} new puzzle level ${N}`);
  builder().prefetch(N);
}

/* ---------- drawing ---------- */
// The little paws are the big paw shrunk down: the same toe positions and tilts, and the same pad outline.
function render() {
  if (!game) return;
  const paw = $("paw"), beans = $("beans");
  const [pc, pt] = GOLD;
  for (const el of [paw, beans]) { el.style.setProperty("--pc", pc); el.style.setProperty("--pt", pt); }
  paw.classList.toggle("won", game.won);
  paw.classList.toggle("rev", !!game.rev);
  document.querySelector(".tagline").textContent = game.rev ? "Bring the big pad down to 0" : "Make the number on the big pad";
  $("goal").textContent = game.rev ? game.pad : game.goal;
  $("goalLabel").textContent = game.won ? "Got it!" : game.rev ? "Down to 0" : `Level ${game.N}`;
  const hm = playing() ? hints.current() : null;
  const pad = $("pad");
  if (game.rev) {
    pad.classList.toggle("picked", pick === "pad");
    pad.classList.toggle("dim", pick !== null && pick !== "pad" && op !== null && padResult(game.beans[pick], op, game.pad) === null);
    pad.classList.toggle("hintcell", !!hm && hm.pad);
    pad.classList.toggle("pop", popped === "pad");
    pad.tabIndex = playing() ? 0 : -1;
    pad.setAttribute("aria-label", `The big pad: ${game.pad}`);
    pad.setAttribute("aria-pressed", String(pick === "pad"));
  } else { pad.className = "pad"; pad.tabIndex = -1; pad.removeAttribute("aria-pressed"); }
  document.querySelectorAll(".toe").forEach(t => {
    t.disabled = !playing() || pick === null;
    t.classList.toggle("hintcell", !!hm && t.dataset.op === hm.op);
    t.setAttribute("aria-pressed", String(op === t.dataset.op));
  });
  beans.innerHTML = "";
  game.beans.forEach((v, i) => {
    const b = document.createElement("button");
    b.className = "num";
    b.textContent = v === null ? "" : v;
    if (v === null) { b.classList.add("empty"); b.setAttribute("aria-label", "Used"); b.tabIndex = -1; }
    else {
      if (String(v).length >= 4) b.classList.add("small");
      if (game.won && v === game.goal) b.classList.add("hit");
      if (pick === "pad" && op !== null && padResult(game.pad, op, v) === null) b.classList.add("dim");
      else if (pick !== null && pick !== "pad" && op !== null && i !== pick && opResult(game.beans[pick], op, v) === null) b.classList.add("dim");
    }
    if (i === popped) b.classList.add("pop");
    if (hm && (i === hm.i || i === hm.j)) b.classList.add("hintcell");
    b.setAttribute("aria-pressed", String(i === pick));
    b.onclick = () => tapBean(i);
    beans.append(b);
  });
  popped = -1;
  $("undoBtn").disabled = !playing() || !game.history.length;
  $("finishBtn").disabled = !playing() || !nearEnough(Math.abs(closest() - target())); $("hintBtn").disabled = !playing();
  if (game.won) G.note(game.rev ? "All the way down to 0!" : "Exactly right!", 0);
  else if (game.over) G.note(`Finished ${Math.abs(game.closest - target())} away.`, 0);
  else if (pick !== null && op === null) G.note("Now tap a toe bean", 0);
  else if (op !== null) G.note(game.rev ? (pick === "pad" ? "Now tap a number" : "Now tap another number, or the pad") : "Now tap another number", 0);
  else { const d = Math.abs(closest() - target()); G.note(game.history.length && d <= 10 ? `${d} away` : "", 0); }
}

/* ---------- controls ---------- */
$("pad").onclick = tapPad;
$("pad").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tapPad(); } };
$("revSw").checked = rev();
// Switching mode deals a puzzle in the other mode, at that mode's level.
$("revSw").onchange = e => { if (busy) { e.target.checked = rev(); return; } settings.rev = e.target.checked; $("levelSel").value = myLevel(); save(); G.closeCard(); newPuzzle().then(helpOnFirstVisit); };
for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(n === MAX_LEVEL ? `${n} (hardest)` : String(n), n));
$("levelSel").onchange = e => { G.closeCard(); startLevel(+e.target.value); };
document.querySelectorAll(".toe").forEach(t => t.onclick = () => tapToe(t.dataset.op));
// Keys: the arrows move between the numbers, the toe beans and (in Reverse) the pad, and Space or Enter taps the one
// that's picked out.
const tapTargets = () => [...$("beans").children, ...document.querySelectorAll(".toe"), ...(game && game.rev ? [$("pad")] : [])];
const keys = G.gridKeys({on: () => playing(), start: () => 0,
  move: (i, dx, dy) => { const els = tapTargets(), spots = els.map(el => { if (el.classList.contains("empty")) return null; const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; });
    return spots[i] ? G.nearestThatWay(spots, i, dx, dy) : Math.max(0, spots.findIndex(Boolean)); },
  show: i => { const el = tapTargets()[i]; if (el) el.focus(); },
  act: i => { const el = tapTargets()[i]; if (el && document.activeElement !== el) el.click(); }});   // a focused one handles its own keys
$("newBtn").onclick = newPuzzle;
$("undoBtn").onclick = undo;
$("hintBtn").onclick = hint;
$("finishBtn").onclick = finishHere;
$("helpBtn").onclick = showHelp;
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); } });

/* ---------- how to play ---------- */
// How to play plays the walkthrough on the board (there's no rules card).
function showHelp() {
  const k = game && game.rev ? "seenRevHelp" : "seenHelp";
  settings[k] = false; helpOnFirstVisit();
  if (!document.querySelector(".spot")) { settings[k] = true; G.helpLater(); }
}
// Reverse mode's own walkthrough, the first time it's played: it points at the pad and the tiles and changes nothing.
function revHelp() {
  if (settings.seenRevHelp || !game || !game.rev || !playing() || document.querySelector(".spot")) return;
  const all = () => [...$("beans").children], toes = () => [...document.querySelectorAll(".toe")];
  const steps = [
    {say: "Bring the pad down to 0", els: [$("pad")]},
    {say: "Pad, toe bean, number: answer on the pad", els: [$("pad"), toes, all]},
    {say: "Or number, toe bean, pad", els: [all, $("pad")]},
    {say: "Numbers still combine too", els: [all]},
    {say: "Take the pad from itself for 0", els: [$("pad")]},
    {say: "Stuck? Hint shows a step", els: [$("hintBtn")]},
    {say: "Within 10? Close enough ends it", els: [$("finishBtn")]},
  ];
  G.spotlight({grid: $("beans"), w: 1, h: 1, steps, done: () => { settings.seenRevHelp = true; save(); render(); }});
}
// First visit only: once the first puzzle is dealt, walk through it on the paw. The tiles are redrawn as
// the steps go, so the numbers being used look picked; step 5 shows a real sum in the second tile (just
// while it's up), and everything goes back as it was.
function helpOnFirstVisit() {
  if (game && game.rev) return revHelp();
  if (settings.seenHelp || !game || !playing() || document.querySelector(".spot")) return;
  const tile = i => () => $("beans").children[i], toes = () => [...document.querySelectorAll(".toe")], all = () => [...$("beans").children];
  const [a, b] = [game.beans[0], game.beans[1]], sum = opResult(a, "+", b);
  const set = (p, o) => ({enter: () => { pick = p; op = o; render(); }, leave: () => { pick = op = null; render(); }});
  const turn = G.yourTurn(() => game, g => { game = g; }, () => { pick = op = null; render(); });
  // the paw filled in, as when the goal is hit, just while the last step is up
  const fill = {enter: () => { $("paw").classList.add("won", "gold"); render(); $("paw").classList.add("won"); }, leave: () => { $("paw").classList.remove("gold"); render(); }};
  const steps = [
    {say: "Your goal is on the pad", els: [$("pad")]},
    {say: "Use the numbers and + − × ÷", els: [all, toes]},
    // Your turn: make a sum for real (G.yourTurn puts the numbers back afterwards)
    {say: "Tap this number", els: [tile(0)], try: {done: () => pick === 0}, ...turn.from},
    {say: "Then +", els: [() => document.querySelector('.toe[data-op="+"]')], try: {done: () => op === "+"}, ...turn.from},
    {say: "Then this number", els: [tile(1)], try: {done: () => game.beans[1] === sum && game.beans[0] === null, yes: "They add up there!"}, ...turn.upTo},
    {say: "You needn't use them all", els: [all]},
    {say: "Stuck? Hint shows a step", els: [$("hintBtn")]},
    {say: "Within 10? Close enough ends it", els: [$("finishBtn")]},
    {say: "Exact: gold paw and next level", els: [$("paw")], ...fill},
  ];
  G.spotlight({grid: $("beans"), w: 1, h: 1, steps, done: () => { settings.seenHelp = true; save(); render(); }});
}

G.nav("toebeans");
G.checkClock(game);
G.setupTimer({name: "toebeans", game: () => game, playing: g => !g.won && !g.over, save,
  label: n => n > 100 ? `Reverse level ${n - 100}` : `Level ${n}`, noun: "level", emptyText: "Hit a goal and your times will show up here. They're kept on this device only."});
$("bestBtn").onclick = () => G.showBests("Best times", game ? (game.level ?? game.N) : (rev() ? 100 : 0) + myLevel());

/* ---------- sharing ---------- */
$("linkBtn").onclick = () => { if (game && !busy) G.shareCard({name: "Toe Beans", won: game.won,
  puzzle: () => game.rev ? {g: "toebeans", N: game.N, nums: game.nums, start: game.start, rev: 1} : {g: "toebeans", N: game.N, nums: game.nums, goal: game.goal},
  progress: () => game.rev ? {beans: game.beans, pad: game.pad} : {beans: game.beans}}); };
// A puzzle from a share link, with its numbers so far if they were sent (that isn't timed).
function openShared(d) {
  const ok = a => Array.isArray(a) && a.length === 6 && a.every(v => v === null || (Number.isInteger(v) && v > 0));
  const isRev = !!d.rev;
  if (!ok(d.nums) || d.nums.includes(null) || !Number.isInteger(isRev ? d.start : d.goal) || (isRev && d.start <= 0) || !(d.N >= 1 && d.N <= MAX_LEVEL)) {
    G.note("That share link didn't work. It may have been cut off.", 6000); return;
  }
  if (isRev) {
    const beans = d.p && ok(d.p.beans) ? d.p.beans : d.nums.slice(), pad = d.p && Number.isInteger(d.p.pad) && d.p.pad >= 0 ? d.p.pad : d.start;
    settings.rev = true; $("revSw").checked = true;
    game = {N: d.N, level: 100 + d.N, rev: true, nums: d.nums, start: d.start, pad, beans, history: [], won: pad === 0, over: false, ...G.freshClock()};
    if (d.p) game.timed = false;
    pick = null; op = null; settings.levelRev = d.N; $("levelSel").value = d.N;
    render(); save(); buildRev.prefetch(d.N); return;
  }
  settings.rev = false; $("revSw").checked = false;
  const beans = d.p && ok(d.p.beans) ? d.p.beans : d.nums.slice();
  game = {N: d.N, nums: d.nums, goal: d.goal, beans, history: [], won: beans.includes(d.goal), over: false, ...G.freshClock()};
  if (d.p) game.timed = false;
  pick = null; op = null; settings.level = d.N; $("levelSel").value = d.N;
  render(); save(); build.prefetch(d.N);
}
const shared = G.readShare("toebeans");
if (game && game.nums && !!game.rev !== rev()) game = null;   // a saved puzzle from the other mode
$("levelSel").value = myLevel();
const hadSave = !!(game && game.nums);
if (hadSave) G.reopen(() => {
    render();
    if (game.won) finishCard(); else if (game.over) overCard();
    builder().prefetch(myLevel()); helpOnFirstVisit();
  }, why => { game = null; busy = false; newPuzzle().then(() => G.note(why, 0)); });
else if (!shared) newPuzzle().then(helpOnFirstVisit);
const shareOpts = () => ({name: "Toe Beans", inProgress: !!(game && playing() && game.history.length), open: openShared, after: helpOnFirstVisit});
// a link that doesn't work, opened with no saved puzzle, would leave the board empty: start one
if (shared) G.offerShare(shared, {...shareOpts(), fresh: hadSave ? null : why => Promise.resolve(newPuzzle()).then(() => { G.note(why, 6000); helpOnFirstVisit(); })});
// A share link opened while this page is already showing only changes the address, so watch for it.
window.addEventListener("hashchange", () => { const d = G.readShare("toebeans"); if (d) G.offerShare(d, shareOpts()); });
</script>
