<script>
/* ---------- the pile ---------- */
// The pile is COLS pompoms across and ROWS down. Pieces are one pompom or a pair on a string, dealt from shuffled bags
// of letters like Scrabble tiles (Q comes as QU), with fluffballs as blanks, gold 2L pompoms that count their letter
// twice and brick 2W pompoms that count the whole word twice.
const COLS = 7, ROWS = 10, MAXW = 7;
const VAL = {a: 1, b: 3, c: 3, d: 2, e: 1, f: 4, g: 2, h: 4, i: 1, j: 8, k: 5, l: 1, m: 3, n: 1, o: 1, p: 3, qu: 10, r: 1, s: 1, t: 1, u: 1, v: 4, w: 4, x: 8, y: 4, z: 10, "?": 0};
const BAG = {e: 12, a: 9, i: 8, o: 8, n: 6, r: 6, t: 6, l: 4, s: 6, u: 3, d: 4, g: 3, b: 2, c: 2, m: 2, p: 2, f: 2, h: 2, v: 2, w: 2, y: 2, k: 1, j: 1, x: 1, qu: 1, z: 1, "?": 2};
// Ten levels: the points to reach, how long a pompom takes to fall one row (ms), how often one is 2L (gold) or 2W
// (maple, as it's brick), how often a piece is a pair, whether fluffballs come, and how many rows are already down.
const LV = [null,
  {goal: 40, ms: 900, gold: .08, maple: .03, pairs: .45, fluff: false, pile: 0},
  {goal: 60, ms: 800, gold: .08, maple: .03, pairs: .5, fluff: false, pile: 0},
  {goal: 80, ms: 720, gold: .07, maple: .03, pairs: .5, fluff: true, pile: 0},
  {goal: 100, ms: 650, gold: .07, maple: .03, pairs: .5, fluff: true, pile: 2},
  {goal: 125, ms: 580, gold: .07, maple: .03, pairs: .55, fluff: true, pile: 2},
  {goal: 150, ms: 520, gold: .06, maple: .03, pairs: .55, fluff: true, pile: 3},
  {goal: 175, ms: 460, gold: .06, maple: .03, pairs: .6, fluff: true, pile: 3},
  {goal: 200, ms: 410, gold: .06, maple: .03, pairs: .6, fluff: true, pile: 4},
  {goal: 230, ms: 360, gold: .05, maple: .03, pairs: .6, fluff: true, pile: 4},
  {goal: 260, ms: 320, gold: .05, maple: .03, pairs: .65, fluff: true, pile: 5}];
const MAX_LEVEL = LV.length - 1;
const levelName = n => `Level ${n} · ${LV[n].goal} points` + (LV[n].pile ? `, ${LV[n].pile} rows down` : "");
const mulberry = s => () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

// The pompoms for a seed, in order: {l (letter, "?" a fluffball), k (0 plain, 1 2L, 2 2W)}.
function dealPoms(seed, n, lv) {
  const rnd = mulberry(seed), out = [];
  while (out.length < n) {
    const bag = [];
    for (const [l, c] of Object.entries(BAG)) if (l !== "?" || lv.fluff) for (let i = 0; i < c; i++) bag.push(l);
    for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
    for (const l of bag) { const r = rnd(); out.push({l, k: l === "?" ? 0 : r < lv.gold ? 1 : r < lv.gold + lv.maple ? 2 : 0}); }
  }
  return out.slice(0, n);
}
// Piece i for a seed: one pompom or a pair, the same every time, so Restart and a share link deal the same pile.
const dealt = {};
function pieceOf(seed, level, i) {
  const key = seed + ":" + level;
  let d = dealt[key];
  if (!d) {
    const lv = LV[level], rnd = mulberry(seed ^ 0x51ED), poms = dealPoms(seed, 4000, lv), pieces = [];
    for (let k = 0; pieces.length < 1800;) { const two = rnd() < lv.pairs; pieces.push(two ? [poms[k], poms[k + 1]] : [poms[k]]); k += two ? 2 : 1; }
    d = dealt[key] = pieces;
  }
  return d[i % d.length].map(t => ({...t}));
}
// A piece's cells for its spot and turn: r 0 across (a, b), 1 down (a over b), 2 across (b, a), 3 down (b over a).
function cellsOf(p, x, y, r) {
  if (p.length === 1) return [[x, y, p[0]]];
  const [a, b] = r >= 2 ? [p[1], p[0]] : p;
  return r % 2 ? [[x, y, a], [x, y + 1, b]] : [[x, y, a], [x + 1, y, b]];
}
const fits = (board, cells) => cells.every(([x, y]) => x >= 0 && x < COLS && y < ROWS && (y < 0 || !board[y * COLS + x]));
// Let every pompom fall straight down its column; returns the moves [x, from, to].
function settle(board) {
  const moved = [];
  for (let x = 0; x < COLS; x++) {
    let to = ROWS - 1;
    for (let y = ROWS - 1; y >= 0; y--) { const t = board[y * COLS + x]; if (!t) continue; if (to !== y) { board[to * COLS + x] = t; board[y * COLS + x] = null; moved.push([x, y, to]); } to--; }
  }
  return moved;
}
// Every run of three or more pompoms across (left to right) and down (top to bottom), as lists of cells.
function runs(board) {
  const out = [];
  for (let y = 0; y < ROWS; y++) { let cur = []; for (let x = 0; x <= COLS; x++) { if (x < COLS && board[y * COLS + x]) cur.push(y * COLS + x); else { if (cur.length >= 3) out.push(cur); cur = []; } } }
  for (let x = 0; x < COLS; x++) { let cur = []; for (let y = 0; y <= ROWS; y++) { if (y < ROWS && board[y * COLS + x]) cur.push(y * COLS + x); else { if (cur.length >= 3) out.push(cur); cur = []; } } }
  return out;
}
// Whether the pompoms spell a word, a fluffball standing for any letter; returns the word or null.
function spells(tiles, dict) {
  if (!tiles.some(t => t.l === "?")) { const w = tiles.map(t => t.l).join(""); return dict.has(w) ? w : null; }
  if (tiles.filter(t => t.l === "?").length > 2) return null;
  const go = (i, acc) => {
    if (i === tiles.length) return dict.has(acc) ? acc : null;
    if (tiles[i].l !== "?") return go(i + 1, acc + tiles[i].l);
    for (const c of "eariotnslcudpmhgbfywkvxzjq") { const r = go(i + 1, acc + c); if (r) return r; }
    return null;
  };
  return go(0, "");
}
// A word's points, Scrabble style: its letters (a 2L pompom's twice), doubled for each 2W pompom, times
// (length - 2), so a longer word is worth much more.
function wordScore(tiles) {
  let s = 0, m = 1;
  for (const t of tiles) { s += VAL[t.l] * (t.k === 1 ? 2 : 1); if (t.k === 2) m *= 2; }
  return s * m * Math.max(1, tiles.length - 2);
}
// The words on the board: in each run, the set of words that don't overlap worth the most points.
// A pompom can be in a word across and a word down at once, and counts in both.
function findWords(board, dict) {
  const found = [];
  for (const run of runs(board)) {
    const n = run.length, best = Array(n + 1).fill(null); best[n] = {pts: 0, words: []};
    for (let i = n - 1; i >= 0; i--) {
      let b = best[i + 1];
      for (let j = i + 3; j <= Math.min(n, i + MAXW); j++) {
        const tiles = run.slice(i, j).map(c => board[c]), w = spells(tiles, dict);
        if (!w) continue;
        const pts = wordScore(tiles), cand = {pts: pts + best[j].pts, words: [{cells: run.slice(i, j), word: w, pts}, ...best[j].words]};
        if (cand.pts > b.pts) b = cand;
      }
      best[i] = b;
    }
    found.push(...best[0].words);
  }
  return found;
}
// The pompoms already down at the start of a level: rows of them, a few gaps, and no words among them.
function startPile(seed, level, dict) {
  const lv = LV[level], board = Array(COLS * ROWS).fill(null);
  if (!lv.pile) return board;
  const rnd = mulberry(seed ^ 0xBEEF);
  for (let tries = 0; tries < 400; tries++) {
    board.fill(null);
    const poms = dealPoms((seed ^ 0xC0FFEE) + tries, COLS * lv.pile, {...lv, fluff: false});
    let k = 0;
    for (let y = ROWS - lv.pile; y < ROWS; y++) for (let x = 0; x < COLS; x++) { const t = poms[k++]; if (rnd() > .18) board[y * COLS + x] = {...t, k: 0}; }
    settle(board);
    if (!findWords(board, dict).length) return board;
  }
  return Array(COLS * ROWS).fill(null);
}

<script>
/* ---------- words ---------- */
// The shared word list's familiar and common words, three to seven letters, less a few nobody wants to see
// spelled out by chance.
const NOT = new Set("cock fags hos hoes prick rapes rapist semen boobs penis vagina scrotum slag pimp retards spastic gyp gypsy redskin squaw bimbo hooker horny nude nudes orgasm sperm erotic bitchy pussy bastard incest molest".split(" "));
let DICT = null;
const wordsReady = (async () => {
  const w = window.WORDS_INLINE || await fetch(`../words/words.json?v=${window.SITE_BUILD || ""}`).then(r => { if (!r.ok) throw new Error("couldn't load the word list"); return r.json(); });
  DICT = new Set([w.familiar, w.common].join(" ").split(" ").filter(x => /^[a-z]{3,7}$/.test(x) && !NOT.has(x)));
})();

/* ---------- pictures ---------- */
const catSrc = f => (window.CAT_SRC && window.CAT_SRC[f]) || `../cats/${f}.webp`;
const picCache = {};
const pic = src => picCache[src] || (picCache[src] = Object.assign(new Image(), {src}));
const GOLD = "#ECA818", MAPLE = "#BD5538", INK = "#2A2530";
const W = COLS * 50, H = ROWS * 50, CELL = 50;
// Pompoms, as in Spelling String: its pompom photo tinted to one of the site's colours (the photo's light times the
// colour), plain letters in pacific blue, plum, sage, lime, lavender and periwinkle, a 2L pompom gold and a 2W pompom
// brick; the blank is Wind Up's grey fluffball with googly eyes.
const POM_SRC = window.POM_SRC || "../fuzzyspelling/pompom.webp", EYE_SRC = window.EYE_SRC || "../fuzzyspelling/eye.webp";
const POM_PLAIN = ["#73A7AE", "#B94588", "#6AA673", "#B3B94B", "#8D78AD", "#7885BA"];
const tints = {};
function tinted(hex) {
  if (tints[hex]) return tints[hex];
  const im = pic(POM_SRC); if (!(im.complete && im.naturalWidth)) return null;
  const c = document.createElement("canvas"); c.width = c.height = 160; const x = c.getContext("2d"); x.drawImage(im, 0, 0, 160, 160);
  if (hex) {
    const d = x.getImageData(0, 0, 160, 160), m = [1, 3, 5].map(i => Math.min(1, parseInt(hex.slice(i, i + 2), 16) / 255 * 1.22));
    for (let i = 0; i < d.data.length; i += 4) for (let k = 0; k < 3; k++) d.data[i + k] *= m[k];
    x.putImageData(d, 0, 0);
  }
  return tints[hex] = c;
}
// One pompom at x, y (its middle), s across, turned its own way.
function drawPom(c, t, x, y, s, alpha = 1, glow = false) {
  c.save(); c.globalAlpha = alpha; c.translate(x, y);
  if (glow) { c.beginPath(); c.roundRect(-s * .5, -s * .5, s, s, s * .2); c.fillStyle = "rgba(236,168,24,.45)"; c.fill(); }
  const blank = t.l === "?", im = tinted(blank ? "" : t.k === 1 ? GOLD : t.k === 2 ? MAPLE : POM_PLAIN[(t.id || 0) % POM_PLAIN.length]);
  if (im) { c.save(); c.rotate(((t.id || 0) * 47 % 360) * Math.PI / 180 + (t.spin || 0)); c.drawImage(im, -s * .56, -s * .56, s * 1.12, s * 1.12); c.restore(); }
  if (blank) {
    const eye = pic(EYE_SRC);
    if (eye.complete && eye.naturalWidth) for (const dx of [-1, 1]) { c.save(); c.translate(dx * s * .18, -s * .04); c.rotate(((t.id || 0) * 97 + dx * 13) % 360 * Math.PI / 180); c.drawImage(eye, -s * .15, -s * .15, s * .3, s * .3); c.restore(); }
  } else {
    const L = t.l === "qu" ? "Qu" : t.l.toUpperCase();
    c.font = `800 ${s * (t.l === "qu" ? .46 : .54)}px "Baloo 2", sans-serif`; c.textAlign = "center"; c.textBaseline = "middle";
    c.lineJoin = "round"; c.lineWidth = s * .08; c.strokeStyle = "rgba(255,255,255,.55)"; c.strokeText(L, 0, s * .04);
    c.fillStyle = INK; c.fillText(L, 0, s * .04);
    c.font = `800 ${s * .22}px "Baloo 2", sans-serif`; c.lineWidth = s * .06; c.strokeText(VAL[t.l], s * .3, s * .32); c.fillText(VAL[t.l], s * .3, s * .32);
    if (t.k) {
      c.font = `800 ${s * .2}px "Baloo 2", sans-serif`; c.lineWidth = s * .04; c.strokeStyle = INK;
      c.beginPath(); c.roundRect(-s * .5, -s * .5, s * .36, s * .24, s * .08); c.fillStyle = "#fff"; c.fill(); c.stroke();
      c.fillStyle = INK; c.fillText(t.k === 1 ? "2L" : "2W", -s * .32, -s * .37);
    }
  }
  c.restore();
}
/* ---------- game ---------- */
// game: {level, seed, i (pieces dealt), board [COLS*ROWS of {l, k, id, oy} or null], piece {p, x, y, r} or null,
//        score, words [[word, pts]], chain, phase ("fall" | "settle" | "pounce"), state ("ready" | "running" | "paused" | "lost" | "won")}
const STORE = "catdoku.lmnopom.v1";
const $ = G.$;
let state = G.load(STORE);
let settings = Object.assign({level: 1, tries: {}}, state.settings);
let game = null, nextId = 1;
const cv = $("cv"), ctx = cv.getContext("2d");
const tile = t => ({l: t.l, k: t.k, id: nextId++, oy: 0});
const save = () => G.save(STORE, {settings, game: game && ["ready", "running", "paused"].includes(game.state) ? {
  level: game.level, seed: game.seed, i: game.i, score: game.score, words: game.words, ms: game.ms, started: game.started, timed: game.timed, swatted: !!game.swatted,
  board: game.board.map(t => t ? t.l + t.k : ""), piece: game.piece && {x: game.piece.x, y: game.piece.y, r: game.piece.r}} : null});

function newGame(n, seed) {
  closeCard();
  seed = seed || (Math.random() * 2 ** 31) | 0;
  game = {level: n, seed, i: 0, board: startPile(seed, n, DICT).map(t => t && tile(t)), piece: null, score: 0, words: [], chain: 0,
    phase: "fall", fallT: 0, lockT: 0, t: 0, fx: [], state: "ready", ...G.freshClock()};
  spawn();
  $("tapgo").hidden = false; $("tapgo").textContent = "Tap to start";
  status(); paintNext(); listWords(); save();
}
const closeCard = () => G.closeCard();
function spawn() {
  const g = game, p = pieceOf(g.seed, g.level, g.i).map(tile);
  g.piece = {p, x: 3, y: 0, r: 0};
  if (!fits(g.board, cellsOf(p, 3, 0, 0))) { g.piece = null; return false; }
  g.fallT = 0; g.lockT = 0;
  return true;
}
function status() {
  const g = game;
  $("score").textContent = `${g.score} / ${LV[g.level].goal} points`;

  }, msg => { newGame(settings.level); G.note(msg, 5000); });
  window.addEventListener("hashchange", () => { const d = G.readShare("lmnopom"); if (d) G.offerShare(d, {name: "L-M-N-O-Pom", inProgress: !!(game && game.started && !["won", "lost"].includes(game.state)), open: d => { try { openShared(d); } catch (e) { G.note("That share link didn't work.", 5000); } }}); });
  requestAnimationFrame(frame);
  setTimeout(helpOnFirstVisit, 300);
}).catch(() => G.note("The word list wouldn't load. Check the connection and reload.", 0));
</script>
