    v = v.trim(); var tried = null;
    try { tried = sessionStorage.getItem("catdoku.reloadedFor"); } catch (e) {}

<style>
/* The drawer, seen from above: a wooden frame (brick, shaded with ink) round a pale wooden inside, with the junk
   everyone keeps (batteries, rubber bands, paper clips, a key, a pen, coins…) lying about, and a set of chunky plastic
   alphabet magnets among it, like Fridge Magnets' letters. Only the magnets matter. Dottie peeks over the back edge; a
   magnet no word still needs fades, and once every word is found Dottie curls up among the junk. */
.drawerwrap{height:auto;--side:min(var(--board),calc(var(--tall) * .84));--aspect:1.16}
.drawerbox{position:relative;width:var(--side);margin:0 auto;padding-top:calc(var(--side) * .15)}
.dottie{position:absolute;top:0;left:50%;transform:translateX(-50%);height:calc(var(--side) * .2);width:auto;pointer-events:none;z-index:0}
.drawer{position:relative;z-index:1;width:var(--side);aspect-ratio:1;max-width:100%;border-radius:14px;padding:calc(var(--side) * .035);
  background:linear-gradient(180deg,color-mix(in srgb,#BD5538 70%,#2A2530),color-mix(in srgb,#BD5538 55%,#2A2530));
  box-shadow:inset 0 0 0 3px #2A2530,inset 0 6px 0 3px color-mix(in srgb,#BD5538 82%,#fff);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.inside{position:relative;width:100%;height:100%;border-radius:6px;overflow:hidden;
  background:repeating-linear-gradient(90deg,transparent 0 37px,rgba(189,85,56,.07) 37px 39px,transparent 39px 61px,rgba(189,85,56,.05) 61px 62px),
    color-mix(in srgb,#ECA818 22%,#fff);box-shadow:inset 0 5px 12px rgba(42,37,48,.35)}
.junk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.junk[hidden]{display:none}
.mags{position:absolute;inset:0;display:grid;padding:2%;z-index:3}
.mag{position:relative;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
/* a magnet: Fridge Magnets' own (.fmag, in games.css), in a colour of its own, at its letter's tilt; picked ones turn gold and lift */
.mag .ch{display:block;font-size:var(--fs);line-height:1;color:var(--c);transform:translate(var(--dx),var(--dy)) rotate(var(--r));transition:transform .15s,color .15s}
.mag.on .ch{color:#ECA818;transform:translate(var(--dx),calc(var(--dy) - 6%)) rotate(0deg) scale(1.15);filter:drop-shadow(2.5px 5px 0 rgba(42,37,48,.3))}
.mag.out{opacity:.3}
.mag.hintcell,.mag.kbcursor{border-radius:30%}
.won .mag{opacity:0}
.chain{position:absolute;inset:0;pointer-events:none;z-index:2}
.chain polyline{fill:none;stroke:#ECA818;stroke-linecap:round;stroke-linejoin:round;opacity:.45}
.chain.miss polyline{stroke:#BD5538}
.chain.bonus polyline{stroke:#73A7AE}
.curled{position:absolute;left:50%;top:50%;width:70%;height:auto;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:opacity .8s .3s,transform .8s .3s;pointer-events:none;z-index:4}
.won .curled{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* the word being spelled, and the words to find, by length */
.spell{min-height:calc(34px*var(--ts));font-weight:800;font-size:calc(24px*var(--ts));letter-spacing:.12em;text-align:center;line-height:1.3}
.spell.miss{color:var(--bad-text)}
.said{min-height:calc(22px*var(--ts));font-size:calc(16px*var(--ts));font-weight:600;text-align:center;color:var(--ink-soft);line-height:1.35}
.said.good{color:var(--ink)}
.listbox{width:var(--board);display:flex;flex-direction:column;gap:6px}
.countrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 14px}
.count{font-weight:800;font-size:calc(16px*var(--ts))}
.lens{display:flex;flex-direction:column;gap:4px}
.lenrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 6px}
.lenrow b{font-size:calc(14px*var(--ts));color:var(--ink-soft);min-width:5.4em}
.lenrow span{font-weight:700;font-size:calc(15px*var(--ts));letter-spacing:.08em;padding:0 7px;border-radius:999px;border:2px solid var(--line);background:var(--panel);color:var(--ink-soft)}
.lenrow span.found{color:var(--ink);border-color:#73A7AE;background:color-mix(in srgb,#73A7AE 22%,var(--panel))}
.lenrow span.new{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.18)}}
.bonus{font-size:calc(14px*var(--ts));color:var(--ink-soft);text-align:center}
@media (orientation:landscape) and (max-height:500px){
  .lenrow span{font-size:calc(13px*var(--ts))}
}
.card img.dottiepic{display:block;width:80%;max-width:260px;height:auto;margin:0 auto 14px}
</style>

<body>
<main>
  <header><h1>Junk Drawer</h1><div class="stripe"></div><p class="tagline">Connect the fridge magnets in Dottie's junk drawer to spell words</p></header>
  <nav class="games" id="games" aria-label="Games"></nav>

  <div class="status"><span class="msg" id="msg" aria-live="polite"></span></div>

  <div class="wrap drawerwrap stage"><div class="drawerbox">
    <img class="dottie" id="dottie" src="../cats/dottie-face-2.webp" alt="Dottie, a black cat, peeking over the back of the drawer">
    <div class="drawer" id="board" role="grid" aria-label="The junk drawer"><div class="inside">
      <svg class="junk" id="junk" viewBox="0 0 100 100" aria-hidden="true"></svg>
      <div class="mags" id="mags"></div>
      <svg class="chain" id="chain" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points=""/></svg>
      <img class="curled" id="curled" src="../cats/dottie-21.webp" alt="">
    </div></div>
  </div></div>
  <div class="spell" id="spell"></div>
  <div class="said" id="said" aria-live="polite"></div>
  <div class="listbox">
    <div class="countrow"><span class="count" id="count"></span><button class="timer" id="timer" hidden></button></div>
    <div class="lens" id="lens" aria-label="Words to find"></div>
    <div class="bonus" id="bonus"></div>
  </div>
  <div class="overlay" id="overlay"><div class="card" id="card"></div></div>

  <div class="actions">
    <button id="hintBtn">Hint</button>
    <button id="restartBtn">Restart</button>
    <button id="leftBtn" data-icon="peek">Words left</button>
    <button id="linkBtn">Share</button>
    <button id="bestBtn">Best times</button>
    <button id="helpBtn">How to play</button>
  </div>
  <div class="bar">
    <label>Level <select id="levelSel" aria-label="Level"></select></label>
    <button id="newBtn" class="primary">New drawer</button>
  </div>
</main>

<script src="../games.js?v=2026-11-08.7"></script>
<script>
/* ---------- levels ---------- */
// [drawer size, shortest word, longest word to find, fewest words, most words]. Every magnet is in at least one word.
const LEVELS = [null, [4, 4, 6, 8, 14], [4, 4, 8, 15, 24], [5, 4, 7, 20, 32], [5, 4, 9, 30, 45], [6, 5, 9, 25, 40]];
const MAX_LEVEL = LEVELS.length - 1;
const levelName = n => { const [N, min] = LEVELS[n]; return `Level ${n} · ${N} × ${N}, ${min}+ letters`; };
// a little random-number maker seeded by a string, so a drawer's look comes back the same
function rng(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => { h = Math.imul(h ^ (h >>> 15), 2246822507) + 0x9E3779B9 | 0; return ((h >>> 0) % 100000) / 100000; }; }
// the magnets' colours, from the site's palette: all but gold (a picked magnet turns gold) and lime (too pale on the wood)
const COLOURS = ["#BD5538", "#E16A4A", "#73A7AE", "#6AA673", "#B94588", "#7885BA", "#4E577D", "#8D78AD"];
/* ---------- the junk ---------- */
// Things lying in the drawer, seen from above, each drawn in a 20 × 20 box round its centre. They're only for show.
const INK = 'stroke="#2A2530" stroke-width=".7"';
const JUNK = [
  // a battery
  `<rect x="-8" y="-3" width="15" height="6" rx="1" fill="#ECA818" ${INK}/><rect x="-8" y="-3" width="6" height="6" rx="1" fill="#2A2530"/><rect x="7" y="-1.4" width="1.6" height="2.8" fill="#BFC3C9" ${INK}/>`,
  // a rubber band
  `<ellipse cx="0" cy="0" rx="8" ry="5" fill="none" stroke="#E16A4A" stroke-width="1.3"/>`,
  // a paper clip
  `<path d="M-7 2 L5 2 A2.4 2.4 0 0 0 5 -2.8 L-6 -2.8 A1.6 1.6 0 0 0 -6 0.4 L4 0.4" fill="none" stroke="#7885BA" stroke-width=".9" stroke-linecap="round"/>`,
  // a key
  `<circle cx="-5" cy="0" r="3.6" fill="#ECA818" ${INK}/><circle cx="-5" cy="0" r="1.2" fill="color-mix(in srgb,#ECA818 22%,#fff)"/><path d="M-1.6 -1 L8 -1 L8 1 L6.5 1 L6.5 2.6 L5 2.6 L5 1 L3.5 1 L3.5 2.2 L2 2.2 L2 1 L-1.6 1 Z" fill="#ECA818" ${INK}/>`,
  // a pen, twice as long as the key
  `<rect x="-17" y="-1.5" width="29" height="3" rx="1.2" fill="#4E577D" ${INK}/><path d="M12 -1.5 L17 0 L12 1.5 Z" fill="#F7F8F3" ${INK}/><rect x="-13" y="-2.3" width="8" height="1.3" fill="#4E577D" ${INK}/>`,
  // a coin
  `<circle cx="0" cy="0" r="3.4" fill="color-mix(in srgb,#ECA818 70%,#fff)" ${INK}/><circle cx="0" cy="0" r="2.2" fill="none" stroke="color-mix(in srgb,#ECA818 70%,#2A2530)" stroke-width=".4"/>`,
  // a birthday candle
  `<rect x="-6" y="-1" width="11" height="2" fill="#F7F8F3" ${INK}/><path d="M-4 -1 L-2 1 M-1 -1 L1 1 M2 -1 L4 1" stroke="#B94588" stroke-width=".8"/><path d="M5 0 L7 0" stroke="#2A2530" stroke-width=".5"/>`,
  // a twist tie
  `<path d="M-8 1 Q-4 -2 0 0 T8 -1" fill="none" stroke="#6AA673" stroke-width="1.1" stroke-linecap="round"/>`,
  // a sticky note
  `<rect x="-4.5" y="-4.5" width="9" height="9" fill="color-mix(in srgb,#ECA818 55%,#fff)" ${INK}/><path d="M-3 -2 H3 M-3 0 H2 M-3 2 H1" stroke="#7885BA" stroke-width=".4"/>`,
  // a spare button
  `<circle cx="0" cy="0" r="2.8" fill="#73A7AE" ${INK}/><g fill="#2A2530"><circle cx="-.8" cy="-.8" r=".4"/><circle cx=".8" cy="-.8" r=".4"/><circle cx="-.8" cy=".8" r=".4"/><circle cx=".8" cy=".8" r=".4"/></g>`,
];
// The junk for a drawer: a few things in the gaps between magnets, and a few half under the frame round the edge.
function junkFor(grid, N) {
  const r = rng(grid), out = [], n = N + 3, s = 96 / N;
  for (let k = 0; k < n; k++) {
    const art = JUNK[Math.floor(r() * JUNK.length)];
    const edge = k < 3, gx = 1 + Math.floor(r() * (N - 1)), gy = 1 + Math.floor(r() * (N - 1));
    const x = edge ? r() * 100 : 2 + gx * s + (r() - .5) * s * .3, y = edge ? (k % 2 ? 1 : 99) : 2 + gy * s + (r() - .5) * s * .3;
    out.push(`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${Math.round(r() * 360)}) scale(${(s / 22).toFixed(2)})">${art}</g>`);
  }
  return out.join("");
}
const CAT_SRC = {};  // filled with embedded pictures when the page is bundled into one file
const catSrc = f => CAT_SRC[f] || `../cats/${f}.webp`;

/* ---------- making a drawer ---------- */
// Every word in the familiar list that can be spelled by a chain of neighbouring magnets (any of eight ways, each magnet
// once) is one to find; other words in the bigger lists count as bonus words. A drawer starts as letters drawn by
// how often they're used in English, then one magnet at a time is changed while it doesn't get worse, until the
// number of words is in the level's range and every magnet is in one.
function makeTrie(words) {
  const root = {};
  for (const w of words) { let t = root; for (const c of w) t = t[c] || (t[c] = {}); t.$ = w; }
  return root;
}
// every word the trie holds in the grid, with every path for each (up to `cap` of them)
function solve(grid, N, trie, min, cap) {
  const out = new Map(), used = new Array(N * N).fill(false);
  const go = (i, t, path) => {
    const u = t[grid[i]]; if (!u) return;
    used[i] = true; path.push(i);
    if (u.$ && u.$.length >= min) { const ps = out.get(u.$) || []; if (ps.length < cap) ps.push(path.slice()); out.set(u.$, ps); }
    const x = i % N, y = (i / N) | 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = x + dx, yy = y + dy;
      if ((dx || dy) && xx >= 0 && yy >= 0 && xx < N && yy < N && !used[yy * N + xx]) go(yy * N + xx, u, path);
    }
    used[i] = false; path.pop();
  };
  for (let i = 0; i < N * N; i++) go(i, trie, []);
  return out;
}
function junkDrawer(n, words) {
  const [N, min, max, lo, hi] = LEVELS[n];
  const FREQ = "EEEEEEEEEEEEAAAAAAAAAIIIIIIIIOOOOOOOONNNNNNRRRRRRTTTTTTLLLLSSSSUUUUDDDDGGGBBCCMMPPFFHHVWWYKJXZ";
  const T = trieFor(words, min, max);
  const score = g => {
    const s = solve(g, N, T, min, 1), cover = new Set([...s.values()].flat(2)).size, k = s.size;
    return {s, bad: (k < lo ? lo - k : k > hi ? k - hi : 0) * 2 + (N * N - cover) * 3};
  };
  let g = Array.from({length: N * N}, () => FREQ[Math.random() * FREQ.length | 0]), best = score(g);
  for (let step = 0; step < 3000 && best.bad > 0; step++) {
    const h = g.slice(); h[Math.random() * N * N | 0] = FREQ[Math.random() * FREQ.length | 0];
    const r = score(h); if (r.bad <= best.bad) { g = h; best = r; }
  }
  return best.bad > 0 ? null : g.join("");
}
const TRIES = {};
function trieFor(words, min, max) { const k = min + "," + max; return TRIES[k] || (TRIES[k] = makeTrie(words.filter(w => w.length >= min && w.length <= max))); }
// the words to find in a drawer, shortest first, each with its paths
function wordsIn(n, grid) {
  const [N, min, max] = LEVELS[n], s = solve(grid, N, trieFor(FAMILIAR, min, max), min, 24);
  return [...s.keys()].sort((a, b) => a.length - b.length || (a < b ? -1 : 1)).map(w => ({w, paths: s.get(w)}));
}

/* ---------- words ---------- */
let FAMILIAR = null, KNOWN = null;
function loadWords() {
  if (FAMILIAR) return Promise.resolve();
  const got = window.WORDS_INLINE ? Promise.resolve(window.WORDS_INLINE) : fetch(`../words/words.json?v=${window.SITE_BUILD || ""}`).then(r => { if (!r.ok) throw new Error("couldn't load the word list"); return r.json(); });
  return got.then(w => {
    const up = s => s.split(" ").map(x => x.toUpperCase()).filter(x => /^[A-Z]{3,12}$/.test(x));
    FAMILIAR = up(w.familiar); KNOWN = new Set(FAMILIAR.concat(up(w.common)));
  });
}

/* ---------- game ---------- */
// game: {level, N, grid, found (words found, in order), bonus (bonus words found), hinted, restarted, won}
// The words to find are worked out again from the grid (`list`), so a save or a share link only needs the letters.
const STORE = "catdoku.junkdrawer.v1";
const $ = G.$;
let state = G.load(STORE);
// autoNotes: the Dim used-up magnets switch (once called Auto Notes, the name kept so saved settings carry over), off
// at first, fades the magnets no word left to find still uses
let settings = Object.assign({level: 1, autoNotes: false, junk: true}, state.settings);
let game = state.game || null, list = [], making = 0;
// The gold paw's gone for this puzzle once any of these is true, and the tools that cost it lose their red (games.js).
G.pawLost(() => !game || game.won || game.hinted || game.restarted);
let chain = [], typed = "", flash = null;   // the magnets picked; letters typed; a word just tried {cells, kind}
const hints = G.hinter({game: () => game, key: () => game ? game.found.join() : "", draw: () => draw()});   // marks {cells}
const save = () => G.save(STORE, {settings, game: real ? real.game : game});
const playing = () => game && !game.won && !$("overlay").classList.contains("show");
const foundSet = () => new Set(game.found);
const left = () => { const f = foundSet(); return list.filter(o => !f.has(o.w)); };

function deal(n, grid) { return {level: n, N: LEVELS[n][0], grid, found: [], bonus: [], hinted: false, restarted: false, won: false, ...G.freshClock()}; }
async function newPuzzle() {
  G.closeCard(); hints.clear(false); chain = []; typed = ""; flash = null;
  const ticket = ++making, n = settings.level;
  try { await loadWords(); } catch (e) { G.note(`Couldn't open the drawer: ${e.message}.`, 0); return; }
  if (ticket !== making) return;
  let grid = null; for (let k = 0; k < 20 && !grid; k++) grid = junkDrawer(n, FAMILIAR);
  if (!grid) { G.note("Couldn't fill that drawer. Try New drawer.", 5000); return; }
  game = deal(n, grid); list = wordsIn(n, grid); draw(); save();
  G.track(`Junk Drawer new puzzle level ${game.level}`);
}
function startLevel(n) { settings.level = n; $("levelSel").value = n; newPuzzle(); }

/* ---------- drawing ---------- */
const centre = i => { const N = game.N; return [(i % N + .5) / N * 96 + 2, (Math.floor(i / N) + .5) / N * 96 + 2]; };
// magnets still in the drawer: those on a path of a word still to find
function inDrawer() { const s = new Set(); for (const o of left()) for (const p of o.paths) p.forEach(i => s.add(i)); return s; }
function draw() {
  if (!game) return;
  queueMicrotask(say);
  const {N, grid} = game, mags = $("mags"), hm = hints.current(), keep = inDrawer();
  if (mags.children.length !== N * N || mags.dataset.grid !== grid) {
    mags.innerHTML = ""; mags.dataset.grid = grid; mags.style.gridTemplateColumns = `repeat(${N}, 1fr)`; mags.style.gridTemplateRows = `repeat(${N}, 1fr)`;
    for (let i = 0; i < N * N; i++) {
      const d = document.createElement("div"); d.className = "mag"; d.dataset.i = i; d.setAttribute("role", "gridcell");
      // each magnet lies at its letter's tilt (as in Fridge Magnets), a little off-centre, in one of the magnet colours,
      // the same every time
      const r = rng(grid + i);
      d.style.setProperty("--c", COLOURS[Math.floor(r() * COLOURS.length)]); d.style.setProperty("--r", `${G.MAGNET.tilt(grid[i])}deg`);
      d.style.setProperty("--dx", `${Math.round((r() - .5) * 16)}%`); d.style.setProperty("--dy", `${Math.round((r() - .5) * 12)}%`);
      d.innerHTML = `<span class="ch fmag"></span>`; mags.append(d);
    }
    $("junk").innerHTML = junkFor(grid, N);
  }
  $("board").style.setProperty("--fs", `${Math.max(16, $("board").clientWidth / N * .6)}px`);
  const lit = flash ? flash.cells : chain;
  [...mags.children].forEach((d, i) => {
    d.lastChild.textContent = grid[i];
    d.classList.toggle("on", lit.includes(i));
    d.classList.toggle("out", settings.autoNotes && !keep.has(i) && !game.won);
    d.classList.toggle("hintcell", !!(hm && hm.cells.includes(i)));
    d.setAttribute("aria-label", `${grid[i]}, row ${Math.floor(i / N) + 1}, column ${i % N + 1}${lit.includes(i) ? ", picked" : ""}${!settings.autoNotes || keep.has(i) ? "" : ", used up"}`);
  });
  $("board").classList.toggle("won", !!game.won);
  const svg = $("chain"), pl = svg.firstElementChild;
  pl.setAttribute("points", lit.map(centre).map(p => p.join(",")).join(" "));
  pl.setAttribute("stroke-width", 22 / N);
  svg.classList.toggle("miss", !!(flash && flash.kind === "miss")); svg.classList.toggle("bonus", !!(flash && flash.kind === "bonus"));
  const sp = $("spell"); sp.textContent = flash ? flash.word : lit.map(i => grid[i]).join(""); sp.classList.toggle("miss", !!(flash && flash.kind === "miss"));
  // the words, by length: found ones spelled out, the rest as blanks
  // the words found, by length; after Words left, the ones still to find show as blanks among them
  const f = foundSet(), el = $("lens"), shown = list.filter(o => game.showLeft || f.has(o.w)), lens = [...new Set(shown.map(o => o.w.length))];
  const html = lens.map(L => `<div class="lenrow"><b>${L} letters</b>${shown.filter(o => o.w.length === L).map(o => f.has(o.w) ? `<span class="found${o.w === game.found[game.found.length - 1] && flash ? " new" : ""}">${o.w}</span>` : `<span aria-label="${L} letters, not found yet">${"_".repeat(L).split("").join(" ")}</span>`).join("")}</div>`).join("");
  if (el.innerHTML !== html) el.innerHTML = html;
  $("bonus").textContent = game.bonus.length ? `Bonus words: ${game.bonus.join(", ")}` : "";
  $("count").textContent = game.won ? "All found!" : `${game.found.length} of ${list.length} words`;
  $("hintBtn").disabled = game.won;
  $("leftBtn").hidden = !!(game.showLeft || game.won);
  $("restartBtn").disabled = game.won || (!game.found.length && !game.bonus.length);
}
function say() {
  if (!game) return;
  const N = game.N, rows = [...Array(N).keys()].map(y => `Row ${y + 1}: ${game.grid.slice(y * N, y * N + N).split("").join(" ")}`);
  G.describe($("board"), `Junk drawer, ${N} by ${N}. ${rows.join(". ")}. ${chain.length ? `Picked: ${chain.map(i => game.grid[i]).join("")}.` : ""} Type a word and press Enter, or use the arrow keys and Space.`);
}
addEventListener("resize", () => { if (game) draw(); });

/* ---------- connecting a word ---------- */
const near = (a, b) => { const N = game.N; return a !== b && Math.abs(a % N - b % N) <= 1 && Math.abs(Math.floor(a / N) - Math.floor(b / N)) <= 1; };
let flashTimer = 0;
// a line under the board saying how a word went
let saidTimer = 0;
function sayBelow(text, good, ms = 3000) {
  clearTimeout(saidTimer); const el = $("said"); el.textContent = text; el.classList.toggle("good", !!good);
  saidTimer = setTimeout(() => { if (el.textContent === text) el.textContent = ""; }, ms);
}
function showFlash(cells, word, kind, ms) {
  clearTimeout(flashTimer); flash = {cells, word, kind}; draw();
  flashTimer = setTimeout(() => { flash = null; draw(); }, ms);
}
// Try the magnets in `cells` as a word.
function submit(cells) {
  chain = []; typed = "";
  if (!game || cells.length < 2) { draw(); return; }
  const w = cells.map(i => game.grid[i]).join(""), min = LEVELS[game.level][1];
  game.started = true;
  const o = list.find(o => o.w === w);
  if (o && !game.found.includes(w)) {
    game.found.push(w); save(); showFlash(cells, w, "found", 700); $("said").textContent = "";
    if (game.found.length === list.length && !game.demo) win();
    return;
  }
  if (o) { showFlash(cells, w, "miss", 700); sayBelow(`You've found ${w} already.`); return; }
  if (w.length >= min && KNOWN.has(w)) {
    if (game.bonus.includes(w)) sayBelow(`${w} is a bonus word you've found already.`);
    else { game.bonus.push(w); save(); sayBelow(`${w}: a bonus word! It isn't one to find, but well spotted.`, true); }
    showFlash(cells, w, "bonus", 700); return;
  }
  showFlash(cells, w, "miss", 700);
  sayBelow(w.length < min ? `Words need ${min} letters or more here.` : `${w} isn't a word we know.`);
}
// Pointer: drag across magnets to spell a word (back over the last one to take it off), or tap them one by one
// and tap the last one again to connect the word.
function magAt(e, strict) {
  const r = $("mags").getBoundingClientRect(), N = game.N;
  const fx = (e.clientX - r.left) / r.width * N, fy = (e.clientY - r.top) / r.height * N, x = Math.floor(fx), y = Math.floor(fy);
  if (x < 0 || y < 0 || x >= N || y >= N) return -1;
  // while dragging, only the middle of a magnet counts, so a diagonal doesn't catch its neighbours on the way
  if (strict && Math.hypot(fx - x - .5, fy - y - .5) > .36) return -1;
  return y * N + x;
}
let drag = null;
$("board").addEventListener("pointerdown", e => {
  if (!playing() || e.button > 0) return;
  const i = magAt(e, false); if (i < 0) return;
  clearTimeout(flashTimer); flash = null; typed = "";
  drag = {start: i, moved: false, was: chain.slice()};
  if (!chain.length || !(chain.includes(i) || near(chain[chain.length - 1], i))) chain = [i];
  else if (!chain.includes(i)) chain.push(i);
  $("board").setPointerCapture(e.pointerId); draw();
});
$("board").addEventListener("pointermove", e => {
  if (!drag) return;
  const i = magAt(e, true); if (i < 0) return;
  const last = chain[chain.length - 1];
  if (i === last) return;
  if (chain.length > 1 && i === chain[chain.length - 2]) chain.pop();
  else if (!chain.includes(i) && near(last, i)) chain.push(i);
  else return;
  drag.moved = true; draw();
});
$("board").addEventListener("pointerup", () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved) { submit(chain); return; }
  tapMag(d.start, d.was);
});
$("board").addEventListener("pointercancel", () => { drag = null; chain = []; draw(); });
// a tap (or Space): add the magnet to the chain; tapping the chain's last magnet again connects the word
function tapMag(i, was) {
  if (!playing()) return;
  const last = was[was.length - 1];
  if (was.length && i === last) { submit(was); return; }
  if (was.includes(i)) chain = was.slice(0, was.indexOf(i) + 1);
  else if (was.length && near(last, i)) chain = was.concat(i);
  else chain = [i];
  draw();
}
// Keys: type a word and press Enter or Space (Backspace takes a letter off, Escape lets go), or move the cursor with
// the arrows, press Enter on each magnet and Space to try the word.
const keys = G.gridKeys({on: () => playing(), size: () => [game.N, game.N],
  show: i => [...$("mags").children].forEach((d, k) => d.classList.toggle("kbcursor", k === i)),
  act: i => { typed = ""; addMag(i); },
  escape: () => { chain = []; typed = ""; draw(); }});
// Enter at the cursor: add the magnet to the word if it touches the last one (or go back to it, if it's in the word
// already), or start a new word there
function addMag(i) {
  if (!playing()) return;
  const last = chain[chain.length - 1];
  if (chain.includes(i)) chain = chain.slice(0, chain.indexOf(i) + 1);
  else if (chain.length && near(last, i)) chain = chain.concat(i);
  else chain = [i];
  draw();
}
// a path for the letters typed, preferring magnets still in the drawer
function pathFor(word) {
  const N = game.N, keep = inDrawer(); let best = null;
  const go = (k, path) => {
    if (k === word.length) { const sc = path.filter(i => keep.has(i)).length; if (!best || sc > best.sc) best = {path: path.slice(), sc}; return; }
    for (let i = 0; i < N * N; i++) if (game.grid[i] === word[k] && !path.includes(i) && (!k || near(path[k - 1], i))) { path.push(i); go(k + 1, path); path.pop(); }
  };
  go(0, []); return best && best.path;
}
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || !playing() || document.querySelector(".spot") || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (/^[a-z]$/i.test(e.key)) {
    const t = typed + e.key.toUpperCase(), p = pathFor(t);
    keys.hide();
    if (p) { typed = t; chain = p; flash = null; draw(); }
    else sayBelow(`No chain of magnets spells ${t}.`);
    e.preventDefault();
  } else if (e.key === "Backspace" && typed) { typed = typed.slice(0, -1); chain = typed ? pathFor(typed) : []; draw(); e.preventDefault(); }
  else if ((e.key === "Enter" && typed) || (e.key === " " && chain.length)) { submit(chain); e.preventDefault(); e.stopImmediatePropagation(); }
}, true);

/* ---------- hints ---------- */
// The shortest word still to find: first the magnet it starts on, then its first half, then the whole chain.
function hint() {
  if (!playing()) return;
  const o = left()[0]; if (!o) return;
  const p = o.paths[0], L = o.w.length, lv = hints.level();
  game.hinted = true; save();
  if (lv === 0) hints.show({cells: [p[0]]}, `A ${L}-letter word starts on the gold magnet.`);
  else if (lv === 1) { const h = Math.ceil(L / 2); hints.show({cells: p.slice(0, h)}, `A ${L}-letter word starts ${o.w.slice(0, h)}…`); }
  else hints.show({cells: p}, `There's ${o.w}: connect the gold magnets.`);
}
$("hintBtn").onclick = hint;
// Words left: show how many words of each length are still to find, as blanks in the list. Like a hint, it costs the
// gold paw; it lasts for the rest of the puzzle.
$("leftBtn").onclick = () => {
  if (!playing() || game.showLeft) return;
  game.showLeft = true; game.hinted = true; save(); draw();
  const n = left().length; sayBelow(`${n} word${n === 1 ? "" : "s"} still to find, shown as blanks in the list.`, true, 4000);
};
// Restart: every word to find again. It costs the gold paw.
$("restartBtn").onclick = () => {
  if (!game || game.won) return;
  Object.assign(game, {found: [], bonus: [], restarted: true, showLeft: false}); chain = []; typed = "";
  hints.clear(false); draw(); save();
  G.note("Every word is to find again.", 3000);
};

/* ---------- winning ---------- */
const goldOK = () => !game.hinted && !game.restarted;
function win() {
  game.won = true; chain = []; G.finishClock(game);
  const next = game.hinted ? game.level : Math.min(MAX_LEVEL, game.level + 1);
  settings.level = next; $("levelSel").value = next; save(); draw();
  G.track(`Junk Drawer solved level ${game.level}`);
  const g = game;
  setTimeout(() => { if (game === g) finishCard(); }, 1800);
}
function dottiePic() { const im = new Image(); im.className = "dottiepic"; im.src = catSrc("dottie-28"); im.alt = "Dottie, a black cat with a teal bow, lying among the magnets"; return im; }
function finishCard() {
  const next = settings.level, n = list.length, b = game.bonus.length;
  let text = `All ${n} words connected${b ? `, and ${b} bonus word${b > 1 ? "s" : ""}` : ""}. Dottie has curled up in the drawer.`;
  text += game.hinted ? ` You had a hint, so here's another at level ${next}.` : game.level === MAX_LEVEL ? " That's the biggest drawer; here's another." : ` Next up: level ${next}.`;
  G.winCard(text, () => { G.closeCard(); startLevel(next); }, "Admire the drawer", game.result,
    {title: "All found!", gold: goldOK(), goldWhy: "No hints or restarts!", goldTitle: "Gold paw, Dottie!", goldPic: [dottiePic()], next: next > game.level ? `Next: level ${next}` : "Next drawer",
     after: G.otherSize($("levelSel"), next, startLevel, "Or play a different level:")});
}

/* ---------- sharing ---------- */
$("linkBtn").onclick = () => { if (game) G.shareCard({name: "Junk Drawer", won: game.won,
  puzzle: () => ({g: "junkdrawer", N: game.level, grid: game.grid}), progress: () => ({f: game.found, b: game.bonus})}); };
async function openShared(d) {
  const lv = LEVELS[d.N];
  if (!lv || typeof d.grid !== "string" || d.grid.length !== lv[0] * lv[0] || !/^[A-Z]+$/.test(d.grid)) { G.note("That share link didn't work.", 5000); return; }
  try { await loadWords(); } catch (e) { G.note(`Couldn't open the drawer: ${e.message}.`, 0); return; }
  game = deal(d.N, d.grid); list = wordsIn(d.N, d.grid); chain = []; typed = "";
  if (!list.length) { G.note("That share link didn't work.", 5000); return newPuzzle(); }
  if (d.p) {
    const ws = new Set(list.map(o => o.w)), ok = a => Array.isArray(a) ? a.filter(w => typeof w === "string") : [];
    game.found = [...new Set(ok(d.p.f).filter(w => ws.has(w)))];
    game.bonus = [...new Set(ok(d.p.b).filter(w => /^[A-Z]{3,12}$/.test(w) && KNOWN.has(w) && !ws.has(w)))];
    game.timed = false;
    if (game.found.length === list.length) game.won = true;
  }
  settings.level = d.N; $("levelSel").value = d.N;
  draw(); save();
}

/* ---------- how to play ---------- */
function showHelp() {
  settings.seenHelp = false; helpOnFirstVisit();
  if (!document.querySelector(".spot")) { settings.seenHelp = true; G.helpLater(); }
}
// The walkthrough plays on a little practice drawer of its own: TAIL runs across, then on a corner, then down, so
// connecting it shows that neighbours and corners both touch. The real drawer comes back, just as it was, at the end.
const DEMO = {grid: "TAQZXJIVKBLWFGUY", words: [{w: "TAIL", paths: [[0, 1, 6, 10]]}]};
let real = null;   // the real game and its words while the practice drawer is out
function demoOn() {
  if (real) return;
  real = {game, list, chain, typed}; chain = []; typed = ""; hints.clear(false);
  game = Object.assign(deal(1, DEMO.grid), {demo: true}); list = DEMO.words; draw();
}
function demoOff() {
  if (!real) return;
  ({game, list, chain, typed} = real); real = null; hints.clear(false); draw();
}
function helpOnFirstVisit() {
  if (settings.seenHelp || !game || !playing() || document.querySelector(".spot")) return;
  const xy = i => [i % 4, Math.floor(i / 4)], all = [...Array(16).keys()].map(xy), min = LEVELS[game.level][1];
  const steps = [
    {say: "Spell with the fridge magnets", lit: all, enter: demoOn},
    {say: "Connect TAIL", lit: DEMO.words[0].paths[0].map(xy), enter: demoOn, try: {done: () => game.found.length > 0, yes: "Found! Tapping works too"}},
    {say: `Find every word of ${min}+ letters`, els: [$("lens")]},
    {say: "Words left shows what's to find", els: [$("leftBtn")]},
    {say: "Other words are bonus words", els: [$("bonus")], later: true},
    {say: "Stuck? Hint shows a start", els: [$("hintBtn")]},
  ];
  demoOn();
  G.spotlight({grid: $("mags"), w: 4, h: 4, steps, done: () => { demoOff(); settings.seenHelp = true; save(); }});
}

/* ---------- start ---------- */
for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(levelName(n).replace("Level ", "") + (n === MAX_LEVEL ? " (biggest)" : ""), n));
$("levelSel").onchange = e => startLevel(+e.target.value);
$("newBtn").onclick = newPuzzle;
$("helpBtn").onclick = showHelp;

G.nav("junkdrawer");
G.checkClock(game);
G.setupTimer({name: "junkdrawer", game: () => game, playing: g => !g.won, save, label: levelName, noun: "level",
  emptyText: "Find every word in a drawer and your times will show up here. They're kept on this device only."});
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : settings.level);

if (!(settings.level >= 1 && settings.level <= MAX_LEVEL)) settings.level = 1;
$("levelSel").value = settings.level;
G.switch({id: "autoTgl", label: "Dim used-up magnets", line: "Magnets no word left to find needs fade", key: "autoNotes", of: () => settings, save,
  tip: "Used-up magnets fade", change: () => { if (game) draw(); }});
// the junk is only to look at: a switch in Comfort puts it away (decided 2026-11-08)
const showJunk = () => $("junk").toggleAttribute("hidden", !settings.junk);   // an SVG has no .hidden
G.switch({id: "junkTgl", comfort: true, label: "Junk", line: "Bits of junk lie between the magnets", key: "junk", of: () => settings, save, change: showJunk});
showJunk();
const shared = G.readShare("junkdrawer");
const hadSave = !!(game && typeof game.grid === "string");
if (hadSave) loadWords().then(() => G.reopen(() => {
    const lv = LEVELS[game.level];
    if (!lv || game.N !== lv[0] || game.grid.length !== game.N * game.N || !Array.isArray(game.found) || !Array.isArray(game.bonus)) throw new Error("the saved drawer doesn't fit its level");
    list = wordsIn(game.level, game.grid);
    if (!list.length) throw new Error("the saved drawer had no words");
    draw();
    if (game.won) finishCard(); else helpOnFirstVisit();
  }, why => { game = null; newPuzzle(); G.note(why, 0); }), e => G.note(`Couldn't open the drawer: ${e.message}.`, 0));
else if (!shared) newPuzzle().then(helpOnFirstVisit);
const shareOpts = () => ({name: "Junk Drawer", inProgress: !!(game && !game.won && game.found.length), open: openShared, after: helpOnFirstVisit});
if (shared) G.offerShare(shared, {...shareOpts(), fresh: hadSave ? null : why => Promise.resolve(newPuzzle()).then(() => { G.note(why, 6000); helpOnFirstVisit(); })});
window.addEventListener("hashchange", () => { const d = G.readShare("junkdrawer"); if (d) G.offerShare(d, shareOpts()); });
</script>
