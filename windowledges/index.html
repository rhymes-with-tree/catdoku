<script>
/* ---------- puzzles (plain functions, also run in a background worker) ---------- */
// A block of flats on an R × C plan: walls (the top row and left column are always walls, holding the totals) and
// windows. Every window is in an across run and a down run of 2 or more windows; a run's total is on the wall square
// before it. Digits 1 to 9, none twice in a run. Levels: [rows, columns, longest run, whether it can be solved without a guess].
// A puzzle: {R, C, w: array of 0/1 (1 = white), runs: [{cells:[...], sum, dir:"a"|"d"}], sol:[digits]}
function levelOf(n) {
  // [rows, cols, longest run, needs no guess]
  return [null, [6, 6, 4, 1], [7, 7, 5, 1], [8, 8, 5, 1], [9, 9, 6, 1], [10, 10, 6, 0]][n];
}
// every set of n different digits from 1 to 9, by the sum they make: comboTable()[n][sum] is a list of digit masks
function comboTable() {
  if (self.__kc) return self.__kc;
  const t = [];
  for (let n = 0; n <= 9; n++) t.push({});
  for (let m = 2; m < 1024; m += 2) {
    let n = 0, sum = 0;
    for (let v = 1; v <= 9; v++) if (m >> v & 1) { n++; sum += v; }
    (t[n][sum] = t[n][sum] || []).push(m);
  }
  return (self.__kc = t);
}
function kRand(n) { return Math.floor(Math.random() * n); }
// a pattern of white squares (1) and wall squares (0): the top row and left column are walls (they hold the
// clues); every white square sits in an across run and a down run of 2 to `maxRun` squares; whites all join up
function kPattern(R, C, maxRun) {
  for (let attempt = 0; attempt < 200; attempt++) {
    const w = new Array(R * C).fill(1);
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (!r || !c) w[r * C + c] = 0;
    const dens = 0.18 + Math.random() * 0.12;
    for (let r = 1; r < R; r++) for (let c = 1; c < C; c++) if (Math.random() < dens) { w[r * C + c] = 0; w[(R - r) * C + (C - c)] = 0; }
    for (let pass = 0; pass < 60; pass++) {
      let changed = false;
      // runs that are too long get a wall in the middle
      for (const dir of [0, 1]) {
        for (let a = 1; a < (dir ? C : R); a++) {
          let b = 1;
          while (b < (dir ? R : C)) {
            const idx = k => dir ? k * C + a : a * C + k;
            if (!w[idx(b)]) { b++; continue; }
            let e = b; while (e < (dir ? R : C) && w[idx(e)]) e++;
            if (e - b > maxRun) { const m = b + Math.floor((e - b) / 2) + (kRand(3) - 1); w[idx(Math.max(b + 1, Math.min(e - 2, m)))] = 0; changed = true; }
            b = e;
          }
        }
      }
      // a white with no neighbour to one side along a line (run of 1) becomes a wall
      for (let r = 1; r < R; r++) for (let c = 1; c < C; c++) {
        if (!w[r * C + c]) continue;
        const across = (c + 1 < C && w[r * C + c + 1]) || w[r * C + c - 1];
        const down = (r + 1 < R && w[(r + 1) * C + c]) || w[(r - 1) * C + c];
        if (!across || !down) { w[r * C + c] = 0; changed = true; }
      }
      if (!changed) break;
    }
    // keep the biggest joined group of whites
    const seen = new Array(R * C).fill(0), groups = [];
    for (let i = 0; i < R * C; i++) {
      if (!w[i] || seen[i]) continue;
      const g = [i]; seen[i] = 1;
      for (let q = 0; q < g.length; q++) for (const j of [g[q] - 1, g[q] + 1, g[q] - C, g[q] + C]) if (j >= 0 && j < R * C && w[j] && !seen[j] && Math.abs((j % C) - (g[q] % C)) <= 1) { seen[j] = 1; g.push(j); }
      groups.push(g);
    }
    if (!groups.length) continue;
    groups.sort((x, y) => y.length - x.length);
    if (groups[0].length < (R - 1) * (C - 1) * 0.55) continue;
    for (const g of groups.slice(1)) for (const i of g) w[i] = 0;
    // after dropping stragglers, make sure every run is still 2+ long
    let ok = true;
    for (let r = 1; r < R && ok; r++) for (let c = 1; c < C; c++) {
      if (!w[r * C + c]) continue;
      const across = (c + 1 < C && w[r * C + c + 1]) || w[r * C + c - 1];
      const down = (r + 1 < R && w[(r + 1) * C + c]) || w[(r - 1) * C + c];
      if (!across || !down) { ok = false; break; }
    }
    if (ok) return w;
  }
  return null;
}
// the runs of a pattern, as lists of squares
function kRuns(R, C, w) {
  const runs = [];
  for (let r = 1; r < R; r++) for (let c = 1; c < C; c++) {
    if (!w[r * C + c]) continue;
    if (!w[r * C + c - 1]) { const cells = []; for (let k = c; k < C && w[r * C + k]; k++) cells.push(r * C + k); runs.push({cells, dir: "a", clue: r * C + c - 1}); }
    if (!w[(r - 1) * C + c]) { const cells = []; for (let k = r; k < R && w[k * C + c]; k++) cells.push(k * C + c); runs.push({cells, dir: "d", clue: (r - 1) * C + c}); }
  }
  return runs;

  const i = open.includes(sel) ? sel : open[0], dom = r.ok ? r.dom[i] : candidates(i), ds = [];
  for (let v = 1; v <= 9; v++) if (dom >> v & 1) ds.push(v);
  sel = i; hints.show({i}, hints.level() ? `The glowing window is a ${sol[i]}.` : `No window is settled by the sets alone. The glowing one can be ${ds.join(", ")}: a guess may help.`);
}
// Why a hinted window takes its digit: a run where only one set of digits makes the total, or the digits its runs already have.
function whyDigit(i) {
  const table = comboTable();
  for (const k of plan.at[i]) {
    const run = plan.runs[k], all = table[run.cells.length][run.sum] || [];
    if (all.length === 1) return `Only one set makes ${run.sum} in ${run.cells.length} windows ${run.dir === "a" ? "across" : "down"}, so the glowing window has just one place for its digit.`;
  }
  return "Only one digit fits in the glowing window, from the sets of its two totals and the digits already in its runs.";
}
$("hintBtn").onclick = hint;
$("restartBtn").onclick = () => { if (playing() && game.history.length) { game.undid = true; snapshot(); guesses.clear(); game.grid = game.grid.map(() => 0); game.notes = game.notes.map(() => 0); draw(); save(); G.note("Every window's dark again. Undo brings your numbers back.", 3500); } };
addEventListener("resize", () => { if (game && plan) draw(); });

/* ---------- endings ---------- */
// Every window is lit, so a few cats sit in the windows, then the finishing card.
function win() {
  game.won = true; G.finishClock(game); sel = -1; noting = false;
  const next = game.hinted ? game.level : Math.min(MAX_LEVEL, game.level + 1);
  settings.level = next; $("levelSel").value = next; save();
  pickCats(); $("facade").classList.add("won"); draw();
  G.track(`Window Ledges solved level ${game.level}`);
  build.prefetch(next);
  const g = game, still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  running = true;
  setTimeout(() => { running = false; if (game === g) finishCard(); }, still ? 1200 : 2600);
}
// a cat in about one window in six, different cats, never two side by side
function pickCats() {
  const wins = game.w.map((v, i) => v ? i : -1).filter(i => i >= 0), want = Math.max(2, Math.round(wins.length / 6)), seed = game.sums.reduce((a, b) => a * 31 + b, game.level);
  game.cats = {};
  let s = seed;
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const order = wins.slice(); for (let k = order.length - 1; k > 0; k--) { const j = Math.floor(rnd() * (k + 1)); [order[k], order[j]] = [order[j], order[k]]; }
  let n = 0;
  for (const i of order) {
    if (n >= want) break;
    if (game.cats[i - 1] || game.cats[i + 1] || game.cats[i - game.C] || game.cats[i + game.C]) continue;
    game.cats[i] = SITTERS[(seed + n * 7) % SITTERS.length]; n++;
  }
}
function goldPic() { const im = new Image(); im.className = "goldpic"; im.src = catSrc("willow-6"); im.alt = "Willow stretching in the lit window"; return im; }
function finishCard() {
  const next = settings.level, cats = Object.keys(game.cats || {}).length;
  let text = `Every window in the ${game.R - 1} × ${game.C - 1} block is lit, and ${cats} cats are sitting in them.`;
  text += game.hinted ? ` You had a hint, so here's another at level ${next}.` : game.level === MAX_LEVEL ? " That's the hardest level; here's another." : ` Next up: level ${next}.`;
  G.winCard(text, () => { G.closeCard(); startLevel(next); }, "Admire my block", game.result,
    {title: "All lit up!", gold: !game.undid && !game.hinted, goldWhy: "No undos or hints!", goldTitle: "Willow approves!", goldPic: [goldPic()],
     next: next > game.level ? `Next: level ${next}` : "Next block", after: G.otherSize($("levelSel"), next, startLevel, "Or play a different level:")});
}

/* ---------- new puzzles ---------- */
function startLevel(n) { settings.level = n; $("levelSel").value = n; save(); newPuzzle(); }
function begin(p, level) {
  const n = p.R * p.C;
  game = {level, R: p.R, C: p.C, w: Array.from(p.w, Number), sums: p.sums || p.runs.map(r => r.sum), grid: new Array(n).fill(0), notes: new Array(n).fill(0), history: [], won: false, cats: {}, ...G.freshClock()};
  sel = -1; noting = false; forceLit = new Set(); $("facade").classList.remove("won"); makePlan(); makePad();
}
async function newPuzzle() {
  if (busy) return;
  busy = true;
  const n = settings.level;
  G.openCard("Building the block…", n >= 4 ? "Big blocks can take a few seconds." : "", []);
  const p = await build.take(n);
  begin(p, n);
  busy = false; G.closeCard(); G.note("");
  draw(); save();
  build.prefetch(n);
  G.track(`Window Ledges new puzzle level ${n}`);
}

/* ---------- sharing ---------- */
$("linkBtn").onclick = () => { if (game && !busy) G.shareCard({name: "Window Ledges", won: game.won,
  puzzle: () => ({g: "windowledges", N: game.level, r: game.R, c: game.C, w: game.w.join(""), s: game.sums}),
  progress: () => ({grid: game.grid, notes: game.notes})}); };
// A puzzle from a share link, with its digits so far if they were sent (that isn't timed). The plan is checked: the
// right size, every run 2 or more windows, a sensible total for each run, and exactly one answer.
function openShared(d) {
  const lv = levelOf(d.N), ok = lv && d.r === lv[0] && d.c === lv[1] && typeof d.w === "string" && d.w.length === d.r * d.c && /^[01]+$/.test(d.w) && Array.isArray(d.s);
  let good = false;
  if (ok) {
    const w = Array.from(d.w, Number), runs = kRuns(d.r, d.c, w), table = comboTable();
    good = runs.length === d.s.length && runs.every((r, k) => r.cells.length >= 2 && r.cells.length <= 9 && Number.isInteger(d.s[k]) && (table[r.cells.length][d.s[k]] || []).length > 0)
      && w.every((v, i) => !v || (i % d.c && Math.floor(i / d.c) && ((w[i - 1] || w[i + 1]) && (w[i - d.c] || w[i + d.c]))));
    if (good) { runs.forEach((r, k) => { r.sum = d.s[k]; }); good = kSolve(d.r, d.c, runs, w, 2).count === 1; }
  }
  if (!good) { G.note("That share link didn't work.", 5000); return; }
  begin({R: d.r, C: d.c, w: d.w, sums: d.s}, d.N);
  const n = d.r * d.c;
  if (d.p && Array.isArray(d.p.grid) && d.p.grid.length === n) { game.grid = d.p.grid.map(v => (+v >= 1 && +v <= 9) ? +v : 0); if (Array.isArray(d.p.notes) && d.p.notes.length === n) game.notes = d.p.notes.map(v => (+v | 0) & 0x3FE); game.timed = false; }
  settings.level = d.N; $("levelSel").value = d.N;
  draw(); save(); build.prefetch(d.N);
  if (d.p && check().right.every(Boolean)) win();
}

/* ---------- how to play ---------- */
// How to play plays the walkthrough on the board (there's no rules card).
function showHelp() {
  settings.seenHelp = false; helpOnFirstVisit();
  if (!document.querySelector(".spot")) { settings.seenHelp = true; G.helpLater(); }
}
// First visit only: walk through the block that's out, lighting one run's windows just while its step is up.
function helpOnFirstVisit() {
  if (settings.seenHelp || !game || !playing() || document.querySelector(".spot")) return;
  const {R, C} = game, xy = i => [i % C, Math.floor(i / C)], wins = game.w.map((v, i) => v ? i : -1).filter(i => i >= 0).map(xy);
  const across = plan.runs.find(r => r.dir === "a" && r.cells.length >= 2 && r.cells.length <= 4) || plan.runs.find(r => r.dir === "a");
  const down = plan.runs.find(r => r.dir === "d" && r.cells.length >= 2 && r.cells.length <= 4) || plan.runs.find(r => r.dir === "d");
  const ac = [across.clue, ...across.cells].map(xy), dc = [down.clue, ...down.cells].map(xy);
  const e = [...Array(C * R).keys()].filter(i => game.w[i] && !game.grid[i]).sort((a, b) => Math.hypot(a % C - (C - 1) / 2, Math.floor(a / C) - (R - 1) / 2) - Math.hypot(b % C - (C - 1) / 2, Math.floor(b / C) - (R - 1) / 2))[0], turn = G.yourTurn(() => game, g => { game = g; }, () => { sel = -1; draw(); });
  const steps = [
    {say: "1 to 9 in every window", lit: wins},
    {say: `This run adds up to ${across.sum} (top right)`, lit: ac, outline: [ac]},
    {say: `This one to ${down.sum} (bottom left)`, lit: dc, outline: [dc]},
    {say: "No repeats in a run", lit: across.cells.map(xy), outline: [across.cells.map(xy)]},
    {say: "Right runs light up 💡", lit: across.cells.map(xy), outline: [across.cells.map(xy)], tone: "ok", enter: () => { forceLit = new Set(across.cells); draw(); }, leave: () => { forceLit = new Set(); draw(); }},
    {say: "Light every window 😸", lit: wins, tone: "ok"},
    // Your turn: put a number in a window on the real block (G.yourTurn takes it out again afterwards)
    ...(e === undefined ? [{say: "Tap a window, then a number", els: [$("pad")]}] : [
      {say: "Tap this window", lit: [xy(e)], try: {done: () => sel === e}, ...turn.from},
      {say: "Now pick a number", els: [$("pad")], try: {done: () => game.grid[e] > 0, yes: "In it goes!"}, ...turn.upTo}]),
    {say: "Show sets: digits for each total", els: [() => $("setsTgl").closest(".opt")]},
    {say: "Notes for maybes", els: [$("notesBtn")]},
    {say: "Not sure? Bookmark, then try an idea. Back to bookmark undoes it", els: [$("guessBtn")]},
    {say: "Stuck? Hint fixes or gives a number", els: [$("hintBtn")]},
  ];
  // the Your turn steps come early: doing comes before the rest of the rules
  { const t = steps.findIndex(st => st.try); if (t > 1) steps.splice(1, 0, ...steps.splice(t, 2)); }
  G.spotlight({grid: $("cells"), w: C, h: R, steps, done: () => { settings.seenHelp = true; save(); }});
}

for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(levelName(n).replace("Level ", "") + (n === MAX_LEVEL ? " (hardest)" : ""), n));
$("levelSel").onchange = e => { G.closeCard(); startLevel(+e.target.value); };
$("newBtn").onclick = () => { G.closeCard(); newPuzzle(); };
$("helpBtn").onclick = showHelp;
$("setsTgl").checked = settings.sets !== false;
$("setsTgl").onchange = e => { settings.sets = e.target.checked; save(); if (game) draw(); };
$("sitter").src = catSrc("willow-1");
$("roofcat").src = catSrc("willow-4");

G.nav("windowledges");
G.checkClock(game);
G.setupTimer({name: "windowledges", game: () => game, playing: g => !g.won, save, label: levelName, noun: "level"});
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : settings.level);

if (!(settings.level >= 1 && settings.level <= MAX_LEVEL)) settings.level = 1;
$("levelSel").value = settings.level;
const shared = G.readShare("windowledges");
const hadSave = !!(game && Array.isArray(game.grid) && Array.isArray(game.w) && Array.isArray(game.sums));
if (hadSave) G.reopen(() => {
    const lv = levelOf(game.level);
    if (!lv || game.grid.length !== game.R * game.C || game.w.length !== game.grid.length) throw new Error("the saved puzzle doesn't fit its level");
    if (!Array.isArray(game.notes)) game.notes = new Array(game.R * game.C).fill(0);
    if (!game.cats) game.cats = {};
    makePlan(); makePad(); draw();
    if (game.won) { $("facade").classList.add("won"); finishCard(); }
    build.prefetch(settings.level); helpOnFirstVisit();
  }, why => { game = null; newPuzzle().then(() => G.note(why, 0)); });
else if (!shared) newPuzzle().then(helpOnFirstVisit);
const shareOpts = () => ({name: "Window Ledges", inProgress: !!(game && !game.won && game.history.length), open: openShared, after: helpOnFirstVisit});
// a link that doesn't work, opened with no saved puzzle, would leave the board empty: start one
if (shared) G.offerShare(shared, {...shareOpts(), fresh: hadSave ? null : why => Promise.resolve(newPuzzle()).then(() => { G.note(why, 6000); helpOnFirstVisit(); })});
// A share link opened while this page is already showing only changes the address, so watch for it.
window.addEventListener("hashchange", () => { const d = G.readShare("windowledges"); if (d) G.offerShare(d, shareOpts()); });
</script>
