<html lang="en">
<head>

(function () {
  var BUILD = "2026-11-12.11";
  fetch("../version.txt?t=" + Date.now(), {cache: "no-store"}).then(function (r) { return r.ok ? r.text() : ""; }).then(function (v) {
    v = v.trim(); var tried = null;
    try { tried = sessionStorage.getItem("catdoku.reloadedFor"); } catch (e) {}
    if (v && v !== BUILD && tried !== v) { try { sessionStorage.setItem("catdoku.reloadedFor", v); } catch (e) {} location.reload(); }

<link rel="icon" href="../favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">

<meta name="theme-color" content="#1F1C24" media="(prefers-color-scheme: dark)">

<style>
/* Pawlette: Mix to order. A skein of yarn waits to be dyed in one of Yarn's colourways, a colour at a time. Tap the
   pots to drip paint into the cup, mixing like real paint, until it matches the colour for the next stretch; a
   perfect match dyes it straight away, and Dye it takes a close one. A cat naps on the corner of the bench. */
.bench{--aspect:1.18;position:relative;width:var(--board);margin-top:56px;background:color-mix(in srgb,#2A2530 6%,#F7F8F3);
  border:3px solid var(--ink);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:12px;align-items:stretch}
/* the colourway as a strand of yarn, with a ring on each colour to match */
#skein{display:block;width:100%;height:auto}
#skein .stretch{stroke:#2A2530;stroke-width:2}
#skein .undyed{fill:#EFE6D2}
#skein .now{stroke:#ECA818;stroke-width:5}
/* the target and your mix, side by side */
.swatches{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.sw2{min-width:0}
.sw2{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;color:#5E5866;font-size:14px}
.blob{width:min(100%,140px);aspect-ratio:1;border-radius:50%;border:3px solid #2A2530;box-shadow:inset 0 -6px 0 rgba(42,37,48,.15)}
.match{font:800 18px/1 "Baloo 2",system-ui,sans-serif;color:#2A2530;min-height:20px}
.drops{display:flex;gap:4px;justify-content:center;min-height:12px;flex-wrap:wrap;max-width:150px}
.drops i{width:10px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:1.5px solid #2A2530}
/* the paint pots, each with its colour's mark */
.pots{display:flex;gap:10px;justify-content:center}
.pot{width:56px;height:56px;border-radius:12px 12px 22px 22px;border:3px solid #2A2530;display:grid;place-items:center;padding:0;cursor:pointer;
  box-shadow:inset 0 -6px 0 rgba(42,37,48,.18)}
.pot svg{width:56%;height:56%}
.pot:active{transform:translateY(2px)}
.pot.hintcell{box-shadow:0 0 0 4px #ECA818,inset 0 -6px 0 rgba(42,37,48,.18)}
.pot.kbcursor{outline:3px solid #73A7AE;outline-offset:3px}
.cupbtns{display:flex;gap:10px;justify-content:center}
.cupbtns button{min-height:44px}
/* the cat napping on the corner of the bench */
.napper{position:absolute;right:6px;top:0;width:84px;transform:translateY(-86%);z-index:4;cursor:pointer;border:0;padding:0;background:none}
.napper:hover{background:none}
.napper img{display:block;width:100%;transform-origin:50% 90%;animation:snooze 7s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(42,37,48,.18))}
@keyframes snooze{0%,100%{transform:scale(.97,.95)}50%{transform:scale(1.03,1.05)}}
.napper.purr{animation:purr .09s linear 12}
@keyframes purr{0%,100%{translate:0 0}25%{translate:-1.2px .6px}75%{translate:1.2px -.6px}}
.float{position:absolute;left:30%;top:-4px;font-weight:800;color:#5E5866;pointer-events:none;white-space:nowrap;animation:rise 2.4s ease-out forwards}
.float.prr{font-size:15px;color:#B94588}
@keyframes rise{0%{opacity:0;transform:translateY(6px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(14px,-46px) scale(1.15)}}
.card svg.ball{display:block;width:60%;max-width:220px;margin:0 auto 12px}
/* a phone held sideways: the bench takes the screen's height, so the swatches and pots shrink and the cat naps elsewhere */
@media (orientation:landscape) and (max-height:500px){
  body:not(.full) main > .bench.stage{margin-top:0;gap:6px;padding:6px 8px}
  body:not(.full) main > .bench.stage .napper{display:none}
  body:not(.full) main > .bench.stage .blob{width:min(100%,calc(var(--tall) * .16))}
  body:not(.full) main > .bench.stage .pot{width:44px;height:44px}
  body:not(.full) main > .bench.stage .sw2{font-size:12px;gap:2px}
}
/* how close a dye came, popped big over the middle of the bench, then bounced away */
.pop{position:absolute;left:50%;top:44%;z-index:6;pointer-events:none;text-align:center;transform:translate(-50%,-50%);
  font:800 60px/1 "Baloo 2",system-ui,sans-serif;color:#2A2530;-webkit-text-stroke:3px #F7F8F3;paint-order:stroke fill;
  text-shadow:0 4px 0 rgba(42,37,48,.18);animation:pop 1.6s cubic-bezier(.3,1.4,.5,1) forwards;white-space:nowrap}
.pop small{display:block;font-size:28px;margin-top:4px}
.pop.gold{color:#ECA818;-webkit-text-stroke-color:#2A2530}
.pop.low{font-size:48px;animation:popLow 1.4s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  34%{transform:translate(-50%,-50%) scale(.95)}44%{transform:translate(-50%,-50%) scale(1)}72%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  86%{transform:translate(-50%,-62%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-260%) scale(.7)}}
@keyframes popLow{0%{opacity:0;transform:translate(-50%,-40%)}20%,70%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-70%)}}
@media (prefers-reduced-motion:reduce){.napper img{animation:none}.pop,.pop.low{animation:fade 1.6s linear forwards}}
@keyframes fade{0%{opacity:0}15%,75%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<main>
  <header><h1>Pawlette</h1><div class="stripe"></div><p class="tagline">Mix paint to dye the yarn</p></header>
  <nav class="games" id="games" aria-label="Games"></nav>
  <div class="status"><span id="count"></span><button class="timer" id="timer" hidden></button><span class="msg" id="msg" aria-live="polite"></span></div>

  <div class="bench stage" id="board">
    <button class="napper" id="napper" aria-label="The cat. Give it a pat"><img id="napImg" alt=""></button>
    <svg id="skein" viewBox="0 0 320 116" role="img" aria-label="The colourway"></svg>
    <div class="swatches">
      <div class="sw2"><span>Match this</span><div class="blob" id="target"></div><span class="match" aria-hidden="true"></span></div>
      <div class="sw2"><span>Your mix</span><div class="blob" id="cup"></div><span class="match" id="match"></span><div class="drops" id="drops"></div></div>
    </div>
    <div class="pots" id="pots" role="group" aria-label="Paint pots"></div>
  </div>
  <div class="cupbtns"><button id="emptyBtn">Empty the cup</button><button id="dyeBtn" class="primary">Dye it</button></div>   <!-- below the board, not in it -->
  <div class="overlay" id="overlay"><div class="card" id="card"></div></div>

  <div class="actions">
    <button id="hintBtn">Hint</button>
    <button id="undoBtn">Undo</button>
    <button id="restartBtn">Restart</button>
    <button id="linkBtn">Share</button>
    <button id="bestBtn">Best times</button>
    <button id="helpBtn">How to play</button>
  </div>
  <div class="bar">
    <label>Level <select id="levelSel" aria-label="Level"></select></label>
    <button id="newBtn" class="primary">New skein</button>
  </div>
</main>

<script src="../games.js?v=2026-11-12.11"></script>
<script src="../colorways.js?v=2026-11-12.11"></script>
<script>
/* ---------- paint (plain functions) ---------- */
// A mix is drops of each pot: [red, yellow, blue, white, black]. Its colour: the red-yellow-blue part blended
// between the corners of the paint cube (Pawlette's colours: red, orange, yellow, green, blue, purple, brown, and the
// paper for none), then lightened by white and darkened by black in proportion.
function paintRGB(d) {
  const CORNERS = {"000": [247, 248, 243], "100": [225, 98, 81], "110": [236, 129, 77], "010": [236, 168, 24], "011": [106, 166, 115],
    "001": [48, 166, 179], "101": [152, 116, 202], "111": [59, 42, 34]}, PAPER = [247, 248, 243], INK = [42, 37, 48];
  const [r, y, b, w, k] = d, m = Math.max(r, y, b), hue = [0, 0, 0];
  if (m) for (const cr of [0, 1]) for (const cy of [0, 1]) for (const cb of [0, 1]) {
    const c = CORNERS[`${cr}${cy}${cb}`], f = (cr ? r / m : 1 - r / m) * (cy ? y / m : 1 - y / m) * (cb ? b / m : 1 - b / m);
    for (let n = 0; n < 3; n++) hue[n] += f * c[n];
  }
  const tot = m + w + k;
  if (!tot) return PAPER.slice();
  return [0, 1, 2].map(n => Math.round((m * hue[n] + w * PAPER[n] + k * INK[n]) / tot));
}
// CIE Lab, for how far apart two colours look
function lab([R, G, B]) {
  const lin = v => (v /= 255) <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4, [r, g, b] = [lin(R), lin(G), lin(B)];
  const X = (r * .4124 + g * .3576 + b * .1805) / .95047, Y = r * .2126 + g * .7152 + b * .0722, Z = (r * .0193 + g * .1192 + b * .9505) / 1.08883;
  const f = t => t > .008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  return [116 * f(Y) - 16, 500 * (f(X) - f(Y)), 200 * (f(Y) - f(Z))];
}
function deltaE(a, b) { const p = lab(a), q = lab(b); return Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]); }
const hexRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
// Every mix of up to max drops from the pots in use (a 1 in pots: red, yellow, blue, white, black), keeping the
// fewest drops for each colour (2 red and 2 yellow is the same colour as 1 and 1).
function recipes(max, pots) {
  const out = [], seen = new Set();
  for (let tot = 1; tot <= max; tot++) {
    const rec = (i, left, d) => {
      if (i === 5) { if (left === 0) { const key = paintRGB(d).join(); if (!seen.has(key)) { seen.add(key); out.push({d: d.slice(), rgb: paintRGB(d)}); } } return; }
      for (let n = 0; n <= (pots[i] ? left : 0); n++) { d[i] = n; rec(i + 1, left - n, d); }
      d[i] = 0;
    };
    rec(0, tot, [0, 0, 0, 0, 0]);
  }
  return out;
}

// Levels: how many stretches the skein has, the most drops a match takes, and the pots on the bench.
function levelSpec(n) {
  return [null, {n: 3, max: 4, pots: [1, 1, 1, 1, 0]}, {n: 4, max: 6, pots: [1, 1, 1, 1, 0]},
    {n: 5, max: 8, pots: [1, 1, 1, 1, 0]}, {n: 5, max: 8, pots: [1, 1, 1, 1, 1]},
    // level 5: 6 to 8 colours
    {n: 6, upTo: 8, max: 8, pots: [1, 1, 1, 1, 1]}][n];
}

/* ---------- the pots ---------- */
const DOWN = `<rect x="9.5" y="1.5" width="5" height="21" rx="2.2"/>`, ACROSS = `<rect x="1.5" y="9.5" width="21" height="5" rx="2.2"/>`, RING = `<circle cx="12" cy="12" r="6.2" fill="none" stroke-width="3.4"/>`;
const POTS = [
  {name: "red", hex: "#E16251", mark: DOWN, ink: "#F7F8F3"}, {name: "yellow", hex: "#ECA818", mark: ACROSS, ink: "#2A2530"},
  {name: "blue", hex: "#30A6B3", mark: RING, ink: "#F7F8F3"},
  {name: "white", hex: "#F7F8F3", mark: `<rect x="4" y="4" width="16" height="16" rx="3.5" fill="none" stroke-width="2.2" stroke-dasharray="3.6 2.6"/>`, ink: "#2A2530"},
  {name: "black", hex: "#2A2530", mark: `<circle cx="12" cy="12" r="6.5"/>`, ink: "#F7F8F3"}];
const rgbCss = c => `rgb(${c.join(",")})`;

/* ---------- game state ---------- */
// game: {level, way (the colourway's name), targets ([{d, rgb}] for each colour, the fewest-drop recipe for it),
//        at (the colour being mixed), cup (drops so far), dyed ([{rgb, perfect, drops}] per stretch done),
//        history, won, hinted, undid, clock…}
const STORE = "catdoku.pawlette.v2", MAX_LEVEL = 5, $ = G.$;
let saved = G.load(STORE), settings = Object.assign({level: 1, seen: false}, saved.settings);
let game = saved.game || null;
// The gold paw's gone for this puzzle once any of these is true, and the tools that cost it lose their red (games.js).
G.pawLost(() => !game || game.won || game.hinted || game.restarted);
const save = () => G.save(STORE, {settings, game});
// held: the colour just dyed, kept on the swatches while its score pops ({target, cup} colours), or null
let held = null;
const playing = () => game && !game.won && !held && !$("overlay").classList.contains("show");
// Every colourway in Yarn's three sets, as [name, colours]. A few names are in two sets with different colours
// (Sunset has 5 in one, 7 in the other); both come up.
const WAYS = [COLORWAYS, BLENDS, VARIEGATED].flatMap(set => Object.entries(set));
const levelName = n => { const s = levelSpec(n); return `${n} · ${s.upTo ? `${s.n} to ${s.upTo}` : s.n} colours${s.pots[4] ? ", with black" : ""}`; };
const recipeCache = {};
const recipesFor = n => recipeCache[n] || (recipeCache[n] = recipes(levelSpec(n).max, levelSpec(n).pots));
// A new skein: a colourway with at least as many colours as stretches, and for each colour picked from it (spread
// out along it), the mixable colour nearest it; no two stretches the same.
// How many recent colourways to skip when picking the next.
const RECENT = 10;
function deal(level) {
  const spec = levelSpec(level), R = recipesFor(level), key = ([w, c]) => w + "|" + c.length;
  // a colourway, not one of the last few you've dyed (if there's another to pick)
  const fresh = WAYS.filter(w => !(settings.recent || []).includes(key(w)));
  const ok = fresh.length ? fresh : WAYS, [way, cols] = ok[Math.floor(Math.random() * ok.length)];
  settings.recent = [...(settings.recent || []).filter(k => k !== key([way, cols])), key([way, cols])].slice(-RECENT);
  // where along the strand to match (0 at its start, 1 at its end): anywhere, in order, never so close that two
  // rings overlap; the colour there is the strand's own blend at that point
  const n = spec.upTo ? spec.n + Math.floor(Math.random() * (spec.upTo - spec.n + 1)) : spec.n, gap = n > 5 ? .1 : .15;
  let pos;
  do pos = [...Array(n)].map(() => Math.random()).sort((a, b) => a - b); while (pos.some((t, k) => k && t - pos[k - 1] < gap));
  const used = new Set(), targets = [];
  for (const t of pos) {
    const c = strandColour(cols, t); let best = null, bd = 1e9;
    for (const r of R) { if (used.has(r.rgb.join())) continue; const e = deltaE(c, r.rgb); if (e < bd) { bd = e; best = r; } }
    used.add(best.rgb.join()); targets.push({d: best.d, rgb: best.rgb});
  }
  return {level, way, cols: cols.slice(), pos, targets, at: 0, cup: [0, 0, 0, 0, 0], dyed: [], history: [], won: false, ...G.freshClock()};
}
// The strand's colour at t (0 to 1): its colours evenly along it, blended in between, as the strand is drawn.
function strandColour(cols, t) {
  const L = cols.length, f = t * (L - 1), k = Math.min(L - 2, Math.floor(f)), u = f - k, a = hexRGB(cols[k]), b = hexRGB(cols[k + 1]);
  return a.map((v, i) => Math.round(v + (b[i] - v) * u));
}
const cupRGB = () => paintRGB(game.cup);
const drops = d => d.reduce((a, b) => a + b, 0);
const PERFECT = 1.5, CLOSE = 8;
const closeness = () => drops(game.cup) ? deltaE(cupRGB(), game.targets[game.at].rgb) : 99;
const pct = e => Math.max(0, Math.round(100 - e * 2.5));

/* ---------- drawing ---------- */
function drawSkein() {
  const n = game.targets.length, way = game.cols || [], L = way.length;
  // the colourway itself: a strand of yarn blending through all its colours, with a ring on each colour you're
  // matching. A colour you've dyed fills its ring with your mix, so you can see it against the strand; the one you're
  // mixing for now has a gold ring.
  let s = `<defs><linearGradient id="strandGrad">${way.map((h, k) => `<stop offset="${(k / Math.max(1, L - 1) * 100).toFixed(1)}%" stop-color="${h}"/>`).join("")}</linearGradient></defs>`;
  // the strand waves gently: two waves across, and the rings sit on it by the same formula
  const strandY = x => 24 + 8 * Math.sin((x - 14) / 292 * 4 * Math.PI);
  const wave = "M" + [...Array(74).keys()].map(j => { const x = 14 + j * 4; return `${x} ${strandY(x).toFixed(1)}`; }).join(" L");
  s += `<path d="${wave}" fill="none" stroke="#2A2530" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>`;
  s += `<path d="${wave}" fill="none" stroke="url(#strandGrad)" stroke-width="15" stroke-linecap="round"/>`;
  s += `<path d="${wave}" fill="none" stroke="#2A2530" stroke-opacity=".22" stroke-width="15" stroke-dasharray="1.6 5"/>`;
  // just below, your skein: undyed cream, taking each colour you dye at its ring's place along the strand
  // each ring where its colour is along the strand (a skein saved before that was kept: spread evenly)
  const at = k => game.pos ? game.pos[k] : game.idx ? game.idx[k] / Math.max(1, L - 1) : k / Math.max(1, n - 1);
  const xs = [...Array(n).keys()].map(k => 14 + 292 * at(k));
  s += `<defs><linearGradient id="mineGrad" gradientUnits="userSpaceOnUse" x1="14" x2="306">${xs.map((x, k) => `<stop offset="${((x - 14) / 292 * 100).toFixed(1)}%" stop-color="${game.dyed[k] ? rgbCss(game.dyed[k].rgb) : "#EFE6D2"}"/>`).join("")}</linearGradient></defs>`;
  const mine = "M" + [...Array(74).keys()].map(j => { const x = 14 + j * 4; return `${x} ${(strandY(x) + 62).toFixed(1)}`; }).join(" L");
  s += `<path d="${mine}" fill="none" stroke="#2A2530" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>`;
  s += `<path d="${mine}" fill="none" stroke="url(#mineGrad)" stroke-width="15" stroke-linecap="round"/>`;
  s += `<path d="${mine}" fill="none" stroke="#2A2530" stroke-opacity=".22" stroke-width="15" stroke-dasharray="1.6 5"/>`;
  // each strand's name under it: the colourway's, then yours
  const label = (y, t) => `<text x="160" y="${y}" text-anchor="middle" font-family="'Baloo 2',system-ui,sans-serif" font-weight="600" font-size="12" fill="#5E5866">${t}</text>`;
  s += label(54, game.way) + label(112, "Your skein");
  for (let k = 0; k < n; k++) {
    const x = xs[k], y = strandY(x).toFixed(1), d = game.dyed[k], now = k === game.at && !game.won;
    s += `<circle cx="${x.toFixed(1)}" cy="${y}" r="12" fill="${d ? rgbCss(d.rgb) : "none"}" stroke="${now ? "#ECA818" : d ? "#2A2530" : "#F7F8F3"}" stroke-width="${now ? 5 : 3}"/>`;
    if (!now && !d) s += `<circle cx="${x.toFixed(1)}" cy="${y}" r="14" fill="none" stroke="#2A2530" stroke-width="1.5" stroke-opacity=".6"/>`;
    if (d && d.perfect) s += `<path d="M${x - 5} ${+y} l3.5 4 l6.5 -8" fill="none" stroke="${inkOn(d.rgb)}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  $("skein").innerHTML = s;
  $("skein").setAttribute("aria-label", `The ${game.way} colourway as a strand of yarn, and your skein below it: ${game.dyed.length} of ${n} colours dyed`);
}
// ink or paper, whichever shows on a colour
function inkOn([r, g, b]) { return .299 * r + .587 * g + .114 * b > 150 ? "#2A2530" : "#F7F8F3"; }
function draw() {
  if (!game) return;
  drawSkein();
  const t = held ? {rgb: held.target} : game.targets[Math.min(game.at, game.targets.length - 1)];
  $("target").style.background = rgbCss(t.rgb);
  $("cup").style.background = held ? rgbCss(held.cup) : drops(game.cup) ? rgbCss(cupRGB()) : "#F7F8F3";
  const e = closeness();
  // no score while you mix: you judge by eye, and hear how close you got once it's dyed
  const n = held ? held.n : drops(game.cup);
  $("match").textContent = n ? `${n} drop${n === 1 ? "" : "s"}` : "Empty";
  $("drops").innerHTML = game.cup.flatMap((n, i) => Array(n).fill(`<i style="background:${POTS[i].hex}"></i>`)).join("");
  const spec = levelSpec(game.level);
  $("pots").innerHTML = POTS.map((p, i) => spec.pots[i] ? `<button class="pot" data-i="${i}" style="background:${p.hex}" aria-label="A drop of ${p.name}"><svg viewBox="0 0 24 24" fill="${p.ink}" stroke="${p.ink}" aria-hidden="true">${p.mark}</svg></button>` : "").join("");
  $("count").textContent = game.won ? "Dyed!" : `Level ${game.level} · colour ${game.at + 1} of ${game.targets.length}`;
  $("dyeBtn").disabled = !playing() || !drops(game.cup);
  $("emptyBtn").disabled = !playing() || !drops(game.cup);
  undo.sync();
  $("hintBtn").disabled = !playing();
  paintHint();
  G.describe($("board"), `Match ${game.way}, colour ${game.at + 1} of ${game.targets.length}. Your mix: ${game.cup.map((n, i) => n ? `${n} ${POTS[i].name}` : "").filter(Boolean).join(", ") || "empty"}.`);
}

/* ---------- the cat ---------- */
const NAPPERS = ["c14-36", "c16-5", "c14-34", "c15-6", "c14-35", "c15-5", "c16-3"];
let napper = G.load("niptrip.cat").cat;
if (!NAPPERS.includes(napper)) { napper = NAPPERS[Math.floor(Math.random() * NAPPERS.length)]; G.save("niptrip.cat", {cat: napper}); }
$("napImg").src = (window.CAT_SRC || {})[napper] || `../cats/${napper}.webp`;
function purr() {
  const n = $("napper"); n.classList.remove("purr"); void n.offsetWidth; n.classList.add("purr");
  setTimeout(() => n.classList.remove("purr"), 1100);
  const f = document.createElement("span"); f.className = "float prr"; f.textContent = "prrr ♥"; n.append(f); setTimeout(() => f.remove(), 2500);
}
$("napper").onclick = purr;

/* ---------- playing ---------- */
const snap = () => JSON.stringify({at: game.at, cup: game.cup, dyed: game.dyed});
// Undo (G.history): each step is the strand as it was (snap), kept in game.history; Restart can be undone too. Not
// while a dyed colour is held up to look at.
const undo = G.history({game: () => game, take: snap, back: (h, g) => Object.assign(g, JSON.parse(h)), can: () => game && !game.won && !held,
  over: () => !playing(), after: () => { draw(); save(); }, restart: true});
function addDrop(i) {
  if (!playing() || !levelSpec(game.level).pots[i]) return;
  game.started = true; undo.push();
  game.cup[i]++; hints.clear(false);
  // even a perfect mix waits for Dye it, so you see it first
  draw(); save();
}
function dye(perfect) {
  const t = game.targets[game.at];
  game.dyed.push({rgb: perfect ? t.rgb : cupRGB(), perfect, drops: drops(game.cup), par: drops(t.d)});
  const p = pct(closeness()), word = perfect ? "Perfect!" : p >= 90 ? "So close!" : p >= 75 ? "Nice!" : "Not quite", tip = perfect ? "" : advice(p);
  G.note(perfect ? (drops(game.cup) === drops(t.d) ? "Perfect, in the fewest drops!" : "Perfect match!") : `${word.endsWith("!") ? word : word + "."}${tip ? ` ${tip} would have matched it better.` : ""}`, 2600);
  popScore(perfect, p >= 75, word, tip);
  if (perfect) purr();
  // the target and your mix stay on the swatches until the score has gone, then the next colour comes in
  held = {target: t.rgb, cup: cupRGB(), n: drops(game.cup)};
  game.at++; game.cup = [0, 0, 0, 0, 0]; save();
  const g = game, done = game.at >= game.targets.length;
  draw();
  setTimeout(() => { if (game !== g) return; held = null; if (done) win(); else draw(); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 1600 : 1650);
}
// How it went, big over the bench: a word (Perfect! in gold, So close!, Nice!, Not quite) and, for a miss, what
// would have made it closer.
function popScore(perfect, good, word, tip) {
  const el = document.createElement("div"); el.setAttribute("aria-hidden", "true");
  el.className = "pop" + (perfect ? " gold" : good ? "" : " low");
  el.innerHTML = `${word}${tip ? `<small>${tip}</small>` : ""}`;
  $("board").append(el); setTimeout(() => el.remove(), 1700);
}
// What would bring the mix in the cup closer: one drop more or less of whichever pot helps most, said as "A little
// more red" when it's close, "More red" when it's further off. Nothing if no one drop helps.
function advice(p) {
  const t = game.targets[game.at].rgb, now = deltaE(paintRGB(game.cup), t), spec = levelSpec(game.level);
  let best = null;
  for (let i = 0; i < 5; i++) for (const step of [1, -1]) {
    if (!spec.pots[i] || game.cup[i] + step < 0) continue;
    const d = game.cup.slice(); d[i] += step; if (!drops(d)) continue;
    const e = deltaE(paintRGB(d), t); if (e < now && (!best || e < best.e)) best = {e, i, step};
  }
  if (!best) return "";
  const what = `${best.step > 0 ? "more" : "less"} ${POTS[best.i].name}`;
  return p >= 75 ? `A little ${what}` : what[0].toUpperCase() + what.slice(1);
}
$("pots").addEventListener("click", e => { const b = e.target.closest(".pot"); if (b) addDrop(+b.dataset.i); });
$("dyeBtn").onclick = () => { if (!playing() || !drops(game.cup)) return; undo.push(); dye(closeness() < PERFECT); };
$("emptyBtn").onclick = () => { if (!playing() || !drops(game.cup)) return; undo.push(); game.cup = [0, 0, 0, 0, 0]; draw(); save(); };
// Restart starts the whole strand again (and costs the gold paw), so once anything's dyed it asks first, and offers
// Empty the cup (free) for just this colour.
function restartStrand() {
  if (undo.restart(g => { Object.assign(g, {at: 0, cup: [0, 0, 0, 0, 0], dyed: []}); G.closeCard(); })) G.note("Back to the start of the strand. Undo brings it back.", 3500);
}
$("restartBtn").onclick = () => {
  if (!playing() || !game.history.length) return;
  if (!game.dyed.length) { $("emptyBtn").onclick(); return; }
  const btns = [["Start the whole strand again", restartStrand, true]];
  if (drops(game.cup)) btns.push(["Empty the cup", () => { G.closeCard(); $("emptyBtn").onclick(); }]);
  btns.push(["Cancel", G.closeCard]);
  G.openCard("Start the whole strand again?", `Every colour you've dyed (${game.dyed.length} so far) goes back to undyed, and it costs the gold paw. If you just want to start this colour again, pick Empty the cup.`, btns);
};
// Keys: the left and right arrows pick a pot, Space adds a drop of it; Enter dyes a close mix, Backspace empties the cup.
const keys = G.gridKeys({
  on: () => playing(), size: () => [levelSpec(game.level).pots.filter(Boolean).length, 1],
  show: i => { document.querySelectorAll(".pot.kbcursor").forEach(p => p.classList.remove("kbcursor")); const p = document.querySelectorAll(".pot")[i]; if (p) p.classList.add("kbcursor"); },
  act: (i, key) => { if (key === "backspace") $("emptyBtn").onclick(); else if (key === "d") $("dyeBtn").onclick(); else addDrop([...document.querySelectorAll(".pot")][i].dataset.i); },
  keys: ["backspace", "d"],
});

/* ---------- hints ---------- */
// Hint: the pot to add next on the way to the fewest-drop recipe (or, if there's already too much of something, which
// one, so you can Undo or empty the cup). Asked again on the same mix, it says the whole recipe.
const hints = G.hinter({game: () => game, key: () => game ? game.at + "/" + game.cup.join() : "", draw: () => paintHint()});
function paintHint() { document.querySelectorAll(".pot.hintcell").forEach(p => p.classList.remove("hintcell")); const m = hints.current(); if (m && m.pot != null) { const p = document.querySelector(`.pot[data-i="${m.pot}"]`); if (p) p.classList.add("hintcell"); } }
$("hintBtn").onclick = () => {
  if (!playing()) return;
  const t = game.targets[game.at].d, c = game.cup;
  const recipe = t.map((n, i) => n ? `${n} ${POTS[i].name}` : "").filter(Boolean).join(", ");
  game.hinted = true; save();
  if (drops(c) && closeness() < PERFECT) { hints.show({}, "That's it: dye it."); return; }
  if (hints.level() >= 1) { hints.show({}, `The recipe: ${recipe}.`); return; }
  const extra = c.findIndex((n, i) => n && !t[i]);
  if (extra >= 0) { hints.show({pot: extra}, `There's ${POTS[extra].name} in the cup, and this colour has none. Undo, or empty the cup.`); return; }
  // the smallest batch of the recipe that holds what's in the cup already
  let s = 1; while (c.some((n, i) => n > s * t[i])) s++;
  const need = t.map((n, i) => s * n - c[i]), i = need.indexOf(Math.max(...need));
  hints.show({pot: i}, `Add a drop of ${POTS[i].name}.`);
};

/* ---------- endings ---------- */
function ballSVG() {
  const cols = game.dyed.map(d => rgbCss(d.rgb)), R = 46;
  let s = `<svg class="ball" viewBox="0 0 120 120" aria-hidden="true"><clipPath id="bc"><circle cx="60" cy="60" r="${R}"/></clipPath><g clip-path="url(#bc)" transform="rotate(-28 60 60)">`;
  cols.forEach((c, k) => { s += `<rect x="0" y="${14 + k * 92 / cols.length}" width="120" height="${92 / cols.length + 1}" fill="${c}"/>`; });
  return s + `</g><path d="M28 50Q60 80 94 52M32 78Q62 56 92 80" fill="none" stroke="#2A2530" stroke-width="2" opacity=".4"/><circle cx="60" cy="60" r="${R}" fill="none" stroke="#2A2530" stroke-width="3"/></svg>`;
}
function win() {
  game.won = true; G.finishClock(game); save(); purr();
  const perfect = game.dyed.filter(d => d.perfect).length, fewest = game.dyed.every(d => d.perfect && d.drops === d.par);
  const next = game.hinted ? game.level : Math.min(MAX_LEVEL, game.level + 1);
  settings.level = next; $("levelSel").value = next; save();
  G.track(`Pawlette dyed level ${game.level}`);
  const gold = fewest && !game.hinted && !game.restarted;
  let text = `You dyed a skein of ${game.way}: ${perfect} of ${game.targets.length} colours a perfect match.`;
  text += game.hinted ? ` You had a hint, so here's another at level ${next}.` : game.level === MAX_LEVEL ? " That's the top level; here's another skein." : ` Next up: level ${next}.`;
  const box = document.createElement("div"); box.innerHTML = ballSVG();
  setTimeout(() => G.winCard(text, () => { G.closeCard(); startLevel(next); }, "Admire the skein", game.result,
    {title: "Wound up!", gold, goldWhy: "Every colour perfect, in the fewest drops, with no hint or restart!", goldTitle: "A perfect skein!", goldPic: [box.firstChild],
     next: next > game.level ? `Next: level ${next}` : "Next skein", after: G.otherSize($("levelSel"), next, startLevel, "Or play a different level:")}), 200);
}

/* ---------- new skeins ---------- */
function startLevel(n) { settings.level = n; $("levelSel").value = n; save(); newGame(); }
function newGame() { game = deal(settings.level); hints.clear(false); draw(); save(); G.track(`Pawlette new skein level ${settings.level}`); helpOnFirstVisit(); }
$("linkBtn").onclick = () => G.sendLink("Pawlette", game && game.won ? `I dyed a skein of ${game.way} in Pawlette. Can you mix the colours?` : "Come and mix paint in Pawlette!", location.origin + location.pathname);

/* ---------- how to play ---------- */
// Shown by doing: drip red into the cup, then yellow, and see orange; then the cup goes back as it was.
function helpOnFirstVisit(again) {
  if (!game || !playing() || document.querySelector(".spot") || (settings.seen && !again)) return;
  const turn = G.yourTurn(() => game, g => { game = g; }, draw), idx = c => levelSpec(game.level).pots.slice(0, c).filter(Boolean).length;
  const pot = c => [[idx(c), 0]];
  // where the pots are: evenly spaced, centred in their row
  const map = () => { const ps = [...document.querySelectorAll(".pot")].map(p => p.getBoundingClientRect()); return {ox: ps[0].left, oy: ps[0].top, cw: ps.length > 1 ? ps[1].left - ps[0].left : ps[0].width, ch: ps[0].height}; };
  G.spotlight({grid: $("pots"), map, w: levelSpec(game.level).pots.filter(Boolean).length, h: 1, done: () => { settings.seen = true; save(); }, steps: [
    {say: "Tap red for a drop of red 🐈", lit: pot(0), ...turn.from, try: {done: () => game.cup[0] > 0},
      enter() { turn.from.enter(); game.cup = [0, 0, 0, 0, 0]; draw(); }},
    {say: "Now a drop of yellow", lit: pot(1), try: {done: () => game.cup[1] > 0, yes: "Orange! Paint mixes like paint"}, leave: turn.upTo.leave},
    {say: "Match each colour in turn", els: [$("target"), $("cup")]},
    {say: "Happy with it? Dye it", els: [$("dyeBtn")]},
    {say: "Stuck? Hint names a drop to add", els: [$("hintBtn")]},
  ]});
}
$("helpBtn").onclick = () => helpOnFirstVisit(true);

for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(levelName(n), n));
$("levelSel").onchange = e => { G.closeCard(); startLevel(+e.target.value); };
$("newBtn").onclick = () => { G.closeCard(); newGame(); };
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : settings.level);
G.nav("pawlette");
G.checkClock(game);
G.setupTimer({name: "pawlette", game: () => game, playing: g => !g.won, save, label: levelName, noun: "level"});
if (!(settings.level >= 1 && settings.level <= MAX_LEVEL)) settings.level = 1;
$("levelSel").value = settings.level;
// Pawlette was Zen and Swipe; Swipe is its own game now (Mew Hue), and Zen became this. Someone whose last game here
// was Swipe is told once where it went.
if (G.load("niptrip.mode").mode === "swipe") {
  G.save("niptrip.mode", {mode: "moved"});
  setTimeout(() => G.openCard("Swipe has moved", "Pawlette's Swipe game is its own game now: Mew Hue, with Willow. Pawlette is for mixing paint.",
    [["Play Mew Hue", () => { location.href = "../mewhue/"; }, true], ["Stay and mix", G.closeCard]]), 400);
}
// a skein already dyed isn't shown again with its win card: coming back deals the next one (settings.level, set at the win)
if (game && game.targets && game.cols && levelSpec(game.level) && !game.won) { draw(); helpOnFirstVisit(); } else if (game && game.won) startLevel(settings.level); else newGame();
</script>
