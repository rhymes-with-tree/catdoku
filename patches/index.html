<style>
/* The board is a quilt: a stitched binding round the edge, dashed seams between patches. */
.board{background:#F3EEDF;border:8px solid #853C68;border-radius:12px;outline:2px dashed rgba(255,244,230,.85);outline-offset:-5px}
.cell{position:relative;cursor:pointer;background-origin:border-box}  /* patterns line up across seams */
.board{position:relative}
.seams{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2}
/* a sewn-on button marks patches that come already sewn */
.cell.pin::before{content:"";position:absolute;left:50%;top:50%;width:36%;height:36%;transform:translate(-50%,-50%);border-radius:50%;
  border:2px solid #2A2530;box-shadow:0 1px 2px rgba(42,37,48,.35);
  background:radial-gradient(circle at 37% 37%,#2A2530 9%,transparent 11%),radial-gradient(circle at 63% 37%,#2A2530 9%,transparent 11%),
    radial-gradient(circle at 37% 63%,#2A2530 9%,transparent 11%),radial-gradient(circle at 63% 63%,#2A2530 9%,transparent 11%),#F6F1E7}
.cell.mine::before{content:"";position:absolute;left:50%;top:50%;width:36%;height:36%;transform:translate(-50%,-50%);border-radius:50%;
  border:2px solid #F6F1E7;box-shadow:0 0 0 2px #2A2530,0 1px 3px rgba(42,37,48,.4);z-index:1;
  background:radial-gradient(circle at 37% 37%,#F6F1E7 9%,transparent 11%),radial-gradient(circle at 63% 37%,#F6F1E7 9%,transparent 11%),
    radial-gradient(circle at 37% 63%,#F6F1E7 9%,transparent 11%),radial-gradient(circle at 63% 63%,#F6F1E7 9%,transparent 11%),#853C68}
.paint .swatch.mine{background:radial-gradient(circle at 39% 39%,#F6F1E7 7%,transparent 9%),radial-gradient(circle at 61% 39%,#F6F1E7 7%,transparent 9%),
    radial-gradient(circle at 39% 61%,#F6F1E7 7%,transparent 9%),radial-gradient(circle at 61% 61%,#F6F1E7 7%,transparent 9%),#853C68}
.cell.clash::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(176,32,48,.6) 0 3px,transparent 3px 9px)}
.paints{display:flex;gap:8px;align-items:flex-start;justify-content:center;flex-wrap:wrap;width:var(--board)}
.paint{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;padding:2px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.paint:hover{background:none}
.paint .swatch{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink)}
.paint[aria-pressed="true"] .swatch{outline:4px solid var(--ink);outline-offset:3px}
.paint[aria-pressed="true"]{color:var(--ink);background:none}
/* Cats: a tabby napping over the quilt's top-right corner, a calico stretching across its bottom-left corner, facing right. */
main{--nw:min(calc(var(--board) * .4), 210px);--sw:min(calc(var(--board) * .5), 260px)}
/* the patch count and fabrics sit just above the quilt, to the left of the tabby */
.status,.paints{box-sizing:border-box;padding-right:calc(var(--nw) * .9)}
.paints{min-height:calc(var(--nw) * .56 - 58px);
  align-content:flex-end;justify-content:flex-start;margin-bottom:-6px}
.wrap{margin:0 0 calc(var(--sw) * .43)}
@media (max-width:480px){.paints{gap:4px 6px}.paint{font-size:11px;padding:2px 0}.paint .swatch{width:38px;height:38px;font-size:17px}}
@media (max-width:400px){.paints{gap:4px 3px}.paint{font-size:10.5px;padding:0}.paint .swatch{width:34px;height:34px}}
.cat{position:absolute;height:auto;pointer-events:none;user-select:none;z-index:3}
.cat.nap{width:var(--nw);right:-2%;bottom:calc(100% - var(--nw) * .22)}
.cat.stretch{width:var(--sw);transform:scaleX(-1);left:max(-16%, calc((var(--board) - 100vw) / 2));top:calc(100% - var(--sw) * .24)}
/* How to play card */
.board.mini{width:170px;height:170px;margin:0 auto 12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}
.board.mini .cell{cursor:default}
.card ol.steps{text-align:left;margin:0 0 14px;padding-left:24px;color:var(--ink);font-size:16px;line-height:1.35}

.card .tip{font-size:14px;margin:0 0 14px}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;user-select:none;white-space:nowrap}

.toggle input:checked + .sw{background:var(--sage-green)}
.toggle input:checked + .sw::after{left:21px}
.toggle input:focus-visible + .sw{outline:3px solid var(--pacific-blue);outline-offset:2px}

<script src="../games.js?v=2026-10-10.5"></script>
<script>
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function nbrs(i,N){const r=Math.floor(i/N),c=i%N,o=[];if(r>0)o.push(i-N);if(r<N-1)o.push(i+N);if(c>0)o.push(i-1);if(c<N-1)o.push(i+1);return o;}
// Grow R connected regions from random seeds.
function randomMap(N,R){
  const reg=new Int16Array(N*N).fill(-1);
  shuffle([...Array(N*N).keys()]).slice(0,R).forEach((s,g)=>reg[s]=g);
  let left=N*N-R;
  while(left>0){
    const cand=[];
    for(let i=0;i<N*N;i++){if(reg[i]!==-1)continue;for(const j of nbrs(i,N))if(reg[j]!==-1)cand.push([i,reg[j]]);}
    const [i,g]=cand[Math.floor(Math.random()*cand.length)];reg[i]=g;left--;
  }
  return Array.from(reg);
}
function adjacency(N,R,reg){
  const adj=Array.from({length:R},()=>new Set());
  for(let i=0;i<N*N;i++)for(const j of nbrs(i,N))if(reg[i]!==reg[j])adj[reg[i]].add(reg[j]);
  return adj.map(s=>[...s]);
}
// Count 4-colourings that agree with the givens (-1 = open), up to limit.
function solveColors(adj,given,limit,randomize){
  const R=adj.length,col=given.slice(),sols=[];
  const order=[...Array(R).keys()].filter(g=>col[g]<0);
  (function go(){
    // most-constrained open region first
    let best=-1,bestOpts=null;
    for(const g of order){if(col[g]>=0)continue;
      const opts=[0,1,2,3].filter(c=>adj[g].every(h=>col[h]!==c));
      if(!bestOpts||opts.length<bestOpts.length){best=g;bestOpts=opts;if(opts.length<=1)break;}}
    if(best<0){sols.push(col.slice());return sols.length>=limit;}
    if(randomize)shuffle(bestOpts);
    for(const c of bestOpts){col[best]=c;if(go()){col[best]=-1;return true;}}
    col[best]=-1;return false;
  })();
  return sols;
}
// Build several candidate maps and keep the one that needs the fewest pre-coloured regions.
function makeFourColor(N,tries=12){
  let best=null;
  for(let t=0;t<tries;t++){const p=makeOneMap(N);if(p&&(!best||p.given.filter(c=>c>=0).length<best.given.filter(c=>c>=0).length))best=p;}
  return best;
}
function makeOneMap(N){
  const R=Math.round(N*N/3.5);
  for(let attempt=0;attempt<50;attempt++){
    const reg=randomMap(N,R),adj=adjacency(N,R,reg);
    const sol=solveColors(adj,new Array(R).fill(-1),1,true)[0];
    if(!sol)continue;
    const given=new Array(R).fill(-1);
    // add givens where another colouring disagrees, until the answer is unique
    for(;;){
      const s=solveColors(adj,given,2,false);
      if(s.length===1)break;
      const other=s.find(x=>x.some((c,g)=>c!==sol[g]));
      const diff=[...Array(R).keys()].filter(g=>given[g]<0&&other[g]!==sol[g]);
      const g=diff[Math.floor(Math.random()*diff.length)];given[g]=sol[g];
    }
    // then drop any given that isn't needed
    for(const g of shuffle([...Array(R).keys()].filter(g=>given[g]>=0))){
      given[g]=-1;if(solveColors(adj,given,2,false).length!==1)given[g]=sol[g];
    }
    return {N,R,reg,adj,sol,given};
  }
  return null;
}

// Four fabrics that differ in pattern as well as color, in the brand colors (polka dot is spring blue).
// Each is CSS background layers on a tile that repeats seamlessly across a patch (see fabricOn).
const FABRICS = [
  {name: "Gingham", tile: 14, bg: "#F3D4C3",
   layers: ["linear-gradient(90deg, rgba(189,85,56,.55) 50%, transparent 50%)", "linear-gradient(0deg, rgba(189,85,56,.55) 50%, transparent 50%)"]},
  {name: "Polka dot", tile: 14, bg: "#4E577D",
   layers: ["radial-gradient(circle, #F4EFE2 20%, transparent 23%)"]},
  {name: "Stripe", tile: 12, bg: "#ECA818",
   layers: ["linear-gradient(90deg, transparent 0 55%, #AC7E35 55% 80%, #FFF4D2 80% 88%, transparent 88%)"]},
  {name: "Zigzag", tile: 16, bg: "#6AA673",
   layers: ["linear-gradient(135deg, #E1E7D3 25%, transparent 25%)", "linear-gradient(225deg, #E1E7D3 25%, transparent 25%)",
            "linear-gradient(315deg, #E1E7D3 25%, transparent 25%)", "linear-gradient(45deg, #E1E7D3 25%, transparent 25%)"],
   shift: [[-.5, 0], [-.5, 0], [0, 0], [0, 0]]},   // layer offsets, as a share of the tile
];
// With fabric patterns off: one flat color per fabric.
const SOLIDS = [{name: "Red", bg: "#BD5538"}, {name: "Blue", bg: "#4E577D"}, {name: "Mustard", bg: "#ECA818"}, {name: "Green", bg: "#6AA673"}];
const MUSLIN = {tile: 4, bg: "#F3EEDF", layers: ["linear-gradient(90deg, rgba(120,98,66,.07) 1px, transparent 1px)", "linear-gradient(0deg, rgba(120,98,66,.07) 1px, transparent 1px)"]};
// Dress an element in a fabric, offset so the pattern runs on unbroken from square to square.
function fabricOn(el, f, dx = 0, dy = 0) {
  el.style.backgroundColor = f.bg;
  const layers = f.layers || [];
  el.style.backgroundImage = layers.join(", ") || "none";
  el.style.backgroundSize = layers.map(() => `${f.tile}px ${f.tile}px`).join(", ");
  el.style.backgroundPosition = layers.map((_, k) => {
    const [sx, sy] = (f.shift || [])[k] || [0, 0];
    return `${sx * f.tile - dx}px ${sy * f.tile - dy}px`;
  }).join(", ");
}
const STORE = "catdoku.patches.v1";
const $ = G.$;
let state = G.load(STORE);
let settings = Object.assign({size: 8, fabric: true}, state.settings);
const look = () => settings.fabric ? FABRICS : SOLIDS;
let game = state.game || null, busy = false, brush = 0;
const build = G.builder([shuffle, nbrs, randomMap, adjacency, solveColors, makeFourColor, makeOneMap], "makeFourColor");
const save = () => G.save(STORE, {settings, game});

const clashes = () => {
  const bad = new Set();
  game.adj.forEach((ns, g) => { if (game.col[g] >= 0) for (const h of ns) if (game.col[h] === game.col[g]) { bad.add(g); bad.add(h); } });
  return bad;
};

// Undo steps keep the fabrics and the player's own buttons (older saves kept just the fabrics).
const mark = () => ({col: game.col.slice(), mine: (game.mine || []).slice()});
function snapshot() { game.history.push(mark()); if (game.history.length > 300) game.history.shift(); }
function undo() {
  if (game.history.length && !game.won) game.undid = true;
  if (!game.history.length || game.won) return;
  const h = game.history.pop();
  if (Array.isArray(h)) game.col = h; else { game.col = h.col; game.mine = h.mine; }
  render(); save();
}
function clearAll() { if (game.won) return; game.undid = true; snapshot(); game.col = game.given.slice(); game.mine = []; render(); save(); }
// The player's own buttons: just notes, in plum, on patches they want to remember. They don't sew a
// patch down; it can still be changed. MINE is the brush that puts one on or takes it off.
const MINE = -2;
function toggleMine(g) {
  if (game.given[g] >= 0) { G.note("That patch is already sewn."); return false; }
  const m = game.mine || (game.mine = []), at = m.indexOf(g);
  if (at >= 0) m.splice(at, 1); else m.push(g);
  return true;
}
// The square nearest the middle of a patch, where its button goes.
function middleOf(g) {
  const N = game.N, cells = game.reg.map((x, i) => x === g ? i : -1).filter(i => i >= 0);
  const cy = cells.reduce((s, i) => s + Math.floor(i / N), 0) / cells.length, cx = cells.reduce((s, i) => s + i % N, 0) / cells.length;
  return cells.reduce((b, i) => (Math.floor(i / N) - cy) ** 2 + (i % N - cx) ** 2 < (Math.floor(b / N) - cy) ** 2 + (b % N - cx) ** 2 ? i : b);
}

// Paint a region. On a tap, painting a region its own color clears it.
function paint(g, isTap) {
  if (game.given[g] >= 0) { if (isTap) G.note("Patches with a button are already sewn and can't be changed."); return false; }
  const c = isTap && game.col[g] === brush ? -1 : brush;
  if (game.col[g] === c) return false;
  game.col[g] = c; return true;
}

const winText = () => `The quilt is finished: ${game.R} patches, and no matching fabrics side by side. Perfect for a nap.`;
// The finishing card: the next puzzle is a size up, and any other size can be picked instead.
const finishCard = () => G.winCard(winText(), newPuzzle, "Admire my quilt", game.result, {gold: !game.undid, goldWhy: "No undos!", 
  next: `Next puzzle (${settings.size} × ${settings.size})`,
  after: G.otherSize($("size"), settings.size, n => { settings.size = n; $("size").value = n; save(); newPuzzle(); })});
function checkWin() {
  if (game.col.every(c => c >= 0) && !clashes().size) {
    game.won = true; G.finishClock(game); save(); render();
    G.track(`Patches solved ${game.N}x${game.N}`);
    // A win moves the next puzzle up a size (there are no clues or lives to hold it back here).
    settings.size = G.sizeUp(game.N, $("size")); $("size").value = settings.size; save(); build.prefetch(settings.size);
    const done = game;   // let the finished quilt show for a moment first
    setTimeout(() => { if (game === done) finishCard(); }, 1200);
  }
}

async function newPuzzle() {
  if (busy) return;
  busy = true;
  const N = settings.size;
  G.openCard("Cutting patches…", "", []);
  const p = await build.take(N);
  game = {N, R: p.R, reg: p.reg, adj: p.adj, given: p.given, col: p.given.slice(), history: [], won: false, ...G.freshClock()};
  busy = false;
  G.closeCard(); buildBoard(); render(); save(); G.note("");
  G.track(`Patches new puzzle ${N}x${N}`);
  build.prefetch(N);
}

// Seams between patches, drawn as stitching: one SVG over the board, with runs joined so the dashes flow.
function drawSeams(b, reg, N, W) {
  const s = W / N, runs = [];
  for (let r = 1; r < N; r++) for (let c = 0; c < N; c++) if (reg[r * N + c] !== reg[(r - 1) * N + c]) {
    const last = runs[runs.length - 1];
    if (last && last.h && last.y === r && last.x2 === c) last.x2 = c + 1; else runs.push({h: 1, y: r, x1: c, x2: c + 1});
  }
  for (let c = 1; c < N; c++) for (let r = 0; r < N; r++) if (reg[r * N + c] !== reg[r * N + c - 1]) {
    const last = runs[runs.length - 1];
    if (last && !last.h && last.x === c && last.y2 === r) last.y2 = r + 1; else runs.push({h: 0, x: c, y1: r, y2: r + 1});
  }
  const d = runs.map(q => q.h ? `M${q.x1 * s} ${q.y * s}H${q.x2 * s}` : `M${q.x * s} ${q.y1 * s}V${q.y2 * s}`).join("");
  let svg = b.querySelector(".seams");
  if (!svg) { b.insertAdjacentHTML("beforeend", '<svg class="seams" aria-hidden="true"></svg>'); svg = b.querySelector(".seams"); }
  svg.setAttribute("viewBox", `0 0 ${W} ${W}`);
  svg.innerHTML = `<path d="${d}" fill="none" stroke="rgba(255,249,238,.6)" stroke-width="4.5"/>` +
    `<path d="${d}" fill="none" stroke="#2A2530" stroke-opacity=".85" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/>`;
}

function buildBoard() {
  const N = game.N, b = $("board"), reg = game.reg;
  b.innerHTML = ""; render.w = 0;
  b.style.gridTemplateColumns = b.style.gridTemplateRows = `repeat(${N}, minmax(0, 1fr))`;
  // a dot in the most central cell of each pre-painted region
  const pins = new Set();
  for (let g = 0; g < game.R; g++) {
    if (game.given[g] < 0) continue;
    const cells = reg.map((x, i) => x === g ? i : -1).filter(i => i >= 0);
    const cy = cells.reduce((s, i) => s + Math.floor(i / N), 0) / cells.length, cx = cells.reduce((s, i) => s + i % N, 0) / cells.length;
    pins.add(cells.reduce((b, i) => (Math.floor(i / N) - cy) ** 2 + (i % N - cx) ** 2 < (Math.floor(b / N) - cy) ** 2 + (b % N - cx) ** 2 ? i : b));
  }
  for (let i = 0; i < N * N; i++) {
    const el = document.createElement("div");
    el.className = "cell";
    if (pins.has(i)) el.classList.add("pin");
    el.dataset.i = i; el.setAttribute("role", "gridcell");
    b.append(el);
  }
  $("size").value = N;
}

function render() {
  const bad = clashes(), kids = $("board").children, N = game.N, W = $("board").clientWidth, step = W / N || 40;
  const mineAt = new Set((game.mine || []).map(middleOf));
  if (W && W !== render.w) { drawSeams($("board"), game.reg, N, W); render.w = W; }
  for (let i = 0; i < N * N; i++) {
    const g = game.reg[i], c = game.col[g];
    fabricOn(kids[i], c >= 0 ? look()[c] : MUSLIN, (i % N) * step, Math.floor(i / N) * step);
    kids[i].classList.toggle("clash", bad.has(g));
    kids[i].classList.toggle("mine", mineAt.has(i));
    kids[i].setAttribute("aria-label", `Row ${Math.floor(i / N) + 1}, column ${i % N + 1}: ${c >= 0 ? look()[c].name : "plain muslin"}${game.given[g] >= 0 ? ", already sewn" : ""}`);
  }
  const done = game.col.filter(c => c >= 0).length;
  $("count").textContent = `🧵 ${done} / ${game.R} patches`;
  if (bad.size) G.note(`${bad.size} patches match a neighbor.`, 0); else if ($("msg").textContent.includes("match a neighbor")) G.note("");
  $("undoBtn").disabled = !game.history.length || game.won;
  $("clearBtn").disabled = game.won || (game.col.every((c, g) => c === game.given[g]) && !(game.mine || []).length);
  [...$("paints").children].forEach((b, k) => b.setAttribute("aria-pressed", k === brush || (brush === MINE && k === look().length)));
}

/* ---------- input ---------- */
// Fabric swatches; tapping a patch again takes its fabric off.
function swatchButton(label, dress, onPick) {
  const b = document.createElement("button"), sw = document.createElement("span"), tx = document.createElement("span");
  b.className = "paint"; sw.className = "swatch"; dress(sw); tx.textContent = label;
  b.append(sw, tx); b.onclick = () => { onPick(); if (game) render(); };
  $("paints").append(b);
}
function buildSwatches() {
  $("paints").innerHTML = "";
  look().forEach((f, k) => swatchButton(f.name, sw => fabricOn(sw, f), () => { brush = k; }));
  swatchButton("Mine", sw => sw.classList.add("mine"), () => {
    brush = MINE;
    // the first time, say what they're for
    if (!settings.seenMine) { settings.seenMine = true; save(); G.note("Your own buttons are notes for you: tap a patch to mark it, and again to take the button off. They don't sew it down.", 7000); }
  });
}
buildSwatches();
$("fabricTgl").checked = settings.fabric;
$("fabricTgl").onchange = e => { settings.fabric = e.target.checked; save(); buildSwatches(); if (game) render(); };
window.addEventListener("resize", () => { if (game) render(); });

let press = null;
const board = $("board");
board.addEventListener("pointerdown", e => {
  if (!game || game.won || busy) return;
  const i = G.cellAt(e.clientX, e.clientY); if (i < 0) return;
  e.preventDefault();
  try { board.setPointerCapture(e.pointerId); } catch (_) {}
  press = {start: game.reg[i], last: game.reg[i], drag: false, before: mark()};
});
board.addEventListener("pointermove", e => {
  if (!press) return;
  const i = G.cellAt(e.clientX, e.clientY); if (i < 0) return;
  const g = game.reg[i];
  if (g === press.last || brush === MINE) return;
  if (!press.drag) { press.drag = true; paint(press.start, false); }
  press.last = g; paint(g, false); render();
});
function endPress() {
  if (!press) return;
  const p = press; press = null;
  if (!p.drag) { if (brush === MINE) toggleMine(p.start); else paint(p.start, true); }
  const now = mark();
  if (p.before.col.join() !== now.col.join() || p.before.mine.join() !== now.mine.join()) { game.history.push(p.before); if (game.history.length > 300) game.history.shift(); }
  render(); save(); checkWin();
}
board.addEventListener("pointerup", endPress);
board.addEventListener("pointercancel", () => { if (press) { game.col = press.before.col; game.mine = press.before.mine; press = null; render(); } });

$("newBtn").onclick = newPuzzle;
$("size").onchange = e => { settings.size = +e.target.value; save(); newPuzzle(); };
$("undoBtn").onclick = undo;
$("clearBtn").onclick = clearAll;

/* ---------- how to play ---------- */
// A small finished quilt: five patches in four fabrics, two of them with buttons.
function exampleQuilt() {
  const reg = [0,0,1,1, 0,2,2,1, 3,2,4,4, 3,3,4,4], fab = [0, 1, 2, 3, 0], pins = [3, 12];
  const q = document.createElement("div"); q.className = "board mini"; q.setAttribute("aria-hidden", "true");
  const step = (170 - 16) / 4;
  reg.forEach((g, i) => {
    const r = Math.floor(i / 4), c = i % 4, el = document.createElement("div");
    el.className = "cell";
    if (pins.includes(i)) el.classList.add("pin");
    fabricOn(el, look()[fab[g]], c * step, r * step);
    q.append(el);
  });
  drawSeams(q, reg, 4, 170 - 16);
  return q;
}
function showHelp() {
  const media = document.createElement("div");
  media.append(exampleQuilt());
  const ol = document.createElement("ol"); ol.className = "steps";
  for (const t of ["Give every patch one of the four fabrics.",
                   "Patches that share a seam can't match. Patches may touch at a corner.",
                   "Patches with a button are already sewn and can't be changed."]) {
    const li = document.createElement("li"); li.textContent = t; ol.append(li);
  }
  const tip = document.createElement("p"); tip.className = "tip";
  tip.textContent = "Pick a fabric, then tap or drag across patches. Tap a patch again to take it off. Matching patches side by side get red hatching. Pick Mine to put your own plum buttons on patches: they're just notes for you, to remember what you're sure of, and don't change anything.";
  media.append(ol, tip);
  G.openCard("How to play", "", [["Show me on the board", () => { G.closeCard(); settings.seenHelp = false; helpOnFirstVisit(); }, true],
    ["Got it", () => { G.closeCard(); settings.seenHelp = true; save(); }]], media);
}
// First visit only: once the first quilt is on the board, walk through the rules on it. Two steps show
// fabric on patches just while they're up (nothing is saved): a patch matching the neighbour it shares
// a seam with, and two patches that only meet at a corner in the same fabric.
function spotlightSteps() {
  const N = game.N, at = k => [k % N, Math.floor(k / N)], cellsOf = g => game.reg.flatMap((r, k) => r === g ? [at(k)] : []);
  const mid = g => Math.min(...cellsOf(g).map(([x, y]) => Math.abs(x - (N - 1) / 2) + Math.abs(y - (N - 1) / 2)));
  const open = [...game.given.keys()].filter(g => game.given[g] < 0).sort((a, b) => mid(a) - mid(b));
  const a = open[0];
  // try it on: show some patches in some fabrics while a step is up, then put the quilt back
  const tryOn = fab => { let before; return {enter: () => { before = game.col.slice(); for (const [g, f] of fab) game.col[g] = f; render(); },
                                              leave: () => { game.col = before; render(); }}; };
  // an empty patch beside a sewn one (or another empty one), and the seam between them
  const sewnNext = open.map(g => [g, game.adj[g].find(h => game.given[h] >= 0)]).find(([, h]) => h !== undefined);
  const [m, n] = sewnNext || [a, game.adj[a][0]], f = game.given[n] >= 0 ? game.given[n] : 0;
  const seam = [];
  for (let k = 0; k < N * N; k++) {
    const [x, y] = at(k);
    if (game.reg[k] !== m) continue;
    if (x + 1 < N && game.reg[k + 1] === n) seam.push([x + 1, y, x + 1, y + 1]);
    if (x > 0 && game.reg[k - 1] === n) seam.push([x, y, x, y + 1]);
    if (y + 1 < N && game.reg[k + N] === n) seam.push([x, y + 1, x + 1, y + 1]);
    if (y > 0 && game.reg[k - N] === n) seam.push([x, y, x + 1, y]);
  }
  // two patches that only meet at a corner, not both sewn in different fabrics
  let corner = null;
  for (let k = 0; k < N * N && !corner; k++) {
    const [x, y] = at(k);
    for (const dx of [-1, 1]) {
      if (y + 1 >= N || x + dx < 0 || x + dx >= N) continue;
      const g = game.reg[k], h = game.reg[(y + 1) * N + x + dx];
      if (g === h || game.adj[g].includes(h) || (game.given[g] >= 0 && game.given[h] >= 0)) continue;
      corner = [g, h]; break;
    }
  }
  const buttons = [...game.given.keys()].filter(g => game.given[g] >= 0);
  const steps = [
    {say: "Give every patch a fabric", lit: cellsOf(a)},
    {say: "Patches that share a seam can't match", lit: [...cellsOf(m), ...cellsOf(n)], outline: [], lines: [{edges: seam}],
     ...tryOn([[m, f], ...(game.given[n] >= 0 ? [] : [[n, f]])])},
  ];
  if (corner) {
    const [g, h] = corner, cf = game.given[g] >= 0 ? game.given[g] : game.given[h] >= 0 ? game.given[h] : 1;
    steps.push({say: "Corners are OK", lit: [...cellsOf(g), ...cellsOf(h)], outline: [cellsOf(g), cellsOf(h)], tone: "ok",
                ...tryOn([g, h].filter(x => game.given[x] < 0).map(x => [x, cf]))});
  }
  if (buttons.length) steps.push({say: "Buttons are already sewn", lit: buttons.flatMap(cellsOf), outline: buttons.map(cellsOf)});
  const sw = [...$("paints").children];
  steps.push({say: "Pick a fabric", els: [sw.slice(0, 4)]},
             {say: "Then tap or drag across patches", lit: cellsOf(a)},
             {say: "Add your own buttons as notes", els: [sw[4]]});
  return steps;
}
function helpOnFirstVisit() {
  if (settings.seenHelp || !game || game.won || document.querySelector(".spot")) return;
  G.spotlight({grid: $("board"), w: game.N, h: game.N, steps: spotlightSteps(), done: () => { settings.seenHelp = true; save(); }});
}
$("helpBtn").onclick = () => { if (!busy) showHelp(); };
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); } });

G.nav("patches");
G.checkClock(game);
G.setupTimer({name: "patches", game: () => game, playing: g => !g.won, save});
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.N : settings.size);

/* ---------- sharing ---------- */
$("shareBtn").onclick = () => { if (game && !busy) G.shareCard({name: "Patches", won: game.won,
  puzzle: () => ({g: "patches", N: game.N, R: game.R, reg: game.reg, given: game.given}),
  progress: () => ({col: game.col})}); };
// A puzzle from a share link, with its fabrics so far if they were sent (that isn't timed).
function openShared(d) {
  game = {N: d.N, R: d.R, reg: d.reg, adj: adjacency(d.N, d.R, d.reg), given: d.given,
          col: d.p ? d.p.col : d.given.slice(), history: [], won: false, ...G.freshClock()};
  if (d.p) game.timed = false;
  settings.size = d.N; buildBoard(); render(); save(); G.note(""); build.prefetch(d.N);
  if (d.p) checkWin();
}
const shared = G.readShare("patches");
$("size").value = settings.size;
if (game && game.reg) G.reopen(() => { buildBoard(); render(); if (game.won) finishCard(); build.prefetch(game.N); helpOnFirstVisit(); },
  why => { game = null; busy = false; newPuzzle().then(() => G.note(why, 0)); });
else if (!shared) newPuzzle().then(helpOnFirstVisit);
const shareOpts = () => ({name: "Patches", inProgress: !!(game && game.reg && !game.won && game.history.length), open: openShared, after: helpOnFirstVisit});
if (shared) G.offerShare(shared, shareOpts());
// A share link opened while this page is already showing only changes the address, so watch for it.
window.addEventListener("hashchange", () => { const d = G.readShare("patches"); if (d) G.offerShare(d, shareOpts()); });
</script>
