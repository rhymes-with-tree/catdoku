:root{--board:min(94vw,520px); --gold:#E0A526}
.tabletop{width:var(--board);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.tabletop svg{display:block;width:100%;height:auto}
.key{width:var(--board);display:flex;flex-direction:column;gap:8px}
.key h3{margin:0;font-size:16px;font-weight:800;text-align:center}
.key .row{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 14px;font-size:14px;font-weight:600}
.key span{display:flex;align-items:center;gap:2px;white-space:nowrap}
.key svg{width:34px;height:34px}

.thing{transition:transform .12s linear}
.thing .art{transform-box:fill-box;transform-origin:center;transition:transform .45s ease-in,opacity .45s ease-in}

.crash{animation:crash .7s ease-out forwards;transform-box:fill-box;transform-origin:center}

.hintArrow{animation:nudge .5s ease-in-out 3 alternate}
@keyframes nudge{to{opacity:.35}}
.still .thing,.still .thing .art,.still .cat .face{transition:none}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker .35s ease-in-out infinite alternate}
@keyframes flicker{from{transform:scale(1,1)}to{transform:scale(.92,1.08)}}
.key .keynote{margin:0;font-size:14px;color:var(--ink-soft);text-align:center}
.cat .face.spin{animation:spin .55s ease-in-out}
@keyframes spin{to{transform:rotate(calc(var(--a) + 720deg))}}

.card ol.steps{text-align:left;margin:0 0 14px;padding-left:24px;color:var(--ink);font-size:16px;line-height:1.35}
.card ol.steps li{margin:0 0 8px}
.card .tip{font-size:14px;margin:0 0 14px}

/* ---------- game ---------- */
const STORE = "catdoku.knockitoff.v1", MAX_LEVEL = 20;
const $ = G.$;

const packs = new Map();
function loadPack(n) {
  if (!packs.has(n)) packs.set(n, fetch(`tables/${String(n).padStart(2, "0")}.json?v=2026-10-10.1`)

  return packs.get(n);
}
// Squares are written as two base-36 digits; things as a letter then their square.
function unpack(o, n) {
  const cells = s => (s || "").match(/../g)?.map(x => parseInt(x, 36)) || [], W = o.w, H = o.h, on = new Array(W * H).fill(1);
  for (const c of cells(o.o)) on[c] = 0;

async function dealTable(n) {
  const list = await loadPack(n);
  if (!list) return build.take(n);
  // pick one not played yet on this device; once they've all been played, start over
  const played = new Set((settings.played || {})[n] || []);
  if (played.size >= list.length) played.clear();
  const left = list.map((_, i) => i).filter(i => !played.has(i)), pick = left[Math.floor(Math.random() * left.length)];

function el(parent, tag, attrs, html) {
  const e = document.createElementNS(NS, tag);

function drawTable() {
  const svg = $("svg"), {W, H} = game, on = (x, y) => x >= 0 && y >= 0 && x < W && y < H && game.on[y * W + x];

  svg.innerHTML = `<defs><pattern id="grain" width="100" height="24" patternUnits="userSpaceOnUse"><rect width="100" height="24" fill="#D6A777"/>
    <path d="M0 6 Q25 3 50 7 T100 5 M0 17 Q30 20 60 16 T100 18" fill="none" stroke="#C4915F" stroke-width="2"/></pattern></defs>`;
  const g = el(svg, "g", {});
  // walls first, so the table edge sits on top of them; a wall only runs beside squares of table
  const ww = 26, wall = (x, y, w, h) => el(g, "rect", {x, y, width: w, height: h, fill: "#A7A39C"});
  let wallEdge = "", seams = "", edge = "";
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (on(x, y)) {
    const X = x * U, Y = y * U;
    if (y === 0 && game.walls & 1) { wall(X - 1, -ww, U + 2, ww); wallEdge += `M${X} ${-ww} h${U}`; }
    if (y === H - 1 && game.walls & 2) { wall(X - 1, H * U, U + 2, ww); wallEdge += `M${X} ${H * U + ww} h${U}`; }
    if (x === 0 && game.walls & 4) { wall(-ww, Y - 1, ww, U + 2); wallEdge += `M${-ww} ${Y} v${U}`; }
    if (x === W - 1 && game.walls & 8) { wall(W * U, Y - 1, ww, U + 2); wallEdge += `M${W * U + ww} ${Y} v${U}`; }
  }
  el(g, "path", {d: wallEdge, stroke: "#2A2530", "stroke-width": 3, fill: "none"});
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (on(x, y)) {
    const X = x * U, Y = y * U;

    (tape ? `<p class="keynote">The cat won't step on tape, and rolling things stop on it. Anything on tape is out of reach${game.items.some(it => it.k === "p") ? ", unless there's paper over it" : ""}.</p>` : "");

/* ---------- new tables ---------- */

  const t = await dealTable(N);
  game = {v: 2, N, W: t.W, H: t.H, on: t.on, walls: t.walls, cat: t.cat, items: t.items, nip: t.nip || [], tape: t.tape || [], best: t.best,

/* ---------- input ---------- */

  if (e.ctrlKey || e.metaKey || e.altKey || /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;

const squareAt = (cx, cy) => {

    const [x, y] = xy(it.c), d = STEP.findIndex(([dx, dy]) => on(x - dx, y - dy) && !taken.has((y - dy) * W + x - dx) && on(x + dx, y + dy));
    if (d < 0) continue;
    const [dx, dy] = STEP[d], from = [x - dx, y - dy];
    steps.push({say: "Walk into a thing to push it", lit: [from, [x, y]], outline: [[from], [[x, y]]], ...arrange(from[1] * W + from[0], d)});
    break;
  }
  // two things in a row in front of the cat: the far one blocks the push
  if (pushable.length >= 2) {
    const [a, b] = pushable, free = c => !taken.has(c) || c === game.cur.cat || c === a.c || c === b.c;
    let row = null;
    for (let y = 0; y < H && !row; y++) for (let x = 0; x + 2 < W && !row; x++)
      if ([0, 1, 2].every(k => on(x + k, y) && free(y * W + x + k))) row = [x, y];
    if (row) {
      const [x, y] = row;
      steps.push({say: "You can only push one thing at a time", lit: [[x, y], [x + 1, y], [x + 2, y]], outline: [[[x, y]], [[x + 1, y]], [[x + 2, y]]],
                  marks: [[x + 2, y, "❌", 0.8]], ...arrange(y * W + x, 3, [[a.id, y * W + x + 1], [b.id, y * W + x + 2]])});
    }
  }
  steps.push({say: "Use the fewest moves for a gold paw", els: [$("count")]},
             {say: "Stuck? Hint shows the next step", els: [$("hintBtn")]});
  return steps;
}
// The first time each new kind of thing turns up on this device, it gets a spotlight of its own.
const NEW_THINGS = [
  {key: "lemon", say: "The cat won't touch a lemon", cells: () => game.cur.items.filter(it => it.k === "l").map(it => it.c)},
  {key: "books", say: "Books are heavy and won't move", cells: () => game.cur.items.filter(it => it.k === "b").map(it => it.c)},
  {key: "roll", say: "Balls of yarn and pencils roll until they hit something", cells: () => game.cur.items.filter(it => kioCls(it.k) === 1).map(it => it.c)},
  {key: "walls", say: "Walls stop things from falling off", cells: () => wallCells(), shapes: () => wallShapes()},
  {key: "bowl", say: "Keep your food bowl on the table", cells: () => game.cur.items.filter(it => it.k === "f").map(it => it.c)},
  {key: "shape", say: "Tables come in new shapes", cells: () => game.on.some(v => !v) ? game.on.flatMap((v, c) => v ? [c] : []) : []},
  {key: "candle", say: `If you knock over a candle, you have ${kioFireMoves()} moves to knock water on the floor`, cells: () => game.cur.items.filter(it => it.k === "c").map(it => it.c)},
  {key: "nip", say: "Don't be tempted by the catnip! It will slow you down.", cells: () => game.nip || []},
  {key: "tape", say: "The cat won't step on tape", cells: () => game.tape || []},
  {key: "paper", say: "Depending on the direction you push it, paper towels unroll! Unrolled paper towels can cover tape.", cells: () => game.cur.items.filter(it => it.k === "p").map(it => it.c)},
];
// The walls themselves, as shapes on the page: one strip along each walled side.
function wallShapes() {
  const {W, H} = game, m = spotMap(), ww = 26, px = v => m.ox + v / U * m.cw, py = v => m.oy + v / U * m.ch, out = [];
  const rect = (x0, y0, x1, y1) => out.push({poly: [[px(x0), py(y0)], [px(x1), py(y0)], [px(x1), py(y1)], [px(x0), py(y1)]]});
  const span = cs => [Math.min(...cs), Math.max(...cs) + 1];
  const row = y => [...Array(W).keys()].filter(x => game.on[y * W + x]), col = x => [...Array(H).keys()].filter(y => game.on[y * W + x]);
  if (game.walls & 1 && row(0).length) { const [a, b] = span(row(0)); rect(a * U, -ww, b * U, 0); }
  if (game.walls & 2 && row(H - 1).length) { const [a, b] = span(row(H - 1)); rect(a * U, H * U, b * U, H * U + ww); }
  if (game.walls & 4 && col(0).length) { const [a, b] = span(col(0)); rect(-ww, a * U, 0, b * U); }
  if (game.walls & 8 && col(W - 1).length) { const [a, b] = span(col(W - 1)); rect(W * U, a * U, W * U + ww, b * U); }
  return out;
}
// The squares along walled sides.
function wallCells() {
  const {W, H} = game, out = [];
  for (let c = 0; c < W * H; c++) {
    if (!game.on[c]) continue;
    const x = c % W, y = Math.floor(c / W);
    if ((y === 0 && game.walls & 1) || (y === H - 1 && game.walls & 2) || (x === 0 && game.walls & 4) || (x === W - 1 && game.walls & 8)) out.push(c);
  }
  return out;
}
// The spotlight steps for the special things on this table (all of them, or only ones not seen yet).
const thingSteps = onlyNew => NEW_THINGS.filter(n => !(onlyNew && (settings.seenThings || {})[n.key]) && n.cells().length)
  .map(n => n.shapes ? {say: n.say, shapes: n.shapes, key: n.key} : {say: n.say, lit: n.cells().map(xy), outline: n.cells().map(c => [xy(c)]), key: n.key});
const markSeen = steps => { const seen = settings.seenThings || (settings.seenThings = {}); for (const s of steps) if (s.key) seen[s.key] = true; save(); };
function newThings() {
  if (!game || game.won || !settings.seenHelp || document.querySelector(".spot")) return;
  const steps = thingSteps(true);
  if (steps.length) G.spotlight({grid: $("svg"), w: game.W, h: game.H, map: spotMap, steps, done: () => markSeen(steps)});
}
// Press and hold a special thing (or catnip, tape, a wall square) to see its spotlight again.
function thingAt(c) { return NEW_THINGS.find(n => n.key !== "shape" && n.cells().includes(c)); }
function explainAt(c) {
  const n = thingAt(c); if (!n || document.querySelector(".spot")) return false;
  G.spotlight({grid: $("svg"), w: game.W, h: game.H, map: spotMap, finish: false,
    steps: [n.shapes ? {say: n.say, shapes: n.shapes} : {say: n.say, lit: n.cells().map(xy), outline: n.cells().map(c => [xy(c)])}]});
  return true;
}
// The first visit walks through the basics; "Show me on the board" also runs through every special thing
// on the table that's out.
function helpOnFirstVisit(all) {
  if ((settings.seenHelp && !all) || !game || game.won || document.querySelector(".spot")) return;
  const extra = all ? thingSteps(false) : [];
  G.spotlight({grid: $("svg"), w: game.W, h: game.H, map: spotMap, steps: [...spotlightSteps(), ...extra],
    done: () => { settings.seenHelp = true; markSeen(extra); }});
}
// Players from before these spotlights had seen the How to play card, which covers everything; they
// only get spotlights for things on levels past the one they're on.
if (settings.seenHelp && !settings.seenThings) {
  const by = {budge: 2, roll: 3, walls: 4, bowl: 5, shape: 6, candle: 7, nip: 8, tape: 9, paper: 10};
  settings.seenThings = Object.fromEntries(Object.entries(by).filter(([, n]) => n <= settings.level).map(([k]) => [k, true]));
}

G.nav("knockitoff");
G.checkClock(game);
G.setupTimer({name: "knockitoff", game: () => game, playing: g => !g.won, save,
  label: n => `Level ${n}`, noun: "level", emptyText: "Clear a table and your times will show up here. They're kept on this device only."});
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.N : settings.level);

/* ---------- sharing ---------- */
$("shareBtn").onclick = () => { if (game && !busy) G.shareCard({name: "Knock It Off", won: game.won,
  puzzle: () => ({g: "knockitoff", v: 2, N: game.N, W: game.W, H: game.H, on: game.on, walls: game.walls, cat: game.cat, items: game.items, nip: game.nip || [], tape: game.tape || [], best: game.best}),
  progress: () => ({cur: game.cur})}); };
// A table from a share link, with the moves so far if they were sent (that isn't timed).
function openShared(d) {
  if (!d.v && Array.isArray(d.items)) lemonsForLamps(d);
  const okCell = c => Number.isInteger(c) && c >= 0 && c < d.W * d.H && d.on[c];
  const okItems = a => Array.isArray(a) && a.every(it => it && Number.isInteger(it.id) && KINDS[it.k] && okCell(it.c) && (it.k !== "p" || [0, 1, 2, 3].includes(it.u)));
  if (!(d.N >= 1 && d.N <= MAX_LEVEL) || !(d.W >= 3 && d.W <= 12 && d.H >= 3 && d.H <= 12) || !Array.isArray(d.on) || d.on.length !== d.W * d.H ||
      !okCell(d.cat) || !okItems(d.items) || !Number.isInteger(d.best)) { G.note("That share link didn't work. It may have been cut off.", 6000); return; }
  const cur = d.p && d.p.cur && okCell(d.p.cur.cat) && okItems(d.p.cur.items) ? d.p.cur : {cat: d.cat, items: d.items, face: 0, moves: 0, fire: 0};
  const fire = Math.max(0, Math.min(kioFireMoves(), cur.fire | 0)), fireAt = fire && Array.isArray(cur.fireAt) && cur.fireAt.length === 2 && cur.fireAt.every(Number.isFinite) ? cur.fireAt : null;
  const nip = Array.isArray(d.nip) ? d.nip.filter(okCell) : [], tape = Array.isArray(d.tape) ? d.tape.filter(c => okCell(c) && c !== d.cat) : [];
  game = {v: 2, N: d.N, W: d.W, H: d.H, on: d.on, walls: d.walls | 0, cat: d.cat, items: d.items, nip, tape, best: d.best,
          cur: {cat: cur.cat, items: cur.items, face: cur.face | 0, moves: cur.moves | 0, fire: fireAt ? fire : 0, fireAt,
                paper: Array.isArray(cur.paper) ? cur.paper.filter(okCell) : [], tail: Math.max(0, Math.min(12, cur.tail | 0))}, history: [], hinted: false, won: false, broke: false, ...G.freshClock()};
  if (d.p) game.timed = false;
  settings.level = d.N; $("levelSel").value = d.N;
  drawTable(); save(); prefetch(d.N);
  if (kioClear(game.cur.items, game.cur.fire)) { game.won = true; status(); }
}
const shared = G.readShare("knockitoff");
$("levelSel").value = settings.level;
// Tables from before lemons had lamps that wouldn't budge; those lamps become lemons so the table plays the same.
function lemonsForLamps(t) {
  const swap = items => items.map(it => it.k === "L" ? {...it, k: "l"} : it);
  t.items = swap(t.items);
  if (t.cur) t.cur.items = swap(t.cur.items);
  if (t.history) t.history = t.history.map(h => h.replace(/"k":"L"/g, '"k":"l"'));
  if (t.p && t.p.cur && Array.isArray(t.p.cur.items)) t.p.cur.items = swap(t.p.cur.items);
  t.v = 2;
}
if (game && game.cur && !game.v) lemonsForLamps(game);
if (game && game.cur) G.reopen(() => {
    drawTable();
    if (game.won) finishCard(); else if (game.broke) brokeCard();
    prefetch(settings.level); helpOnFirstVisit();
  }, why => { game = null; busy = false; newTable().then(() => G.note(why, 0)); });
else if (!shared) newTable().then(helpOnFirstVisit);
const shareOpts = () => ({name: "Knock It Off", inProgress: !!(game && !game.won && game.history.length), open: openShared, after: helpOnFirstVisit});
if (shared) G.offerShare(shared, shareOpts());
// A share link opened while this page is already showing only changes the address, so watch for it.
window.addEventListener("hashchange", () => { const d = G.readShare("knockitoff"); if (d) G.offerShare(d, shareOpts()); });
</script>
