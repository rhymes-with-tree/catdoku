  fetch("../version.txt?t=" + Date.now(), {cache: "no-store"}).then(function (r) { return r.ok ? r.text() : ""; }).then(function (v) {
    v = v.trim(); var tried = null;
    try { tried = sessionStorage.getItem("catdoku.reloadedFor"); } catch (e) {}

<link rel="icon" href="../favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#ECEEE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1C24" media="(prefers-color-scheme: dark)">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&display=swap" rel="stylesheet">

<style>
/* Blocks of paint on a drop cloth. Swipe and they all slide. Red, yellow and blue each have a mark (a bar
   down, a bar across, a ring); when two different ones bump they mix, and the mix carries both marks. Orange,
   green and purple are full, with two marks each, so they stay put: line up a whole row or column of one colour
   to clear it. Three licks a game take one block away. */
.cloth{background:color-mix(in srgb,#2A2530 8%,#F7F8F3);border:3px solid var(--ink);border-radius:12px;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none}
.cloth .grid{position:absolute;inset:2%;outline:none}
.slot{position:absolute;width:20%;height:20%;display:grid;place-items:center}
.slot::before{content:"";width:84%;height:84%;border-radius:18%;background:color-mix(in srgb,#2A2530 6%,transparent)}
.blk{position:absolute;left:0;top:0;width:20%;height:20%;transition:transform .12s ease-out;pointer-events:none}
.blk .b{position:absolute;inset:8%;border-radius:18%;display:grid;place-items:center;
  box-shadow:inset 0 -4px 0 rgba(42,37,48,.2),0 2px 3px rgba(42,37,48,.25)}
.blk .b svg{width:52%;height:52%}
/* the mixes are finished: a glossy edge says they're done */
.blk.full .b{box-shadow:inset 0 0 0 3px rgba(247,248,243,.75),inset 0 -4px 0 rgba(42,37,48,.2),0 2px 3px rgba(42,37,48,.25)}
.blk.pop .b{animation:pop .3s ease-out}
@keyframes pop{50%{transform:scale(1.15)}}
.blk.gone .b{animation:gone .5s ease-in forwards}
@keyframes gone{to{transform:scale(0) rotate(20deg);opacity:0}}
.blk.fresh .b{animation:fresh .25s ease-out}
@keyframes fresh{from{transform:scale(.2)}}
/* what a swipe will do, shown while you drag */
.ghost{position:absolute;width:20%;height:20%;display:grid;place-items:center;pointer-events:none;z-index:3}
.ghost span{min-width:1.6em;height:1.6em;border-radius:999px;background:#2A2530;color:#F7F8F3;font:800 clamp(12px,4vw,18px)/1.6em "Baloo 2",system-ui,sans-serif;text-align:center}
.slot.hintcell::before{background:rgba(236,168,24,.6)}
.cloth.licking .grid{cursor:pointer}
.cloth.licking{box-shadow:0 0 0 4px #ECA818}
/* the rules, in the blocks' own marks */
.rules{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:calc(14px*var(--ts));color:var(--ink-soft);width:var(--board)}
.rules .r{display:flex;align-items:center;gap:4px}
.chip{width:22px;height:22px;border-radius:5px;display:grid;place-items:center}
.chip svg{width:62%;height:62%}
.tally{display:flex;align-items:center;gap:6px}
.coming{display:flex;align-items:center;gap:5px;font-size:calc(14px*var(--ts));color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){.blk{transition:none}}
</style>
</head>
<body>
<main>
  <header><h1>Mew Hue</h1><div class="stripe"></div><p class="tagline">Swipe paint together and line up the colours</p></header>
  <nav class="games" id="games" aria-label="Games"></nav>

  <div class="status"><span class="tally" id="count"></span><span class="coming" id="coming"></span><span class="msg" id="msg" aria-live="polite"></span></div>

  <div class="wrap cloth stage" id="board">
    <div class="grid" id="grid" tabindex="0" role="application" aria-label="Blocks of paint. Swipe, or press an arrow key, to slide them all."></div>
  </div>
  <div class="rules" id="rules" aria-label="How colours mix"></div>
  <div class="overlay" id="overlay"><div class="card" id="card"></div></div>

  <div class="actions">
    <button id="hintBtn">Hint</button>
    <button id="undoBtn">Undo</button>
    <button id="lickBtn" data-icon="swat">Lick</button>
    <button id="linkBtn">Share</button>
    <button id="helpBtn">How to play</button>
  </div>
  <div class="bar">
    <button id="newBtn" class="primary">New game</button>
  </div>

</main>

<script src="../games.js?v=2026-11-01.13"></script>
<script>
/* ---------- colours, marks and rules ---------- */
// Pawlette's colours and marks: red a bar down, yellow a bar across, blue a ring. A mix carries both of its
// colours' marks, so orange is a cross, green a bar across and a ring, purple a bar down and a ring.
const DOWN = `<rect x="9.75" y="2" width="4.5" height="20" rx="2"/>`, ACROSS = `<rect x="2" y="9.75" width="20" height="4.5" rx="2"/>`, RING = `<circle cx="12" cy="12" r="6"/>`;
const COLOURS = [
  {name: "red", hex: "#E16251", shape: DOWN}, {name: "orange", hex: "#EC814D", shape: DOWN + ACROSS},
  {name: "yellow", hex: "#ECA818", shape: ACROSS}, {name: "green", hex: "#6AA673", shape: ACROSS + RING},
  {name: "blue", hex: "#30A6B3", shape: RING}, {name: "purple", hex: "#9874CA", shape: DOWN + RING}];
const N = 5, PRIMARIES = [0, 2, 4], THIRD_AT = 2, LICKS = 3;
function inkFor(hex) {
  const n = parseInt(hex.slice(1), 16), lin = v => (v /= 255) <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4;
  return .2126 * lin(n >> 16) + .7152 * lin(n >> 8 & 255) + .0722 * lin(n & 255) > .45 ? "#2A2530" : "#fff";
}
// Two blocks bumping: the same primary join into one, two different primaries make the mix between them, and
// anything with a mix in it stays put (-1).
function combine(a, b) {
  if (a % 2 || b % 2) return -1;
  if (a === b) return a;
  return {"0,2": 1, "2,4": 3, "0,4": 5}[[a, b].sort().join()];
}
// Slide every block one way. Each block combines at most once a swipe. Then whole rows and columns of one
// colour clear. Returns the new grid (a block {id, c} or null in each square), where each block went, which
// squares combined and which lines cleared.
function slide(grid, dx, dy) {
  const g = new Array(N * N).fill(null), moves = [], merged = [], lines = [];
  for (let a = 0; a < N; a++) {
    const L = []; for (let k = 0; k < N; k++) { const t = (dx || dy) > 0 ? N - 1 - k : k; L.push(dx ? a * N + t : t * N + a); }
    const out = [];
    for (const i of L) {
      const b = grid[i]; if (!b) continue;
      const last = out[out.length - 1];
      if (last && !last.done) { const r = combine(last.b.c, b.c); if (r >= 0) { moves.push({id: b.id, to: L[out.length - 1], into: last.b.id}); last.b = {id: last.b.id, c: r}; last.done = true; merged.push(L[out.length - 1]); continue; } }
      out.push({b, done: false}); moves.push({id: b.id, to: L[out.length - 1]});
    }
    out.forEach((o, k) => { g[L[k]] = o.b; });
  }
  for (let a = 0; a < N; a++) for (const L of [[...Array(N)].map((_, k) => a * N + k), [...Array(N)].map((_, k) => k * N + a)]) {
    const c = g[L[0]] && g[L[0]].c; if (c != null && L.every(i => g[i] && g[i].c === c)) lines.push(L);
  }
  const clear = new Set(lines.flat());
  return {grid: g.map((b, i) => clear.has(i) ? null : b), keep: g, moves, merged, lines};
}
const same = (a, b) => a.every((x, i) => (x && x.c) === (b[i] && b[i].c) && (x && x.id) === (b[i] && b[i].id));
function canMove(grid) { for (const d of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (!same(grid, slide(grid, ...d).grid)) return true; return false; }

/* ---------- game state ---------- */
// game: {grid, pair (the two primaries before the third comes), lines, swipes, licks, nextId, history, over, best}
const STORE = "catdoku.mewhue.v2", $ = G.$;
let saved = G.load(STORE), settings = Object.assign({seen: false}, saved.settings);
let game = saved.game || null, busy = false, licking = false;
const save = () => G.save(STORE, {settings, game});
const playing = () => game && !game.over && !busy && !$("overlay").classList.contains("show");
function add(g) {
  const empty = g.grid.map((b, i) => b ? -1 : i).filter(i => i >= 0); if (!empty.length) return -1;
  const i = empty[Math.floor(Math.random() * empty.length)], from = g.lines < THIRD_AT ? g.pair : PRIMARIES;
  g.grid[i] = {id: g.nextId++, c: from[Math.floor(Math.random() * from.length)]}; return i;
}
function newGame() {
  const out = PRIMARIES[Math.floor(Math.random() * 3)], best = (game && game.best) || 0;
  game = {grid: new Array(N * N).fill(null), pair: PRIMARIES.filter(c => c !== out), lines: 0, swipes: 0, licks: LICKS, nextId: 1, history: [], over: false, best};
  for (let k = 0; k < 3; k++) add(game);
  licking = false; hints.clear(false); draw(); save(); G.note("");
  G.track("Mew Hue new game");
  helpOnFirstVisit();
}

/* ---------- drawing ---------- */
let els = new Map();
const xyOf = i => [i % N, Math.floor(i / N)];
const place = (el, i) => { const [x, y] = xyOf(i); el.style.transform = `translate(${x * 100}%, ${y * 100}%)`; };
const mark = c => `<svg viewBox="0 0 24 24" fill="${inkFor(COLOURS[c].hex)}" aria-hidden="true">${COLOURS[c].shape}</svg>`;
function blkEl(b) { const el = document.createElement("div"); paint(el, b); return el; }
function paint(el, b) { el.className = "blk" + (b.c % 2 ? " full" : ""); el.innerHTML = `<div class="b" style="background:${COLOURS[b.c].hex}">${mark(b.c)}</div>`; }
function draw() {
  queueMicrotask(say);
  const grid = $("grid");
  if (!grid.querySelector(".slot")) for (let i = 0; i < N * N; i++) { const s = document.createElement("div"); s.className = "slot"; s.dataset.i = i; const [x, y] = xyOf(i); s.style.left = x * 20 + "%"; s.style.top = y * 20 + "%"; grid.append(s); }
  grid.querySelectorAll(".blk,.ghost").forEach(e => e.remove()); els = new Map();
  game.grid.forEach((b, i) => { if (!b) return; const el = blkEl(b); place(el, i); grid.append(el); els.set(b.id, el); });
  update();
}
const chip = c => `<span class="chip" style="background:${COLOURS[c].hex}">${mark(c)}</span>`;
function drawRules() {
  const r = (a, b, m) => `<span class="r">${chip(a)}+${chip(b)}=${chip(m)}</span>`;
  $("rules").innerHTML = r(0, 2, 1) + r(2, 4, 3) + r(0, 4, 5) +
    `<span class="r">${chip(1)}${chip(3)}${chip(5)} stay put: line them up</span>`;
}
function update() {
  $("count").textContent = `${game.lines} line${game.lines === 1 ? "" : "s"}${game.best ? ` · best ${game.best}` : ""}`;
  const third = PRIMARIES.find(c => !game.pair.includes(c)), left = THIRD_AT - game.lines;
  $("coming").innerHTML = left > 0 ? `${chip(third)} after ${left} line${left === 1 ? "" : "s"}` : "";
  $("hintBtn").disabled = !playing();
  $("undoBtn").disabled = !game.history.length || game.over;
  G.relabel($("lickBtn"), `Lick (${game.licks})`, "swat");
  $("lickBtn").hidden = !game.licks; $("lickBtn").disabled = !playing();
  $("board").classList.toggle("licking", licking);
  paintHint();
}
function say() {
  if (!game) return;
  const rows = [...Array(N).keys()].map(r => `row ${r + 1}: ${[...Array(N).keys()].map(c => { const b = game.grid[r * N + c]; return b ? COLOURS[b.c].name : "empty"; }).join(", ")}`);
  G.describe($("grid"), `Blocks of paint, ${N} by ${N}. ${G.listed(rows, "; ")}. Arrow keys slide them all.`);
}

/* ---------- playing ---------- */
const snap = () => JSON.stringify({grid: game.grid, lines: game.lines, swipes: game.swipes, licks: game.licks, nextId: game.nextId});
function swipe(dx, dy) {
  if (!playing() || licking) return;
  const r = slide(game.grid, dx, dy);
  if (same(game.grid, r.grid)) { G.note("Nothing moves that way.", 1500); return; }
  game.history.push(snap()); if (game.history.length > 30) game.history.shift();
  clearGhost(); hints.clear(false);
  for (const m of r.moves) { const el = els.get(m.id); if (el) place(el, m.to); }
  busy = true;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(() => {
    // blocks that went into another go; the one that stays takes the mix
    const stay = new Map(); r.keep.forEach((b, i) => { if (b) stay.set(b.id, b); });
    for (const [id, el] of els) { const b = stay.get(id); if (!b) { el.remove(); els.delete(id); } else if (r.merged.length && b.c !== +el.dataset.c) { paint(el, b); el.classList.add("pop"); } el.dataset.c = b ? b.c : ""; }
    const madeMix = r.merged.map(i => r.keep[i]).find(b => b.c % 2);
    if (madeMix) G.note(`${COLOURS[madeMix.c].name[0].toUpperCase() + COLOURS[madeMix.c].name.slice(1)}! It stays put now.`, 1800);
    game.grid = r.grid; game.swipes++;
    if (r.lines.length) {
      const had = game.lines; game.lines += r.lines.length;
      for (const i of new Set(r.lines.flat())) { const b = r.keep[i], el = b && els.get(b.id); if (el) { el.classList.add("gone"); setTimeout(() => el.remove(), reduce ? 0 : 500); els.delete(b.id); } }
      G.note(r.lines.length > 1 ? `${r.lines.length} lines at once!` : "A whole line!", 2000);
      if (had < THIRD_AT && game.lines >= THIRD_AT) G.note(`Here comes ${COLOURS[PRIMARIES.find(c => !game.pair.includes(c))].name}!`, 3000);
      G.track(`Mew Hue ${game.lines} lines`);
    }
    const i = add(game); if (i >= 0) { const b = game.grid[i], el = blkEl(b); el.dataset.c = b.c; place(el, i); el.classList.add("fresh"); $("grid").append(el); els.set(b.id, el); }
    busy = false;
    if (!canMove(game.grid)) over();
    queueMicrotask(say); update(); save();
  }, reduce ? 0 : 130);
}
let touch = null;
$("board").addEventListener("pointerdown", e => { if (!game) return; touch = {x: e.clientX, y: e.clientY, dir: null}; try { $("board").setPointerCapture(e.pointerId); } catch (er) {} });
const dirOf = (dx, dy) => Math.max(Math.abs(dx), Math.abs(dy)) < 18 ? null : Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
$("board").addEventListener("pointermove", e => {
  if (!touch || !playing() || licking) return;
  const d = dirOf(e.clientX - touch.x, e.clientY - touch.y);
  if (String(d) !== String(touch.dir)) { touch.dir = d; d ? showGhost(...d) : clearGhost(); }
});
$("board").addEventListener("pointerup", e => {
  if (!touch) return;
  const d = dirOf(e.clientX - touch.x, e.clientY - touch.y); touch = null; clearGhost();
  if (licking) { const rr = $("grid").getBoundingClientRect(), x = Math.floor((e.clientX - rr.left) / rr.width * N), y = Math.floor((e.clientY - rr.top) / rr.height * N); if (x >= 0 && y >= 0 && x < N && y < N) lick(y * N + x); return; }
  if (d) swipe(...d);
});
$("board").addEventListener("pointercancel", () => { touch = null; clearGhost(); });
// While you drag: + where two blocks will mix or join, ★ on a line that will clear.
function showGhost(dx, dy) {
  clearGhost();
  const r = slide(game.grid, dx, dy), put = (i, t) => { const g = document.createElement("div"); g.className = "ghost"; const [x, y] = xyOf(i); g.style.left = x * 20 + "%"; g.style.top = y * 20 + "%"; g.innerHTML = `<span>${t}</span>`; $("grid").append(g); };
  r.merged.forEach(i => put(i, "+")); new Set(r.lines.flat()).forEach(i => put(i, "★"));
}
function clearGhost() { $("grid").querySelectorAll(".ghost").forEach(g => g.remove()); }
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || document.querySelector(".spot") || $("overlay").classList.contains("show") || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === "Escape" && licking) { licking = false; update(); G.note(""); return; }
  const k = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]}[e.key]; if (!k) return;
  e.preventDefault(); swipe(...k);
});
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z" && playing()) { e.preventDefault(); undo(); } });
function undo() { if (!playing() || !game.history.length) return; Object.assign(game, JSON.parse(game.history.pop())); licking = false; draw(); save(); }
$("undoBtn").onclick = undo;
// Lick: the cat licks one block clean away. Three a game.
$("lickBtn").onclick = () => { if (!playing() || !game.licks) return; licking = !licking; update(); G.note(licking ? "Tap a block for the cat to lick away." : "", licking ? 0 : 1); };
function lick(i) {
  const b = game.grid[i]; if (!b) { G.note("Tap a block, not a gap.", 2000); return; }
  game.history.push(snap()); game.grid[i] = null; game.licks--; licking = false;
  const el = els.get(b.id); if (el) { el.classList.add("gone"); setTimeout(() => el.remove(), 500); els.delete(b.id); }
  G.note(`Lick! The ${COLOURS[b.c].name} is gone.`, 2000); update(); save();
}

/* ---------- hints ---------- */
const hints = G.hinter({game: () => game, key: () => game ? JSON.stringify(game.grid) : "", draw: () => paintHint()});
function paintHint() { $("grid").querySelectorAll(".slot.hintcell").forEach(s => s.classList.remove("hintcell")); const m = hints.current(); if (m) for (const i of m.cells) $("grid").querySelector(`.slot[data-i="${i}"]`).classList.add("hintcell"); }
$("hintBtn").onclick = () => {
  if (!playing()) return;
  let best = null;
  for (const [dx, dy, name] of [[-1, 0, "left"], [1, 0, "right"], [0, -1, "up"], [0, 1, "down"]]) {
    const r = slide(game.grid, dx, dy); if (same(game.grid, r.grid)) continue;
    const sc = r.lines.length * 100 + r.merged.filter(i => r.keep[i].c % 2 === 0).length * 6 + r.merged.length * 2 + r.grid.filter(b => !b).length;
    if (!best || sc > best.sc) best = {sc, name, r};
  }
  if (!best) { G.note("No swipe moves anything. Try a Lick.", 3000); return; }
  const cells = best.r.lines.length ? [...new Set(best.r.lines.flat())] : best.r.merged;
  hints.show({cells}, `Swipe ${best.name}${best.r.lines.length ? ": it clears a line" : best.r.merged.length ? ": the gold blocks combine" : ": it makes room"}.`);
};

/* ---------- the end ---------- */
function over() {
  game.over = true; const first = !game.best || game.lines > game.best; if (game.lines > (game.best || 0)) game.best = game.lines; save();
  G.track(`Mew Hue game over ${game.lines} lines`);
  setTimeout(() => G.openCard("No moves left", `You cleared ${game.lines} line${game.lines === 1 ? "" : "s"} in ${game.swipes} swipes.${game.lines && first ? " That's your best yet!" : game.best ? ` Your best is ${game.best}.` : ""}`,
    [["Play again", () => { G.closeCard(); newGame(); }, true], ["Look at the board", G.closeCard], G.homeBtn()]), 600);
}
// Share: there's no puzzle to pass on, so it sends your lines (and best) with a link here.
$("linkBtn").onclick = () => {
  const n = game ? game.lines : 0, best = game ? game.best || 0 : 0;
  G.track("Mew Hue shared");
  G.sendLink("Mew Hue", `I cleared ${n} line${n === 1 ? "" : "s"} in Mew Hue${best > n ? ` (my best is ${best})` : ""}. Can you beat it?`, location.origin + location.pathname);
};

/* ---------- how to play ---------- */
function showHelp() { settings.seen = false; helpOnFirstVisit(); }
function helpOnFirstVisit() {
  if (!game || !playing() || settings.seen || document.querySelector(".spot")) return;
  const all = [...Array(N * N).keys()].map(xyOf), turn = G.yourTurn(() => game, g => { game = g; }, draw);
  let was = 0;
  G.spotlight({grid: $("grid"), w: N, h: N, done: () => { settings.seen = true; save(); }, steps: [
    {say: "Swipe: every block slides 🐈", lit: all},
    {say: "Swipe any way", lit: all, ...turn.upTo, try: {done: () => game.swipes !== was}, enter() { turn.from.enter(); was = game.swipes; }},
    {say: "Two colours mix: their marks join", els: [$("rules")]},
    {say: "Mixes stay put", els: [$("rules")]},
    {say: "Line up one colour to clear it", lit: all.filter(([, y]) => y === N - 1), tone: "ok"},
    {say: "Lick takes one block away", els: [$("lickBtn")]},
    {say: "Stuck? Hint shows a good swipe", els: [$("hintBtn")]},
  ]});
}

$("newBtn").onclick = () => { G.closeCard(); newGame(); };
$("helpBtn").onclick = showHelp;
G.nav("mewhue");
drawRules();
if (game && game.grid && game.grid.length === N * N && !game.over) { draw(); helpOnFirstVisit(); } else newGame();
</script>
