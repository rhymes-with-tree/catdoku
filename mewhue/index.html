<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mew Hue</title>
<script>
// A home-screen app can keep showing an old saved copy of this page. Check for a newer
// version when the page opens, and reload once to get it. Bump BUILD and version.txt together.
(function () {
  var BUILD = "2026-11-01.15"; window.SITE_BUILD = BUILD;
  fetch("../version.txt?t=" + Date.now(), {cache: "no-store"}).then(function (r) { return r.ok ? r.text() : ""; }).then(function (v) {
    v = v.trim(); var tried = null;
    try { tried = sessionStorage.getItem("catdoku.reloadedFor"); } catch (e) {}
    if (v && v !== BUILD && tried !== v) { try { sessionStorage.setItem("catdoku.reloadedFor", v); } catch (e) {} location.reload(); }
  }).catch(function () {});
})();

<link rel="icon" href="../favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#ECEEE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1C24" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../games.css?v=2026-11-01.15">
<style>
/* Blocks of paint, each with a mark: red a bar down, yellow a bar across, blue a ring. Drag a row
   or column and its blocks slide to that end. Two different marks mix, and the mix carries both (orange is a
   cross); a mix is full and stays put. A mark meeting the one mix it isn't part of sets into stone. A whole row or
   column of one kind clears. */
.paintboard{background:color-mix(in srgb,#2A2530 8%,#F7F8F3);border:3px solid var(--ink);border-radius:12px;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none}
.paintboard .grid{position:absolute;inset:2%;outline:none}
.slot{position:absolute;width:20%;height:20%;display:grid;place-items:center}
.slot::before{content:"";width:86%;height:86%;border-radius:18%;background:color-mix(in srgb,#2A2530 6%,transparent)}
.slot.lit::before{background:color-mix(in srgb,#73A7AE 30%,transparent)}
.slot.hintcell::before{background:rgba(236,168,24,.6)}
.slot.kbcursor{outline-offset:-4px;border-radius:14px}
.blk{position:absolute;left:0;top:0;width:20%;height:20%;transition:transform .12s ease-out;pointer-events:none}
.blk .b{position:absolute;inset:7%;border-radius:18%;display:grid;place-items:center;
  box-shadow:inset 0 -4px 0 rgba(42,37,48,.2),0 2px 3px rgba(42,37,48,.25)}
.blk .b svg{width:66%;height:66%}
.blk.full .b{box-shadow:inset 0 0 0 3px rgba(247,248,243,.8),inset 0 -4px 0 rgba(42,37,48,.2),0 2px 3px rgba(42,37,48,.25)}
.blk.stone .b{border-radius:12%;box-shadow:inset 0 -5px 0 rgba(42,37,48,.4),0 2px 3px rgba(42,37,48,.35)}
.blk.pop .b{animation:pop .3s ease-out}
@keyframes pop{50%{transform:scale(1.15)}}
.blk.gone .b{animation:gone .45s ease-in forwards}
@keyframes gone{to{transform:scale(0) rotate(20deg);opacity:0}}
.blk.fresh .b{animation:fresh .25s ease-out}
@keyframes fresh{from{transform:scale(.2)}}
.ghost{position:absolute;width:20%;height:20%;display:grid;place-items:center;pointer-events:none;z-index:3}
.ghost span{min-width:1.6em;height:1.6em;border-radius:999px;background:#2A2530;color:#F7F8F3;font:800 clamp(12px,4vw,18px)/1.6em "Baloo 2",system-ui,sans-serif;text-align:center}
/* the key: a bar blending from colour to colour, with each colour's mark */
.rules{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:var(--board)}
.keybar{display:flex;align-items:center;justify-content:space-between;gap:clamp(8px,4vw,26px);height:46px;padding:0 clamp(10px,3.5vw,18px);border-radius:14px;flex:0 1 auto}
.keybar svg{width:30px;height:30px;flex:none}
.goalbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;width:min(140px,30vw)}
.goalbar i{display:block;height:100%;background:#ECA818;border-radius:999px;transition:width .3s}
#count{display:flex;align-items:center;gap:8px}
/* Willow: strolling by the title, her face rising over each line that clears, asleep on the gold-paw card */
.sitter{display:block;height:58px;width:auto;margin-bottom:-4px}
@media (max-height:760px){.sitter{height:42px;margin-bottom:-3px}}
.peek{position:absolute;width:30%;height:auto;pointer-events:none;z-index:4;transform:translate(-50%,-50%);animation:peek .9s ease-out forwards}
@keyframes peek{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}25%{opacity:1;transform:translate(-50%,-55%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.card img.goldpic{display:block;width:62%;max-width:240px;height:auto;margin:0 auto 14px}
@media (prefers-reduced-motion:reduce){.blk{transition:none}}
</style>
</head>
<body>
<main>
  <header><div class="title"><h1>Mew Hue</h1><img class="sitter" id="sitter" alt="Willow strolling past the title"></div><div class="stripe"></div><p class="tagline">Slide paint together and line up the colours</p></header>
  <nav class="games" id="games" aria-label="Games"></nav>

  <div class="status"><span id="count"></span><button class="timer" id="timer" hidden></button><span class="msg" id="msg" aria-live="polite"></span></div>

  <div class="wrap paintboard stage" id="board">
    <div class="grid" id="grid" tabindex="0" role="application" aria-label="Blocks of paint. Drag a row or column to slide it."></div>
  </div>
  <div class="rules" id="rules" role="img" aria-label="How the marks mix"></div>
  <div class="overlay" id="overlay"><div class="card" id="card"></div></div>

  <div class="actions helpers"><button id="shuffleBtn">Mix it up</button></div>
  <div class="actions">
    <button id="hintBtn">Hint</button>
    <button id="undoBtn">Undo</button>
    <button id="restartBtn">Restart</button>
    <button id="linkBtn">Share</button>
    <button id="bestBtn">Best times</button>
    <button id="helpBtn">How to play</button>
  </div>
  <div class="bar">
    <label>Level <select id="levelSel" aria-label="Level"></select></label>
    <button id="newBtn" class="primary">New board</button>
  </div>

</main>

<script src="../games.js?v=2026-11-01.15"></script>
<script>
/* ---------- marks, colours and rules (plain functions) ---------- */
// Colours by number: 0 red (a bar down), 1 orange (bar down and across), 2 yellow (a bar across), 3 green (across
// and a ring), 4 blue (a ring), 5 purple (down and a ring), 6 stone (all three marks: what you get when a colour
// meets its complement).
const N = 5;
// What two bumping blocks make: the same primary joins into one; two different primaries mix; a primary and the
// one mix that doesn't hold its mark (its complement) set into stone; anything else just bumps (-1).
// Level 7 adds black (7) and white (8). Black wipes out whatever it bumps, and itself (VANISH), except white: black
// and white set into stone. White never combines; when it slides up to a colour it takes that colour (slideLine).
const VANISH = -2;
function combine(a, b) {
  if (a === 7 || b === 7) return a === 8 || b === 8 ? 6 : VANISH;
  if (a === 6 || b === 6 || a === 8 || b === 8) return -1;
  const prim = c => c % 2 === 0;
  if (prim(a) && prim(b)) return a === b ? a : {"0,2": 1, "2,4": 3, "0,4": 5}[[a, b].sort().join()];
  const p = prim(a) ? a : prim(b) ? b : -1, s = prim(a) ? b : a;
  if (p < 0) return -1;
  return {0: 3, 2: 5, 4: 1}[p] === s ? 6 : -1;
}
// The squares of row or column l (axis 0 a row, 1 a column), starting at the end its blocks slide towards.
function lineOf(axis, l, back) { const L = [...Array(N)].map((_, k) => axis ? k * N + l : l * N + k); return back ? L : L.reverse(); }
// Slide one line's blocks to its first end, each combining once at most; stone stays where it is and blocks stop
// against it. Returns the moves ({from, to}) and the squares where blocks combined.
function slideLine(g, L) {
  const moves = [], merged = [], vanish = [];
  let seg = [];
  const flush = () => {
    const out = [];   // {c, at, done}
    for (const i of seg) {
      const c = g[i]; if (c < 0) continue;
      const last = out[out.length - 1];
      if (last && !last.done) {
        const r = combine(last.c, c);
        if (r === VANISH) { moves.push({from: i, to: last.at}); vanish.push(last.at); out.pop(); continue; }
        if (r >= 0) { last.c = r; last.done = true; moves.push({from: i, to: last.at}); merged.push(last.at); continue; }
      }
      const at = seg[out.length];
      // white that slides up against a colour takes that colour (it doesn't merge)
      let cc = c;
      if (c === 8 && at !== i && last && last.c >= 0 && last.c <= 5) { cc = last.c; merged.push(at); }
      out.push({c: cc, at, done: cc !== c}); if (at !== i) moves.push({from: i, to: at});
    }
    seg.forEach((i, k) => { g[i] = k < out.length ? out[k].c : -1; });
    seg = [];
  };
  for (const i of L) { if (g[i] === 6) flush(); else seg.push(i); }
  flush();
  return {moves, merged, vanish};
}
// Whole rows and columns of one colour (stone too) clear, and stone next to a cleared square crumbles.
function clearLines(g) {
  const lines = [], kill = new Set();
  for (let l = 0; l < N; l++) for (const ax of [0, 1]) { const L = lineOf(ax, l, true); if (g[L[0]] >= 0 && L.every(i => g[i] === g[L[0]])) { lines.push({cells: L, c: g[L[0]]}); L.forEach(i => kill.add(i)); } }
  const crumble = [];
  for (const i of kill) for (const j of [i - N, i + N, i % N ? i - 1 : -1, i % N < N - 1 ? i + 1 : -1]) if (j >= 0 && j < N * N && !kill.has(j) && g[j] === 6 && !crumble.includes(j)) crumble.push(j);
  kill.forEach(i => { g[i] = -1; }); crumble.forEach(i => { g[i] = -1; });
  return {lines, crumble};
}
// Levels: how many lines to clear, and which count (only stone on level 5). The colours come from boardColours.
function levelSpec(n) { return [null, {goal: 1}, {goal: 1}, {goal: 1}, {goal: 2}, {goal: 1, stone: true}, {goal: 3}, {goal: 4}][n]; }
// Each board's colours: what falls in (colour: weight) and the key's bars. Levels 1 to 3 take the three pairs of
// primaries in the player's own order (order, kept on the device), so level 2 brings in the third mark and by level
// 3 they've made all three mixes; level 3 also drops that pair's mix ready-made. The rest pick from the board's
// seed: level 4 any two mixes, level 5 any primary with the mix that hasn't its mark (they set into stone), and
// level 6 all three primaries with any one of them rarer.
// Level 7 drops black and white this often, each, against 1 for each common primary.
const BLACK_WHITE = .2;
function boardColours(level, seed, order) {
  const PAIRS = [[0, 2, 1], [0, 4, 5], [2, 4, 3]], COMP = {0: 3, 2: 5, 4: 1}, PRIM = [0, 2, 4], k = seed % 3, d = {};
  if (level <= 3) { const [a, b, m] = PAIRS[order[level - 1]]; d[a] = 1; d[b] = 1; if (level === 3) d[m] = .5; return {drops: d, key: [[a, m, b]]}; }
  if (level === 4) { const two = [1, 3, 5].filter((_, i) => i !== k); d[two[0]] = 1; d[two[1]] = 1; return {drops: d, key: [[two[0]], [two[1]]]}; }
  if (level === 5) { const p = PRIM[k]; d[p] = 3; d[COMP[p]] = 1; return {drops: d, key: [[p, 6, COMP[p]]]}; }
  const rare = PRIM[k], other = PRIM[(k + 1) % 3]; PRIM.forEach(c => { d[c] = c === rare ? .35 : 1; });
  if (level === 7) { d[7] = BLACK_WHITE; d[8] = BLACK_WHITE; return {drops: d, key: [[0, 1, 2, 3, 4, 5, 0], [other, 6, COMP[other]], [8, 6, 7]]}; }
  return {drops: d, key: [[0, 1, 2, 3, 4, 5, 0], [other, 6, COMP[other]]]};
}
function pickDrop(drops, r) { const e = Object.entries(drops), tot = e.reduce((t, [, w]) => t + w, 0); let x = r * tot; for (const [c, w] of e) { if ((x -= w) < 0) return +c; } return +e[0][0]; }

const catSrc = f => (window.CAT_SRC || {})[f] || `../cats/${f}.webp`;
function seeded(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ---------- looks ---------- */
const DOWN = `<rect x="9.5" y="1.5" width="5" height="21" rx="2.2"/>`, ACROSS = `<rect x="1.5" y="9.5" width="21" height="5" rx="2.2"/>`, RING = `<circle cx="12" cy="12" r="6.2" fill="none" stroke-width="3.4"/>`;
const COLOURS = [
  {name: "red", hex: "#E16251", marks: [DOWN]}, {name: "orange", hex: "#EC814D", marks: [DOWN, ACROSS]},
  {name: "yellow", hex: "#ECA818", marks: [ACROSS]}, {name: "green", hex: "#6AA673", marks: [ACROSS, RING]},
  {name: "blue", hex: "#30A6B3", marks: [RING]}, {name: "purple", hex: "#9874CA", marks: [DOWN, RING]},
  // stone has all three marks, scratched in thin
  {name: "stone", hex: "#5E5866", marks: [`<g fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5V21.5M2.5 12H21.5"/><circle cx="12" cy="12" r="6.2"/></g>`]},
  // black: a solid dot, everything blotted out; white: an empty dashed outline, a block still waiting for a mark
  {name: "black", hex: "#2A2530", marks: [`<circle cx="12" cy="12" r="6.5"/>`]},
  {name: "white", hex: "#F7F8F3", marks: [`<rect x="4" y="4" width="16" height="16" rx="3.5" fill="none" stroke-width="2.2" stroke-dasharray="3.6 2.6"/>`]}];
function inkFor(hex) {
  const n = parseInt(hex.slice(1), 16), lin = v => (v /= 255) <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4;
  return .2126 * lin(n >> 16) + .7152 * lin(n >> 8 & 255) + .0722 * lin(n & 255) > .45 ? "#2A2530" : "#fff";
}
const mark = c => { const ink = inkFor(COLOURS[c].hex); return `<svg viewBox="0 0 24 24" fill="${ink}" stroke="${ink}" aria-hidden="true">${COLOURS[c].marks.join("")}</svg>`; };
const chip = c => `<span class="chip" style="background:${COLOURS[c].hex}" title="${COLOURS[c].name}">${mark(c)}</span>`;
const Cap = w => w[0].toUpperCase() + w.slice(1);
// The key: bars that blend from one colour to the next, each with its mark, so a mix sits between the two colours
// it's made of. Colours that don't mix get bars of their own, and stone sits between the two that make it.
const PAPER = "#F7F8F3";
const keyMark = c => { const k = c === 8 ? "#2A2530" : PAPER; return `<svg viewBox="0 0 24 24" fill="${k}" stroke="${k}" aria-hidden="true">${COLOURS[c].marks.join("")}</svg>`; };
function drawKey(g) {
  $("rules").innerHTML = boardColours(g.level, g.seed, g.order).key.map(bar => {
    const bg = bar.length > 1 ? `linear-gradient(90deg,${bar.map((c, k) => `${COLOURS[c].hex} ${(k / (bar.length - 1) * 100).toFixed(0)}%`).join(",")})` : COLOURS[bar[0]].hex;
    return `<div class="keybar" style="background:${bg}" aria-label="${bar.map(c => COLOURS[c].name).join(", then ")}">${bar.map(keyMark).join("")}</div>`;
  }).join("");
}

/* ---------- game state ---------- */
// game: {level, seed, grid (a colour number or -1 in each square), drops, lines, moves, mixes (Mix it ups left),
//        start (the board as dealt), history, won, lost, hinted, undid, clock…}
const STORE = "catdoku.mewhue.v3", MAX_LEVEL = 7, MIXES = 2, $ = G.$;
let saved = G.load(STORE), settings = Object.assign({level: 1, seen: {}}, saved.settings);
// the order levels 1 to 3 take the pairs of primaries in, picked once for this device
const isOrder = o => Array.isArray(o) && o.length === 3 && [0, 1, 2].every(k => o.includes(k));
if (!isOrder(settings.order)) settings.order = [0, 1, 2].sort(() => Math.random() - .5);
let game = saved.game || null, busy = false;
const save = () => G.save(STORE, {settings, game});
const playing = () => game && !game.won && !game.lost && !busy && !$("overlay").classList.contains("show");
const levelName = n => [null, "Two colours", "A new colour", "All three mixes", "Two mixes", "Stone", "All three", "Black and white"][n];
function drop(g) {
  const r = seeded(g.seed * 7919 + g.drops++), empty = g.grid.map((c, i) => c < 0 ? i : -1).filter(i => i >= 0);
  if (!empty.length) return -1;
  const i = empty[Math.floor(r() * empty.length)]; g.grid[i] = pickDrop(boardColours(g.level, g.seed, g.order).drops, r()); return i;
}
function deal(level, seed, order) {
  const g = {level, seed, order: (order || settings.order).slice(), grid: new Array(N * N).fill(-1), drops: 0, lines: 0, moves: 0, mixes: MIXES, history: [], won: false, lost: false, ...G.freshClock()};
  for (let k = 0; k < 4; k++) drop(g);
  g.start = JSON.stringify({grid: g.grid, drops: g.drops});
  return g;
}
const snap = () => JSON.stringify({grid: game.grid, drops: game.drops, lines: game.lines, moves: game.moves, mixes: game.mixes});
// Every slide that would change something: [axis, line, back]
function slides(g) {
  const out = [];
  for (let l = 0; l < N; l++) for (const ax of [0, 1]) for (const back of [false, true]) { const h = g.slice(); if (slideLine(h, lineOf(ax, l, back)).moves.length) out.push([ax, l, back]); }
  return out;
}

/* ---------- drawing ---------- */
const xyOf = i => [i % N, Math.floor(i / N)];
const place = (el, i) => { const [x, y] = xyOf(i); el.style.transform = `translate(${x * 100}%, ${y * 100}%)`; };
let blocks = [];   // the element on each square
function blk(c, i) { const el = document.createElement("div"); el.className = "blk" + (c === 6 ? " stone" : c % 2 ? " full" : ""); el.innerHTML = `<div class="b" style="background:${COLOURS[c].hex}">${mark(c)}</div>`; place(el, i); $("grid").append(el); return el; }
function draw() {
  queueMicrotask(say);
  const grid = $("grid");
  if (!grid.querySelector(".slot")) for (let i = 0; i < N * N; i++) { const s = document.createElement("div"); s.className = "slot"; s.dataset.i = i; const [x, y] = xyOf(i); s.style.left = x * 20 + "%"; s.style.top = y * 20 + "%"; grid.append(s); }
  grid.querySelectorAll(".blk,.ghost").forEach(e => e.remove());
  blocks = game.grid.map((c, i) => c >= 0 ? blk(c, i) : null);
  drawKey(game);
  update();
}
function update() {
  const spec = levelSpec(game.level);
  $("count").innerHTML = `Level ${game.level} · ${Math.min(game.lines, spec.goal)} of ${spec.goal} ${spec.stone ? "stone " : ""}line${spec.goal === 1 ? "" : "s"} <span class="goalbar"><i style="width:${Math.min(100, game.lines / spec.goal * 100)}%"></i></span>`;
  $("hintBtn").disabled = !playing();
  $("undoBtn").disabled = !game.history.length || game.won;
  $("restartBtn").disabled = !game.history.length || game.won;
  G.relabel($("shuffleBtn"), `Mix it up (${game.mixes})`, "shuffle");
  $("shuffleBtn").hidden = !game.mixes; $("shuffleBtn").disabled = !playing();
  paintHint(); showCursor();
}
function say() {
  if (!game) return;
  const rows = [...Array(N).keys()].map(r => `row ${r + 1}: ${[...Array(N).keys()].map(c => { const v = game.grid[r * N + c]; return v < 0 ? "empty" : COLOURS[v].name; }).join(", ")}`);
  G.describe($("grid"), `Blocks of paint, ${N} by ${N}. ${G.listed(rows, "; ")}. Arrow keys pick a square; Shift with an arrow slides its row or column that way.`);
}

/* ---------- playing ---------- */
function slideMove(ax, l, back) {
  if (!playing()) return;
  const after = game.grid.slice(), r = slideLine(after, lineOf(ax, l, back));
  if (!r.moves.length) { G.note("Nothing in that line can move that way.", 1800); return; }
  game.started = true;
  game.history.push(snap()); if (game.history.length > 50) game.history.shift();
  clearGhost(); hints.clear(false);
  for (const m of r.moves) { const el = blocks[m.from]; if (el) place(el, m.to); }
  busy = true;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, spec = levelSpec(game.level);
  setTimeout(() => {
    game.grid = after; draw(); busy = true;
    r.merged.forEach(i => blocks[i] && blocks[i].classList.add("pop"));
    const made = r.merged.map(i => after[i]);
    if (game.demo) {}   // the walkthrough says it
    else if (r.vanish.length) G.note("Black wipes them both out!", 2000);
    else if (made.includes(6)) G.note("All three marks: it's set into stone!", 2200);
    else { const mix = made.find(c => c % 2); if (mix != null) G.note(`${Cap(COLOURS[mix].name)}: two marks, so it's full now.`, 2000); }
    const cleared = after.slice(), c = clearLines(cleared);
    const finish = () => {
      game.grid = cleared; game.moves++;
      // a walkthrough demo: show what happened, nothing more (no new block, no lines counted)
      if (game.demo) { busy = false; draw(); return; }
      const counted = c.lines.filter(x => !spec.stone || x.c === 6).length;
      game.lines += counted;
      if (c.lines.length && !game.demo) { G.note(c.lines.length > 1 ? `${c.lines.length} lines at once!` : c.lines[0].c === 6 ? "A line of stone!" : "A whole line!", 2000); }
      if (spec.stone && c.lines.length && !counted) G.note("This level only counts lines of stone.", 2500);
      if (game.lines >= spec.goal) { busy = false; draw(); win(); return; }
      const i = drop(game);
      busy = false; draw(); if (i >= 0 && blocks[i]) blocks[i].classList.add("fresh");
      if (!slides(game.grid).length) lose();
      save();
    };
    if (!c.lines.length) { finish(); return; }
    new Set([...c.lines.flatMap(x => x.cells), ...c.crumble]).forEach(i => blocks[i] && blocks[i].classList.add("gone"));
    // Willow's face rises over the middle of each line that clears
    for (const ln of c.lines) {
      const [x, y] = xyOf(ln.cells[2]), im = new Image(); im.className = "peek"; im.alt = ""; im.src = catSrc("willow-7");
      im.style.left = (2 + (x + .5) * 19.2) + "%"; im.style.top = (2 + (y + .5) * 19.2) + "%";
      $("board").append(im); setTimeout(() => im.remove(), 950);
    }
    setTimeout(finish, reduce ? 0 : 450);
  }, reduce ? 0 : 130);
}
// Drag a row or column: the line you start on, the way you drag. While you drag it lights up, with + where blocks
// will combine, ● where they'll set into stone, and ★ on lines that will clear.
let touch = null;
const cellAt = e => { const r = $("grid").getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / r.width * N), y = Math.floor((e.clientY - r.top) / r.height * N); return x < 0 || y < 0 || x >= N || y >= N ? -1 : y * N + x; };
const dragOf = (t, e) => { const dx = e.clientX - t.x, dy = e.clientY - t.y; if (Math.max(Math.abs(dx), Math.abs(dy)) < 16) return null;
  const [x, y] = xyOf(t.i); return Math.abs(dx) > Math.abs(dy) ? [0, y, dx < 0] : [1, x, dy < 0]; };
$("board").addEventListener("pointerdown", e => { if (!playing()) return; const i = cellAt(e); if (i < 0) return; touch = {x: e.clientX, y: e.clientY, i, d: null}; try { $("board").setPointerCapture(e.pointerId); } catch (er) {} });
$("board").addEventListener("pointermove", e => {
  if (!touch || !playing()) return;
  const d = dragOf(touch, e);
  if (String(d) !== String(touch.d)) { touch.d = d; d ? showGhost(...d) : clearGhost(); }
});
$("board").addEventListener("pointerup", e => { if (!touch) return; const d = dragOf(touch, e); touch = null; clearGhost(); if (d) slideMove(...d); else G.note("Drag a row or column to slide it.", 2000); });
$("board").addEventListener("pointercancel", () => { touch = null; clearGhost(); });
function showGhost(ax, l, back) {
  clearGhost();
  const L = lineOf(ax, l, back), h = game.grid.slice(), r = slideLine(h, L), c = clearLines(h.slice());
  L.forEach(i => $("grid").querySelector(`.slot[data-i="${i}"]`).classList.add("lit"));
  const put = (i, t) => { const g = document.createElement("div"); g.className = "ghost"; const [x, y] = xyOf(i); g.style.left = x * 20 + "%"; g.style.top = y * 20 + "%"; g.innerHTML = `<span>${t}</span>`; $("grid").append(g); };
  r.merged.forEach(i => put(i, h[i] === 6 ? "●" : "+")); r.vanish.forEach(i => put(i, "✕"));
  new Set(c.lines.flatMap(x => x.cells)).forEach(i => put(i, "★"));
}
function clearGhost() { $("grid").querySelectorAll(".ghost").forEach(g => g.remove()); $("grid").querySelectorAll(".slot.lit").forEach(s => s.classList.remove("lit")); }
// Keys: the arrows move a cursor; Shift with an arrow slides the cursor's row or column that way.
function showCursor() { $("grid").querySelectorAll(".slot.kbcursor").forEach(s => s.classList.remove("kbcursor")); const i = keys ? keys.at() : -1; if (i >= 0) { const s = $("grid").querySelector(`.slot[data-i="${i}"]`); if (s) s.classList.add("kbcursor"); } }
const keys = G.gridKeys({
  on: () => playing(), show: () => showCursor(), size: () => [N, N], start: () => 12,
  move(i, dx, dy, e) {
    const [x, y] = xyOf(i);
    if (e && e.shiftKey) { if (dx) slideMove(0, y, dx < 0); else slideMove(1, x, dy < 0); return i; }
    return Math.max(0, Math.min(N - 1, y + dy)) * N + Math.max(0, Math.min(N - 1, x + dx));
  },
  act: () => false,
});
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z" && playing()) { e.preventDefault(); undo(); } });
function undo() { if (!game || busy || !game.history.length || game.won) return; game.undid = true; game.lost = false; Object.assign(game, JSON.parse(game.history.pop())); G.closeCard(); draw(); save(); }
$("undoBtn").onclick = undo;
$("restartBtn").onclick = () => {
  if (!game || busy || !game.history.length || game.won) return;
  game.undid = true; game.history.push(snap());
  Object.assign(game, JSON.parse(game.start), {lines: 0, moves: 0, mixes: MIXES, lost: false});
  G.closeCard(); draw(); save(); G.note("Back to the start of the level. Undo brings it back.", 3500);
};
// Mix it up: the cat bats the board and every block that isn't stone lands somewhere new. Two a level.
$("shuffleBtn").onclick = () => {
  if (!playing() || !game.mixes) return;
  game.history.push(snap()); game.mixes--; game.mixed = true;
  const r = seeded(game.seed * 31 + game.moves * 7 + game.mixes), free = game.grid.map((c, i) => c === 6 ? -1 : i).filter(i => i >= 0);
  const vals = free.map(i => game.grid[i]);
  for (let k = vals.length - 1; k > 0; k--) { const j = Math.floor(r() * (k + 1)); [vals[k], vals[j]] = [vals[j], vals[k]]; }
  free.forEach((i, k) => { game.grid[i] = vals[k]; });
  // shuffling can't leave a whole line done for you
  clearLines(game.grid);
  game.lost = false; G.closeCard(); draw(); save(); G.note("The cat mixed it up!", 2000);
};

/* ---------- hints ---------- */
// Hint tries every slide and shows the best: lines that count, then blocks lining up, then room.
const hints = G.hinter({game: () => game, key: () => game ? game.grid.join() : "", draw: () => paintHint()});
function paintHint() { $("grid").querySelectorAll(".slot.hintcell").forEach(s => s.classList.remove("hintcell")); const m = hints.current(); if (m) for (const i of m.cells) $("grid").querySelector(`.slot[data-i="${i}"]`).classList.add("hintcell"); }
function score(g, spec) {
  let s = g.filter(c => c < 0).length * 3;
  for (let l = 0; l < N; l++) for (const ax of [0, 1]) { const cnt = {}; lineOf(ax, l, true).forEach(i => { if (g[i] >= 0) cnt[g[i]] = (cnt[g[i]] || 0) + 1; }); for (const [c, n] of Object.entries(cnt)) s += n * n * (spec.stone && +c === 6 ? 3 : 1); }
  return s;
}
$("hintBtn").onclick = () => {
  if (!playing()) return;
  const spec = levelSpec(game.level); let best = null;
  for (const [ax, l, back] of slides(game.grid)) {
    const h = game.grid.slice(); slideLine(h, lineOf(ax, l, back)); const c = clearLines(h);
    const sc = c.lines.filter(x => !spec.stone || x.c === 6).length * 1000 + c.lines.length * 200 + score(h, spec);
    if (!best || sc > best.sc) best = {sc, ax, l, back, c};
  }
  if (!best) { G.note("Nothing can slide. Try Mix it up, or Undo.", 3000); return; }
  game.hinted = true; save();
  const way = best.ax ? (best.back ? "up" : "down") : (best.back ? "left" : "right");
  hints.show({cells: lineOf(best.ax, best.l, true)}, `Slide the gold ${best.ax ? "column" : "row"} ${way}${best.c.lines.length ? ": it clears a line" : ""}.`);
};

/* ---------- endings ---------- */
function win() {
  game.won = true; G.finishClock(game); update(); save();
  const next = game.hinted ? game.level : Math.min(MAX_LEVEL, game.level + 1);
  settings.level = next; $("levelSel").value = next; save();
  G.track(`Mew Hue won level ${game.level}`);
  const gold = !game.undid && !game.hinted && !game.mixed, spec = levelSpec(game.level);
  let text = `You cleared ${game.lines} ${spec.stone ? "line" : "line"}${game.lines === 1 ? "" : "s"}${spec.stone ? " of stone" : ""} in ${game.moves} moves.`;
  text += game.hinted ? ` You had a hint, so here's another at level ${next}.` : game.level === MAX_LEVEL ? " That's the last level; here's another board." : ` Next up: level ${next}, ${levelName(next).toLowerCase()}.`;
  setTimeout(() => G.winCard(text, () => { G.closeCard(); startLevel(next); }, "Admire the board", game.result,
    {title: "Lined up!", gold, goldWhy: "No hints, undos or mix-ups!", goldTitle: "Willow's having a nap!", goldPic: [goldPic()], next: next > game.level ? `Next: level ${next}` : "Next board",
     after: G.otherSize($("levelSel"), next, startLevel, "Or play a different level:")}), 500);
}
function goldPic() { const im = new Image(); im.className = "goldpic"; im.src = catSrc("willow-5"); im.alt = "Willow curled up asleep"; return im; }
function lose() {
  game.lost = true; G.breakStreak(); save();
  G.track(`Mew Hue stuck level ${game.level}`);
  const btns = [["Undo", undo, true]];
  if (game.mixes) btns.push([`Mix it up (${game.mixes} left)`, () => $("shuffleBtn").onclick()]);
  btns.push(["Restart", () => $("restartBtn").onclick()], ["New board", () => { G.closeCard(); newGame(); }], G.homeBtn());
  setTimeout(() => G.openCard("Stuck!", `Nothing can slide. You cleared ${game.lines} of ${levelSpec(game.level).goal}.`, btns), 400);
}

/* ---------- new boards ---------- */
function startLevel(n) { settings.level = n; $("levelSel").value = n; save(); newGame(); }
function newGame(seed = Math.floor(Math.random() * 2 ** 31), order) {
  game = deal(settings.level, seed, order); hints.clear(false); draw(); save();
  G.track(`Mew Hue new board level ${settings.level}`);
  helpOnFirstVisit();
}
$("linkBtn").onclick = () => { if (game) G.shareCard({name: "Mew Hue", won: game.won, what: "board", puzzle: () => ({g: "mewhue", N: game.level, s: game.seed, o: game.order.join("")})}); };
function openShared(d) {
  const o = typeof d.o === "string" ? [...d.o].map(Number) : settings.order;
  if (!(d.N >= 1 && d.N <= MAX_LEVEL) || !Number.isInteger(d.s) || d.s < 0 || !isOrder(o)) { G.note("That share link didn't work.", 5000); return; }
  settings.level = d.N; $("levelSel").value = d.N; newGame(d.s, o);
}

/* ---------- how to play ---------- */
// The first board gets the whole walkthrough; each later level, the first time, a step for what's new.
function showHelp() { if (game) { settings.seen = {}; helpOnFirstVisit(true); } }
// The walkthrough shows each rule by doing it: a step sets out a few blocks on an empty board and you make the
// slide, then it says what happened. G.yourTurn puts your own board back afterwards, exactly as it was. The first
// board gets a mix and a line; each later level, the first time, a demo of what's new on it.
function helpOnFirstVisit(all) {
  if (!game || !playing() || document.querySelector(".spot")) return;
  const n = game.level, first = all || !Object.keys(settings.seen).length;
  if (settings.seen[n] && !all) return;
  const turn = G.yourTurn(() => game, g => { game = g; }, draw);
  const PAIRS = [[0, 2, 1], [0, 4, 5], [2, 4, 3]], COMP = {0: 3, 2: 5, 4: 1};
  const name = c => Cap(COLOURS[c].name), row2 = [10, 11, 12, 13, 14].map(xyOf), col4 = [4, 9, 14, 19, 24].map(xyOf);
  let was = 0;
  // a demo: blocks set out ([square, colour]…), the squares to light, what to do, and what you see after
  const demo = (say, put, lit, yes) => ({say, lit, ...turn.from, try: {done: () => game.moves !== was, yes},
    enter() { turn.from.enter(); const g = new Array(N * N).fill(-1); for (const [i, c] of put) g[i] = c; Object.assign(game, {grid: g, demo: true}); was = game.moves; hints.clear(false); draw(); }});
  // slide a row left: a on the left, b further along, so b slides up to a
  const meet = (a, b, yes) => demo("Drag this row left", [[10, a], [13, b]], row2, yes);
  const pair = k => PAIRS[game.order[k]];
  const [a1, b1, m1] = pair(0);
  const steps = [];
  if (first) steps.push(meet(a1, b1, `${name(m1)}! Both marks in one`),
    // four in a row, and a fifth pushed up the last column, stopping under two mixes that won't take it
    demo("Drag this column up", [[10, a1], [11, a1], [12, a1], [13, a1], [4, m1], [9, m1], [24, a1]], col4, "A whole line clears!"));
  const sp = boardColours(n, game.seed, game.order);
  if (n === 2) { const [a, b, m] = pair(1); steps.push(meet(a, b, `${name(m)}! A new mark joins in`)); }
  if (n === 3) { const [a, , m] = pair(2); steps.push(meet(m, a, `${name(m)} is full: it stays put`)); }
  if (n === 4) { const [s1, s2] = sp.key.map(b => b[0]); steps.push(meet(s1, s2, "Two mixes never mix")); }
  if (n === 5) { const [p, , q] = sp.key[0]; steps.push(meet(p, q, "Stone! It never moves")); }
  if (n === 7) steps.push(meet(0, 7, "Black wipes them both out"), meet(0, 8, "White copies the colour"), meet(8, 7, "White and black make stone"));
  if (!steps.length) { settings.seen[n] = true; save(); return; }
  steps[steps.length - 1].leave = turn.upTo.leave;   // put the real board back after the last demo
  if (first) steps.push({say: "Mix it up shuffles the board", els: [$("shuffleBtn")]}, {say: "Stuck? Hint shows a good slide", els: [$("hintBtn")]});
  G.spotlight({grid: $("grid"), w: N, h: N, steps, finish: first ? undefined : false, done: () => { settings.seen[n] = true; if (first) for (let k = 1; k <= n; k++) settings.seen[k] = true; save(); }});
}

for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(`${n} · ${levelName(n)}`, n));
$("levelSel").onchange = e => { G.closeCard(); startLevel(+e.target.value); };
$("newBtn").onclick = () => { G.closeCard(); newGame(); };
$("helpBtn").onclick = showHelp;
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : settings.level);
G.nav("mewhue");
$("sitter").src = catSrc("willow-2");
G.checkClock(game);
G.setupTimer({name: "mewhue", game: () => game, playing: g => !g.won && !g.lost, save, label: n => `${n} · ${levelName(n)}`, noun: "level"});
if (!(settings.level >= 1 && settings.level <= MAX_LEVEL)) settings.level = 1;
$("levelSel").value = settings.level;
const shared = G.readShare("mewhue");
if (game) G.reopen(() => { if (!levelSpec(game.level) || game.grid.length !== N * N || !isOrder(game.order)) throw new Error("the saved board doesn't fit"); draw(); if (game.lost) lose(); else helpOnFirstVisit(); },
  why => { game = null; newGame(); G.note(why, 0); });
else if (!shared) newGame();
if (shared) G.offerShare(shared, {name: "Mew Hue", inProgress: !!(game && game.history.length && !game.won), open: openShared, after: helpOnFirstVisit, fresh: game ? null : why => { newGame(); G.note(why, 6000); }});
window.addEventListener("hashchange", () => { const d = G.readShare("mewhue"); if (d) G.offerShare(d, {name: "Mew Hue", inProgress: !!(game && game.history.length && !game.won), open: openShared, after: helpOnFirstVisit}); });
</script>
