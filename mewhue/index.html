<style>
/* Blocks of paint, each with a mark: red a bar down, yellow a bar across, blue a ring. Drag a row
   or column and its blocks slide to that end. Two different marks mix, and the mix carries both (orange is a
   cross); a mix is full and won't mix again. A mark meeting the one mix it isn't part of sets into stone. A whole row or
   column of one kind clears. */
.paintboard{background:color-mix(in srgb,#2A2530 8%,#F7F8F3);border:3px solid var(--ink);border-radius:12px;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none}
.paintboard .grid{position:absolute;inset:2%;outline:none}
.slot{position:absolute;width:20%;height:20%;display:grid;place-items:center}
.slot::before{content:"";width:86%;height:86%;border-radius:18%;background:color-mix(in srgb,#2A2530 6%,transparent)}
.slot.lit::before{background:color-mix(in srgb,#73A7AE 30%,transparent)}
.slot.hintcell::before{background:rgba(236,168,24,.6)}
.slot.kbcursor{outline-offset:-4px;border-radius:14px}
.blk{position:absolute;left:0;top:0;width:20%;height:20%;transition:transform .12s ease-out;pointer-events:none}
.blk .b{position:absolute;inset:7%;border-radius:18%;display:grid;place-items:center;
  box-shadow:inset 0 -4px 0 rgba(42,37,48,.2),0 2px 3px rgba(42,37,48,.25)}
.blk .b svg{width:66%;height:66%}
.blk.full .b{box-shadow:inset 0 0 0 3px rgba(247,248,243,.8),inset 0 -4px 0 rgba(42,37,48,.2),0 2px 3px rgba(42,37,48,.25)}
.blk.stone .b{border-radius:12%;box-shadow:inset 0 -5px 0 rgba(42,37,48,.4),0 2px 3px rgba(42,37,48,.35)}
.blk.pop .b{animation:pop .3s ease-out}
@keyframes pop{50%{transform:scale(1.15)}}
.blk.gone .b{animation:gone .45s ease-in forwards}
@keyframes gone{to{transform:scale(0) rotate(20deg);opacity:0}}
.blk.fresh .b{animation:fresh .25s ease-out}
@keyframes fresh{from{transform:scale(.2)}}
.ghost{position:absolute;width:20%;height:20%;display:grid;place-items:center;pointer-events:none;z-index:3}
.ghost span{min-width:1.6em;height:1.6em;border-radius:999px;background:#2A2530;color:#F7F8F3;font:800 clamp(12px,4vw,18px)/1.6em "Baloo 2",system-ui,sans-serif;text-align:center}
/* the key: a bar blending from colour to colour, with each colour's mark */
.rules{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:var(--board)}
.keybar{display:flex;align-items:center;justify-content:space-between;gap:clamp(8px,4vw,26px);height:46px;padding:0 clamp(10px,3.5vw,18px);border-radius:14px;flex:0 1 auto}
.keybar svg{width:30px;height:30px;flex:none}
.keybar.nipkey{background:#F4F1E6;border:2px solid #D9C8F0;color:#2A2530;font-weight:700;gap:8px}
.keybar.nipkey svg{width:36px;height:36px}
.goalbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;width:min(140px,30vw)}
.goalbar i{display:block;height:100%;background:#ECA818;border-radius:999px;transition:width .3s}
#count{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#count .need{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 4px;border-radius:999px;border:2px solid var(--line)}
#count .need.ok{border-color:#6AA673}
#count .need .chip{width:20px;height:20px}
/* Willow: strolling by the title, her face rising over each line that clears, asleep on the gold-paw card */
.sitter{display:block;height:58px;width:auto;margin-bottom:-4px}
@media (max-height:760px){.sitter{height:42px;margin-bottom:-3px}}
.peek{position:absolute;width:30%;height:auto;pointer-events:none;z-index:4;transform:translate(-50%,-50%);animation:peek .9s ease-out forwards}
@keyframes peek{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}25%{opacity:1;transform:translate(-50%,-55%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.card img.goldpic{display:block;width:62%;max-width:240px;height:auto;margin:0 auto 14px}
/* the tray (chapter 2 on): a wider frame, a track behind a carousel row with a turn badge at each end, cat flaps */
.paintboard.framed .grid{inset:7%}
.blk.charmed .b svg{width:72%;height:72%}
.trayart{position:absolute;transform:translate(0,-50%);pointer-events:none;z-index:2}
.paintboard .trayart{margin:0}
/* chapter 4: a sunbeam across a row (over the blocks), its pane in the frame, springs in the frame, scratching posts */
.sunbeam{position:absolute;left:-3%;width:106%;height:20%;background:color-mix(in srgb,var(--sun) 30%,transparent);border-top:1.5px dashed var(--sun);border-bottom:1.5px dashed var(--sun);

.trayart.pane::after{content:"";position:absolute;inset:2px;background:var(--sun)}
.trayart.spring{width:10%;height:5%;margin-left:-3.5%!important;margin-right:-3.5%!important}
.trayart.spring svg{display:block;width:100%;height:100%}
.post{position:absolute;height:20%;width:3%;margin-left:-1.5%;pointer-events:none;z-index:2;border-radius:3px;border:1.5px solid #2A2530;box-sizing:border-box;

.trayart.turnarrow{transform:none;display:grid;place-items:center;cursor:pointer;pointer-events:auto}
.trayart.turnarrow svg{width:70%;height:70%;fill:#2A2530;opacity:.5;transition:opacity .15s}
.trayart.turnarrow:hover svg{opacity:.85}
/* catnip: a pale block with its ring of leaves; painted stone: stone with its coat's mark, and a wash of the coat */

.blk.catnip .b svg{width:100%;height:100%}
.blk.painted .b{box-shadow:inset 0 0 0 3px var(--coat),inset 0 -5px 0 rgba(42,37,48,.4),0 2px 3px rgba(42,37,48,.35)}

.ripen{position:absolute;width:20%;height:20%;display:grid;place-items:center;pointer-events:none;z-index:3}
.ripen svg{width:40%;height:40%;animation:ripen .7s ease-in forwards}
@keyframes ripen{0%{transform:scale(1)}70%{opacity:1}100%{transform:scale(2.6);opacity:0}}
.blk.ripened .b{animation:ripened .7s ease-out}
@keyframes ripened{0%,45%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.trayart.flap{width:5%;height:11%;margin-left:-2.5%!important;margin-right:-2.5%!important;border-radius:5px;background:#C9A66B;border:2px solid #2A2530;box-sizing:border-box;display:grid;place-items:end center}
.trayart.flap::before{content:"";position:absolute;left:18%;right:18%;top:22%;height:2px;background:#2A2530}
.trayart.flap b{font:800 9px/1 "Baloo 2",system-ui,sans-serif;color:#F7F8F3;background:#2A2530;border-radius:50%;width:12px;height:12px;display:grid;place-items:center;margin-bottom:12%}
@media (prefers-reduced-motion:reduce){.blk{transition:none}}

<script>
/* ---------- marks, colours and rules (plain functions) ---------- */
// Colours by number: 0 red (a bar down), 1 orange (bar down and across), 2 yellow (a bar across), 3 green (across
// and a ring), 4 blue (a ring), 5 purple (down and a ring), 6 stone (all three marks: what you get when a colour
// meets its complement).
const N = 5;
// A square holds a colour number, or -1 when it's empty. A charmed block (chapter 2 on) adds its charm × 16, so the charm
// moves, mixes, shuffles, saves and undoes with its block: col() is the colour alone, charmOf() the charm (0 for none).
// Chapter 3 adds catnip (9), which carries the colours it still has a leaf for as bits × 256 (red 1, orange 2, yellow
// 4…), and painted stone (10 to 15): stone with a coat of colour 0 to 5 on it.
const KITTEN = 1, PAW = 2, NIP = 9;
const col = v => v < 0 ? v : v & 15, charmOf = v => v < 0 ? 0 : v >> 4 & 15, withCharm = (c, k) => c < 0 || !k ? c : c | k << 4;
const leavesOf = v => (v >> 8) & 63, catnip = bits => NIP | bits << 8, leafList = v => [0, 1, 2, 3, 4, 5].filter(c => leavesOf(v) >> c & 1);
const isStone = c => c === 6 || c >= 10, coatOf = c => c >= 10 ? c - 10 : -1;
// What two bumping blocks make: the same primary joins into one; two different primaries mix; a primary and the
// one mix that doesn't hold its mark (its complement) set into stone; anything else just bumps (-1).
// Levels 10 to 12 add black (7) and white (8). Black wipes out whatever it bumps, and itself (VANISH), except white: black
// and white set into stone. White never combines; when it and a colour bump, either way, it takes that colour (slideLine).
const VANISH = -2;
function combine(a, b) {
  if (a === 7 || b === 7) return a === 8 || b === 8 ? 6 : VANISH;
  if (a === NIP || b === NIP) return -1;   // catnip never mixes
  if (a === 6 || b === 6 || a === 8 || b === 8) return -1;
  const prim = c => c % 2 === 0;
  if (prim(a) && prim(b)) return a === b ? a : {"0,2": 1, "2,4": 3, "0,4": 5}[[a, b].sort().join()];
  const p = prim(a) ? a : prim(b) ? b : -1, s = prim(a) ? b : a;
  if (p < 0) return -1;
  return {0: 3, 2: 5, 4: 1}[p] === s ? 6 : -1;
}
// The squares of row or column l (axis 0 a row, 1 a column), starting at the end its blocks slide towards.
function lineOf(axis, l, back) { const L = [...Array(N)].map((_, k) => axis ? k * N + l : l * N + k); return back ? L : L.reverse(); }
// Slide one line's blocks to its first end, each combining once at most; stone stays where it is and blocks stop
// against it. A charm stays with its block, and with what its block combines into (except stone). Chapter 3: a paw's
// block that bumps another swaps places with it instead (or with the stone it slides up against), and a colour that
// slides up against bare stone gives it a coat of that colour. Returns the moves ({from, to}), the squares where
// blocks combined or vanished, and stone that was painted (only when paint is on: from painted stone's level).
function slideLine(g, L, paint) {
  const moves = [], merged = [], vanish = [], painted = [];
  let seg = [], wall = -1;   // the stone the blocks of seg slide up against (-1: the end of the line)
  const flush = () => {
    const out = [];   // {c, k (charm), v (catnip's number), at, from, done}
    for (const i of seg) {
      const v = g[i]; if (v < 0) continue;
      const c = col(v), k = charmOf(v), last = out[out.length - 1], at = seg[out.length];
      if (last && k === PAW) {   // the paw swaps with the block it bumps
        const mv = moves.find(x => x.to === last.at); if (mv) mv.to = at; else moves.push({from: last.at, to: at});
        moves.push({from: i, to: last.at});
        out.splice(out.length - 1, 1, {c, k, v, at: last.at, from: i, done: true}, {...last, at});
        continue;
      }
      if (last && !last.done) {
        const r = combine(last.c, c);
        if (r === VANISH) { moves.push({from: i, to: last.at}); vanish.push(last.at); out.pop(); continue; }
        if (r >= 0) { last.c = r; last.k = r === 6 ? 0 : last.k || k; last.done = true; moves.push({from: i, to: last.at}); merged.push(last.at); continue; }
      }
      // white takes the colour of a block it bumps, whichever of them is moving (neither merges)
      let cc = c;
      if (c === 8 && at !== i && last && last.c >= 0 && last.c <= 5) { cc = last.c; merged.push(at); }
      else if (last && !last.done && last.c === 8 && c >= 0 && c <= 5 && at !== i) { last.c = c; last.done = true; merged.push(last.at); }
      out.push({c: cc, k, v, at, from: i, done: cc !== c}); if (at !== i) moves.push({from: i, to: at});
    }
    seg.forEach((i, k) => { const o = out[k]; g[i] = !o ? -1 : o.c === NIP ? o.v : withCharm(o.c, o.k); });

    if (wall >= 0 && out.length) {
      const o = out[0];
      if (o.k === PAW) {
        const stone = g[wall]; g[wall] = g[seg[0]]; g[seg[0]] = stone;
        const mv = moves.find(x => x.from === o.from); if (mv) mv.to = wall; else moves.push({from: o.from, to: wall});
        moves.push({from: wall, to: seg[0]});

    }

}
// What a square can count as in a line of colour: its colour; catnip, any colour it still has a leaf for; painted
// stone, its coat; bare stone, none (it makes lines of stone).
const counts_as = v => { const c = col(v); return c === NIP ? leafList(v) : c >= 10 ? [c - 10] : c === 6 ? [] : [c]; };
// Whole rows and columns of one colour, or of stone, clear. Each line takes only what matched it: a line of colour
// takes painted stone's coat and leaves the stone, bare; a line of stone takes the stone and leaves any coat as a plain
// block. Stone next to a cleared square crumbles (painted stone leaving its coat). Returns the lines ({cells, c, coat:
// whether it took a coat}) and the stone that crumbled.
function clearLines(g) {
  const lines = [], coat = new Set(), stone = new Set(), gone = new Set();
  for (let l = 0; l < N; l++) for (const ax of [0, 1]) {
    const L = lineOf(ax, l, true);
    if (L.some(i => g[i] < 0)) continue;
    let opts = null;
    for (const i of L) { const o = counts_as(g[i]); opts = opts ? opts.filter(x => o.includes(x)) : o; if (!opts.length) break; }
    if (opts.length) { const took = L.filter(i => col(g[i]) >= 10); lines.push({cells: L, c: opts[0], coat: took.length > 0}); L.forEach(i => (col(g[i]) >= 10 ? coat : gone).add(i)); }
    else if (L.every(i => isStone(col(g[i])))) { lines.push({cells: L, c: 6}); L.forEach(i => (col(g[i]) >= 10 ? stone : gone).add(i)); }
  }
  const hit = new Set([...coat, ...stone, ...gone]), crumble = [];
  for (const i of hit) for (const j of [i - N, i + N, i % N ? i - 1 : -1, i % N < N - 1 ? i + 1 : -1]) if (j >= 0 && j < N * N && !hit.has(j) && isStone(col(g[j])) && !crumble.includes(j)) crumble.push(j);
  crumble.forEach(i => stone.add(i));
  for (const i of hit) if (!coat.has(i) && !stone.has(i)) g[i] = -1;
  for (const i of new Set([...coat, ...stone])) {
    const c = col(g[i]);
    if (c === 6) g[i] = -1;                                   // bare stone crumbling
    else if (coat.has(i) && stone.has(i)) g[i] = -1;          // both layers taken
    else g[i] = coat.has(i) ? 6 : c - 10;                     // one layer left
  }
  return {lines, crumble};
}
// Catnip, as each move ends: every catnip drops one leaf, picked from the board's seed and the move (so Undo and a
// share link give the same), and catnip down to its last leaf turns into that colour's plain paint. Returns the
// squares that turned.
function wither(g, grid) {
  const turned = [];
  grid.forEach((v, i) => {
    if (col(v) !== NIP) return;
    const left = leafList(v); if (left.length <= 1) { grid[i] = left.length ? left[0] : -1; turned.push(i); return; }
    const r = seeded(g.seed * 613 + g.moves * 7919 + i * 31), drop = left[Math.floor(r() * left.length)], rest = left.filter(c => c !== drop);
    if (rest.length === 1) { grid[i] = rest[0]; turned.push(i); } else grid[i] = catnip(rest.reduce((b, c) => b | 1 << c, 0));
  });
  return turned;
}
// Lines that bask: the sunbeam's own row, cleared in the sunbeam's colour.
const basking = (tray, lines) => !tray.sun ? [] : lines.filter(x => x.c === tray.sun[1] && x.cells.every(i => Math.floor(i / N) === tray.sun[0]));
// A move's lines, added to the game: lines that count, the colours made (for need goals), coats taken and basking
// (which has the next block fall in with a charm).
function tally(g, c) {
  g.lines += counts(g.level, c.lines).length; g.got = [...(g.got || []), ...c.lines.map(x => x.c)];
  g.coats = (g.coats || 0) + c.lines.filter(x => x.coat).length;
  const b = basking(trayFor(g), c.lines).length; if (b) { g.basks = (g.basks || 0) + b; g.reward = true; }
}
// The tray (chapter 2 on): rows that turn round instead of sliding (carousel rows), and a pair of linked cat flaps,
// each [row, side] (side 0 the left end, 1 the right), on two other rows. Picked from the board's seed, so a share
// link gets the same tray.
// Chapter 4 adds a sunbeam (sun: [row, colour], the colour of its window's pane, one the level drops), springs ([row,
// side] each) and scratching posts ([row, x]: between squares x and x + 1). Each piece has a row of its own.
function trayOf(level, seed, order = [0, 1, 2]) {
  const L = LEVELS[level] || {}, r = seeded(seed * 104729 + 17), rows = [0, 1, 2, 3, 4];
  for (let k = rows.length - 1; k > 0; k--) { const j = Math.floor(r() * (k + 1)); [rows[k], rows[j]] = [rows[j], rows[k]]; }
  let at = 0; const take = () => rows[at++];
  const turn = []; for (let k = 0; k < (L.turn || 0); k++) turn.push(take()); turn.sort();
  const flaps = L.flaps ? [[take(), r() < .5 ? 0 : 1], [take(), r() < .5 ? 0 : 1]] : null;
  let sun = null;
  if (L.sun) { const d = boardColours(level, seed, order).drops, prim = [0, 2, 4].filter(c => d[c]); sun = [take(), prim[Math.floor(r() * prim.length)]]; }
  const springs = [], posts = [];
  for (let k = 0; k < (L.springs || 0); k++) springs.push([take(), r() < .5 ? 0 : 1]);
  for (let k = 0; k < (L.posts || 0); k++) posts.push([take(), 1 + Math.floor(r() * 2)]);
  return {turn, flaps, sun, springs, posts, paint: level >= PAINT_FROM};
}
// Slide a sunbeam's row: blocks in the sun are lazy, so each moves one square at most (combining, swapping or painting
// as a slide would).
function lazySlide(g, L, paint) {
  const out = {moves: [], merged: [], vanish: [], painted: []}, done = new Set();
  for (let k = 1; k < L.length; k++) {
    const i = L[k], j = L[k - 1];
    if (g[i] < 0 || isStone(col(g[i])) || (g[j] >= 0 && done.has(j))) continue;
    const r = slideLine(g, [j, i], paint);
    for (const key in out) out[key].push(...r[key]);
    r.merged.forEach(x => done.add(x));
  }
  return out;
}
const noTray = {turn: [], flaps: null, sun: null, springs: [], posts: []};
// A move: {k: "line", ax, l, back} slides a row or column (and, on a row with a cat flap, sends the block that reaches
// the flap's end out through it and in at the other flap, if it can land there); {k: "turn", l, back} turns a carousel
// row one square (left when back), the end block coming round to the other end and nothing combining; {k: "step", i,
// ax, back} moves a kitten's block alone, one square, combining as a slide would. Returns the board after, the
// blocks' moves, where blocks combined or vanished, a block through a flap (thru: [from, to]), and whether anything
// changed.
function applyMove(g, m, tray = noTray) {
  const h = g.slice();

  const r = applyMove(game.grid, m, trayFor(game)), h = r.grid, c = clearLines(h.slice());
  r.painted.forEach(i => { const g = document.createElement("div"); g.className = "ghost"; const [x, y] = xyOf(i); g.style.left = x * 20 + "%"; g.style.top = y * 20 + "%"; g.innerHTML = "<span>🖌</span>"; $("grid").append(g); });
  moveCells(m, trayFor(game)).forEach(i => $("grid").querySelector(`.slot[data-i="${i}"]`).classList.add("lit"));
  const put = (i, t) => { const g = document.createElement("div"); g.className = "ghost"; const [x, y] = xyOf(i); g.style.left = x * 20 + "%"; g.style.top = y * 20 + "%"; g.innerHTML = `<span>${t}</span>`; $("grid").append(g); };
  r.merged.forEach(i => put(i, col(h[i]) === 6 ? "●" : "+")); r.vanish.forEach(i => put(i, "✕"));
  if (r.thru && !r.merged.includes(r.thru[1]) && !r.vanish.includes(r.thru[1])) put(r.thru[1], "↩");
  new Set(c.lines.flatMap(x => x.cells)).forEach(i => put(i, "★"));
}
function clearGhost() { $("grid").querySelectorAll(".ghost").forEach(g => g.remove()); $("grid").querySelectorAll(".slot.lit").forEach(s => s.classList.remove("lit")); }
// Keys: the arrows move a cursor; Shift with an arrow slides the cursor's row or column that way.
function showCursor() { $("grid").querySelectorAll(".slot.kbcursor").forEach(s => s.classList.remove("kbcursor")); const i = keys ? keys.at() : -1; if (i >= 0) { const s = $("grid").querySelector(`.slot[data-i="${i}"]`); if (s) s.classList.add("kbcursor"); } }
const keys = G.gridKeys({
  on: () => playing(), show: () => showCursor(), size: () => [N, N], start: () => 12,
  move(i, dx, dy, e) {
    const [x, y] = xyOf(i);
    if (e && e.shiftKey) { dragMove(i, dx ? [0, y, dx < 0] : [1, x, dy < 0]); return i; }
    return Math.max(0, Math.min(N - 1, y + dy)) * N + Math.max(0, Math.min(N - 1, x + dx));
  },
  act: () => false,
});
// Undo (G.history): each step is a snapshot of the board (JSON, the newest 50 kept in game.history). It can take back a
// lost board (from the Stuck! card), and Restart can be undone too.
const undo = G.history({game: () => game, take: snap, cap: 50, can: () => !!game && !busy && !game.won,
  back: (h, g) => { g.lost = false; Object.assign(g, JSON.parse(h)); }, after: () => { G.closeCard(); draw(); save(); }, restart: true});
$("restartBtn").onclick = () => {
  if (undo.restart(g => Object.assign(g, JSON.parse(g.start), {lines: 0, got: [], moves: 0, mixes: MIXES, lost: false})))
    G.note("Back to the start of the level. Undo brings it back.", 3500);
};
// Mix it up: the cat bats the board and every block that isn't stone lands somewhere new. Two a level.
$("shuffleBtn").onclick = () => {
  if (!playing() || !game.mixes) return;
  undo.push(); game.mixes--; game.mixed = true;
  const r = seeded(game.seed * 31 + game.moves * 7 + game.mixes), free = game.grid.map((c, i) => isStone(col(c)) ? -1 : i).filter(i => i >= 0);
  const vals = free.map(i => game.grid[i]);
  for (let k = vals.length - 1; k > 0; k--) { const j = Math.floor(r() * (k + 1)); [vals[k], vals[j]] = [vals[j], vals[k]]; }
  free.forEach((i, k) => { game.grid[i] = vals[k]; });
  // shuffling can't leave a whole line done for you
  clearLines(game.grid);
  game.lost = false; G.closeCard(); draw(); save(); G.note("The cat mixed it up!", 2000);
  if (!slides(game).length) lose();   // still nothing can slide: say so again
};

/* ---------- hints ---------- */
// Hint tries every slide and shows the best: lines that count, then blocks lining up, then room.
const hints = G.hinter({game: () => game, key: () => game ? game.grid.join() : "", draw: () => paintHint()});
function paintHint() { $("grid").querySelectorAll(".slot.hintcell").forEach(s => s.classList.remove("hintcell")); const m = hints.current(); if (m) for (const i of m.cells) $("grid").querySelector(`.slot[data-i="${i}"]`).classList.add("hintcell"); }
function score(g, spec) {
  let s = g.filter(c => c < 0).length * 3;
  for (let l = 0; l < N; l++) for (const ax of [0, 1]) { const cnt = {}; lineOf(ax, l, true).forEach(i => { const c = col(g[i]); if (c >= 0) cnt[c] = (cnt[c] || 0) + 1; }); for (const [c, n] of Object.entries(cnt)) s += n * n * (spec.stone && +c === 6 ? 3 : 1); }
  return s;
}
// On a goal level, how much a slide's lines (and the board after) help: a line of a colour still needed, or lines while
// more are wanted, then fewer of the colours that mustn't be left.
function taskValue(g, lines, h) {
  const t = taskOf(g.level, g.seed);
  if (t.coat) return lines.filter(x => x.coat).length * 1000 + h.filter(v => col(v) >= 10).length * 40;
  if (t.bask) { const tr = trayFor(g), sunRow = lineOf(0, tr.sun[0], true);
    return basking(tr, lines).length * 1000 + (t.lines && g.lines < t.lines ? counts(g.level, lines).length * 600 : 0) + sunRow.filter(i => counts_as(h[i]).includes(tr.sun[1])).length ** 2 * 15; }
  if (t.need) { const want = t.need.slice(); for (const c of g.got || []) { const k = want.indexOf(c); if (k >= 0) want.splice(k, 1); }
    return lines.filter(x => { const k = want.indexOf(x.c); if (k < 0) return false; want.splice(k, 1); return true; }).length * 1000; }
  return (g.lines < t.lines ? counts(g.level, lines).length * 1000 : 0) - h.filter(c => t.without.includes(col(c))).length * 60;
}
// The best-looking move for a game (the hint's, and the simulated player's): lines that count, then blocks lining
// up, then room.
function bestMove(g) {
  const spec = levelSpec(g.level); let best = null;
  for (const m of slides(g)) {
    const r = applyMove(g.grid, m, trayFor(g)), h = r.grid; wither(g, h); const c = clearLines(h);
    const sc = (spec.task ? taskValue(g, c.lines, h) : counts(g.level, c.lines).length * 1000) + c.lines.length * 200 + score(h, spec);
    if (!best || sc > best.sc) best = {sc, m, c};
  }
  return best;
}
$("hintBtn").onclick = () => {
  if (!playing()) return;
  const best = bestMove(game);
  if (!best) { G.note("Nothing can slide. Try Mix it up, or Undo.", 3000); return; }
  game.hinted = true; save();
  const m = best.m, way = (ax, back) => ax ? (back ? "up" : "down") : (back ? "left" : "right"), clears = best.c.lines.length ? ": it clears a line" : "";
  const text = m.k === "step" ? `Nudge the gold kitten ${way(m.ax, m.back)}${clears}.` : m.k === "turn" ? `Turn the gold row ${way(0, m.back)}${clears}.` : `Slide the gold ${m.ax ? "column" : "row"} ${way(m.ax, m.back)}${clears}.`;
  hints.show({cells: moveCells(m, trayFor(game))}, text);
};

/* ---------- endings ---------- */
// A clean win moves you up a level (the levels are already a fine ramp, so three wins at each would only drag the
// climb out) and three boards that weren't (a hint, or getting stuck) move you down: G.ladder, counted once a board
// as it ends (stuck counts even if Undo then gets you going again).
const climb = G.ladder("mewhue", MAX_LEVEL, 1, n => `level ${n}`, {wins: 1});
function win() {
  game.won = true; G.finishClock(game); update(); save();
  const next = climb.end(game, game.level, game.hinted, {what: "hints or stuck boards", none: "You had a hint, so here's another at this level."}).next;
  settings.level = next; $("levelSel").value = next; save();
  G.track(`Mew Hue won level ${game.level}`);
  const gold = !game.restarted && !game.hinted && !game.mixed, spec = levelSpec(game.level);
  let text = spec.task ? `Done: ${taskText(game, true)}, in ${game.moves} moves.` : `You cleared ${game.lines} ${spec.stone ? "line" : "line"}${game.lines === 1 ? "" : "s"}${spec.stone ? " of stone" : ""} in ${game.moves} moves.`;
  text += " " + (game.climbed.up ? `Up to level ${next}, ${levelName(next).toLowerCase()}!` : game.climbed.line);
  setTimeout(() => G.winCard(text, () => { G.closeCard(); startLevel(next); }, "Admire the board", game.result,
    {title: "Lined up!", gold, goldWhy: "No hints, mix-ups or restarts!", goldTitle: "Willow's having a nap!", goldPic: [goldPic()], next: G.ANOTHER,
     after: G.otherSize($("levelSel"), next, startLevel, G.CHANGE)}), 500);
}
function goldPic() { const im = new Image(); im.className = "goldpic"; im.src = catSrc("willow-5"); im.alt = "Willow curled up asleep"; return im; }
function lose() {
  game.lost = true; G.breakStreak();
  const c = climb.end(game, game.level, true, {what: "hints or stuck boards"}); settings.level = c.next; $("levelSel").value = c.next; save();
  G.track(`Mew Hue stuck level ${game.level}`);
  const btns = [["Undo", undo.undo, true]];
  // (the button under the board only works mid-game, so clear the stuck card and state first)
  if (game.mixes) btns.push([`Mix it up (${game.mixes} left)`, () => { G.closeCard(); game.lost = false; $("shuffleBtn").onclick(); }]);
  btns.push(["Restart", () => $("restartBtn").onclick()], ["New board", () => { G.closeCard(); newGame(); }]);
  const n = game.level, down = c.down ? " " + c.line : "";
  setTimeout(() => G.loseCard("Stuck!", (levelSpec(n).task ? `Nothing can slide. The goal was ${taskText(game, true)}.` : `Nothing can slide. You cleared ${game.lines} of ${levelSpec(n).goal}.`) + down, btns,
    null, G.otherSize($("levelSel"), c.next, startLevel, G.CHANGE), {result: {n}}), 400);
}

/* ---------- new boards ---------- */
function startLevel(n) { settings.level = n; $("levelSel").value = n; save(); newGame(); }
function newGame(seed = Math.floor(Math.random() * 2 ** 31), order) {
  game = deal(settings.level, seed, order); hints.clear(false); draw(); save();
  G.track(`Mew Hue new board level ${settings.level}`);
  helpOnFirstVisit();
}
$("linkBtn").onclick = () => { if (game) G.shareCard({name: "Mew Hue", won: game.won, what: "board", puzzle: () => ({g: "mewhue", N: game.level, s: game.seed, o: game.order.join(""), v: 2})}); };
function openShared(d) {
  if (!d.v && Number.isInteger(d.N)) d = {...d, N: OLD[d.N] || d.N};   // a link from before the levels were filled out
  const o = typeof d.o === "string" ? [...d.o].map(Number) : settings.order;
  if (!(d.N >= 1 && d.N <= MAX_LEVEL) || !Number.isInteger(d.s) || d.s < 0 || !isOrder(o)) { G.note("That share link didn't work.", 5000); return; }
  settings.level = d.N; $("levelSel").value = d.N; newGame(d.s, o);
}

/* ---------- how to play ---------- */
// The first board gets the whole walkthrough; each later level, the first time, a step for what's new.
function showHelp() { if (game) { settings.seen = {}; helpOnFirstVisit(true); } }
// The walkthrough shows each rule by doing it: a step sets out a few blocks on an empty board and you make the
// slide, then it says what happened. G.yourTurn puts your own board back afterwards, exactly as it was. The first
// board gets a mix and a line; each later level, the first time, a demo of what's new on it.
function helpOnFirstVisit(all) {
  if (!game || !playing() || document.querySelector(".spot")) return;
  const n = game.level, first = all || !Object.keys(settings.seen).length;
  if (settings.seen[n] && !all) return;
  const turn = G.yourTurn(() => game, g => { game = g; }, draw);
  const PAIRS = [[0, 2, 1], [0, 4, 5], [2, 4, 3]], COMP = {0: 3, 2: 5, 4: 1};
  const name = c => Cap(COLOURS[c].name), row2 = [10, 11, 12, 13, 14].map(xyOf), col4 = [4, 9, 14, 19, 24].map(xyOf);
  let was = 0;
  // a demo: blocks set out ([square, colour]…), the squares to light, what to do, and what you see after
  const demo = (say, put, lit, yes, tray) => ({say, lit, ...turn.from, try: {done: () => game.moves !== was, yes},
    enter() { turn.from.enter(); const g = new Array(N * N).fill(-1); for (const [i, c] of put) g[i] = c; Object.assign(game, {grid: g, demo: true, tray: tray || noTray}); was = game.moves; hints.clear(false); draw(); }});
  // slide a row left: a on the left, b further along, so b slides up to a
  const meet = (a, b, yes) => demo("Drag this row left", [[10, a], [13, b]], row2, yes);
  const pair = k => PAIRS[game.order[k]];
  const [a1, b1, m1] = pair(0);
  const steps = [];
  // in plain colour words: the goal first, then two colours mixing, what the marks are for, and a line clearing
  if (first) steps.push({say: "Make a whole row or column one colour", lit: [...Array(N * N).keys()].map(xyOf)},
    meet(a1, b1, `${name(a1)} and ${name(b1)} make ${name(m1)}!`),
    {say: `Every colour has a mark. ${name(m1)} has both of its colours' marks`, els: [$("rules")]},
    // four in a row, and a fifth pushed up the last column, stopping under two mixes that won't take it
    demo(`Drag this column up to finish the line of ${COLOURS[a1].name}`, [[10, a1], [11, a1], [12, a1], [13, a1], [4, m1], [9, m1], [24, a1]], col4, "A whole line clears!"));
  const sp = boardColours(n, game.seed, game.order);
  // what's new on this level, the first time it comes up
  const intro = LEVELS[n].intro;
  if (intro === "pair") { const [a, b, m] = pair(1); steps.push(meet(a, b, `${name(a)} and ${name(b)} make ${name(m)}!`)); }
  if (intro === "full") { const [a, , m] = pair(2); steps.push(meet(m, a, `${name(m)} won't mix again`)); }
  if (intro === "mixes") { const [s1, s2] = sp.key.map(b => b[0]); steps.push(meet(s1, s2, "Two mixes never mix")); }
  if (intro === "stone") { const [p, , q] = sp.key[0]; steps.push(meet(p, q, "Stone! It never moves")); }
  if (intro === "third") steps.push({say: "Now all three colours fall", els: [$("rules")]});
  if (intro === "black") steps.push(meet(0, 7, "Black wipes them both out"));
  if (intro === "white") steps.push(meet(0, 8, "White copies the colour"));
  if (intro === "both") steps.push(meet(8, 7, "White and black make stone"));
  if (intro === "goal") steps.push({say: "Now each level has its own goal", els: [$("count")]});
  if (intro === "alike") steps.push({say: "No colour is rarer now", els: [$("grid")]});
  // chapter 2: the tray, on the level's own pair of colours
  const [pa, pb, pm] = sp.key[0].length === 3 ? [sp.key[0][0], sp.key[0][2], sp.key[0][1]] : [0, 2, 1];
  if (intro === "carousel") steps.push(demo("This row turns round. Drag it right", [[10, pa], [11, pb], [13, pm], [14, pa]], row2, "Round it goes: the end block comes back at the start, and nothing mixes", {turn: [2], flaps: null}));
  if (intro === "kitten") steps.push(demo("Drag the kitten right: it moves on its own", [[11, withCharm(pa, KITTEN)], [12, pb], [14, pa]], [xyOf(11), xyOf(12)], `Just the kitten moved, and ${COLOURS[pa].name} and ${COLOURS[pb].name} made ${COLOURS[pm].name}. Drag any other block and its whole line slides`));
  if (intro === "catnip") steps.push({say: "Catnip counts as any colour it still has a leaf for", els: [$("rules")]},
    demo("Slide this column down to finish the line", [[10, pa], [11, pa], [12, catnip(1 << pa | 1 << pb)], [13, pa], [4, pa], [19, pm], [24, pb]], [4, 9, 14, 19, 24].map(xyOf), "The catnip counted as " + COLOURS[pa].name + "!"),
    {say: "Each move it drops a leaf. On its last leaf, it turns into that colour", els: [$("grid")]});
  if (intro === "painted") { const [p, , q] = sp.key[0]; steps.push(demo("Slide this row left into the stone", [[11, 6], [14, p], [6, q]], row2, `The stone took a coat of ${COLOURS[p].name}. It counts as ${COLOURS[p].name} in a line now, and stays stone underneath`, {turn: [], flaps: null, paint: true})); }
  if (intro === "coatstays") steps.push({say: "A line of stone takes the stone, and leaves any coat behind as a plain block", els: [$("grid")]});
  if (intro === "paw") steps.push(demo("Drag this row left: the paw swaps past", [[10, pa], [11, pm], [14, withCharm(pb, PAW)]], row2, "The paw swapped places instead of mixing"));
  if (intro === "sun") steps.push(demo("Blocks in a sunbeam are lazy. Drag this row right", [[10, pa], [11, pb], [6, pm]], row2, "Each moved just one square", {...noTray, sun: [2, pa]}),
    {say: "The sunbeam's colour is its window's pane", lit: [xyOf(10)]});
  if (intro === "bask") steps.push({say: "Clear a line of the sunbeam's colour in the beam, and the next block brings a charm", els: [$("count")]});
  if (intro === "spring") steps.push(demo("Slide this row right, into the spring", [[12, pa], [10, pm]], row2, "Boing! It bounced back to the far end. Which way you slide changes what meets what", {...noTray, springs: [[2, 1]]}));
  if (intro === "post") steps.push(demo("This row has a post. Drag the right side left", [[10, pa], [13, pb]], [12, 13, 14].map(xyOf), "Only that side moved: a post splits its row in two. A row still clears when all five match", {...noTray, posts: [[2, 1]]}));
  if (intro === "flaps") steps.push(demo("Slide this row right, out through the cat flap", [[7, pa], [16, pa], [17, pa], [18, pa], [19, pa]], [5, 6, 7, 8, 9].map(xyOf), "In through the other flap: a whole line!", {turn: [], flaps: [[1, 1], [3, 0]]}));
  if (!steps.length) { settings.seen[n] = true; save(); return; }
  steps[steps.length - 1].leave = turn.upTo.leave;   // put the real board back after the last demo
  if (first) steps.push({say: "Mix it up shuffles the board", els: [$("shuffleBtn")]}, {say: "Stuck? Hint shows a good slide", els: [$("hintBtn")]});
  G.spotlight({grid: $("grid"), w: N, h: N, steps, finish: first ? undefined : false, done: () => { settings.seen[n] = true; if (first) for (let k = 1; k <= n; k++) settings.seen[k] = true; save(); }});
}

CHAPTERS.forEach(([from, name], k) => {
  const og = document.createElement("optgroup"), to = k + 1 < CHAPTERS.length ? CHAPTERS[k + 1][0] - 1 : MAX_LEVEL;
  og.label = `Chapter ${k + 1} · ${name}`;
  for (let n = from; n <= to; n++) og.append(new Option(`${n} · ${levelName(n)}`, n));
  $("levelSel").append(og);
});
$("levelSel").onchange = e => { G.closeCard(); startLevel(+e.target.value); };
$("newBtn").onclick = () => { G.closeCard(); newGame(); };
$("helpBtn").onclick = showHelp;
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : settings.level);
G.nav("mewhue");
$("sitter").src = catSrc("willow-2");
G.checkClock(game);
G.setupTimer({name: "mewhue", game: () => game, playing: g => !g.won && !g.lost, save, label: n => `${n} · ${levelName(n)}`, noun: "level"});
if (!(settings.level >= 1 && settings.level <= MAX_LEVEL)) settings.level = 1;
$("levelSel").value = settings.level;
const shared = G.readShare("mewhue");
if (game) G.reopen(() => { if (!levelSpec(game.level) || game.grid.length !== N * N || !isOrder(game.order)) throw new Error("the saved board doesn't fit"); draw(); if (game.lost) lose(); else helpOnFirstVisit(); },
  why => { game = null; newGame(); G.note(why, 0); });
else if (!shared) newGame();
if (shared) G.offerShare(shared, {name: "Mew Hue", inProgress: !!(game && game.history.length && !game.won), open: openShared, after: helpOnFirstVisit, fresh: game ? null : why => { newGame(); G.note(why, 6000); }});
window.addEventListener("hashchange", () => { const d = G.readShare("mewhue"); if (d) G.offerShare(d, {name: "Mew Hue", inProgress: !!(game && game.history.length && !game.won), open: openShared, after: helpOnFirstVisit}); });
</script>
