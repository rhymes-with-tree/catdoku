<script>
/* ---------- the climbing wall (plain functions: the puzzle maker runs them in a worker too) ---------- */
// World units: the wall is 360 wide and 424 tall. Things knocked off the top shelf bounce down through rows of
// sisal posts (seen end-on, as round pegs), carpeted perches and springs, and land in the cat beds along the bottom.
// The physics is fixed-step and seeded, so a ball dropped from the same spot on the same wall always ends up in the
// same bed: Restart, a shared link and the hint all see the same thing the player does.
function plinkoLevels() {
  // beds: the points for each bed, left to right (0 is a napping cat); naps: which of them are cats; perches, springs
  // and holes (posts left out) come at random places; balls: how many Gus and Peanut have; aim: the target's share
  // of what good aiming makes, gold: the gold paw's
  return [null,
    {beds: [10, 25, 50, 100, 50, 25, 10], perches: 0, springs: 0, holes: 0, balls: 10},
    {beds: [25, 10, 50, 100, 50, 10, 25], perches: 2, springs: 0, holes: 2, balls: 10},
    {beds: [50, 10, 25, 100, 25, 10, 50], perches: 2, springs: 2, holes: 2, balls: 10},
    {beds: [25, 50, 100, 0, 100, 50, 25], perches: 3, springs: 2, holes: 3, balls: 10, naps: [3]},
    {beds: [10, 100, 25, 0, 50, 25, 10], perches: 3, springs: 3, holes: 3, balls: 10, naps: [3], shuffle: true},
    {beds: [25, 0, 50, 10, 100, 10, 0, 25], perches: 4, springs: 3, holes: 4, balls: 10, naps: [1, 6], shuffle: true},
    {beds: [10, 50, 0, 25, 100, 0, 25, 50, 10], perches: 4, springs: 4, holes: 4, balls: 10, naps: [2, 5], shuffle: true},
    {beds: [25, 0, 10, 100, 0, 50, 0, 25, 10], perches: 5, springs: 4, holes: 5, balls: 10, naps: [1, 4, 6], shuffle: true},
  ];
}
// The things Gus and Peanut knock off the shelf, and how each one falls: r its size, g how heavy (gravity's share),
// e how much it bounces off a post, drag how much the air slows it, wob how far each knock turns it aside.
// Yarn is soft, a tennis ball bouncy, a fluffball and a feather drift, a bell or a mug drops like a stone, a wiffle
// ball or a spiky ball flies off any which way. lv: the first level it comes on.
function plinkoKinds() {
  return {
    yarn:    {name: "ball of yarn", r: 9,  g: 1,    e: .35, drag: 0,   wob: .15, lv: 1},
    tennis:  {name: "tennis ball",  r: 9,  g: 1,    e: .7,  drag: 0,   wob: .12, lv: 1},
    fluff:   {name: "fluffball",    r: 10, g: .6,   e: .55, drag: 1.1, wob: .35, lv: 1},
    bell:    {name: "bell",         r: 8,  g: 1.3,  e: .15, drag: 0,   wob: .08, lv: 2},
    mouse:   {name: "toy mouse",    r: 9,  g: 1,    e: .2,  drag: .3,  wob: .3,  lv: 2},
    lemon:   {name: "lemon",        r: 10, g: 1.1,  e: .3,  drag: 0,   wob: .2,  lv: 3},
    wiffle:  {name: "wiffle ball",  r: 10, g: .8,   e: .6,  drag: .8,  wob: .5,  lv: 3},
    mug:     {name: "coffee mug",   r: 11, g: 1.35, e: .1,  drag: 0,   wob: .1,  lv: 4, spill: "#6B4A3B"},
    glass:   {name: "glass of water", r: 10, g: 1.3, e: .08, drag: 0,  wob: .15, lv: 4, spill: "#8EC5E8"},
    feather: {name: "feather",      r: 10, g: .5,   e: .3,  drag: 1.7, wob: .6,  lv: 4},
    spiky:   {name: "spiky ball",   r: 9,  g: 1,    e: .45, drag: 0,   wob: .7,  lv: 5},
    phone:   {name: "phone",        r: 10, g: 1.2,  e: .05, drag: 0,   wob: .25, lv: 5},
    plant:   {name: "succulent",    r: 11, g: 1.25, e: .12, drag: 0,   wob: .15, lv: 6},
    spring:  {name: "spring toy",   r: 10, g: .85,  e: .8,  drag: .3,  wob: .35, lv: 3},
  };
}
function plinkoRng(s) { return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function plinkoGeom() { return {W: 360, H: 424, R: 11, PEG: 6, SPRING: 10, BED_TOP: 356, ROW0: 66, ROWS: 8, DY: 35, DX: 40, DROP: 16}; }
// The wall for a level and seed: posts, perches, springs and beds.
function makeWall(n, seed) {
  const L = plinkoLevels()[n], C = plinkoGeom(), rnd = plinkoRng(seed);
  const pegs = [];
  for (let k = 0; k < C.ROWS; k++) {
    const y = C.ROW0 + k * C.DY;
    // posts 40 apart, every other row shifted half a gap, never so near a side that a ball could wedge there
    if (k % 2 === 0) for (let j = 1; j < 9; j++) pegs.push({x: j * C.DX, y, k, j});
    else for (let j = 1; j < 8; j++) pegs.push({x: 20 + j * C.DX, y, k, j});
  }
  const pick = ok => { const c = pegs.filter(p => !p.gone && !p.used && ok(p)); return c.length ? c[Math.floor(rnd() * c.length)] : null; };
  const perches = [], springs = [];
  // a perch takes the place of two posts side by side in a row (not the top row or the bottom one), tilted so things roll off
  for (let i = 0; i < L.perches; i++) {
    const a = pick(p => p.k > 0 && p.k < C.ROWS - 1 && pegs.some(q => q.k === p.k && q.j === p.j + 1 && !q.used && !q.gone));
    if (!a) break;
    const b = pegs.find(q => q.k === a.k && q.j === a.j + 1);
    a.used = b.used = true;
    for (const q of pegs) if (Math.abs(q.k - a.k) === 1 && q.x > a.x - 30 && q.x < b.x + 30) q.used = q.used || "near";
    const tilt = rnd() < .5 ? -1 : 1;
    perches.push({x1: a.x, y1: a.y - 9 * tilt, x2: b.x, y2: b.y + 9 * tilt});
  }
  for (let i = 0; i < L.springs; i++) {
    const p = pick(p => p.k > 1 && p.x > 30 && p.x < C.W - 30);
    if (!p) break;
    p.used = true; springs.push({x: p.x, y: p.y});
  }
  for (let i = 0; i < L.holes; i++) { const p = pick(p => p.k > 0); if (!p) break; p.gone = true; }
  const posts = pegs.filter(p => !p.gone && !(p.used === true)).map(p => ({x: p.x, y: p.y}));
  // springs and perches replace the posts they stand for
  const keep = posts.filter(p => !springs.some(s => s.x === p.x && s.y === p.y) && !perches.some(q => (q.x1 === p.x || q.x2 === p.x) && Math.abs((q.y1 + q.y2) / 2 - p.y) < 1));
  let values = L.beds.slice(), naps = (L.naps || []).slice();
  if (L.shuffle && rnd() < .5) { values.reverse(); naps = naps.map(i => values.length - 1 - i); }
  const nb = values.length, bw = C.W / nb;
  const beds = values.map((v, i) => ({x1: i * bw, x2: (i + 1) * bw, v, nap: naps.includes(i)}));
  // what each throw is (and, for yarn, its colour), from the things this level has
  const K = plinkoKinds(), pool = Object.keys(K).filter(k => K[k].lv <= n);
  const items = Array.from({length: L.balls}, () => ({k: pool[Math.floor(rnd() * pool.length)], c: Math.floor(rnd() * 8)}));
  return {n, seed, posts: keep, perches, springs, beds, balls: L.balls, items};
}
// One step of a ball (1/240 s). Bounces off posts, springs, perches, the bed walls and the sides; a little seeded wobble
// at each post keeps it from being too predictable.
function plinkoStep(t, b) {
  const C = plinkoGeom(), h = 1 / 240, G = 900 * b.g, R = b.r;
  const rnd = () => { b.s = (b.s + 0x6D2B79F5) | 0; let q = Math.imul(b.s ^ (b.s >>> 15), 1 | b.s); q = (q + Math.imul(q ^ (q >>> 7), 61 | q)) ^ q; return ((q ^ (q >>> 14)) >>> 0) / 4294967296; };
  b.vy += G * h;
  if (b.drag) { b.vx *= 1 - b.drag * h; b.vy *= 1 - b.drag * h; }
  const sp = Math.hypot(b.vx, b.vy); if (sp > 900) { b.vx *= 900 / sp; b.vy *= 900 / sp; }
  b.x += b.vx * h; b.y += b.vy * h;
  const hitRound = (cx, cy, rr, e, kick) => {
    const dx = b.x - cx, dy = b.y - cy, d2 = dx * dx + dy * dy, s = R + rr;
    if (d2 >= s * s) return false;
    const d = Math.sqrt(d2) || .001, nx = dx / d, ny = dy / d;
    b.x = cx + nx * s; b.y = cy + ny * s;
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) {
      b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
      if (kick) { const out = b.vx * nx + b.vy * ny; if (out < kick) { b.vx += (kick - out) * nx; b.vy += (kick - out) * ny; } }
      // the wobble: turn the speed a little, more the harder it hit
      const a = (rnd() - .5) * b.wob, c = Math.cos(a), s2 = Math.sin(a), vx = b.vx;
      b.vx = vx * c - b.vy * s2; b.vy = vx * s2 + b.vy * c;
      b.hits++;
    }
    return true;
  };
  const hitSeg = (x1, y1, x2, y2, hr, e) => {
    const ex = x2 - x1, ey = y2 - y1, l2 = ex * ex + ey * ey, u = Math.max(0, Math.min(1, ((b.x - x1) * ex + (b.y - y1) * ey) / l2));
    const px = x1 + ex * u, py = y1 + ey * u, dx = b.x - px, dy = b.y - py, d2 = dx * dx + dy * dy, s = R + hr;
    if (d2 >= s * s) return false;
    const d = Math.sqrt(d2) || .001, nx = dx / d, ny = dy / d;
    b.x = px + nx * s; b.y = py + ny * s;
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) { b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny; b.vx *= .995; }
    return true;
  };
  if (b.y > C.ROW0 - 22 && b.y < C.BED_TOP) {
    for (const p of t.posts) if (Math.abs(p.y - b.y) < 20 && Math.abs(p.x - b.x) < 20) hitRound(p.x, p.y, C.PEG, b.e, 0);
    for (const s of t.springs) if (Math.abs(s.y - b.y) < 22 && Math.abs(s.x - b.x) < 22 && hitRound(s.x, s.y, C.SPRING, Math.max(.9, b.e), 330)) b.boing = (b.boing || 0) + 1;
    for (const q of t.perches) if (b.y > Math.min(q.y1, q.y2) - 20 && b.y < Math.max(q.y1, q.y2) + 20) hitSeg(q.x1, q.y1, q.x2, q.y2, 4, .25);
  }
  // the bed walls: a post between each pair of beds
  if (b.y > C.BED_TOP - 14) for (const bd of t.beds) if (bd.x1 > 1) hitSeg(bd.x1, C.BED_TOP, bd.x1, C.H, 3, .3);
  if (b.x < R) { b.x = R; if (b.vx < 0) b.vx = -b.vx * .5; }
  if (b.x > C.W - R) { b.x = C.W - R; if (b.vx > 0) b.vx = -b.vx * .5; }
  if (b.y < R) { b.y = R; if (b.vy < 0) b.vy = 0; }
}
// A new ball, dropped at x by the i-th throw (seeded by the wall's seed and i).
function plinkoBall(t, x, i) {
  const C = plinkoGeom(), it = t.items[i], K = plinkoKinds()[it.k];
  return {x: Math.max(K.r, Math.min(C.W - K.r, x)), y: C.DROP, vx: 0, vy: 40, hits: 0, t: 0, i, k: it.k, r: K.r, g: K.g, e: K.e, drag: K.drag, wob: K.wob, s: (t.seed ^ Math.imul(i + 1, 0x9E3779B1)) | 0};
}
// Has it landed? Once it's down in a bed; returns that bed's index.
function plinkoLanded(t, b) {
  const C = plinkoGeom();
  if (b.y < C.H - b.r - 14 && b.t < 30) return -1;
  for (let k = 0; k < t.beds.length; k++) if (b.x < t.beds[k].x2 || k === t.beds.length - 1) return k;
  return -1;
}
// Where a ball dropped at x ends up: the bed, and (if asked) the path it takes.
function plinkoRun(t, x, i, path) {
  const b = plinkoBall(t, x, i), pts = path ? [] : null;
  for (let s = 0; s < 240 * 30; s++) {
    plinkoStep(t, b); b.t += 1 / 240;
    if (pts && s % 6 === 0) pts.push([b.x, b.y]);
    const k = plinkoLanded(t, b); if (k >= 0) return {bed: k, pts, boing: b.boing || 0};
  }
  return {bed: plinkoLanded(t, Object.assign(b, {t: 99})), pts, boing: 0};
}
// For each throw, the bed every drop spot leads to (every 4 units across). The target score and the hint are worked
// out from these.
function plinkoAims() { const C = plinkoGeom(), xs = []; for (let x = C.R; x <= C.W - C.R; x += 4) xs.push(x); return xs; }
function plinkoMap(t, i) { return plinkoAims().map(x => plinkoRun(t, x, i).bed); }
// The puzzle maker: a wall, with a target for the score (what fair aiming makes) and a higher one for the gold paw.
function makePlinko(n) { return plinkoTargets(makeWall(n, (Math.random() * 2 ** 31) | 0)); }
function plinkoTargets(t) {
  // what each drop spot scores, throw by throw; then what a player makes dropping at random, and dropping every
  // ball round the best spot (within 20 either side). The target is halfway between; gold is the best spot's score.
  const maps = [];
  for (let i = 0; i < t.balls; i++) maps.push(plinkoMap(t, i).map(k => t.beds[k].v));
  const n = maps[0].length, avg = xs => xs.reduce((a, b) => a + b, 0) / xs.length;
  const random = maps.reduce((s, m) => s + avg(m), 0);
  let spot = 0;
  for (let c = 0; c < n; c++) spot = Math.max(spot, maps.reduce((s, m) => s + avg(m.slice(Math.max(0, c - 5), c + 6)), 0));
  const r5 = v => Math.max(5, Math.round(v / 5) * 5);
  t.target = r5(random + (spot - random) * .5);
  t.gold = Math.max(t.target + 50, r5(spot));
  return t;
}

/* ---------- pictures ---------- */
const C = plinkoGeom(), W = C.W, H = C.H, CAT = 66, M = 8;
const CATS = [{name: "Gus", pic: "gus-12"}, {name: "Peanut", pic: "peanut-12"}];
const KINDS = plinkoKinds();
// yarn comes in Wind Up's colours; the toys are from the toy library, and the mug, lemon, phone and succulent from Knock It Off's table
const YARN = ["#ECA818", "#4E577D", "#E16A4A", "#73A7AE", "#B94588", "#B3B94B", "#7885BA", "#6AA673"];
const TOY = {tennis: "tennis", bell: "bell-purple", mouse: "mouse", wiffle: "wiffle-red", feather: "feather-rainbow", spiky: "spiky-lime", spring: "spring"};

/* ---------- game ---------- */

/* ---------- the loop ---------- */

/* ---------- dropping ---------- */

  const g = game;
  if (!g || !["ready", "running"].includes(g.state) || g.ball || g.i >= g.wall.balls || $("overlay").classList.contains("show") || spotBlocks()) return;
  if (g.state === "ready") { g.state = "running"; g.started = true; }
  g.ball = plinkoBall(g.wall, clampAim(g.aim), g.i);
  hints.clear(false);
  status(); save();
}
function aimTo(e) { if (!game) return; const r = cv.getBoundingClientRect(); game.aim = clampAim((e.clientX - r.left) / r.width * (W + 2 * M) - M); say(); }
let down = false;
cv.addEventListener("pointerdown", e => { down = true; cv.setPointerCapture(e.pointerId); aimTo(e); });
cv.addEventListener("pointermove", e => { if (e.pointerType === "mouse" || down) aimTo(e); });
cv.addEventListener("pointerup", e => { if (down) { down = false; aimTo(e); drop(); } });
cv.addEventListener("pointercancel", () => { down = false; });
addEventListener("keydown", e => {
  if (!game || e.target.closest("select,input,textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === "ArrowLeft" || k === "ArrowRight") { e.preventDefault(); game.aim = clampAim(clampAim(game.aim) + (k === "ArrowLeft" ? -1 : 1) * (e.shiftKey ? 20 : 4)); game.started = game.started || game.state === "running"; say(); }
  else if (k === "ArrowDown" || k === " " || k === "Enter") { if (e.target.closest("button")) return; e.preventDefault(); drop(); }
});

/* ---------- hint ---------- */
// A hint works out where every spot on the shelf sends this ball (the wall's physics is the same every time) and
// marks, in gold, the middle of the widest stretch that reaches the best bed it can, counting a bed matched in tandem
// at double. Asked again on the same ball, it shows the way it will go. It costs the gold paw.
const hints = G.hinter({game: () => game, key: () => game ? `${game.i}` : "", draw: () => paint()});
$("hintBtn").onclick = () => {
  const g = game;
  if (!g || !["ready", "running"].includes(g.state)) return;
  if (g.ball) { G.note("Wait for it to land.", 2000); return; }
  const t = g.wall, xs = plinkoAims(), beds = plinkoMap(t, g.i), prev = g.landed[g.landed.length - 1];
  const worth = k => t.beds[k].v * (prev && prev.bed === k && t.beds[k].v > 0 ? 2 : 1);
  const best = Math.max(...beds.map(worth));
  let run = null;
  for (let a = 0; a < beds.length;) {
    if (worth(beds[a]) !== best) { a++; continue; }
    let b = a; while (b + 1 < beds.length && beds[b + 1] === beds[a]) b++;
    if (!run || b - a > run[1] - run[0]) run = [a, b];
    a = b + 1;
  }
  const x = xs[Math.round((run[0] + run[1]) / 2)], bed = beds[run[0]], deep = hints.level() > 0;
  const mark = {x, bed, pts: deep ? plinkoRun(t, x, g.i, true).pts : null};
  hints.show(mark, deep ? `Here's the way it goes from the gold ring: ${best} points.` : `Drop ${catOf(g.i).name}'s ${nameOf(t.items[g.i])} from the gold ring for ${best} points.${prev && t.beds[bed].v * 2 === best ? " That's a tandem!" : ""}`);
  g.hinted = true; save();
};

/* ---------- endings ---------- */
function finish(g) {
  if (game !== g || g.state !== "done") return;
  if (g.score >= g.wall.target) win(); else lose();
}
function win() {
  const g = game; g.state = "won"; G.finishClock(g);
  const next = Math.min(MAX_LEVEL, g.level + 1), gold = !g.hinted && g.score >= g.wall.gold;
  settings.level = next; $("levelSel").value = next; save(); status();
  G.track(`Kitty Plinko won level ${g.level}`);
  const im = new Image(); im.className = "pic"; im.src = src("peanut-7"); im.alt = "Peanut asleep in a round bed";
  const text = `${g.score} points, over the target of ${g.wall.target}.` + (!gold && !g.hinted ? ` ${g.wall.gold} points with no hints wins a gold paw.` : "") + (g.level === MAX_LEVEL ? "" : ` Next up: level ${next}.`);
  G.winCard(text, () => startLevel(next), "Admire the wall", g.result,
    {title: "All tucked in!", gold, goldWhy: `${g.wall.gold} points with no hints!`, goldPic: [im], next: next > g.level ? `Next: level ${next}` : "New wall",
     top: g.level === MAX_LEVEL, after: G.otherSize($("levelSel"), next, startLevel, "Or play a different level:")});
}
function lose() {
  const g = game; g.state = "lost"; status(); save();
  G.breakStreak(); G.track(`Kitty Plinko missed on level ${g.level}`);
  G.openCard("Not quite!", `${g.score} points, ${g.wall.target - g.score} short of the target of ${g.wall.target}.`,
    [["Try this wall again", () => startWall(g.wall), true], ["New wall", () => { G.closeCard(); newGame(g.level); }],
     ["Admire the wall", () => { G.closeCard(); G.note("Tap Restart to try this wall again.", 0); }], G.homeBtn()],
    null, G.otherSize($("levelSel"), g.level, startLevel, "Or play a different level:"));
}
function startLevel(n) { settings.level = n; $("levelSel").value = n; save(); G.closeCard(); newGame(n); }
$("restartBtn").onclick = () => { if (game) startWall(game.wall); };
$("newBtn").onclick = () => { if (game) newGame(game.level); };
// Share: the level and the wall, as built.
$("linkBtn").onclick = () => { if (game) G.shareCard({name: "Kitty Plinko", what: "wall", won: game.state === "won", puzzle: () => ({g: "kittyplinko", N: game.level, s: game.wall.seed})}); };
function openShared(d) {
  if (!(Number.isInteger(d.N) && d.N >= 1 && d.N <= MAX_LEVEL) || !Number.isInteger(d.s)) throw new Error("the shared wall doesn't fit the game");
  settings.level = d.N; $("levelSel").value = d.N; save(); startWall(plinkoTargets(makeWall(d.N, d.s)));
}

/* ---------- how to play ---------- */
function showHelp() { settings.seenHelp = false; helpOnFirstVisit(); if (!document.querySelector(".spot") && !(game && game.ball)) { settings.seenHelp = true; G.helpLater(); } }
function helpOnFirstVisit(n = 0) {
  if (settings.seenHelp || document.querySelector(".spot")) return;
  if (!game || !["ready", "running"].includes(game.state)) return;
  if (game.ball) { if (n < 40) setTimeout(() => helpOnFirstVisit(n + 1), 300); return; }   // let it land first
  const cols = 8, rows = 10, row = y => Math.min(rows - 1, Math.floor((CAT + y) / (CAT + H + M) * rows)), col = x => Math.max(0, Math.min(cols - 1, Math.floor((x + M) / (W + 2 * M) * cols)));
  const top = [], beds = [];
  for (let x = 0; x < cols; x++) { for (let y = 0; y <= row(C.DROP); y++) top.push([x, y]); for (let y = row(C.BED_TOP); y < rows; y++) beds.push([x, y]); }
  const t = game.wall, at = (x, y) => [[col(x), row(y)]];
  const naps = t.beds.filter(b => b.nap).flatMap(b => [...new Set([col(b.x1 + 4), col(b.x2 - 4)])].map(c => [c, rows - 1]));
  const i0 = game.i, turn = G.yourTurn(() => game, g => { game = g; }, () => { status(); paintHud(); });
  const steps = [
    {say: "Drag to aim, let go to drop", lit: top, try: {done: () => game.i > i0, yes: "Into a bed!"}, ...turn.upTo},
    {say: "Each bed scores its points", lit: beds},
    {say: "Same bed twice running: double!", lit: beds, tone: "ok"},
    ...(naps.length ? [{say: "Napping cats score nothing", lit: naps}] : []),
    ...(t.springs.length ? [{say: "Springs bounce things back up", lit: t.springs.flatMap(s => at(s.x, s.y)), later: true}] : []),
    {say: "Reach the target to win", els: [$("goal")]},
    {say: "Stuck? Hint shows a good spot", els: [$("hintBtn")]},
  ];
  G.spotlight({grid: cv, w: cols, h: rows, steps, done: () => { settings.seenHelp = true; save(); }});
}
$("helpBtn").onclick = showHelp;

/* ---------- start ---------- */
for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(levelName(n).replace("Level ", "") + (n === MAX_LEVEL ? " (hardest)" : ""), n));
$("levelSel").onchange = e => { startLevel(+e.target.value); $("levelSel").blur(); };
G.nav("kittyplinko");
G.fullScreen({btn: $("fullBtn"), name: "Kitty Plinko", change: () => paint()});
G.setupTimer({name: "kittyplinko", game: () => game, playing: g => g.state === "running", save, label: levelName, noun: "level",
  emptyText: "Reach the target on a level and your times will show up here. They're kept on this device only."});
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : settings.level);
if (!(settings.level >= 1 && settings.level <= MAX_LEVEL)) settings.level = 1;
$("levelSel").value = settings.level;
const shared = G.readShare("kittyplinko");
let openedShare = false;
if (shared) try { openShared(shared); openedShare = true; G.note("Here's the shared climbing wall. Good luck!", 6000); G.track("Kitty Plinko shared puzzle opened"); } catch (e) { G.note("That share link didn't work.", 5000); }
if (!openedShare) {
  const s = state.game;
  G.reopen(() => {
    if (!(s && s.level === settings.level && Number.isInteger(s.seed))) { newGame(settings.level); return; }
    const t = makeWall(s.level, s.seed); t.target = s.target; t.gold = s.gold;
    if (!(s.i >= 0 && s.i <= t.balls && Array.isArray(s.landed) && s.landed.every(l => t.beds[l.bed]))) throw new Error("the saved wall didn't fit");
    startWall(t);
    Object.assign(game, {i: s.i, score: s.score, landed: s.landed, splats: Array.isArray(s.splats) ? s.splats.filter(p => p && Number.isFinite(p.x) && Number.isFinite(p.y) && /^#[0-9A-F]{6}$/i.test(p.c)) : [], ball: s.ball && Number.isFinite(s.ball.x) ? s.ball : null, aim: s.aim || W / 2, hinted: !!s.hinted,
      ms: s.ms || 0, started: s.started, timed: s.timed !== false, state: s.started ? "running" : "ready"});
    G.checkClock(game); status(); paintHud();
  }, msg => { newGame(settings.level); G.note(msg, 5000); });
}
window.addEventListener("hashchange", () => { const d = G.readShare("kittyplinko"); if (d) G.offerShare(d, {name: "Kitty Plinko", inProgress: !!(game && game.started && !["won", "lost"].includes(game.state)), open: d => { try { openShared(d); } catch (e) { G.note("That share link didn't work.", 5000); } }}); });
requestAnimationFrame(frame);
setTimeout(helpOnFirstVisit, 300);
</script>
