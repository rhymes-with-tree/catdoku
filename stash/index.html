<style>
/* Mewstermind, since 2026-11-19 more of a Clue (in beta): a row of the household's cats along the top, each of whom
   played with one of the toys (and, from level 3, in one of the rooms). Every guess is a row with a toy (and a room)
   under each cat, and paw prints beside it: a dark paw for a cat you got all right, a light paw for a cat you got
   partly right, a dot for the rest, never saying which cat is which. */
.wrap.stashwrap{height:auto}
@media (orientation:landscape) and (max-height:500px){
  body:not(.full) main > .stashwrap.stage{--aspect:.8;max-height:var(--high);overflow-y:auto}
}
.stashboard{--s:56px;--gap:6px;display:flex;flex-direction:column;gap:var(--gap);padding:8px;border:3px solid var(--ink);border-radius:12px;
  background:color-mix(in srgb,var(--pacific-blue) 16%,var(--panel));user-select:none;-webkit-user-select:none;touch-action:manipulation}
.line{display:flex;align-items:center;gap:8px}
.line .num{flex:none;width:22px;text-align:right;font-weight:800;font-size:15px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.slots{display:flex;gap:var(--gap)}
.slot{position:relative;flex:none;width:var(--s);height:var(--s);border-radius:12px;background:color-mix(in srgb,var(--pacific-blue) 30%,var(--panel));
  box-shadow:inset 0 3px 0 color-mix(in srgb,var(--ink) 12%,transparent)}
.slot img.toy{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(42,37,48,.3))}
.has-rooms .slot img.toy{inset:4% 22% 22% 4%;width:74%;height:74%}
.slot img.drop,.slot .room.drop{animation:drop .18s ease-out}
@keyframes drop{from{transform:translateY(-25%) scale(.7);opacity:0}}
/* a room: a little round badge in the cell's corner (or its middle, until a toy's in too) */
.room{display:grid;place-items:center;border-radius:50%;background:var(--panel);border:2px solid var(--ink);line-height:1}
.slot .room{position:absolute;right:2px;bottom:2px;width:calc(var(--s) * .46);height:calc(var(--s) * .46);font-size:calc(var(--s) * .26)}
.slot .room.alone{right:auto;bottom:auto;left:50%;top:50%;transform:translate(-50%,-50%)}
/* the row being guessed, and the cat in it that the next toy or room goes to */
.line.now .slot{cursor:pointer;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line)}
.line.now .slot.sel{box-shadow:inset 0 0 0 3px var(--ink)}
.line.now .num{color:var(--ink)}
.line.later .slot{height:10px;border-radius:5px;opacity:.55;box-shadow:none}
.line.later .num{font-size:12px;line-height:10px;opacity:.6}
.line.later .paws{visibility:hidden;height:10px}
.line.par{padding-bottom:5px;border-bottom:2px dotted #ECA818}
.line.par .num{color:#C98A0E}
.paws{display:grid;grid-template-rows:repeat(2,calc(var(--s) * .42));grid-auto-flow:column;grid-auto-columns:calc(var(--s) * .42);gap:2px;margin-left:auto;padding-right:2px}
.paws svg{width:100%;height:100%;display:block}
.paws .right{fill:var(--ink);stroke:var(--ink)}
.paws .near{fill:#fff;stroke:var(--ink)}
.paws .none{fill:color-mix(in srgb,var(--ink) 16%,transparent);stroke:none}
/* the cats along the top, each with its name; once it's all worked out, what each had shows under it */
.line.cats{align-items:flex-end;padding-bottom:6px;border-bottom:2px dashed color-mix(in srgb,var(--ink) 30%,transparent);margin-bottom:2px}
.line.cats .slot{height:auto;background:none;box-shadow:none;border-radius:0;display:flex;flex-direction:column;align-items:center}
.line.cats .slot img.cat{display:block;height:calc(var(--s) * 1.45);width:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 2px 2px rgba(42,37,48,.25))}
.line.cats .name{font-weight:800;font-size:clamp(10px,calc(var(--s) * .22),14px);line-height:1.1;margin-top:2px;white-space:nowrap}
.line.cats .found{position:relative;width:var(--s);height:var(--s);margin-top:4px;animation:peek .3s ease-out both;animation-delay:var(--d,0s)}
@keyframes peek{from{transform:translateY(30%) scale(.4);opacity:0}}
.card img.stashpic{display:block;width:70%;max-width:240px;height:auto;margin:0 auto 14px}
/* the toys (and rooms) to pick from, and Check */
.tray{width:var(--board);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px}
.tray .row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:100%}
.tray .toy{position:relative;width:50px;height:50px;padding:3px;border-radius:12px;background:#fff;border:2px solid var(--line);touch-action:manipulation}
.tray .toy img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.tray .toy:hover{border-color:var(--ink)}
.tray .toy:disabled{opacity:.3}
.tray .toy.room{display:flex;flex-direction:column;align-items:center;justify-content:center;width:auto;min-width:58px;padding:2px 6px;border-radius:12px;border-width:2px;border-color:var(--line);background:var(--panel)}
.tray .toy.room .e{font-size:22px;line-height:1}
.tray .toy.room .w{font-size:11px;font-weight:700;color:var(--ink-soft)}
.tray #checkBtn{height:50px;padding:0 18px}
@media (max-width:380px){.tray .toy{width:42px;height:42px}.tray .toy.room{height:42px;min-width:50px}.tray #checkBtn{height:42px;padding:0 12px}}
</style>

<body>
<main>
  <header><div class="title"><h1>Mewster&shy;mind</h1><span class="beta" title="Still being made: things may change">Beta</span></div><div class="stripe"></div><p class="tagline">Work out which cat had which toy, and where</p></header>
  <nav class="games" id="games" aria-label="Games"></nav>

  <div class="status"><span id="count"></span><button class="timer" id="timer" hidden></button><span class="msg" id="msg" aria-live="polite"></span></div>

  <div class="wrap stashwrap stage"><div class="stashboard" id="board" aria-label="The cats and your guesses"></div></div>
  <div class="tray" id="tray" aria-label="Toys and rooms"></div>
  <div class="overlay" id="overlay"><div class="card" id="card"></div></div>

  <div class="actions">
    <button id="hintBtn">Hint</button>
    <button id="undoBtn">Undo</button>
    <button id="restartBtn">Restart</button>
    <button id="linkBtn">Share</button>
    <button id="toysBtn">Toys</button>
    <button id="bestBtn">Best times</button>
    <button id="helpBtn">How to play</button>
  </div>
  <div class="bar">
    <label>Level <select id="levelSel" aria-label="Level"></select></label>
    <button id="newBtn" class="primary">New mystery</button>
  </div>
</main>

<script src="../games.js?v=2026-11-19.1"></script>
<script>
/* ---------- levels ---------- */
// [cats, what's to work out (toy; toy and room), par]. Each cat had a different toy (and was in a different room).
// There's no limit on guesses; par is the most for a gold paw: one more than a player who only ever guesses answers
// that fit every clue so far needs nine times in ten (simulated, 2026-11-19). When (the order they played) and
// shared toys come in later levels (TODO.md).
const LEVELS = [null, [3, ["toy"], 5], [4, ["toy"], 6], [3, ["toy", "room"], 5], [4, ["toy", "room"], 7]];
const MAX_LEVEL = LEVELS.length - 1;
const levelName = n => { const [N, D] = LEVELS[n]; return `Level ${n} · ${N} cats, ${D.length > 1 ? "toys and rooms" : "toys"}`; };

/* ---------- the logic ---------- */
// An answer is one list per thing to work out (code[d][i]: the toy, or room, of cat i), and so is a guess.
// The paws for a guess: [cats all right, cats partly right].
function paws(code, guess) {
  let right = 0, near = 0;
  for (let i = 0; i < code[0].length; i++) {
    let k = 0; for (let d = 0; d < code.length; d++) if (code[d][i] === guess[d][i]) k++;
    if (k === code.length) right++; else if (k) near++;
  }
  return [right, near];
}
const perms = n => { const out = []; (function go(a, rest) { if (!rest.length) { out.push(a); return; } rest.forEach((x, j) => go([...a, x], rest.filter((_, k) => k !== j))); })([], [...Array(n).keys()]); return out; };
// Every answer that fits every row so far (rows: [{guess, paws}]); at most 4!² = 576 to try.
function fitting(N, D, rows) {
  const P = perms(N); let all = P.map(p => [p]);
  for (let d = 1; d < D; d++) all = all.flatMap(c => P.map(p => [...c, p]));
  return all.filter(c => rows.every(r => { const [a, b] = paws(c, r.guess); return a === r.paws[0] && b === r.paws[1]; }));
}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hide = (N, D) => [...Array(D)].map(() => shuffle([...Array(N).keys()]));

/* ---------- pictures ---------- */
const PAD = "M100 6 C126 6 141 28 153 46 C172 50 197 70 195 101 C193 133 166 147 140 141 C125 138 112 131 100 131 C88 131 75 138 60 141 C34 147 7 133 5 101 C3 70 28 50 47 46 C59 28 74 6 100 6Z";
const pawSVG = kind => kind === "none" ? `<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="none" cx="50" cy="50" r="17"/></svg>` :
  `<svg viewBox="-6 -6 112 100" aria-hidden="true"><g class="${kind}" stroke-width="7">
  ${[[16.5, 30.5, -24], [38.5, 15, -8], [61.5, 15, 8], [83.5, 30.5, 24]].map(([x, y, r]) => `<ellipse cx="${x}" cy="${y}" rx="9.5" ry="10.75" transform="rotate(${r} ${x} ${y})"/>`).join("")}
  <path d="${PAD}" transform="translate(19 35.3) scale(.31 .298)" stroke-width="22"/></g></svg>`;

/* ---------- cats ---------- */
// The household's own cats, each sitting up, seen from the front (ARTWORK.md). A mystery has at most one of the
// cats who look alike at this size: the black cats (Peanut, Dottie and Ferguson) and the grey tabbies (Gus and Crunch).
const CATS = [["gus", "Gus", "gus-12", "grey tabby"], ["peanut", "Peanut", "peanut-12", "black"], ["marmalade", "Marmalade", "marmalade-1"], ["willow", "Willow", "willow-1"],
  ["moonpie", "Moonpie", "moonpie-sit"], ["rayla", "Rayla", "rayla-sit"], ["ferguson", "Ferguson", "ferguson-sit", "black"], ["crunch", "Crunch", "crunch-3", "grey tabby"],
  ["laya", "Laya", "laya-5"], ["dottie", "Dottie", "dottie-18", "black"]];
// The witness who gives a hint, as in Clue: one of the cats who isn't in this mystery.
const WITNESSES = [["fred", "Fred", "fred-1"], ["higgins", "Higgins", "higgins-1"]];
const CAT_SRC = {};  // filled with embedded pictures when the page is bundled into one file
const catSrc = f => CAT_SRC[f] || `../cats/${f}.webp`;
const catOf = id => CATS.find(c => c[0] === id) || CATS[0];
function pickCats(N) {
  const out = [];
  for (const c of shuffle(CATS.slice())) if (out.length < N && !(c[3] && out.some(o => o[3] === c[3]))) out.push(c);
  return out.map(c => c[0]);
}

/* ---------- rooms ---------- */
const ROOMS = [["🍳", "kitchen"], ["🛏️", "bedroom"], ["🛋️", "living room"], ["🛁", "bathroom"], ["📚", "study"], ["🧺", "laundry"]];
const pickRooms = N => shuffle([...ROOMS.keys()]).slice(0, N);

/* ---------- toys ---------- */
const KINDS = [
  {c: "#BD5538", looks: [["wiffle-red", "red wiffle ball"], ["swirl-red", "red swirl ball"], ["crochet-stars", "star ball"], ["tinsel", "tinsel ball"]]},
  {c: "#ECA818", looks: [["wiffle-yellow", "yellow wiffle ball"]]},
  {c: "#73A7AE", looks: [["wiffle-teal", "teal wiffle ball"], ["fish", "fish"]]},
  {c: "#6AA673", looks: [["lattice", "lattice ball"]]},
  {c: "#B3B94B", looks: [["spiky-lime", "spiky pom-pom"]]},
  {c: "#B94588", looks: [["swirl-purple", "plum swirl ball"], ["bell-purple", "bell ball"]]},
  {c: "#7885BA", looks: [["spring", "spring"], ["rope-blue", "rope ball"]]},
  {c: "#825840", looks: [["cork-paw", "cork paw ball"], ["burlap-paws", "burlap ball"], ["rattan", "rattan ball"]]},
  {c: "#5E5866", looks: [["mouse", "mouse"]]},
  {c: "#E16A4A", looks: [["felt-rainbow", "rainbow ball"], ["ribbon-tail", "ribbon ball"], ["spiky-rainbow", "spiky ball"]]},
];
const ALL_LOOKS = KINDS.flatMap(k => k.looks.map(([f]) => f));
let offToys = G.toysOff();
const TOY_SRC = {};  // filled with embedded pictures when the page is bundled into one file
const toySrc = f => TOY_SRC[f] || `../toys/${f}.webp?v=${window.SITE_BUILD || ""}`;
const nameOf = f => { for (const k of KINDS) for (const [g, n] of k.looks) if (g === f) return n; return "toy"; };
function pickToys(K) {
  const on = shuffle(KINDS.filter(k => k.looks.some(([f]) => !offToys.has(f)))), off = shuffle(KINDS.filter(k => !on.includes(k)));
  return on.concat(off).slice(0, K).map(k => k.looks[G.pickLook(k, offToys)][0]);
}

/* ---------- game ---------- */
// game: {level, N (cats), D (things to work out: 1 toys, 2 toys and rooms), cats (ids), toys (pictures, in tray order),
//        rooms (ROOMS indexes, in tray order), code (code[d][i]), rows ([{guess, paws}]), cur (cur[d][i]: the row being
//        guessed, null where nothing's in yet), sel (the cat the next toy or room goes to), undo, hinted, restarted, won}
const STORE = "catdoku.stash.v2";   // v1 was the Mastermind of boxes (until 2026-11-19)
const $ = G.$;
let state = G.load(STORE);
let settings = Object.assign({level: 1}, state.settings);
let game = state.game || null;
G.pawLost(() => !game || game.won || game.hinted || game.restarted || game.rows.length > par());
const hints = G.hinter({game: () => game, key: () => game ? game.rows.length + "|" + JSON.stringify(game.cur) : "", draw: () => draw()});   // marks {cells, bad}
const save = () => G.save(STORE, {settings, game});
const playing = () => game && !game.won && !$("overlay").classList.contains("show");
const blank = (N, D) => [...Array(D)].map(() => Array(N).fill(null));

function deal(n, keep) {
  const [N, Dl] = LEVELS[n], D = Dl.length;
  keep = keep || {};
  return {level: n, N, D, cats: keep.cats || pickCats(N), toys: keep.toys || pickToys(N), rooms: keep.rooms || (D > 1 ? pickRooms(N) : []),
          code: keep.code || hide(N, D), rows: [], cur: blank(N, D), sel: 0, undo: [], hinted: false, restarted: false, won: false, ...G.freshClock()};
}
function newPuzzle() {
  G.closeCard();
  game = deal(settings.level); draw(); save();
  G.track(`Mewstermind new puzzle level ${game.level}`);
}
function startLevel(n) { settings.level = n; $("levelSel").value = n; newPuzzle(); }
const par = () => LEVELS[game.level][2];
const catName = i => catOf(game.cats[i])[1];
const toyName = t => nameOf(game.toys[t]);
const roomName = r => ROOMS[game.rooms[r]][1];
const roomEmoji = r => ROOMS[game.rooms[r]][0];

/* ---------- drawing ---------- */
let fresh = new Set();   // "d,i": what just went in, to drop it in
function size() {
  const w = $("board").parentElement.clientWidth - 22, {N} = game, pc = Math.ceil(N / 2);
  const s = Math.floor(Math.min(64, (w - 22 - 16 - (N - 1) * 6 - pc * 2 - 4) / (N + pc * 0.42)));
  $("board").style.setProperty("--s", `${s}px`);
}
function pawsHTML(p, N) {
  return [...Array(p[0]).fill("right"), ...Array(p[1]).fill("near"), ...Array(N - p[0] - p[1]).fill("none")].map(pawSVG).join("");
}
// What's in one cell: a toy, and (from level 3) a room badge
function cellHTML(t, r, i, now) {
  let h = "";
  if (t !== null && t !== undefined) h += `<img class="toy${now && fresh.has("0," + i) ? " drop" : ""}" src="${toySrc(game.toys[t])}" alt="">`;
  if (r !== null && r !== undefined) h += `<span class="room${t === null || t === undefined ? " alone" : ""}${now && fresh.has("1," + i) ? " drop" : ""}" aria-hidden="true">${roomEmoji(r)}</span>`;
  return h;
}
const cellSay = (t, r) => [t !== null && t !== undefined ? `the ${toyName(t)}` : "", r !== null && r !== undefined ? `in the ${roomName(r)}` : ""].filter(Boolean).join(", ") || "nothing yet";
function draw() {
  const {N, D, rows, cur} = game, done = game.won, hm = hints.current(), T = Math.max(par(), rows.length + (done ? 0 : 1));
  size();
  $("board").classList.toggle("has-rooms", D > 1);
  let h = `<div class="line cats"><span class="num"></span><div class="slots">`;
  for (let i = 0; i < N; i++) {
    const c = catOf(game.cats[i]);
    h += `<div class="slot" aria-label="${c[1]}${done ? `: the ${toyName(game.code[0][i])}${D > 1 ? `, in the ${roomName(game.code[1][i])}` : ""}` : ""}"><img class="cat" src="${catSrc(c[2])}" alt=""><span class="name">${c[1]}</span>`;
    if (done) h += `<div class="found slot" style="--d:${i * 0.12}s">${cellHTML(game.code[0][i], D > 1 ? game.code[1][i] : null, i, false)}</div>`;
    h += `</div>`;
  }
  h += `</div></div>`;
  for (let r = 0; r < T; r++) {
    const row = rows[r], now = !done && r === rows.length;
    h += `<div class="line ${row ? "done" : now ? "now" : "later"}${r + 1 === par() ? " par" : ""}" data-r="${r}"><span class="num">${r + 1}</span><div class="slots">`;
    for (let i = 0; i < N; i++) {
      const g = row ? row.guess : now ? cur : null, t = g ? g[0][i] : null, rm = g && D > 1 ? g[1][i] : null;
      const mark = now && hm && hm.cells && hm.cells.includes(i) ? ` hintcell${hm.bad ? " bad" : ""}` : "";
      h += `<div class="slot${now && i === game.sel ? " sel" : ""}${mark}" data-i="${i}"${now ? ` role="button" aria-label="${catName(i)}: ${cellSay(t, rm)}"` : row ? ` aria-label="${catName(i)}: ${cellSay(t, rm)}"` : ""}>${g ? cellHTML(t, rm, i, now) : ""}</div>`;
    }
    h += `</div><div class="paws"${row ? ` aria-label="${row.paws[0]} all right${D > 1 ? `, ${row.paws[1]} partly right` : ""}"` : ""}>${row ? pawsHTML(row.paws, N) : ""}</div></div>`;
  }
  $("board").innerHTML = h;
  fresh.clear();
  // the tray: the toys, the rooms (from level 3), then Check
  const tray = $("tray"), sig = game.toys.join() + "|" + game.rooms.join();
  if (tray.dataset.sig !== sig) {
    tray.dataset.sig = sig; tray.innerHTML = "";
    const toys = document.createElement("div"); toys.className = "row"; tray.append(toys);
    game.toys.forEach((f, t) => {
      const b = document.createElement("button"); b.className = "toy"; b.dataset.d = 0; b.dataset.v = t;
      b.innerHTML = `<img src="${toySrc(f)}" alt="">`; b.setAttribute("aria-label", `${nameOf(f)} (${t + 1})`); b.title = nameOf(f)[0].toUpperCase() + nameOf(f).slice(1);
      toys.append(b);
    });
    if (game.D > 1) {
      const rooms = document.createElement("div"); rooms.className = "row"; tray.append(rooms);
      game.rooms.forEach((k, r) => {
        const b = document.createElement("button"); b.className = "toy room"; b.dataset.d = 1; b.dataset.v = r;
        b.innerHTML = `<span class="e" aria-hidden="true">${ROOMS[k][0]}</span><span class="w">${ROOMS[k][1]}</span>`; b.setAttribute("aria-label", `the ${ROOMS[k][1]}`);
        rooms.append(b);
      });
    }
    const c = document.createElement("button"); c.id = "checkBtn"; c.className = "primary lead"; c.innerHTML = G.icon("check") + '<span class="lbl">Check</span>'; tray.append(c);
  }
  tray.querySelectorAll(".toy").forEach(b => { b.disabled = done; });
  $("checkBtn").disabled = done || cur.some(l => l.includes(null));
  const g = rows.length + (done ? 0 : 1);
  $("count").textContent = game.won ? `Solved in ${rows.length} guess${rows.length === 1 ? "" : "es"}!` : `Guess ${g}`;
  $("hintBtn").disabled = done; undo.sync();
}
addEventListener("resize", () => { if (game) size(); });

/* ---------- playing ---------- */
// Undo (G.history): each step is the row being put together, as it was. A checked guess can't be taken back.
const copyCur = c => c.map(l => l.slice());
const undo = G.history({game: () => game, list: g => g.undo, take: () => ({cur: copyCur(game.cur), sel: game.sel}), cap: 60, can: playing,
  back: (u, g) => { g.cur = u.cur; g.sel = u.sel; }, after: () => { draw(); save(); }, restart: true,
  started: () => !!(game.rows.length || game.undo.length || game.cur.some(l => l.some(v => v !== null)))});
const SND = G.sound.kit;
G.sound.define({
  "mm.check": t => SND.bell({f: 1319, t, dur: .5, vol: .08, ratio: 2.01, index: .6}),   // one chime
});
function change(fn) { undo.push(); fn(); game.started = true; draw(); save(); }
// A toy (d 0) or room (d 1) from the tray goes to the picked cat; if another cat had it in this row, the two swap
// (each cat had a different one). Then the next cat still without one of those is picked.
function put(d, v) {
  if (!playing()) return;
  const i = game.sel, line = game.cur[d];
  G.sound.play("put");
  change(() => {
    const j = line.indexOf(v);
    if (j >= 0 && j !== i) { line[j] = line[i]; if (line[j] !== null) fresh.add(d + "," + j); }
    line[i] = v; fresh.add(d + "," + i);
    for (let k = 1; k <= game.N; k++) { const n = (i + k) % game.N; if (line[n] === null) { game.sel = n; return; } }
  });
}
// Tap a cat's cell in the row: pick it, or empty it if it's picked already.
function tapSlot(i) {
  if (!playing()) return;
  if (i === game.sel && game.cur.some(l => l[i] !== null)) { G.sound.play("erase"); change(() => { game.cur.forEach(l => { l[i] = null; }); }); }
  else { game.sel = i; draw(); save(); }
}
function takeOut() {
  if (!playing()) return;
  const has = i => game.cur.some(l => l[i] !== null);
  let i = has(game.sel) ? game.sel : [...Array(game.N).keys()].filter(has).pop();
  if (i === undefined) return;
  G.sound.play("erase"); change(() => { game.cur.forEach(l => { l[i] = null; }); game.sel = i; });
}
function check() {
  if (!playing()) return;
  if (game.cur.some(l => l.includes(null))) { G.note(game.D > 1 ? "Give every cat a toy and a room first." : "Give every cat a toy first.", 2500); return; }
  const guess = copyCur(game.cur), p = paws(game.code, guess);
  game.rows.push({guess, paws: p}); game.started = true; G.sound.play("mm.check");
  game.cur = blank(game.N, game.D); game.sel = 0; game.undo = [];
  if (p[0] === game.N) { win(); return; }
  draw(); save();
  const now = $("board").querySelector(".line.now");
  if (now) now.scrollIntoView({block: "nearest"});
  $("tray").scrollIntoView({block: "nearest"});
}
$("board").addEventListener("click", e => { const s = e.target.closest(".line.now .slot"); if (s) tapSlot(+s.dataset.i); });
$("tray").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "checkBtn") check(); else put(+b.dataset.d, +b.dataset.v);
});
// Keys: 1 to 9 give the picked cat a toy (with Shift, a room), the arrows pick a cat, Backspace empties one, Enter checks.
document.addEventListener("keydown", e => {
  if (!playing() || document.querySelector(".spot") || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const n = /^Digit[1-9]$/.test(e.code) ? +e.code[5] : /^[1-9]$/.test(e.key) ? +e.key : 0;
  if (n && n <= game.N && e.shiftKey && game.D > 1) { e.preventDefault(); put(1, n - 1); }
  else if (n && n <= game.N && !e.shiftKey) { e.preventDefault(); put(0, n - 1); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); game.sel = (game.sel + (e.key === "ArrowLeft" ? game.N - 1 : 1)) % game.N; draw(); save(); }
  else if (e.key === "Backspace" || e.key === "Delete") { e.preventDefault(); takeOut(); }
  else if (e.key === "Enter" && (e.target.tagName !== "BUTTON" || e.target.closest("#tray .toy"))) { e.preventDefault(); check(); }
});
// Restart: the same mystery, with every guess taken back. It costs the gold paw.
$("restartBtn").onclick = () => {
  if (undo.restart(g => Object.assign(g, deal(g.level, g), {hinted: g.hinted, restarted: true, ms: g.ms, started: g.started, timed: g.timed})))
    G.note("Back to the first guess, with the same mystery.", 3000);
};

/* ---------- hints: a witness, as in Clue ---------- */
// A cat who isn't in this mystery saw something, and tells you one thing that's wrong: in the row you're putting
// together if anything in it is, or else in your last guess. It never says what's right, except that a full row with
// nothing wrong is the answer. It costs the gold paw.
function hint() {
  if (!playing()) return;
  const {N, D, code, cur, rows} = game;
  const w = WITNESSES.find(x => !game.cats.includes(x[0])) || WITNESSES[0], who = w[1];
  const wrongIn = g => { const out = []; for (let i = 0; i < N; i++) for (let d = 0; d < D; d++) if (g[d][i] !== null && g[d][i] !== code[d][i]) out.push([d, i, g[d][i]]); return out; };
  const fact = ([d, i, v]) => d === 0 ? `${catName(i)} didn't have the ${toyName(v)}` : `${catName(i)} wasn't in the ${roomName(v)}`;
  const say = (f, row) => `${who} saw something: ${fact(f)}${row ? ` (in guess ${row})` : ""}.`;
  let wrong = wrongIn(cur);
  game.hinted = true; save();
  if (wrong.length) { const f = wrong[Math.floor(Math.random() * wrong.length)]; hints.show({cells: [f[1]], bad: true}, say(f)); return; }
  if (!cur.some(l => l.includes(null))) { hints.show({cells: [...Array(N).keys()]}, `${who} saw nothing wrong with that. Check it!`); return; }
  if (cur.some(l => l.some(v => v !== null))) { hints.show({cells: []}, `${who} saw nothing wrong in your guess so far.`); return; }
  // an empty row: something wrong in the last guess, or (before any guess) anything at all
  const last = rows[rows.length - 1];
  if (last) { wrong = wrongIn(last.guess); const f = wrong[Math.floor(Math.random() * wrong.length)]; hints.show({cells: [f[1]], bad: true}, say(f, rows.length)); return; }
  const i = Math.floor(Math.random() * N), d = Math.floor(Math.random() * D), others = [...Array(N).keys()].filter(v => v !== code[d][i]);
  hints.show({cells: [i], bad: true}, say([d, i, others[Math.floor(Math.random() * others.length)]]));
}
$("hintBtn").onclick = hint;

/* ---------- winning ---------- */
const goldOK = () => !game.hinted && !game.restarted && game.rows.length <= par();
function win() {
  game.won = true; G.finishClock(game);
  const next = goldOK() ? Math.min(MAX_LEVEL, game.level + 1) : game.level;
  settings.level = next; $("levelSel").value = next; save(); draw();
  G.track(`Mewstermind solved level ${game.level}`);
  const g = game;
  setTimeout(() => { if (game === g) finishCard(); }, 1100);
}
function stashPic() { const im = new Image(); im.className = "stashpic"; im.src = catSrc("c17-18"); im.alt = "A black and white cat pouncing on a ball"; return im; }
function finishCard() {
  const next = settings.level, n = game.rows.length;
  let text = `You worked it out in ${n} guess${n === 1 ? "" : "es"}.`;
  text += goldOK() ? (game.level === MAX_LEVEL ? " That's the hardest level so far; here's another." : ` Next up: level ${next}.`)
    : ` A gold paw moves you up: ${par()} guesses or fewer, with no hint or Restart. ${game.hinted ? "You had a hint" : game.restarted ? "You restarted" : `This took ${n}`}, so here's another at level ${next}.`;
  G.winCard(text, () => { G.closeCard(); startLevel(next); }, "Admire the cats", game.result,
    {title: "Case closed!", gold: goldOK(), goldPic: [stashPic()], goldWhy: `Solved in ${n} guess${n === 1 ? "" : "es"}, with no hints!`, next: next > game.level ? `Next: level ${next}` : "Next mystery",
     after: G.otherSize($("levelSel"), next, startLevel, "Or play a different level:")});
}

/* ---------- sharing ---------- */
// The answer travels in the link a little scrambled, so it isn't there to read at a glance.
const scramble = (code, N) => code.map((l, d) => l.map((t, i) => (t + 3 * i + d + 1) % N));
const unscramble = (s, N) => s.map((l, d) => l.map((t, i) => ((t - 3 * i - d - 1) % N + N * 8) % N));
$("linkBtn").onclick = () => { if (game) G.shareCard({name: "Mewstermind", won: game.won,
  puzzle: () => ({g: "stash2", N: game.level, cats: game.cats, toys: game.toys, rooms: game.rooms, s: scramble(game.code, game.N)}),
  progress: () => ({rows: game.rows.map(r => r.guess)})}); };
function openShared(d) {
  const lv = LEVELS[d.N], [N, Dl] = lv || [null, []], D = Dl.length;
  const isPerm = l => Array.isArray(l) && l.length === N && new Set(l).size === N && l.every(t => Number.isInteger(t) && t >= 0 && t < N);
  const ok = lv && d.g === "stash2" && Array.isArray(d.cats) && d.cats.length === N && d.cats.every(c => CATS.some(x => x[0] === c)) && new Set(d.cats).size === N &&
    Array.isArray(d.toys) && d.toys.length === N && d.toys.every(f => ALL_LOOKS.includes(f)) && new Set(d.toys).size === N &&
    Array.isArray(d.rooms) && d.rooms.length === (D > 1 ? N : 0) && d.rooms.every(k => Number.isInteger(k) && k >= 0 && k < ROOMS.length) && new Set(d.rooms).size === d.rooms.length &&
    Array.isArray(d.s) && d.s.length === D && d.s.every(l => Array.isArray(l) && l.length === N);
  const code = ok && unscramble(d.s, N);
  if (!ok || !code.every(isPerm)) { G.note("That share link didn't work.", 5000); return; }
  game = deal(d.N, {cats: d.cats, toys: d.toys, rooms: d.rooms, code});
  const cell = l => Array.isArray(l) && l.length === N && l.every(t => Number.isInteger(t) && t >= 0 && t < N);
  if (d.p && Array.isArray(d.p.rows) && d.p.rows.length <= 99 && d.p.rows.every(g => Array.isArray(g) && g.length === D && g.every(cell))) {
    game.rows = d.p.rows.map(guess => ({guess, paws: paws(code, guess)})); game.timed = false;
    const k = game.rows.findIndex(r => r.paws[0] === N);
    if (k >= 0) { game.rows = game.rows.slice(0, k + 1); game.won = true; }
  }
  settings.level = d.N; $("levelSel").value = d.N;
  draw(); save();
}

/* ---------- how to play ---------- */
function showHelp() {
  settings.seenHelp = false; helpOnFirstVisit();
  if (!document.querySelector(".spot")) { settings.seenHelp = true; G.helpLater(); }
}
function map() {
  const lines = $("board").querySelectorAll(".line[data-r]"), s0 = lines[0].querySelectorAll(".slot"), a = s0[0].getBoundingClientRect();
  const gap = s0.length > 1 ? s0[1].getBoundingClientRect().left - a.right : 6, row = lines[0].getBoundingClientRect();
  return {ox: a.left - gap / 2, oy: row.top - gap / 2, cw: a.width + gap, ch: row.height + gap};
}
// The first visit walks through a guess for real; the paws steps then point at the player's own first row.
function helpOnFirstVisit() {
  if (settings.seenHelp || !game || !playing() || document.querySelector(".spot")) return;
  const {N, D} = game, T = Math.max(par(), game.rows.length + 1), row = [...Array(N).keys()].map(i => [i, 0]);
  const pawsEl = () => $("board").querySelector('.line[data-r="0"] .paws');
  const steps = [
    {say: D > 1 ? "Each cat had a toy, in a room" : "Each cat had a different toy", els: [() => $("board").querySelector(".line.cats .slots")]},
    {say: D > 1 ? "Give each cat a toy and room" : "Give each cat a toy", lit: [...Array(N).keys()].map(i => [i, game.rows.length]), els: [$("tray")],
     try: {done: () => !game.cur.some(l => l.includes(null)) || game.rows.length > 0}},
    {say: "Then tap Check", els: [() => $("checkBtn")], try: {done: () => game.rows.length > 0, yes: "Paws tell you how close"}},
    {say: "Dark paw: a cat all right", lit: row, els: [pawsEl]},
    ...(D > 1 ? [{say: "Light paw: a cat partly right", lit: row, els: [pawsEl]}] : []),
    {say: "Paws don't say which cat", lit: row, els: [pawsEl]},
    {say: "Guess until you've solved it", els: [$("count")]},
    {say: "By the gold line: gold paw", later: true, els: [() => $("board").querySelector(".line.par")]},
    {say: "Stuck? A witness tells you one thing", els: [$("hintBtn")]},
  ];
  G.spotlight({grid: $("board"), w: N, h: T, steps, map, done: () => { settings.seenHelp = true; draw(); save(); }});
}

/* ---------- choosing toys ---------- */
const toyChest = () => ({kinds: KINDS, off: offToys, min: LEVELS[game ? game.level : settings.level][0], src: toySrc, game: "Mewstermind", save: off => {
  offToys = off; G.saveToys(off);
  G.note("Saved. Your toys are used from the next mystery.", 3500);
}});
$("toysBtn").onclick = () => G.toyPicker(toyChest());

/* ---------- start ---------- */
for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(levelName(n).replace("Level ", "") + (n === MAX_LEVEL ? " (hardest)" : ""), n));
$("levelSel").onchange = e => startLevel(+e.target.value);
$("newBtn").onclick = newPuzzle;
$("helpBtn").onclick = showHelp;

G.nav("stash");
G.checkClock(game);
G.setupTimer({name: "stash2", game: () => game, playing: g => !g.won, save, label: levelName, noun: "level",
  emptyText: "Solve a mystery and your times will show up here. They're kept on this device only."});
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : settings.level);

if (!(settings.level >= 1 && settings.level <= MAX_LEVEL)) settings.level = 1;
$("levelSel").value = settings.level;
const shared = G.readShare("stash");
const hadSave = !!(game && Array.isArray(game.rows));
if (hadSave) G.reopen(() => {
    const lv = LEVELS[game.level];
    if (!lv || game.cats.length !== lv[0] || game.code.length !== lv[1].length || game.cur.length !== lv[1].length) throw new Error("the saved mystery doesn't fit its level");
    if (!Array.isArray(game.undo)) game.undo = [];
    draw();
    if (game.won) finishCard(); else helpOnFirstVisit();
  }, why => { game = null; newPuzzle(); G.note(why, 0); });
else if (!shared) { newPuzzle(); helpOnFirstVisit(); }
const shareOpts = () => ({name: "Mewstermind", inProgress: !!(game && !game.won && game.rows.length), open: openShared, after: helpOnFirstVisit});
if (shared) G.offerShare(shared, {...shareOpts(), fresh: hadSave ? null : why => Promise.resolve(newPuzzle()).then(() => { G.note(why, 6000); helpOnFirstVisit(); })});
window.addEventListener("hashchange", () => { const d = G.readShare("stash"); if (d) G.offerShare(d, shareOpts()); });
G.needToys({...toyChest(), off: () => offToys});
</script>
