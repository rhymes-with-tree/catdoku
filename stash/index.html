/* Case Clawsed (Mewstermind until 2026-11-22, and Toy Stash before that), since 2026-11-22 a case file: something happened in one of the rooms, each cat says what
   they know, and you work out where every cat was (and from level 3 which toy each had) in a notebook, as in a logic
   grid puzzle, until only one cat could have done it. */
.casewrap{width:var(--board);display:flex;flex-direction:column;gap:12px}
.story{display:flex;align-items:center;gap:12px;padding:10px 12px;border:3px solid var(--ink);border-radius:12px;background:var(--panel);color:var(--ink)}

/* what each cat says: their face, then their words; tap words to grey them out once used */
.says{display:flex;flex-direction:column;gap:8px}
.say{display:flex;align-items:flex-start;gap:10px}
.say .face{flex:none;width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--ink);background:var(--panel)}
.say .face img{width:100%;height:150%;object-fit:cover;object-position:top}
.say .bubble{flex:1;min-width:0;padding:6px 10px;border-radius:4px 12px 12px 12px;background:var(--panel);border:2px solid var(--line);color:var(--ink)}
.say .who{display:block;font-weight:800;font-size:13px;color:var(--ink-soft)}
.say .said{display:block;width:100%;margin:2px 0;padding:4px 0;border:0;background:none;color:inherit;font:inherit;font-size:16px;line-height:1.3;text-align:left;cursor:pointer;touch-action:manipulation;min-height:32px}
.say .said.used{opacity:.4;text-decoration:line-through}
.say .said.hintclue{background:color-mix(in srgb,#ECA818 30%,transparent);border-radius:6px;outline:2px solid #ECA818;opacity:1;text-decoration:none}
/* the notebook: a grid for each pair, a row for each cat; tap a square for ✗, again for ✓, again to clear */
.notebook{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.block{--s:48px;display:grid;grid-template-columns:auto repeat(var(--n),var(--s));gap:3px;padding:8px;border:3px solid var(--ink);border-radius:12px;
  background:color-mix(in srgb,var(--pacific-blue) 16%,var(--panel));user-select:none;-webkit-user-select:none;touch-action:manipulation}
.block .head{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;min-height:var(--s);font-size:10px;font-weight:700;line-height:1.05;color:var(--ink-soft);text-align:center}
.block .head .e{font-size:calc(var(--s) * .44);line-height:1}
.block .head img{width:calc(var(--s) * .8);height:calc(var(--s) * .8);object-fit:contain}
.block .head .up{font-size:9px;font-weight:600}
.block .corner{display:flex;align-items:flex-end;justify-content:center;padding:0 2px 4px;font-weight:800;font-size:13px;color:var(--ink-soft)}
.block .rowcat{display:flex;align-items:center;gap:4px;height:var(--s);padding-right:4px;font-size:12px;font-weight:700;color:var(--ink)}

.cell{position:relative;width:var(--s);height:var(--s);padding:0;border:0;border-radius:8px;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);
  color:var(--ink);font:800 calc(var(--s) * .5)/1 "Baloo 2",ui-rounded,system-ui,sans-serif;cursor:pointer;touch-action:manipulation}

<script src="../games.js?v=2026-11-22.9"></script>
<script>
/* ---------- levels ---------- */
// [cats (and as many rooms, and toys), toys?, hard (no cat says outright where they were or what they had)]
const LEVELS = [null, [3, false, false], [4, false, false], [3, true, false], [4, true, false], [5, true, false], [5, true, true]];
const MAX_LEVEL = LEVELS.length - 1;
const levelName = n => { const [N, T, H] = LEVELS[n]; return `Level ${n} · ${N} cats, ${N} rooms${T ? `, ${N} toys` : ""}${H ? ", cagey cats" : ""}`; };

/* ---------- the logic ---------- */
// A case: n cats, each in a different one of n rooms (and, from level 3, each with a different one of n toys). An
// answer is {R, T}: R[c] the room cat c was in, T[c] the toy (index into the case's lists). Every answer is tried
// (at most 5! × 5! = 14,400), so a case is kept only when exactly one answer fits everything the cats say.
function perms(n) {
  if (n === 0) return [[]];
  return perms(n - 1).flatMap(p => [...Array(n).keys()].map(i => [...p.slice(0, i), n - 1, ...p.slice(i)]));
}
function answers(n, toys) {
  const P = perms(n);
  return toys ? P.flatMap(R => P.map(T => ({R, T}))) : P.map(R => ({R, T: null}));
}
// a seeded random number generator (mulberry32), so a case is the same from its seed
function seeded(seed) {
  let a = seed >>> 0;
  const next = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const int = n => Math.floor(next() * n);
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = int(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  return {next, int, shuffle, pick: arr => arr[int(arr.length)]};
}

// What a cat can say. Each kind: test(answer, args) and its weight when picking (rarer: says more).
// up[r]: whether the case's room r is upstairs.
const KINDS_SAID = {
  in:        {w: 1, test: (a, [c, r]) => a.R[c] === r},
  notin:     {w: 3, test: (a, [c, r]) => a.R[c] !== r},
  either:    {w: 2, test: (a, [c, r1, r2]) => a.R[c] === r1 || a.R[c] === r2},
  floor:     {w: 2, test: (a, [c, u], up) => up[a.R[c]] === u},
  neither:   {w: 2, test: (a, [c1, c2, r]) => a.R[c1] !== r && a.R[c2] !== r},
  samefloor: {w: 2, test: (a, [c1, c2, s], up) => (up[a.R[c1]] === up[a.R[c2]]) === s},
  had:       {w: 1, toys: true, test: (a, [c, t]) => a.T[c] === t},
  nothad:    {w: 3, toys: true, test: (a, [c, t]) => a.T[c] !== t},
  roomtoy:   {w: 2, toys: true, test: (a, [r, t, y]) => (a.T[a.R.indexOf(r)] === t) === y},
  floortoy:  {w: 2, toys: true, test: (a, [t, u], up) => up[a.R[a.T.indexOf(t)]] === u},
};
const holds = (a, s, up) => KINDS_SAID[s.k].test(a, s.a, up);

// Everything true about the answer that a cat could say, as {k, a (args), by (who says it)}; by is the cat the
// words are about when they're about one cat (said as "I"), or another cat when about two or none.
function truths(ans, n, toys, up, scene, hard, rng) {
  const out = [], other = (...not) => rng.pick([...Array(n).keys()].filter(c => !not.includes(c)));
  const bothFloors = up.some(Boolean) && up.some(u => !u);
  for (let c = 0; c < n; c++) {
    for (let r = 0; r < n; r++) {
      if (ans.R[c] === r) { if (!hard && r !== scene) out.push({k: "in", a: [c, r], by: c}); }
      else out.push({k: "notin", a: [c, r], by: rng.next() < .6 ? c : other(c)});
      for (let r2 = r + 1; r2 < n; r2++) if ((ans.R[c] === r || ans.R[c] === r2) && n > 3) out.push({k: "either", a: [c, r, r2], by: c});
    }
    if (bothFloors) out.push({k: "floor", a: [c, up[ans.R[c]]], by: rng.next() < .5 ? c : other(c)});
    for (let c2 = c + 1; c2 < n; c2++) {
      for (let r = 0; r < n; r++) if (ans.R[c] !== r && ans.R[c2] !== r) out.push({k: "neither", a: [c, c2, r], by: other(c, c2)});
      if (bothFloors) out.push({k: "samefloor", a: [c, c2, up[ans.R[c]] === up[ans.R[c2]]], by: c});
    }
    if (toys) for (let t = 0; t < n; t++) {
      if (ans.T[c] === t) { if (!hard) out.push({k: "had", a: [c, t], by: c}); }
      else out.push({k: "nothad", a: [c, t], by: rng.next() < .6 ? c : other(c)});
    }
  }
  if (toys) for (let t = 0; t < n; t++) {
    const holder = ans.T.indexOf(t);
    for (let r = 0; r < n; r++) {
      const y = ans.R[holder] === r;
      if (!(y && r === scene)) out.push({k: "roomtoy", a: [r, t, y], by: other(holder)});
    }
    if (bothFloors) out.push({k: "floortoy", a: [t, up[ans.R[holder]]], by: other(holder)});
  }
  return out;
}

// Pick what the cats say: weighted at random until only one answer fits, then leave out whatever isn't needed.
function makeSaid(ans, n, toys, up, scene, hard, rng, all) {
  const pool = truths(ans, n, toys, up, scene, hard, rng), said = [];
  let fit = all;
  while (fit.length > 1 && pool.length) {
    const tot = pool.reduce((t, s) => t + KINDS_SAID[s.k].w, 0);
    let x = rng.next() * tot, i = 0;
    while ((x -= KINDS_SAID[pool[i].k].w) > 0) i++;
    const s = pool.splice(i, 1)[0], left = fit.filter(a => holds(a, s, up));
    if (left.length < fit.length) { said.push(s); fit = left; }
  }
  for (const s of rng.shuffle(said.slice())) {
    const rest = said.filter(x => x !== s);
    if (all.filter(a => rest.every(x => holds(a, x, up))).length === 1) said.splice(said.indexOf(s), 1);
  }
  return said;
}

/* ---------- cats ---------- */
// The household's own cats, each sitting up, seen from the front (ARTWORK.md). A case has at most one of the cats
// who look alike at this size: the black cats (Peanut, Dottie and Ferguson) and the grey tabbies (Gus and Crunch).
const CATS = [["gus", "Gus", "gus-12", "grey tabby"], ["peanut", "Peanut", "peanut-12", "black"], ["marmalade", "Marmalade", "marmalade-1"], ["willow", "Willow", "willow-1"],
  ["moonpie", "Moonpie", "moonpie-sit"], ["rayla", "Rayla", "rayla-sit"], ["ferguson", "Ferguson", "ferguson-sit", "black"], ["crunch", "Crunch", "crunch-3", "grey tabby"],
  ["laya", "Laya", "laya-5"], ["dottie", "Dottie", "dottie-18", "black"]];
const CAT_SRC = {};  // filled with embedded pictures when the page is bundled into one file
const catSrc = f => CAT_SRC[f] || `../cats/${f}.webp`;
const catOf = id => CATS.find(c => c[0] === id) || CATS[0];
function pickCats(N, rng) {
  const out = [];
  for (const c of rng.shuffle(CATS.slice())) if (out.length < N && !(c[3] && out.some(o => o[3] === c[3]))) out.push(c);
  return out.map(c => c[0]);
}

/* ---------- rooms, and what happened in them ---------- */
// [emoji, name, upstairs?, what was done there (two to pick from)]
const ROOMS = [
  ["🍳", "kitchen", false, ["knocked a mug off the kitchen counter", "licked the butter in the kitchen"]],
  ["🛏️", "bedroom", true, ["pulled the duvet off the bed in the bedroom", "hid a sock under the bed in the bedroom"]],
  ["🛋️", "living room", false, ["tipped the plant over in the living room", "scratched the sofa in the living room"]],
  ["🛁", "bathroom", true, ["unrolled the toilet roll all over the bathroom", "knocked the toothbrush into the bathroom sink"]],
  ["📚", "study", true, ["sat on the keyboard in the study and typed jjjjjjjj", "swept the pens off the desk in the study"]],
  ["🧺", "laundry", false, ["stole a sock from the basket in the laundry", "napped in the clean washing in the laundry"]],
];
// times of day, for the story only: [how a sentence starts]
const WHEN = ["At dawn", "At noon", "In the evening", "At midnight", "At 3 a.m."];

/* ---------- toys ---------- */
const KINDS = [
  {c: "#BD5538", looks: [["wiffle-red", "red wiffle ball"], ["swirl-red", "red swirl ball"], ["crochet-stars", "star ball"], ["tinsel", "tinsel ball"]]},
  {c: "#ECA818", looks: [["wiffle-yellow", "yellow wiffle ball"]]},
  {c: "#73A7AE", looks: [["wiffle-teal", "teal wiffle ball"], ["fish", "fish"]]},
  {c: "#6AA673", looks: [["lattice", "lattice ball"]]},
  {c: "#B3B94B", looks: [["spiky-lime", "spiky pom-pom"]]},
  {c: "#B94588", looks: [["swirl-purple", "plum swirl ball"], ["bell-purple", "bell ball"]]},
  {c: "#7885BA", looks: [["spring", "spring"], ["rope-blue", "rope ball"]]},
  {c: "#825840", looks: [["cork-paw", "cork paw ball"], ["burlap-paws", "burlap ball"], ["rattan", "rattan ball"]]},
  {c: "#5E5866", looks: [["mouse", "mouse"]]},
  {c: "#E16A4A", looks: [["felt-rainbow", "rainbow ball"], ["ribbon-tail", "ribbon ball"], ["spiky-rainbow", "spiky ball"]]},
];
const ALL_LOOKS = KINDS.flatMap(k => k.looks.map(([f]) => f));
let offToys = G.toysOff();
const TOY_SRC = {};  // filled with embedded pictures when the page is bundled into one file
const toySrc = f => TOY_SRC[f] || `../toys/${f}.webp?v=${window.SITE_BUILD || ""}`;
const nameOf = f => { for (const k of KINDS) for (const [g, n] of k.looks) if (g === f) return n; return "toy"; };
function pickToys(K) {
  const sh = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const on = sh(KINDS.filter(k => k.looks.some(([f]) => !offToys.has(f)))), off = sh(KINDS.filter(k => !on.includes(k)));
  return on.concat(off).slice(0, K).map(k => k.looks[G.pickLook(k, offToys)][0]);
}

/* ---------- a case ---------- */
// Everything about a case comes from its seed (and its toys, picked by the player's toy chest and kept with it):
// the cats, the rooms, the answer, what happened where, and what the cats say. A few are dealt and the one that
// needs the fewest words is kept.
const ALL = {};
const answersFor = (n, toys) => ALL[n + "" + toys] || (ALL[n + "" + toys] = answers(n, toys));
function makeCase(level, seed) {
  const [n, toys, hard] = LEVELS[level], rng = seeded(seed);
  const cats = pickCats(n, rng), rooms = rng.shuffle([...ROOMS.keys()]).slice(0, n);
  const up = rooms.map(r => ROOMS[r][2]);
  const ans = {R: rng.shuffle([...Array(n).keys()]), T: toys ? rng.shuffle([...Array(n).keys()]) : null};
  const scene = rng.int(n), deed = rng.int(2), when = rng.int(WHEN.length), all = answersFor(n, toys);
  let said = null;
  for (let k = 0; k < 4; k++) { const s = makeSaid(ans, n, toys, up, scene, hard, rng, all); if (!said || s.length < said.length) said = s; }
  // what each cat says, in order: grouped by who says it
  said.sort((a, b) => a.by - b.by);
  return {cats, rooms, up, ans, scene, deed, when, said};
}

/* ---------- game ---------- */
// game: {level, seed, toys (pictures), marks ({"b,r,c": 1 ✗ or 2 ✓}; block 0 is cats × rooms, 1 cats × toys),
//        used (indexes of the words greyed out), undo, hinted, restarted, won}; the case itself is made again from the seed
const STORE = "catdoku.stash.v4";   // v1 the Mastermind of boxes, v2 a cat-to-toy match, v3 the Clue by paws (2026-11-19 to 21)
const $ = G.$;
let state = G.load(STORE);
let settings = Object.assign({level: 1}, state.settings);
let game = state.game || null, cs = null;   // cs: the case, made from game.seed
G.pawLost(() => !game || game.won || game.hinted || game.restarted);
const hints = G.hinter({game: () => game, key: () => game ? JSON.stringify(game.marks) : "", draw: () => draw()});   // marks {cells: ["b,r,c"], clue, bad}
const save = () => G.save(STORE, {settings, game});
const playing = () => game && !game.won && !$("overlay").classList.contains("show");
const N = () => LEVELS[game.level][0], hasToys = () => LEVELS[game.level][1];
// the notebook's grids: 0 cats × rooms, and with toys 1 cats × toys and 2 toys × rooms (the owner's, 2026-11-22: a
// third grid to note a clue such as "Whoever was in the bathroom had the mouse"; it helps, but the case closes without it)
const blocks = () => hasToys() ? [0, 1, 2] : [0];
const WIN_BLOCKS = () => hasToys() ? [0, 1] : [0];

function deal(level, seed, toys) {
  const g = {level, seed: seed >>> 0, toys: toys || (LEVELS[level][1] ? pickToys(LEVELS[level][0]) : []), marks: {}, used: [], undo: [],
             hinted: false, restarted: false, won: false, ...G.freshClock()};
  return g;
}
const newSeed = () => Math.floor(Math.random() * 2 ** 31);
function begin() { cs = makeCase(game.level, game.seed); }
function newPuzzle() {
  G.closeCard();
  game = deal(settings.level, newSeed()); begin(); draw(); save();
  G.track(`Case Clawsed new case level ${game.level}`);
}
function startLevel(n) { settings.level = n; $("levelSel").value = n; newPuzzle(); }

/* ---------- words ---------- */
const catName = c => catOf(cs.cats[c])[1];
const roomName = r => ROOMS[cs.rooms[r]][1];
const toyName = t => nameOf(game.toys[t]);
const floorWord = u => u ? "upstairs" : "downstairs";
// What a cat says, in their own words.
function words(s) {
  const [a, b, c] = s.a, me = x => x === s.by;
  switch (s.k) {
    case "in": return `I was in the ${roomName(b)}.`;
    case "notin": return me(a) ? `I wasn't in the ${roomName(b)}.` : `${catName(a)} wasn't in the ${roomName(b)}.`;
    case "either": return `I was in the ${roomName(b)} or the ${roomName(c)}.`;
    case "floor": return me(a) ? `I was ${floorWord(b)}.` : `${catName(a)} was ${floorWord(b)}.`;
    case "neither": return `Neither ${catName(a)} nor ${catName(b)} was in the ${roomName(c)}.`;
    case "samefloor": return c ? `${catName(b)} and I were on the same floor.` : `${catName(b)} and I were on different floors.`;
    case "had": return `I had the ${toyName(b)}.`;
    case "nothad": return me(a) ? `I didn't have the ${toyName(b)}.` : `${catName(a)} didn't have the ${toyName(b)}.`;
    case "roomtoy": return c ? `Whoever was in the ${roomName(a)} had the ${toyName(b)}.` : `The ${toyName(b)} wasn't in the ${roomName(a)}.`;
    case "floortoy": return `The ${toyName(a)} was ${floorWord(b)}.`;
  }
  return "";
}
// The rule the case rests on is said every time (the owner, 2026-11-22): every cat was in a different room (and had a
// different toy), so a ✓ rules the rest of its row and column out.
const storyText = () => `${WHEN[cs.when]}, someone ${ROOMS[cs.rooms[cs.scene]][3][cs.deed]}. ${hasToys() ? "Every cat was in a different room, with a different toy." : "Every cat was in a different room."} Each cat says what they know. Who did it?`;
// a square of the notebook, in words: "Gus and the kitchen"
const rowName = (b, r) => b === 2 ? `the ${toyName(r)}` : catName(r);
const colName = (b, c) => b === 1 ? `the ${toyName(c)}` : `the ${roomName(c)}`;
const fact = (b, r, c, yes) => b === 0 ? `${catName(r)} ${yes ? "was" : "wasn't"} in the ${roomName(c)}` : b === 1 ? `${catName(r)} ${yes ? "had" : "didn't have"} the ${toyName(c)}`
  : `the ${toyName(r)} ${yes ? "was" : "wasn't"} in the ${roomName(c)}`;

/* ---------- the notebook ---------- */
// What the player has marked: their own ✗ and ✓, and the ✗ a ✓ puts along its row and column (shown paler, not kept).
const markOf = (b, r, c) => game.marks[`${b},${r},${c}`] || 0;
function shownMark(b, r, c) {
  const m = markOf(b, r, c);
  if (m) return m;
  for (let k = 0; k < N(); k++) if ((k !== c && markOf(b, r, k) === 2) || (k !== r && markOf(b, k, c) === 2)) return 3;   // 3: a pale ✗
  return 0;
}
// what goes in row r of grid b, for an answer: the cat's room, the cat's toy, or the room of the cat with toy r
const valOf = (a, b, r) => b === 0 ? a.R[r] : b === 1 ? a.T[r] : a.R[a.T.indexOf(r)];
const truth = (b, r, c) => valOf(cs.ans, b, r) === c;
// Does an answer fit what's marked? (a ✓ there, nothing where it's ✗)
const fitsMarks = (a, marks) => Object.entries(marks).every(([k, m]) => { const [b, r, c] = k.split(",").map(Number); return (valOf(a, b, r) === c) === (m === 2); });
function solved() {
  // every cat's room (and toy) ticked, and nothing wrong in those grids; the toys × rooms grid is only a helper
  for (const b of WIN_BLOCKS()) for (let r = 0; r < N(); r++) if (!(markOf(b, r, valOf(cs.ans, b, r)) === 2)) return false;
  return Object.entries(game.marks).every(([k, m]) => { const [b, r, c] = k.split(",").map(Number); return b === 2 || truth(b, r, c) === (m === 2); });
}

/* ---------- drawing ---------- */
function size() {
  const w = $("casewrap").clientWidth, n = N(), nb = blocks().length;
  // side by side if both fit with squares of 40 or more (and names), else one above the other
  const label = 96, side = nb > 1 && (w - 12 - nb * (label + 22)) / (n * nb) >= 40;
  const per = side ? (w - 12) / nb : w;
  let s = Math.floor((per - label - 22 - (n - 1) * 3) / n);
  const slim = s < 44;
  if (slim) s = Math.floor((per - 50 - 22 - (n - 1) * 3) / n);
  s = Math.max(36, Math.min(64, s));
  $("board").querySelectorAll(".block").forEach(el => { el.style.setProperty("--s", s + "px"); el.classList.toggle("slim", slim); });
}
function draw() {
  if (!game || !cs) return;
  const n = N(), hm = hints.current(), done = game.won;
  $("story").innerHTML = `<span class="scene" aria-hidden="true">${ROOMS[cs.rooms[cs.scene]][0]}</span><p>${storyText()}` +
    (cs.up.some(Boolean) && cs.up.some(u => !u) ? `<span class="floors">Upstairs: ${cs.rooms.filter(r => ROOMS[r][2]).map(r => ROOMS[r][1]).join(", ")}. Downstairs: ${cs.rooms.filter(r => !ROOMS[r][2]).map(r => ROOMS[r][1]).join(", ")}.</span>` : "") + `</p>`;
  // what the cats say, grouped by who
  let h = "";
  for (let c = 0; c < n; c++) {
    const mine = cs.said.map((s, i) => [s, i]).filter(([s]) => s.by === c);
    if (!mine.length) continue;
    const cat = catOf(cs.cats[c]);
    h += `<div class="say"><span class="face"><img src="${catSrc(cat[2])}" alt=""></span><div class="bubble"><span class="who">${cat[1]} says</span>` +
      mine.map(([s, i]) => `<button class="said${game.used.includes(i) ? " used" : ""}${hm && hm.clues && hm.clues.includes(i) ? " hintclue" : ""}" data-i="${i}" aria-pressed="${game.used.includes(i)}">“${words(s)}”</button>`).join("") + `</div></div>`;
  }
  $("says").innerHTML = h;
  // the notebook
  h = "";
  for (const b of blocks()) {
    h += `<div class="block" data-b="${b}" style="--n:${n}" role="grid" aria-label="${["Who was where", "Who had what", "Which toy was where"][b]}"><div class="corner">${["Where?", "What?", "Toy where?"][b]}</div>`;
    for (let c = 0; c < n; c++) {
      if (b !== 1) { const R = ROOMS[cs.rooms[c]]; h += `<div class="head"><span class="e" aria-hidden="true">${R[0]}</span>${R[1]}${cs.up.some(Boolean) && cs.up.some(u => !u) ? `<span class="up">${R[2] ? "up" : "down"}</span>` : ""}</div>`; }
      else h += `<div class="head" title="${toyName(c)}"><img src="${toySrc(game.toys[c])}" alt="${toyName(c)}"></div>`;
    }
    for (let r = 0; r < n; r++) {
      if (b === 2) h += `<div class="rowcat"><span class="face toy"><img src="${toySrc(game.toys[r])}" alt=""></span><span class="nm">${toyName(r)}</span></div>`;
      else { const cat = catOf(cs.cats[r]), culprit = done && cs.ans.R[r] === cs.scene;
        h += `<div class="rowcat${culprit ? " culprit" : ""}"><span class="face"><img src="${catSrc(cat[2])}" alt=""></span><span class="nm">${cat[1]}</span></div>`; }
      for (let c = 0; c < n; c++) {
        const m = shownMark(b, r, c), key = `${b},${r},${c}`, lit = hm && hm.cells && hm.cells.includes(key);
        const cls = m === 2 ? " yes" : m === 1 ? " x" : m === 3 ? " auto" : "";
        h += `<button class="cell${cls}${lit ? " hintcell" + (hm.bad ? " bad" : "") : ""}" data-k="${key}" aria-label="${rowName(b, r)} and ${colName(b, c)}: ${m === 2 ? "yes" : m === 1 ? "no" : m === 3 ? "no (from a tick)" : "not marked"}"${done ? " disabled" : ""}>${m === 2 ? "✓" : m ? "✗" : ""}</button>`;
      }
    }
    h += `</div>`;
  }
  $("board").innerHTML = h;
  size();
  $("count").textContent = done ? `Case closed: it was ${catName(cs.ans.R.indexOf(cs.scene))}!` : levelName(game.level).split(" · ")[0];
  $("hintBtn").disabled = done; undo.sync();
}
addEventListener("resize", () => { if (game && cs) size(); });

/* ---------- playing ---------- */
const undo = G.history({game: () => game, list: g => g.undo, take: () => JSON.stringify({marks: game.marks, used: game.used}), cap: 80, can: playing,
  back: (u, g) => { Object.assign(g, JSON.parse(u)); }, after: () => { draw(); save(); }, restart: true,
  started: () => !!(Object.keys(game.marks).length || game.used.length || game.undo.length)});
const SND = G.sound.kit;
G.sound.define({
  "mm.x": t => SND.noise({t, dur: .12, vol: .15, type: "highpass", f: 3500, a: .01}),   // a pencil scratch
  "mm.tick": t => SND.noise({t, dur: .16, vol: .15, type: "bandpass", fs: [[0, 2500], [.16, 4200]], a: .01}),   // a pencil tick
});
// Tap a square: ✗, then ✓, then clear. A pale ✗ (from a ✓ along its line) goes straight to ✓ on a tap.
function tap(key) {
  if (!playing()) return;
  const [b, r, c] = key.split(",").map(Number), m = markOf(b, r, c), shown = shownMark(b, r, c);
  const next = shown === 3 ? 2 : (m + 1) % 3;
  undo.push(); game.started = true;
  if (next) game.marks[key] = next; else delete game.marks[key];
  G.sound.play(next === 2 ? "mm.tick" : next === 1 ? "mm.x" : "erase");
  draw(); save();
  if (solved()) win();
}
$("board").addEventListener("click", e => { const b = e.target.closest(".cell"); if (b) tap(b.dataset.k); });
$("says").addEventListener("click", e => {
  const b = e.target.closest(".said"); if (!b || !playing()) return;
  const i = +b.dataset.i, k = game.used.indexOf(i);
  undo.push(); if (k >= 0) game.used.splice(k, 1); else game.used.push(i);
  draw(); save();
});
// Restart: the same case, with the notebook cleared. It costs the gold paw.
$("restartBtn").onclick = () => {
  if (undo.restart(g => Object.assign(g, {marks: {}, used: [], restarted: true})))
    G.note("Back to a clean notebook, with the same case.", 3000);
};

/* ---------- hints ---------- */
// A wrong mark first; otherwise the next step: a square that what's marked and one thing a cat said settles (or
// two things together, or everything at once), with the words lit in gold and the square too. It costs the gold paw.
function settled(fit) {
  // the squares not yet marked (nor pale ✗) whose answer is the same in every answer that fits
  const out = [];
  for (const b of blocks()) for (let r = 0; r < N(); r++) for (let c = 0; c < N(); c++) {
    if (shownMark(b, r, c)) continue;
    const v = a => valOf(a, b, r) === c, first = v(fit[0]);
    if (fit.every(a => v(a) === first)) out.push([b, r, c, first]);
  }
  // a ✓ says more than a ✗
  return out.sort((x, y) => y[3] - x[3]);
}
function hint() {
  if (!playing()) return;
  game.hinted = true; save();
  const wrong = Object.entries(game.marks).find(([k, m]) => { const [b, r, c] = k.split(",").map(Number); return truth(b, r, c) !== (m === 2); });
  if (wrong) {
    const [b, r, c] = wrong[0].split(",").map(Number);
    hints.show({cells: [wrong[0]], bad: true}, `That ${wrong[1] === 2 ? "✓" : "✗"} doesn't fit what the cats say: ${fact(b, r, c, truth(b, r, c))}.`);
    return;
  }
  const base = answersFor(N(), hasToys()).filter(a => fitsMarks(a, game.marks)), S = cs.said, up = cs.up;
  const tell = (clues, [b, r, c, yes]) => {
    const lead = !clues.length ? "Look along the lines you've ticked and crossed" :
      clues.length === 1 ? `Read what ${catName(S[clues[0]].by)} says again` :
      clues.length === 2 ? `Put what ${catName(S[clues[0]].by)} says with what ${catName(S[clues[1]].by)} says` : "Put everything together";
    hints.show({cells: [`${b},${r},${c}`], clues: clues.length > 2 ? [] : clues}, `${lead}: ${fact(b, r, c, yes)}.`);
  };
  let s = settled(base);
  if (s.length) return tell([], s[0]);
  const order = G.shuffle ? G.shuffle([...S.keys()]) : [...S.keys()];
  for (const i of order) { s = settled(base.filter(a => holds(a, S[i], up))); if (s.length) return tell([i], s[0]); }
  for (const i of order) for (const j of order) if (i < j) { s = settled(base.filter(a => holds(a, S[i], up) && holds(a, S[j], up))); if (s.length) return tell([i, j], s[0]); }
  s = settled(base.filter(a => S.every(x => holds(a, x, up))));
  if (s.length) return tell([...S.keys()], s[0]);
}
$("hintBtn").onclick = hint;

/* ---------- winning ---------- */
const goldOK = () => !game.hinted && !game.restarted;
// Three gold-paw cases at a level move you up and three that weren't (a hint or a restart) move you down.
const steps = G.ladder("stash", MAX_LEVEL);
function win() {
  game.won = true; G.finishClock(game);
  const next = steps.end(game, game.level, !goldOK(), {what: "cases without a gold paw", none: "Only a gold paw counts toward moving up: no hint or Restart."}).next;
  settings.level = next; $("levelSel").value = next; save(); draw();
  G.track(`Case Clawsed solved level ${game.level}`);
  const g = game;
  setTimeout(() => { if (game === g) finishCard(); }, 900);
}
function culpritPic() { const c = catOf(cs.cats[cs.ans.R.indexOf(cs.scene)]), im = new Image(); im.className = "stashpic"; im.src = catSrc(c[2]); im.alt = c[1]; return im; }
function goldPic() { const im = new Image(); im.className = "stashpic"; im.src = catSrc("c17-18"); im.alt = "A black and white cat pouncing on a ball"; return im; }
function finishCard() {
  const next = settings.level, who = cs.ans.R.indexOf(cs.scene), deed = ROOMS[cs.rooms[cs.scene]][3][cs.deed];
  let text = `It was ${catName(who)}! ${WHEN[cs.when]}, ${catName(who)}${hasToys() ? `, with the ${toyName(cs.ans.T[who])},` : ""} ${deed}.`;
  text += " " + (game.climbed ? game.climbed.line : "");
  G.winCard(text, () => { G.closeCard(); startLevel(next); }, "Admire the case", game.result,
    {title: "Case closed!", gold: goldOK(), pic: [culpritPic()], goldPic: [goldPic()], goldWhy: "Solved with no hints!", next: G.ANOTHER,
     after: G.otherSize($("levelSel"), next, startLevel, G.CHANGE)});
}

/* ---------- sharing ---------- */
$("linkBtn").onclick = () => { if (game) G.shareCard({name: "Case Clawsed", won: game.won,
  puzzle: () => ({g: "stash4", N: game.level, s: game.seed, toys: game.toys}),
  progress: () => ({marks: game.marks})}); };
function openShared(d) {
  const lv = LEVELS[d.N];
  const ok = lv && d.g === "stash4" && Number.isInteger(d.s) && d.s >= 0 && Array.isArray(d.toys) && d.toys.length === (lv[1] ? lv[0] : 0) &&
    d.toys.every(f => ALL_LOOKS.includes(f)) && new Set(d.toys).size === d.toys.length;
  if (!ok) { G.note("That share link didn't work.", 5000); return; }
  game = deal(d.N, d.s, d.toys); begin();
  if (d.p && d.p.marks && typeof d.p.marks === "object") {
    for (const [k, m] of Object.entries(d.p.marks)) { const p = k.split(",").map(Number); if (p.length === 3 && p.every(Number.isInteger) && p[0] < (lv[1] ? 3 : 1) && p[1] < lv[0] && p[2] < lv[0] && (m === 1 || m === 2)) game.marks[k] = m; }
    game.timed = false;
    if (solved()) game.won = true;
  }
  settings.level = d.N; $("levelSel").value = d.N;
  draw(); save();
}

/* ---------- how to play ---------- */
function showHelp() {
  settings.seenHelp = false; helpOnFirstVisit();
  if (!document.querySelector(".spot")) { settings.seenHelp = true; G.helpLater(); }
}
function helpOnFirstVisit() {
  if (settings.seenHelp || !game || !playing() || document.querySelector(".spot")) return;
  const firstCell = () => $("board").querySelector(".cell"), block = () => $("board").querySelector(".block");
  const steps = [
    {say: "Something happened! Who did it?", els: [$("story")]},
    {say: hasToys() ? "Every cat was in a different room, with a different toy" : "Every cat was in a different room", els: [$("story")]},
    {say: "Each cat says what they know", els: [$("says")]},
    {say: hasToys() ? "Note who was where, and who had what" : "Note who was where", els: [() => $("board")]},
    {say: "Tap a square for ✗, again for ✓", els: [firstCell], try: {done: () => Object.keys(game.marks).length > 0, yes: "Tap again to change it"}},
    {say: "A ✓ crosses off its row and column", els: [block]},
    {say: "Tap what a cat says to grey it out", later: true, els: [() => $("says").querySelector(".said")]},
    {say: "Fill in every ✓ to close the case", els: [() => $("board")]},
    {say: "Stuck? A hint shows the next step", els: [$("hintBtn")]},
  ];
  G.spotlight({grid: $("board"), w: 1, h: 1, steps, done: () => { settings.seenHelp = true; draw(); save(); }});
}

/* ---------- choosing toys ---------- */
const toyChest = () => ({kinds: KINDS, off: offToys, min: LEVELS[game ? game.level : settings.level][0], src: toySrc, game: "Case Clawsed", save: off => {
  offToys = off; G.saveToys(off);
  G.note("Saved. Your toys are used from the next case.", 3500);
}});
$("toysBtn").onclick = () => G.toyPicker(toyChest());

/* ---------- start ---------- */
for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(levelName(n).replace("Level ", "") + (n === MAX_LEVEL ? " (hardest)" : ""), n));
$("levelSel").onchange = e => startLevel(+e.target.value);
$("newBtn").onclick = newPuzzle;
$("helpBtn").onclick = showHelp;

G.nav("stash");
G.checkClock(game);
G.setupTimer({name: "stash4", game: () => game, playing: g => !g.won, save, label: levelName, noun: "level",
  emptyText: "Close a case and your times will show up here. They're kept on this device only."});
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : settings.level);

if (!(settings.level >= 1 && settings.level <= MAX_LEVEL)) settings.level = 1;
$("levelSel").value = settings.level;
const shared = G.readShare("stash");
const hadSave = !!(game && game.marks && Number.isInteger(game.seed));
if (hadSave) G.reopen(() => {
    const lv = LEVELS[game.level];
    if (!lv || !Array.isArray(game.toys) || game.toys.length !== (lv[1] ? lv[0] : 0)) throw new Error("the saved case doesn't fit its level");
    if (!Array.isArray(game.undo)) game.undo = [];
    if (!Array.isArray(game.used)) game.used = [];
    begin(); draw();
    if (game.won) finishCard(); else helpOnFirstVisit();
  }, why => { game = null; newPuzzle(); G.note(why, 0); });
else if (!shared) { newPuzzle(); helpOnFirstVisit(); }
const shareOpts = () => ({name: "Case Clawsed", inProgress: !!(game && !game.won && Object.keys(game.marks).length), open: openShared, after: helpOnFirstVisit});
if (shared) G.offerShare(shared, {...shareOpts(), fresh: hadSave ? null : why => Promise.resolve(newPuzzle()).then(() => { G.note(why, 6000); helpOnFirstVisit(); })});
window.addEventListener("hashchange", () => { const d = G.readShare("stash"); if (d) G.offerShare(d, shareOpts()); });
G.needToys({...toyChest(), off: () => offToys});
</script>
