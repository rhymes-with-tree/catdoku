<style>
/* Mewstermind, since 2026-11-19 a Clue worked out like a Mastermind (in beta): one of the household's cats had one of
   the toys (from level 3 in one of the rooms, and from level 5 at one time of day). Each guess names a cat and a toy
   (and a room and a time), and paw prints
   beside it say how many of those are right, never which. */
.wrap.stashwrap{height:auto}
@media (orientation:landscape) and (max-height:500px){
  body:not(.full) main > .stashwrap.stage{--aspect:.8;max-height:var(--high);overflow-y:auto}
}
.stashboard{--s:64px;--gap:8px;display:flex;flex-direction:column;align-items:center;gap:var(--gap);padding:10px 8px;border:3px solid var(--ink);border-radius:12px;
  background:color-mix(in srgb,var(--pacific-blue) 16%,var(--panel));user-select:none;-webkit-user-select:none;touch-action:manipulation}
.line{display:flex;align-items:center;gap:10px}
.line .num{flex:none;width:22px;text-align:right;font-weight:800;font-size:15px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.slots{display:flex;gap:var(--gap)}
.slot{position:relative;flex:none;width:var(--s);height:var(--s);border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--pacific-blue) 30%,var(--panel));
  box-shadow:inset 0 3px 0 color-mix(in srgb,var(--ink) 12%,transparent)}
.slot img.toy{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(42,37,48,.3))}
.slot img.cat{position:absolute;inset:4% 4% 0;width:92%;height:150%;object-fit:cover;object-position:top}
.slot .room{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--s) * .5);line-height:1}
.slot .drop{animation:drop .18s ease-out}
@keyframes drop{from{transform:translateY(-25%) scale(.7);opacity:0}}
/* the row being guessed */
.line.now .slot{cursor:pointer;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line)}
.line.now .num{color:var(--ink)}
.line.later .slot{height:10px;border-radius:5px;opacity:.55;box-shadow:none}
.line.later .num{font-size:12px;line-height:10px;opacity:.6}
.line.later .paws{visibility:hidden;height:10px}
.line.par{padding-bottom:5px;border-bottom:2px dotted #ECA818}
.line.par .num{color:#C98A0E}
/* the paws for a guess: a dark paw for each thing right, a dot for each wrong, dark ones first */
.paws{flex:none;display:flex;flex-direction:column;gap:2px;width:calc(var(--s) * .34)}
.paws svg{width:100%;height:calc(var(--s) * .3);display:block}
.paws .right{fill:var(--ink);stroke:var(--ink)}
.paws .none{fill:color-mix(in srgb,var(--ink) 16%,transparent);stroke:none}
/* the case along the top: who, with what and where, shut until it's solved */
.line.case{padding-bottom:8px;border-bottom:2px dashed color-mix(in srgb,var(--ink) 30%,transparent)}
.line.case .slot{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel);border:2px dashed color-mix(in srgb,var(--ink) 35%,transparent);box-shadow:none}
.line.case .q{font-size:calc(var(--s) * .42);font-weight:800;color:var(--ink-soft);line-height:1}
.line.case .what{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;color:var(--ink-soft);z-index:1}
.line.case .slot.open{border-style:solid;border-color:var(--ink);animation:peek .3s ease-out both;animation-delay:var(--d,0s)}
.line.case .paws{visibility:hidden}
@keyframes peek{from{transform:scale(.6);opacity:0}}
/* Higgins's face beside what he saw (the hint's words, from games.js) */
#hintLine.witness{display:flex;align-items:center;justify-content:center;gap:8px}
#hintLine.witness:empty{display:none}
#hintLine.witness::before{content:"";flex:none;width:40px;height:40px;border-radius:50%;background:var(--panel) var(--witness) center/115% no-repeat;border:2px solid var(--ink)}
.card img.stashpic{display:block;width:70%;max-width:240px;height:auto;margin:0 auto 14px}
/* the cats, rooms, toys and times to pick from, and Check */
.tray{width:var(--board);display:flex;flex-direction:column;align-items:center;gap:8px}
.tray .row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:100%}
.tray .pick{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:56px;height:56px;padding:3px;border-radius:12px;
  background:var(--panel);border:2px solid var(--line);color:var(--ink);touch-action:manipulation;-webkit-touch-callout:none}
.tray .pick:hover{border-color:var(--ink)}
.tray .pick.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.tray .pick:disabled{opacity:.3}
.tray .pick img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.tray .pick.cat{width:62px;height:76px;padding:2px 2px 0;overflow:hidden}
.tray .pick.cat img{height:56px;object-fit:cover;object-position:top}
.tray .pick .w{font-size:11px;font-weight:700;line-height:1.1;color:var(--ink-soft);white-space:nowrap}
.tray .pick.cat .w{font-size:10px;letter-spacing:-.3px}
.tray .pick.room{width:auto;min-width:62px;padding:2px 6px}
.tray .pick.room .e{font-size:22px;line-height:1}
/* crossed off, as on a Clue notepad: dimmed and struck through */
.tray .pick.nope{border-style:dashed}
.tray .pick.nope > *{opacity:.35;filter:grayscale(.6)}
.tray .pick.nope::after{content:"";position:absolute;inset:4px;pointer-events:none;
  background:linear-gradient(to top right,transparent calc(50% - 2px),#C8392B calc(50% - 2px),#C8392B calc(50% + 2px),transparent calc(50% + 2px))}
.tray #checkBtn{height:50px;padding:0 18px}
@media (max-width:380px){.tray .pick{width:48px;height:48px}.tray .pick.cat{width:54px;height:70px}.tray .pick.cat img{height:50px}.tray #checkBtn{height:44px;padding:0 12px}}
</style>
</head>
<body>
<main>
  <header><h1>Mewster&shy;mind</h1><div class="stripe"></div><p class="tagline">Work out which cat had the toy, where and when</p></header>
  <nav class="games" id="games" aria-label="Games"></nav>

  <div class="status"><span id="count"></span><button class="timer" id="timer" hidden></button><span class="msg" id="msg" aria-live="polite"></span></div>

  <div class="wrap stashwrap stage"><div class="stashboard" id="board" aria-label="The case and your guesses"></div></div>
  <div class="tray" id="tray" aria-label="Cats, toys and rooms"></div>
  <div class="overlay" id="overlay"><div class="card" id="card"></div></div>

  <div class="actions">
    <button id="hintBtn">Hint</button>
    <button id="undoBtn">Undo</button>
    <button id="restartBtn">Restart</button>
    <button id="linkBtn">Share</button>
    <button id="toysBtn">Toys</button>
    <button id="bestBtn">Best times</button>
    <button id="helpBtn">How to play</button>
  </div>
  <div class="bar">
    <label>Level <select id="levelSel" aria-label="Level"></select></label>
    <button id="newBtn" class="primary">New mystery</button>
  </div>
</main>

<script src="../games.js?v=2026-11-20.12"></script>
<script>
/* ---------- levels ---------- */
// [cats, toys, rooms (0: none), times of day (0: none), par]. One cat had one toy (in one room, at one time of day).
// There's no limit on guesses; par is the most for a gold paw: one more than a player who only ever guesses answers
// that fit every clue so far needs nine times in ten (simulated, 2026-11-19 and 2026-11-20).
const LEVELS = [null, [4, 4, 0, 0, 6], [5, 6, 0, 0, 7], [4, 4, 4, 0, 7], [5, 6, 5, 0, 8], [4, 4, 4, 4, 8], [5, 6, 5, 5, 9]];
const MAX_LEVEL = LEVELS.length - 1;
const levelName = n => { const [C, T, R, W] = LEVELS[n]; return `Level ${n} · ${C} cats, ${T} toys${R ? `, ${R} rooms` : ""}${W ? `, ${W} times` : ""}`; };
const PARTS = ["cat", "toy", "room", "time"];
// The parts are kept in that order (cat, toy, room, time), but shown who, where, what, when (the owner's order,
// 2026-11-20): on the board, on the tray and in words.
const SHOWN = [0, 2, 1, 3];
const shown = D => SHOWN.filter(d => d < D);

/* ---------- the logic ---------- */
// An answer is [cat, toy] or [cat, toy, room], each an index into the mystery's lists, and so is a guess. The paws
// for a guess: how many of its parts are right.
const paws = (code, guess) => code.reduce((n, v, d) => n + (v === guess[d]), 0);
const sizes = g => [g.cats.length, g.toys.length, g.rooms.length, g.times.length].slice(0, g.D);
// Every answer that fits every row so far (at most 5 × 6 × 5 × 5 = 750 to try).
function fitting(dims, rows) {
  let all = [[]];
  for (const n of dims) all = all.flatMap(a => [...Array(n).keys()].map(v => [...a, v]));
  return all.filter(c => rows.every(r => paws(c, r.guess) === r.paws));
}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = n => Math.floor(Math.random() * n);

/* ---------- pictures ---------- */
const PAD = "M100 6 C126 6 141 28 153 46 C172 50 197 70 195 101 C193 133 166 147 140 141 C125 138 112 131 100 131 C88 131 75 138 60 141 C34 147 7 133 5 101 C3 70 28 50 47 46 C59 28 74 6 100 6Z";
const pawSVG = kind => kind === "none" ? `<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="none" cx="50" cy="50" r="17"/></svg>` :
  `<svg viewBox="-6 -6 112 100" aria-hidden="true"><g class="${kind}" stroke-width="7">
  ${[[16.5, 30.5, -24], [38.5, 15, -8], [61.5, 15, 8], [83.5, 30.5, 24]].map(([x, y, r]) => `<ellipse cx="${x}" cy="${y}" rx="9.5" ry="10.75" transform="rotate(${r} ${x} ${y})"/>`).join("")}
  <path d="${PAD}" transform="translate(19 35.3) scale(.31 .298)" stroke-width="22"/></g></svg>`;

/* ---------- cats ---------- */
// The household's own cats, each sitting up, seen from the front (ARTWORK.md). A mystery has at most one of the
// cats who look alike at this size: the black cats (Peanut, Dottie and Ferguson) and the grey tabbies (Gus and Crunch).
const CATS = [["gus", "Gus", "gus-12", "grey tabby"], ["peanut", "Peanut", "peanut-12", "black"], ["marmalade", "Marmalade", "marmalade-1"], ["willow", "Willow", "willow-1"],
  ["moonpie", "Moonpie", "moonpie-sit"], ["rayla", "Rayla", "rayla-sit"], ["ferguson", "Ferguson", "ferguson-sit", "black"], ["crunch", "Crunch", "crunch-3", "grey tabby"],
  ["laya", "Laya", "laya-5"], ["dottie", "Dottie", "dottie-18", "black"]];
// The witness who gives a hint, as in Clue: Higgins (the owner's pick, 2026-11-20), never a suspect, his face beside
// what he saw.
const WITNESS = ["higgins", "Higgins", "higgins-face"];
const CAT_SRC = {};  // filled with embedded pictures when the page is bundled into one file
const catSrc = f => CAT_SRC[f] || `../cats/${f}.webp`;
const catOf = id => CATS.find(c => c[0] === id) || CATS[0];
document.documentElement.style.setProperty("--witness", `url("${catSrc(WITNESS[2])}")`);
function pickCats(N) {
  const out = [];
  for (const c of shuffle(CATS.slice())) if (out.length < N && !(c[3] && out.some(o => o[3] === c[3]))) out.push(c);
  return out.map(c => c[0]);
}

/* ---------- rooms ---------- */
const ROOMS = [["🍳", "kitchen"], ["🛏️", "bedroom"], ["🛋️", "living room"], ["🛁", "bathroom"], ["📚", "study"], ["🧺", "laundry"]];
const pickRooms = N => shuffle([...ROOMS.keys()]).slice(0, N);
/* ---------- times of day (from level 5; the owner's pick, 2026-11-20) ---------- */
// [emoji, name, how a sentence says it], in the order of the day: a mystery's times stay in that order on the tray.
const TIMES = [["🌅", "dawn", "at dawn"], ["☀️", "noon", "at noon"], ["🌇", "evening", "in the evening"], ["🌙", "midnight", "at midnight"], ["🌌", "3 a.m.", "at 3 a.m."]];
const pickTimes = N => shuffle([...TIMES.keys()]).slice(0, N).sort((a, b) => a - b);

/* ---------- toys ---------- */
const KINDS = [
  {c: "#BD5538", looks: [["wiffle-red", "red wiffle ball"], ["swirl-red", "red swirl ball"], ["crochet-stars", "star ball"], ["tinsel", "tinsel ball"]]},
  {c: "#ECA818", looks: [["wiffle-yellow", "yellow wiffle ball"]]},
  {c: "#73A7AE", looks: [["wiffle-teal", "teal wiffle ball"], ["fish", "fish"]]},
  {c: "#6AA673", looks: [["lattice", "lattice ball"]]},
  {c: "#B3B94B", looks: [["spiky-lime", "spiky pom-pom"]]},
  {c: "#B94588", looks: [["swirl-purple", "plum swirl ball"], ["bell-purple", "bell ball"]]},
  {c: "#7885BA", looks: [["spring", "spring"], ["rope-blue", "rope ball"]]},
  {c: "#825840", looks: [["cork-paw", "cork paw ball"], ["burlap-paws", "burlap ball"], ["rattan", "rattan ball"]]},
  {c: "#5E5866", looks: [["mouse", "mouse"]]},
  {c: "#E16A4A", looks: [["felt-rainbow", "rainbow ball"], ["ribbon-tail", "ribbon ball"], ["spiky-rainbow", "spiky ball"]]},
];
const ALL_LOOKS = KINDS.flatMap(k => k.looks.map(([f]) => f));
let offToys = G.toysOff();
const TOY_SRC = {};  // filled with embedded pictures when the page is bundled into one file
const toySrc = f => TOY_SRC[f] || `../toys/${f}.webp?v=${window.SITE_BUILD || ""}`;
const nameOf = f => { for (const k of KINDS) for (const [g, n] of k.looks) if (g === f) return n; return "toy"; };
function pickToys(K) {
  const on = shuffle(KINDS.filter(k => k.looks.some(([f]) => !offToys.has(f)))), off = shuffle(KINDS.filter(k => !on.includes(k)));
  return on.concat(off).slice(0, K).map(k => k.looks[G.pickLook(k, offToys)][0]);
}

/* ---------- game ---------- */
// game: {level, D (parts: 2 cat and toy, 3 with a room, 4 with a time), cats (ids), toys (pictures), rooms (ROOMS
//        indexes), times (TIMES indexes), code ([cat, toy, room?, time?]), rows ([{guess, paws}]), cur (the row being guessed: an index or null per part),
//        nope (per part, the ones crossed off on the tray), undo, hinted, restarted, won}
const STORE = "catdoku.stash.v3";   // v1 was the Mastermind of boxes, v2 a cat-to-toy match (both 2026-11-19)
const $ = G.$;
let state = G.load(STORE);
let settings = Object.assign({level: 1}, state.settings);
let game = state.game || null;
G.pawLost(() => !game || game.won || game.hinted || game.restarted || game.rows.length > par());
const hints = G.hinter({game: () => game, key: () => game ? game.rows.length + "|" + game.cur.join() : "", draw: () => draw()});   // marks {cells, picks: [[d, v]], bad}
const save = () => G.save(STORE, {settings, game});
const playing = () => game && !game.won && !$("overlay").classList.contains("show");

function deal(n, keep) {
  const [C, T, R, W] = LEVELS[n], D = W ? 4 : R ? 3 : 2;
  keep = keep || {};
  const g = {level: n, D, cats: keep.cats || pickCats(C), toys: keep.toys || pickToys(T), rooms: keep.rooms || (R ? pickRooms(R) : []), times: keep.times || (W ? pickTimes(W) : []),
             rows: [], cur: Array(D).fill(null), nope: [[], [], [], []].slice(0, D), undo: [], hinted: false, restarted: false, won: false, ...G.freshClock()};
  g.code = keep.code || sizes(g).map(rnd);
  return g;
}
function newPuzzle() {
  G.closeCard();
  game = deal(settings.level); draw(); save();
  G.track(`Mewstermind new puzzle level ${game.level}`);
}
function startLevel(n) { settings.level = n; $("levelSel").value = n; newPuzzle(); }
const par = () => LEVELS[game.level][4];
const catName = c => catOf(game.cats[c])[1];
const toyName = t => nameOf(game.toys[t]);
const roomName = r => ROOMS[game.rooms[r]][1];
const timeName = w => TIMES[game.times[w]][1];
const partName = (d, v) => d === 0 ? catName(v) : d === 1 ? `the ${toyName(v)}` : d === 2 ? `the ${roomName(v)}` : timeName(v);
// "Gus, with the mouse, in the kitchen, at 3 a.m."
const guessSay = g => shown(g.length).map(d => { const v = g[d]; return v === null ? "" : d === 0 ? catName(v) : d === 1 ? `with the ${toyName(v)}` : d === 2 ? `in the ${roomName(v)}` : TIMES[game.times[v]][2]; }).filter(Boolean).join(", ");

/* ---------- drawing ---------- */
let fresh = -1;   // the part that just went in, to drop it in
function size() {
  const w = $("board").parentElement.clientWidth - 22, D = game.D;
  const s = Math.floor(Math.min(72, (w - 22 - 20 - (D - 1) * 8 - 12) / (D + 0.34)));
  $("board").style.setProperty("--s", `${s}px`);
}
function partHTML(d, v, drop) {
  const cls = drop ? " drop" : "";
  if (d === 0) return `<img class="cat${cls}" src="${catSrc(catOf(game.cats[v])[2])}" alt="">`;
  if (d === 1) return `<img class="toy${cls}" src="${toySrc(game.toys[v])}" alt="">`;
  return `<span class="room${cls}" aria-hidden="true">${(d === 2 ? ROOMS[game.rooms[v]] : TIMES[game.times[v]])[0]}</span>`;
}
const pawsHTML = (p, D) => [...Array(p).fill("right"), ...Array(D - p).fill("none")].map(pawSVG).join("");
function draw() {
  const {D, rows, cur} = game, done = game.won, hm = hints.current(), T = Math.max(par(), rows.length + (done ? 0 : 1));
  size();
  // the case: who, with what, where
  const WHAT = ["Who?", "What?", "Where?", "When?"];
  let h = `<div class="line case"><span class="num"></span><div class="slots">`;
  shown(D).forEach((d, k) => h += done ? `<div class="slot open" style="--d:${k * 0.15}s" aria-label="${partName(d, game.code[d])}">${partHTML(d, game.code[d])}</div>`
    : `<div class="slot" aria-label="${WHAT[d]}"><span class="q">?</span><span class="what">${WHAT[d].replace("?", "")}</span></div>`);
  h += `</div><div class="paws"></div></div>`;
  for (let r = 0; r < T; r++) {
    const row = rows[r], now = !done && r === rows.length, g = row ? row.guess : now ? cur : null;
    h += `<div class="line ${row ? "done" : now ? "now" : "later"}${r + 1 === par() ? " par" : ""}" data-r="${r}"${g ? ` aria-label="Guess ${r + 1}: ${guessSay(g) || "empty"}${row ? `, ${row.paws} right` : ""}"` : ""}><span class="num">${r + 1}</span><div class="slots">`;
    for (const d of shown(D)) {
      const v = g ? g[d] : null, mark = now && hm && hm.cells && hm.cells.includes(d) ? ` hintcell${hm.bad ? " bad" : ""}` : "";
      h += `<div class="slot${mark}" data-d="${d}"${now ? ` role="button" aria-label="${v === null ? `No ${PARTS[d]} yet` : `${partName(d, v)}: tap to take out`}"` : ""}>${v !== null && v !== undefined ? partHTML(d, v, now && fresh === d) : ""}</div>`;
    }
    h += `</div><div class="paws"${row ? ` aria-label="${row.paws} right"` : ""}>${row ? pawsHTML(row.paws, D) : ""}</div></div>`;
  }
  $("board").innerHTML = h;
  fresh = -1;
  // the tray: the cats, the toys, the rooms, then Check
  const tray = $("tray"), sig = [game.cats, game.toys, game.rooms, game.times].map(a => a.join()).join("|");
  if (tray.dataset.sig !== sig) {
    tray.dataset.sig = sig; tray.innerHTML = "";
    const lists = [game.cats, game.toys, game.rooms, game.times];
    shown(D).forEach(d => { const list = lists[d];
      const row = document.createElement("div"); row.className = "row"; tray.append(row);
      list.forEach((x, v) => {
        const b = document.createElement("button"); b.className = "pick " + PARTS[d]; b.dataset.d = d; b.dataset.v = v;
        if (d === 0) { const c = catOf(x); b.innerHTML = `<img src="${catSrc(c[2])}" alt=""><span class="w">${c[1]}</span>`; }
        else if (d === 1) { b.innerHTML = `<img src="${toySrc(x)}" alt="">`; b.title = nameOf(x)[0].toUpperCase() + nameOf(x).slice(1); }
        else { const [e, w] = (d === 2 ? ROOMS : TIMES)[x]; b.className = "pick room" + (d === 3 ? " time" : ""); b.innerHTML = `<span class="e" aria-hidden="true">${e}</span><span class="w">${w}</span>`; }
        row.append(b);
      });
    });
    const c = document.createElement("button"); c.id = "checkBtn"; c.className = "primary lead"; c.innerHTML = G.icon("check") + '<span class="lbl">Check</span>'; tray.append(c);
  }
  tray.querySelectorAll(".pick").forEach(b => {
    const d = +b.dataset.d, v = +b.dataset.v, no = !done && game.nope[d].includes(v), lit = hm && hm.picks && hm.picks.some(([pd, pv]) => pd === d && pv === v);
    b.disabled = done;
    b.classList.toggle("on", !done && cur[d] === v);
    b.classList.toggle("nope", no);
    b.classList.toggle("hintcell", !!lit); b.classList.toggle("bad", !!(lit && hm.bad));
    b.setAttribute("aria-label", `${d === 0 ? catName(v) : d === 1 ? toyName(v) : d === 2 ? roomName(v) : timeName(v)}${no ? ", crossed off" : ""}`);
  });
  $("checkBtn").disabled = done || cur.includes(null);
  const g = rows.length + (done ? 0 : 1);
  $("count").textContent = game.won ? `Solved in ${rows.length} guess${rows.length === 1 ? "" : "es"}!` : `Guess ${g}`;
  $("hintBtn").disabled = done; undo.sync();
}
addEventListener("resize", () => { if (game) size(); });

/* ---------- playing ---------- */
// Undo (G.history): each step is the row being put together, as it was. A checked guess can't be taken back.
const undo = G.history({game: () => game, list: g => g.undo, take: () => ({cur: game.cur.slice()}), cap: 60, can: playing,
  back: (u, g) => { g.cur = u.cur; }, after: () => { draw(); save(); }, restart: true,
  started: () => !!(game.rows.length || game.undo.length || game.cur.some(v => v !== null))});
const SND = G.sound.kit;
G.sound.define({
  "mm.check": t => SND.bell({f: 1319, t, dur: .5, vol: .08, ratio: 2.01, index: .6}),   // one chime
  "mm.nope": t => SND.noise({t, dur: .12, vol: .15, type: "highpass", f: 3500, a: .01}),   // a pencil scratch
});
function change(fn) { undo.push(); fn(); game.started = true; draw(); save(); }
// A cat, toy or room from the tray goes into its square in the row (in place of what was there).
function put(d, v) {
  if (!playing() || game.cur[d] === v) return;
  G.sound.play("put");
  change(() => { game.cur[d] = v; fresh = d; });
}
function takeOut(d) {
  if (!playing() || game.cur[d] === null) return;
  G.sound.play("erase"); change(() => { game.cur[d] = null; });
}
function check() {
  if (!playing()) return;
  if (game.cur.includes(null)) { G.note(["", "", "Pick a cat and a toy first.", "Pick a cat, a room and a toy first.", "Pick a cat, a room, a toy and a time first."][game.D], 2500); return; }
  const guess = game.cur.slice(), p = paws(game.code, guess);
  game.rows.push({guess, paws: p}); game.started = true; G.sound.play("mm.check");
  game.cur = Array(game.D).fill(null); game.undo = [];
  if (p === game.D) { win(); return; }
  draw(); save();
  const now = $("board").querySelector(".line.now");
  if (now) now.scrollIntoView({block: "nearest"});
  $("tray").scrollIntoView({block: "nearest"});
}
$("board").addEventListener("click", e => { const s = e.target.closest(".line.now .slot"); if (s) takeOut(+s.dataset.d); });
// Tap to put it in the row; hold (or right-click) to cross it off, as on a Clue notepad, or to put it back.
let held = null, heldFired = false;
function nope(d, v) {
  if (!playing()) return;
  const k = game.nope[d].indexOf(v);
  if (k >= 0) game.nope[d].splice(k, 1); else game.nope[d].push(v);
  G.sound.play(k >= 0 ? "erase" : "mm.nope");
  draw(); save();
}
$("tray").addEventListener("pointerdown", e => {
  const b = e.target.closest(".pick"); if (!b || b.disabled) return;
  heldFired = false; clearTimeout(held);
  held = setTimeout(() => { heldFired = true; nope(+b.dataset.d, +b.dataset.v); if (navigator.vibrate) navigator.vibrate(15); }, 450);
});
for (const ev of ["pointerup", "pointerleave", "pointercancel"]) $("tray").addEventListener(ev, () => clearTimeout(held));
$("tray").addEventListener("contextmenu", e => { const b = e.target.closest(".pick"); if (!b) return; e.preventDefault(); clearTimeout(held); if (!heldFired) nope(+b.dataset.d, +b.dataset.v); heldFired = true; });
$("tray").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "checkBtn") check();
  else if (heldFired) heldFired = false;
  else put(+b.dataset.d, +b.dataset.v);
});
// Keys (by what's kept, not what's shown): 1 to 9 pick a cat, Shift with 1 to 9 a toy, Alt with 1 to 9 a room, Alt and Shift with 1 to 9 a time;
// Backspace takes the last out; Enter checks.
document.addEventListener("keydown", e => {
  if (!playing() || document.querySelector(".spot") || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.ctrlKey || e.metaKey) return;
  const n = /^Digit[1-9]$/.test(e.code) ? +e.code[5] : 0, d = (e.altKey ? 2 : 0) + (e.shiftKey ? 1 : 0);
  if (n && d < game.D && n <= sizes(game)[d]) { e.preventDefault(); put(d, n - 1); }
  else if (e.key === "Backspace" || e.key === "Delete") { e.preventDefault(); const k = game.cur.map((v, i) => v !== null ? i : -1).filter(i => i >= 0).pop(); if (k !== undefined) takeOut(k); }
  else if (e.key === "Enter" && (e.target.tagName !== "BUTTON" || e.target.closest("#tray .pick"))) { e.preventDefault(); check(); }
});
// Restart: the same mystery, with every guess taken back. It costs the gold paw.
$("restartBtn").onclick = () => {
  if (undo.restart(g => Object.assign(g, deal(g.level, g), {hinted: g.hinted, restarted: true, ms: g.ms, started: g.started, timed: g.timed})))
    G.note("Back to the first guess, with the same mystery.", 3000);
};

/* ---------- hints: a witness, as in Clue ---------- */
// Higgins saw something, and tells you one thing it wasn't: something in the row you're putting together if
// that's wrong, or else something the paws haven't ruled out yet. It's lit red on the tray. It costs the gold paw.
function hint() {
  if (!playing()) return;
  const {D, code, cur, rows} = game, who = WITNESS[1];
  if ($("hintLine")) $("hintLine").classList.add("witness");
  const fit = fitting(sizes(game), rows);
  const open = d => [...new Set(fit.map(c => c[d]))].filter(v => v !== code[d]);   // still possible, and wrong
  const said = (d, v) => d === 0 ? `it wasn't ${catName(v)}` : d === 1 ? `it wasn't the ${toyName(v)}` : d === 2 ? `it wasn't in the ${roomName(v)}` : `it wasn't ${TIMES[game.times[v]][2]}`;
  let pick = null;
  const wrongNow = [...Array(D).keys()].filter(d => cur[d] !== null && cur[d] !== code[d]);
  if (wrongNow.length) { const d = wrongNow[rnd(wrongNow.length)]; pick = [d, cur[d]]; }
  else { const all = [...Array(D).keys()].flatMap(d => open(d).map(v => [d, v])); if (all.length) pick = all[rnd(all.length)]; }
  game.hinted = true; save();
  if (!pick) { hints.show({cells: [...Array(D).keys()]}, `${who} has nothing to add: the paws say it all. ${cur.includes(null) ? "Fill in the row and check it!" : "Check it!"}`); return; }
  const [d, v] = pick;
  hints.show({cells: cur[d] === v ? [d] : [], picks: [pick], bad: true}, `${who} saw something: ${said(d, v)}.`);
}
$("hintBtn").onclick = hint;

/* ---------- winning ---------- */
const goldOK = () => !game.hinted && !game.restarted && game.rows.length <= par();
function win() {
  game.won = true; G.finishClock(game);
  const next = goldOK() ? Math.min(MAX_LEVEL, game.level + 1) : game.level;
  settings.level = next; $("levelSel").value = next; save(); draw();
  G.track(`Mewstermind solved level ${game.level}`);
  const g = game;
  setTimeout(() => { if (game === g) finishCard(); }, 1100);
}
function stashPic() { const im = new Image(); im.className = "stashpic"; im.src = catSrc("c17-18"); im.alt = "A black and white cat pouncing on a ball"; return im; }
function finishCard() {
  const next = settings.level, n = game.rows.length;
  let text = `It was ${guessSay(game.code)}. You worked it out in ${n} guess${n === 1 ? "" : "es"}.`;
  text += goldOK() ? (game.level === MAX_LEVEL ? " That's the hardest level so far; here's another." : ` Next up: level ${next}.`)
    : ` A gold paw moves you up: ${par()} guesses or fewer, with no hint or Restart. ${game.hinted ? "You had a hint" : game.restarted ? "You restarted" : `This took ${n}`}, so here's another at level ${next}.`;
  G.winCard(text, () => { G.closeCard(); startLevel(next); }, "Admire the case", game.result,
    {title: "Case closed!", gold: goldOK(), goldPic: [stashPic()], goldWhy: `Solved in ${n} guess${n === 1 ? "" : "es"}, with no hints!`, next: next > game.level ? `Next: level ${next}` : "Next mystery",
     after: G.otherSize($("levelSel"), next, startLevel, "Or play a different level:")});
}

/* ---------- sharing ---------- */
// The answer travels in the link a little scrambled, so it isn't there to read at a glance.
const scramble = (code, dims) => code.map((v, d) => (v + 2 * d + 1) % dims[d]);
const unscramble = (s, dims) => s.map((v, d) => ((v - 2 * d - 1) % dims[d] + dims[d] * 4) % dims[d]);
$("linkBtn").onclick = () => { if (game) G.shareCard({name: "Mewstermind", won: game.won,
  puzzle: () => ({g: "stash3", N: game.level, cats: game.cats, toys: game.toys, rooms: game.rooms, times: game.times, s: scramble(game.code, sizes(game))}),
  progress: () => ({rows: game.rows.map(r => r.guess)})}); };
function openShared(d) {
  const lv = LEVELS[d.N], [C, T, R, W] = lv || [], times = d.times || [];
  const uniq = a => new Set(a).size === a.length;
  const ok = lv && d.g === "stash3" && Array.isArray(d.cats) && d.cats.length === C && d.cats.every(c => CATS.some(x => x[0] === c)) && uniq(d.cats) &&
    Array.isArray(d.toys) && d.toys.length === T && d.toys.every(f => ALL_LOOKS.includes(f)) && uniq(d.toys) &&
    Array.isArray(d.rooms) && d.rooms.length === R && d.rooms.every(k => Number.isInteger(k) && k >= 0 && k < ROOMS.length) && uniq(d.rooms) &&
    Array.isArray(times) && times.length === W && times.every(k => Number.isInteger(k) && k >= 0 && k < TIMES.length) && uniq(times) &&
    Array.isArray(d.s) && d.s.length === (W ? 4 : R ? 3 : 2);
  const dims = ok && [C, T, R, W].slice(0, d.s.length);
  const inRange = g => Array.isArray(g) && g.length === dims.length && g.every((v, k) => Number.isInteger(v) && v >= 0 && v < dims[k]);
  if (!ok || !inRange(d.s)) { G.note("That share link didn't work.", 5000); return; }
  const code = unscramble(d.s, dims);
  game = deal(d.N, {cats: d.cats, toys: d.toys, rooms: d.rooms, times: times.slice().sort((a, b) => a - b), code});
  if (d.p && Array.isArray(d.p.rows) && d.p.rows.length <= 99 && d.p.rows.every(inRange)) {
    game.rows = d.p.rows.map(guess => ({guess, paws: paws(code, guess)})); game.timed = false;
    const k = game.rows.findIndex(r => r.paws === dims.length);
    if (k >= 0) { game.rows = game.rows.slice(0, k + 1); game.won = true; }
  }
  settings.level = d.N; $("levelSel").value = d.N;
  draw(); save();
}

/* ---------- how to play ---------- */
function showHelp() {
  settings.seenHelp = false; helpOnFirstVisit();
  if (!document.querySelector(".spot")) { settings.seenHelp = true; G.helpLater(); }
}
function map() {
  const lines = $("board").querySelectorAll(".line[data-r]"), s0 = lines[0].querySelectorAll(".slot"), a = s0[0].getBoundingClientRect();
  const gap = s0.length > 1 ? s0[1].getBoundingClientRect().left - a.right : 8, row = lines[0].getBoundingClientRect();
  return {ox: a.left - gap / 2, oy: row.top - gap / 2, cw: a.width + gap, ch: row.height + gap};
}
// The first visit walks through a guess for real; the paws steps then point at the player's own first row.
function helpOnFirstVisit() {
  if (settings.seenHelp || !game || !playing() || document.querySelector(".spot")) return;
  const {D} = game, T = Math.max(par(), game.rows.length + 1), row = [...Array(D).keys()].map(i => [i, 0]);
  const pawsEl = () => $("board").querySelector('.line[data-r="0"] .paws');
  const steps = [
    {say: D > 3 ? "One cat had a toy, somewhere, sometime" : D > 2 ? "One cat had a toy, somewhere" : "One cat had one of the toys", els: [() => $("board").querySelector(".line.case .slots")]},
    {say: D > 3 ? "Pick who, where, what and when" : D > 2 ? "Pick a cat, a room and a toy" : "Pick a cat and a toy", lit: [...Array(D).keys()].map(i => [i, game.rows.length]), els: [$("tray")],
     try: {done: () => !game.cur.includes(null) || game.rows.length > 0}},
    {say: "Then tap Check", els: [() => $("checkBtn")], try: {done: () => game.rows.length > 0, yes: "Paws tell you how close"}},
    {say: "A dark paw for each one right", lit: row, els: [pawsEl]},
    {say: "Paws don't say which", lit: row, els: [pawsEl]},
    {say: "Hold one to cross it off", later: true, els: [() => $("tray").querySelector(".pick")]},
    {say: "Guess until you've solved it", els: [$("count")]},
    {say: "By the gold line: gold paw", later: true, els: [() => $("board").querySelector(".line.par")]},
    {say: "Stuck? A witness rules one out", els: [$("hintBtn")]},
  ];
  G.spotlight({grid: $("board"), w: D, h: T, steps, map, done: () => { settings.seenHelp = true; draw(); save(); }});
}

/* ---------- choosing toys ---------- */
const toyChest = () => ({kinds: KINDS, off: offToys, min: LEVELS[game ? game.level : settings.level][1], src: toySrc, game: "Mewstermind", save: off => {
  offToys = off; G.saveToys(off);
  G.note("Saved. Your toys are used from the next mystery.", 3500);
}});
$("toysBtn").onclick = () => G.toyPicker(toyChest());

/* ---------- start ---------- */
for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(levelName(n).replace("Level ", "") + (n === MAX_LEVEL ? " (hardest)" : ""), n));
$("levelSel").onchange = e => startLevel(+e.target.value);
$("newBtn").onclick = newPuzzle;
$("helpBtn").onclick = showHelp;

G.nav("stash");
G.checkClock(game);
G.setupTimer({name: "stash3", game: () => game, playing: g => !g.won, save, label: levelName, noun: "level",
  emptyText: "Solve a mystery and your times will show up here. They're kept on this device only."});
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : settings.level);

if (!(settings.level >= 1 && settings.level <= MAX_LEVEL)) settings.level = 1;
$("levelSel").value = settings.level;
const shared = G.readShare("stash");
const hadSave = !!(game && Array.isArray(game.rows));
if (hadSave) G.reopen(() => {
    const lv = LEVELS[game.level];
    if (!Array.isArray(game.times)) game.times = [];
    if (!lv || game.cats.length !== lv[0] || game.toys.length !== lv[1] || game.rooms.length !== lv[2] || game.times.length !== lv[3] || game.code.length !== game.D) throw new Error("the saved mystery doesn't fit its level");
    if (!Array.isArray(game.undo)) game.undo = [];
    draw();
    if (game.won) finishCard(); else helpOnFirstVisit();
  }, why => { game = null; newPuzzle(); G.note(why, 0); });
else if (!shared) { newPuzzle(); helpOnFirstVisit(); }
const shareOpts = () => ({name: "Mewstermind", inProgress: !!(game && !game.won && game.rows.length), open: openShared, after: helpOnFirstVisit});
if (shared) G.offerShare(shared, {...shareOpts(), fresh: hadSave ? null : why => Promise.resolve(newPuzzle()).then(() => { G.note(why, 6000); helpOnFirstVisit(); })});
window.addEventListener("hashchange", () => { const d = G.readShare("stash"); if (d) G.offerShare(d, shareOpts()); });
G.needToys({...toyChest(), off: () => offToys});
</script>
