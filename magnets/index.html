<style>

.title{display:flex;align-items:flex-end;gap:6px}
.crunch{display:block;height:68px;width:auto;margin-bottom:-6px}
@media (max-height:760px){.crunch{height:48px;margin-bottom:-4px}}
.kitchen{height:auto;display:flex;flex-direction:column;gap:10px;width:var(--board);touch-action:manipulation;user-select:none;-webkit-user-select:none;outline:none}
.fridge{position:relative}

.door{fill:#F7F8F3;stroke:#2A2530;stroke-width:3.5}
.handle{fill:#DCDDD5;stroke:#2A2530;stroke-width:3}
.backing{fill:#2A2530}
.slot{fill:#FBFAF5}
.slot.mine{fill:#E3EEEF}
.slot.word{fill:#CFE2E4}
.slot.sel{fill:#FFF0C2;stroke:#ECA818;stroke-width:4}

[data-k]{cursor:pointer}
.mag{font:800 44px var(--font);text-anchor:middle;dominant-baseline:central;text-transform:uppercase;pointer-events:none;filter:drop-shadow(1.5px 2.5px 0 rgba(42,37,48,.3))}

.floor{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;padding:8px;background:linear-gradient(#EFE6D2,#E4D8BE);
  border:3px solid var(--ink);border-radius:12px;position:relative}
.floor button{all:unset;box-sizing:border-box;aspect-ratio:1;min-width:0;display:flex;align-items:center;justify-content:center;border-radius:9px;cursor:pointer;
  font:800 clamp(24px,7.4vw,36px)/1 var(--font);text-transform:uppercase;color:var(--c);
  text-shadow:1.5px 2.5px 0 rgba(42,37,48,.3);transform:rotate(var(--r));transition:transform .12s}
.floor button:focus-visible{outline:3px solid var(--pacific-blue)}

}

  /* the fridge takes what's left of the width; the letters are small, in a strip a little shorter than the fridge */
  body:not(.full) main > .kitchen.stage{flex-direction:row;align-items:flex-start;gap:10px;--cell:min(calc(var(--high) * .074),70px);
    --board:min(calc(100vw - 190px),calc(var(--high) * 1.1 + var(--cell) * 3 + 30px))}
  body:not(.full) main > .kitchen.stage .fridge{flex:1;min-width:0}

  body:not(.full) main > .kitchen.stage .floor button{font-size:calc(var(--cell) * .72);-webkit-text-stroke-width:2px}

<script src="../games.js?v=2026-11-01.6"></script>
<script>
/* ---------- fridges ---------- */
// A fridge is a 10 × 10 crossword with 26 empty squares, and the 26 letters a–z on the floor to fill them, each
// once. The letters already up can be any letters, as many times as the words need. Every line of two or more
// squares, across and down, is a word from magnets/words.json (tools/make-magnet-words.py): everyday words only.
// The empty squares are one square of each letter, checked to leave just one way to fill them.
// Levels (★ to ★★★): how much thinking a fridge takes, found by solving it the way a person would (solveSteps):
// the more letters that take the harder steps, the more stars. To make the right kind more often, ★ fridges are
// grown bigger (more letters up to help) with the empty squares mostly where two words cross, ★★★ ones smaller
// with them mostly in just one word.
function wordIndex(w) {
  if (self.MAG_IDX && self.MAG_IDX.src === w.words.length) return self.MAG_IDX;
  const all = new Set(w.words.split(" ")), byLen = {};
  for (const x of all) (byLen[x.length] = byLen[x.length] || []).push(x);
  return self.MAG_IDX = {src: w.words.length, all, byLen};
}
// Grow a crossword in N × N (N × N letters, "" for a black square): start with a 7-letter word with a q, j, x or
// z, then keep adding words that cross letters already up, wherever every line they make across and down is a
// word: words with the rarest letter not yet up first, then the ones crossing most letters, until nothing more
// fits. Returns null if some letter a–z never gets up.
function growGrid(idx, N) {
  const g = Array(N * N).fill(""), used = new Set(), RARE = "zqxjkvbpygfwmucldrhsnioate";
  const at = (r, c) => r < 0 || c < 0 || r >= N || c >= N ? "" : g[r * N + c];
  // the line through (r, c) going way d (0 across, 1 down), with letter ch put there
  const line = (r, c, d, ch) => {
    const dr = d, dc = 1 - d;
    let r0 = r, c0 = c, s = "";
    while (at(r0 - dr, c0 - dc)) { r0 -= dr; c0 -= dc; }
    for (let rr = r0, cc = c0; rr < N && cc < N && (rr === r && cc === c || at(rr, cc)); rr += dr, cc += dc) s += rr === r && cc === c ? ch : at(rr, cc);
    return s;
  };
  const place = L => {
    const have = new Set(g.filter(Boolean)), cands = [];
    for (let d = 0; d < 2; d++) for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const dr = d, dc = 1 - d;
      if (at(r - dr, c - dc)) continue;
      for (let len = 2; len <= N - (d ? r : c); len++) {
        if (at(r + dr * len, c + dc * len)) continue;
        let pat = "", cross = 0;
        for (let i = 0; i < len; i++) { const ch = at(r + dr * i, c + dc * i); pat += ch || "."; if (ch) cross++; }
        if (!cross || cross === len) continue;
        for (const w of idx.byLen[len] || []) {
          if (used.has(w) || (L && !w.includes(L))) continue;
          let ok = true;
          for (let i = 0; i < len && ok; i++) if (pat[i] !== "." && pat[i] !== w[i]) ok = false;
          if (!ok) continue;
          let gain = 0; for (const ch of new Set(w)) if (!have.has(ch)) gain++;
          cands.push([(L ? gain * 4 : 0) + cross * 4 - (len - cross) * 1.2 + Math.random() * 3, w, r, c, d]);
        }
      }
    }
    cands.sort((a, b) => b[0] - a[0]);
    for (const [, w, r, c, d] of cands.slice(0, 300)) {
      let ok = true;
      for (let i = 0; i < w.length && ok; i++) {
        const rr = r + d * i, cc = c + (1 - d) * i;
        if (!at(rr, cc)) { const s = line(rr, cc, 1 - d, w[i]); ok = s.length < 2 || idx.all.has(s); }
      }
      if (!ok) continue;
      for (let i = 0; i < w.length; i++) g[(r + d * i) * N + c + (1 - d) * i] = w[i];
      used.add(w);
      return true;
    }
    return false;
  };
  const sevens = idx.byLen[7].filter(w => /[qjxz]/.test(w)), first = sevens[Math.floor(Math.random() * sevens.length)];
  const r0 = Math.floor(Math.random() * N), c0 = Math.floor(Math.random() * (N - 6));
  for (let i = 0; i < 7; i++) g[r0 * N + c0 + i] = first[i];
  used.add(first);
  for (let step = 0; step < 150; step++) {
    const have = new Set(g.filter(Boolean)), left = [..."abcdefghijklmnopqrstuvwxyz"].filter(ch => !have.has(ch));
    const L = left.length ? left.sort((a, b) => RARE.indexOf(a) - RARE.indexOf(b))[0] : null;
    if (!place(L) && !(L && place(null))) return left.length ? null : g;
  }
  return null;
}
// A grid's words: every line of two or more squares, across then down, as lists of squares (r × N + c).
function gridSlots(g, N) {
  const slots = [];
  for (let d = 0; d < 2; d++) for (let a = 0; a < N; a++) {
    let run = [];
    for (let b = 0; b <= N; b++) {
      const k = d ? b * N + a : a * N + b;
      if (b < N && g[k]) run.push(k);
      else { if (run.length > 1) slots.push(run); run = []; }
    }
  }
  return slots;
}

// How many ways (counting up to `cap`) to fill the `open` squares with different letters so every word counts,
// the other squares having the letters in `given` ([square, letter] pairs). `found`, if given, collects them
// (square → letter). Gives up after `budget` steps and says `cap`.
function countFills(idx, slots, given, open, cap, budget, found) {
  const at = new Map(given), used = new Set();
  let n = 0, steps = 0;
  // each word's choices, going by its letters already up (its empty squares all different letters)
  const live = slots.map(s => idx.byLen[s.length].filter(w => {
    let seen = 0;
    for (let i = 0; i < s.length; i++) {
      const h = at.get(s[i]);
      if (h) { if (h !== w[i]) return false; }
      else { const b = 1 << (w.charCodeAt(i) - 97); if (seen & b) return false; seen |= b; }
    }
    return true;
  }));
  const fits = (s, w) => { for (let i = 0; i < s.length; i++) { const h = at.get(s[i]); if (h ? h !== w[i] : used.has(w[i])) return false; } return true; };
  const go = () => {
    if (++steps > budget) { n = cap; return; }
    // the word with fewest choices left
    let best = -1, bestC = null;
    for (let j = 0; j < slots.length; j++) {
      if (slots[j].every(k => at.has(k))) continue;
      const c = live[j].filter(w => fits(slots[j], w));
      if (best < 0 || c.length < bestC.length) { best = j; bestC = c; if (!c.length) return; }
    }
    if (best < 0) { n++; if (found) found.push(new Map(open.map(k => [k, at.get(k)]))); return; }
    const s = slots[best];
    for (const w of bestC) {
      const put = [];
      for (let i = 0; i < s.length; i++) if (!at.has(s[i])) { at.set(s[i], w[i]); used.add(w[i]); put.push(s[i]); }
      go();
      for (const k of put) { used.delete(at.get(k)); at.delete(k); }
      if (n >= cap) return;
    }
  };
  go();
  return n;
}
// A fridge for a level: req is {level, words (the word list)}. Grows grids until one has a number of squares in
// the level's range, then picks which square of each letter is empty; while there's another way to fill them,
// moves one of the letters that way puts somewhere else. Returns {level, g (100 letters, "." for a black
// square), open (the empty squares)} or null.
function makeFridge(req) {
  // [fewest squares, most squares, how often an empty square is where two words cross]
  const LEVELS = [null, [60, 100, .9], [55, 59, .6], [0, 54, .3]];
  const N = 10, [lo, hi, crossing] = LEVELS[req.level], idx = wordIndex(req.words);
  let g = null, sq = null;
  for (let t = 0; t < 30 && !g; t++) {
    g = growGrid(idx, N);
    if (g) sq = new Map(g.map((ch, k) => [k, ch]).filter(([, ch]) => ch));
    if (g && (sq.size < lo || sq.size > hi)) g = null;
  }
  if (!g) return null;
  const slots = gridSlots(g, N), cross = new Map();
  slots.forEach(s => s.forEach(k => cross.set(k, (cross.get(k) || 0) + 1)));
  const by = {};
  for (const [k, ch] of sq) (by[ch] = by[ch] || []).push(k);
  const pick = ch => {
    const ks = by[ch], two = ks.filter(k => cross.get(k) > 1), one = ks.filter(k => cross.get(k) === 1);
    const from = Math.random() < crossing ? (two.length ? two : ks) : (one.length ? one : ks);
    return from[Math.floor(Math.random() * from.length)];
  };
  const at = {};
  for (const ch in by) at[ch] = pick(ch);
  for (let t = 0; t < 25; t++) {
    const open = Object.values(at), openSet = new Set(open), given = [...sq].filter(([k]) => !openSet.has(k)), found = [];
    if (countFills(idx, slots, given, open, 2, 20000, found) === 1) {
      // one answer: keep it if it takes the level's amount of thinking
      const {n, stuck} = solveSteps(idx, slots, sq, open), work = n[2] + 4 * n[3] + (stuck ? 20 : 0);
      if (work > [0, 10, 13, 99][req.level] || work < [0, 0, 11, 14][req.level]) return null;
      return {level: req.level, g: g.map(ch => ch || ".").join(""), open: open.sort((a, b) => a - b)};
    }
    const alt = found.find(f => [...f].some(([k, ch]) => sq.get(k) !== ch));
    const movable = (alt ? [...alt].filter(([k, ch]) => sq.get(k) !== ch).map(([k]) => sq.get(k)) : Object.keys(at)).filter(ch => by[ch].length > 1);
    if (!movable.length) return null;
    const ch = movable[Math.floor(Math.random() * movable.length)], others = by[ch].filter(k => k !== at[ch]);
    at[ch] = others[Math.floor(Math.random() * others.length)];
  }
  return null;
}

// The next letter a person could place by reasoning, with the letters `known` so far (square → letter, including
// those already up) and `open` the 26 empty squares, using steps up to `most`. Returns [square, letter, step] or
// null. Steps: 1, a word with one gap that only one letter on the floor fills; 2, a word with more gaps that leaves
// only one letter for one of them, or the words across and down through a square that together leave only one;
// 3, a letter on the floor that can only go in one square.
function deduce(idx, slots, known, open, most) {
  const used = new Set(open.filter(k => known.has(k)).map(k => known.get(k))), may = new Map();
  let two = null;
  for (const s of slots) {
    const gaps = s.filter(k => !known.has(k)).length;
    if (!gaps || (most === 1 && gaps > 1)) continue;
    const sets = s.map(() => new Set());
    for (const w of idx.byLen[s.length]) {
      let ok = true, seen = 0;
      for (let i = 0; i < s.length && ok; i++) {
        const h = known.get(s[i]);
        if (h) ok = h === w[i];
        else { const b = 1 << (w.charCodeAt(i) - 97); ok = !used.has(w[i]) && !(seen & b); seen |= b; }
      }
      if (ok) for (let i = 0; i < s.length; i++) sets[i].add(w[i]);
    }
    for (let i = 0; i < s.length; i++) {
      const k = s[i];
      if (known.has(k)) continue;
      if (sets[i].size === 1) { if (gaps === 1) return [k, [...sets[i]][0], 1]; if (!two) two = [k, [...sets[i]][0], 2]; }
      may.set(k, may.has(k) ? new Set([...may.get(k)].filter(ch => sets[i].has(ch))) : sets[i]);
    }
  }
  if (most < 2) return null;
  if (two) return two;
  for (const [k, set] of may) if (set.size === 1) return [k, [...set][0], 2];
  if (most < 3) return null;
  for (const ch of "abcdefghijklmnopqrstuvwxyz") {
    if (used.has(ch)) continue;
    const where = [...may].filter(([, set]) => set.has(ch));
    if (where.length === 1) return [where[0][0], ch, 3];
  }
  return null;

// How a person would get on solving a fridge, always taking the easiest step there is: how many letters took

function solveSteps(idx, slots, sq, open) {
  const openSet = new Set(open), known = new Map([...sq].filter(([k]) => !openSet.has(k))), n = [0, 0, 0, 0];
  while (known.size < sq.size) {

    n[step[2]]++;

/* ---------- game state ---------- */
// game: {level, g (the answer: 100 letters, "." for a black square), open (the 26 squares to fill), put ({square: letter} for the letters you've put up),
//        history (put before each change, for Undo), checked (put at the last Audit), won, hinted, undid…}
// sel: the square picked (or -1), dir: 0 across or 1 down, for the word it's in; held: a letter picked up
// from the floor with no square picked.
const STORE = "catdoku.magnets.v1", MAX_LEVEL = 3, N = 10, NS = "http://www.w3.org/2000/svg", CS = 54, PADL = 50, PAD = 24;
const ABC = "abcdefghijklmnopqrstuvwxyz";
// The magnets' colours: sage green for the letters that start on the fridge, pacific blue for the 26 on the floor (wherever they
// go), and after an Audit, sage green (the same as the starting letters) for one of yours in the right square and orange-coral for one in the wrong square. No outlines, just a soft shadow.
const GIVEN = "#6AA673", LOOSE = "#73A7AE", RIGHT = "#6AA673", WRONG = "#E16A4A";
// a letter's tilt lying on the floor
const tilt = ch => [-9, 6, -4, 10, -7, 3, 8, -5, 0][ABC.indexOf(ch) % 9];
const $ = G.$;
let state = G.load(STORE);
let settings = Object.assign({level: 1}, state.settings);
let game = state.game || null, sel = -1, dir = 0, held = null, W = null, IDX = null, F = null;
const save = () => G.save(STORE, {settings, game});
const playing = () => game && !game.won && !running && !$("overlay").classList.contains("show");
let running = false;
const levelName = n => `Level ${n} · ${"★".repeat(n)}`;
const catSrc = f => (window.CAT_SRC || {})[f] || `../cats/${f}.webp`;
const el = (t, a, parent) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (parent) parent.append(e); return e; };

// What a fridge's answer makes: F = {sol (square → letter), slots (each word's squares), d (each word's way: 0
// across, 1 down), of (square → its words), open (the empty squares, as a set)}.
function derive() {
  const g = [...game.g].map(ch => ch === "." ? "" : ch), slots = gridSlots(g, N), of = new Map();
  slots.forEach((s, i) => s.forEach(k => { if (!of.has(k)) of.set(k, []); of.get(k).push(i); }));
  F = {sol: new Map(g.map((ch, k) => [k, ch]).filter(([, ch]) => ch)), slots, d: slots.map(s => s[1] - s[0] === 1 ? 0 : 1), of, open: new Set(game.open)};
}
const letterAt = k => F.open.has(k) ? game.put[k] || "" : F.sol.get(k) || "";
// A square's magnet colour: a letter you've put up keeps its Audit colour while it stays on the square it was audited on.
const magColour = k => !F.open.has(k) ? GIVEN : game.checked && game.checked[k] === game.put[k] ? (game.put[k] === F.sol.get(k) ? RIGHT : WRONG) : LOOSE;
const upLetters = () => new Set(Object.values(game.put));
const empties = () => game.open.filter(k => !game.put[k]);
// A fridge that came from a share link or a save: every line of two or more squares a word that counts, and 26
// empty squares, one of each letter.
function validGrid(f) {
  if (typeof f.g !== "string" || !/^[a-z.]{100}$/.test(f.g)) return false;
  const g = [...f.g].map(ch => ch === "." ? "" : ch);
  if (!gridSlots(g, N).every(s => IDX.all.has(s.map(k => g[k]).join("")))) return false;
  return Array.isArray(f.open) && f.open.length === 26 && f.open.every(k => g[k]) && new Set(f.open.map(k => g[k])).size === 26;
}

/* ---------- drawing ---------- */
// The fridge door with its handle, and on it a crossword board: black squares, and a white one for every letter,
// with the magnets on them.
function draw() {
  const svg = $("svg"), vw = PADL + PAD + N * CS, vh = 2 * PAD + N * CS;
  svg.setAttribute("viewBox", `0 0 ${vw} ${vh}`);
  svg.innerHTML = "";
  el("rect", {class: "door", x: 2, y: 2, width: vw - 4, height: vh - 4, rx: 18}, svg);
  el("rect", {class: "handle", x: 14, y: vh * .2, width: 13, height: vh * .6, rx: 6.5}, svg);
  el("rect", {class: "backing", x: PADL - 3, y: PAD - 3, width: N * CS + 6, height: N * CS + 6, rx: 6}, svg);
  const word = sel >= 0 ? wordAt(sel, dir) : null, bad = new Set(badWords().flat());
  for (const k of F.sol.keys()) {
    const r = Math.floor(k / N), c = k % N, x = PADL + c * CS, y = PAD + r * CS, ch = letterAt(k);
    const g = el("g", {"data-k": k}, svg);
    let cls = "slot";
    if (F.open.has(k) && ch) cls += " mine";
    if (word && word.includes(k) && F.open.has(k)) cls += " word";
    if (k === sel) cls += " sel";
    if (bad.has(k) && empties().length === 0) cls += " bad";
    el("rect", {class: cls, x: x + 1.5, y: y + 1.5, width: CS - 3, height: CS - 3, rx: 3}, g);
    if (ch) el("text", {class: "mag", x: x + CS / 2, y: y + CS / 2 + 1, fill: magColour(k), transform: `rotate(${tilt(ch) / 3} ${x + CS / 2} ${y + CS / 2})`}, g).textContent = ch;
  }
  for (const k of guesses.list()) if (game.put[k]) el("rect", {class: "guess", x: PADL + k % N * CS + 4, y: PAD + Math.floor(k / N) * CS + 4, width: CS - 8, height: CS - 8, rx: 10}, svg);
  const mark = hints.current();
  if (mark) for (const [k, b] of mark.sq) {
    const r = Math.floor(k / N), c = k % N;
    el("rect", {class: "hintsq" + (b ? " bad" : ""), x: PADL + c * CS, y: PAD + r * CS, width: CS, height: CS, rx: 10}, svg);
  }
  drawFloor();
  update();
}
// The floor: the 26 letters in order, those still down bright and tilted, those up just an outline.
function drawFloor() {
  const fl = $("floor"), up = upLetters();
  if (!fl.children.length) {
    for (const ch of ABC) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = ch; b.dataset.l = ch;
      b.style.setProperty("--c", LOOSE); b.style.setProperty("--r", tilt(ch) + "deg");
      fl.append(b);
    }
    const bat = new Image(); bat.src = catSrc("crunch-7"); bat.alt = "Crunch batting at the letters"; bat.id = "bat";
    const nap = new Image(); nap.src = catSrc("crunch-4"); nap.alt = "Crunch curled up asleep"; nap.className = "nap";
    fl.append(bat, nap);
  }
  for (const b of fl.querySelectorAll("button")) {
    const ch = b.dataset.l, isUp = up.has(ch);
    b.classList.toggle("up", isUp); b.classList.toggle("held", held === ch);
    b.setAttribute("aria-label", isUp ? `${ch.toUpperCase()}, on the fridge` : ch.toUpperCase());
    b.classList.toggle("hinted", !!(hints.current() && hints.current().letter === ch));
  }
  fl.classList.toggle("won", !!game.won);
}
function update() {
  const left = empties().length;
  $("count").textContent = game.won ? "Every letter's back up!" : `${left} letter${left === 1 ? "" : "s"} to put back`;
  $("undoBtn").disabled = !game.history.length || game.won;
  guesses.sync();
  $("restartBtn").disabled = !Object.keys(game.put).length || game.won;
  $("hintBtn").disabled = game.won;
  $("auditBtn").disabled = game.won;
}
// The squares of the word through square k going way d (or the other way, if there's no word that way).
function wordAt(k, d) {
  const ids = F.of.get(k) || [], pick = ids.find(i => F.d[i] === d);
  return F.slots[pick !== undefined ? pick : ids[0]];
}
// Full words that don't count, as lists of squares.
function badWords() {
  return F.slots.filter(s => s.every(k => letterAt(k)) && !IDX.all.has(s.map(letterAt).join("")));
}

/* ---------- playing ---------- */
// Put letter ch on square k: any letter there goes back on the floor, and if ch was up somewhere else of yours,
// it moves. Then the next empty square in the word gets picked.
function place(ch, k) {
  if (!playing() || !F.open.has(k)) return;
  if (game.put[k] === ch) { sel = k; held = null; draw(); return; }
  guesses.before(k);
  game.history.push({...game.put});
  for (const q in game.put) if (game.put[q] === ch) delete game.put[q];
  game.put[k] = ch; game.started = true; held = null;
  sel = nextEmpty(k);
  if (sel >= 0 && !wordAt(k, dir).includes(sel)) dir = (F.of.get(sel) || []).length === 1 ? F.d[F.of.get(sel)[0]] : dir;
  afterMove();
}
function takeDown(k) {
  if (!playing() || !game.put[k]) return;
  game.history.push({...game.put});
  delete game.put[k]; game.started = true; sel = k;
  afterMove();
}
function afterMove() {
  save();
  if (!empties().length) {
    const bad = badWords();
    if (!bad.length) { draw(); return win(); }
    const names = bad.map(s => s.map(letterAt).join("").toUpperCase());
    G.note(`Every letter's up, but ${names.slice(0, 2).join(" and ")} ${names.length > 1 ? "aren't words" : "isn't a word"}.`, 5000);
  }
  draw();
}
// After filling k: the next empty square in its word (after it, then before), then the next empty one anywhere.
function nextEmpty(k) {
  const s = wordAt(k, dir), i = s.indexOf(k);
  for (const q of s.slice(i + 1).concat(s.slice(0, i))) if (F.open.has(q) && !game.put[q]) return q;
  const e = empties();
  return e.find(q => q > k) !== undefined ? e.find(q => q > k) : e.length ? e[0] : -1;
}
function shake(why) {
  G.note(why, 3000);
  const b = $("board"); b.classList.remove("shake"); b.getBoundingClientRect(); b.classList.add("shake");
}
// Pick square k (as a hint does), keeping to across or down if there's a word that way through it.
function pickSquare(k) {
  sel = k; held = null;
  const ids = F.of.get(k) || [];
  if (ids.length && !ids.some(i => F.d[i] === dir)) dir = F.d[ids[0]];
}
// Tap a square to pick it (tap again to turn to the other word through it, or, if it has your letter, to take
// the letter down); with a letter picked up from the floor, a tap puts it there.
function tapSquare(k) {
  if (!playing() || !F.open.has(k)) return;
  game.started = true;
  if (held) return place(held, k);
  if (sel === k) {
    if (game.put[k]) return takeDown(k);
    if ((F.of.get(k) || []).length > 1) dir = 1 - dir;
  } else {
    sel = k;
    const ids = F.of.get(k) || [];
    if (!ids.some(i => F.d[i] === dir)) dir = F.d[ids[0]];
  }
  draw();
}
// Tap a letter on the floor: it goes on the picked square, or, with none picked, it's picked up (tap it again to
// put it back down).
function tapLetter(ch) {
  if (!playing()) return;
  game.started = true;
  if (upLetters().has(ch)) return G.note(`You've put the ${ch.toUpperCase()} up already. Drag it, or tap it twice, to take it down.`, 3500);
  if (sel >= 0) return place(ch, sel);
  held = held === ch ? null : ch;
  if (held) G.note(`Now tap a square for the ${ch.toUpperCase()}.`, 2500);

}

// Dragging: a letter from the floor to a square, or one of yours from square to square, or off the fridge to
// take it down. A press that doesn't move is a tap.
let drag = null;
function squareAt(x, y) {
  const t = document.elementFromPoint(x, y), g = t && t.closest("[data-k]");
  return g ? +g.dataset.k : -1;
}
$("board").addEventListener("pointerdown", e => {
  if (!playing() || e.button > 0) return;
  const b = e.target.closest(".floor button"), g = e.target.closest("[data-k]");
  if (b) drag = {ch: b.dataset.l, from: -1, x: e.clientX, y: e.clientY, up: upLetters().has(b.dataset.l)};
  else if (g) { const k = +g.dataset.k; drag = {ch: game.put[k] || null, from: k, x: e.clientX, y: e.clientY}; }
  else return;
  e.preventDefault();
});
window.addEventListener("pointermove", e => {
  if (!drag || !drag.ch || drag.up) return;
  if (!drag.ghost && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
  if (!drag.ghost) {
    drag.ghost = document.createElement("div"); drag.ghost.className = "dragmag"; drag.ghost.textContent = drag.ch;
    drag.ghost.style.setProperty("--c", LOOSE); document.body.append(drag.ghost);
  }
  drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
});
window.addEventListener("pointerup", e => {
  const d = drag; drag = null;
  if (!d) return;
  if (!d.ghost) { if (d.from >= 0) tapSquare(d.from); else tapLetter(d.ch); return; }
  d.ghost.remove();
  if (!playing()) return;
  const k = squareAt(e.clientX, e.clientY);
  if (k >= 0 && F.open.has(k)) { held = null; place(d.ch, k); }

window.addEventListener("pointercancel", () => { if (drag && drag.ghost) drag.ghost.remove(); drag = null; });

// Keys: a letter goes on the picked square (or the first empty one), Backspace takes one down, arrows move
// between squares, Space turns to the other word.
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) { if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z" && playing()) { e.preventDefault(); undo(); } return; }
  if (!playing() || document.querySelector(".spot") || /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  const k = e.key;
  if (/^[a-z]$/i.test(k)) {
    e.preventDefault(); game.started = true;
    if (sel < 0) sel = empties()[0] !== undefined ? empties()[0] : game.open[0];
    place(k.toLowerCase(), sel);
  } else if (k === "Backspace" || k === "Delete") {
    e.preventDefault();
    if (sel < 0) return;
    if (game.put[sel]) return takeDown(sel);
    const s = wordAt(sel, dir), mine = s.slice(0, s.indexOf(sel)).reverse().find(q => F.open.has(q));
    if (mine !== undefined) { sel = mine; if (game.put[mine]) takeDown(mine); else draw(); }
  } else if (k === " ") {
    e.preventDefault(); if (sel >= 0 && (F.of.get(sel) || []).length > 1) { dir = 1 - dir; draw(); }
  } else if (k.startsWith("Arrow")) {
    e.preventDefault(); game.started = true;
    const [dr, dc] = {ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1]}[k];
    if (sel < 0) { sel = game.open[0]; draw(); return; }
    let r = Math.floor(sel / N), c = sel % N;
    while (true) {

// Undo takes back the last letter put up, taken down or moved (or a Restart).
function undo() {
  if (!playing() || !game.history.length) return;
  game.undid = true; game.put = game.history.pop(); held = null;
  draw(); save();
}
$("undoBtn").onclick = undo;
$("restartBtn").onclick = () => {
  if (!playing() || !Object.keys(game.put).length) return;
  game.undid = true; game.history.push({...game.put}); game.put = {}; sel = -1; held = null; guesses.clear();
  draw(); save();

};
// Hint: a letter in the wrong square gets a red box, to take down; otherwise a gold box goes on the empty square
// the easiest step next (or the square in the most-filled word), saying why the first time, and asked again which
// letter goes there, with that letter on the floor lit up too.
const hints = G.hinter({game: () => game, key: () => game ? JSON.stringify(game.put) : "", draw: () => draw()});   // marks {sq: [[square, bad]…], letter}
const guesses = G.guesser({game: () => game, undo, draw: () => { draw(); save(); }, board: $("board"), what: "letter"});
$("hintBtn").onclick = () => {
  if (!playing()) return;
  game.hinted = true; game.started = true; save();
  const wrong = game.open.filter(k => game.put[k] && game.put[k] !== F.sol.get(k));
  if (wrong.length) {
    pickSquare(wrong[0]);
    hints.show({sq: [[wrong[0], true]]}, `The ${game.put[wrong[0]].toUpperCase()} doesn't go there${wrong.length > 1 ? ` (and ${wrong.length - 1} more)` : ""}. Take it down and try another letter.`);
  } else {
    // the easiest step a person could take next (or, if there isn't one, the square in the fullest word)
    const known = new Map([...F.sol].filter(([k]) => !F.open.has(k) || game.put[k]));
    const step = deduce(IDX, F.slots, known, game.open, 1) || deduce(IDX, F.slots, known, game.open, 3);
    const filled = s => s.filter(q => letterAt(q)).length / s.length;
    const score = k => Math.max(...F.of.get(k).map(i => filled(F.slots[i])));
    const k = step ? step[0] : empties().reduce((a, b) => score(b) > score(a) ? b : a), ch = F.sol.get(k);
    pickSquare(k);
    const why = !step ? "" : step[2] === 1 ? ": it's the only letter left that makes a word there" : step[2] === 2 ? ": it's the only letter left that fits the words there" : `: it can't go anywhere else`;
    if (!hints.level()) hints.show({sq: [[k, false]]}, !step ? "The gold square is in the fullest word." : step[2] === 3 ? "One letter on the floor can only go in the gold square. Which one?"
      : `Only one letter left on the floor ${step[2] === 1 ? "makes a word" : "fits the words"} in the gold square.`);
    else hints.show({sq: [[k, false]], letter: ch}, `The ${ch.toUpperCase()} goes in the gold square${why}.`);
  }
};

// Audit: every letter you've put up turns olive if it's in the right square and coral if not, and stays that colour
// until it's moved (the wrong ones get a red box too, or the message line says they're all right).
$("auditBtn").onclick = () => {
  if (!playing()) return;
  if (!Object.keys(game.put).length) return G.note("Put some letters up first, then Audit checks them.", 3500);
  game.audited = true; game.started = true; game.checked = {...game.put}; save(); draw();
  const wrong = game.open.filter(k => game.put[k] && game.put[k] !== F.sol.get(k));
  if (!wrong.length) { hints.clear(); return G.note("Every letter you've put up is in the right square.", 5000); }
  hints.show({sq: wrong.map(k => [k, true])}, `${wrong.length} letter${wrong.length > 1 ? "s are" : " is"} in the wrong square. Take ${wrong.length > 1 ? "them" : "it"} down and try again.`, {uncounted: true});

/* ---------- endings ---------- */
// The magnets jiggle, Crunch curls up on the empty floor, and the card comes up.
function win() {
  game.won = true; G.finishClock(game); hints.clear(false); sel = -1; held = null;
  const next = game.hinted || game.audited ? game.level : Math.min(MAX_LEVEL, game.level + 1);
  settings.level = next; $("levelSel").value = next; save();
  draw();
  $("board").classList.add("won");
  G.track(`Fridge Magnets solved level ${game.level}`);
  wrapped.prefetch(next);
  running = true;
  const g = game;
  setTimeout(() => { running = false; $("board").classList.remove("won"); if (game === g) finishCard(); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 500 : 1300);
}
function finishCard() {
  const next = settings.level, gold = !game.undid && !game.hinted && !game.audited;
  let text = `All 26 letters back on the fridge, in ${F.slots.length} words.`;
  text += game.hinted || game.audited ? ` You had ${game.hinted ? "a hint" : "an audit"}, so here's another at level ${next}.` : game.level === MAX_LEVEL ? " That's the hardest level; here's another." : ` Next up: level ${next}.`;
  // a gold paw: Crunch rolling about, in place of the random cat photo
  const pic = new Image(); pic.className = "rollpic"; pic.src = catSrc("crunch-6"); pic.alt = "Crunch rolling about on a green mat";
  G.winCard(text, () => { G.closeCard(); startLevel(next); }, "Admire my fridge", game.result,
    {title: "Back on the fridge!", goldTitle: "Gold paw, Crunch!", gold, goldWhy: "No hints, audits or undos!", goldPic: [pic], next: next > game.level ? `Next: level ${next}` : "Next board",
     after: G.otherSize($("levelSel"), next, startLevel, "Or play a different level:")});
}

/* ---------- new fridges ---------- */
const fridges = G.builder([wordIndex, growGrid, gridSlots, countFills, deduce, solveSteps, makeFridge], "makeFridge");
// The builder is asked with the same object for a level each time, so a fridge made in advance is found again.
const REQ = {}, req = n => REQ[n] = REQ[n] || {level: n, words: W};
const wrapped = {take: n => fridges.take(req(n)), prefetch: n => fridges.prefetch(req(n))};
function startLevel(n) { settings.level = n; $("levelSel").value = n; save(); newPuzzle(); }
function begin(p, level) {
  game = {level, g: p.g, open: p.open, put: {}, history: [], won: false, hinted: false, undid: false, ...G.freshClock()};
  sel = -1; held = null; hints.clear(false); derive();
}
let asking = 0;
function newPuzzle() {
  G.closeCard();
  const n = settings.level, ask = ++asking;
  const slow = setTimeout(() => { if (ask === asking) G.note("Crunch is knocking the letters off…", 0); }, 400);
  return wrapped.take(n).then(p => {
    clearTimeout(slow);
    if (ask !== asking) return;
    G.note("");
    begin(p, n); draw(); save();
    wrapped.prefetch(n);
    G.track(`Fridge Magnets new puzzle level ${n}`);
    helpOnFirstVisit();
  });
}

/* ---------- sharing ---------- */
// A fridge travels as its answer (100 letters, "." for a black square) and the squares to fill; progress as the
// letter on each of those squares ("-" for empty).
$("linkBtn").onclick = () => { if (game) G.shareCard({name: "Fridge Magnets", won: game.won,
  puzzle: () => ({g: "magnets", N: game.level, b: game.g, o: game.open.join(".")}),
  progress: () => game.open.map(k => game.put[k] || "-").join("")}); };
function openShared(d) {
  const fail = () => G.note("That share link didn't work.", 5000);
  if (!(d.N >= 1 && d.N <= MAX_LEVEL) || typeof d.o !== "string") return fail();
  const p = {g: d.b, open: d.o.split(".").map(Number)};
  if (!validGrid(p)) return fail();
  p.open.sort((a, b) => a - b);
  begin(p, d.N);
  if (typeof d.p === "string" && d.p.length === p.open.length) {
    const put = {}, seen = new Set();
    let ok = true;
    [...d.p].forEach((ch, i) => { if (ch === "-") return; if (!/[a-z]/.test(ch) || seen.has(ch)) ok = false; seen.add(ch); put[p.open[i]] = ch; });
    if (ok && Object.keys(put).length) { game.put = put; game.timed = false; }
  }
  settings.level = d.N; $("levelSel").value = d.N;
  draw(); save();
}

/* ---------- how to play ---------- */
function showHelp() {
  if (game && game.won) return G.helpLater();
  settings.seenHelp = false; helpOnFirstVisit();
}
// The fridge's squares, in page pixels.
function map() {
  // the drawing is scaled to fit the svg's box (narrower than it, and centred, when the box's height is capped)
  const r = $("svg").getBoundingClientRect(), vb = $("svg").viewBox.baseVal, k = Math.min(r.width / vb.width, r.height / vb.height);
  const left = r.left + (r.width - vb.width * k) / 2, top = r.top + (r.height - vb.height * k) / 2;
  return {ox: left + PADL * k, oy: top + (PAD) * k, cw: CS * k, ch: CS * k};
}
function helpOnFirstVisit() {
  if (!game || !playing() || document.querySelector(".spot") || settings.seenHelp) return;
  const xy = k => [k % N, Math.floor(k / N)], all = [...F.sol.keys()].map(xy);
  // the word with most squares to fill, and an empty square in it
  const word = F.slots.reduce((a, b) => b.filter(k => F.open.has(k)).length > a.filter(k => F.open.has(k)).length ? b : a);
  const gap = word.find(k => !game.put[k] && F.open.has(k)) !== undefined ? word.find(k => !game.put[k] && F.open.has(k)) : empties()[0];
  const steps = [
    {say: "The letters fell off the fridge", lit: all, outline: []},
    {say: "Put back A to Z, once each", els: [$("floor")]},
    {say: "Every line spells a word", lit: word.map(xy), tone: "ok"},
  ];
  // Your turn: put a letter up on the real fridge (G.yourTurn takes it down again afterwards)
  const turn = G.yourTurn(() => game, g => { game = g; }, () => { sel = -1; draw(); });
  if (gap !== undefined) steps.push({say: "Tap this square", lit: [xy(gap)], try: {done: () => sel === gap}, ...turn.from},
    {say: "Now tap a letter", els: [$("floor")], try: {done: () => !!game.put[gap], yes: "Or drag letters up"}, ...turn.upTo});
  steps.push(
    {say: "Drag off or tap twice to remove", lit: game.open.map(xy), outline: [], later: true},
    {say: "Audit marks wrong letters", els: [$("auditBtn")]},
    {say: "Not sure? Bookmark, then try an idea. Back to bookmark undoes it", els: [$("guessBtn")]},
    {say: "Stuck? Hint places a letter", els: [$("hintBtn")]},
  );
  G.spotlight({grid: $("grid"), w: N, h: N, steps, map, done: () => { settings.seenHelp = true; save(); }});
}

/* ---------- start ---------- */
for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(levelName(n).replace("Level ", ""), n));
$("levelSel").onchange = e => { G.closeCard(); startLevel(+e.target.value); };
$("newBtn").onclick = () => { G.closeCard(); newPuzzle(); };
$("helpBtn").onclick = showHelp;
$("crunch").src = catSrc("crunch-5");

G.nav("magnets");
G.checkClock(game);
G.setupTimer({name: "magnets", game: () => game, playing: g => !g.won, save, label: levelName, noun: "level"});
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : settings.level);
if (!(settings.level >= 1 && settings.level <= MAX_LEVEL)) settings.level = 1;
$("levelSel").value = settings.level;

G.note("Fetching the words…", 0);
(window.WORDS_INLINE ? Promise.resolve(window.WORDS_INLINE) : fetch(`words.json?v=${window.SITE_BUILD || ""}`).then(r => { if (!r.ok) throw new Error("couldn't load the word list"); return r.json(); }))
  .catch(e => { G.note(`The word list didn't load (${e.message}). Check your connection and reload.`, 0); throw e; }).then(w => {
  W = w; IDX = wordIndex(w);
  G.note("");
  const shared = G.readShare("magnets");
  const hadSave = !!(game);
  if (hadSave) G.reopen(() => {
      if (!(game.level >= 1 && game.level <= MAX_LEVEL) || !validGrid(game) || typeof game.put !== "object" || !Array.isArray(game.history)) throw new Error("the saved fridge doesn't fit its level");
      derive(); draw();
      if (game.won) finishCard(); else helpOnFirstVisit();
    }, why => { game = null; newPuzzle(); G.note(why, 0); });
  else if (!shared) newPuzzle();
  const shareOpts = () => ({name: "Fridge Magnets", inProgress: !!(game && !game.won && Object.keys(game.put).length), open: openShared, after: helpOnFirstVisit});
  // a link that doesn't work, opened with no saved puzzle, would leave the board empty: start one
  if (shared) G.offerShare(shared, {...shareOpts(), fresh: hadSave ? null : why => Promise.resolve(newPuzzle()).then(() => { G.note(why, 6000); })});
  window.addEventListener("hashchange", () => { const d = G.readShare("magnets"); if (d) G.offerShare(d, shareOpts()); });
});
</script>
