.wall{--gilt:#ECA818;--gilt-dark:#9A6A0C;--gilt-light:#F6D27A;

  border-radius:12px;padding:30px 12px 14px}
/* the picture light over the frame */
.lamp{position:absolute;top:8px;left:50%;width:96px;height:14px;margin-left:-48px;border-radius:7px 7px 10px 10px;
  background:linear-gradient(#F6D27A,#9A6A0C);border:2px solid #2A2530;z-index:2}
.lamp::before{content:"";position:absolute;left:44px;top:-8px;width:4px;height:8px;background:#2A2530}
.frame{position:relative;padding:9px;border-radius:4px;

  box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 0 0 2px #2A2530}

.layer svg{pointer-events:none}

.miss circle{fill:rgba(255,255,255,.55);stroke:#C8392B;vector-effect:non-scaling-stroke}

.found.away{stroke:#C8392B}
.view.zoomed{cursor:grab}

<script>
/* ---------- levels ---------- */
// How big the cat is (the side of a square of the same area, as a share of the painting's), and how far it takes on
// the colours, light and brushwork of the spot it's hiding in (0 keeps its own colours). Level 1 is a very easy one,
// a big cat that's hardly hidden; the rest get smaller and better hidden.
const LEVELS = [null,
  {size: .15, blend: .35},
  {size: .09, blend: .55},
  {size: .075, blend: .6},
  {size: .062, blend: .66},
  {size: .052, blend: .7},
  {size: .043, blend: .75},

const TOP = LEVELS.length - 1;
const levelLabel = n => `Level ${n}`;

/* ---------- the cats ---------- */

// sitting, standing or crouching, with the face and ears showing, in every colour. Curled-up balls, backs and cats
// stretched flat turn into blobs.
const CATS = ("c17-2 c17-3 c17-5 c17-7 c17-8 c17-13 c17-19 c17-24 c18-2 c18-3 c18-6 c18-7 c18-8 c18-9 c18-11 c18-14 c18-15 c18-17 c18-18 c18-19 c18-20 c18-21 c18-24 " +
  "c18-25 c18-26 c18-27 c18-28 c18-29 c18-32 c18-33 c18-34 c18-36 c18-39 c18-40 c18-42 c18-43 c18-46 c18-47 c19-1 c19-2 c19-3 c19-5 c19-6 c19-7 c19-10 " +
  "c19-11 c19-12 c19-14 c19-15 c19-16 c19-17 c19-18 c19-19 c19-20 c19-23 c19-24 c19-25 c19-26 c19-28 c19-29 c19-30 c19-32 c19-34 c19-35 c19-37 c19-39 " +
  "c19-40 c19-44 c19-45 c19-46 c20-1 c20-9 c20-10 c20-16 c20-17 c20-18 c20-20 c20-30").split(" ");
const CAT_SRC = {}, ART_SRC = {};   // filled with embedded pictures when the page is bundled into one file
// The gallery: paintings fetched from Wikimedia Commons as they're played (COMMONS, commons.js), and the paintings
// saved here (PAINTINGS, paintings.js), which are also where the game falls back to when Commons can't be reached.
const COMMONS_LIST = typeof COMMONS === "undefined" ? [] : COMMONS, GALLERY = COMMONS_LIST.concat(PAINTINGS);

const artSrc = id => { const p = paintingOf(id); return ART_SRC[id] || (p && p.src) || `art/${id}.webp`; };
const loaded = {};
// A picture, once loaded. One from another site (Commons) is asked for with permission to read its pixels, which

/* ---------- sneaking the cat in ---------- */
// The cat's box once it's turned: width and height.
function turnedBox(w, h, r) {

}
// Many of the cat drawings have a white rim round them, like a sticker. Peel it off (up to 3 pixels of pale grey or
// white next to the transparent background), then fade the outermost pixels left, which fade from the rim into the
// outline, so the cat sits in the paint rather than on it.

function peel(im) {

  const w = im.naturalWidth, h = im.naturalHeight, c = canvasOf(w, h), x = c.getContext("2d");
  x.drawImage(im, 0, 0); const img = x.getImageData(0, 0, w, h), d = img.data;

      if (0.3 * r + 0.59 * g + 0.11 * b < 165 || Math.max(r, g, b) - Math.min(r, g, b) > 50) continue;
      const open = (xx, yy) => xx < 0 || yy < 0 || xx >= w || yy >= h || d[(yy * w + xx) * 4 + 3] < 40;
      if (open(x0 - 1, y) || open(x0 + 1, y) || open(x0, y - 1) || open(x0, y + 1)) clear.push(i);
    }
    if (!clear.length) break;

  for (let y = 0; y < h; y++) for (let x0 = 0; x0 < w; x0++) {
    const i = (y * w + x0) * 4; if (!d[i + 3]) continue;
    const open = (xx, yy) => xx < 0 || yy < 0 || xx >= w || yy >= h || d[(yy * w + xx) * 4 + 3] < 40;
    if (open(x0 - 1, y) || open(x0 + 1, y) || open(x0, y - 1) || open(x0, y + 1)) edge.push(i);

// The cat drawn on a canvas of its own, turned and flipped.
function catCanvas(im, pz) {
  const [bw, bh] = turnedBox(pz.w, pz.h, pz.r), c = canvasOf(bw, bh), x = c.getContext("2d");
  x.translate(bw / 2, bh / 2); x.rotate(pz.r * Math.PI / 180); x.scale(pz.f ? -1 : 1, 1);
  x.drawImage(peel(im), -pz.w / 2, -pz.h / 2, pz.w, pz.h);

// Average colour of a picture's opaque pixels, and how far its colours stray from that (a calico's patches stray a
// long way; a grey cat's hardly at all).
function catColour(im) {
  const k = 40 / Math.max(im.naturalWidth, im.naturalHeight), w = Math.max(1, Math.round(im.naturalWidth * k)), h = Math.max(1, Math.round(im.naturalHeight * k));
  const c = canvasOf(w, h), x = c.getContext("2d"); x.drawImage(im, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data; let n = 0, r = 0, g = 0, b = 0;
  for (let i = 0; i < d.length; i += 4) { const a = d[i + 3] / 255; n += a; r += d[i] * a; g += d[i + 1] * a; b += d[i + 2] * a; }
  r /= n; g /= n; b /= n; let v = 0;
  for (let i = 0; i < d.length; i += 4) v += ((d[i] - r) ** 2 + (d[i + 1] - g) ** 2 + (d[i + 2] - b) ** 2) * d[i + 3] / 255;
  return [r, g, b, Math.sqrt(v / n)];
}
// A new puzzle: a painting, then a dozen cats tried in it, each at its best spot from a few hundred tries (with a
// little luck mixed in), and the best of those. A busy spot hides any cat; a calm one (sky, a wall, a dress) only
// suits a cat of much the same colour.
async function makePuzzle(level, avoid) {
  // a painting not played lately; if one from Commons won't load, the saved paintings from then on this visit
  let p, art;
  for (let tries = 0; !art; tries++) {
    const ok = GALLERY.filter(q => !failed.has(q.id) && !(live(q) && failed.size && tries)), fresh = ok.filter(q => !avoid.includes(q.id));
    const pool = fresh.length ? fresh : ok.length ? ok : PAINTINGS;
    p = pool[Math.floor(Math.random() * pool.length)];
    try { art = await picture(artSrc(p.id)); }
    catch (e) { if (!live(p) || tries > 3) throw e; failed.add(p.id); G.track("Cat Burglar painting from Commons didn't load"); }
  }
  const tried = new Set();
  while (tried.size < 12) tried.add(CATS[Math.floor(Math.random() * CATS.length)]);
  const ims = await Promise.all([...tried].map(c => picture(catSrc(c)).catch(() => null)));
  const PW = art.naturalWidth, PH = art.naturalHeight;
  // the painting, small, with running sums for quick averages over any box
  const GW = 160, g = GW / PW, GH = Math.max(1, Math.round(PH * g)), sc = canvasOf(GW, GH), sx = sc.getContext("2d");
  sx.drawImage(art, 0, 0, GW, GH);
  const d = sx.getImageData(0, 0, GW, GH).data, S = [0, 1, 2, 3].map(() => new Float64Array((GW + 1) * (GH + 1)));
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const i = (y * GW + x) * 4, L = 0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2], v = [d[i], d[i + 1], d[i + 2], L * L], at = (y + 1) * (GW + 1) + x + 1;
    for (let k = 0; k < 4; k++) S[k][at] = v[k] + S[k][at - 1] + S[k][at - GW - 1] - S[k][at - GW - 2];
  }
  const sum = (k, x0, y0, x1, y1) => S[k][y1 * (GW + 1) + x1] - S[k][y0 * (GW + 1) + x1] - S[k][y1 * (GW + 1) + x0] + S[k][y0 * (GW + 1) + x0];

  const spreadIn = (x0, y0, x1, y1) => { const n = (x1 - x0) * (y1 - y0), L = (0.3 * sum(0, x0, y0, x1, y1) + 0.59 * sum(1, x0, y0, x1, y1) + 0.11 * sum(2, x0, y0, x1, y1)) / n; return Math.sqrt(Math.max(0, sum(3, x0, y0, x1, y1) / n - L * L)); };
  const margin = 0.04 * Math.min(PW, PH);

    const im = ims[j]; if (!im) return;
    const side = LEVELS[level].size * Math.sqrt(PW * PH) * (0.9 + Math.random() * 0.2), asp = im.naturalWidth / im.naturalHeight;
    const w = Math.round(side * Math.sqrt(asp)), h = Math.round(side / Math.sqrt(asp));
    const r = Math.round((Math.random() * 2 - 1) * 14), f = Math.random() < 0.5 ? 1 : 0, [bw, bh] = turnedBox(w, h, r), mc = catColour(im);
    for (let t = 0; t < 250; t++) {
      const cx = margin + bw / 2 + Math.random() * (PW - 2 * margin - bw), cy = margin + bh / 2 + Math.random() * (PH - 2 * margin - bh);
      const x0 = Math.max(0, Math.floor((cx - bw / 2) * g)), y0 = Math.max(0, Math.floor((cy - bh / 2) * g));
      const x1 = Math.min(GW, Math.max(x0 + 1, Math.ceil((cx + bw / 2) * g))), y1 = Math.min(GH, Math.max(y0 + 1, Math.ceil((cy + bh / 2) * g))), n = (x1 - x0) * (y1 - y0);
      const m = [0, 1, 2].map(k => sum(k, x0, y0, x1, y1) / n), spread = spreadIn(x0, y0, x1, y1);
      // how calm the calmest quarter of the spot is: a cat half on a roof and half in the sky counts as in the sky
      const xm = (x0 + x1) >> 1, ym = (y0 + y1) >> 1;
      const quiet = x1 - x0 > 1 && y1 - y0 > 1 ? Math.min(spreadIn(x0, y0, xm, ym), spreadIn(xm, y0, x1, ym), spreadIn(x0, ym, xm, y1), spreadIn(xm, ym, x1, y1)) : spread;
      // colour that doesn't match costs more the calmer the spot, so calm spots go only to cats of their colour
      // (and a cat of many colours, like a calico, doesn't suit a calm spot even if its colours average out to it)
      const off = Math.hypot(m[0] - mc[0], m[1] - mc[1], m[2] - mc[2]) + 0.8 * Math.max(0, mc[3] - 1.7 * spread);
      const score = off * (0.5 + 0.06 * Math.max(0, 30 - quiet)) - 0.3 * Math.min(spread, 80) + Math.random() * 20;
      if (!best || score < best.score) best = {score, c: cat, x: Math.round(cx), y: Math.round(cy), w, h, r, f};
    }
  });
  if (!best) throw new Error("couldn't load the cats");
  return {i: p.id, c: best.c, x: best.x, y: best.y, w: best.w, h: best.h, r: best.r, f: best.f};
}
// Blur one channel image (w × h floats) with a box of radius R, twice over (close to a soft Gaussian).
function blur(src, w, h, R) {
  let a = src, b = new Float32Array(w * h);

    }

// Paint the cat into the painting. Its colours are shifted toward the spot's (keeping its own light and dark),

function sneakIn(ctx, catIm, pz, strength) {

  const rw = bw + 2 * R, rh = bh + 2 * R, reg = ctx.getImageData(x0 - R, y0 - R, rw, rh), pd = reg.data;
  // the spot's soft light (blurred) for each channel
  const lo = [0, 1, 2].map(k => { const ch = new Float32Array(rw * rh); for (let i = 0; i < rw * rh; i++) ch[i] = pd[i * 4 + k]; return blur(ch, rw, rh, R); });

  const mc = [0, 0, 0], mp = [0, 0, 0], vc = [0, 0, 0], vp = [0, 0, 0]; let n = 0;
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
    const a = cd[(y * bw + x) * 4 + 3] / 255; if (!a) continue;
    const ci = (y * bw + x) * 4, pi = ((y + R) * rw + x + R) * 4; n += a;
    for (let k = 0; k < 3; k++) { mc[k] += cd[ci + k] * a; mp[k] += pd[pi + k] * a; }
  }
  for (let k = 0; k < 3; k++) { mc[k] /= n; mp[k] /= n; }

    const a = cd[(y * bw + x) * 4 + 3] / 255; if (!a) continue;
    const ci = (y * bw + x) * 4, pi = ((y + R) * rw + x + R) * 4;
    for (let k = 0; k < 3; k++) { vc[k] += (cd[ci + k] - mc[k]) ** 2 * a; vp[k] += (pd[pi + k] - mp[k]) ** 2 * a; }
  }

  // its light and dark move toward the painting's too, but it keeps at least half its own contrast, so it's never
  // just a blur of the painting

  const lum = (r, g, b) => 0.3 * r + 0.59 * g + 0.11 * b, meanLo = lum(...mp) || 1;
  // the parts that make it look like a cat (eyes, ears, outline, stripes) are where its brightness changes sharply;
  // those take on the painting only about half as much, so even a small, well-hidden cat is a cat once found
  const catL = new Float32Array(bw * bh); for (let i = 0; i < bw * bh; i++) catL[i] = lum(cd[i * 4], cd[i * 4 + 1], cd[i * 4 + 2]);
  const catSoft = blur(catL, bw, bh, 1);

  const chroma = (r, g, b) => Math.max(r, g, b) - Math.min(r, g, b);
  let catC = 0, artC = 0;
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
    const a = cd[(y * bw + x) * 4 + 3] / 255; if (!a) continue;
    const ci = (y * bw + x) * 4, pi = ((y + R) * rw + x + R) * 4;
    catC += chroma(cd[ci], cd[ci + 1], cd[ci + 2]) * a; artC += chroma(pd[pi], pd[pi + 1], pd[pi + 2]) * a;
  }
  // no part of the cat comes out much more colourful than the painting there (an orange patch on a calico, in an ink
  // painting, comes out a soft brown)
  const cap = artC / n * 1.5 + 12;
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
    const a = cd[(y * bw + x) * 4 + 3] / 255; if (!a) continue;
    const ci = (y * bw + x) * 4, j = (y + R) * rw + x + R, pi = j * 4;
    const blend = strength * (1 - 0.5 * Math.min(1, Math.abs(catL[y * bw + x] - catSoft[y * bw + x]) / 20));
    const shade = Math.min(1.6, Math.max(0.5, lum(lo[0][j], lo[1][j], lo[2][j]) / meanLo)), light = 1 + (shade - 1) * blend * 0.4;
    const out = [];
    for (let k = 0; k < 3; k++) {

      // outline next to a dark patch stays dark rather than turning into a pale ring
      const own = cd[ci + k], moved = (own - mc[k]) / sc[k] * st[k] + (mp[k] + lo[k][j]) / 2, brush = pd[pi + k] - lo[k][j];
      out.push((own * (1 - blend) + moved * blend) * light + brush * blend * 0.3);
    }
    const L = lum(...out), c = chroma(...out), mute = c > cap ? 1 + (cap / c - 1) * blend : 1;
    for (let k = 0; k < 3; k++) pd[pi + k] = Math.round(pd[pi + k] * (1 - a) + Math.min(255, Math.max(0, L + (out[k] - L) * mute)) * a);
  }

  const mask = new Uint8Array(bw * bh); for (let i = 0; i < bw * bh; i++) mask[i] = cd[i * 4 + 3] > 85 ? 1 : 0;
  return {x0, y0, bw, bh, mask};
}

/* ---------- game ---------- */
// A round is five paintings at one level, one after another. Each painting has its own hunt (`game`: three lives,
// misses, hints); the round keeps the score and the clock.
const STORE = "catdoku.catburglar.v1", ROUND = 5;
const $ = G.$;
let state = G.load(STORE);
let settings = Object.assign({level: 1, recent: []}, state.settings);
const MAX_LIVES = 9, livesUsed = () => game.livesUsed || 3;   // lives given out on this painting: 3, and 3 more a revive
let game = state.game || null, round = state.round || null, scene = null;   // scene: the painting drawn with the cat in it, for this game
const save = () => G.save(STORE, {settings, game, round});
const playing = () => game && !game.won && !game.lost;
const ready = () => scene && scene.game === game;
const caught = () => round.results.filter(r => r.caught).length;

function newRound(level = settings.level) {
  round = {level, results: [], hinted: false, over: false, ...G.freshClock()};
  game = null; save(); newPainting();
  G.track(`Cat Burglar new round level ${level}`);
}
function startLevel(n) { settings.level = n; $("levelSel").value = n; save(); G.closeCard(); newRound(n); }
async function newPainting() {
  const level = round.level, ask = Symbol();
  newPainting.ask = ask; game = null; scene = null; showLoading(true); G.note(""); draw();
  let pz;
  try { pz = await makePuzzle(level, settings.recent); }
  catch (e) { if (newPainting.ask === ask) showLoading(false, "The painting didn't load. Tap here to try again."); return; }
  if (newPainting.ask !== ask) return;
  settings.recent = [pz.i, ...settings.recent.filter(i => i !== pz.i)].slice(0, 30);
  game = {level, ...pz, lives: 3, misses: [], hints: 0, hinted: false, won: false, lost: false};
  save(); await hang();
}
$("loading").onclick = () => { if (round && !round.over && !game) newPainting(); };

// Draw this game's painting with its cat sneaked in.
async function hang() {
  const g = game; showLoading(true);
  const p = paintingOf(g.i); if (!p) throw new Error("unknown painting " + g.i);
  const [art, im] = await Promise.all([picture(artSrc(g.i)), picture(catSrc(g.c))]);
  if (game !== g) return;
  const c = $("art"); c.width = art.naturalWidth; c.height = art.naturalHeight;
  const ctx = c.getContext("2d", {willReadFrequently: true}); ctx.drawImage(art, 0, 0);
  const where = sneakIn(ctx, im, g, LEVELS[g.level].blend);
  scene = {game: g, PW: c.width, PH: c.height, ...where};
  $("placard").innerHTML = ""; const t = document.createElement("i"); t.textContent = p.title;
  const by = document.createElement("small"); by.textContent = [p.artist, p.date].filter(Boolean).join(", ");
  $("placard").append(t, by);
  $("levelSel").value = g.level;
  showLoading(false); layout(); view.z = 1; view.tx = view.ty = 0; applyView(); draw();
  // the looking is the puzzle, so the clock starts as soon as the painting is up (it waits between paintings, while
  // the walkthrough or a card is showing, or the page is hidden)
  if (playing()) round.started = true;
}
function showLoading(on, text) {
  $("loading").hidden = !on && !text; $("loading").textContent = text || "Hanging the painting…";
  $("art").style.visibility = on || text ? "hidden" : "";
}

// A tap on the painting, in painting pixels: the cat, or a miss. Once a painting is done, a tap brings back its card.
function tapAt(px, py) {
  if (!playing() || !ready()) { if (game && (game.won || game.lost)) paintingCard(); return; }
  if (game.lives <= 0) { outOfLives(); return; }   // the out-of-lives card was put away (or the page reloaded)
  if (onCat(px, py)) { win(); return; }
  game.misses.push([Math.round(px), Math.round(py)]); game.lives--; save(); draw();
  if (!game.lives) { outOfLives(); return; }
  G.note(game.lives === 1 ? "Not there! One life left." : "Not there!", 2500);
}
// Whether a point is on the cat, or close enough to it: within a few of the player's screen pixels
// (fewer when zoomed in) or a sliver of the cat's own size.
function onCat(px, py) {
  const s = scene, tol = Math.max(Math.sqrt(game.w * game.h) * 0.08, 10 / pxScale()), t2 = tol * tol;
  const x0 = Math.max(0, Math.floor(px - tol - s.x0)), x1 = Math.min(s.bw - 1, Math.ceil(px + tol - s.x0));
  const y0 = Math.max(0, Math.floor(py - tol - s.y0)), y1 = Math.min(s.bh - 1, Math.ceil(py + tol - s.y0));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++)
    if (s.mask[y * s.bw + x] && (x + s.x0 - px) ** 2 + (y + s.y0 - py) ** 2 <= t2) return true;
  return false;
}

/* ---------- endings ---------- */
// One painting done: caught, or missed (out of lives, or given up).
function done(caughtIt) {
  round.results.push({i: game.i, caught: caughtIt, lives: game.lives, hinted: game.hinted, revived: !!game.revived});
  if (game.hinted || game.revived) round.hinted = true;
  if (game.revived) round.revived = true;
  if (round.results.length >= ROUND) endRound();
  save(); draw();
  const g = game;   // a moment to see the cat ringed first
  setTimeout(() => { if (game === g) paintingCard(); }, caughtIt ? 1500 : 1800);
}
function win() {
  game.won = true; G.note("Caught!", 0);
  G.track(`Cat Burglar caught level ${game.level}`);
  done(true);
}
// Out of lives, as in Catdoku: let the cat go, or come back with three more lives (up to nine on one painting),
// which keeps the round from moving you up.
function outOfLives() {
  if (livesUsed() >= MAX_LIVES) { lose(); return; }
  G.openCard("Out of lives", "Three wrong taps. The cat's about to slip away.",
    [["Wait, I'm only mostly dead! Mostly dead is slightly alive, folks!", revive, true], ["Let it go", () => { G.closeCard(); lose(); }]]);
}
function revive() {
  const added = Math.min(3, MAX_LIVES - livesUsed());
  Object.assign(game, {livesUsed: livesUsed() + added, lives: added, revived: true});
  save(); draw();
  const more = Math.ceil((MAX_LIVES - game.livesUsed) / 3);
  G.openCard("Slightly alive!", `Back with ${added} more ${added === 1 ? "life" : "lives"}. ${more ? `${more} ${more === 1 ? "revive" : "revives"} left on this painting.` : "No revives left on this painting."}`,
    [["Keep looking", G.closeCard, true]]);
}
// Out of lives, or given up: the cat is ringed in red where it was hiding.
function lose(gaveUp) {
  game.lost = true; game.gaveUp = !!gaveUp; G.note(gaveUp ? "Here it was!" : "The cat got away! There it is.", 0);
  G.track(`Cat Burglar ${gaveUp ? "gave up" : "got away"} level ${game.level}`);
  done(false);
}
// The round's score. Four or five caught with no hints moves up a level; all five on the first tap with no hints
// earns a gold paw. Best times keeps the time of rounds with all five caught.
function endRound() {
  const k = caught(), clean = !round.hinted;
  round.over = true; round.level = round.level || game.level;
  round.next = clean && k >= 4 ? G.sizeUp(round.level, $("levelSel")) : round.level;
  round.gold = k === ROUND && clean && round.results.every(r => r.lives === 3 && !r.revived);
  if (k === ROUND) G.finishClock(round);
  else { G.breakStreak();   // a round with a cat missed ends the win streak
    if (k >= 3) G.dailyWon(); round.result = {ms: null, n: round.level}; }
  settings.level = round.next; $("levelSel").value = settings.level;
  G.track(`Cat Burglar round over level ${round.level}: ${k} caught`);
}
// The cat as it was found: the painting around it, cropped.
function caughtPic() {
  const s = scene, k = 1.4, side = Math.max(game.w, game.h) * k * 2, c = $("art");
  const x = Math.max(0, Math.min(s.PW - side, game.x - side / 2)), y = Math.max(0, Math.min(s.PH - side, game.y - side / 2));
  const w = Math.min(side, s.PW), h = Math.min(side, s.PH), out = canvasOf(Math.round(w), Math.round(h));
  out.getContext("2d").drawImage(c, x, y, w, h, 0, 0, out.width, out.height);
  const im = new Image(); im.className = "caught"; im.alt = "The cat, hiding in the painting"; im.src = out.toDataURL("image/jpeg", 0.88);
  return im;
}
// Where to see the painting itself (without a cat in it), and at the end of a round a pick of other levels.
function museumBits(next) {
  const p = paintingOf(game.i), box = document.createElement("div"), m = document.createElement("p");
  m.className = "museum";
  const a = document.createElement("a"); a.href = p.url; a.target = "_blank"; a.rel = "noopener";
  a.textContent = `See “${p.title}” ${live(p) ? "on Wikimedia Commons" : "at The Met"}`;
  m.append(a, document.createElement("br"), "(no cats in the real one)");
  box.append(m);
  if (next) box.append(G.otherSize($("levelSel"), next, startLevel, "Or play a different level:"));
  return box;
}
// After each painting: where the cat was, and on to the next (or the round's score after the fifth).
function paintingCard() {
  if (!ready()) return;
  if (game.won && !game.admired) { game.admired = true; save(); drawMarks(); }
  const p = paintingOf(game.i), n = round.results.length, last = round.over;
  const title = game.won ? `Caught! ${n} of ${ROUND}` : game.gaveUp ? `Here it was! ${n} of ${ROUND}` : `The cat got away! ${n} of ${ROUND}`;
  const lost = game.misses.length;
  const text = game.won ? `It was hiding in ${p.title}${lost ? `, and took ${lost + 1} taps` : ""}.`
    : game.gaveUp ? "The cat was hiding here." : "Three wrong taps, and it slipped off. It was hiding here.";
  const next = last ? ["See how you did", () => { G.closeCard(); roundCard(); }, true] : ["Next painting", () => { G.closeCard(); newPainting(); }, true];
  G.openCard(title, text, [next,
    [game.won ? "Admire the painting" : "Look at the painting", () => { G.closeCard(); G.note("Tap the painting when you're ready to go on.", 0); }]],
    caughtPic(), museumBits());
}
function roundCard() {
  if (!ready() || !round.over) return;
  const k = caught(), next = round.next;
  let text = `You caught ${k} of ${ROUND} cats.`;
  text += round.hinted ? ` You had ${round.revived ? "help" : "a hint"}, so here's another round at level ${next}.`
    : next > round.level ? ` Next up: level ${next}.`
    : k >= 4 ? " That's the top level; here's another round."
    : ` Catch 4 with no hints to move up. Here's another round at level ${next}.`;
  G.winCard(text, () => { G.closeCard(); startLevel(next); }, "Admire the painting", round.result,
    {title: k === ROUND ? "All five caught!" : "Round over!", gold: round.gold, goldWhy: "Five cats, each on the first tap, no hints!",
     goldTitle: "Caught red-pawed!", goldPic: [caughtPic()], next: next > round.level ? `Next round: level ${next}` : "Next round", after: museumBits(next)});
}

/* ---------- hints ---------- */
// A gold ring round the part of the painting the cat is in; each hint after the first rings a smaller part.
const hints = G.hinter({game: () => game, key: () => game ? String(game.misses.length) : "", draw: () => draw()});   // marks {x, y, r}: a ring
function hint() {
  if (!playing() || !ready()) return;
  const s = scene, catR = Math.max(game.w, game.h) * 0.6, r = Math.max(catR * 1.6, Math.min(s.PW, s.PH) * (game.hints ? 0.13 : 0.26));
  const off = Math.random() * Math.max(0, r - catR), a = Math.random() * Math.PI * 2;
  game.hints++; if (!game.hinted) game.hinted = true;
  save(); hints.show({x: game.x + Math.cos(a) * off, y: game.y + Math.sin(a) * off, r}, "The cat is somewhere in the gold ring.");
}

/* ---------- looking closer: pinch, drag, the mouse wheel, + and − ---------- */
const view = {z: 1, tx: 0, ty: 0}, MAXZ = 8;
let VW = 0, VH = 0, kb = null;   // kb: the keyboard crosshair, in painting pixels
// Size the painting to fit the page: the full width, or less when a tall painting would run off the screen. In full
// screen, as big as fits on the screen with the lives above and the buttons below.
function layout() {
  if (!scene) return;
  const wall = $("wall");
  let room = wall.clientWidth - 24 - 18, tall = Math.max(240, innerHeight * 0.6);
  if (isFull() && SMALL.matches) {   // edge to edge: all of the wall, less the thin gilt edge
    const edge = 2 * parseFloat(getComputedStyle(wall.querySelector(".frame")).paddingLeft);
    room = wall.clientWidth - edge; tall = wall.clientHeight - edge;
  } else if (isFull()) {
    const m = wall.parentNode, cs = getComputedStyle(m), around = wall.offsetHeight - $("board").offsetHeight;   // the lamp, frame and placard
    tall = Math.max(120, m.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 2 * parseFloat(cs.rowGap)
      - document.querySelector(".status").offsetHeight - document.querySelector(".actions").offsetHeight - around);
  }
  const k = Math.min(room / scene.PW, tall / scene.PH), was = VW;
  VW = Math.round(scene.PW * k); VH = Math.round(scene.PH * k);
  const v = $("board"), l = $("layer"); v.style.width = VW + "px"; v.style.height = VH + "px"; l.style.width = VW + "px"; l.style.height = VH + "px";
  $("marks").setAttribute("viewBox", `0 0 ${scene.PW} ${scene.PH}`);
  if (was && was !== VW) { view.tx *= VW / was; view.ty *= VW / was; }
  applyView();
}
const pxScale = () => VW / scene.PW * view.z;   // screen pixels per painting pixel
function applyView() {
  view.z = Math.min(MAXZ, Math.max(1, view.z));
  view.tx = Math.min(0, Math.max(VW - VW * view.z, view.tx)); view.ty = Math.min(0, Math.max(VH - VH * view.z, view.ty));
  $("layer").style.transform = `translate(${view.tx}px, ${view.ty}px) scale(${view.z})`;
  $("board").classList.toggle("zoomed", view.z > 1);
  $("zoomOut").disabled = view.z <= 1; $("zoomIn").disabled = view.z >= MAXZ;
  if (scene) drawMarks();
}
// Zoom by a factor, keeping the point (ax, ay) in the view where it is.
function zoomBy(f, ax = VW / 2, ay = VH / 2) {
  const z = Math.min(MAXZ, Math.max(1, view.z * f)), k = z / view.z;
  view.tx = ax - (ax - view.tx) * k; view.ty = ay - (ay - view.ty) * k; view.z = z; applyView();
}
const pts = new Map(); let gesture = null;
const local = e => { const b = $("board").getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
const spread = () => { const [a, b] = [...pts.values()]; return [Math.hypot(a[0] - b[0], a[1] - b[1]), (a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; };
$("board").addEventListener("pointerdown", e => {
  if (e.target.closest(".zoom")) return;
  // the first finger down starts afresh: a finger still held from before is one whose lift never came (a phone
  // can lose it at the end of a pinch), and keeping it would make every tap after look like a second finger
  if (e.isPrimary) { pts.clear(); gesture = null; }
  $("board").setPointerCapture(e.pointerId); pts.set(e.pointerId, local(e));
  if (pts.size === 1) { const [x, y] = local(e); gesture = {kind: "tap", x, y, tx: view.tx, ty: view.ty}; }
  else if (pts.size === 2) { const [d, mx, my] = spread(); gesture = {kind: "pinch", d, mx, my, z: view.z, tx: view.tx, ty: view.ty}; }
});
$("board").addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId) || !gesture) return;
  pts.set(e.pointerId, local(e));
  if (gesture.kind === "pinch" && pts.size === 2) {
    const [d, mx, my] = spread(), z = Math.min(MAXZ, Math.max(1, gesture.z * d / gesture.d)), k = z / gesture.z;
    view.z = z; view.tx = mx - (gesture.mx - gesture.tx) * k; view.ty = my - (gesture.my - gesture.ty) * k; applyView();
  } else if (gesture.kind !== "pinch") {
    const [x, y] = local(e);
    if (gesture.kind === "tap" && Math.hypot(x - gesture.x, y - gesture.y) > 8) gesture.kind = "drag";
    if (gesture.kind === "drag") { view.tx = gesture.tx + x - gesture.x; view.ty = gesture.ty + y - gesture.y; applyView(); }
  }
});
const lift = e => {
  if (!pts.has(e.pointerId)) return;
  const was = gesture; pts.delete(e.pointerId);
  if (was && was.kind === "tap" && e.type === "pointerup" && !pts.size) {
    const [x, y] = local(e), s = VW / scene.PW;
    tapAt((x - view.tx) / view.z / s, (y - view.ty) / view.z / s);
  }
  if (!pts.size) gesture = null;
  else if (pts.size === 1) { const [x, y] = [...pts.values()][0]; gesture = {kind: "drag", x, y, tx: view.tx, ty: view.ty}; }
};
$("board").addEventListener("pointerup", lift);
$("board").addEventListener("pointercancel", lift);
$("board").addEventListener("lostpointercapture", lift);   // a finger the page lost hold of without a lift
$("board").addEventListener("wheel", e => { e.preventDefault(); const [x, y] = local(e); zoomBy(Math.exp(-e.deltaY * 0.0025), x, y); }, {passive: false});
$("zoomIn").onclick = () => zoomBy(1.6);
$("zoomOut").onclick = () => zoomBy(1 / 1.6);
addEventListener("keydown", e => {
  if (document.querySelector(".spot") || $("overlay").classList.contains("show") || e.target.closest("input,select")) return;
  if (e.key === "+" || e.key === "=") zoomBy(1.6); else if (e.key === "-" || e.key === "_") zoomBy(1 / 1.6);
});
addEventListener("resize", layout);

/* ---------- full screen ---------- */
const isFull = () => document.body.classList.contains("full");
const SMALL = matchMedia("(max-width:600px),(max-height:500px)");   // a phone: edge to edge (as in the style above)
G.fullScreen({btn: $("fullBtn"), name: "Cat Burglar", change: (on, toggled) => {
  // in full screen the zoom buttons sit with Hint and Give up, off the painting; otherwise in the frame's corner
  (on ? document.querySelector(".actions") : $("board")).append($("zoom"));
  layout();
  // a wide painting on a phone held upright is much bigger sideways
  if (on && toggled && scene && SMALL.matches && innerHeight > innerWidth && scene.PW > scene.PH * 1.15) G.note("Turn your phone sideways for a bigger painting.", 5000);
}});
// Keys: the arrows move a crosshair over the painting, in steps that get finer as you zoom in (and the view follows
// it), and Space or Enter taps where it is. + and − zoom.
const keys = G.gridKeys({on: () => playing() && ready(),
  start: () => { kb = {x: scene.PW / 2, y: scene.PH / 2}; return 0; },
  move: (i, dx, dy, e) => {
    const stepPx = Math.min(scene.PW, scene.PH) / (e && e.shiftKey ? 8 : 30) / view.z;
    kb = {x: Math.max(0, Math.min(scene.PW, kb.x + dx * stepPx)), y: Math.max(0, Math.min(scene.PH, kb.y + dy * stepPx))};
    // keep it in view
    const k = VW / scene.PW * view.z, sx = kb.x * k + view.tx, sy = kb.y * k + view.ty;
    if (sx < 20 || sx > VW - 20) view.tx = VW / 2 - kb.x * k;
    if (sy < 20 || sy > VH - 20) view.ty = VH / 2 - kb.y * k;
    applyView();
    return 0;
  },
  show: i => { if (i < 0) kb = null; drawMarks(); },
  act: () => { if (kb) tapAt(kb.x, kb.y); }});

/* ---------- drawing ---------- */
const ns = "http://www.w3.org/2000/svg";
const svgEl = (t, a) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
// Misses (a red cross on a pale dot), the hint ring, and the ring round the cat once it's caught or got away;
// the marks keep the same size on the screen however far in you zoom.
function drawMarks() {
  const svg = $("marks"); svg.innerHTML = "";
  if (!game || !ready()) return;
  const u = 1 / pxScale();
  for (const [x, y] of game.misses) {
    const g = svgEl("g", {class: "miss"}), r = 9 * u, q = 4.5 * u;
    g.append(svgEl("circle", {cx: x, cy: y, r, "stroke-width": 2}), svgEl("path", {d: `M${x - q} ${y - q}L${x + q} ${y + q}M${x + q} ${y - q}L${x - q} ${y + q}`, "stroke-width": 3}));
    svg.append(g);
  }
  if (kb && playing()) {   // the keyboard crosshair
    const r = 14 * u, q = 6 * u, g = svgEl("g", {class: "kbcross"});
    g.append(svgEl("circle", {cx: kb.x, cy: kb.y, r, fill: "none", stroke: G.CURSOR, "stroke-width": 3 * u}),
      svgEl("path", {d: `M${kb.x - r - q} ${kb.y}H${kb.x - r + q}M${kb.x + r - q} ${kb.y}H${kb.x + r + q}M${kb.x} ${kb.y - r - q}V${kb.y - r + q}M${kb.x} ${kb.y + r - q}V${kb.y + r + q}`, stroke: G.CURSOR, "stroke-width": 3 * u}));
    svg.append(g);
  }
  const shown = playing() && hints.current();
  if (shown) svg.append(svgEl("circle", {class: "hintsq", cx: shown.x, cy: shown.y, r: shown.r}));
  // the ring round a caught cat shows until the win card comes up, so the painting can be admired without it
  if ((game.won && !game.admired) || game.lost) svg.append(svgEl("ellipse", {class: "found" + (game.lost ? " away" : ""), cx: game.x, cy: game.y,
    rx: Math.max(game.w, game.h) * 0.62 + 6 * u, ry: Math.max(game.w, game.h) * 0.62 + 6 * u}));
}
function draw() {
  $("hintBtn").disabled = $("giveUpBtn").disabled = !playing() || !ready();
  if (!round) return;
  // which painting of the round this is: the one being hunted, or the last one done
  const n = Math.min(ROUND, round.results.length + (playing() || !game ? 1 : 0));
  $("count").textContent = `${levelLabel(round.level)} · ${n} of ${ROUND}`;
  if (!game) return;
  $("hearts").innerHTML = "♥".repeat(game.lives) + '<span class="lost">♥</span>'.repeat(Math.max(3, livesUsed()) - game.lives);
  $("hearts").setAttribute("aria-label", `${game.lives} lives left`);
  drawMarks();
}

$("hintBtn").onclick = hint;
$("giveUpBtn").onclick = () => { if (playing() && ready()) lose(true); };
// New round: straight away, or after asking if this round is partway through.
const midRound = () => !!(round && !round.over && (round.results.length || (game && game.misses.length)));
$("newBtn").onclick = () => {
  if (!midRound()) { G.closeCard(); newRound(); return; }
  G.openCard("Start a new round?", `You're on painting ${Math.min(ROUND, round.results.length + 1)} of ${ROUND}. This round won't count.`,
    [["New round", () => { G.closeCard(); newRound(); }, true], ["Keep playing", G.closeCard]]);
};
for (let n = 1; n <= TOP; n++) $("levelSel").append(new Option(levelLabel(n), n));
$("levelSel").value = settings.level;
$("levelSel").onchange = e => startLevel(+e.target.value);
$("helpBtn").onclick = showHelp;
// a cat peeking round the corner of the title, sneaking in
$("peek").src = catSrc("c19-21");

/* ---------- how to play ---------- */
function showHelp() {
  settings.seenHelp = false; helpOnFirstVisit();
  if (!document.querySelector(".spot") && !(game && playing())) { settings.seenHelp = true; G.helpLater(); }
}
// The walkthrough points at the painting and the buttons, never at the cat. If the painting is still being
// hung, it waits for it.
function helpOnFirstVisit(tries = 0) {
  if (settings.seenHelp || document.querySelector(".spot")) return;
  if (!game || !ready()) { if (tries < 40) setTimeout(() => helpOnFirstVisit(tries + 1), 250); return; }
  if (!playing()) return;
  const steps = [
    {say: "A cat has sneaked into this painting!", lit: [[0, 0]]},
    {say: "Tap the cat to catch it", lit: [[0, 0]], tone: "ok"},
    {say: "Catch as many as you can in 5 paintings", els: [$("count")]},
    {say: "Pinch or tap + to look closer", els: [$("zoom")]},
    {say: "A wrong tap costs a life", els: [$("hearts")]},
    {say: "Give up shows where it was and moves on", els: [$("giveUpBtn")]},
    {say: "Stuck? Hint rings where to look", els: [$("hintBtn")]},
  ];
  G.spotlight({grid: $("board"), w: 1, h: 1, steps, done: () => { settings.seenHelp = true; save(); }});
}

G.nav("catburglar");
// The clock is the round's: it runs while a painting is being hunted.
G.checkClock(round);
G.setupTimer({name: "catburglar", game: () => round, playing: r => !r.over && playing(), save, label: levelLabel, noun: "level",
  emptyText: "Catch all five cats in a round and your time will show up here. Times are kept on this device only."});
$("bestBtn").onclick = () => G.showBests("Best times", round ? round.level : settings.level);

/* ---------- sharing ---------- */
$("linkBtn").onclick = () => {
  if (!game || !ready()) return;
  G.shareCard({name: "Cat Burglar", won: game.won || game.lost,
    puzzle: () => ({g: "catburglar", N: game.level, i: game.i, c: game.c, x: game.x, y: game.y, w: game.w, h: game.h, r: game.r, f: game.f}),
    progress: () => ({m: game.misses, l: game.lives})});
};
// A painting from a share link: the same cat in the same spot (and the misses so far, if sent), as the first
// painting of a new round.
function openShared(d) {
  const p = paintingOf(d.i), int = v => Number.isInteger(v);
  if (!LEVELS[d.N] || !p || !CATS.includes(d.c) || ![d.x, d.y, d.w, d.h, d.r].every(int) || d.w < 8 || d.h < 8 || Math.abs(d.r) > 45 ||
      d.x - d.w < 0 || d.y - d.h < 0 || d.x + d.w > p.w || d.y + d.h > p.h) {
    G.note("That share link didn't work. It may have been cut off.", 6000); return;
  }
  newPainting.ask = Symbol();
  round = {level: d.N, results: [], hinted: false, over: false, ...G.freshClock()};
  game = {level: d.N, i: d.i, c: d.c, x: d.x, y: d.y, w: d.w, h: d.h, r: d.r, f: d.f ? 1 : 0, lives: 3, misses: [], hints: 0, hinted: false, won: false, lost: false};
  const q = d.p;
  if (q && Array.isArray(q.m) && q.m.length < 3 && q.m.every(m => Array.isArray(m) && m.length === 2 && m.every(int))) {
    Object.assign(game, {misses: q.m, lives: Math.max(1, 3 - q.m.length)}); round.timed = false;
  }
  settings.level = d.N; $("levelSel").value = d.N; save();
  hang().catch(() => { showLoading(false, "The shared painting didn't load. Tap New round for another."); });
}
const shared = G.readShare("catburglar");
// Reopen the round where it was left: the painting being hunted (or just done, with its card), or the next one.
if (round && round.results) G.reopen(() => {
  if (game && game.i) {
    if (!paintingOf(game.i) || !CATS.includes(game.c)) throw new Error("that painting isn't in the gallery any more");
    hang().then(() => { if (round.over) roundCard(); else if (!playing()) paintingCard(); helpOnFirstVisit(); })
      .catch(() => { if (round.over) newRound(); else newPainting(); });
  } else if (round.over) newRound();
  else { newPainting(); helpOnFirstVisit(); }
}, why => { newRound(); G.note(why, 0); });
else if (!shared) { newRound(); helpOnFirstVisit(); }
const shareOpts = () => ({name: "Cat Burglar", inProgress: midRound(), open: openShared, after: helpOnFirstVisit});
if (shared) G.offerShare(shared, shareOpts());
// A share link opened while this page is already showing only changes the address, so watch for it.
addEventListener("hashchange", () => { const d = G.readShare("catburglar"); if (d) G.offerShare(d, shareOpts()); });
</script>
