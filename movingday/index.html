<style>
/* Moving Day: a room full of moving boxes. Tap the treat jar or the yarn basket for something small; drag two the
   same together to make the next thing up; a merge beside a box opens it. Give the cats what they ask for. */
.orders{width:var(--board);display:flex;gap:6px;justify-content:center;margin-bottom:4px}
.order{flex:1 1 0;max-width:120px;height:70px;padding:0;border:2px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);
  font:inherit;cursor:pointer;position:relative;touch-action:manipulation}
.order img{position:absolute;left:2px;bottom:2px;width:50px;height:58px;object-fit:contain;object-position:bottom left}
/* what the cat wants, big beside it */
.order .want{position:absolute;right:0;top:50%;transform:translateY(-50%);width:58px;height:58px}
.order .want svg{width:100%;height:100%;display:block}
/* a cat that wants two things: both a little smaller, one above the other */
.order .want.two{width:42px;height:42px;transform:none}
.order .want.two.w0{top:-2px;right:0} .order .want.two.w1{top:26px;right:22px}
.order .want.got::after{content:"✓";position:absolute;inset:8%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#2F6B3A;background:rgba(255,255,255,.65);border-radius:50%}
.order.ready{border-color:#6AA673;background:color-mix(in srgb,#6AA673 16%,var(--panel));box-shadow:0 0 0 2px #6AA673}
.order.ready::after{content:"Tap to give";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);white-space:nowrap;padding:0 7px;border-radius:999px;background:#2F6B3A;color:#fff;
  font-size:calc(12px*var(--ts));font-weight:800;line-height:18px}
.order.done{opacity:.55;cursor:default}
.order.hint{box-shadow:0 0 0 4px #ECA818}
.order:not(.done) .want.got{opacity:1}
.room{--floor:color-mix(in srgb,#ECA818 13%,#fff);width:var(--board);padding:6px;border-radius:18px;background:#B98549;box-shadow:inset 0 0 0 3px #7A4E2C}
.room .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;touch-action:none;user-select:none;-webkit-user-select:none}
.sq{position:relative;aspect-ratio:1;border-radius:10px;background:var(--floor)}
.sq.boxed{background:transparent}
.sq > svg{position:absolute;inset:4%;width:92%;height:92%;pointer-events:none}
.sq .b1,.sq .b2{position:absolute;pointer-events:none}
.sq .b1{inset:0}
.sq.two .b1{inset:auto auto 30% 0;width:72%;height:72%}
.sq.two .b2{inset:30% 0 0 auto;width:72%;height:72%}
.sq .b1 svg,.sq .b2 svg{width:100%;height:100%;display:block}
.sq.gen{background:color-mix(in srgb,#ECA818 30%,var(--floor));cursor:pointer}
.sq.gen.y{background:color-mix(in srgb,#B94588 22%,var(--floor))}
.sq.webbed > svg.item{opacity:.7}
.sq .web{position:absolute;inset:0;width:100%;height:100%}
.sq.sel{box-shadow:0 0 0 3px #2A2530 inset}
.sq.same{box-shadow:0 0 0 3px #6AA673 inset}
.sq.lifted > svg.item{opacity:.25}
.sq.drop{box-shadow:0 0 0 3px #ECA818 inset}
.sq .tier{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:800;color:#5E5866;line-height:1}
.ghost{position:fixed;z-index:50;pointer-events:none;width:64px;height:64px;margin:-40px 0 0 -32px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.ghost svg{width:100%;height:100%}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes unbox{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.15) rotate(-6deg)}100%{transform:scale(1)}}
.sq.pop > svg.item{animation:pop .35s ease-out}
.sq.unbox{animation:unbox .4s ease-out}
.sq.gen:active{transform:scale(.94)}
#count b{font-variant-numeric:tabular-nums}

/* What's what: both chains in order, under the game */
.key{--floor:color-mix(in srgb,#ECA818 13%,#fff);width:var(--board);margin-top:10px;padding-top:12px;border-top:2px solid var(--line)}
.key h2{margin:0;font-size:calc(20px*var(--ts-big))}
.key h3{margin:14px 0 6px;font-size:calc(16px*var(--ts));color:var(--ink-soft)}
.key p{margin:2px 0 0;color:var(--ink-soft);font-size:calc(15px*var(--ts))}
.chain{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}

<script>
/* ---------- the rules (plain functions in one, so the background worker can have them all) ---------- */
// Moving Day: a room full of moving boxes. Tap the treat jar or the toy basket for something small (a tap each, from
// the level's taps); drag two the same together to make the next one along; a merge beside a box opens it. Give the
// cats what they want before the taps run out.
function movingRules() {
  // Moving Day: the rules, as plain functions (tested in Node, then pasted into the page).
  // A square: cover 0 open, 1 a box, 2 two boxes; item "t3" (treat chain, step 3) or ""; web: the item's under a
  // cobweb (can't be moved or given; merge a matching one onto it); inside: what's in the box; gen "t" or "y".
  const MAXT = 7;
  // The levels: what each cat wants (a list per cat), and what makes the level harder than the one before.
  //  tight: the room starts with less open floor; inner: two boxes deep close to the middle; mix: how often a tap gives
  //  the other kind of thing; goodies: how often a box has something in it; spare: taps over what the orders need.
  const LEVELS = [null,
    {cats: [["t3"]], goodies: .35, spare: .3},
    {cats: [["t3"], ["y3"]], goodies: .35, spare: .25},
    {cats: [["t4"], ["y3"]], goodies: .33, spare: .2},
    {cats: [["t4"], ["y4"]], tight: 1, goodies: .18, spare: .08},
    {cats: [["t5"], ["y3"]], tight: 1, inner: .5, goodies: .16, spare: .06},
    {cats: [["t4", "y4"], ["t3"]], tight: 1, inner: .5, goodies: .15, spare: .06},
    {cats: [["t5"], ["y5"]], tight: 1, inner: .5, mix: .15, goodies: .12, spare: .04},
    {cats: [["t6"], ["y4"]], tight: 1, inner: .6, mix: .15, goodies: .14, spare: .13},
    {cats: [["t5", "y3"], ["y6"]], tight: 1, inner: .6, mix: .2, goodies: 0.13, spare: 0.05},
    {cats: [["t6"], ["y5"], ["t4", "y4"]], tight: 1, inner: .7, mix: .2, goodies: 0.12, spare: 0.04},
    {cats: [["t6", "y6"]], tight: 1, inner: .7, mix: .25, goodies: 0.11, spare: 0.04},
    {cats: [["t7"], ["y6", "t4"]], tight: 1, inner: .8, mix: .25, goodies: .1, spare: .18}];
  const ORDERS = LEVELS;
  function rngOf(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const val = t => 1 << (t - 1);
  function makeLevel(n, seed) {
    const L = LEVELS[n], r = rngOf(seed), W = 7, H = 7, N = W * H;
    const orders = []; L.cats.forEach((w, cat) => w.forEach(it => orders.push({c: it[0], t: +it[1], done: false, cat})));
    const chains = [...new Set(orders.map(o => o.c))].sort();   // "t" before "y"
    const sq = Array.from({length: N}, () => ({cover: 1, item: "", web: false, inside: "", gen: ""}));
    const gens = chains.length === 1 ? {[chains[0]]: 3 * W + 3} : {t: 3 * W + 2, y: 3 * W + 4};
    const near = (i, j) => Math.abs(i % W - j % W) + Math.abs((i / W | 0) - (j / W | 0));
    const cheb = i => Math.max(Math.abs(i % W - 3), Math.abs((i / W | 0) - 3));
    const opens = Object.values(gens).map(g => g);
    for (let i = 0; i < N; i++) {
      const s = sq[i], d = Math.min(...opens.map(g => near(i, g)));
      // open floor: round the jar and basket; a tight room keeps only the squares beside them in their row
      const open = !L.tight ? d <= 1 || i === 3 * W + 3 : d === 0 || i === 3 * W + 3 || (d === 1 && (i / W | 0) === 3);
      if (open) s.cover = 0;
      else s.cover = cheb(i) >= 3 ? (r() < 0.6 ? 2 : 1) : (r() < (L.inner || 0.15) ? 2 : 1);
    }
    for (const c in gens) sq[gens[c]].gen = c;
    // boxes and cobwebs only hold toys (food packed in a moving box would have gone off), so a level of treats alone has none
    const toys = chains.includes("y"), pick = () => "y";
    if (toys) for (const s of sq) if (s.cover && r() < L.goodies) s.inside = pick() + (r() < 0.65 ? 1 : 2);
    // two or three things under cobwebs, just out of reach
    const ring = sq.map((s, i) => i).filter(i => cheb(i) === 2 && sq[i].cover);
    const webs = toys ? 2 + (n >= 7 ? 1 : 0) : 0, top = Math.max(...orders.filter(o => o.c === "y").map(o => o.t), 2);
    for (let k = 0; k < webs && ring.length; k++) {
      const i = ring.splice(Math.floor(r() * ring.length), 1)[0];
      Object.assign(sq[i], {cover: 0, inside: "", item: pick() + Math.min(top - 1, n < 7 || r() < 0.6 ? 2 : 3), web: true});
    }
    const need = orders.reduce((a, o) => a + val(o.t), 0);
    const g = {n, seed, W, H, sq, orders, cats: L.cats.length, mix: L.mix || 0, rs: seed ^ 0x5bd1e995, taps: need + 1 + Math.floor(need * L.spare), won: false};
    g.tapsStart = g.taps;
    return g;
  }
  const clone = g => JSON.parse(JSON.stringify(g));
  const free = s => s.item && !s.web && !s.cover;
  // Each step of a move, for the page to animate: returns {g, did} or null if it can't be done.
  function canMove(g, i, j) {
    const a = g.sq[i], b = g.sq[j];
    if (i === j || !free(a) || b.cover || b.gen) return null;
    if (!b.item) return "move";
    if (b.item === a.item && +a.item[1] < MAXT) return "merge";
    if (!b.web) return "swap";
    return null;
  }
  function nbrs(g, i) { const x = i % g.W, y = i / g.W | 0, out = []; if (x) out.push(i - 1); if (x < g.W - 1) out.push(i + 1); if (y) out.push(i - g.W); if (y < g.H - 1) out.push(i + g.W); return out; }
  function move(g, i, j) {
    const how = canMove(g, i, j); if (!how) return null;
    const a = g.sq[i], b = g.sq[j], opened = [];
    if (how === "move") { b.item = a.item; a.item = ""; }
    else if (how === "swap") { [a.item, b.item] = [b.item, a.item]; }
    else {
      b.item = b.item[0] + (+b.item[1] + 1); b.web = false; a.item = "";
      for (const k of nbrs(g, j)) { const s = g.sq[k]; if (!s.cover) continue; s.cover--; if (!s.cover) { s.item = s.inside; s.inside = ""; } opened.push(k); }
    }
    return {how, opened};
  }
  function spawnAt(g, c) {
    const gi = g.sq.findIndex(s => s.gen === c); if (gi < 0) return -1;
    let best = -1, bd = 1e9;
    for (let i = 0; i < g.sq.length; i++) {
      const s = g.sq[i]; if (s.cover || s.gen || s.item) continue;
      const d = Math.abs(i % g.W - gi % g.W) + Math.abs((i / g.W | 0) - (gi / g.W | 0));
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }
  function tapGen(g, c) {
    if (g.taps <= 0) return "taps";
    const i = spawnAt(g, c); if (i < 0) return "room";
    // now and then the jar or basket gives the other kind of thing (the rng's state is kept in the game, so Undo undoes it)
    let it = c;
    if (g.mix && g.sq.some(s => s.gen && s.gen !== c)) { const r = rngOf(g.rs); g.rs = Math.floor(r() * 4294967296) | 0; if (r() < g.mix) it = c === "t" ? "y" : "t"; }
    g.sq[i].item = it + 1; g.taps--; return i;
  }
  function canGive(g, k) { const o = g.orders[k]; if (o.done) return -1; return g.sq.findIndex(s => free(s) && s.item === o.c + o.t); }
  function give(g, k, from) {
    const i = from !== undefined && from >= 0 && free(g.sq[from]) && g.sq[from].item === g.orders[k].c + g.orders[k].t ? from : canGive(g, k);
    if (i < 0 || g.orders[k].done) return -1;
    g.sq[i].item = ""; g.orders[k].done = true; g.won = g.orders.every(o => o.done); return i;
  }
  // The fewest more taps that could still fill every order of chain c from what's on the board (boxes and webs
  // counted as if reachable): -1 never.
  function tapsWanted(g, c, withBoxes = true) {
    const want = Array(MAXT + 2).fill(0), have = Array(MAXT + 2).fill(0), web = Array(MAXT + 2).fill(0);
    for (const o of g.orders) if (!o.done && o.c === c) want[o.t]++;
    if (!want.some(Boolean)) return 0;
    for (const s of g.sq) {
      const it = s.cover ? (withBoxes ? s.inside : "") : s.item;
      if (it && it[0] === c) (s.web && !s.cover ? web : have)[+it[1]]++;
    }
    // a webbed one only counts once a free one the same is merged onto it
    const ok = x => {
      let carry = 0;
      for (let t = 1; t <= MAXT; t++) {
        let r = have[t] + carry + (t === 1 ? x : 0) - want[t]; if (r < 0) return false;
        const m = t < MAXT ? Math.min(r, web[t]) : 0; r -= m; carry = m + (t < MAXT ? r >> 1 : 0);
      }
      return true;
    };
    for (let x = 0; x <= 64; x++) if (ok(x)) return x;
    return -1;
  }
  function stuck(g) {   // out of taps and the orders can't be filled any more
    if (g.won) return false;
    let total = 0; for (const c of ["t", "y"]) { const w = tapsWanted(g, c); if (w < 0) return true; total += w; }
    return total > g.taps;
  }
  // A merge worth making: two free alike, or one free onto a webbed alike, not using up one an order wants as it is.
  function merges(g) {
    const out = [], wanted = {};
    for (const o of g.orders) if (!o.done) wanted[o.c + o.t] = (wanted[o.c + o.t] || 0) + 1;
    const top = {}; for (const o of g.orders) if (!o.done) top[o.c] = Math.max(top[o.c] || 0, o.t);
    const by = {};
    g.sq.forEach((s, i) => { if (s.item && !s.cover && +s.item[1] < (top[s.item[0]] || 0)) (by[s.item] = by[s.item] || []).push(i); });
    for (const it in by) {
      const L = by[it], fr = L.filter(i => !g.sq[i].web), web = L.filter(i => g.sq[i].web);
      const spare = fr.length - (wanted[it] || 0), boxes = i => nbrs(g, i).filter(k => g.sq[k].cover).length;
      if (web.length && spare >= 1) out.push([fr[0], web[0]]);
      else if (spare >= 2) { fr.sort((a, b) => boxes(a) - boxes(b)); out.push([fr[0], fr[fr.length - 1]]); }
    }
    return out;
  }
  // A plain player, to set the gold paw: deliver, then merge, then tap for what's short. Returns taps left (-1 lost).
  function play(g, smart = true) {
    for (let steps = 0; steps < 500; steps++) {
      if (g.won) return g.taps;
      let did = false;
      for (let k = 0; k < g.orders.length; k++) if (canGive(g, k) >= 0) { give(g, k); did = true; }
      if (did) continue;
      const m = merges(g);
      if (m.length) { move(g, m[0][0], m[0][1]); continue; }
      if (g.taps <= 0) return -1;
      const cs = ["t", "y"].filter(c => g.sq.some(s => s.gen === c));
      const open = c => g.orders.some(o => !o.done && o.c === c);
      let c = cs.filter(open).map(c => [tapsWanted(g, c, false), c]).sort((a, b) => b[0] - a[0])[0][1];
      const r = tapGen(g, c);
      if (r === "room") {   // no room: merge anything alike, even past what's wanted
        const by = {}; let pair = null;
        g.sq.forEach((s, i) => { if (free(s) && +s.item[1] < MAXT) { if (by[s.item] !== undefined && !pair) pair = [by[s.item], i]; by[s.item] = i; } });
        if (!pair) return -2; move(g, pair[0], pair[1]);
      }
    }
    return -3;
  }
  // Deal a room the plain player can finish (trying other seeds if not); the gold paw is for keeping 3/4 of what it kept.
  function deal(n, seed) {
    for (let k = 0; ; k++) {
      const g = makeLevel(n, seed + k * 7919), left = play(clone(g));
      if (left >= 0 || k > 60) { g.goldAt = Math.max(1, Math.floor(left * 0.75)); g.tries = k + 1; return g; }
    }
  }
  return {MAXT, LEVELS, rngOf, makeLevel, clone, free, canMove, move, nbrs, spawnAt, tapGen, canGive, give, tapsWanted, stuck, merges, val, play, deal};
}
// A room at level n with a new seed, for the worker (G.builder).
function dealRandom(n) { return movingRules().deal(n, Math.floor(Math.random() * 1e9)); }

/* ---------- the pictures ---------- */
// The things on the board, drawn for Moving Day (viewBox 0 0 100 100), in the site's palette.
const INKS = 'stroke="#2A2530" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const SHADE = (w = 26) => `<ellipse cx="50" cy="86" rx="${w}" ry="5" fill="#2A2530" opacity=".13"/>`;
const ART = {
  t1: `${SHADE(24)}<g fill="#B9805F" ${INKS}><ellipse cx="34" cy="66" rx="12" ry="9"/><ellipse cx="64" cy="68" rx="12" ry="9"/><ellipse cx="49" cy="48" rx="12" ry="9"/></g>
       <g fill="#D7AE8E"><ellipse cx="30" cy="63" rx="4" ry="2.5"/><ellipse cx="60" cy="65" rx="4" ry="2.5"/><ellipse cx="45" cy="45" rx="4" ry="2.5"/></g>`,
  t4: `${SHADE(36)}<rect x="12" y="36" width="76" height="44" rx="14" fill="#7885BA" ${INKS}/><rect x="19" y="42" width="62" height="31" rx="9" fill="#C7DCDF" stroke="#4E577D" stroke-width="2.5"/>

$("grid").addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
  if (!drag.moved) { drag.moved = true; nameIt(drag.from); ghost = document.createElement("div"); ghost.className = "ghost"; ghost.innerHTML = itemSVG(game.sq[drag.from].item); document.body.append(ghost); }
  ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px";
  const t = sqAt(e.clientX, e.clientY), over = t && t.classList.contains("sq") ? +t.dataset.i : -1;
  if (over !== drag.over) { drag.over = over; draw(); }
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null; if (ghost) { ghost.remove(); ghost = null; }
  if (!d.moved) { tapAt(d.from); return; }   // a tap
  const t = e.type === "pointerup" ? sqAt(e.clientX, e.clientY) : null;
  if (t && t.classList.contains("order")) { sel = d.from; giveTo(+t.dataset.k); sel = -1; draw(); return; }
  if (t && t.classList.contains("sq")) { const j = +t.dataset.i; if (j !== d.from && !tryMove(d.from, j)) msg("That won't go there"); }
  draw();
}
$("grid").addEventListener("pointerup", endDrag);
$("grid").addEventListener("pointercancel", endDrag);

/* ---------- keys ---------- */
// Arrow keys pick a square, Space or Enter taps it, 1 to 4 give a cat what it wants, Escape lets go.
const keys = G.gridKeys({on: () => game && !game.won && !busy, size: () => [game.W, game.H], show: () => draw(), keys: ["1", "2", "3", "4"],
  start: () => game.sq.findIndex(s => s.gen),
  act: (i, key) => { if (key === " ") tapAt(i); else { const k = +key - 1; if (k < game.cats) giveTo(k); } },
  escape: () => { if (sel >= 0) { sel = -1; draw(); } }});

/* ---------- hints ---------- */
const hints = G.hinter({game: () => game, key: () => game ? snap(game) : "", draw: () => draw()});
$("hintBtn").onclick = () => {
  if (!game || game.won) return;
  let mark = null, words = "";
  const k = game.orders.findIndex((o, k) => canGive(game, k) >= 0);
  if (k >= 0) { mark = {cat: game.orders[k].cat, sq: [canGive(game, k)]}; words = `Tap the cat to give it the ${NAMES_OF[game.orders[k].c + game.orders[k].t]}`; }
  else {
    const m = merges(game);
    if (m.length) { mark = {sq: m[0]}; const it = game.sq[m[0][1]]; words = it.web ? `Drag the ${NAMES_OF[it.item]} onto the one under the cobweb` : `Drag one ${NAMES_OF[it.item]} onto the other`; }
    else {
      const cs = ["t", "y"].filter(c => game.sq.some(s => s.gen === c) && game.orders.some(o => !o.done && o.c === c));
      const c = cs.map(c => [tapsWanted(game, c, false), c]).sort((a, b) => b[0] - a[0])[0];
      if (c && game.taps > 0) { mark = {sq: [game.sq.findIndex(s => s.gen === c[1])]}; words = `Tap the ${GEN_NAME[c[1]]} for more`; }
    }
  }
  if (!mark) { msg("Nothing to merge or give, and no taps left"); return; }
  game.hinted = true; save(); hints.show(mark, words);
};

/* ---------- how to play ---------- */
function help() {
  if (!game || busy) return;
  if (game.won) { G.helpLater(); return; }
  const W = game.W, xy = i => [i % W, i / W | 0];
  const gens = game.sq.map((s, i) => s.gen ? i : -1).filter(i => i >= 0), c0 = game.sq[gens[0]].gen;
  const box = game.sq.findIndex((s, i) => s.cover && nbrs(game, i).some(k => !game.sq[k].cover));
  const web = game.sq.findIndex(s => s.web);
  const open = game.sq.map((s, i) => i).filter(i => !game.sq[i].cover).map(xy);
  // on a room not yet started, the first taps and merge are made for real, then put back as they were (G.yourTurn)
  const fresh = !game.history.length && game.sq.some(s => !s.cover && !s.gen && !s.item);
  const ones = () => game.sq.filter(s => s.item === c0 + 1).length, ones0 = ones();
  const turn = G.yourTurn(() => game, g => { game = g; }, draw);
  const steps = [
    {say: "Each cat wants something", els: [$("orders")]},
    ...(fresh ? [
      {say: `Tap the ${GEN_NAME[c0].split(" ")[1]}: taps are limited`, lit: [xy(gens[0])], try: {done: () => ones() > ones0}, ...turn.from},
      {say: "Again, then drag one onto the other", lit: open,
       try: {done: () => game.sq.some(s => s.item === c0 + 2 && !s.web), yes: "Two the same make the next one up"}, ...turn.upTo}] : [
      {say: `Tap the ${GEN_NAME[c0].split(" ")[1]}: taps are limited`, lit: [xy(gens[0])]},
      {say: "Drag one onto another the same", lit: open}]),
    {say: "Glowing green? Tap the cat to give it", els: [$("orders")]},
    {say: "Merge beside a box to open it", lit: box >= 0 ? [xy(box)] : []},
    ...(web >= 0 ? [{say: "Merge one the same onto a cobweb", lit: [xy(web)]}] : []),
    {say: "Some cats want two things", els: [$("orders")], later: true},
    {say: "Now and then you get the other kind", lit: gens.map(xy), later: true},
    {say: `Keep ${game.goldAt} taps for a gold paw`, els: [$("count")], later: true},
    {say: "What's what is under the game", els: [$("key")], later: true},
    {say: "Stuck? Hint shows a move", els: [$("hintBtn")]},
  ];
  G.spotlight({grid: $("grid"), w: W, h: game.H, steps, map, done: () => { settings.seenHelp = true; save(); }});
}
function map() {
  const sq = $("grid").children, n = sq.length, a = sq[0].getBoundingClientRect(), z = sq[n - 1].getBoundingClientRect();
  const gx = (z.left - a.left) / (game.W - 1) - a.width, gy = (z.top - a.top) / (game.H - 1) - a.height;
  return {ox: a.left - gx / 2, oy: a.top - gy / 2, cw: a.width + gx, ch: a.height + gy};
}
$("helpBtn").onclick = help;

/* ---------- what's what ---------- */
for (const c of ["t", "y"]) {
  const ol = $(c === "t" ? "chainT" : "chainY");
  for (let t = 1; t <= MAXT; t++) {
    const li = document.createElement("li"), it = c + t, name = NAMES_OF[it];
    li.innerHTML = `<span class="pic">${svgOf(ART[it])}</span><span>${name[0].toUpperCase() + name.slice(1)}</span><span class="step">Step ${t}</span>`;
    ol.append(li);
  }
}
// picking something up names it, and what two of them make
function nameIt(i) {
  const it = game.sq[i].item, t = +it[1];
  msg(t < MAXT ? `A ${NAMES_OF[it]}: two make a ${NAMES_OF[it[0] + (t + 1)]}` : `A ${NAMES_OF[it]}: the very top!`);
}

/* ---------- share and best times ---------- */
// A link carries the level and the room's seed: the same seed deals the same room.
$("linkBtn").onclick = () => { if (game && !busy) G.shareCard({name: "Moving Day", won: game.won, what: "room", puzzle: () => ({g: SLUG, N: game.level, s: game.seed})}); };
function openShared(d) {
  if (!(Number.isInteger(d.N) && d.N >= 1 && d.N <= TOP) || !Number.isInteger(d.s)) { G.note("That share link didn't work.", 5000); return; }
  begin(deal(d.N, d.s));
}
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : settings.level || 1);

/* ---------- start ---------- */
G.nav(SLUG);
G.switch({id: "numTgl", label: "Numbers", line: "Each thing shows its step", key: "numbers", of: () => settings, save, change: () => { if (game) draw(); }});
G.setupTimer({name: SLUG, game: () => game, playing: g => !g.won, save, label: levelName, noun: "level"});
if (!(settings.level >= 1 && settings.level <= TOP)) settings.level = 1;
$("levelSel").value = settings.level;
const shared = G.readShare(SLUG);
const hadSave = !!(state.game && state.game.sq);
if (hadSave) G.reopen(() => {
    const g = state.game;
    if (!LEVELS[g.level] || g.sq.length !== 49 || !Array.isArray(g.orders) || typeof g.start !== "string") throw new Error("the saved room doesn't fit");
    game = g; G.checkClock(game); $("levelSel").value = game.level; draw();
    if (game.won) win(); else helpOnFirstVisit();
    build.prefetch(game.level);
  }, why => { game = null; startLevel(settings.level).then(() => G.note(why, 0)); });
else if (!shared) startLevel(settings.level);
const shareOpts = () => ({name: "Moving Day", inProgress: !!(game && !game.won && game.history.length), open: openShared, after: helpOnFirstVisit});
if (shared) G.offerShare(shared, {...shareOpts(), fresh: hadSave ? null : why => startLevel(settings.level).then(() => G.note(why, 6000))});
window.addEventListener("hashchange", () => { const d = G.readShare(SLUG); if (d) G.offerShare(d, shareOpts()); });
</script>
