.board{background:var(--panel)}
.cell{border-top:1px solid var(--line);border-left:1px solid var(--line);cursor:pointer}
.cell.r0{border-top:none}.cell.c0{border-left:none}
#yarn{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);pointer-events:none}
#yarn .trail,#yarn .shade,#yarn .twist{fill:none;stroke-linejoin:round}
#yarn .shade{stroke:var(--ink);stroke-opacity:.28;stroke-width:.5;stroke-linecap:round}
#yarn .trail{stroke-width:.42;stroke-linecap:round}
#yarn .twist{stroke:#fff;stroke-opacity:.45;stroke-width:.13;stroke-dasharray:.13 .13;stroke-linecap:round}

#yarn .num{fill:#fff;stroke:var(--ink);stroke-width:.06;paint-order:stroke;font-family:var(--font);font-weight:800;font-size:.34px;text-anchor:middle;dominant-baseline:central}
.skein{position:relative;width:var(--board);display:flex;flex-direction:column;gap:2px;
  padding-top:calc(var(--kw) * .843 - 11px)}  /* room for the kitten, whose paws rest on the strand */
/* Kittens: one pouncing over the board's top-left edge, one tangled in yarn below the bottom-right. */
/* Kittens: one pouncing onto the skein, one tangled in yarn below the board's bottom-right corner. */
main{--kw:min(calc(var(--board) * .34), 170px);--tw:min(calc(var(--board) * .52), 260px)}
.wrap{margin-bottom:calc(var(--tw) * .664 + 4px)}
@media (max-height:760px){ main{--kw:min(calc(var(--board) * .2), 100px)} }   /* a smaller kitten on short screens, so the board sits higher */
.pounce{position:absolute;width:var(--kw);height:auto;pointer-events:none;user-select:none;z-index:3}
.pounce.top{left:-1%;top:0}
.pounce.bottom{width:var(--tw);right:-1%;top:calc(100% + 4px)}
.strand{--b:22px;position:relative;height:30px}
.strand .ply{position:absolute;left:0;right:0;top:7px;height:16px;border-radius:8px;border:2px solid var(--ink);overflow:hidden}
.strand .ply::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.34) 0 3px,transparent 3px 8px)}
.bead{position:absolute;top:calc(15px - var(--b) / 2);width:var(--b);height:var(--b);margin-left:calc(var(--b) / -2);border-radius:50%;border:2px solid var(--ink)}
.bead.hit::after{content:"";position:absolute;inset:28%;border-radius:50%;background:var(--paper)}
.ends{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:600;color:var(--ink-soft)}

.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;user-select:none;white-space:nowrap}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.sw{flex:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.toggle input:checked + .sw{background:var(--sage-green)}
.toggle input:checked + .sw::after{left:21px}
.toggle input:focus-visible + .sw{outline:3px solid var(--pacific-blue);outline-offset:2px}

<script>
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function nbrs(i,N){const r=Math.floor(i/N),c=i%N,o=[];if(r>0)o.push(i-N);if(r<N-1)o.push(i+N);if(c>0)o.push(i-1);if(c<N-1)o.push(i+1);return o;}
// Random Hamiltonian path by "backbite" moves starting from a serpentine.
function randomPath(N){
  let p=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)p.push(r*N+(r%2?N-1-c:c));
  const M=N*N,pos=new Int32Array(M);
  const idx=()=>{for(let k=0;k<M;k++)pos[p[k]]=k;};idx();
  for(let it=0;it<M*40;it++){
    if(Math.random()<.5){p.reverse();idx();}
    const end=p[0],cand=nbrs(end,N).filter(v=>v!==p[1]);
    const v=cand[Math.floor(Math.random()*cand.length)],k=pos[v];
    // reverse p[0..k-1]: v stays adjacent to old end, new end is p[k-1]
    const head=p.slice(0,k).reverse();p=head.concat(p.slice(k));
    for(let j=0;j<k;j++)pos[p[j]]=j;
  }
  return p;
}
// Count solutions (up to limit) for a path through all cells hitting clue cells in order.
function solveYarn(N,clue,limit,budget){
  const M=N*N,vis=new Uint8Array(M),order=[],sols=[];let nodes=0,aborted=false;
  const K=Math.max(...clue);const start=clue.indexOf(1),fin=clue.indexOf(K);
  const nb=[];for(let i=0;i<M;i++)nb.push(nbrs(i,N));
  function ok(head,count){
    // every unvisited cell except fin needs >=2 open neighbours (head counts); fin needs >=1
    for(let u=0;u<M;u++){if(vis[u])continue;let d=0;for(const w of nb[u])if(!vis[w]||w===head)d++;
      if(d<(u===fin?1:2))return false;}
    // unvisited cells connected
    let seed=-1;for(const w of nb[head])if(!vis[w]){seed=w;break;}
    if(seed<0)return count===M;
    const seen=new Uint8Array(M),st=[seed];seen[seed]=1;let n=1;
    while(st.length){const u=st.pop();for(const w of nb[u])if(!vis[w]&&!seen[w]){seen[w]=1;n++;st.push(w);}}
    return n===M-count;
  }
  (function go(head,count,next){
    if(aborted)return true;
    if(++nodes>budget){aborted=true;return true;}
    if(count===M){sols.push(order.slice());return sols.length>=limit;}
    for(const v of nb[head]){
      if(vis[v])continue;
      if(clue[v]&&clue[v]!==next)continue;
      if(v===fin&&count+1!==M)continue;
      vis[v]=1;order.push(v);
      if(ok(v,count+1)&&go(v,count+1,clue[v]?next+1:next)){vis[v]=0;order.pop();return true;}
      vis[v]=0;order.pop();
    }
    return false;
  })(start,(vis[start]=1,order.push(start),1),2);
  return {sols,aborted,nodes};
}
// Drop clues one at a time (never the ends) while the answer stays unique.
function minimizeYarn(N,path,marks){
  const M=N*N,build=ms=>{const clue=new Array(M).fill(0);[...ms].sort((a,b)=>a-b).forEach((k,j)=>clue[path[k]]=j+1);return clue;};
  for(const k of shuffle([...marks].filter(k=>k!==0&&k!==M-1))){
    marks.delete(k);
    const r=solveYarn(N,build(marks),2,40000);
    if(r.aborted||r.sols.length!==1)marks.add(k);
  }
  return build(marks);
}
function makeYarn(N){
  const M=N*N;
  for(let attempt=0;attempt<30;attempt++){
    const path=randomPath(N);
    const marks=new Set([0,M-1]);
    const gap=Math.max(3,Math.round(M/(N+1)));
    for(let k=gap;k<M-2;k+=gap)marks.add(k+Math.floor(Math.random()*3)-1);
    for(let it=0;it<M;it++){
      const clue=new Array(M).fill(0);[...marks].sort((a,b)=>a-b).forEach((k,j)=>clue[path[k]]=j+1);
      const r=solveYarn(N,clue,2,60000);
      if(!r.aborted&&r.sols.length===1)return {N,path,clue:minimizeYarn(N,path,marks)};
      let add=-1;
      if(!r.aborted&&r.sols.length>1){const other=r.sols.find(s=>s.some((v,k)=>v!==path[k]))||r.sols[1];
        const diff=[];for(let k=1;k<M-1;k++)if(other[k]!==path[k]&&!marks.has(k))diff.push(k);
        add=diff[Math.floor(Math.random()*diff.length)];}
      if(add<0){ // too slow to decide: add a clue in the widest gap
        const s=[...marks].sort((a,b)=>a-b);let best=0,bi=0;for(let j=1;j<s.length;j++)if(s[j]-s[j-1]>best){best=s[j]-s[j-1];bi=j;}
        if(best<2)break;add=s[bi-1]+Math.floor(best/2);}
      marks.add(add);
    }
  }
  return null;
}

/* ---------- yarn colors ---------- */
// The colorways and the blending live in colorways.js, shared with Twirl.
// The Colors picker: which colorway set, and how much of it a puzzle uses.
const SHADES = {wide: {ramps: VARIEGATED, w: 1}, medium: {ramps: BLENDS, w: 1}, veryclose: {ramps: COLORWAYS, w: 1}};

// One color per ball, in order along a random slice of a colorway.
function yarnColors(K, level, name) {
  const {ramps, w} = SHADES[level] || SHADES.wide, names = Object.keys(ramps);
  if (!ramps[name]) name = names[Math.floor(Math.random() * names.length)];
  const a0 = Math.random() * (1 - w), ramp = Math.random() < .5 ? ramps[name] : ramps[name].slice().reverse();
  return {colorway: name, colors: Array.from({length: K}, (_, i) => rampAt(ramp, a0 + w * (K > 1 ? i / (K - 1) : 0)))};
}

const STORE = "catdoku.yarn.v1";
const $ = G.$;
let state = G.load(STORE);
let settings = Object.assign({size: 6, shades: "wide", numbers: false}, state.settings);
// Earlier versions saved it as a number, or offered a "close" level.
if (typeof settings.shades === "number") settings.shades = {1: "wide", .7: "medium", .5: "veryclose", .35: "veryclose"}[settings.shades] || "wide";
if (!SHADES[settings.shades]) settings.shades = settings.shades === "close" ? "veryclose" : "wide";
let game = state.game || null, busy = false;
const build = G.builder([shuffle, nbrs, randomPath, solveYarn, minimizeYarn, makeYarn], "makeYarn");
const save = () => G.save(STORE, {settings, game});

const lastNum = () => Math.max(...game.clue);
const adjacent = (a, b) => { const N = game.N; return Math.abs(a - b) === N || (Math.abs(a - b) === 1 && Math.floor(a / N) === Math.floor(b / N)); };
const nextNum = () => game.trail.reduce((n, k) => game.clue[k] ? game.clue[k] + 1 : n, 1);

// Try to extend the strand into square v. Returns true if it moved.
function step(v) {
  const t = game.trail, i = t.indexOf(v);
  if (i >= 0) { if (i < t.length - 1) { t.length = i + 1; return true; } return false; }
  if (!t.length) { if (game.clue[v] !== 1) return false; t.push(v); return true; }
  const end = t[t.length - 1];
  if (!adjacent(end, v)) return false;
  if (game.clue[end] === lastNum()) return false;           // the last number ends the strand
  if (game.clue[v] && game.clue[v] !== nextNum()) { G.note("That ball comes later on the skein."); return false; }
  t.push(v); return true;
}
// Fast drags skip squares: walk a straight line one square at a time.
function stepToward(v) {
  const t = game.trail, N = game.N;
  if (!t.length || t.includes(v)) return step(v);
  let end = t[t.length - 1], moved = false;
  const er = Math.floor(end / N), ec = end % N, vr = Math.floor(v / N), vc = v % N;
  if (er !== vr && ec !== vc) return step(v);
  const d = er === vr ? Math.sign(vc - ec) : N * Math.sign(vr - er);
  while (end !== v) { if (!step(end + d)) break; end += d; moved = true; }
  return moved;
}

// The finishing card: the next puzzle is a size up, and any other size can be picked instead.
const finishCard = () => G.winCard(yarnText(), newPuzzle, "Admire my yarn", game.result, {gold: !game.undid, goldWhy: "No undos!", 
  next: `Next puzzle (${settings.size} × ${settings.size})`,
  after: G.otherSize($("size"), settings.size, n => { settings.size = n; $("size").value = n; save(); newPuzzle(); })});
const yarnText = () => `Every inch of ${game.colorway} yarn is wound through all ${game.N * game.N} squares.`;
function checkWin() {
  const t = game.trail;
  if (t.length === game.N * game.N && game.clue[t[t.length - 1]] === lastNum()) {
    game.won = true; G.finishClock(game); save();
    G.track(`Yarn solved ${game.N}x${game.N}`);
    // A win moves the next puzzle up a size (there are no clues or lives to hold it back here).
    settings.size = G.sizeUp(game.N, $("size")); $("size").value = settings.size; save(); build.prefetch(settings.size);
    // Let the finished board show for a moment before the card covers it.
    const done = game;
    setTimeout(() => { if (game === done) finishCard(); }, 1400);
  }
}

function snapshot() { game.history.push(game.trail.slice()); if (game.history.length > 300) game.history.shift(); }
function undo() { if (!game.history.length || game.won) return; game.undid = true; game.trail = game.history.pop(); render(); save(); }
function clearAll() { if (game.won || !game.trail.length) return; game.undid = true; snapshot(); game.trail = []; render(); save(); }

async function newPuzzle() {
  if (busy) return;
  busy = true;
  const N = settings.size;
  G.openCard("Untangling yarn…", N >= 8 ? "Big boards can take a few seconds to build." : "", []);
  const p = await build.take(N);
  game = Object.assign({N, clue: p.clue, path: p.path, trail: [], history: [], won: false}, yarnColors(Math.max(...p.clue), settings.shades), G.freshClock());
  busy = false;
  G.closeCard(); buildBoard(); render(); save(); G.note("");
  G.track(`Yarn new puzzle ${N}x${N}`);
  build.prefetch(N);
}

function buildBoard() {
  const N = game.N, b = $("board");
  b.innerHTML = "";
  b.style.gridTemplateColumns = b.style.gridTemplateRows = `repeat(${N}, minmax(0, 1fr))`;
  for (let i = 0; i < N * N; i++) {
    const el = document.createElement("div");
    el.className = "cell" + (i < N ? " r0" : "") + (i % N ? "" : " c0");
    el.dataset.i = i; el.setAttribute("role", "gridcell");
    b.append(el);
  }
  $("yarn").setAttribute("viewBox", `0 0 ${N} ${N}`);
  $("size").value = N;
}

function svgEl(tag, attrs) { const el = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const a in attrs) el.setAttribute(a, attrs[a]); return el; }

/* ---------- balls of yarn ---------- */
// Shared clip and shading for every ball (drawn at radius 1, then scaled).
function ballDefs() {
  const defs = svgEl("defs", {}), clip = svgEl("clipPath", {id: "ballClip"});
  clip.append(svgEl("circle", {r: .96}));
  const lit = svgEl("radialGradient", {id: "ballLit", cx: .32, cy: .28, r: .75});
  lit.append(svgEl("stop", {offset: 0, "stop-color": "#fff", "stop-opacity": .38}), svgEl("stop", {offset: .55, "stop-color": "#fff", "stop-opacity": 0}));
  const dim = svgEl("radialGradient", {id: "ballDim", cx: .32, cy: .28, r: .95});
  dim.append(svgEl("stop", {offset: .55, "stop-color": "#2A2530", "stop-opacity": 0}), svgEl("stop", {offset: 1, "stop-color": "#2A2530", "stop-opacity": .35}));
  defs.append(clip, lit, dim);
  return defs;
}
// Strands wound around three axes, like a real ball: each group is a set of ellipses through the same two poles.
const WRAPS = [{rot: 18, ry: [.1, .3, .5, .7, .88]}, {rot: 108, ry: [.2, .45, .7]}, {rot: -40, ry: [.35, .62]}];
// A darker strand shade: lower lightness (less for pale balls), same hue; yellows lean gold instead of going olive.
function strandShade(color) {
  const [L, a, b] = hexLab(color), C = Math.hypot(a, b) * 1.15;
  let h = Math.atan2(b, a) * 180 / Math.PI;
  if (h > 75 && h < 102) h -= 22;
  return labHex([L - Math.min(.3, L * .4), C * Math.cos(h * Math.PI / 180), C * Math.sin(h * Math.PI / 180)]);
}
function yarnBall(color, r) {
  const dark = strandShade(color), light = rampAt([color, "#FFFFFF"], .5);
  const g = svgEl("g", {transform: `scale(${r})`});
  g.append(svgEl("ellipse", {cx: .04, cy: .97, rx: .7, ry: .12, fill: "#2A2530", "fill-opacity": .13}));
  g.append(svgEl("circle", {r: 1, fill: color}));
  const w = svgEl("g", {"clip-path": "url(#ballClip)"});
  for (const {rot, ry} of WRAPS) for (const k of ry) {
    w.append(svgEl("ellipse", {rx: 1, ry: k, fill: "none", "stroke-width": .05, stroke: light, "stroke-opacity": .8, transform: `rotate(${rot}) translate(0 -.045)`}));
    w.append(svgEl("ellipse", {rx: 1, ry: k, fill: "none", "stroke-width": .05, stroke: dark, transform: `rotate(${rot})`}));
  }
  g.append(w, svgEl("circle", {r: 1, fill: "url(#ballDim)"}), svgEl("circle", {r: 1, fill: "url(#ballLit)"}),
    svgEl("circle", {r: 1, fill: "none", stroke: dark, "stroke-width": .07}));
  return g;
}

// The skein at the top: an ombre strand with one bead per dot, marked once reached.
function renderSkein(reachedCount) {
  const cols = game.colors, K = cols.length, strand = $("strand");
  // Beads shrink on long yarns so the blend between them stays visible.
  const bead = Math.round(Math.max(10, Math.min(22, (strand.clientWidth || 360) / K * .5)));
  strand.style.setProperty("--b", bead + "px");
  const at = i => K > 1 ? i / (K - 1) : .5, pos = t => `calc(${bead / 2}px + (100% - ${bead}px) * ${t})`;
  strand.innerHTML = "";
  $("colorway").textContent = game.colorway;
  const ply = document.createElement("div"); ply.className = "ply";
  ply.style.background = `linear-gradient(90deg, ${cols.map((c, i) => `${c} ${pos(at(i))}`).join(", ")})`;
  strand.append(ply);
  cols.forEach((c, i) => {
    const b = document.createElement("div"); b.className = "bead" + (i < reachedCount ? " hit" : "");
    b.style.left = pos(at(i)); b.style.background = c; strand.append(b);
  });
}

function render() {
  const N = game.N, t = game.trail, svg = $("yarn"), cols = game.colors;
  const xy = k => [k % N + .5, Math.floor(k / N) + .5];
  svg.innerHTML = "";
  svg.append(ballDefs());
  // Each stretch of yarn takes the color of the last dot it passed.
  const segs = [];
  for (const k of t) {
    if (game.clue[k]) { if (segs.length) segs[segs.length - 1].cells.push(k); segs.push({color: cols[game.clue[k] - 1], cells: []}); }
    segs[segs.length - 1].cells.push(k);
  }
  for (const sg of segs) for (const k of sg.cells) { const [x, y] = xy(k); svg.append(svgEl("rect", {x: x - .5, y: y - .5, width: 1, height: 1, class: "fill", fill: sg.color})); }
  // The strand: a soft shadow, the dyed yarn in sections, then a stitched highlight for the plies.
  const whole = t.map(k => xy(k).join(","));
  if (whole.length === 1) whole.push(whole[0]);
  if (t.length) svg.append(svgEl("polyline", {points: whole.join(" "), class: "shade"}));
  for (const sg of segs) {
    const pts = sg.cells.map(k => xy(k).join(","));
    if (pts.length === 1) pts.push(pts[0]);
    svg.append(svgEl("polyline", {points: pts.join(" "), class: "trail", stroke: sg.color}));
  }
  if (t.length > 1) svg.append(svgEl("polyline", {points: whole.join(" "), class: "twist"}));
  const reached = new Set(t);
  game.clue.forEach((n, k) => {
    if (!n) return;
    const [x, y] = xy(k), g = svgEl("g", {transform: `translate(${x} ${y})`});
    g.append(yarnBall(cols[n - 1], .32));
    if (reached.has(k)) g.append(svgEl("circle", {r: .08, class: "knot"}));
    if (settings.numbers) { const tx = svgEl("text", {class: "num"}); tx.textContent = n; g.append(tx); }
    svg.append(g);
  });
  renderSkein(segs.length);
  $("count").textContent = `🧶 ${t.length} / ${N * N}`;
  $("undoBtn").disabled = !game.history.length || game.won;
  $("clearBtn").disabled = !t.length || game.won;
  [...$("board").children].forEach((el, k) =>
    el.setAttribute("aria-label", `Row ${Math.floor(k / N) + 1}, column ${k % N + 1}${game.clue[k] ? `, dot ${game.clue[k]} of ${cols.length}` : ""}${reached.has(k) ? ", on the yarn" : ""}`));
}

/* ---------- how to play ---------- */
// A tiny solved example: a three-ball skein over a 4 × 4 board with the strand drawn through it.
function exampleArt() {
  const cols = [0, .5, 1].map(t => rampAt(VARIEGATED.Carnival, t));
  const svg = svgEl("svg", {viewBox: "-0.1 -0.1 4.2 5.35", class: "howto", "aria-hidden": "true"});
  svg.append(ballDefs());
  const grad = svgEl("linearGradient", {id: "howtoSkein"});
  cols.forEach((c, i) => grad.append(svgEl("stop", {offset: i / 2, "stop-color": c})));
  svg.firstChild.append(grad);
  svg.append(svgEl("rect", {x: .3, y: .22, width: 3.4, height: .26, rx: .13, fill: "url(#howtoSkein)", stroke: "#2A2530", "stroke-width": .05}));
  [.3, 2, 3.7].forEach((x, i) => svg.append(svgEl("circle", {cx: x, cy: .35, r: .2, fill: cols[i], stroke: "#2A2530", "stroke-width": .05})));
  for (const [x, t] of [[.3, "Start"], [3.7, "End"]]) {
    const tx = svgEl("text", {x, y: .85, "text-anchor": "middle", "font-size": .26, "font-weight": 700, fill: "#5E5866"}); tx.textContent = t; svg.append(tx);
  }
  const g = svgEl("g", {transform: "translate(0 1.2)"});
  g.append(svgEl("rect", {width: 4, height: 4, rx: .1, fill: "#F7F8F3", stroke: "#2A2530", "stroke-width": .08}));
  for (let k = 1; k < 4; k++) g.append(svgEl("path", {d: `M${k} 0V4M0 ${k}H4`, stroke: "rgba(42,37,48,.22)", "stroke-width": .03}));
  // a snake through all 16 squares, with balls on squares 1, 10 and 16 of the path
  const path = [0, 1, 2, 3, 7, 6, 5, 4, 8, 9, 10, 11, 15, 14, 13, 12], at = k => [k % 4 + .5, Math.floor(k / 4) + .5];
  const segs = [path.slice(0, 10), path.slice(9)];
  segs.forEach((seg, i) => {
    const pts = seg.map(k => at(k).join(",")).join(" ");
    g.append(svgEl("polyline", {points: pts, fill: "none", stroke: "#2A2530", "stroke-opacity": .28, "stroke-width": .5, "stroke-linecap": "round", "stroke-linejoin": "round"}));
    g.append(svgEl("polyline", {points: pts, fill: "none", stroke: cols[i], "stroke-width": .42, "stroke-linecap": "round", "stroke-linejoin": "round"}));
  });
  [[path[0], 0], [path[9], 1], [path[15], 2]].forEach(([k, i]) => {
    const [x, y] = at(k), b = svgEl("g", {transform: `translate(${x} ${y})`}); b.append(yarnBall(cols[i], .32)); g.append(b);
  });
  svg.append(g);
  return svg;
}
function showHelp() {
  const media = document.createElement("div");
  media.append(exampleArt());
  const ol = document.createElement("ol"); ol.className = "steps";
  for (const t of ["The skein at the top shows the order of the colors, from Start to End.",
                   "Roll the ball that matches Start through every other ball, in that order.",
                   "Fill every square on the board.",
                   "Drag to roll the yarn. Tap the strand to cut it back to there."]) {
    const li = document.createElement("li"); li.textContent = t; ol.append(li);
  }
  media.append(ol);
  G.openCard("How to play", "", [["Show me on the board", () => { G.closeCard(); settings.seenHelp = false; helpOnFirstVisit(); }, true],
    ["Got it", () => { G.closeCard(); settings.seenHelp = true; save(); }]], media);
}
// First visit only: once the first puzzle is on the board, walk through it on the board itself,
// lighting each ball together with its dot on the skein above.
function spotlightSteps() {
  const N = game.N, at = k => [k % N, Math.floor(k / N)];
  const balls = game.clue.flatMap((n, k) => n ? [[...at(k), n]] : []).sort((a, b) => a[2] - b[2]).map(b => b.slice(0, 2));
  const beads = [...$("strand").querySelectorAll(".bead")], blanks = game.clue.flatMap((n, k) => n ? [] : [at(k)]);
  return [
    {say: "Start at the beginning", lit: [balls[0]], els: [beads[0]]},
    {say: "Drag to roll out the yarn", lit: [balls[0]], els: [beads[0]]},
    {say: "Connect the balls of yarn in order", lit: balls.slice(0, 2), outline: balls.slice(0, 2).map(c => [c]), els: beads.slice(0, 2)},
    {say: "Until you've connected every ball of yarn", lit: balls, outline: balls.map(c => [c]), els: [$("strand")]},
    {say: "And traveled through every blank space", lit: blanks},
  ];
}
function helpOnFirstVisit() {
  if (settings.seenHelp || !game || game.won || $("board").parentElement.querySelector(".spot")) return;
  G.spotlight({grid: $("board"), w: game.N, h: game.N, steps: spotlightSteps(), done: () => { settings.seenHelp = true; save(); }});
}

/* ---------- input ---------- */
let press = null;
const board = $("board");
board.addEventListener("pointerdown", e => {
  if (!game || game.won || busy) return;
  const i = G.cellAt(e.clientX, e.clientY); if (i < 0) return;
  e.preventDefault();
  try { board.setPointerCapture(e.pointerId); } catch (_) {}
  snapshot();                                          // dropped again in endPress if nothing changed
  const t = game.trail, onIt = t.indexOf(i);
  if (onIt >= 0) t.length = onIt + 1;                  // tap on the strand: cut it here
  else if (!t.length && game.clue[i] !== 1) { G.note("Start on the ball matching the Start end of the skein."); }
  else stepToward(i);
  press = {last: i};
  render(); checkWin();
});
board.addEventListener("pointermove", e => {
  if (!press || game.won) return;
  const i = G.cellAt(e.clientX, e.clientY);
  if (i < 0 || i === press.last) return;
  press.last = i;
  const t = game.trail;
  if (t.length > 1 && t[t.length - 2] === i) t.pop(); else stepToward(i);
  render(); checkWin();
});
function endPress() {
  if (!press) return;
  const h = game.history;
  if (h.length && h[h.length - 1].join() === game.trail.join()) h.pop();
  press = null; render(); save();
}
board.addEventListener("pointerup", endPress);
board.addEventListener("pointercancel", endPress);

$("newBtn").onclick = newPuzzle;
$("size").onchange = e => { settings.size = +e.target.value; save(); newPuzzle(); };
$("undoBtn").onclick = undo;
// Colors don't change the answer, so the current puzzle is simply re-dyed.
$("shades").onchange = e => {
  settings.shades = e.target.value;
  if (game) { Object.assign(game, yarnColors(game.colors.length, settings.shades, game.colorway)); render(); }
  save();
};
$("numTgl").onchange = e => { settings.numbers = e.target.checked; save(); if (game) render(); };
$("clearBtn").onclick = clearAll;
$("helpBtn").onclick = () => { if (!busy) showHelp(); };
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); } });

G.nav("yarn");
G.checkClock(game);
G.setupTimer({name: "yarn", game: () => game, playing: g => !g.won, save});
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.N : settings.size);

/* ---------- sharing ---------- */
$("shareBtn").onclick = () => { if (game && !busy) G.shareCard({name: "Yarn", won: game.won,
  puzzle: () => ({g: "yarn", N: game.N, clue: game.clue, path: game.path, colorway: game.colorway, colors: game.colors}),
  progress: () => ({trail: game.trail})}); };
// A puzzle from a share link, with its strand so far if one was sent (that isn't timed).
function openShared(d) {
  game = {N: d.N, clue: d.clue, path: d.path, trail: d.p ? d.p.trail : [], history: [], won: false,
          colorway: d.colorway, colors: d.colors, ...G.freshClock()};
  if (d.p) game.timed = false;
  settings.size = d.N; buildBoard(); render(); save(); G.note(""); build.prefetch(d.N);
  if (d.p) checkWin();
}
const shared = G.readShare("yarn");
$("numTgl").checked = settings.numbers;
$("shades").value = settings.shades;
$("size").value = settings.size;
if (game && game.clue && !game.colorway) Object.assign(game, yarnColors(Math.max(...game.clue), settings.shades));
if (game && game.clue) G.reopen(() => { buildBoard(); render(); if (game.won) finishCard(); build.prefetch(game.N); helpOnFirstVisit(); },
  why => { game = null; busy = false; newPuzzle().then(() => G.note(why, 0)); });
else if (!shared) newPuzzle().then(helpOnFirstVisit);
const shareOpts = () => ({name: "Yarn", inProgress: !!(game && game.clue && !game.won && game.history.length), open: openShared, after: helpOnFirstVisit});
if (shared) G.offerShare(shared, shareOpts());
// A share link opened while this page is already showing only changes the address, so watch for it.
window.addEventListener("hashchange", () => { const d = G.readShare("yarn"); if (d) G.offerShare(d, shareOpts()); });
</script>
