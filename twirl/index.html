.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.sw{flex:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.toggle input:checked + .sw{background:var(--sage-green)}

<script>
const $ = G.$;
G.nav("twirl");

/* ---------- levels (plain functions, also run in a background worker) ---------- */
// Levels run from an 18 × 27 mat of shorter, tidier ribbons to a 28 × 42 mat of long, winding ones that
// mostly point the long way across, so few can move at once. Level 0 comes first: a 9 × 14 mat, so every square
// (and every ribbon) shows twice as big as on level 1, with ribbons half as long to match.
// Past level 20 (since 2026-11-15), one new thing a level, on mats a little smaller than level 20's with ribbons as long
// and winding, then all three on the biggest mat: 21 ribbons pointed at both ends (`both`, a share of the ribbons), 22
// ribbons crossing over and under (`cross`, how many crossings), 23 ribbons tied together in
// pairs (`knots`, how many), and 24 all three. Then (the owner's picks, 2026-11-15) 25 a mat bigger than the screen
// (40 × 60, opening zoomed in, so you scroll round it); 26 every ribbon in one colour; 27 thin ribbons, drawn as pointed
// lines; and 28 very long ribbons (most 30 to 160 squares), with crossings and knots, all in shades of one colour family,
// so you have to keep track of which is which. (Level 25 was tiny ribbons, 2 to 4 squares long, until the owner took it
// out on 2026-11-16, and 26 to 29 became 25 to 28: see `movedDown`.)
// ROLL (100) is a band of Endless: 18 across and 9 down, no ribbon pointing down (see "Endless" below).
function params(n) {
  if (n === 0) return {W: 9, H: 14, shapes: 0.35, minLen: 3, maxLen: 8, straight: 0.5, ease: 0.6};
  if (n === 100) return {W: 18, H: 9, shapes: 0.2, minLen: 3, maxLen: 10, straight: 0.45, ease: 0.3, roll: true, both: 0, cross: 0, knots: 0};
  if (n > 20) {
    const e = [{W: 22, both: 0.3}, {W: 24, cross: 24}, {W: 26, knots: 14}, {W: 28, both: 0.15, cross: 16, knots: 10},
               {W: 40}, {W: 28, one: true}, {W: 28, thin: true},
               {W: 28, minLen: 40, maxLen: 160, shapes: 0, straight: 0.15, join: true, cross: 20, knots: 6, similar: true}][n - 21];
    return {...params(20), both: 0, cross: 0, knots: 0, ...e, H: Math.round(e.W * 1.5)};
  }
  const t = (n - 1) / 19, W = Math.round(18 + 10 * t);
  return {W, H: Math.round(W * 1.5), shapes: 0.35 - 0.1 * t, minLen: Math.round(4 + 6 * t), maxLen: Math.round(14 + 26 * t),
          straight: 0.5 - 0.3 * t, ease: 0.6 * (1 - t)};
}
// 1. Cover the whole mat with ribbons: shapes first (coils, spirals, staircases, zigzags), then winding
//    paths that hug what's already there, so nothing is left bare.
// 2. Point each ribbon, then play the board through, taking off any ribbon whose way out is clear. If
//    nothing can move, turn one ribbon round (or, as a last resort, cut one in two) so that something
//    can, picking the one whose way out opened up latest so the board stays tight from the start. The
//    playthrough is a solution, so every board can be cleared; it's played through again to be sure.
// A ribbon is its squares from tail to tip, and `dir` is the way its tip points (0 up, 1 right, 2 down, 3 left).
function makeTwirl(n) {
  const o = params(n), {W, H} = o, N = W * H, DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
  const rand = k => Math.floor(Math.random() * k);
  const nb = i => { const x = i % W, y = (i / W) | 0, r = []; if (y > 0) r.push(i - W); if (x < W - 1) r.push(i + 1); if (y < H - 1) r.push(i + W); if (x > 0) r.push(i - 1); return r; };
  const dirOf = (a, b) => b === a - W ? 0 : b === a + 1 ? 1 : b === a + W ? 2 : 3;
  const SHAPES = [
    () => { const a = 3 + rand(6), k = 2 + rand(4), m = []; for (let i = 0; i < k; i++) { for (let j = 0; j < a; j++) m.push(i % 2 ? 3 : 1); if (i < k - 1) m.push(2); } return m; },     // coil
    () => { const a = 3 + rand(4), m = []; for (let len = a, leg = 0; len > 0; leg++) { const d = [1, 2, 3, 0][leg % 4]; for (let j = 0; j < len; j++) m.push(d); if (leg >= 2 && leg % 2 === 0) len--; } return m; },   // spiral
    () => { const s = 1 + rand(2), k = 3 + rand(5), m = []; for (let i = 0; i < k; i++) { for (let j = 0; j < s; j++) m.push(1); m.push(2); } return m; },     // staircase
    () => { const k = 3 + rand(5), m = []; for (let i = 0; i < k; i++) m.push(1, i % 2 ? 2 : 0); return m; },     // zigzag
  ];
  // the square one step from i in direction d, or -1 off the mat
  const stepTo = (i, d) => { const x = i % W + DX[d], y = ((i / W) | 0) + DY[d]; return x < 0 || y < 0 || x >= W || y >= H ? -1 : y * W + x; };
  function cover() {
    const own = new Int32Array(N).fill(-1), paths = [], bare = i => own[i] < 0, bareN = i => nb(i).filter(bare).length, crossed = new Set();
    for (let shapeCells = 0, t = 0; shapeCells < o.shapes * N && t < 600; t++) {
      const moves = SHAPES[rand(4)](), rot = rand(4), flip = Math.random() < 0.5;
      let p = [rand(N)]; if (!bare(p[0])) continue;
      for (const m0 of moves) {
        const m = ((flip && (m0 === 1 || m0 === 3) ? 4 - m0 : m0) + rot) % 4, h = p[p.length - 1];
        const x = h % W + DX[m], y = ((h / W) | 0) + DY[m], j = y * W + x;
        if (x < 0 || y < 0 || x >= W || y >= H || !bare(j) || p.includes(j)) { p = null; break; }
        p.push(j);
      }
      if (!p) continue;
      p.forEach(i => own[i] = paths.length); paths.push(p); shapeCells += p.length;
    }
    for (;;) {   // winding paths, moving on to the square with the fewest bare neighbours
      let low = 9, starts = [];
      for (let i = 0; i < N; i++) if (bare(i)) { const k = bareN(i); if (k < low) { low = k; starts = [i]; } else if (k === low) starts.push(i); }
      if (!starts.length) break;
      const p = [starts[rand(starts.length)]], want = o.minLen + rand(o.maxLen - o.minLen + 1);
      own[p[0]] = paths.length;
      let d = -1;
      while (p.length < want) {
        const h = p[p.length - 1], opts = nb(h).filter(bare);
        if (!opts.length) break;
        opts.sort((a, b) => bareN(a) - bareN(b) + (Math.random() - 0.5) * 1.5);
        const straight = opts.find(j => d >= 0 && dirOf(h, j) === d);
        const next = straight !== undefined && Math.random() < o.straight ? straight : opts[0];
        d = dirOf(h, next); own[next] = paths.length; p.push(next);
      }
      paths.push(p);
    }
    for (let k = 0; k < paths.length; k++) {   // a lone square joins a ribbon ending next to it, where it can
      if (paths[k].length > 1) continue;
      const i = paths[k][0], host = paths.findIndex((q, h) => h !== k && q.length > 1 && (nb(i).includes(q[0]) || nb(i).includes(q[q.length - 1])));
      if (host < 0) continue;
      const q = paths[host]; if (nb(i).includes(q[0])) q.unshift(i); else q.push(i);
      paths.splice(k, 1); k--;
    }
    // Crossings (levels 22 and 24): where a ribbon runs straight through a square, the two ribbons on the squares
    // either side of it are each cut there, and a piece of one joins a piece of the other across it. Nothing's cut
    // next to a crossing already made, and no cut leaves a one-square scrap.
    if (o.cross) {
      paths.forEach((q, k) => q.forEach(i => { own[i] = k; }));
      const nearCross = q => q.some((c, i) => crossed.has(c) || crossed.has(q[i - 1]) || crossed.has(q[i + 1]));
      // ribbon A cut at u: [the piece ending at u, what's left], either way round
      const cutAt = (q, i, last) => {
        const ways = [[q.slice(0, i + 1), q.slice(i + 1)], [q.slice(i).reverse(), q.slice(0, i)]].map(([a, b]) => last ? [a, b] : [a.slice().reverse(), b]);
        return ways.filter(([, rest]) => rest.length !== 1).sort(() => Math.random() - 0.5)[0];
      };
      for (const j of [...Array(N).keys()].sort(() => Math.random() - 0.5)) {
        if (crossed.size >= o.cross) break;
        const q = paths[own[j]], at = q.indexOf(j);
        if (at < 1 || at >= q.length - 1 || crossed.has(j)) continue;
        const e = dirOf(q[at - 1], j); if (e !== dirOf(j, q[at + 1])) continue;
        const u = stepTo(j, (e + 1) % 4), v = stepTo(j, (e + 3) % 4);
        if (u < 0 || v < 0) continue;
        const A = own[u], B = own[v];
        if (A === B || A === own[j] || B === own[j] || crossed.has(u) || crossed.has(v)) continue;
        const pa = paths[A], pb = paths[B];
        if (pa.some(i => crossed.has(i) && pb.includes(i))) continue;   // two that already cross: joined, one would cross itself
        if (nearCross(pa.slice(Math.max(0, pa.indexOf(u) - 1), pa.indexOf(u) + 2)) || nearCross(pb.slice(Math.max(0, pb.indexOf(v) - 1), pb.indexOf(v) + 2))) continue;
        const ca = cutAt(pa, pa.indexOf(u), true), cb = cutAt(pb, pb.indexOf(v), false);
        if (!ca || !cb) continue;
        paths[A] = [...ca[0], j, ...cb[0]]; paths[B] = cb[1];
        for (const i of cb[0]) if (own[i] === B) own[i] = A;
        if (ca[1].length) { paths.push(ca[1]); for (const i of ca[1]) if (own[i] === A) own[i] = paths.length - 1; }
        crossed.add(j);
      }
    }
    for (let k = paths.length - 1; k >= 0; k--) if (!paths[k].length) paths.splice(k, 1);
    // Level 28: a ribbon left short (its path ran into a dead end, or it was cut to make a crossing) is joined end to
    // end with a neighbour whose end touches one of its own, again and again, so nearly every ribbon is long. Never two
    // that cross each other: joined, the ribbon would cross itself.
    if (o.join) for (let joined = true; joined;) {
      joined = false;
      for (let k = 0; k < paths.length && !joined; k++) {
        const q = paths[k]; if (q.length >= o.minLen) continue;
        for (let h = 0; h < paths.length && !joined; h++) {
          const r = paths[h]; if (h === k || q.length + r.length > o.maxLen || q.some(i => crossed.has(i) && r.includes(i))) continue;
          // the four ways two ends can meet; the joined ribbon runs q then r
          for (const [a, b] of [[q, r], [q, r.slice().reverse()], [q.slice().reverse(), r], [q.slice().reverse(), r.slice().reverse()]])
            if (nb(a[a.length - 1]).includes(b[0])) { paths[k] = [...a, ...b]; paths.splice(h, 1); joined = true; break; }
        }
      }
    }
    return {paths, crossed};
  }
  // A crossing is {cell, top, under}: the ribbon underneath can't go while the one on top is still there. `cnt` is how
  // many ribbons lie on each square (two where they cross).
  function settle({paths, crossed}) {
    const cnt = new Int8Array(N), clearedAt = new Int32Array(N).fill(-1);
    const rb = paths.map(cells => { cells.forEach(i => cnt[i]++); return {cells, dir: cells.length > 1 ? dirOf(cells[cells.length - 2], cells[cells.length - 1]) : rand(4)}; });
    const cross = [...crossed].map(cell => { const two = []; rb.forEach((r, k) => { if (r.cells.includes(cell)) two.push(k); }); if (Math.random() < 0.5) two.reverse(); return {cell, top: two[0], under: two[1]}; });
    const walk = (h, d, f) => { for (let x = h % W + DX[d], y = ((h / W) | 0) + DY[d]; x >= 0 && y >= 0 && x < W && y < H; x += DX[d], y += DY[d]) if (f(y * W + x) === false) return false; return true; };
    const laneLen = (h, d) => { let k = 0; walk(h, d, () => { k++; }); return k; };
    const clear = (h, d) => !(o.roll && d === 2) && walk(h, d, i => cnt[i] === 0);   // in Endless, nothing goes down
    const late = (h, d) => { let m = -1; walk(h, d, i => { m = Math.max(m, clearedAt[i]); }); return m; };
    const head = r => r.cells[r.cells.length - 1];
    const turn = r => { r.cells.reverse(); r.dir = dirOf(r.cells[r.cells.length - 2], head(r)); };
    for (const r of rb) {   // point each ribbon: hard boards the long way across, easy ones often toward the nearer edge
      if (r.cells.length === 1) continue;
      const now = laneLen(head(r), r.dir), back = laneLen(r.cells[0], dirOf(r.cells[1], r.cells[0])), near = Math.random() < o.ease;
      if ((near && back < now) || (!near && back > now)) turn(r);
      if (o.roll && r.dir === 2) turn(r);
    }
    const gone = new Set(); let step = 0, fixes = 0;
    const pins = k => cross.filter(x => x.under === k && !gone.has(x.top));
    // a ribbon cut in two: the crossings on the part that became ribbon m go with it
    const moveCross = (k, m, cells) => { for (const x of cross) for (const role of ["top", "under"]) if (x[role] === k && cells.includes(x.cell)) x[role] = m; };
    const crossAt = k => new Set(cross.filter(x => x.top === k || x.under === k).map(x => x.cell));
    while (gone.size < rb.length) {
      const live = []; for (let k = 0; k < rb.length; k++) if (!gone.has(k)) live.push(k);
      const free = live.filter(k => !pins(k).length && clear(head(rb[k]), rb[k].dir));
      if (free.length) {
        const k = free[rand(free.length)]; gone.add(k); step++;
        rb[k].cells.forEach(i => { cnt[i]--; clearedAt[i] = step; });
        continue;
      }
      if (++fixes > 4 * rb.length) return null;
      // stuck: of every way to turn a ribbon round or cut one in two so an end can get out, take the one
      // whose way out opened latest. Cutting is a last resort, and never leaves a one-square scrap if it can help it.
      let best = null;
      const offer = (score, fn) => { score += Math.random() * 0.5; if (!best || score > best.score) best = {score, fn}; };
      const cutCost = (a, b) => 3 + (a.length < 2 || b.length < 2 ? 40 : a.length < 4 || b.length < 4 ? 6 : 0);
      for (const k of live) {
        const r = rb[k], c = r.cells, pinned = pins(k), xs = crossAt(k);
        // pinned under another with its way out clear: the crossing can be the other way up
        if (pinned.length) { if (clear(head(r), r.dir)) for (const x of pinned) offer(late(head(r), r.dir) - 1, () => { [x.top, x.under] = [x.under, x.top]; }); }
        if (c.length === 1) { if (!pinned.length) for (let d = 0; d < 4; d++) if (clear(c[0], d)) offer(late(c[0], d), () => { r.dir = d; }); continue; }
        const bd = dirOf(c[1], c[0]);
        if (!pinned.length && clear(c[0], bd)) offer(late(c[0], bd), () => turn(r));
        const pinnedOn = cells => pinned.some(x => cells.includes(x.cell));
        for (let i = 0; i < c.length - 1; i++) {
          if (xs.has(c[i]) || xs.has(c[i + 1])) continue;   // a crossing never ends up at the end of a ribbon

  if (kbAt >= 0) { ctx.lineWidth = 3 / scale; ctx.strokeStyle = G.CURSOR; ctx.strokeRect(kbAt % d.W * U + 1, Math.floor(kbAt / d.W) * U + 1, U - 2, U - 2); }

  moving = moving.filter(m => now < m.t0 + 2.5);

}

/* ---------- size and zoom ---------- */
// At "Fit" the whole mat shows; zooming makes it bigger inside its frame, which scrolls. In full screen the frame
// takes all the room there is, and the mat lies sideways when its squares come out bigger that way.
const matW = () => S.d.W + 2 * PAD, matH = () => S.d.H + 2 * PAD;
const shownW = () => side ? matH() : matW(), shownH = () => side ? matW() : matH();   // across and down, as shown
const full = () => document.body.classList.contains("full");
function room() {
  const zb = zoomer ? zoomer.el.offsetHeight + 6 : 0;   // the zoom buttons under the mat
  if (full()) { const w = $("wrap"); return [w.clientWidth - 6, w.clientHeight - 6 - zb]; }
  if (G.sideways()) return [scroller.parentElement.clientWidth - 6, window.innerHeight - 12 - scroller.offsetTop - 6 - zb];
  return [scroller.parentElement.clientWidth - 6, window.innerHeight * 0.78 - 6 - zb];
}
// Level 25's huge mat opens zoomed in, its squares 26 pixels (zOpen), so you scroll round it; Fit zooms all the way
// out to show the whole mat, tiny (its ribbons little more than 1-point lines on a phone: the owner's call, 2026-11-16;
// until then it never zoomed out past 26 pixels and had no Fit).
let zMin = 1, zMax = 4, zOpen = 1;
function layout(keep) {
  if (!S) return;
  const [aw, ah] = room(), was = side;
  side = full() && Math.min(aw / matH(), ah / matW()) > Math.min(aw / matW(), ah / matH()) * 1.05;
  if (side !== was) { zoom = 1; opening = true; keep = null; keys.hide(); }
  const fitW = Math.min(aw, ah * shownW() / shownH()), huge = S.d.W >= 40;
  zOpen = huge ? Math.max(1, 26 / (fitW / shownW())) : 1; zMax = Math.max(4, zOpen * 1.8);
  if (opening) { zoom = zOpen; opening = false; }
  zoom = Math.max(zMin, Math.min(zMax, zoom));
  const cssW = fitW * zoom, cssH = cssW * shownH() / shownW();
  const before = keep && canvas.clientWidth && {fx: (scroller.scrollLeft + keep.x) / canvas.clientWidth, fy: (scroller.scrollTop + keep.y) / canvas.clientHeight};
  scroller.style.height = `${Math.min(cssH, ah) + 6}px`;
  scroller.style.width = zoomer.el.style.width = full() ? `${Math.min(cssW, aw) + 6}px` : "";
  canvas.style.width = `${cssW}px`; canvas.style.height = `${cssH}px`;
  const dpr = Math.min(window.devicePixelRatio || 1, 4096 / Math.max(cssW, cssH));
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  scale = canvas.width / (shownW() * U);
  if (before) { scroller.scrollLeft = before.fx * cssW - keep.x; scroller.scrollTop = before.fy * cssH - keep.y; }

}
function setZoom(z, at) {
  z = Math.max(zMin, Math.min(zMax, z));
  if (!S || Math.abs(z - zoom) < 0.01) return;
  zoom = z; layout(at || {x: scroller.clientWidth / 2, y: scroller.clientHeight / 2});
}
let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => layout(), 150); });
// zoom and full screen under the mat's corner (G.zoom), as the mat at Fit can't be moved from under them, with Hint
// in the middle of that line (decided 2026-11-08), to take less room
zoomer = G.zoom({at: $("wrap"), below: true, mid: $("hintBtn"), zoomIn: () => setZoom(zoom * 1.5), zoomOut: () => setZoom(zoom / 1.5),
  more: {label: "Fit", name: "Fit the whole mat", fn: () => setZoom(zMin)}, full: {name: "Twirl", change: () => layout()}});
zoomer.can(true, false, false);
$("wrap").insertBefore(zoomer.el, $("overlay"));
// A square as shown (x across, y down) and on the mat, which differ when the mat lies sideways; and a point
// (in squares) and a direction, for the walkthrough's arrows.
const shownXY = (x, y) => side ? [S.d.H - 1 - y, x] : [x, y];
const matXY = (x, y) => side ? [y, S.d.H - 1 - x] : [x, y];
const shownPt = (x, y) => side ? [S.d.H - y, x] : [x, y];
const shownDir = (dx, dy) => side ? [-dy, dx] : [dx, dy];
scroller.addEventListener("wheel", e => {   // ctrl/⌘ + scroll (and trackpad pinches) zoom
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault(); const r = scroller.getBoundingClientRect();
  setZoom(zoom * Math.exp(-e.deltaY * 0.01), {x: e.clientX - r.left, y: e.clientY - r.top});
}, {passive: false});

/* ---------- touch: tap a ribbon, drag to look around, pinch to zoom ---------- */
const pointers = new Map();
let pan = null, pinch = null;
scroller.addEventListener("pointerdown", e => {
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  try { scroller.setPointerCapture(e.pointerId); } catch (_) {}
  if (pointers.size === 1) pan = {x: e.clientX, y: e.clientY, sl: scroller.scrollLeft, st: scroller.scrollTop, moved: false};
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()], r = scroller.getBoundingClientRect();
    pinch = {dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, zoom, at: {x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top}};
    if (pan) pan.moved = true;
  }
});
scroller.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pinch && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    setZoom(pinch.zoom * Math.hypot(a.x - b.x, a.y - b.y) / pinch.dist, pinch.at);
  } else if (pan) {
    const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
    if (Math.hypot(dx, dy) > 8) pan.moved = true;
    if (pan.moved) { scroller.scrollLeft = pan.sl - dx; scroller.scrollTop = pan.st - dy; }
  }

function release(e, tapIt) {
  if (!pointers.has(e.pointerId)) return;

scroller.addEventListener("pointerup", e => release(e, true));
scroller.addEventListener("pointercancel", e => release(e, false));
function tapAt(cx, cy) {
  if (!S || S.over || loading) return;

  const [x, y] = matXY(Math.floor((cx - r.left) / r.width * shownW() - PAD), Math.floor((cy - r.top) / r.height * shownH() - PAD));
  if (x < 0 || y < 0 || x >= d.W || y >= d.H) return;
  const k = occupancy()[y * d.W + x];
  if (k >= 0 && !tugs.some(t => t.k === k)) tap(k, y * d.W + x);
}

// Keys: the arrows move a cursor over the mat (it scrolls along when zoomed), and Space or Enter taps the ribbon
// under it.
let kbAt = -1;
const keys = G.gridKeys({on: () => S && !S.over && !loading, start: () => Math.floor(S.d.H / 2) * S.d.W + Math.floor(S.d.W / 2),
  move: (i, dx, dy) => {   // the way the arrow points on the screen, which on a mat lying sideways is another way on the mat
    const [mx, my] = side ? [dy, -dx] : [dx, dy], W = S.d.W;
    return Math.max(0, Math.min(S.d.H - 1, Math.floor(i / W) + my)) * W + Math.max(0, Math.min(W - 1, i % W + mx));
  },
  show: i => {
    kbAt = i; if (i < 0) return;
    const cw = canvas.clientWidth / shownW(), [sx, sy] = shownXY(i % S.d.W, Math.floor(i / S.d.W)), x = (sx + PAD) * cw, y = (sy + PAD) * cw;
    if (x < scroller.scrollLeft || x + cw > scroller.scrollLeft + scroller.clientWidth) scroller.scrollLeft = x - scroller.clientWidth / 2;
    if (y < scroller.scrollTop || y + cw > scroller.scrollTop + scroller.clientHeight) scroller.scrollTop = y - scroller.clientHeight / 2;
  },
  act: i => { const k = occupancy()[i]; if (k >= 0 && !tugs.some(t => t.k === k)) tap(k, i); }});
let last = performance.now();
function loop(t) { now += Math.min(0.05, (t - last) / 1000); last = t; draw(); requestAnimationFrame(loop); }

/* ---------- how to play ---------- */
function helpCard(tries = 0) {
  // a level still being set out is waited for, then the walkthrough plays
  if (loading && !document.querySelector(".spot")) { if (tries < 20) setTimeout(() => helpCard(tries + 1), 250); return; }
  intro(true);
  if (!document.querySelector(".spot")) G.helpLater();
}
/* ---------- first-time spotlight ---------- */
// The first visit (or How to play) walks through the mat that's out: a ribbon that's free to
// go and the way it'll slide, a blocked ribbon and what's in its way, the lives, the mat, and zoom.
const INTRO = "catdoku.twirl.intro.v1";
// What a ribbon would hit if tapped now: [the ribbon, the square], or null if it's free.
function blockerOf(k) { const d = S.d, gone = new Set(d.gone), m = goes(d, liveAt(d, gone), gone, k, false); return m.stop || null; }
function intro(again) {
  if (!again && G.load(INTRO).seen) return;
  if (!S || S.over || loading || document.querySelector(".spot")) { if (!again) setTimeout(intro, 400); return; }
  const d = S.d, gone = new Set(d.gone), xy = i => [i % d.W, (i / d.W) | 0];
  const here = d.ribbons.map((_, k) => k).filter(k => !gone.has(k));
  const mid = k => { const [x, y] = xy(d.ribbons[k].cells[d.ribbons[k].cells.length >> 1]); return Math.abs(x - d.W / 2) + Math.abs(y - d.H / 2); };
  // a free ribbon of three squares or more near the middle; its arrow lies along it, ending just past its tip
  const free = here.filter(k => !blockerOf(k)).sort((a, b) => (d.ribbons[b].cells.length >= 3) - (d.ribbons[a].cells.length >= 3) || mid(a) - mid(b))[0];
  const stuck = here.filter(k => blockerOf(k)).sort((a, b) => mid(a) - mid(b))[0];
  const map = () => { const r = canvas.getBoundingClientRect(); return {ox: r.left + PAD / shownW() * r.width, oy: r.top + PAD / shownH() * r.height, cw: r.width / shownW(), ch: r.height / shownH()}; };
  const cellsOf = k => d.ribbons[k].cells.map(i => shownXY(...xy(i))), steps = [];
  if (free !== undefined) {
    const r = d.ribbons[free], [hx, hy] = xy(r.cells[r.cells.length - 1]), [dx, dy] = DIRS[r.dir], [ax, ay] = shownDir(-dx, -dy);
    // Your turn: send a free ribbon off for real (it's kept: any free ribbon can go, so nothing is given away)
    steps.push({say: "A ribbon slides where it points", lit: cellsOf(free), arrows: [{to: shownPt(hx + 0.5 + dx * 0.9, hy + 0.5 + dy * 0.9), from: [ax, ay], size: 1.7}]},
               {say: "Tap it to send it off", lit: cellsOf(free), try: {done: () => S.d.gone.includes(free), yes: "Off it goes!"}});
  }
  if (stuck !== undefined) {
    const [b, at] = blockerOf(stuck), [bx, by] = shownXY(...xy(at));
    steps.push({say: "A blocked one can't go", lit: [...cellsOf(stuck), ...cellsOf(b)], outline: [cellsOf(stuck), cellsOf(b)], marks: [[bx, by, "❌", 0.7]]});
  }
  steps.push({say: "A blocked tap costs a life", els: [$("hearts")]},
             {say: "Stuck? Hint shows a free one", els: [$("hintBtn")]},
             {say: "Clear every ribbon", lit: here.flatMap(cellsOf)},
             {say: "Pinch or + and − to zoom", els: [zoomer.el], later: true});
  G.spotlight({grid: canvas, w: side ? d.H : d.W, h: side ? d.W : d.H, map, steps, done: () => G.save(INTRO, {...G.load(INTRO), seen: true})});
}
// The first time each new thing of levels 21 to 24 is on the mat, a step of its own (after the first visit's walkthrough).
function newThings() {
  if (!S || S.over || loading || document.querySelector(".spot") || !G.load(INTRO).seen) return;
  const d = S.d, seen = G.load(INTRO), gone = new Set(d.gone), xy = i => [i % d.W, (i / d.W) | 0], steps = [], fresh = {};
  const cellsOf = k => d.ribbons[k].cells.map(i => shownXY(...xy(i)));
  const near = ks => ks.sort((a, b) => dist(a) - dist(b))[0], dist = k => { const [x, y] = xy(d.ribbons[k].cells[d.ribbons[k].cells.length >> 1]); return Math.abs(x - d.W / 2) + Math.abs(y - d.H / 2); };
  const both = near(d.ribbons.map((r, k) => k).filter(k => d.ribbons[k].both && !gone.has(k)));
  if (!seen.both && both !== undefined) {
    fresh.both = true;
    steps.push({say: "Pointed both ways: tap near the end it should leave by", lit: cellsOf(both)});
  }
  const x = d.cross.filter(([, t, u]) => !gone.has(t) && !gone.has(u)).sort((a, b) => dist(a[1]) - dist(b[1]))[0];
  if (!seen.cross && x) {
    fresh.cross = true;
    steps.push({say: "Where two cross, the one on top goes first", lit: [...cellsOf(x[1]), ...cellsOf(x[2])], outline: [cellsOf(x[1])]});
  }
  const kn = d.knots.filter(([a, b]) => !gone.has(a) && !gone.has(b)).sort((a, b) => dist(a[0]) - dist(b[0]))[0];
  if (!seen.knot && kn) {
    fresh.knot = true;
    steps.push({say: "Tied together: both go at once, when both are free", lit: [...cellsOf(kn[0]), ...cellsOf(kn[1])]});
  }
  if (!steps.length) return;
  const map = () => { const r = canvas.getBoundingClientRect(); return {ox: r.left + PAD / shownW() * r.width, oy: r.top + PAD / shownH() * r.height, cw: r.width / shownW(), ch: r.height / shownH()}; };
  G.spotlight({grid: canvas, w: side ? d.H : d.W, h: side ? d.W : d.H, map, steps, done: () => G.save(INTRO, {...G.load(INTRO), ...fresh})});
}
$("helpBtn").onclick = () => helpCard();
$("hintBtn").onclick = hint;
G.setupTimer({name: "twirl", game: () => S, playing: g => !g.over && !loading, save,
  label: n => `Level ${n}`, noun: "level",
  emptyText: "Finish a level and your times will show up here. They're kept on this device only."});
$("bestBtn").onclick = () => G.showBests("Best times", S ? S.level : saved.level ?? 1);

// New players start on level 0, the small mat with the biggest ribbons.
const shared = G.readShare("twirl");
window.addEventListener("hashchange", () => { const d = G.readShare("twirl"); if (d) G.offerShare(d, {name: "Twirl", inProgress: !!(S && !S.over && S.d.gone.length), open: d => { try { openShared(d); } catch (e) { G.note("That share link didn't work.", 5000); } }}); });
// a shared mat opens in place of the saved one
let openedShare = false;
if (shared) try { openShared(shared); openedShare = true; G.note("Here's the shared mat. Good luck!", 6000); G.track("Twirl shared puzzle opened"); } catch (e) { G.note("That share link didn't work.", 5000); }
// a link that didn't work says so again once the board's own note has shown
const saySorry = () => { if (shared && !openedShare) G.note("That share link didn't work.", 6000); };
// A cleared mat saved before that fix opens the level its win moved you to (kept on the mat as climbed.next).
if (saved.d && !saved.d.roll && saved.d.climbed && saved.d.ribbons && saved.d.gone && saved.d.gone.length >= saved.d.ribbons.length) { saved.level = saved.d.climbed.next; delete saved.d; }
if (!openedShare) G.reopen(() => { if (saved.d && (saved.level <= MAX_LEVEL || (saved.level === ROLL && saved.d.roll))) { start(saved.level, saved.d); saySorry(); } else startLevel(saved.level ?? 0).then(saySorry); },
  why => { startLevel(saved.level ?? 0).then(() => G.note(why, 0)); });
// Players from before the spotlight had the How to play card instead, so it's only for new players.
if (saved.level !== undefined && !G.load(INTRO).seen) G.save(INTRO, {seen: true});
intro();
requestAnimationFrame(loop);
</script>
