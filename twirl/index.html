<style>
/* A play mat covered in satin ribbons; each one slides off the way its pointed end points, along its own path.
   Big mats zoom, and scroll inside their frame. */
.wrap.mat{height:auto}
.scroller{overflow:auto;border:3px solid var(--ink);border-radius:12px;background:var(--panel);touch-action:none;
  user-select:none;-webkit-user-select:none;overscroll-behavior:contain}
.scroller canvas{display:block;margin:0 auto;cursor:pointer}
.status .info{display:flex;align-items:center;gap:10px}
.hearts{font-size:20px;letter-spacing:1px;color:var(--fuchsia-plum)}
.hearts .lost{color:var(--line)}
.zoom{display:flex;gap:6px;align-items:center}
.zoom button{padding:2px 12px;min-width:40px}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;user-select:none;white-space:nowrap}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.sw{flex:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.toggle input:checked + .sw{background:var(--sage-green)}
.toggle input:checked + .sw::after{left:21px}
.toggle input:focus-visible + .sw{outline:3px solid var(--pacific-blue);outline-offset:2px}
/* Bugsy, Twirl's mascot: curled up beside the title, and peeking over the mat */
.title{display:flex;align-items:flex-end;gap:8px}
.bugsy{display:block;height:50px;width:auto;margin-bottom:-2px}
@media (max-height:760px){.bugsy{height:36px;margin-bottom:-2px}}
/* Bugsy peeks over the top corner of the mat, chin on its edge (the rest tucked behind the mat) */
:root{--peek:clamp(64px,17vw,92px)}
.peek{position:absolute;right:10px;top:calc(var(--peek) * -.6);width:var(--peek);height:auto;z-index:0;pointer-events:none;user-select:none}
.scroller{position:relative;z-index:1}
.status{padding-right:calc(var(--peek) + 16px)}   /* keep the line above clear of Bugsy */
/* On a phone held sideways (games.css), room above the mat for Bugsy, and the line beside it needs none */
@media (orientation:landscape) and (max-height:500px){
  body:not(.full) main > .wrap.mat.stage{padding-top:calc(var(--peek) * .6)}
  body:not(.full) main > .wrap.mat.stage .peek{top:0}
  body:not(.full) main:has(> .stage) .status{padding-right:0}
}
/* Full screen (G.fullScreen): the mat as big as the screen takes, laid sideways when that makes it bigger, with
   the lives above it and Hint, Restart and zoom below. */
body.full main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;align-items:stretch;gap:6px 10px}
body.full .status{grid-column:1 / 3;width:100%}
body.full .wrap.mat{grid-column:1 / 3;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
body.full .actions{width:auto;justify-self:end}
body.full .actions > :not(#hintBtn,#restartBtn),body.full .bar > :not(.zoom),body.full .toggles{display:none}
body.full .bar{width:auto;justify-self:start}
.zoom .fsBtn{padding:2px 10px}
body.full .actions{gap:8px;align-self:center}
body.full .actions button{padding:6px 12px}
body.full .bar{align-self:center}
body.full .zoom{gap:4px}
body.full .zoom button{min-width:34px;padding:2px 8px}
body.full .peek{display:none}   /* Bugsy's corner of the mat moves about in full screen */
/* on a phone, tighter buttons; held sideways, the lives and buttons go in a
   narrow column beside the mat, which gets the whole height */
@media (max-width:600px),(max-height:500px){
  body.full main{gap:4px 8px}
  body.full .status{padding-right:0}
  body.full .actions button{padding:6px 10px}
  body.full .zoom button{min-width:30px;padding:2px 6px}
}
@media (max-width:600px) and (orientation:landscape),(max-height:500px) and (orientation:landscape){
  body.full main{grid-template-columns:minmax(0,1fr) 116px;grid-template-rows:auto minmax(0,1fr) auto auto}
  body.full .status{grid-column:2;grid-row:1;flex-direction:column;align-items:flex-start;gap:2px}
  body.full .status .info{flex-direction:column;align-items:flex-start;gap:0;font-size:15px}
  body.full .msg{flex:none;text-align:left;font-size:14px}

  body.full .zoom{display:grid;grid-template-columns:1fr 1fr;width:100%}
}

<main>

<script>
const $ = G.$;
G.nav("twirl");

/* ---------- levels (plain functions, also run in a background worker) ---------- */
// Levels run from an 18 × 27 mat of shorter, tidier ribbons to a 28 × 42 mat of long, winding ones that
// mostly point the long way across, so few can move at once. Level 0 comes first: a 9 × 14 mat, so every square
// (and every ribbon) shows twice as big as on level 1, with ribbons half as long to match.
function params(n) {
  if (n === 0) return {W: 9, H: 14, shapes: 0.35, minLen: 3, maxLen: 8, straight: 0.5, ease: 0.6};
  const t = (n - 1) / 19, W = Math.round(18 + 10 * t);
  return {W, H: Math.round(W * 1.5), shapes: 0.35 - 0.1 * t, minLen: Math.round(4 + 6 * t), maxLen: Math.round(14 + 26 * t),
          straight: 0.5 - 0.3 * t, ease: 0.6 * (1 - t)};
}
// 1. Cover the whole mat with ribbons: shapes first (coils, spirals, staircases, zigzags), then winding
//    paths that hug what's already there, so nothing is left bare.
// 2. Point each ribbon, then play the board through, taking off any ribbon whose way out is clear. If
//    nothing can move, turn one ribbon round (or, as a last resort, cut one in two) so that something
//    can, picking the one whose way out opened up latest so the board stays tight from the start. The
//    playthrough is a solution, so every board can be cleared; it's played through again to be sure.
// A ribbon is its squares from tail to tip, and `dir` is the way its tip points (0 up, 1 right, 2 down, 3 left).
function makeTwirl(n) {
  const o = params(n), {W, H} = o, N = W * H, DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
  const rand = k => Math.floor(Math.random() * k);
  const nb = i => { const x = i % W, y = (i / W) | 0, r = []; if (y > 0) r.push(i - W); if (x < W - 1) r.push(i + 1); if (y < H - 1) r.push(i + W); if (x > 0) r.push(i - 1); return r; };
  const dirOf = (a, b) => b === a - W ? 0 : b === a + 1 ? 1 : b === a + W ? 2 : 3;
  const SHAPES = [
    () => { const a = 3 + rand(6), k = 2 + rand(4), m = []; for (let i = 0; i < k; i++) { for (let j = 0; j < a; j++) m.push(i % 2 ? 3 : 1); if (i < k - 1) m.push(2); } return m; },     // coil
    () => { const a = 3 + rand(4), m = []; for (let len = a, leg = 0; len > 0; leg++) { const d = [1, 2, 3, 0][leg % 4]; for (let j = 0; j < len; j++) m.push(d); if (leg >= 2 && leg % 2 === 0) len--; } return m; },   // spiral
    () => { const s = 1 + rand(2), k = 3 + rand(5), m = []; for (let i = 0; i < k; i++) { for (let j = 0; j < s; j++) m.push(1); m.push(2); } return m; },     // staircase
    () => { const k = 3 + rand(5), m = []; for (let i = 0; i < k; i++) m.push(1, i % 2 ? 2 : 0); return m; },     // zigzag
  ];
  function cover() {
    const own = new Int32Array(N).fill(-1), paths = [], bare = i => own[i] < 0, bareN = i => nb(i).filter(bare).length;
    for (let shapeCells = 0, t = 0; shapeCells < o.shapes * N && t < 600; t++) {
      const moves = SHAPES[rand(4)](), rot = rand(4), flip = Math.random() < 0.5;
      let p = [rand(N)]; if (!bare(p[0])) continue;
      for (const m0 of moves) {
        const m = ((flip && (m0 === 1 || m0 === 3) ? 4 - m0 : m0) + rot) % 4, h = p[p.length - 1];
        const x = h % W + DX[m], y = ((h / W) | 0) + DY[m], j = y * W + x;
        if (x < 0 || y < 0 || x >= W || y >= H || !bare(j) || p.includes(j)) { p = null; break; }
        p.push(j);
      }
      if (!p) continue;
      p.forEach(i => own[i] = paths.length); paths.push(p); shapeCells += p.length;
    }
    for (;;) {   // winding paths, moving on to the square with the fewest bare neighbours
      let low = 9, starts = [];
      for (let i = 0; i < N; i++) if (bare(i)) { const k = bareN(i); if (k < low) { low = k; starts = [i]; } else if (k === low) starts.push(i); }
      if (!starts.length) break;
      const p = [starts[rand(starts.length)]], want = o.minLen + rand(o.maxLen - o.minLen + 1);
      own[p[0]] = paths.length;
      let d = -1;
      while (p.length < want) {
        const h = p[p.length - 1], opts = nb(h).filter(bare);
        if (!opts.length) break;
        opts.sort((a, b) => bareN(a) - bareN(b) + (Math.random() - 0.5) * 1.5);
        const straight = opts.find(j => d >= 0 && dirOf(h, j) === d);
        const next = straight !== undefined && Math.random() < o.straight ? straight : opts[0];
        d = dirOf(h, next); own[next] = paths.length; p.push(next);
      }
      paths.push(p);
    }
    for (let k = 0; k < paths.length; k++) {   // a lone square joins a ribbon ending next to it, where it can
      if (paths[k].length > 1) continue;
      const i = paths[k][0], host = paths.findIndex((q, h) => h !== k && q.length > 1 && (nb(i).includes(q[0]) || nb(i).includes(q[q.length - 1])));
      if (host < 0) continue;
      const q = paths[host]; if (nb(i).includes(q[0])) q.unshift(i); else q.push(i);
      paths.splice(k, 1); k--;
    }
    return paths;
  }
  function settle(paths) {
    const occ = new Int32Array(N).fill(-1), clearedAt = new Int32Array(N).fill(-1);
    const rb = paths.map((cells, k) => { cells.forEach(i => occ[i] = k); return {cells, dir: cells.length > 1 ? dirOf(cells[cells.length - 2], cells[cells.length - 1]) : rand(4)}; });
    const walk = (h, d, f) => { for (let x = h % W + DX[d], y = ((h / W) | 0) + DY[d]; x >= 0 && y >= 0 && x < W && y < H; x += DX[d], y += DY[d]) if (f(y * W + x) === false) return false; return true; };
    const laneLen = (h, d) => { let k = 0; walk(h, d, () => { k++; }); return k; };
    const clear = (h, d) => walk(h, d, i => occ[i] < 0);
    const late = (h, d) => { let m = -1; walk(h, d, i => { m = Math.max(m, clearedAt[i]); }); return m; };
    const head = r => r.cells[r.cells.length - 1];
    const turn = r => { r.cells.reverse(); r.dir = dirOf(r.cells[r.cells.length - 2], head(r)); };
    for (const r of rb) {   // point each ribbon: hard boards the long way across, easy ones often toward the nearer edge
      if (r.cells.length === 1) continue;
      const now = laneLen(head(r), r.dir), back = laneLen(r.cells[0], dirOf(r.cells[1], r.cells[0])), near = Math.random() < o.ease;
      if ((near && back < now) || (!near && back > now)) turn(r);
    }
    const gone = new Set(); let step = 0;
    while (gone.size < rb.length) {
      const live = []; for (let k = 0; k < rb.length; k++) if (!gone.has(k)) live.push(k);
      const free = live.filter(k => clear(head(rb[k]), rb[k].dir));
      if (free.length) {
        const k = free[rand(free.length)]; gone.add(k); step++;
        rb[k].cells.forEach(i => { occ[i] = -1; clearedAt[i] = step; });
        continue;
      }
      // stuck: of every way to turn a ribbon round or cut one in two so an end can get out, take the one
      // whose way out opened latest. Cutting is a last resort, and never leaves a one-square scrap if it can help it.
      let best = null;
      const offer = (score, fn) => { score += Math.random() * 0.5; if (!best || score > best.score) best = {score, fn}; };
      const cutCost = (a, b) => 3 + (a.length < 2 || b.length < 2 ? 40 : a.length < 4 || b.length < 4 ? 6 : 0);
      for (const k of live) {
        const r = rb[k], c = r.cells;
        if (c.length === 1) { for (let d = 0; d < 4; d++) if (clear(c[0], d)) offer(late(c[0], d), () => { r.dir = d; }); continue; }
        const bd = dirOf(c[1], c[0]);
        if (clear(c[0], bd)) offer(late(c[0], bd), () => turn(r));
        for (let i = 0; i < c.length - 1; i++) {
          const a = c.slice(0, i + 1), b = c.slice(i + 1);
          if (a.length > 1) { const d = dirOf(a[a.length - 2], a[a.length - 1]); if (clear(a[a.length - 1], d)) offer(late(a[a.length - 1], d) - cutCost(a, b), () => {
            rb[k] = {cells: b, dir: r.dir}; rb.push({cells: a, dir: d}); a.forEach(j => occ[j] = rb.length - 1); }); }
          if (b.length > 1) { const d = dirOf(b[1], b[0]); if (clear(b[0], d)) offer(late(b[0], d) - cutCost(a, b), () => {
            const back = b.slice().reverse();
            rb[k] = {cells: a, dir: a.length > 1 ? dirOf(a[a.length - 2], a[a.length - 1]) : r.dir};
            rb.push({cells: back, dir: d}); back.forEach(j => occ[j] = rb.length - 1); }); }
        }
      }
      if (!best) return null;
      best.fn();
    }
    return rb;
  }
  function solvable(rb) {   // play it through once more, from scratch, as the player would
    const occ = new Int32Array(N).fill(-1), gone = new Set();
    rb.forEach((r, k) => r.cells.forEach(i => occ[i] = k));
    const free = r => { const h = r.cells[r.cells.length - 1]; for (let x = h % W + DX[r.dir], y = ((h / W) | 0) + DY[r.dir]; x >= 0 && y >= 0 && x < W && y < H; x += DX[r.dir], y += DY[r.dir]) if (occ[y * W + x] >= 0) return false; return true; };
    for (let moved = true; moved;) {
      moved = false;
      rb.forEach((r, k) => { if (!gone.has(k) && free(r)) { gone.add(k); r.cells.forEach(i => occ[i] = -1); moved = true; } });
    }
    return gone.size === rb.length;
  }
  for (;;) { const rb = settle(cover()); if (rb && solvable(rb)) return {n, W, H, ribbons: rb}; }
}
const build = G.builder([params, makeTwirl], "makeTwirl");

/* ---------- how each ribbon looks ---------- */
// Every ribbon wears its own colourway, as different as can be from the ribbons it touches. As levels go
// on, more ribbons shade through their colourway along their length (ombré), so they get harder to follow.
// Texture is a clue too: each board picks a main texture at random, flat or twisty, and on early levels
// a fair share of ribbons wear the other one, which makes neighbours easier to tell apart. That mix fades,
// so from level 13 every board is all twisty or all flat.
const RAMPS = [...Object.values(VARIEGATED), ...Object.values(BLENDS), ...Object.values(COLORWAYS)];
const clamp01 = v => Math.max(0, Math.min(1, v));
const labDist = (a, b) => { const p = hexLab(a), q = hexLab(b); return Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]); };
function dress(d) {
  const {W, ribbons} = d, owner = new Map(), ombre = clamp01((d.n - 4) / 12), other = 0.45 * (1 - clamp01((d.n - 1) / 12)), mainTwist = Math.random() < 0.5;
  ribbons.forEach((r, k) => r.cells.forEach(i => owner.set(i, k)));
  d.looks = [];
  ribbons.forEach((r, k) => {
    const near = new Set(r.cells.flatMap(i => [i - W, i + W, i % W ? i - 1 : -1, (i + 1) % W ? i + 1 : -1]).map(j => owner.get(j)).filter(o => o !== undefined && o < k));
    let best = null, bestD = -1;
    for (let t = 0; t < 10; t++) {
      const ramp = Math.floor(Math.random() * RAMPS.length), at = 0.35 + Math.random() * 0.5, solid = rampAt(RAMPS[ramp], at);
      const dist = Math.min(9, ...[...near].map(o => labDist(solid, d.looks[o].solid)));
      if (dist > bestD) { bestD = dist; best = {ramp, solid}; }
    }
    d.looks[k] = {...best, ombre: Math.random() < ombre, twist: Math.random() < other ? !mainTwist : mainTwist, phase: Math.random() * 6};
  });
}

/* ---------- playing ---------- */
const STORE = "catdoku.twirl.v2", MAX_LEVEL = 20, HEARTS = 3, MAX_LIVES = 9;
// Turning off Twisty ribbons draws every ribbon flat, on every level. It's kept on this device.
const PREFS = "catdoku.twirl.prefs.v1", prefs = Object.assign({twisty: true}, G.load(PREFS));
$("twistTgl").checked = prefs.twisty;
$("twistTgl").onchange = e => { prefs.twisty = e.target.checked; G.save(PREFS, prefs); paintStill(); };
let saved = G.load(STORE);
let S = null, loading = false, now = 0, moving = [], tugs = [];
const save = () => { if (S) { S.d.ms = S.ms; G.save(STORE, {level: S.level, d: S.d}); } };

function start(level, d) {
  if (!d.ribbons || !d.W || (d.ribbons[0] && !d.ribbons[0].cells)) throw new Error("the saved level is from another version of the game");
  if (!d.gone) Object.assign(d, {gone: [], hearts: HEARTS, livesUsed: HEARTS, helped: false});
  if (!d.looks) dress(d);
  S = {level, N: level, ...G.freshClock(), d, over: false};
  if (d.ms) { S.ms = d.ms; S.started = true; }
  moving = []; tugs = []; zoom = 1;
  $("levelSel").value = level;
  layout(); save(); hud(); G.note("");
  if (d.hearts <= 0) lost();
}
function startLevel(level) {
  level = Math.min(MAX_LEVEL, Math.max(0, level));
  loading = true; G.note("Laying out the ribbons…", 0);
  G.track(`Twirl level ${level} started`);
  return build.take(level).then(d => { loading = false; start(level, d); build.prefetch(Math.min(MAX_LEVEL, level + 1)); });
}
for (let n = 0; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(n === MAX_LEVEL ? `${n} (hardest)` : n === 0 ? "0 (biggest ribbons)" : String(n), n));
$("levelSel").onchange = e => { G.closeCard(); startLevel(+e.target.value); };
// Restarting puts every ribbon back. It only refills lives after running out (which already keeps you
// at this level), so it isn't a way round them.
$("restartBtn").onclick = () => { if (!S || loading) return; G.closeCard(); restart(); };
function restart() {
  const d = S.d; d.gone = []; d.ms = S.ms;
  if (d.hearts <= 0) { d.hearts = HEARTS; d.livesUsed = Math.max(d.livesUsed, HEARTS); }
  start(S.level, d);
}

// New ribbons: another mat at this level (help or a revive on this one doesn't carry over, as with a new level).
$("newBtn").onclick = () => { if (!loading) { G.closeCard(); startLevel(S ? S.level : 0); } };
// Share: a link to this mat. Each ribbon is its first square, the way it points and its steps (up, right, down,
// left as 0 to 3), two steps to a hex digit; colours are picked afresh for whoever opens it.
const HEX = "0123456789abcdef";
$("linkBtn").onclick = () => { if (S && !loading) G.shareCard({name: "Twirl", what: "mat", won: !left(),

  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pinch && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    setZoom(pinch.zoom * Math.hypot(a.x - b.x, a.y - b.y) / pinch.dist, pinch.at);
  } else if (pan) {
    const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
    if (Math.hypot(dx, dy) > 8) pan.moved = true;
    if (pan.moved) { scroller.scrollLeft = pan.sl - dx; scroller.scrollTop = pan.st - dy; }
  }
});
function release(e, tapIt) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) { const p = pan; pan = null; if (tapIt && p && !p.moved) tapAt(e.clientX, e.clientY); }
}
scroller.addEventListener("pointerup", e => release(e, true));
scroller.addEventListener("pointercancel", e => release(e, false));
function tapAt(cx, cy) {
  if (!S || S.over || loading) return;
  const r = canvas.getBoundingClientRect(), d = S.d;
  const [x, y] = matXY(Math.floor((cx - r.left) / r.width * shownW() - PAD), Math.floor((cy - r.top) / r.height * shownH() - PAD));
  if (x < 0 || y < 0 || x >= d.W || y >= d.H) return;
  const k = occupancy()[y * d.W + x];
  if (k >= 0 && !tugs.some(t => t.k === k)) tap(k);
}

// Keys: the arrows move a cursor over the mat (it scrolls along when zoomed), and Space or Enter taps the ribbon
// under it.
let kbAt = -1;
const keys = G.gridKeys({on: () => S && !S.over && !loading, start: () => Math.floor(S.d.H / 2) * S.d.W + Math.floor(S.d.W / 2),
  move: (i, dx, dy) => {   // the way the arrow points on the screen, which on a mat lying sideways is another way on the mat
    const [mx, my] = side ? [dy, -dx] : [dx, dy], W = S.d.W;
    return Math.max(0, Math.min(S.d.H - 1, Math.floor(i / W) + my)) * W + Math.max(0, Math.min(W - 1, i % W + mx));
  },
  show: i => {
    kbAt = i; if (i < 0) return;
    const cw = canvas.clientWidth / shownW(), [sx, sy] = shownXY(i % S.d.W, Math.floor(i / S.d.W)), x = (sx + PAD) * cw, y = (sy + PAD) * cw;
    if (x < scroller.scrollLeft || x + cw > scroller.scrollLeft + scroller.clientWidth) scroller.scrollLeft = x - scroller.clientWidth / 2;
    if (y < scroller.scrollTop || y + cw > scroller.scrollTop + scroller.clientHeight) scroller.scrollTop = y - scroller.clientHeight / 2;
  },
  act: i => { const k = occupancy()[i]; if (k >= 0 && !tugs.some(t => t.k === k)) tap(k); }});
let last = performance.now();
function loop(t) { now += Math.min(0.05, (t - last) / 1000); last = t; draw(); requestAnimationFrame(loop); }

/* ---------- how to play ---------- */
function helpCard(tries = 0) {
  // a level still being set out is waited for, then the walkthrough plays
  if (loading && !document.querySelector(".spot")) { if (tries < 20) setTimeout(() => helpCard(tries + 1), 250); return; }
  intro(true);
  if (!document.querySelector(".spot")) G.helpLater();
}
/* ---------- first-time spotlight ---------- */
// The first visit (or How to play) walks through the mat that's out: a ribbon that's free to
// go and the way it'll slide, a blocked ribbon and what's in its way, the lives, the mat, and zoom.
const INTRO = "catdoku.twirl.intro.v1";
// What a ribbon would hit if tapped now: [the ribbon, the square], or null if it's free.
function blockerOf(k) {
  const d = S.d, r = d.ribbons[k], occ = occupancy(), h = r.cells[r.cells.length - 1], [dx, dy] = DIRS[r.dir];
  for (let x = h % d.W + dx, y = ((h / d.W) | 0) + dy; x >= 0 && y >= 0 && x < d.W && y < d.H; x += dx, y += dy) if (occ[y * d.W + x] >= 0) return [occ[y * d.W + x], y * d.W + x];
  return null;
}
function intro(again) {
  if (!again && G.load(INTRO).seen) return;
  if (!S || S.over || loading || document.querySelector(".spot")) { if (!again) setTimeout(intro, 400); return; }
  const d = S.d, gone = new Set(d.gone), xy = i => [i % d.W, (i / d.W) | 0];
  const here = d.ribbons.map((_, k) => k).filter(k => !gone.has(k));
  const mid = k => { const [x, y] = xy(d.ribbons[k].cells[d.ribbons[k].cells.length >> 1]); return Math.abs(x - d.W / 2) + Math.abs(y - d.H / 2); };
  // a free ribbon of three squares or more near the middle; its arrow lies along it, ending just past its tip
  const free = here.filter(k => !blockerOf(k)).sort((a, b) => (d.ribbons[b].cells.length >= 3) - (d.ribbons[a].cells.length >= 3) || mid(a) - mid(b))[0];
  const stuck = here.filter(k => blockerOf(k)).sort((a, b) => mid(a) - mid(b))[0];
  const map = () => { const r = canvas.getBoundingClientRect(); return {ox: r.left + PAD / shownW() * r.width, oy: r.top + PAD / shownH() * r.height, cw: r.width / shownW(), ch: r.height / shownH()}; };
  const cellsOf = k => d.ribbons[k].cells.map(i => shownXY(...xy(i))), steps = [];
  if (free !== undefined) {
    const r = d.ribbons[free], [hx, hy] = xy(r.cells[r.cells.length - 1]), [dx, dy] = DIRS[r.dir], [ax, ay] = shownDir(-dx, -dy);
    steps.push({say: "Tap a ribbon to send it off", lit: cellsOf(free)},
               {say: "It slides the way its pointed end points", lit: cellsOf(free), arrows: [{to: shownPt(hx + 0.5 + dx * 0.9, hy + 0.5 + dy * 0.9), from: [ax, ay], size: 1.7}]});
  }
  if (stuck !== undefined) {
    const [b, at] = blockerOf(stuck), [bx, by] = shownXY(...xy(at));
    steps.push({say: "Only if nothing is in the way", lit: [...cellsOf(stuck), ...cellsOf(b)], outline: [cellsOf(stuck), cellsOf(b)], marks: [[bx, by, "❌", 0.7]]});
  }
  steps.push({say: "A blocked tap costs a life", els: [$("hearts")]},
             {say: "Stuck? Hint shows a ribbon that's free to go", els: [$("hintBtn")]},
             {say: "Clear every ribbon to finish", lit: here.flatMap(cellsOf)},
             {say: "Pinch or use − and + to zoom", els: [document.querySelector(".zoom")]},
               {say: "Turn off Twisty ribbons to draw every ribbon flat", els: [$("twistTgl").closest(".opt")]});
  G.spotlight({grid: canvas, w: side ? d.H : d.W, h: side ? d.W : d.H, map, steps, done: () => G.save(INTRO, {seen: true})});
}
$("helpBtn").onclick = () => helpCard();
$("hintBtn").onclick = hint;
G.setupTimer({name: "twirl", game: () => S, playing: g => !g.over && !loading, save,
  label: n => `Level ${n}`, noun: "level",
  emptyText: "Finish a level and your times will show up here. They're kept on this device only."});
$("bestBtn").onclick = () => G.showBests("Best times", S ? S.level : saved.level ?? 1);

// New players start on level 0, the small mat with the biggest ribbons.
const shared = G.readShare("twirl");
window.addEventListener("hashchange", () => { const d = G.readShare("twirl"); if (d) G.offerShare(d, {name: "Twirl", inProgress: !!(S && !S.over && S.d.gone.length), open: d => { try { openShared(d); } catch (e) { G.note("That share link didn't work.", 5000); } }}); });
// a shared mat opens in place of the saved one
let openedShare = false;
if (shared) try { openShared(shared); openedShare = true; G.note("Here's the shared mat. Good luck!", 6000); G.track("Twirl shared puzzle opened"); } catch (e) { G.note("That share link didn't work.", 5000); }
// a link that didn't work says so again once the board's own note has shown
const saySorry = () => { if (shared && !openedShare) G.note("That share link didn't work.", 6000); };
if (!openedShare) G.reopen(() => { if (saved.d && saved.level <= MAX_LEVEL) { start(saved.level, saved.d); saySorry(); } else startLevel(saved.level ?? 0).then(saySorry); },
  why => { startLevel(saved.level ?? 0).then(() => G.note(why, 0)); });
// Players from before the spotlight had the How to play card instead, so it's only for new players.
if (saved.level !== undefined && !G.load(INTRO).seen) G.save(INTRO, {seen: true});
intro();
requestAnimationFrame(loop);
</script>
