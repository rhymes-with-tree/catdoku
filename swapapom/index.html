<style>
/* A craft tray of letter pompoms, one in each round well. Swap two side by side to spell a word across or down.
   Moonpie lies along the top of the tray keeping you company: she purrs at every word and gathers the pompoms up. */
.title{display:flex;align-items:flex-end;gap:8px}
.moon{display:block;height:64px;width:auto;margin-bottom:-4px}
@media (max-height:760px){.moon{height:48px}}
.status .info{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-width:0}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border:2px solid var(--ink);border-radius:999px;
  background:var(--panel);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.low{background:color-mix(in srgb,#ECA818 70%,white)}
.chip.out{background:color-mix(in srgb,#E16A4A 60%,white)}
@media (prefers-color-scheme:dark){.chip.low,.chip.out{color:#2A2530}}
/* the points: a bar filling up to the level's goal */
.meter{width:var(--board);display:flex;align-items:center;gap:10px;font-weight:800;font-variant-numeric:tabular-nums;
  font-size:calc(16px*var(--ts))}
.meter .bar0{flex:1;height:14px;border:2px solid var(--ink);border-radius:999px;background:var(--panel);overflow:hidden}
.meter .fill{height:100%;width:0;background:#ECA818;transition:width .4s}
.meter.done .fill{background:#6AA673}
/* Moonpie, lying along the tray's top edge at its right-hand corner: her lying picture is turned 15° so her belly
   lies level on the rim. She's in the tray's box (.wrap), so she stays on the rim whatever the screen; the points bar
   above keeps clear of her. On a phone held sideways the box makes room above the tray for her (--rim). */
.wrap{--rim:0px;--pic:56px}
.meter{padding-right:96px}
.lounge{all:unset;position:absolute;right:4px;bottom:calc(100% - var(--rim) - var(--pic) * .3);z-index:5;cursor:pointer;rotate:15deg;
  transform-origin:50% 100%;-webkit-tap-highlight-color:transparent}
.lounge img{display:block;height:var(--pic);width:auto;pointer-events:none}
/* she's a button that's pressed while the sound is on; the shared style for a pressed button (ink behind it) isn't for her */
.wrap .lounge[aria-pressed]{background:none;color:inherit}
.lounge:focus-visible{outline:3px solid #73A7AE;outline-offset:2px;border-radius:12px}
/* a purr: she trembles all over, a tiny fast shake (no bounce), for as long as the purr lasts (--purrs: how many shakes) */
.lounge.purr{animation:purr .07s linear var(--purrs,14)}
@keyframes purr{25%{transform:translate(.9px,-.5px)} 50%{transform:translate(-.7px,.4px)} 75%{transform:translate(.6px,.6px)}}
.heart{position:absolute;bottom:calc(100% - var(--rim) + var(--pic) * .45);z-index:6;pointer-events:none;font-size:18px;color:#B94588;
  animation:heart 1.3s ease-out forwards}
@keyframes heart{to{transform:translate(var(--dx),-46px) scale(1.25);opacity:0}}
@media (orientation:landscape) and (max-height:500px){
  body:not(.full) main > .wrap.stage{--rim:34px;--pic:44px;padding-top:var(--rim);height:calc(var(--board) + var(--rim));
    --board:min(58vw,calc(var(--high) - var(--rim)))}
  body:not(.full) .meter{padding-right:0}
}
.wrap canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;outline:none}
.found{width:var(--board);margin-top:2px}
.found h2{font-size:calc(16px*var(--ts));margin:0 0 4px;text-align:center}
.found p{margin:0;text-align:center;line-height:1.7;font-size:calc(17px*var(--ts))}
.found a{display:inline-block;margin:0 4px;color:var(--ink);text-decoration:none;border-bottom:2px solid color-mix(in srgb,#B94588 45%,white);font-weight:600;white-space:nowrap}
.found a small{opacity:.75;font-weight:600;margin-left:2px}
.found[hidden]{display:none}
.card img.pic{display:block;width:70%;max-width:240px;height:auto;margin:0 auto 14px}

<main>

</main>

<script src="../games.js?v=2026-11-14.6"></script>
<script>
const $ = G.$;

/* ---------- the rules (plain functions, no drawing) ---------- */
// The tray is N pompoms across and down, each with a letter. Swap two neighbours so a word reads across (left to
// right) or down (top to bottom); the cat bats every word away, the pompoms above drop into the gaps and new ones
// fall in from the bag, which can spell more words.
const N = 7, MAXW = 7;
const VAL = {a: 1, b: 3, c: 3, d: 2, e: 1, f: 4, g: 2, h: 4, i: 1, j: 8, k: 5, l: 1, m: 3, n: 1, o: 1, p: 3, qu: 10, r: 1, s: 1, t: 1, u: 1, v: 4, w: 4, x: 8, y: 4, z: 10, "?": 0};
// L-M-N-O-Pom's bags: Scrabble's tiles (a few more S's), and the early levels' bag of the letters most words are made of.
const BAG = {e: 12, a: 9, i: 8, o: 8, n: 6, r: 6, t: 6, l: 4, s: 6, u: 3, d: 4, g: 3, b: 2, c: 2, m: 2, p: 2, f: 2, h: 2, v: 2, w: 2, y: 2, k: 1, j: 1, x: 1, qu: 1, z: 1};
const EASY_BAG = {e: 12, a: 9, i: 8, o: 8, n: 7, r: 7, t: 7, l: 5, s: 7, u: 4, d: 5, g: 2, b: 1, c: 4, m: 4, p: 4, f: 1, h: 2, v: 1, w: 1, y: 3, k: 1, j: 0, x: 0, qu: 0, z: 0};
const mulberry = s => () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
// Letters for a seed, one shuffled bag after another, so vowels and consonants stay in balance. easy 1 is the early
// bag, 0 Scrabble's; gold is how often a pompom counts its letter twice (2L), maple how often it doubles the word (2W).
function letterStream(seed, lv) {
  const rnd = mulberry(seed); let bag = [];
  return () => {
    if (!bag.length) {
      for (const [l, c] of Object.entries(BAG)) for (let i = Math.round(c + (EASY_BAG[l] - c) * lv.easy); i > 0; i--) bag.push(l);
      for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
    }
    const l = bag.pop(), r = rnd();
    return {l, k: r < lv.gold ? 1 : r < lv.gold + lv.maple ? 2 : 0};
  };
}
// Whether the pompoms spell a word, a fluffball ("?") standing for any letter; returns the word or null.
function spells(tiles, dict) {
  if (!tiles.some(t => t.l === "?")) { const w = tiles.map(t => t.l).join(""); return dict.has(w) ? w : null; }
  if (tiles.filter(t => t.l === "?").length > 2) return null;
  const go = (i, acc) => {
    if (i === tiles.length) return dict.has(acc) ? acc : null;
    if (tiles[i].l !== "?") return go(i + 1, acc + tiles[i].l);
    for (const c of "eariotnslcudpmhgbfywkvxzjq") { const r = go(i + 1, acc + c); if (r) return r; }
    return null;
  };
  return go(0, "");
}
// A word's points, Scrabble style: its letters (a 2L pompom's twice), doubled for each 2W pompom, times
// (length - 2), so a longer word is worth much more.
function wordScore(tiles) {
  let s = 0, m = 1;
  for (const t of tiles) { s += VAL[t.l] * (t.k === 1 ? 2 : 1); if (t.k === 2) m *= 2; }
  return s * m * Math.max(1, tiles.length - 2);
}
// The cells of row a (dir 0) or column a (dir 1), in reading order.
const line = (dir, a) => [...Array(N).keys()].map(x => dir ? x * N + a : a * N + x);
// The words in a line: the set of words that don't overlap worth the most points (as in L-M-N-O-Pom).
function lineWords(g, cells, dict) {
  const n = cells.length, best = Array(n + 1).fill(null); best[n] = {pts: 0, words: []};
  for (let i = n - 1; i >= 0; i--) {
    let b = best[i + 1];
    for (let j = i + 3; j <= Math.min(n, i + MAXW); j++) {
      const tiles = cells.slice(i, j).map(c => g[c]);
      if (tiles.some(t => !t)) break;
      const w = spells(tiles, dict); if (!w) continue;
      const pts = wordScore(tiles), cand = {pts: pts + best[j].pts, words: [{cells: cells.slice(i, j), word: w, pts}, ...best[j].words]};
      if (cand.pts > b.pts) b = cand;
    }
    best[i] = b;
  }
  return best[0].words;
}
// Every word on the tray, or only those in the lines through some cells. A pompom can be in a word across and a word
// down at once, and counts in both.
function wordsOn(g, dict, through) {
  const out = [];
  for (let dir = 0; dir < 2; dir++) for (let a = 0; a < N; a++) {
    if (through && !through.some(i => (dir ? i % N : Math.floor(i / N)) === a)) continue;
    for (const w of lineWords(g, line(dir, a), dict)) if (!through || w.cells.some(c => through.includes(c))) out.push(w);
  }
  return out;
}
function swapCells(g, a, b) { const t = g[a]; g[a] = g[b]; g[b] = t; }
const neighbours = (a, b) => Math.abs(a - b) === N || (Math.abs(a - b) === 1 && Math.floor(a / N) === Math.floor(b / N));
// Every swap that spells a word, with what it's worth straight away (not counting what falls in after), best first.
function allMoves(g, dict) {
  const out = [];
  for (let i = 0; i < N * N; i++) for (const j of [i % N < N - 1 ? i + 1 : -1, i + N < N * N ? i + N : -1]) {
    if (j < 0) continue;
    if (g[i].l === g[j].l && g[i].k === g[j].k) continue;
    swapCells(g, i, j); const ws = wordsOn(g, dict, [i, j]); swapCells(g, i, j);
    if (ws.length) out.push({a: i, b: j, words: ws, pts: ws.reduce((s, w) => s + w.pts, 0)});
  }
  return out.sort((x, y) => y.pts - x.pts || x.words[0].word.length - y.words[0].word.length);
}
function findMove(g, dict) {
  for (let i = 0; i < N * N; i++) for (const j of [i % N < N - 1 ? i + 1 : -1, i + N < N * N ? i + N : -1]) {
    if (j < 0) continue;
    swapCells(g, i, j); const ok = wordsOn(g, dict, [i, j]).length; swapCells(g, i, j);
    if (ok) return [i, j];
  }
  return null;
}
// A word ends at cell i (across or down) in a tray filled in reading order up to i.
function endsWord(g, i, dict) {
  const x = i % N, y = Math.floor(i / N);
  for (let len = 3; len <= MAXW; len++) {
    if (x - len + 1 >= 0 && spells([...Array(len).keys()].map(k => g[i - len + 1 + k]), dict)) return true;
    if (y - len + 1 >= 0 && spells([...Array(len).keys()].map(k => g[i - (len - 1 - k) * N]), dict)) return true;
  }
  return false;
}
// A fresh tray with no word spelled yet and at least one swap that spells one.
function newTray(next, dict) {
  for (let tries = 0; ; tries++) {
    const g = [];
    for (let i = 0; i < N * N; i++) {
      let t, n = 0;
      do { t = next(); g[i] = t; } while (endsWord(g, i, dict) && ++n < 30);
    }
    if (findMove(g, dict) || tries > 50) return g;
  }
}
// Pompoms drop to fill the gaps and new ones fall in from the bag. Returns the new pompoms with how far above the
// tray each starts. The new ones are drawn so they don't spell a word by themselves (a pompom that would is put back
// for the next one, up to a few times), so a chain comes from what the player's word knocked down, not from luck.
function dropDown(g, next, dict) {
  const fresh = [], spare = [];
  for (let c = 0; c < N; c++) {
    let w = N - 1;
    for (let r = N - 1; r >= 0; r--) { const t = g[r * N + c]; if (t) { g[r * N + c] = null; g[w * N + c] = t; w--; } }
    const gap = w + 1;
    for (; w >= 0; w--) fresh.push([w * N + c, gap]);
  }
  const draw = () => spare.length ? spare.shift() : next();
  for (const [i] of fresh) {
    let t = draw();
    for (let n = 0; n < 12; n++) {
      g[i] = t;
      if (!dict || !wordsOn(g, dict, [i]).some(w => w.cells.includes(i))) break;
      const t2 = next(); spare.push(t); t = t2;
    }
    g[i] = t;
  }
  return fresh.map(([i, gap]) => [g[i], gap]);
}
// Shake the tray when no swap is left: the same pompoms, in a new order with no word spelled and a swap to make.
function shake(g, dict, rnd) {
  for (let tries = 0; tries < 400; tries++) {
    const o = g.slice();
    for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
    if (!wordsOn(o, dict).length && findMove(o, dict)) return o;
  }
  return null;
}
// What one round of batting does: every word on the tray goes, worth its points times the round (a chain counts
// double, then triple…). From level `fluffFrom`, a word of five or more leaves a fluffball behind, where the swapped
// pompom was (or in the middle of the word), which can be any letter.
function batPlan(g, dict, moved, fluff) {
  const words = wordsOn(g, dict); if (!words.length) return null;
  const clear = new Set(), make = [];
  for (const w of words) w.cells.forEach(c => clear.add(c));
  if (fluff) for (const w of words.filter(w => w.cells.length >= 5).sort((a, b) => b.cells.length - a.cells.length)) {
    const at = w.cells.find(c => moved.includes(c) && !make.includes(c)) ?? w.cells.find((c, k) => k >= w.cells.length >> 1 && !make.includes(c));
    if (at !== undefined) make.push(at);
  }
  make.forEach(c => clear.delete(c));
  return {words, clear, make};
}

// Twelve levels, one new thing at a time: the points to reach and the swaps to do it in, how far the letters lean to
// the common ones (easy, 1 the early bag, 0 Scrabble's), how often a pompom is gold (2L) or brick (2W), and whether
// a word of five or more leaves a fluffball.
const LV = [null,
  {goal: 150, swaps: 15, easy: 1, gold: 0, maple: 0, fluff: false},
  {goal: 200, swaps: 15, easy: 1, gold: .08, maple: 0, fluff: false},
  {goal: 250, swaps: 15, easy: .9, gold: .07, maple: .03, fluff: false},
  {goal: 300, swaps: 15, easy: .8, gold: .07, maple: .03, fluff: true},
  {goal: 330, swaps: 15, easy: .6, gold: .07, maple: .03, fluff: true},
  {goal: 350, swaps: 14, easy: .4, gold: .07, maple: .03, fluff: true},
  {goal: 370, swaps: 14, easy: .2, gold: .06, maple: .03, fluff: true},
  {goal: 370, swaps: 13, easy: 0, gold: .06, maple: .03, fluff: true},
  {goal: 390, swaps: 13, easy: 0, gold: .06, maple: .03, fluff: true},
  {goal: 400, swaps: 12, easy: 0, gold: .05, maple: .03, fluff: true},
  {goal: 420, swaps: 12, easy: 0, gold: .05, maple: .03, fluff: true},
  {goal: 450, swaps: 12, easy: 0, gold: .05, maple: .03, fluff: true}];

/* ---------- words ---------- */
// The shared word list's familiar and common words, three to seven letters, less a few nobody wants to see spelled
// by chance (L-M-N-O-Pom's list). Hints prefer the familiar ones.
const NOT = new Set("cock fags hos hoes prick rapes rapist semen boobs penis vagina scrotum slag pimp retards spastic gyp gypsy redskin squaw bimbo hooker horny nude nudes orgasm sperm erotic bitchy pussy bastard incest molest".split(" "));
let DICT = null, FAMILIAR = null;
const wordsReady = (async () => {
  const w = window.WORDS_INLINE || await fetch(`../words/words.json?v=${window.SITE_BUILD || ""}`).then(r => { if (!r.ok) throw new Error("couldn't load the word list"); return r.json(); });
  const ok = x => /^[a-z]{3,7}$/.test(x) && !NOT.has(x);
  DICT = new Set([w.familiar, w.common].join(" ").split(" ").filter(ok));
  FAMILIAR = new Set(w.familiar.split(" ").filter(ok));
})();

/* ---------- pictures ---------- */
const catSrc = f => (window.CAT_SRC && window.CAT_SRC[f]) || `../cats/${f}.webp`;
const picCache = {};
const pic = src => picCache[src] || (picCache[src] = Object.assign(new Image(), {src}));
const GOLD = "#ECA818", MAPLE = "#BD5538", INK = "#2A2530";
// a tint of a palette colour: f of the way to white
const tint = (hex, f) => "#" + [1, 3, 5].map(i => Math.round(parseInt(hex.slice(i, i + 2), 16) * (1 - f) + 255 * f).toString(16).padStart(2, "0")).join("");
// Pompoms, as in L-M-N-O-Pom: Spelling String's pompom photo tinted to one of the site's colours, plain letters in
// pacific blue, plum, sage, lime, lavender and periwinkle, a 2L pompom gold and a 2W pompom brick; the blank is Wind
// Up's grey fluffball with googly eyes.
const POM_SRC = window.POM_SRC || "../fuzzyspelling/pompom.webp", EYE_SRC = window.EYE_SRC || "../fuzzyspelling/eye.webp";
const POM_PLAIN = ["#73A7AE", "#B94588", "#6AA673", "#B3B94B", "#8D78AD", "#7885BA"];
const tints = {};
function tinted(hex) {
  if (tints[hex]) return tints[hex];
  const im = pic(POM_SRC); if (!(im.complete && im.naturalWidth)) return null;
  const c = document.createElement("canvas"); c.width = c.height = 160; const x = c.getContext("2d"); x.drawImage(im, 0, 0, 160, 160);
  if (hex) {
    const d = x.getImageData(0, 0, 160, 160), m = [1, 3, 5].map(i => Math.min(1, parseInt(hex.slice(i, i + 2), 16) / 255 * 1.22));
    for (let i = 0; i < d.data.length; i += 4) for (let k = 0; k < 3; k++) d.data[i + k] *= m[k];
    x.putImageData(d, 0, 0);
  }
  return tints[hex] = c;
}
// One pompom at x, y (its middle), s across, turned its own way.
function drawPom(c, t, x, y, s, alpha = 1) {
  c.save(); c.globalAlpha = alpha; c.translate(x, y);
  const blank = t.l === "?", im = tinted(blank ? "" : t.k === 1 ? GOLD : t.k === 2 ? MAPLE : POM_PLAIN[(t.id || 0) % POM_PLAIN.length]);
  if (im) { c.save(); c.rotate(((t.id || 0) * 47 % 360) * Math.PI / 180 + (t.spin || 0)); c.drawImage(im, -s * .56, -s * .56, s * 1.12, s * 1.12); c.restore(); }
  else { c.beginPath(); c.arc(0, 0, s * .46, 0, 7); c.fillStyle = blank ? "#B4AEBB" : t.k === 1 ? GOLD : t.k === 2 ? MAPLE : POM_PLAIN[(t.id || 0) % POM_PLAIN.length]; c.fill(); }
  if (blank) {
    const eye = pic(EYE_SRC);
    if (eye.complete && eye.naturalWidth) for (const dx of [-1, 1]) { c.save(); c.translate(dx * s * .18, -s * .04); c.rotate(((t.id || 0) * 97 + dx * 13) % 360 * Math.PI / 180); c.drawImage(eye, -s * .15, -s * .15, s * .3, s * .3); c.restore(); }
  } else {

canvas.addEventListener("pointermove", e => {
  if (!press) return;
  const r = canvas.getBoundingClientRect(), dx = e.clientX - press.x, dy = e.clientY - press.y, far = r.width / N * .35;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < far) return;
  const i = press.i, c = i % N, j = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? (c < N - 1 ? i + 1 : -1) : (c > 0 ? i - 1 : -1)) : (dy > 0 ? i + N : i - N);
  press = null;
  if (j >= 0 && j < N * N) trySwap(i, j);
});
canvas.addEventListener("pointerup", () => { if (!press) return; const i = press.i; press = null; tapCell(i); });
canvas.addEventListener("pointercancel", () => { press = null; });
function tapCell(i) {
  if (picked >= 0 && neighbours(picked, i)) return trySwap(picked, i);
  picked = picked === i ? -1 : i;
}
G.gridKeys({on: () => game && !game.over && !busy, show: i => { cursor = i; }, act: i => { if (game.timed !== false) game.started = true; tapCell(i); }, size: () => [N, N],
  start: () => picked >= 0 ? picked : 24, escape: () => { picked = -1; }});

/* ---------- hints ---------- */
// The best swap there is (the most points straight away), keeping to familiar words where one will do. The first hint
// outlines the two pompoms; asked again, it names the word.
$("hintBtn").onclick = () => {
  if (!game || game.over || busy || document.querySelector(".spot")) return;
  const all = allMoves(game.board, DICT), fam = all.filter(m => m.words.every(w => FAMILIAR.has(w.word))), m = fam[0] || all[0];
  if (!m) { G.note("No word to make here; the tray will get a shake.", 3000); return; }
  if (!game.hinted) { game.hinted = true; save(); }
  const word = m.words.map(w => w.word.toUpperCase());
  hints.show({pair: [m.a, m.b]}, hints.level() ? `Swap the outlined pompoms to spell ${G.listed(word)}.` : "Swap the two outlined pompoms.");
};

/* ---------- buttons ---------- */
for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(n === MAX_LEVEL ? `${n} (hardest)` : String(n), n));
$("levelSel").onchange = e => newGame(+e.target.value);
$("newBtn").onclick = () => newGame(game ? game.level : 1);
$("restartBtn").onclick = () => { if (game) newGame(game.level, game.seed, {hinted: game.hinted, restarted: game.restarted || game.started || game.over || game.words.length > 0, quiet: true}); };
$("linkBtn").onclick = () => { if (game) G.shareCard({name: "Swap-a-Pom", what: "tray", won: game.over && game.pts >= LV[game.level].goal, puzzle: () => ({g: "swapapom", N: game.level, s: game.seed})}); };
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : 1);
function openShared(d) {
  if (!(d.N >= 1 && d.N <= MAX_LEVEL) || !Number.isInteger(d.s)) throw new Error("the shared tray doesn't fit the game");
  newGame(d.N, d.s);
}

/* ---------- how to play ---------- */
// A real swap on the tray that's out (the best familiar one), kept: it's the player's own first move. The gold, brick
// and fluffball pompoms each wait for How to play, or are shown the first time they turn up (meet).
const xy = i => [i % N, Math.floor(i / N)];
// where the wells are, in page pixels, for the walkthrough (the tray has a rim round them)
const trayMap = () => { const r = canvas.getBoundingClientRect(), s = r.width / W; return {ox: r.left + PAD * s, oy: r.top + PAD * s, cw: CELL * s, ch: CELL * s}; };
function special(say, k) {   // a pompom in the middle shown as gold, brick or a fluffball, just while the step is up
  let was = null; const i = 24;
  return {say, lit: [xy(i)], later: true, enter: () => { const t = game.board[i]; if (t) { was = [t.l, t.k]; if (k === 3) t.l = "?"; else t.k = k; } },
    leave: () => { const t = game.board[i]; if (t && was) [t.l, t.k] = was; was = null; }};
}
function intro(again) {
  if (!again && G.load(INTRO).seen) return;
  if (!game || game.over || busy || document.querySelector(".spot")) return;
  const all = allMoves(game.board, DICT), m = all.filter(m => m.words.every(w => FAMILIAR.has(w.word)))[0] || all[0];
  if (!m) return;
  const A = game.board[m.a], B = game.board[m.b];
  hints.clear();
  const steps = [
    {say: `Swap these two to spell ${m.words[0].word.toUpperCase()}`, lit: [xy(m.a), xy(m.b)], try: {done: () => game.board[m.a] !== A || game.board[m.b] !== B, yes: "A word! Moonpie purrs"}},
    {say: "Words read across or down"},
    {say: "Longer words score far more"},
    {say: "No word? The swap stays, and counts"},
    {say: "Reach the goal before your swaps run out", els: [$("meter"), $("swaps")]},
    {say: "Tap Moonpie to hear her purr", els: [$("lounge")]},
    special("Gold 2L counts its letter twice", 1),
    special("Brick 2W doubles the word", 2),
    special("Five letters leave a fluffball: any letter", 3),
    {say: "Stuck? Hint shows a swap", els: [$("hintBtn")]},
  ];
  G.spotlight({grid: canvas, w: N, h: N, map: trayMap,
    steps, done: () => { const d = G.load(INTRO); G.save(INTRO, {...d, seen: true, met: again ? ["gold", "brick", "fluff"] : d.met || []}); }});
}
function helpCard(tries = 0) {
  if (game && !game.over && busy && !document.querySelector(".spot")) { if (tries < 20) setTimeout(() => helpCard(tries + 1), 200); return; }
  intro(true);
  if (!document.querySelector(".spot")) G.helpLater();
}
$("helpBtn").onclick = () => helpCard();
// The first gold or brick pompom on a tray, and the first fluffball made, are lit with what they do, one at a time.
let made = [];
const MEET = {gold: "Gold 2L counts its letter twice", brick: "Brick 2W doubles the word", fluff: "A fluffball can be any letter"};
function meet() {
  const d = G.load(INTRO), met = d.met || [];
  if (!d.seen || !game || game.over || busy || document.querySelector(".spot")) return;
  let what = null, i = -1;
  const f = made.find(t => game.board.includes(t)); made = [];
  if (f && !met.includes("fluff")) { what = "fluff"; i = game.board.indexOf(f); }
  else for (const [k, name] of [[1, "gold"], [2, "brick"]]) if (!met.includes(name) && (i = game.board.findIndex(t => t.k === k && t.l !== "?")) >= 0) { what = name; break; }
  if (!what || i < 0) return;
  G.spotlight({grid: canvas, w: N, h: N, finish: false, map: trayMap,
    steps: [{say: MEET[what], lit: [xy(i)]}], done: () => G.save(INTRO, {...G.load(INTRO), met: [...met, what]})});
}
// A level that brings in fluffballs says so as it starts.
const NEWS = {4: "New: a word of five letters or more leaves a fluffball."};

G.nav("swapapom");
G.setupTimer({name: "swapapom", game: () => game, playing: g => !g.over, save, label: n => `Level ${n}`, noun: "level",
  emptyText: "Finish a level and your times will show up here. They're kept on this device only."});
const shareOpts = () => ({name: "Swap-a-Pom", inProgress: !!(game && !game.over && game.started), open: d => { try { openShared(d); } catch (e) { G.note("That share link didn't work.", 5000); } }});
window.addEventListener("hashchange", () => { const d = G.readShare("swapapom"); if (d) G.offerShare(d, shareOpts()); });
requestAnimationFrame(loop);
wordsReady.then(() => {
  const saved = G.load(STORE), shared = G.readShare("swapapom");
  let opened = false;
  if (shared) try { openShared(shared); opened = true; G.note("Here's the shared tray. Good luck!", 6000); G.track("Swap-a-Pom shared puzzle opened"); } catch (e) { G.note("That share link didn't work.", 5000); }
  if (!opened) G.reopen(() => { if (saved.game) reopenGame(saved.game); else newGame(saved.level || 1); }, why => { newGame(saved.level || 1); G.note(why, 0); });
  if (NEWS[game.level] && !game.started) G.note(NEWS[game.level], 6000);
  intro();
}).catch(e => G.note(`The word list didn't load (${e.message}). Check the connection and reload.`, 0));
</script>
