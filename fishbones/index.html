<script>
/* ---------- fish (plain functions, also run in a background worker) ---------- */
// A fish is a spine word read across, with rib words read down through it. `ribs` gives each spine bone's rib
// as [bones above the spine, bones below] ([0, 0] for none), or `cols` lists the rows each spine bone's rib has a
// bone on (above the spine negative), so a rib can have a gap in it like a crossword's black square. The words
// are every run of two or more bones down a column or across a row: the spine, the words down, and the words
// across where ribs sit side by side.
// Levels: the owner's seven fish, laid out on the outline sheet so each has more bones and is harder than the
// last. `paws` is how hard, 1 to 5, as the sheet's rater found it (a solver that sees only the colours: how many
// everyday words fit each line's clues, the swaps, and gold bones shared by two words), averaged over 100 fish.
// `swaps` is about the fewest it takes to put back (about 0.6 a bone; you get 5 spare). The Swordfish's 9-letter
// spine comes from words/long.json, and two-letter words from Fridge Magnets' list.
function levelSpec(n) {
  return [null, {fish: "Minnow", paws: 1, L: 5, cols: [[-1, 1], [], [-1, 1]], swaps: 5},
    {fish: "Sardine", paws: 2, L: 7, cols: [[-1, 1], [], [-1, 1], [], [-1, 1]], swaps: 8},
    {fish: "Herring", paws: 3, L: 7, cols: [[-1, 1], [-1, 1], [-1, 1], [], [-1, 1]], swaps: 9},
    {fish: "Mackerel", paws: 4, L: 8, cols: [[-1, 1], [-1, 1], [-2, -1, 1, 2], [], [-1, 1], [], [-1, 1]], swaps: 12},
    {fish: "Discus", paws: 4, L: 7, cols: [[-2, -1, 1, 2], [-2, -1, 2], [-3, -2, -1, 1, 2, 3], [-2, 1, 2], [-2, -1, 1, 2], [-1, 1]], swaps: 17},
    {fish: "Angelfish", paws: 5, L: 8, cols: [[-3, -2, -1, 1, 2, 3], [-3, 3], [-3, -2, -1, 1, 2, 3], [], [-2, -1, 1, 2], [-2, 2], [-2, -1, 1, 2]], swaps: 19},
    {fish: "Swordfish", paws: 5, L: 9, cols: [[-2, -1, 1, 2], [-2, 2], [-2, -1, 1, 2], [], [-2, -1, 1, 2], [-2, 2], [-2, -1, 1, 2], [-1, 1], [-1, 1]], swaps: 20}][n];
}
// The squares of a fish, as [x, y] with the spine at y = 0, and its words, each a list of square numbers: the
// spine, the ribs, then the across words (from `across` on).
function fishCells(spec) {
  const cells = [], at = {}, add = (x, y) => { const k = x + "," + y; if (!(k in at)) { at[k] = cells.length; cells.push([x, y]); } return at[k]; };
  const cols = spec.cols || spec.ribs.map(([up, down]) => { const ys = []; for (let y = -up; y <= down; y++) if (y) ys.push(y); return ys; });
  for (let x = 0; x < spec.L; x++) add(x, 0);
  cols.forEach((ys, x) => ys.forEach(y => add(x, y)));
  const has = (x, y) => (x + "," + y) in at, run = (x, y, dx, dy) => { const w = []; while (has(x, y)) { w.push(at[x + "," + y]); x += dx; y += dy; } return w; };
  const words = [run(0, 0, 1, 0)];
  for (const [x, y] of cells) if (!has(x, y - 1) && has(x, y + 1)) words.push(run(x, y, 0, 1));
  const across = words.length;
  for (const [x, y] of cells) if (y && !has(x - 1, y) && has(x + 1, y)) words.push(run(x, y, 1, 0));
  return {cells, words, across};
}
// Swaps needed to put `cur` (a letter on each square) back as `sol`: each square that's wrong wants a letter
// from somewhere else, so draw an arrow from the letter it has to the letter it wants. Every swap can fix at
// most one more square than the arrows it ends, so the fewest swaps is the arrows less the most loops they
// split into (a loop of k arrows takes k - 1 swaps).
function minSwaps(cur, sol) {
  const E = {}; let n = 0;
  for (let i = 0; i < sol.length; i++) if (cur[i] !== sol[i]) { const k = cur[i] + sol[i]; E[k] = (E[k] || 0) + 1; n++; }
  const memo = new Map();
  function loops(E) {
    const keys = Object.keys(E).filter(k => E[k] > 0).sort();
    if (!keys.length) return 0;
    const sig = keys.map(k => k + E[k]).join();
    if (memo.has(sig)) return memo.get(sig);
    // two arrows each way between letters always make a loop of their own in some best split
    for (const k of keys) { const r = k[1] + k[0]; if (k[0] < k[1] && E[r] > 0) { E[k]--; E[r]--; const v = 1 + loops(E); E[k]++; E[r]++; memo.set(sig, v); return v; } }
    // otherwise the first arrow is in some loop: try every loop through it
    const start = keys[0][0]; let best = 0;
    (function walk(at, len) {
      for (const k of Object.keys(E)) if (E[k] > 0 && k[0] === at) {
        E[k]--;
        if (k[1] === start) best = Math.max(best, 1 + loops(E));
        else walk(k[1], len + 1);
        E[k]++;
      }
    })(start, 0);
    memo.set(sig, best);
    return best;
  }
  return n - loops(E);
}
// A fish for level n, from WL (the familiar words and two-letter words, split by length): words laid on it one at
// a time, each time the word with the fewest that fit (none used twice), going back a step when one has none.
// Then it's muddled with random swaps among all but a few squares (left as they are, the way Waffle leaves some
// green to start from) until putting it back takes the level's number of swaps (give or take one), with no
// other square right and no word right as it stands.
function makeFish(n) {
  const spec = levelSpec(n), {cells, words} = fishCells(spec), N = cells.length;
  const board = new Array(N).fill(""), used = new Set(), open = new Set(words.map((_, k) => k));
  let steps = 0;
  // the words that fit a run of squares: from the shortest list of words with one of its letters in its place
  const IX = self.IX || (self.IX = {});
  const withAt = (L, j, c) => { const k = L + "," + j; if (!IX[k]) { IX[k] = {}; for (const w of WL[L] || []) (IX[k][w[j]] = IX[k][w[j]] || []).push(w); } return IX[k][c] || []; };
  const fits = sq => { let from = WL[sq.length] || [];
    sq.forEach((i, j) => { if (board[i]) { const l = withAt(sq.length, j, board[i]); if (l.length < from.length) from = l; } });
    return from.filter(w => !used.has(w) && sq.every((i, j) => !board[i] || board[i] === w[j])); };
  (function lay() {
    if (!open.size) return true;
    if (++steps > 20000) return false;
    let best = -1, bc = null;
    for (const k of open) { const c = fits(words[k]); if (!c.length) return false; if (!bc || c.length < bc.length) { best = k; bc = c; } }
    open.delete(best);
    const sq = words[best], was = sq.map(i => board[i]);
    for (let t = 0; t < 30 && bc.length && steps <= 20000; t++) {
      const w = bc.splice(Math.floor(Math.random() * bc.length), 1)[0];
      sq.forEach((i, j) => { board[i] = w[j]; }); used.add(w);
      if (lay()) return true;
      used.delete(w); sq.forEach((i, j) => { board[i] = was[j]; });
    }
    open.add(best);
    return false;
  })();
  const sol = open.size ? null : board.join("");
  if (!sol) return null;
  // muddle: keep a few squares as they are and shuffle the rest, a few more than the swaps wanted (shuffles
  // fall into loops, and each loop saves a swap), until it's within a swap of the right distance away
  const want = spec.swaps;
  for (let t = 0; t < 400; t++) {
    const order = [...Array(N).keys()].sort(() => Math.random() - 0.5);
    const free = order.slice(Math.max(3, N - want - 2 - Math.floor(Math.random() * 4)));
    const cur = sol.split("");
    for (let k = free.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [cur[free[k]], cur[free[j]]] = [cur[free[j]], cur[free[k]]]; }
    if (free.some(i => cur[i] === sol[i])) continue;
    // no word already right
    if (words.some(sq => sq.every(i => cur[i] === sol[i]))) continue;
    if (Math.abs(minSwaps(cur.join(""), sol) - want) > 1) continue;
    return {n, sol, start: cur.join("")};
  }
  return null;
}

/* ---------- game state ---------- */
// game: {level, sol (the letters as dealt to spell, square by square), start (as muddled), cur (now), min (the
//        fewest swaps from start), budget (swaps you get; you can keep going past them, with no gold paw), history
//        (swaps made, [i, j]), back (what each Restart put away), won, hinted, undid…}
const STORE = "catdoku.fishbones.v1", MAX_LEVEL = 7, NS = "http://www.w3.org/2000/svg";
const $ = G.$;
let state = G.load(STORE);
let settings = Object.assign({level: 1}, state.settings);
let game = state.game || null, busy = false, running = false, build = null, VALID = null, sel = -1;
const save = () => G.save(STORE, {settings, game});
const playing = () => game && !game.won && !busy && !running && !$("overlay").classList.contains("show");
const SPARE = 5;   // swaps on top of the fewest
// Each level is named for its fish and how hard it is, from 1 to 5 paws (Minnow-1 … Swordfish-5).
const levelName = n => `${levelSpec(n).fish}-${levelSpec(n).paws}`;
const el = (t, a, parent) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (parent) parent.append(e); return e; };
const left = () => game.budget - game.history.length;
let FISH = null;   // the fish being played: {cells, words}
const shape = () => FISH || (FISH = fishCells(levelSpec(game.level)));

/* ---------- words ---------- */
// The shared list (words/words.json, and words/long.json for 9 letters): fish are made from familiar words (less
// a few that read oddly on their own), and any word in the lists counts, so a fish that spells other words is
// solved too.
const TWO = "am an as at be by do go he hi if in is it me my no of oh ok on or ox so to up us we".split(" ");   // as in Fridge Magnets
const SKIP = new Set("gay god sic thy huh ugh nay ken don bob mod pro sod amp cam mum".split(" "));
async function loadWords() {
  const get = (f, inline) => inline || fetch(`../words/${f}?v=${window.SITE_BUILD || ""}`).then(r => { if (!r.ok) throw new Error("couldn't load the word list"); return r.json(); });
  const lists = await Promise.all([get("words.json", window.WORDS_INLINE), get("long.json", window.LONG_INLINE)]);
  const byLen = list => { const o = {}; for (const x of list) if (/^[a-z]+$/.test(x)) (o[x.length] = o[x.length] || []).push(x); return o; };
  const all = k => lists.flatMap(w => w[k].split(" ")), familiar = all("familiar");
  self.WL = byLen(familiar.filter(x => !SKIP.has(x)).concat(TWO));
  VALID = new Set(familiar.concat(all("common"), all("more"), TWO));
  // the worker gets the familiar words along with the functions that make fish from them
  build = G.builder([levelSpec, fishCells, minSwaps, makeFish, {toString: () => `var WL = ${JSON.stringify(self.WL)};`}], "makeFish");
}

/* ---------- drawing ---------- */
// Each fish's head, tail and fins, drawn side on about 1000 long (snout at x 0, the middle line at y 0): the body
// is stations [x, top, bottom] joined by a smooth curve, and the head is the body in front of the gill. The
// bones go bare between the gill and the tail (where the last station is). Only the fins that make the fish
// what it is are drawn; on a slim fish they'd float in the air beside the bones.
const ART = {
  Minnow: {gill: 210, body: [[0, -18, 22], [40, -52, 50], [130, -82, 78], [260, -98, 94], [420, -100, 98], [580, -90, 88], [720, -66, 64], [820, -42, 42], [850, -38, 38]],
    tail: "M840 -40C880 -60 930 -105 985 -118C972 -60 950 -20 952 0C950 20 972 60 985 118C930 105 880 60 840 40Z", fins: []},
  Sardine: {gill: 200, body: [[0, -8, 12], [60, -48, 50], [200, -86, 98], [380, -98, 116], [560, -86, 100], [720, -56, 62], [820, -32, 34], [845, -28, 30]],
    tail: "M835 -30C870 -50 920 -110 990 -150C960 -80 925 -25 915 0C925 25 960 80 990 150C920 110 870 50 835 30Z", fins: []},
  Herring: {gill: 220, body: [[0, -14, 16], [80, -70, 74], [240, -118, 132], [420, -128, 140], [600, -108, 118], [750, -62, 66], [835, -34, 34], [855, -30, 30]],
    tail: "M845 -32C880 -55 930 -120 995 -165C965 -90 928 -30 918 0C928 30 965 90 995 165C930 120 880 55 845 32Z", fins: []},
  Mackerel: {gill: 250, body: [[0, -4, 6], [100, -58, 54], [260, -108, 104], [440, -118, 112], [610, -94, 90], [750, -52, 48], [850, -18, 16], [870, -14, 14]],
    tail: "M860 -16C890 -40 940 -140 1000 -195C975 -110 945 -35 935 0C945 35 975 110 1000 195C940 140 890 40 860 16Z", fins: []},
  Discus: {gill: 165, body: [[0, -24, 24], [60, -150, 140], [180, -262, 250], [350, -302, 290], [520, -272, 262], [660, -172, 164], [740, -64, 60], [762, -46, 46]],
    tail: "M752 -48C800 -80 860 -120 910 -125C895 -60 890 0 890 0C890 0 895 60 910 125C860 120 800 80 752 48Z",
    fins: ["M160 -240C280 -360 520 -380 700 -210C740 -170 770 -110 776 -64L742 -70C720 -150 640 -232 520 -268C400 -300 260 -296 172 -252Z",
      "M160 232C280 350 520 370 700 202C740 162 770 104 776 58L742 64C720 144 640 224 520 258C400 288 260 286 172 242Z"]},
  Angelfish: {gill: 185, body: [[0, -14, 14], [60, -90, 82], [190, -220, 205], [340, -268, 252], [490, -226, 214], [610, -132, 124], [690, -52, 48], [712, -40, 40]],
    tail: "M700 -42C760 -90 860 -150 960 -160C930 -60 925 0 925 0C925 0 930 60 960 160C860 150 760 90 700 42Z",
    fins: ["M300 -262C360 -400 470 -540 600 -600C560 -460 560 -300 640 -110C560 -170 460 -230 420 -246Z",
      "M300 248C360 390 470 530 600 590C560 450 560 290 640 104C560 162 460 220 420 236Z", "M210 196C220 300 250 420 300 520C300 420 280 300 250 200Z"]},
  Swordfish: {gill: 420, body: [[250, -12, 10], [300, -48, 40], [420, -118, 100], [580, -150, 128], [740, -126, 106], [870, -60, 52], [930, -22, 20], [945, -20, 18]],
    tail: "M935 -20C950 -60 975 -170 1000 -250C1000 -150 985 -60 978 0C985 60 1000 150 1000 250C975 170 950 60 935 20Z",
    fins: ["M470 -140C480 -230 500 -310 560 -330C552 -260 548 -190 560 -148Z"], sword: "M0 -2L262 -12L262 10Z", eye: 365},
};
// A smooth curve through the stations (Catmull-Rom), sampled finely.
function curve(pts) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let t = 0; t < 1; t += 0.05) {
      const t2 = t * t, t3 = t2 * t, f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}
// Squares are 100 across, the spine at y 0 (its middle at y 50). The fish's drawing is scaled so its bones
// fit exactly between the gill and the tail. Then, so the whole fish isn't much bigger than its bones (which
// would make them small on a phone), the head and tail are made smaller about where they join the bones if
// they're more than 200 long, a fin reaching more than 150 past the bones is made smaller about where it joins
// the fish, and the sword is kept to 190.
let bones = [], at = [];   // the bone drawn for each letter as dealt, and which bone is on each square
function draw() {

let frames = null, zoom = null, zoomTimer = null, drawnFor = "";

const solved = () => game.cur === game.sol || wordsNow().every(w => VALID.has(w));

    ...(one("no") ? [{say: "Grey: it belongs in another word", lit: one("no")}] : []),
    {say: "Where two words cross, gold means either word wants it", lit: ribs.filter(w => w.some(i => cells[i][1] === 0)).map(w => sq(w.find(i => cells[i][1] === 0)))},
    {say: `You have ${left()} swaps. Fix the fish in ${game.min} for a gold paw`, els: [$("count")]},
    {say: "Stuck? Hint shows a bone to move", els: [$("hintBtn")]},
  ];
  G.spotlight({grid: $("grid"), w: L, h, steps, map, done: () => { settings.seenHelp = true; save(); }});
}

for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(levelName(n), n));
$("levelSel").onchange = e => { G.closeCard(); startLevel(+e.target.value); };
$("newBtn").onclick = () => { G.closeCard(); newPuzzle(); };
$("helpBtn").onclick = showHelp;

// The long fish (not the tall ones, which gain nothing from it): on a phone held upright, suggest turning it and
// going full screen. Going full screen puts the suggestion away, so the fish gets the room.
const fs = G.fullScreen({btn: $("fullBtn"), name: "Fish Bones", change: (on, toggled) => { if (on && toggled) G.note(""); }});
function sideways() {
  const vb = $("svg").viewBox.baseVal;
  if (game && vb.width > 1150 && vb.width > 1.5 * vb.height && !fs.on() && matchMedia("(max-width:600px) and (orientation:portrait)").matches)
    G.note("Big fish! Turn your phone sideways and tap full screen (top right) for bigger bones.", 7000);
}

G.nav("fishbones");
G.checkClock(game);
G.setupTimer({name: "fishbones", game: () => game, playing: g => !g.won, save, label: levelName, noun: "level"});
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : settings.level);

if (!(settings.level >= 1 && settings.level <= MAX_LEVEL)) settings.level = 1;
$("levelSel").value = settings.level;
loadWords().then(() => {
  const shared = G.readShare("fishbones");
  const hadSave = !!(game);
  if (hadSave) G.reopen(() => {
      const spec = levelSpec(game.level), n = spec && fishCells(spec).cells.length;
      if (!spec || game.sol.length !== n || game.cur.length !== n || !Array.isArray(game.history)) throw new Error("the saved fish doesn't fit its level");
      draw();
      delete game.lost;   // from the first preview, when running out ended the fish
      if (game.won) finishCard();
      build.prefetch(settings.level); helpOnFirstVisit();
    }, why => { game = null; newPuzzle().then(() => G.note(why, 0)); });
  else if (!shared) newPuzzle();
  const shareOpts = () => ({name: "Fish Bones", inProgress: !!(game && !game.won && game.history.length), open: openShared, after: helpOnFirstVisit});
  // a link that doesn't work, opened with no saved puzzle, would leave the board empty: start one
  if (shared) G.offerShare(shared, {...shareOpts(), fresh: hadSave ? null : why => Promise.resolve(newPuzzle()).then(() => { G.note(why, 6000); })});
  // A share link opened while this page is already showing only changes the address, so watch for it.
  window.addEventListener("hashchange", () => { const d = G.readShare("fishbones"); if (d) G.offerShare(d, shareOpts()); });
}).catch(e => G.note(`Fish Bones ${e.message}. Check your connection and reload.`, 0));
</script>
