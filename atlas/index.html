<style>
/* The map is the board: the country to name is lit in coral, and a gold ring goes round it when it's too small
   to see. Under it, the cat to find and the answer, given the way the player picks: four names (Pick), typing with
   the list of every place (List) or typing with no list (Type). */
.map{--water:#C9DEE1;--land:#F4F2E8;--border:rgba(42,37,48,.38);--lit:#E16A4A;--lit-edge:#9E4129;--found:#6AA673;--stripe:rgba(42,37,48,.42);--found-edge:#3F7748;
  background:var(--water);border:3px solid var(--ink);border-radius:10px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.map .grid{position:absolute;inset:0}
.map canvas{display:block;width:100%;height:100%;cursor:grab}
.map canvas:active{cursor:grabbing}
.recentre{position:absolute;right:8px;bottom:8px;width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--panel)}
.zoombtns{position:absolute;right:8px;bottom:56px;display:flex;flex-direction:column;gap:8px}
.zoombtns button{width:40px;height:40px;padding:0;border-radius:50%;background:var(--panel);font-size:24px;line-height:1;font-weight:800}
.recentre svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.key{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--panel) 88%,transparent);border-radius:999px;padding:2px 10px 2px 4px;pointer-events:none}
.key i{width:18px;height:14px;border-radius:4px;border:1.5px dashed var(--ink-soft);background:repeating-linear-gradient(135deg,var(--land) 0 3px,rgba(42,37,48,.42) 3px 4.6px)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-soft);font-weight:600}

.pad [hidden]{display:none!important}
.pad{width:var(--board);display:flex;flex-direction:column;align-items:center;gap:10px}
.clue{margin:0;font-size:26px;font-weight:800;line-height:1.15;text-align:center;text-wrap:balance}
.clue b{color:#B23A28}
.reveal{margin:-4px 0 0;font-size:22px;font-weight:800;letter-spacing:.18em;color:#9A6B06;text-align:center;font-variant-numeric:tabular-nums}
.reveal:empty{display:none}
.choices{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices button{padding:10px 8px;line-height:1.2;min-height:52px}
.choices button.out{text-decoration:line-through;opacity:.45}
.choices button.wrong{border-color:#C8392B;color:#B23A28;text-decoration:line-through}
.choices button.gold{box-shadow:0 0 0 4px #ECA818}
.choices button.right{background:var(--sage-green);border-color:#3F7748;color:#fff}
.typebox{width:100%;position:relative;display:flex;gap:8px}
.typebox input{flex:1;min-width:0;font:inherit;font-size:18px;font-weight:600;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:7px 12px}
.list{width:100%;max-height:min(34vh,236px);overflow-y:auto;margin:0;padding:4px;list-style:none;background:var(--panel);border:2px solid var(--line);border-radius:10px}
.list li{padding:5px 10px;border-radius:7px;cursor:pointer;font-weight:600}
.list li:hover{background:#fff}
.list li[aria-selected="true"]{background:var(--ink);color:var(--paper)}
/* on a phone, while typing: the map shrinks to fit above the answer box (see fitTyping) and the list is short */
body.typing .list{max-height:var(--list-h,108px)}
.list li.none{color:var(--ink-soft);cursor:default;font-weight:500}
.tried{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.tried:empty{display:none}
.tried span{font-size:14px;font-weight:600;color:#B23A28;border:2px solid #E8A598;border-radius:999px;padding:0 10px;text-decoration:line-through}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink-soft)}
.dots i.ok{background:var(--sage-green);border-color:#3F7748}
.dots i.miss{background:#E16A4A;border-color:#9E4129}
.dots i.now{border-color:var(--ink);transform:scale(1.25)}

/* the disputed round's sentence, with blanks to fill in */
.clue.dz{font-size:21px;font-weight:700;line-height:1.35}
.clue.dz b{color:#B23A28}
.clue .blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--ink);color:#9A6B06;letter-spacing:.06em;line-height:1}
.choices button.right{background:var(--sage-green);border-color:#3F7748;color:#fff}
.reveal.note{font-size:16px;font-weight:600;letter-spacing:0;color:var(--ink-soft);margin:0}

.catline{margin:0;font-size:18px;font-weight:700;text-align:center;text-wrap:balance}
.catline b{color:#B23A28}
/* the card that covers the board once a place is answered: the cat's photo from Wikipedia, where it lives, a link to its
   page and the photo credit, until Next cat */
.card .photo{display:block;aspect-ratio:4/3;margin:0 0 14px;border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:#E4E1D6}
.card .photo img{display:block;width:100%;height:100%;object-fit:cover}
.card .say{margin:0 0 10px;font-size:19px;font-weight:700;line-height:1.3;color:var(--ink);text-wrap:balance}
.card .say b{color:#B23A28}
.card .say .blank{border:0;color:inherit;letter-spacing:0}
.card .wiki{margin:0 0 16px;font-size:13px;line-height:1.35;color:var(--ink-soft)}
.card .wiki a{color:inherit}
.card .wiki .more{font-weight:700;color:var(--ink)}
.card .wiki .credit{text-decoration:none}
.card .wiki .credit:empty{display:none}
.card .wiki.places{margin-top:-10px}
.card .say .also{display:block;font-size:16px;font-weight:600}
.card .say .also small{font-size:14px;color:var(--ink-soft)}
</style>

<main>
  <header><h1>Catlas</h1><div class="stripe"></div><p class="tagline">Name the country where each cat is hiding</p></header>

  <div class="status"><span class="dots" id="count" aria-label=""></span><button class="timer" id="timer" hidden></button><span class="msg" id="msg" aria-live="polite"></span></div>

    <button class="recentre" id="recentreBtn" aria-label="Back to the lit country" title="Back to the lit country"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  </div>
  <div class="overlay" id="overlay"><div class="card" id="card"></div></div>

  <div class="pad" id="pad">
    <p class="catline" id="catLine" hidden></p>
    <p class="clue" id="clue"></p>
    <p class="reveal" id="reveal" aria-live="polite"></p>
    <div class="choices" id="choices" hidden></div>
    <form class="typebox" id="typebox" hidden autocomplete="off">
      <input id="guess" name="answer" type="text" enterkeyhint="go" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="words" aria-label="Your answer" placeholder="Type the name">
      <button type="submit" class="primary" id="goBtn">Go</button>

    <ul class="list" id="list" role="listbox" aria-label="Countries" hidden></ul>
    <div class="tried" id="tried" aria-label="Wrong guesses"></div>
    <button id="skipBtn" hidden>Skip the bonus</button>
  </div>

  <div class="actions">
    <button id="hintBtn">Hint</button>
    <button id="restartBtn">Restart</button>
    <button id="linkBtn">Share</button>
    <button id="bestBtn">Best times</button>
    <button id="helpBtn">How to play</button>
  </div>
  <div class="bar">
    <label>Round <select id="levelSel" aria-label="Round"></select></label>
    <button id="newBtn" class="primary">New trip</button>
  </div>
  <div class="bar toggles">
    <div class="opt"><label>Answer <select id="styleSel" aria-label="How you answer"></select></label><span class="hint" id="styleHint"></span></div>
  </div>
</main>

<script>
/* ---------- countries and their cats ---------- */
// The 200 countries a trip can ask: the 193 UN members plus Vatican City, Palestine, Taiwan, Kosovo,
// Western Sahara, the Cook Islands and Niue (the same list as World Map Recall).
const NAMES = {"DZA":"Algeria","AGO":"Angola","BEN":"Benin","BWA":"Botswana","BFA":"Burkina Faso","BDI":"Burundi","CPV":"Cape Verde","CMR":"Cameroon","CAF":"Central African Republic","TCD":"Chad","COM":"Comoros","COG":"Republic of the Congo","COD":"DR Congo","CIV":"Ivory Coast","DJI":"Djibouti","EGY":"Egypt","GNQ":"Equatorial Guinea","ERI":"Eritrea","SWZ":"Eswatini","ETH":"Ethiopia","GAB":"Gabon","GMB":"Gambia","GHA":"Ghana","GIN":"Guinea","GNB":"Guinea-Bissau","KEN":"Kenya","LSO":"Lesotho","LBR":"Liberia","LBY":"Libya","MDG":"Madagascar","MWI":"Malawi","MLI":"Mali","MRT":"Mauritania","MUS":"Mauritius","MAR":"Morocco","MOZ":"Mozambique","NAM":"Namibia","NER":"Niger","NGA":"Nigeria","RWA":"Rwanda","STP":"São Tomé and Príncipe","SEN":"Senegal","SYC":"Seychelles","SLE":"Sierra Leone","SOM":"Somalia","ZAF":"South Africa","SDS":"South Sudan","SDN":"Sudan","TZA":"Tanzania","TGO":"Togo","TUN":"Tunisia","UGA":"Uganda","ZMB":"Zambia","ZWE":"Zimbabwe","SAH":"Western Sahara","ATG":"Antigua and Barbuda","ARG":"Argentina","BHS":"Bahamas","BRB":"Barbados","BLZ":"Belize","BOL":"Bolivia","BRA":"Brazil","CAN":"Canada","CHL":"Chile","COL":"Colombia","CRI":"Costa Rica","CUB":"Cuba","DMA":"Dominica","DOM":"Dominican Republic","ECU":"Ecuador","SLV":"El Salvador","GRD":"Grenada","GTM":"Guatemala","GUY":"Guyana","HTI":"Haiti","HND":"Honduras","JAM":"Jamaica","MEX":"Mexico","NIC":"Nicaragua","PAN":"Panama","PRY":"Paraguay","PER":"Peru","KNA":"Saint Kitts and Nevis","LCA":"Saint Lucia","VCT":"Saint Vincent and the Grenadines","SUR":"Suriname","TTO":"Trinidad and Tobago","USA":"United States","URY":"Uruguay","VEN":"Venezuela","AFG":"Afghanistan","ARM":"Armenia","AZE":"Azerbaijan","BHR":"Bahrain","BGD":"Bangladesh","BTN":"Bhutan","BRN":"Brunei","KHM":"Cambodia","CHN":"China","GEO":"Georgia","IND":"India","IDN":"Indonesia","IRN":"Iran","IRQ":"Iraq","ISR":"Israel","JPN":"Japan","JOR":"Jordan","KAZ":"Kazakhstan","KWT":"Kuwait","KGZ":"Kyrgyzstan","LAO":"Laos","LBN":"Lebanon","MYS":"Malaysia","MDV":"Maldives","MNG":"Mongolia","MMR":"Myanmar","NPL":"Nepal","PRK":"North Korea","OMN":"Oman","PAK":"Pakistan","PHL":"Philippines","QAT":"Qatar","SAU":"Saudi Arabia","SGP":"Singapore","KOR":"South Korea","LKA":"Sri Lanka","SYR":"Syria","TJK":"Tajikistan","THA":"Thailand","TLS":"Timor-Leste","TUR":"Turkey","TKM":"Turkmenistan","ARE":"United Arab Emirates","UZB":"Uzbekistan","VNM":"Vietnam","YEM":"Yemen","PSX":"Palestine","TWN":"Taiwan","ALB":"Albania","AND":"Andorra","AUT":"Austria","BLR":"Belarus","BEL":"Belgium","BIH":"Bosnia and Herzegovina","BGR":"Bulgaria","HRV":"Croatia","CYP":"Cyprus","CZE":"Czechia","DNK":"Denmark","EST":"Estonia","FIN":"Finland","FRA":"France","DEU":"Germany","GRC":"Greece","HUN":"Hungary","ISL":"Iceland","IRL":"Ireland","ITA":"Italy","LVA":"Latvia","LIE":"Liechtenstein","LTU":"Lithuania","LUX":"Luxembourg","MLT":"Malta","MDA":"Moldova","MCO":"Monaco","MNE":"Montenegro","NLD":"Netherlands","MKD":"North Macedonia","NOR":"Norway","POL":"Poland","PRT":"Portugal","ROU":"Romania","RUS":"Russia","SMR":"San Marino","SRB":"Serbia","SVK":"Slovakia","SVN":"Slovenia","ESP":"Spain","SWE":"Sweden","CHE":"Switzerland","UKR":"Ukraine","GBR":"United Kingdom","VAT":"Vatican City","KOS":"Kosovo","AUS":"Australia","FJI":"Fiji","KIR":"Kiribati","MHL":"Marshall Islands","FSM":"Micronesia","NRU":"Nauru","NZL":"New Zealand","PLW":"Palau","PNG":"Papua New Guinea","WSM":"Samoa","SLB":"Solomon Islands","TON":"Tonga","TUV":"Tuvalu","VUT":"Vanuatu","COK":"Cook Islands","NIU":"Niue"};
// Territories quizzed alongside the countries: every place with an ISO country code of its own, named with the
// country it belongs to ("Greenland (Denmark)"). Either answer is right on its own; naming the country too is a bonus.
const DEPS = {"GRL":["Greenland","DNK"],"GUF":["French Guiana","FRA"],"SJM":["Svalbard","NOR"],"NCL":["New Caledonia","FRA"],"FLK":["Falkland Islands","GBR"],"PRI":["Puerto Rico","USA"],"ATF":["French Southern and Antarctic Lands","FRA"],"SGS":["South Georgia and the South Sandwich Islands","GBR"],"PYF":["French Polynesia","FRA"],"REU":["Réunion","FRA"],"GLP":["Guadeloupe","FRA"],"MTQ":["Martinique","FRA"],"FRO":["Faroe Islands","DNK"],"HKG":["Hong Kong","CHN"],"IMN":["Isle of Man","GBR"],"GUM":["Guam","USA"],"CUW":["Curaçao","NLD"],"HMD":["Heard Island and McDonald Islands","AUS"],"MYT":["Mayotte","FRA"],"MNP":["Northern Mariana Islands","USA"],"TCA":["Turks and Caicos Islands","GBR"],"VIR":["U.S. Virgin Islands","USA"],"CYM":["Cayman Islands","GBR"],"BES":["Bonaire, Sint Eustatius and Saba","NLD"],"SPM":["Saint Pierre and Miquelon","FRA"],"SHN":["Saint Helena, Ascension and Tristan da Cunha","GBR"],"ABW":["Aruba","NLD"],"IOA":["Christmas and Cocos (Keeling) Islands","AUS"],"VGB":["British Virgin Islands","GBR"],"IOT":["Chagos Islands","MUS"],"WLF":["Wallis and Futuna","FRA"],"JEY":["Jersey","GBR"],"ASM":["American Samoa","USA"],"AIA":["Anguilla","GBR"],"MSR":["Montserrat","GBR"],"BMU":["Bermuda","GBR"],"MAF":["Saint Martin","FRA"],"GGY":["Guernsey","GBR"],"SXM":["Sint Maarten","NLD"],"NFK":["Norfolk Island","AUS"],"PCN":["Pitcairn Islands","GBR"],"BLM":["Saint Barthélemy","FRA"],"MAC":["Macao","CHN"],"TKL":["Tokelau","NZL"],"ATC":["Ashmore and Cartier Islands","AUS"]};
const nameOf = c => NAMES[c] || (DEPS[c] && DEPS[c][0]) || (c.startsWith("dz:") && DISPUTES[c.slice(3)] ? DISPUTES[c.slice(3)].name : c);
const PLACES = [...Object.keys(NAMES), ...Object.keys(DEPS)];
const OWNERS = [...new Set(Object.values(DEPS).map(d => d[1]))];
// Map pieces that light up with the country they belong to.
const ALIAS = {CYN: "CYP", SOL: "SOM", ALD: "FIN"};
// Continents for Easy's wrong answers, as World Map Recall has them.
const REGION_FIX = {CYP: "Europe", TUR: "Asia", RUS: "Europe", HMD: "Oceania", ATF: "Africa"};
// What each cat is called in the clue. None of them names a country: "lynx", never "Iberian lynx".
const CATS = {
  lion: "the lion", tiger: "the tiger", leopard: "the leopard", panther: "the black panther", snow: "the snow leopard",
  clouded: "the clouded leopard", jaguar: "the jaguar", cheetah: "the cheetah", puma: "the puma", lynx: "the lynx",
  bobcat: "the bobcat", caracal: "the caracal", serval: "the serval", ocelot: "the ocelot", margay: "the margay",
  jaguarundi: "the jaguarundi", oncilla: "the oncilla", geoffroy: "Geoffroy's cat", kodkod: "the kodkod",
  andean: "the Andean cat", golden: "the golden cat", leopardcat: "the leopard cat", fishing: "the fishing cat",
  rusty: "the rusty-spotted cat", manul: "Pallas's cat", sand: "the sand cat", blackfoot: "the black-footed cat",
  jungle: "the jungle cat", wildcat: "the wildcat"};
// One cat for each country: a wild cat that lives there (checked against GBIF sightings and the IUCN Red List), or,
// where no wild cat does any more, a housecat that migrated there; a cat exploring, where no one lives at all.
const CLUE = Object.fromEntries(`
DZA cheetah AGO serval BEN lion BWA leopard BFA leopard BDI serval CPV house CMR golden CAF golden TCD cheetah COM house
COG leopard COD serval CIV leopard DJI caracal EGY jungle GNQ golden ERI caracal SWZ serval ETH lion GAB golden GMB serval
GHA golden GIN leopard GNB serval KEN cheetah LSO wildcat LBR leopard LBY caracal MDG house MWI serval MLI caracal MRT sand
MUS house MAR caracal MOZ lion NAM cheetah NER cheetah NGA leopard RWA lion STP house SEN lion SYC house SLE golden SOM leopard
ZAF blackfoot SDS lion SDN lion TZA lion TGO serval TUN wildcat UGA lion ZMB leopard ZWE lion SAH sand
ATG house ARG geoffroy BHS house BRB house BLZ jaguar BOL andean BRA jaguar CAN lynx CHL kodkod COL ocelot CRI margay
CUB house DMA house DOM house ECU oncilla SLV jaguarundi GRD house GTM margay GUY jaguar HTI house HND jaguarundi JAM house
MEX jaguar NIC ocelot PAN ocelot PRY jaguar PER puma KNA house LCA house VCT house SUR margay TTO ocelot USA bobcat
URY margay VEN puma
AFG snow ARM leopard AZE jungle BHR house BGD tiger BTN tiger BRN clouded KHM leopardcat CHN snow GEO lynx IND lion
IDN tiger IRN cheetah IRQ leopard ISR jungle JPN leopardcat JOR sand KAZ caracal KWT sand KGZ snow LAO clouded LBN wildcat
MYS panther MDV house MNG manul MMR clouded NPL snow PRK leopardcat OMN leopard PAK leopard PHL leopardcat QAT house
SAU sand SGP leopardcat KOR leopardcat LKA rusty SYR jungle TJK snow THA fishing TLS house TUR caracal TKM manul
ARE caracal UZB sand VNM leopardcat YEM caracal PSX caracal TWN leopardcat
ALB lynx AND wildcat AUT lynx BLR lynx BEL wildcat BIH lynx BGR wildcat HRV lynx CYP house CZE lynx DNK house EST lynx
FIN lynx FRA lynx DEU wildcat GRC wildcat HUN wildcat ISL house IRL house ITA wildcat LVA lynx LIE lynx LTU lynx
LUX wildcat MLT house MDA wildcat MCO house MNE wildcat NLD wildcat MKD lynx NOR lynx POL lynx PRT lynx ROU lynx RUS tiger
SMR house SRB wildcat SVK lynx SVN lynx ESP lynx SWE lynx CHE lynx UKR lynx GBR house VAT house KOS wildcat
AUS house FJI house KIR house MHL house FSM house NRU house NZL house PLW house PNG house WSM house SLB house TON house
TUV house VUT house COK house NIU house
GRL house GUF jaguar SJM house NCL house FLK house PRI house ATF empty SGS empty PYF house REU house GLP house MTQ house
FRO house HKG leopardcat IMN house GUM house CUW house HMD empty MYT house MNP house TCA house VIR house CYM house BES house
SPM house SHN house ABW house IOA house VGB house IOT house WLF house JEY house ASM house AIA house MSR house BMU house
MAF house GGY house SXM house NFK house PCN house BLM house MAC house TKL house ATC empty`.trim().split(/\s+/).reduce((a, w, i, all) => (i % 2 ? a : [...a, [w, all[i + 1]]]), []));
// Each cat's Wikipedia page, for its photo and a link to read more: the exact species where the clue's plain name
// covers several (the lynx in Spain is the Iberian lynx). Housecats and explorers get the page on cats.
const WIKI = {
  lion: "Lion", tiger: "Tiger", leopard: "Leopard", panther: "Black panther", snow: "Snow leopard", clouded: "Clouded leopard",
  jaguar: "Jaguar", cheetah: "Cheetah", puma: "Cougar", lynx: "Eurasian lynx", bobcat: "Bobcat", caracal: "Caracal",
  serval: "Serval", ocelot: "Ocelot", margay: "Margay", jaguarundi: "Jaguarundi", oncilla: "Oncilla", geoffroy: "Geoffroy's cat",
  kodkod: "Kodkod", andean: "Andean mountain cat", golden: "African golden cat", leopardcat: "Leopard cat", fishing: "Fishing cat",
  rusty: "Rusty-spotted cat", manul: "Pallas's cat", sand: "Sand cat", blackfoot: "Black-footed cat", jungle: "Jungle cat",
  wildcat: "European wildcat", house: "Cat", empty: "Cat"};
const WIKI_HERE = {CAN: "Canada lynx", ESP: "Iberian lynx", PRT: "Iberian lynx", LSO: "African wildcat", TUN: "African wildcat",
  LBN: "African wildcat", BRN: "Sunda clouded leopard", PHL: "Sunda leopard cat"};
// The disputed round's cats: a wild cat recorded there (GBIF sightings inside each place's outline), or a housecat.
const DZ_CAT = {crimea: "house", donbas: "house", golan: "jungle", wsahara: "sand", kashmir: "snow", aksaichin: "manul", tibet: "snow", arunachal: "clouded",
  abkhazia: "wildcat", sossetia: "lynx", transnistria: "wildcat", ncyprus: "house", somaliland: "caracal", abyei: "leopard", ilemi: "cheetah",
  kurils: "house", karabakh: "lynx", kosovo: "lynx", taiwan: "leopardcat", palestine: "caracal", korea: "leopardcat", falklands: "house",
  chagos: "house", belize: "jaguar", essequibo: "ocelot"};
const catOf = code => code.startsWith("dz:") ? DZ_CAT[code.slice(3)] : CLUE[code];
const wikiTitle = code => WIKI_HERE[code] || WIKI[catOf(code)] || "Cat";
// The place's own Wikipedia page, where its name isn't the page's title (and, in the disputed round, the dispute's page).
const PLACE_WIKI = {GEO: "Georgia (country)", IRL: "Republic of Ireland", FSM: "Federated States of Micronesia", PSX: "State of Palestine",
  IOA: "Australian Indian Ocean Territories", BES: "Caribbean Netherlands", MAF: "Collectivity of Saint Martin"};
const wikiUrl = title => "https://en.wikipedia.org/wiki/" + encodeURIComponent(title.replace(/ /g, "_"));

  if (card.filled.length < dzBlanks(d).length) { G.note("Yes!", 1200); save(); show(); focusTyping(); return; }
  game.res.push({c: t.c, first: !card.wrong.length && !card.hints, found: true, hinted: card.hints > 0, bonus: card.alts.length});
  G.note(card.wrong.length || card.hints ? "Filled in." : "All of it, first try!", 1600);
  flash = {code: t.c}; busy = true; save(); show();
  setTimeout(() => {
    flash = null; busy = false;
    if (d.aka.some(g => !card.alts.includes(g[0]))) { card.bonus = "ask"; save(); show(); focusTyping(); } else seeCat();
  }, 1100);
}
function dzNext() {
  game.i++; game.card = dzCard();
  if (game.i >= TRIP) return dzWin();
  save(); show(true); focusTyping();
}
function dzWin() {
  game.won = true; game.i = TRIP - 1;
  const first = game.res.filter(r => r.first).length, found = game.res.filter(r => r.found).length, bonuses = game.res.reduce((s, r) => s + (r.bonus || 0), 0);
  const gold = !game.hinted && !game.restarted && first === TRIP;
  G.finishClock(Object.assign(game, {level: bestKey(game)}));
  game.level = 9; save(); show();
  G.track("Catlas finished Disputed land");
  G.winCard(`${first} of ${TRIP} filled in with no wrong guesses, ${found} in all. ${bonuses} other ${bonuses === 1 ? "name" : "names"} named.`, () => { G.closeCard(); newDzTrip(); }, "Look at the map", game.result,
    {title: "Round done!", gold, top: masterPart("disputed", gold), goldWhy: "Every sentence right, first try!", next: "New round",
     after: G.otherSize($("levelSel"), LAST, startRound, "Or play a different round:")});
}
// Countries trips or the disputed round.
function showMode() {
  const dz = settings.round === LAST;
  $("clue").classList.toggle("dz", dz);
  G.relabel($("newBtn"), dz ? "New round" : "New trip");
  if (!dz) $("reveal").classList.remove("note");
}

/* ---------- start ---------- */
function start() {
  setStyle(STYLES[settings.style] ? settings.style : "list");
  G.reopen(() => {
    const g = saved.game;
    if (g && g.trip && g.trip.length === TRIP && g.trip.every(t => PLACES.includes(t.c) || (t.c.startsWith("dz:") && DISPUTES[t.c.slice(3)])) && REGIONS[g.region]) {
      game = g; G.checkClock(game); settings.round = roundNow(g); $("levelSel").value = settings.round; showMode();
      show("jump");
    } else startRound(settings.round);
  }, msg => { startRound(settings.round); G.note(msg, 0); });
  if (!settings.seenHelp) setTimeout(walkthrough, 400);
}

/* ---------- share links ---------- */
// A link to the same ten places (level, region and order), and, if wanted, how each answered one went.
$("linkBtn").onclick = () => { if (game && !busy) G.shareCard({name: "Catlas", won: game.won,
  puzzle: () => ({g: "atlas", N: game.mode === "disputed" ? 9 : game.level, r: game.region, t: game.trip.map(t => t.c).join(" ")}),
  progress: () => game.res.map(r => [+r.first, +r.found, +r.hinted, +(r.bonus || 0)])}); };
function openShared(d) {
  const codes = String(d.t || "").split(" "), dz = d.N === 9, level = +d.N;
  const ok = codes.length === TRIP && new Set(codes).size === TRIP && (dz ? codes.every(c => c.startsWith("dz:") && DISPUTES[c.slice(3)] && world.by[c])
    : [1, 2, 3].includes(level) && REGIONS_AT[level].includes(d.r) && codes.every(c => PLACES.includes(c) && world.main[c]));
  if (!ok) { G.note("That share link didn't work. It may have been cut off.", 6000); return; }
  if (dz) newDzTrip(codes.map(c => dzItem(c.slice(3)))); else newTrip(level, d.r, codes.map(c => tripItem(c, level)));
  if (!Array.isArray(d.p)) return;
  game.res = d.p.slice(0, TRIP).filter(Array.isArray).map((r, i) => {
    const c = game.trip[i].c;
    return {c, first: !!r[0], found: !!r[1], hinted: !!r[2], ...(dz ? {bonus: Math.max(0, Math.min(9, Math.floor(+r[3]) || 0))} : DEPS[c] ? {bonus: !!r[3]} : {})};
  });
  game.i = game.res.length; game.timed = false; game.started = true; game.hinted = game.res.some(r => r.hinted);
  if (game.i >= TRIP) dz ? dzWin() : win(); else { save(); show(true); }
}
const shareOpts = () => ({name: "Catlas", inProgress: !!(game && !game.won && game.res.length), open: openShared});
G.nav("atlas");
const shared = G.readShare("atlas");
Promise.all(["world.json", "disputed.json", "dz.json"].map(f => fetch(f + "?v=" + window.SITE_BUILD).then(r => r.json()))).then(([raw, disputed, dz]) => {
  world = buildWorld(raw, disputed, dz); $("loading").remove(); resize(); start();
  if (shared) G.offerShare(shared, shareOpts());
  // A share link opened while this page is already showing only changes the address, so watch for it.
  window.addEventListener("hashchange", () => { const d = G.readShare("atlas"); if (d) G.offerShare(d, shareOpts()); });
}).catch(e => { $("loading").textContent = "The map couldn't load. Check your connection and reload."; throw e; });
</script>
