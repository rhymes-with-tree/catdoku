<main>
  <header><h1>Cat Atlas</h1><div class="stripe"></div><p class="tagline">Name the country where each cat is hiding</p></header>
  <nav class="games" id="games" aria-label="Games"></nav>

  <div class="status"><span class="dots" id="count" aria-label=""></span><button class="timer" id="timer" hidden></button><span class="msg" id="msg" aria-live="polite"></span></div>

  <div class="wrap map" id="board">
    <div class="grid" id="grid"><canvas id="canvas" tabindex="0" role="img" aria-label="World map with one country lit up. Drag to move, pinch or scroll to zoom."></canvas></div>
    <div class="key" aria-hidden="true"><i></i>Disputed</div>
    <div class="loading" id="loading">Unrolling the map…</div>
    <button class="recentre" id="recentreBtn" aria-label="Back to the lit country" title="Back to the lit country"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  </div>
  <div class="overlay" id="overlay"><div class="card" id="card"></div></div>

  <div class="pad" id="pad">
    <p class="clue" id="clue"></p>
    <p class="reveal" id="reveal" aria-live="polite"></p>
    <div class="choices" id="choices" hidden></div>
    <form class="typebox" id="typebox" hidden autocomplete="off">
      <input id="guess" type="text" enterkeyhint="go" spellcheck="false" autocapitalize="words" aria-label="Country name" placeholder="Type a country">
      <button type="submit" class="primary" id="goBtn">Go</button>
    </form>
    <ul class="list" id="list" role="listbox" aria-label="Countries" hidden></ul>
    <div class="tried" id="tried" aria-label="Wrong guesses"></div>
  </div>

  <div class="actions">
    <button id="hintBtn">Hint</button>
    <button id="restartBtn">Restart</button>
    <button id="shareBtn">Share</button>
    <button id="bestBtn">Best times</button>
    <button id="helpBtn">How to play</button>
  </div>
  <div class="bar">
    <label>Level <select id="levelSel" aria-label="Level"></select></label>
    <button id="newBtn" class="primary">New trip</button>
  </div>
</main>
