<style>
/* A room seen from above: a wooden floor inside a wall, with a laser pointer poking in at one edge. Cats sit on
   some squares and mirrors stand on others; tap a mirror to tip it the other way. The red dot runs straight and
   bounces off the mirrors, and every cat it passes opens its eyes and watches it. */
.room{--floor:#E8DCC4; --plank:#D9C7A3; --wall:#B9A27E; --wall-in:#A68E69; --beam:#E16A4A; --dot:#C8392B;
  --stand:#D8C6A2; --stand-ring:#BBA57C; --glass:#4E577D;
  background:var(--wall);border:3px solid var(--ink);border-radius:10px;overflow:hidden;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.room .grid{position:absolute;inset:0}
.room svg{display:block;width:100%;height:100%;outline:none}
.floor{fill:var(--floor)}
.plank{stroke:var(--plank);stroke-width:2;fill:none}
.skirting{fill:none;stroke:var(--wall-in);stroke-width:6}
.stand{fill:var(--stand);stroke:var(--stand-ring);stroke-width:3}
.mirror{cursor:pointer}
.mirror .tilt{transform-box:view-box;transition:transform .18s ease-out}
.mirror .pane{fill:url(#glass);stroke:var(--glass);stroke-width:3}
.mirror .glint{stroke:#fff;stroke-width:3;stroke-linecap:round;opacity:.9}
.mirror .pin{fill:var(--glass)}
.beam{fill:none;stroke:var(--beam);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.beamglow{fill:none;stroke:var(--beam);stroke-width:22;stroke-linecap:round;stroke-linejoin:round;opacity:.22;pointer-events:none}
/* on a moving level, a faint dashed line shows where the dot would go from here with the mirrors as they stand */
.ahead{fill:none;stroke:var(--beam);stroke-width:4;stroke-dasharray:4 10;stroke-linecap:round;opacity:.45;pointer-events:none}
.dot{fill:var(--dot);pointer-events:none}
.dotglow{fill:var(--beam);opacity:.35;pointer-events:none}
.pen .body{fill:#3E3848}
.pen .tip{fill:#C9CED8;stroke:#3E3848;stroke-width:2}
.pen .button{fill:var(--beam)}
/* cats: eyes shut until the dot runs past, then wide open and watching it */
.cat{pointer-events:none}
.cat .open{display:none}
.cat.lit .open{display:inline} .cat.lit .shut{display:none}
.cat .hop{transform-box:fill-box;transform-origin:50% 100%}
.cat.pounce .hop{animation:pounce .42s ease-out}
@keyframes pounce{30%{transform:translateY(-12px) scale(1.08,.94)}60%{transform:translateY(0) scale(.96,1.06)}}
.badge circle{fill:#fff;stroke:var(--ink);stroke-width:3}
.badge text{font:800 22px var(--font);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.cat.inorder .badge circle{fill:#6AA673} .cat.inorder .badge text{fill:#fff}
.cat.tooSoon .badge circle{fill:#C8392B} .cat.tooSoon .badge text{fill:#fff}
/* once solved, toys fly in */
.toy{pointer-events:none}
.toyshadow{fill:#2A2530}
/* the win card's tip for real cats */
.card p.psa{font-size:14px;line-height:1.3;color:var(--ink);background:#F3E6D9;border:2px solid #E8956F;border-radius:10px;padding:8px 10px;margin:0 0 14px;text-align:left}
.cursor{fill:none;stroke:#73A7AE;stroke-width:6;pointer-events:none}
@media (prefers-reduced-motion:reduce){.mirror .tilt{transition:none}}
/* the level names are long, so the picker's text is a little smaller to keep New room beside it */
#levelSel{font-size:15px;padding:4px 6px}
</style>

<script>
/* ---------- laser puzzles (plain functions, also run in a background worker) ---------- */
// The room is N × N squares. The laser pointer sits just off one edge and shines in along a row or column.
// A square is floor, a cat or a mirror. Mirrors stand at a slant, / (0) or \ (1), and a tap tips one over to
// the other slant; both faces reflect. The dot runs straight over floor and cats and bounces off mirrors, and
// since every bounce can be run backwards it can't go round in a loop: it always leaves the room.
// Win: the dot passes every cat (from level 6, in the order of the cats' numbers).
// Levels: the room's size, how many mirrors the dot uses, how many it doesn't (spares), the fewest cats and
// whether order counts. From level 11 the laser is live: the dot sets off when you switch it on, taking `live` ms
// a square, and the mirrors can only be tipped while it's on its way.
function levelSpec(n) {
  return [null, {N: 5, use: 3, spare: 0, cats: 3}, {N: 5, use: 4, spare: 1, cats: 3}, {N: 6, use: 5, spare: 2, cats: 4},
    {N: 6, use: 7, spare: 2, cats: 4}, {N: 7, use: 8, spare: 3, cats: 5}, {N: 6, use: 6, spare: 2, cats: 4, order: true},
    {N: 7, use: 8, spare: 3, cats: 5, order: true}, {N: 7, use: 10, spare: 4, cats: 5, order: true},
    {N: 8, use: 12, spare: 4, cats: 6, order: true}, {N: 8, use: 14, spare: 6, cats: 6, order: true},
    {N: 5, use: 4, spare: 1, cats: 3, live: 650}, {N: 6, use: 5, spare: 2, cats: 4, live: 600},
    {N: 6, use: 7, spare: 2, cats: 4, live: 560}, {N: 7, use: 8, spare: 3, cats: 5, live: 520, order: true},
    {N: 7, use: 10, spare: 4, cats: 5, live: 480, order: true}][n];
}
// Directions: 0 up, 1 right, 2 down, 3 left. A / sends right↔up and left↔down; a \ sends right↔down and left↔up.
function bounce(d, m) { return m ? 3 - d : d ^ 1; }
function step(N, i, d) {
  const x = i % N, y = (i - x) / N;
  if (d === 0) return y > 0 ? i - N : -1;
  if (d === 2) return y < N - 1 ? i + N : -1;
  if (d === 3) return x > 0 ? i - 1 : -1;
  return x < N - 1 ? i + 1 : -1;
}
// The dot's run with the mirrors as they are: the squares it crosses in order, each with the way it leaves,
// ending with the square it leaves the room from. mir[i] is -1 for no mirror, else 0 or 1.
function trace(N, mir, start, dir) {
  const path = [];
  let i = start, d = dir;
  for (let k = 0; k < 4 * N * N + 4 && i >= 0; k++) {
    if (mir[i] >= 0) d = bounce(d, mir[i]);
    path.push([i, d]);
    i = step(N, i, d);
  }
  return path;
}
// Every way of setting the mirrors the dot meets that walks it past every cat (in order, if order counts), up
// to `limit`. cat[i] is 0 or the cat's number. Mirrors the dot never meets don't count. Returns the settings
// (-1 for a mirror the dot doesn't use) and the squares the dot crosses.
function solve(N, isMir, cat, start, dir, order, limit) {
  const cats = cat.filter(c => c).length, set = new Array(N * N).fill(-1), seen = new Uint8Array(N * N), out = [];
  // marks: the cats this call has seen first, to forget again when it returns
  (function go(i, d, got, next, path) {
    const marks = [];
    const done = () => { for (const j of marks) seen[j] = 0; };
    while (i >= 0) {
      if (isMir[i]) {
        if (set[i] < 0) {
          for (const m of [0, 1]) {
            if (out.length >= limit) break;
            set[i] = m; go(i, d, got, next, path.slice()); set[i] = -1;
          }
          return done();
        }
        d = bounce(d, set[i]);
      } else if (cat[i] && !seen[i]) {
        if (order && cat[i] !== next) return done();
        seen[i] = 1; marks.push(i); got++; next++;
      }
      path.push(i);
      i = step(N, i, d);
    }
    if (got === cats) out.push({set: set.slice(), path});
    done();
  })(start, dir, 0, 1, []);
  return out;
}
function shuffle(a) { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
// Scatter mirrors, shine the laser, keep the mirrors the dot uses (and a few spares), then sit cats on squares
// along its run until that's the only run that passes them all.
function makeRoom(n) {
  const spec = levelSpec(n), N = spec.N, NN = N * N;
  if (spec.live) return makeLiveRoom(n);
  for (let attempt = 0; attempt < 200; attempt++) {
    const mir = new Array(NN).fill(-1);
    for (const i of shuffle([...Array(NN).keys()]).slice(0, Math.round(NN * (0.3 + Math.random() * 0.15)))) mir[i] = Math.random() < 0.5 ? 0 : 1;
    // the laser: any square on the edge, shining inwards
    const side = Math.floor(Math.random() * 4), k = Math.floor(Math.random() * N);
    const start = [k, (N - 1) * N + k, k * N + N - 1, k * N][side], dir = [2, 0, 3, 1][side];
    if (mir[start] >= 0) continue;
    const path = trace(N, mir, start, dir), used = new Set(path.map(([i]) => i).filter(i => mir[i] >= 0));
    if (used.size !== spec.use) continue;
    // a mirror hit from both faces is fine; the floor the dot crosses
    const floor = [...new Set(path.map(([i]) => i).filter(i => mir[i] < 0))];
    const spare = shuffle([...Array(NN).keys()].filter(i => mir[i] >= 0 && !used.has(i))).slice(0, spec.spare);
    if (spare.length < spec.spare) continue;
    const isMir = new Array(NN).fill(0); for (const i of used) isMir[i] = 1; for (const i of spare) isMir[i] = 1;
    // cats: start with the level's fewest along the run, then add one wherever another run gets by without it
    const order = floor;   // squares in the order the dot first reaches them
    if (order.length < spec.cats + 3) continue;
    const catAt = new Set(shuffle(order.slice(1)).slice(0, spec.cats));
    const numbered = () => { const c = new Array(NN).fill(0); let k = 0; for (const i of order) if (catAt.has(i)) c[i] = ++k; return c; };
    let ok = false;
    for (let tries = 0; tries < 12; tries++) {
      const sols = solve(N, isMir, numbered(), start, dir, spec.order, 2);
      if (sols.length === 1) { ok = true; break; }
      const other = sols.find(s => s.path.length !== path.length || s.path.some((v, j) => v !== path[j][0]));
      const off = new Set(other ? other.path : []), miss = order.filter(i => !off.has(i) && !catAt.has(i));
      if (!other || !miss.length) break;
      catAt.add(miss[Math.floor(Math.random() * miss.length)]);
    }
    if (!ok) continue;
    // drop any cat that isn't needed
    for (const i of shuffle([...catAt])) {
      if (catAt.size <= spec.cats) break;
      catAt.delete(i);
      if (solve(N, isMir, numbered(), start, dir, spec.order, 2).length !== 1) catAt.add(i);
    }
    if (catAt.size > spec.cats + 2) continue;
    const cat = numbered(), sol = isMir.map((m, i) => m ? (used.has(i) ? mir[i] : -1) : -1);
    // the starting slants: random, but never already solved, and at least half the used mirrors wrong
    let tilt;
    for (let t = 0; t < 50; t++) {
      tilt = isMir.map((m, i) => m ? (Math.random() < 0.5 ? 0 : 1) : -1);
      const wrong = [...used].filter(i => tilt[i] !== mir[i]).length;
      if (wrong * 2 >= used.size && !wins(N, tilt, cat, start, dir, spec.order)) break;
      tilt = null;
    }
    if (!tilt) continue;
    return {N, start, dir, cat, sol, tilt};
  }
  return null;
}
// Is the room solved: does the dot, with the mirrors as they are, pass every cat (in order if it counts)?
function wins(N, mir, cat, start, dir, order) {
  const cats = cat.filter(c => c).length, seen = new Set(); let next = 1;
  for (const [i] of trace(N, mir, start, dir)) if (cat[i] && !seen.has(i)) {
    if (order && cat[i] !== next) return false;
    seen.add(i); next++;
  }
  return seen.size === cats;
}
// The moving levels: the dot can meet a mirror twice, and the mirror can be tipped between the two visits.
// Every way of running the dot past every cat (in order, if order counts), up to `limit`, where each visit to a
// mirror picks its own slant and no mirror is met more than twice. Each is the visits, [square, slant] in order,
// and the floor squares the dot crosses. Null if that takes too long to find out.
function solveLive(N, isMir, cat, start, dir, order, limit) {
  const NN = N * N, cats = cat.filter(c => c).length, visits = new Uint8Array(NN), seen = new Uint8Array(NN), out = [];
  let work = 0;
  (function go(i, d, got, next, seq, floor) {
    const marks = [], done = () => { for (const j of marks) seen[j] = 0; };
    while (i >= 0) {
      if (++work > 300000 || floor.length > 4 * NN) return done();
      if (isMir[i]) {
        if (visits[i] >= 2) return done();
        visits[i]++;
        for (const m of [0, 1]) {
          if (out.length >= limit) break;
          seq.push([i, m]); const nd = bounce(d, m);
          go(step(N, i, nd), nd, got, next, seq, floor.slice()); seq.pop();
        }
        visits[i]--;
        return done();
      }
      if (cat[i] && !seen[i]) {
        if (order && cat[i] !== next) return done();
        seen[i] = 1; marks.push(i); got++; next++;
      }
      floor.push(i);
      i = step(N, i, d);
    }
    if (got === cats) out.push({seq: seq.slice(), floor});
    done();
  })(start, dir, 0, 1, [], []);
  return work > 300000 ? null : out;
}
// A moving room: scatter mirrors and run the dot with a random slant at each visit, keeping a run that meets some
// mirror twice at different slants with floor squares between the visits. Cats go on the run (one between those
// two visits, so the mirror has to be tipped after that cat sees the dot) until it's the only run that passes
// them all, so tipping a mirror mid-run is the only way to win.
function makeLiveRoom(n) {
  const spec = levelSpec(n), N = spec.N, NN = N * N;
  for (let attempt = 0; attempt < 400; attempt++) {
    const isMir = new Array(NN).fill(0);
    for (const i of shuffle([...Array(NN).keys()]).slice(0, Math.round(NN * (0.3 + Math.random() * 0.15)))) isMir[i] = 1;
    const side = Math.floor(Math.random() * 4), k = Math.floor(Math.random() * N);
    const start = [k, (N - 1) * N + k, k * N + N - 1, k * N][side], dir = [2, 0, 3, 1][side];
    if (isMir[start]) continue;
    // the run
    const seq = [], floor = [], visits = new Array(NN).fill(0);
    let i = start, d = dir, ok = true;
    while (i >= 0 && ok) {
      if (isMir[i]) { if (++visits[i] > 2) { ok = false; break; } const m = Math.random() < 0.5 ? 0 : 1; seq.push([i, m, floor.length]); d = bounce(d, m); }
      else floor.push(i);
      i = step(N, i, d);
      if (floor.length > 3 * NN) ok = false;
    }
    if (!ok) continue;
    // a mirror met twice at different slants, with floor between
    const flips = [];
    seq.forEach(([j, m, at], a) => { const b = seq.findIndex(([j2, m2], c) => c > a && j2 === j && m2 !== m); if (b >= 0 && seq[b][2] > at) flips.push([at, seq[b][2]]); });
    if (!flips.length) continue;
    const used = new Set(seq.map(([j]) => j));
    if (used.size < spec.use - 1 || used.size > spec.use + 2) continue;
    const order = [...new Set(floor)];
    if (order.length < spec.cats + 3) continue;
    // keep the used mirrors and some spares
    const spare = shuffle([...Array(NN).keys()].filter(j => isMir[j] && !used.has(j))).slice(0, spec.spare);
    for (let j = 0; j < NN; j++) isMir[j] = used.has(j) || spare.includes(j) ? 1 : 0;
    // cats: one between the two visits of a flipped mirror, the rest along the run
    const [fa, fb] = flips[0], between = [...new Set(floor.slice(fa, fb))];
    const catAt = new Set([between[Math.floor(Math.random() * between.length)]]);
    for (const j of shuffle(order.slice(1))) { if (catAt.size >= spec.cats) break; catAt.add(j); }
    const numbered = () => { const c = new Array(NN).fill(0); let q = 0; for (const j of order) if (catAt.has(j)) c[j] = ++q; return c; };
    const same = s => s.seq.length === seq.length && s.seq.every(([j, m], q) => j === seq[q][0] && m === seq[q][1]);
    let unique = false;
    for (let tries = 0; tries < 12; tries++) {
      const sols = solveLive(N, isMir, numbered(), start, dir, spec.order, 2);
      if (!sols || !sols.length) break;
      if (sols.length === 1) { unique = same(sols[0]); break; }
      const other = sols.find(s => !same(s)), off = new Set(other.floor), miss = order.filter(j => !off.has(j) && !catAt.has(j));
      if (!miss.length) break;
      catAt.add(miss[Math.floor(Math.random() * miss.length)]);
    }
    if (!unique || catAt.size > spec.cats + 2) continue;
    const cat = numbered();
    // the mirrors start at random, at least half of the ones the dot first meets the wrong way
    const first = {}; for (const [j, m] of seq) if (!(j in first)) first[j] = m;
    let tilt = null;
    for (let t = 0; t < 30 && !tilt; t++) {
      const tl = isMir.map(m => m ? (Math.random() < 0.5 ? 0 : 1) : -1), wrong = Object.keys(first).filter(j => tl[j] !== first[j]).length;
      if (wrong * 2 >= used.size) tilt = tl;
    }
    if (!tilt) continue;
    return {N, start, dir, cat, sol: isMir.map(m => m ? -1 : -1), seq: seq.map(([j, m]) => [j, m]), tilt};
  }
  return null;
}

/* ---------- game state ---------- */
// game: {level, N, start and dir (where the laser shines in, and which way), cat (0 or each cat's number, by
//        square), sol (each mirror's answer: 0 /, 1 \, -1 for a spare or no mirror), tilt (how each mirror
//        stands now, -1 for no mirror), first (how they stood at the start), history (squares tapped, or
//        {tilt} for a Restart), won, hinted, undid…}
const STORE = "catdoku.laserpointer.v1", MAX_LEVEL = 15, M = 56, NS = "http://www.w3.org/2000/svg";
const $ = G.$;
let state = G.load(STORE);
let settings = Object.assign({level: 1}, state.settings);
let game = state.game || null, busy = false, running = false, cursor = -1;
const save = () => G.save(STORE, {settings, game});
const playing = () => game && !game.won && !busy && !running && !$("overlay").classList.contains("show");
const levelName = n => { const s = levelSpec(n); return `Level ${n} · ${s.N} × ${s.N}${s.live ? ", moving" : ""}${s.order ? ", in order" : ""}`; };
const build = G.builder([levelSpec, bounce, step, trace, solve, shuffle, wins, solveLive, makeLiveRoom, makeRoom], "makeRoom");
const order = () => levelSpec(game.level).order;
const isLive = () => !!levelSpec(game.level).live;
const el = (t, a, parent) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (parent) parent.append(e); return e; };
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const centre = i => [i % game.N * 100 + 50, Math.floor(i / game.N) * 100 + 50];

/* ---------- drawing ---------- */
// Coats for the cats: ginger, grey, black, cream, tabby and white, all tints of the site's colours.
const COATS = [["#E8956F", "#2A2530"], ["#A39EAB", "#2A2530"], ["#3E3848", "#F7F8F3"], ["#EBD39A", "#2A2530"], ["#B08A66", "#2A2530"], ["#F7F8F3", "#2A2530"]];
let mirrors = [], cats = [], beamPts = [], catAt = [];
function drawCat(g, coat, num) {
  const [fur, line] = COATS[coat], dark = coat === 2;
  const hop = el("g", {class: "hop"}, g);
  // ears, head, eyes (shut and open), nose and whiskers, drawn round the middle of the square
  for (const s of [-1, 1]) {
    el("path", {d: `M${s * 28} -2 L${s * 24} -38 L${s * 4} -22 Z`, fill: fur, stroke: "#2A2530", "stroke-width": 3, "stroke-linejoin": "round"}, hop);
    el("path", {d: `M${s * 23} -8 L${s * 21} -29 L${s * 10} -20 Z`, fill: "#DD9DAD"}, hop);
  }
  el("ellipse", {cx: 0, cy: 2, rx: 31, ry: 26, fill: fur, stroke: "#2A2530", "stroke-width": 3}, hop);
  const shut = el("g", {class: "shut", fill: "none", stroke: line, "stroke-width": 3, "stroke-linecap": "round"}, hop);
  for (const s of [-1, 1]) el("path", {d: `M${s * 18} -1 q${-s * 7} 6 ${-s * 13} 0`}, shut);
  const open = el("g", {class: "open"}, hop);
  for (const s of [-1, 1]) {
    el("ellipse", {cx: s * 11, cy: -2, rx: 8, ry: 9, fill: dark ? "#ECE07A" : "#fff", stroke: "#2A2530", "stroke-width": 2}, open);
    el("ellipse", {class: "pupil", cx: s * 11, cy: -2, rx: 3.4, ry: 6, fill: "#2A2530"}, open);

function finishCard() {
  const next = settings.level, gold = !game.undid && !game.hinted;
  let text = `The dot ran past all ${catAt.length} cats${order() ? " in order" : ""} in the ${game.N} × ${game.N} room.`;
  text += game.hinted ? ` You had a hint, so here's another at level ${next}.` : game.level === MAX_LEVEL ? " That's the hardest level; here's another." : ` Next up: level ${next}.`;
  G.winCard(text, () => { G.closeCard(); startLevel(next); }, "Admire my room", game.result,
    {title: "Got it!", gold, goldWhy: "No hints or undos!", next: `Next: level ${next}`,
     after: G.otherSize($("levelSel"), next, startLevel, "Or play a different level:")});
  // a word for the humans, just above the buttons
  const psa = document.createElement("p"); psa.className = "psa";
  psa.innerHTML = "<b>Playing laser with a real cat?</b> A dot can never be caught, so finish with a toy they can pounce on and catch.";
  $("card").querySelector(".btns").before(psa);
}

/* ---------- new rooms ---------- */
function startLevel(n) { settings.level = n; $("levelSel").value = n; save(); newPuzzle(); }
function begin(p, level) {
  game = {level, N: p.N, start: p.start, dir: p.dir, cat: p.cat, sol: p.sol, tilt: p.tilt.slice(), first: p.tilt.slice(),
    history: [], won: false, ...G.freshClock()};
  if (p.seq) game.seq = p.seq;
  cursor = -1; clearHint(); live = null;
}
async function newPuzzle() {
  if (busy) return;
  busy = true;
  const n = settings.level;
  G.openCard("Setting up the mirrors…", "", []);
  const p = await build.take(n);
  begin(p, n);
  busy = false; G.closeCard(); G.note("");
  draw(); save();
  if (isLive()) G.note("Tap the room to switch the laser on.", 0);
  build.prefetch(n);
  G.track(`Laser Pointer new puzzle level ${n}`);
  helpOnFirstVisit();
}

/* ---------- sharing ---------- */
// One letter per square: "." floor, 1–9 a cat, and for a mirror its answer and how it started, a–f
// (a/b a spare standing / or \, c/d an answer of / standing / or \, e/f an answer of \). With progress,
// how every mirror stands now, 0 or 1 each in order. A moving level adds the answer's bounces, each the square in
// two base-36 digits and the slant.
const roomOut = (tilt) => game.cat.map((c, i) => game.tilt[i] < 0 ? (c ? String(c) : ".") : "abcdef"[(game.sol[i] + 1) * 2 + tilt[i]]).join("");
$("shareBtn").onclick = () => { if (game && !busy) G.shareCard({name: "Laser Pointer", won: game.won,
  puzzle: () => ({g: "laserpointer", N: game.level, r: roomOut(game.first), e: game.start * 4 + game.dir,
    ...(game.seq ? {q: game.seq.map(([i, m]) => i.toString(36).padStart(2, "0") + m).join("")} : {})}),
  progress: () => game.tilt.filter(t => t >= 0).join("")}); };
function openShared(d) {
  const spec = levelSpec(d.N), N = spec ? spec.N : 0, fail = () => G.note("That share link didn't work.", 5000);
  if (!N || typeof d.r !== "string" || d.r.length !== N * N || !/^[.1-9a-f]+$/.test(d.r) || !Number.isInteger(d.e)) return fail();
  const start = d.e >> 2, dir = d.e & 3, sx = start % N, sy = Math.floor(start / N);
  // the laser must sit at the edge it shines in from
  if (start >= N * N || ![sy === N - 1, sx === 0, sy === 0, sx === N - 1][dir]) return fail();
  const cat = [], sol = [], tilt = [];
  for (const ch of d.r) {
    const k = "abcdef".indexOf(ch);
    cat.push(k < 0 && ch !== "." ? +ch : 0); sol.push(k < 0 ? -1 : (k >> 1) - 1); tilt.push(k < 0 ? -1 : k & 1);
  }
  if (tilt[start] >= 0) return fail();
  const nums = cat.filter(c => c).sort((a, b) => a - b);
  if (nums.length < 1 || nums.some((c, k) => c !== k + 1)) return fail();
  let seq = null;
  if (spec.live) {
    // the bounces must walk the dot past every cat, in order if it counts, meeting no mirror more than twice
    if (typeof d.q !== "string" || d.q.length % 3 || !/^([0-9a-z]{2}[01])+$/.test(d.q)) return fail();
    seq = d.q.match(/.../g).map(t => [parseInt(t.slice(0, 2), 36), +t[2]]);
    let i = start, dd = dir, k = 0, next = 1, steps = 0; const seen = new Set();
    while (i >= 0 && steps++ < 6 * N * N) {
      if (tilt[i] >= 0) { if (!seq[k] || seq[k][0] !== i) return fail(); dd = bounce(dd, seq[k++][1]); }
      else if (cat[i] && !seen.has(i)) { if (spec.order && cat[i] !== next) return fail(); seen.add(i); next++; }
      i = step(N, i, dd);
    }
    if (i >= 0 || k !== seq.length || seen.size !== nums.length || seq.some(([j]) => seq.filter(([q]) => q === j).length > 2)) return fail();
  } else if (!wins(N, sol.map((v, i) => v >= 0 ? v : tilt[i]), cat, start, dir, spec.order)) return fail();
  begin({N, start, dir, cat, sol, tilt, seq}, d.N);
  if (typeof d.p === "string" && d.p.length === tilt.filter(t => t >= 0).length && /^[01]*$/.test(d.p)) {
    let k = 0; game.tilt = tilt.map(t => t < 0 ? -1 : +d.p[k++]); game.timed = false;
  }
  settings.level = d.N; $("levelSel").value = d.N;
  draw(); save(); build.prefetch(d.N);
  if (update() && game.timed === false) win();
}

/* ---------- how to play ---------- */
function showHelp() {
  settings.seenHelp = false; helpOnFirstVisit();
  if (!document.querySelector(".spot")) { settings.seenHelp = true; G.helpLater(); }
}
// Where the squares are: the room has a strip of wall all round.
function map() {
  const r = $("svg").getBoundingClientRect(), S = game.N * 100, k = r.width / (S + 2 * M);
  return {ox: r.left + M * k, oy: r.top + M * k, cw: 100 * k, ch: 100 * k};
}
// First visit: walk through the room that's out. The first level where order counts gets a tip of its own.
function helpOnFirstVisit() {
  if (!game || !playing() || document.querySelector(".spot")) return;
  const N = game.N, xy = i => [i % N, Math.floor(i / N)], all = [...Array(N * N).keys()];
  const mirs = all.filter(i => game.tilt[i] >= 0), path = trace(N, game.tilt, game.start, game.dir).map(([i]) => i);
  const onPath = mirs.filter(i => path.includes(i)), lit = catAt.filter(i => path.includes(i));
  const orderSteps = order() ? [
    {say: "Now the cats have numbers", lit: catAt.map(xy)},
    {say: "The dot must pass them in order: 1, 2, 3…", lit: catAt.map(xy)},
  ] : [];
  const liveSteps = isLive() ? [
    {say: "Now the laser starts switched off", els: [() => [$("pen"), $("startsq")]]},
    {say: "Tap the room to switch it on", lit: all.map(xy)},
    {say: "Tip mirrors before the dot gets there", lit: mirs.map(xy)},
    {say: "The dot comes back to some mirrors", lit: mirs.map(xy)},
    {say: "Tip those again after it bounces, to reach the next cat", lit: mirs.map(xy)},
  ] : [];
  const done = () => { settings.seenHelp = true; if (order()) settings.seenOrder = true; if (isLive()) settings.seenLive = true; save(); };
  if (settings.seenHelp) {
    const tips = [...(isLive() && !settings.seenLive ? liveSteps : []), ...(order() && !settings.seenOrder ? orderSteps : [])];
    if (tips.length) G.spotlight({grid: $("grid"), w: N, h: N, steps: tips, map, finish: false, done});
    return;
  }
  const steps = [
    {say: "The cats want to chase the laser dot", lit: all.map(xy)},
    {say: "The laser shines in here", els: [() => [$("pen"), $("startsq")]]},
    {say: "The dot bounces off mirrors", lit: mirs.map(xy)},
    {say: "Tap a mirror to tip it the other way", lit: [xy(onPath[0] ?? mirs[0])]},
    ...(lit.length ? [{say: "Cats the dot passes open their eyes", lit: lit.map(xy), tone: "ok"}] : []),
    ...orderSteps,
    ...liveSteps,
    ...(levelSpec(game.level).spare ? [{say: "You won't need every mirror", lit: mirs.map(xy)}] : []),
    {say: "Get the dot past every cat!", lit: catAt.map(xy), tone: "ok"},
    {say: "Stuck? Hint shows a mirror to tip", els: [$("hintBtn")]},
  ];
  G.spotlight({grid: $("grid"), w: N, h: N, steps, map, done});
}

for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(levelName(n).replace("Level ", ""), n));
$("levelSel").onchange = e => { G.closeCard(); startLevel(+e.target.value); };
$("newBtn").onclick = () => { G.closeCard(); newPuzzle(); };
$("helpBtn").onclick = showHelp;

G.nav("laserpointer");
G.checkClock(game);
G.setupTimer({name: "laserpointer", game: () => game, playing: g => !g.won, save, label: levelName, noun: "level"});
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : settings.level);

if (!(settings.level >= 1 && settings.level <= MAX_LEVEL)) settings.level = 1;
$("levelSel").value = settings.level;
const shared = G.readShare("laserpointer");
if (game) G.reopen(() => {
    const spec = levelSpec(game.level), NN = game.N * game.N;
    if (!spec || spec.N !== game.N || game.tilt.length !== NN || game.sol.length !== NN || game.cat.length !== NN) throw new Error("the saved room doesn't fit its level");
    live = null;
    if (isLive() && !game.won) { game.tilt = game.first.slice(); game.history = []; }
    draw();
    if (game.won) finishCard();
    else if (isLive()) G.note("Tap the room to switch the laser on.", 0);
    build.prefetch(settings.level); helpOnFirstVisit();
  }, why => { game = null; newPuzzle().then(() => G.note(why, 0)); });
else if (!shared) newPuzzle();
const shareOpts = () => ({name: "Laser Pointer", inProgress: !!(game && !game.won && game.history.length), open: openShared, after: helpOnFirstVisit});
if (shared) G.offerShare(shared, shareOpts());
window.addEventListener("hashchange", () => { const d = G.readShare("laserpointer"); if (d) G.offerShare(d, shareOpts()); });
</script>
