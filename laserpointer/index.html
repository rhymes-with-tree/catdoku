<style>
/* A room seen from above: a wooden floor inside a wall, with a laser pointer poking in at one edge. Cats sit on
   some squares and mirrors stand on others; tap a mirror to tip it the other way. The red dot runs straight and
   bounces off the mirrors, and every cat it passes opens its eyes and watches it. */
.room{--floor:#E8DCC4; --plank:#D9C7A3; --wall:#B9A27E; --wall-in:#A68E69; --beam:#E16A4A; --dot:#C8392B;
  --stand:#D8C6A2; --stand-ring:#BBA57C; --glass:#4E577D;
  background:var(--wall);border:3px solid var(--ink);border-radius:10px;overflow:hidden;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.room .grid{position:absolute;inset:0}
.room svg{display:block;width:100%;height:100%;outline:none}
.floor{fill:var(--floor)}
.plank{stroke:var(--plank);stroke-width:2;fill:none}
.skirting{fill:none;stroke:var(--wall-in);stroke-width:6}
.stand{fill:var(--stand);stroke:var(--stand-ring);stroke-width:3}
.mirror{cursor:pointer}
.mirror .tilt{transform-box:view-box;transition:transform .18s ease-out}
.mirror .pane{fill:url(#glass);stroke:var(--glass);stroke-width:3}
.mirror .glint{stroke:#fff;stroke-width:3;stroke-linecap:round;opacity:.9}
.mirror .pin{fill:var(--glass)}
.beam{fill:none;stroke:var(--beam);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.beamglow{fill:none;stroke:var(--beam);stroke-width:22;stroke-linecap:round;stroke-linejoin:round;opacity:.22;pointer-events:none}
.dot{fill:var(--dot);pointer-events:none}
.dotglow{fill:var(--beam);opacity:.35;pointer-events:none}
.pen .body{fill:#3E3848}
.pen .tip{fill:#C9CED8;stroke:#3E3848;stroke-width:2}
.pen .button{fill:var(--beam)}
/* cats: eyes shut until the dot runs past, then wide open and watching it */
.cat{pointer-events:none}
.cat .open{display:none}
.cat.lit .open{display:inline} .cat.lit .shut{display:none}
.cat .hop{transform-box:fill-box;transform-origin:50% 100%}
.cat.pounce .hop{animation:pounce .42s ease-out}
@keyframes pounce{30%{transform:translateY(-12px) scale(1.08,.94)}60%{transform:translateY(0) scale(.96,1.06)}}
.badge circle{fill:#fff;stroke:var(--ink);stroke-width:3}
.badge text{font:800 22px var(--font);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.cat.inorder .badge circle{fill:#6AA673} .cat.inorder .badge text{fill:#fff}
.cat.tooSoon .badge circle{fill:#C8392B} .cat.tooSoon .badge text{fill:#fff}
/* once solved, toys fly in */
.toy{pointer-events:none}
.toyshadow{fill:#2A2530}
/* the win card's tip for real cats */
.card p.psa{font-size:14px;line-height:1.3;color:var(--ink);background:#F3E6D9;border:2px solid #E8956F;border-radius:10px;padding:8px 10px;margin:0 0 14px;text-align:left}
.cursor{fill:none;stroke:#73A7AE;stroke-width:6;pointer-events:none}
@media (prefers-reduced-motion:reduce){.mirror .tilt{transition:none}}
/* the level names are long, so the picker's text is a little smaller to keep New room beside it */
#levelSel{font-size:15px;padding:4px 6px}
</style>

<script>
/* ---------- laser puzzles (plain functions, also run in a background worker) ---------- */
// The room is N × N squares. The laser pointer sits just off one edge and shines in along a row or column.
// A square is floor, a cat or a mirror. Mirrors stand at a slant, / (0) or \ (1), and a tap tips one over to
// the other slant; both faces reflect. The dot runs straight over floor and cats and bounces off mirrors, and
// since every bounce can be run backwards it can't go round in a loop: it always leaves the room.
// Win: the dot passes every cat (from level 6, in the order of the cats' numbers).
// Levels: the room's size, how many mirrors the dot uses, how many it doesn't (spares), the fewest cats and
// whether order counts. From level 11 the laser is live: the dot sets off when you switch it on, taking `live` ms
// a square, and the mirrors can only be tipped while it's on its way.
function levelSpec(n) {
  return [null, {N: 5, use: 3, spare: 0, cats: 3}, {N: 5, use: 4, spare: 1, cats: 3}, {N: 6, use: 5, spare: 2, cats: 4},
    {N: 6, use: 7, spare: 2, cats: 4}, {N: 7, use: 8, spare: 3, cats: 5}, {N: 6, use: 6, spare: 2, cats: 4, order: true},
    {N: 7, use: 8, spare: 3, cats: 5, order: true}, {N: 7, use: 10, spare: 4, cats: 5, order: true},
    {N: 8, use: 12, spare: 4, cats: 6, order: true}, {N: 8, use: 14, spare: 6, cats: 6, order: true},
    {N: 5, use: 4, spare: 1, cats: 3, live: 650}, {N: 6, use: 5, spare: 2, cats: 4, live: 600},
    {N: 6, use: 7, spare: 2, cats: 4, live: 560}, {N: 7, use: 8, spare: 3, cats: 5, live: 520, order: true},
    {N: 7, use: 10, spare: 4, cats: 5, live: 480, order: true}][n];
}
// Directions: 0 up, 1 right, 2 down, 3 left. A / sends right↔up and left↔down; a \ sends right↔down and left↔up.
function bounce(d, m) { return m ? 3 - d : d ^ 1; }
function step(N, i, d) {

  if (d === 2) return y < N - 1 ? i + N : -1;

// The dot's run with the mirrors as they are: the squares it crosses in order, each with the way it leaves,

function trace(N, mir, start, dir) {

}
// Every way of setting the mirrors the dot meets that walks it past every cat (in order, if order counts), up

function shuffle(a) { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }

// along its run until that's the only run that passes them all.
function makeRoom(n) {
  const spec = levelSpec(n), N = spec.N, NN = N * N;
  for (let attempt = 0; attempt < 200; attempt++) {
    const mir = new Array(NN).fill(-1);
    for (const i of shuffle([...Array(NN).keys()]).slice(0, Math.round(NN * (0.3 + Math.random() * 0.15)))) mir[i] = Math.random() < 0.5 ? 0 : 1;
    // the laser: any square on the edge, shining inwards
    const side = Math.floor(Math.random() * 4), k = Math.floor(Math.random() * N);
    const start = [k, (N - 1) * N + k, k * N + N - 1, k * N][side], dir = [2, 0, 3, 1][side];
    if (mir[start] >= 0) continue;

    if (used.size !== spec.use) continue;

    const floor = [...new Set(path.map(([i]) => i).filter(i => mir[i] < 0))];
    const spare = shuffle([...Array(NN).keys()].filter(i => mir[i] >= 0 && !used.has(i))).slice(0, spec.spare);
    if (spare.length < spec.spare) continue;
    const isMir = new Array(NN).fill(0); for (const i of used) isMir[i] = 1; for (const i of spare) isMir[i] = 1;
    // cats: start with the level's fewest along the run, then add one wherever another run gets by without it
    const order = floor;   // squares in the order the dot first reaches them

    const numbered = () => { const c = new Array(NN).fill(0); let k = 0; for (const i of order) if (catAt.has(i)) c[i] = ++k; return c; };

    for (const i of shuffle([...catAt])) {
      if (catAt.size <= spec.cats) break;

    }
    if (catAt.size > spec.cats + 2) continue;
    const cat = numbered(), sol = isMir.map((m, i) => m ? (used.has(i) ? mir[i] : -1) : -1);

    let tilt;
    for (let t = 0; t < 50; t++) {
      tilt = isMir.map((m, i) => m ? (Math.random() < 0.5 ? 0 : 1) : -1);
      const wrong = [...used].filter(i => tilt[i] !== mir[i]).length;
      if (wrong * 2 >= used.size && !wins(N, tilt, cat, start, dir, spec.order)) break;
      tilt = null;

}
// Is the room solved: does the dot, with the mirrors as they are, pass every cat (in order if it counts)?
function wins(N, mir, cat, start, dir, order) {
  const cats = cat.filter(c => c).length, seen = new Set(); let next = 1;
  for (const [i] of trace(N, mir, start, dir)) if (cat[i] && !seen.has(i)) {

    seen.add(i); next++;

  return seen.size === cats;
}

/* ---------- game state ---------- */
// game: {level, N, start and dir (where the laser shines in, and which way), cat (0 or each cat's number, by
//        square), sol (each mirror's answer: 0 /, 1 \, -1 for a spare or no mirror), tilt (how each mirror
//        stands now, -1 for no mirror), first (how they stood at the start), history (squares tapped, or
//        {tilt} for a Restart), won, hinted, undid…}
const STORE = "catdoku.laserpointer.v1", MAX_LEVEL = 15, M = 56, NS = "http://www.w3.org/2000/svg";
const $ = G.$;
let state = G.load(STORE);
let settings = Object.assign({level: 1}, state.settings);
let game = state.game || null, busy = false, running = false, cursor = -1;
const save = () => G.save(STORE, {settings, game});
const playing = () => game && !game.won && !busy && !running && !$("overlay").classList.contains("show");
const levelName = n => { const s = levelSpec(n); return `Level ${n} · ${s.N} × ${s.N}${s.live ? ", moving" : ""}${s.order ? ", in order" : ""}`; };
const build = G.builder([levelSpec, bounce, step, trace, solve, shuffle, wins, makeRoom], "makeRoom");
const order = () => levelSpec(game.level).order;
const isLive = () => !!levelSpec(game.level).live;
const el = (t, a, parent) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (parent) parent.append(e); return e; };

/* ---------- drawing ---------- */
// Coats for the cats: ginger, grey, black, cream, tabby and white, all tints of the site's colours.
const COATS = [["#E8956F", "#2A2530"], ["#A39EAB", "#2A2530"], ["#3E3848", "#F7F8F3"], ["#EBD39A", "#2A2530"], ["#B08A66", "#2A2530"], ["#F7F8F3", "#2A2530"]];
let mirrors = [], cats = [], beamPts = [], catAt = [];
function drawCat(g, coat, num) {
  const [fur, line] = COATS[coat], dark = coat === 2;
  const hop = el("g", {class: "hop"}, g);
  // ears, head, eyes (shut and open), nose and whiskers, drawn round the middle of the square
  for (const s of [-1, 1]) {
    el("path", {d: `M${s * 28} -2 L${s * 24} -38 L${s * 4} -22 Z`, fill: fur, stroke: "#2A2530", "stroke-width": 3, "stroke-linejoin": "round"}, hop);
    el("path", {d: `M${s * 23} -8 L${s * 21} -29 L${s * 10} -20 Z`, fill: "#DD9DAD"}, hop);
  }
  el("ellipse", {cx: 0, cy: 2, rx: 31, ry: 26, fill: fur, stroke: "#2A2530", "stroke-width": 3}, hop);
  const shut = el("g", {class: "shut", fill: "none", stroke: line, "stroke-width": 3, "stroke-linecap": "round"}, hop);
  for (const s of [-1, 1]) el("path", {d: `M${s * 18} -1 q${-s * 7} 6 ${-s * 13} 0`}, shut);
  const open = el("g", {class: "open"}, hop);
  for (const s of [-1, 1]) {
    el("ellipse", {cx: s * 11, cy: -2, rx: 8, ry: 9, fill: dark ? "#ECE07A" : "#fff", stroke: "#2A2530", "stroke-width": 2}, open);
    el("ellipse", {class: "pupil", cx: s * 11, cy: -2, rx: 3.4, ry: 6, fill: "#2A2530"}, open);
  }

  el("path", {d: "M0 15 q-4 5 -9 2 M0 15 q4 5 9 2", fill: "none", stroke: line, "stroke-width": 2.2, "stroke-linecap": "round"}, hop);
  el("path", {d: "M-14 12 L-36 9 M-14 16 L-35 19 M14 12 L36 9 M14 16 L35 19", stroke: line, "stroke-width": 1.6, opacity: .7}, hop);

function draw() {

      el("circle", {class: "stand", r: 30}, g);

  el("rect", {id: "startsq", x: sx - 50, y: sy - 50, width: 100, height: 100, fill: "none"}, svg);
  const pen = el("g", {id: "pen", class: "pen", transform: `translate(${px} ${py}) rotate(${game.dir * 90})`}, svg);
  el("rect", {class: "body", x: -9, y: 8, width: 18, height: 44, rx: 7}, pen);
  el("path", {class: "tip", d: "M-9 10 L-6 0 H6 L9 10 Z"}, pen);
  el("circle", {class: "button", cx: 0, cy: 26, r: 4}, pen);
  el("circle", {class: "dotglow", id: "dotglow", r: 16}, svg);
  el("circle", {class: "dot", id: "dot", r: 8}, svg);
  el("rect", {class: "hintsq", id: "hintsq", x: -400, y: 0, width: 92, height: 92, rx: 10}, svg);
  el("rect", {class: "cursor", id: "cursor", x: -400, y: 0, width: 92, height: 92, rx: 10}, svg);

function setTilt(i, animate = true) {

/* ---------- the dot's run ---------- */
// Trace the beam with the mirrors as they stand, light the cats it passes and say how many are left.
// On a live level the beam only reaches as far as the dot has got (live.dist along the run), and the mirrors it

const passed = at => isLive() && (live.on || game.won) && at - 30 <= live.dist;   // with a little room, so a late tap can't land mid-bounce

function update() {

  beamPts = [[sx - DX[game.dir] * 50, sy - DY[game.dir] * 50]];
  for (const [i] of path) beamPts.push(centre(i));

// Undo takes back a tap, or a Restart.
function undo() {

/* ---------- endings ---------- */

  const free = shuffle([...Array(N * N).keys()].filter(i => game.tilt[i] < 0 && !game.cat[i]));

/* ---------- sharing ---------- */
// One letter per square: "." floor, 1–9 a cat, and for a mirror its answer and how it started, a–f
// (a/b a spare standing / or \, c/d an answer of / standing / or \, e/f an answer of \). With progress,
// how every mirror stands now, 0 or 1 each in order.
const roomOut = (tilt) => game.cat.map((c, i) => game.tilt[i] < 0 ? (c ? String(c) : ".") : "abcdef"[(game.sol[i] + 1) * 2 + tilt[i]]).join("");

  puzzle: () => ({g: "laserpointer", N: game.level, r: roomOut(game.first), e: game.start * 4 + game.dir}),
  progress: () => game.tilt.filter(t => t >= 0).join("")}); };
function openShared(d) {
  const spec = levelSpec(d.N), N = spec ? spec.N : 0, fail = () => G.note("That share link didn't work.", 5000);
  if (!N || typeof d.r !== "string" || d.r.length !== N * N || !/^[.1-9a-f]+$/.test(d.r) || !Number.isInteger(d.e)) return fail();
  const start = d.e >> 2, dir = d.e & 3, sx = start % N, sy = Math.floor(start / N);
  // the laser must sit at the edge it shines in from

  const cat = [], sol = [], tilt = [];
  for (const ch of d.r) {
    const k = "abcdef".indexOf(ch);
    cat.push(k < 0 && ch !== "." ? +ch : 0); sol.push(k < 0 ? -1 : (k >> 1) - 1); tilt.push(k < 0 ? -1 : k & 1);
  }
  if (tilt[start] >= 0) return fail();

  if (!wins(N, m, cat, start, dir, spec.order)) return fail();

}

  const onPath = mirs.filter(i => path.includes(i)), lit = catAt.filter(i => path.includes(i));

    draw();
    if (game.won) finishCard();
    else if (isLive()) G.note("Tap the room to switch the laser on.", 0);
    build.prefetch(settings.level); helpOnFirstVisit();
  }, why => { game = null; newPuzzle().then(() => G.note(why, 0)); });
else if (!shared) newPuzzle();
const shareOpts = () => ({name: "Laser Pointer", inProgress: !!(game && !game.won && game.history.length), open: openShared, after: helpOnFirstVisit});
if (shared) G.offerShare(shared, shareOpts());
window.addEventListener("hashchange", () => { const d = G.readShare("laserpointer"); if (d) G.offerShare(d, shareOpts()); });
</script>
