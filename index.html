<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catdoku: cat puzzle games</title>
<script>
// An old share link to Catdoku (from when it was the front page) goes on to Catdoku.
if (/^#share=/.test(location.hash)) location.replace("catdoku/" + location.hash);
// A home-screen app can keep showing an old saved copy of this page. Check for a newer
// version when the page opens, and reload once to get it. Bump BUILD and version.txt together.
(function () {
  var BUILD = "2026-10-16.4";
  fetch("version.txt?t=" + Date.now(), {cache: "no-store"}).then(function (r) { return r.ok ? r.text() : ""; }).then(function (v) {
    v = v.trim(); var tried = null;
    try { tried = sessionStorage.getItem("catdoku.reloadedFor"); } catch (e) {}
    if (v && v !== BUILD && tried !== v) { try { sessionStorage.setItem("catdoku.reloadedFor", v); } catch (e) {} location.reload(); }
  }).catch(function () {});
})();
</script>

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* The front page: a search box, the games played lately, then every game on its shelf (Logic grids, Words…), each a
   tile with an icon drawn from its board, a line about it and how many you've solved. */
main{max-width:1240px}   /* on a wide screen the shelves spread out, five or six tiles across */
.find{width:100%;max-width:460px;font:inherit;font-size:17px;padding:9px 16px;border:2px solid var(--ink);border-radius:999px;background:var(--panel);color:var(--ink)}
.group{width:100%;display:flex;flex-direction:column;gap:10px}
.group[hidden],.tile[hidden]{display:none}
.group h2{margin:10px 0 0;font-size:24px;font-weight:800;line-height:1.1}
.group h2 small{display:block;font-size:15px;font-weight:500;color:var(--ink-soft);margin-top:2px}
.none{color:var(--ink-soft)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;width:100%}
.tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:12px 10px 12px;border-radius:16px;background:var(--panel);
  border:2px solid var(--line);text-decoration:none;color:var(--ink);position:relative;overflow:hidden;line-height:1.2;transition:transform .15s,border-color .15s}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--tile)}
.tile:hover,.tile:focus-visible{border-color:var(--tile);transform:translateY(-2px)}
.tile .pic{width:100%;height:120px;display:flex;align-items:center;justify-content:center;margin:4px 0 6px}
.tile img{max-width:100%;max-height:100%;object-fit:contain}
.tile b{font-size:20px;font-weight:800}
.tile small{font-size:14px;color:var(--ink-soft)}
.tile .done{margin-top:6px;font-size:13px;font-weight:600;color:var(--ink)}
.tile .done.new{color:var(--ink-soft);font-weight:500}
@media (max-width:380px){ .shelf{grid-template-columns:1fr 1fr;gap:8px} .tile b{font-size:18px} .tile small{font-size:13px} }
</style>
</head>
<body>
<main>
  <header><h1>Catdoku</h1><div class="stripe"></div><p class="tagline">Cat puzzle games. Pick one to play!</p></header>
  <input class="find" id="find" type="search" placeholder="Search games (try “word” or “minesweeper”)" aria-label="Search games">
  <div id="shelves" style="display:contents"></div>
  <p class="none" id="none" hidden>No games match that. Try another word, or clear the search to see them all.</p>
</main>

<script src="games.js?v=2026-10-16.4"></script>
<script>
// Each tile shows a little picture of the game's board, drawn by tools/make-icons.py.
// How many puzzles you've finished in each game, from the best-times records kept on this device.
const bests = G.load("catdoku.bests.v1");
const solved = slug => Object.values(bests[slug] || {}).reduce((n, row) => n + ((row && row.solves) || 0), 0);
function tile(g) {
  const [name, slug, blurb, color] = g, a = document.createElement("a");
  a.className = "tile"; a.href = `${slug}/`; a.dataset.slug = slug; a.style.setProperty("--tile", color);
  const pic = document.createElement("span"); pic.className = "pic";
  const img = document.createElement("img"); img.src = `icons/${slug}.svg?v=${window.SITE_BUILD || ""}`; img.alt = ""; img.loading = "lazy";
  pic.append(img);
  const b = document.createElement("b"); b.textContent = name;
  const sm = document.createElement("small"); sm.textContent = blurb;
  const n = slug === "pawlette" ? -1 : solved(slug), done = document.createElement("span");
  done.className = "done" + (n === 0 ? " new" : "");
  done.textContent = n < 0 ? "Just play" : n ? `${n} solved` : "Not played yet";
  a.append(pic, b, sm, done);
  return a;
}
function shelf(title, line, games) {
  const sec = document.createElement("section"); sec.className = "group";
  const h = document.createElement("h2"); h.textContent = title;
  if (line) { const sm = document.createElement("small"); sm.textContent = line; h.append(sm); }
  const grid = document.createElement("div"); grid.className = "shelf";
  grid.append(...games.map(tile)); sec.append(h, grid);
  $("shelves").append(sec); return sec;
}
// Keep playing: the last few games played on this device. Then every game on its shelf.
const lately = G.recent().slice(0, 4).map(s => G.GAMES.find(g => g[1] === s));
const keep = lately.length ? shelf("Keep playing", "", lately) : null;
const shelves = G.GROUPS.map(([key, title, line]) => shelf(title, line, G.GAMES.filter(g => g[4] === key)));
// Search: show only the games that match, on their shelves (Keep playing hides while searching).
$("find").oninput = () => {
  const q = $("find").value.trim();
  if (keep) keep.hidden = !!q;
  for (const sec of shelves) {
    let any = false;
    for (const a of sec.querySelectorAll(".tile")) { const hit = !q || G.matches(G.GAMES.find(g => g[1] === a.dataset.slug), q); a.hidden = !hit; any = any || hit; }
    sec.hidden = !any;
  }
  $("none").hidden = !q || shelves.some(sec => !sec.hidden);
};
function $(id) { return document.getElementById(id); }
</script>
