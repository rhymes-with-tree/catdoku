<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catdoku: cat puzzle games</title>
<script>
// An old share link to Catdoku (from when it was the front page) goes on to Catdoku.
if (/^#share=/.test(location.hash)) location.replace("catdoku/" + location.hash);
// A home-screen app can keep showing an old saved copy of this page. Check for a newer
// version when the page opens, and reload once to get it. Bump BUILD and version.txt together.
(function () {
  var BUILD = "2026-11-01.9";
  fetch("version.txt?t=" + Date.now(), {cache: "no-store"}).then(function (r) { return r.ok ? r.text() : ""; }).then(function (v) {
    v = v.trim(); var tried = null;
    try { tried = sessionStorage.getItem("catdoku.reloadedFor"); } catch (e) {}
    if (v && v !== BUILD && tried !== v) { try { sessionStorage.setItem("catdoku.reloadedFor", v); } catch (e) {} location.reload(); }
  }).catch(function () {});
})();
</script>

<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ECEEE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1C24" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="games.css?v=2026-11-01.9">
<style>
/* The front page: today's challenge, a search box, shortcuts to the shelves, the games starred (once there are some), then
   every game in one grid, shelf by shelf (Cat Logic, Cat Spells…): each shelf starts a new row with a label tile in its
   colour, a little apart from the shelf before, and every game's tile is in its shelf's colour. A tile has an icon drawn from its
   board, a line about it (on wider screens) and how many you've solved once you've played. */
main{max-width:1240px}   /* on a wide screen the shelves spread out, six tiles across at most */
.find{width:100%;max-width:460px;font:inherit;font-size:calc(17px*var(--ts));padding:9px 16px;border:2px solid var(--ink);border-radius:999px;background:var(--panel);color:var(--ink)}
.tile[hidden],.daily[hidden],.favWrap[hidden]{display:none}
.favWrap > .favStar{top:8px;right:6px;font-size:calc(24px*var(--ts))}   /* front-page tiles are bigger than the menu's */
.none{color:var(--ink-soft)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(140px,calc((100% - 50px)/6)),1fr));gap:10px;width:100%}   /* at most six tiles across */
/* the label that starts each shelf, in the shelf's colour */
.shelfLabel{grid-column-start:1;margin-top:14px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:14px 12px;border-radius:16px;scroll-margin-top:10px;
  background:color-mix(in srgb,var(--tile) 30%,var(--panel));border:2px solid var(--tile);line-height:1.15}
.shelfLabel[hidden]{display:none}
.shelfLabel b{font-size:calc(22px*var(--ts));font-weight:800}
.shelfLabel small{font-size:calc(14px*var(--ts));color:var(--ink)}
.tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:12px 10px 12px;border-radius:16px;background:color-mix(in srgb,var(--tile) 9%,var(--panel));
  border:2px solid var(--line);text-decoration:none;color:var(--ink);position:relative;overflow:hidden;line-height:1.2;transition:transform .15s,border-color .15s}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--tile)}
.tile:hover,.tile:focus-visible{border-color:var(--tile);transform:translateY(-2px)}
.tile .pic{position:relative;width:100%;height:96px;display:flex;align-items:center;justify-content:center;margin:4px 0 6px}
.tile img{max-width:100%;max-height:100%;object-fit:contain}
.tile b{font-size:calc(18px*var(--ts));font-weight:800;max-width:100%;overflow-wrap:anywhere}
.tile small{font-size:calc(14px*var(--ts));color:var(--ink-soft)}
.tile .done{margin-top:6px;font-size:calc(13px*var(--ts));font-weight:600;color:var(--ink)}
/* a game added in the last two weeks */
.tile .newBadge{position:absolute;top:10px;left:8px;font-size:calc(12px*var(--ts));font-weight:800;line-height:1.5;letter-spacing:.04em;text-transform:uppercase;
  background:var(--ink);color:var(--paper);border-radius:999px;padding:0 7px}
/* shortcuts to the shelves, and how to pin a game to the top */
.jump{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 6px;max-width:640px}
.jump[hidden],.favTip[hidden]{display:none}
.jump a{position:relative;display:inline-flex;align-items:center;min-height:34px;font-size:calc(14px*var(--ts));font-weight:600;padding:1px 12px;border:2px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);text-decoration:none}
.jump a::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dot);margin-right:6px;vertical-align:1px}
.jump a:hover,.jump a:focus-visible{border-color:var(--ink)}
.jump a::after{content:"";position:absolute;left:0;right:0;top:-5px;bottom:-5px}   /* 44 points tall to a finger */
.favTip{margin:-4px 0 0;font-size:calc(14px*var(--ts));color:var(--ink-soft);text-align:center}
/* a mastered game keeps its shelf's colour, and its solved count goes in a small gold label: "Mastered · 12 solved" */
.tile .masterPill{margin-top:6px}
.pawBadge{position:absolute;right:0;bottom:-6px;width:48px;line-height:0;pointer-events:none}
.pawBadge svg{width:100%;height:auto;overflow:visible}
.pawBadge g{stroke:var(--panel);stroke-width:5px;paint-order:stroke}   /* no black outline, so the number stands out; a halo parts it from the picture */
.pawBadge text{font:800 40px "Baloo 2",system-ui,sans-serif;fill:#2A2530}
/* today's challenge: one wide tile above the shelves */
.daily{grid-column:span 2;display:flex;align-items:center;gap:14px;padding:14px 16px 14px 20px;border-radius:16px;background:color-mix(in srgb,var(--tile) 9%,var(--panel));
  border:2px solid var(--tile);text-decoration:none;color:var(--ink);position:relative;overflow:hidden;line-height:1.25;transition:transform .15s}
.daily::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--tile)}
.daily:hover,.daily:focus-visible{transform:translateY(-2px)}
.daily[hidden]{display:none}
.daily img{width:96px;height:96px;flex:none;object-fit:contain}
.daily .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.daily .eyebrow{font-size:calc(13px*var(--ts));font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.daily b{font-size:calc(24px*var(--ts));font-weight:800;line-height:1.1}
.daily small{font-size:calc(15px*var(--ts));color:var(--ink-soft)}
.daily .state{margin-top:4px;font-size:calc(14px*var(--ts));font-weight:700}
.daily .state.done{color:var(--gold-text)}
/* solved today: the whole card goes gold, with a gold paw in the corner */
.daily.done{background:linear-gradient(135deg,color-mix(in srgb,#ECA818 34%,var(--panel)),color-mix(in srgb,#ECA818 14%,var(--panel)))}
.daily.done .eyebrow{color:var(--gold-text)}
@media (prefers-color-scheme:dark){.daily .state.done,.daily.done .eyebrow{color:var(--gold-ink)}}   /* on the gold card, a paler gold reads better in the dark */
.daily .goldpaw{position:absolute;right:12px;top:10px;width:38px;height:auto}
@media (max-width:380px){ .daily .goldpaw{width:30px} }
/* a phone: three small tiles across, just the picture and the name */
@media (max-width:600px){
  .shelf{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tile{padding:10px 4px 8px;border-radius:14px}
  .tile::before{height:5px}
  .tile .pic{height:72px;margin:4px 0 4px}
  .tile b{font-size:calc(15px*var(--ts));line-height:1.15}
  .tile small{display:none}
  .shelfLabel{padding:10px 8px;gap:4px;margin-top:10px}
  .daily{grid-column:1 / -1;padding:10px 10px 10px 16px;gap:10px}   /* the whole row: three tiles wide */
  .daily img{width:60px;height:60px}
  .daily b{font-size:calc(19px*var(--ts))}
  .daily small{display:none}
  .daily .eyebrow{font-size:calc(11px*var(--ts))}
  .daily .state{font-size:calc(12px*var(--ts));margin-top:2px;line-height:1.2}
  .shelfLabel b{font-size:calc(17px*var(--ts))}
  .shelfLabel small{font-size:calc(12px*var(--ts));line-height:1.2}
  .tile .done,.tile .masterPill{font-size:calc(12px*var(--ts));margin-top:2px}
  .tile .masterWord{display:none}   /* just "12 solved" in the gold label: a phone tile has no room for both */
  .tile .newBadge{top:8px;left:5px;font-size:calc(11px*var(--ts));padding:0 5px}
  .favWrap > .favStar{top:4px;right:0;font-size:calc(19px*var(--ts))}
  .pawBadge{width:32px;bottom:-4px}
}
/* the larger accessibility text sizes on a phone: two tiles across, so names fit, and shelf labels the whole row */
@media (max-width:600px){
  .bigText .shelf{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bigText .shelfLabel{grid-column:1 / -1}
  .bigText .tile b{overflow-wrap:normal}
}
.siteFoot{margin:18px 0 0;font-size:calc(15px*var(--ts));color:var(--ink-soft);text-align:center}
.siteFoot a{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<main>
  <header><h1>Catdoku</h1><div class="stripe"></div><p class="tagline">Cat puzzle games. Pick one to play!</p></header>
  <input class="find" id="find" type="search" placeholder="Search games (try “word” or “minesweeper”)" aria-label="Search games">
  <nav class="jump" id="jump" aria-label="Shelves"></nav>
  <p class="favTip" id="favTip" hidden>Tap the ☆ on any game to pin it to the top.</p>
  <div id="shelves" style="display:contents"><a class="daily" id="daily"></a></div>
  <p class="none" id="none" hidden>No games match that. Try another word, or clear the search to see them all.</p>
  <p class="siteFoot"><a href="calendar/">Launch history</a></p>
</main>

<script src="games.js?v=2026-11-01.9"></script>
<script>
// Each tile shows a little picture of the game's board, drawn by tools/make-icons.py.
// How many puzzles you've finished in each game, from the best-times records kept on this device.
const bests = G.load("catdoku.bests.v1");
const solved = slug => Object.values(bests[slug] || {}).reduce((n, row) => n + ((row && row.solves) || 0), 0);
// Gold paws earned in a game: a little gold paw with the number on its big pad, in the lower right corner of the tile's picture.
function pawBadge(n) {
  const badge = document.createElement("span"), paw = G.goldPaw();
  badge.className = "pawBadge"; badge.title = badge.ariaLabel = `${n} gold paw${n === 1 ? "" : "s"}`;
  const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
  t.setAttribute("x", 50); t.setAttribute("y", 77); t.setAttribute("text-anchor", "middle"); t.textContent = n > 999 ? "999+" : n; if (n > 99) t.style.fontSize = "30px";
  paw.append(t); badge.append(paw); return badge;
}
// Each shelf's colour (in games.js, shared with the games menu), for its label, its games' tiles and its shortcut.
const SHELF_COLOUR = G.SHELF_COLOUR;
// New: added to the site (its date in G.GAMES) in the last week; at most the four newest, so it stays news.
const NEWEST = G.GAMES.filter(g => g[6] && (Date.now() - new Date(g[6] + "T12:00:00")) / 864e5 < 7).sort((x, y) => x[6] < y[6] ? 1 : -1).slice(0, 4).map(g => g[1]);
const isNew = g => NEWEST.includes(g[1]);
function tile(g) {
  const [name, slug, blurb, color] = g, a = document.createElement("a");
  a.className = "tile"; a.href = `${slug}/`; a.dataset.slug = slug; a.style.setProperty("--tile", SHELF_COLOUR[g[4]] || color);
  const pic = document.createElement("span"); pic.className = "pic";
  const img = document.createElement("img"); img.src = `icons/${slug}.svg?v=${window.SITE_BUILD || ""}`; img.alt = ""; img.loading = "lazy";
  pic.append(img);
  const b = document.createElement("b"); b.textContent = name;
  const sm = document.createElement("small"); sm.textContent = blurb;
  // how many solved, once there are some (Pawlette has nothing to solve)
  const n = slug === "pawlette" ? 0 : solved(slug), done = document.createElement("span");
  done.className = "done"; done.textContent = `${n} solved`;
  // mastered (a gold paw at the top level or size): the count goes in a gold label, "Mastered · 12 solved" (a phone drops "Mastered · ")
  const master = G.mastered(slug) && G.masterPill(n ? `${n} solved` : "");
  a.append(pic, b, sm, ...(master ? [master] : n ? [done] : []));
  if (isNew(g)) { const nb = document.createElement("span"); nb.className = "newBadge"; nb.textContent = "New"; a.append(nb); }
  const gold = G.goldPaws(slug);
  if (gold) pic.append(pawBadge(gold));
  // the star sits beside the link, not in it, so tapping it doesn't open the game
  const w = document.createElement("div"); w.className = "favWrap"; w.dataset.slug = slug;
  w.append(a, G.favStar(slug, drawFavs)); return w;
}
// Today's challenge: the same game for everyone today; win any puzzle in it to do it and keep the streak going.
{
  const g = G.GAMES.find(x => x[1] === G.daily()), [name, slug, blurb, color] = g, a = $("daily"), done = G.dailyDoneToday(), k = G.dailyStreak();
  a.href = `${slug}/`; a.style.setProperty("--tile", done ? "#E0A526" : SHELF_COLOUR[g[4]] || color);   // gold once it's solved today
  a.innerHTML = `<img src="icons/${slug}.svg?v=${window.SITE_BUILD || ""}" alt=""><span class="txt"><span class="eyebrow">Today's challenge</span><b></b><small></small><span class="state"></span></span>`;
  a.querySelector("b").textContent = name; a.querySelector("small").textContent = blurb;
  const st = a.querySelector(".state");
  const act = slug === "pawlette" ? "clear 3 lines in Swipe" : "solve one";
  st.textContent = done ? (k > 1 ? `${k}-day streak!` : "Solved! Come back tomorrow for a new challenge!")
    : k ? `${act[0].toUpperCase() + act.slice(1)} today for a ${k + 1}-day streak` : `Can you ${act} today?`;
  st.classList.toggle("done", done);
  a.classList.toggle("done", done);
  if (done) a.append(G.goldPaw());
}
// One grid for everything: today's challenge, then the games starred on this device (in the order they were starred,
// after a Favorites label; until there are some, a line under the search box says how), then every game, shelf by
// shelf, each shelf starting with its label.
const all = document.createElement("div"); all.className = "shelf all"; $("shelves").append(all);
function label(title, line, colour, id) {
  const el = document.createElement("div"); el.className = "shelfLabel"; if (id) el.id = id;
  el.style.setProperty("--tile", colour);
  const b = document.createElement("b"), sm = document.createElement("small"); b.textContent = title; sm.textContent = line; el.append(b, sm);
  return el;
}
const favLabel = label("Favorites", "The games you've starred", "#8D78AD", "shelf-favorites");
all.append($("daily"), favLabel);
let favTiles = [];
function drawFavs() {
  const q = $("find").value.trim(), starred = G.favorites();
  favTiles.forEach(t => t.remove());
  favTiles = q ? [] : starred.map(s => G.GAMES.find(g => g[1] === s)).map(g => tile(g));
  favLabel.after(...favTiles);
  favLabel.hidden = !favTiles.length;
  $("favTip").hidden = !!starred.length || !!q;
}
drawFavs();
const shelves = G.GROUPS.map(([key, title, line]) => {
  const lab = label(title, line, SHELF_COLOUR[key] || "#7885BA", `shelf-${key}`);
  const tiles = G.onShelf(key).map(g => tile(g));   // A to Z on each shelf
  if (tiles.length) all.append(lab, ...tiles);
  return {label: lab, tiles};
});
// Shortcuts to the shelves, each with its own short name and its colour.
const SHORT = {logic: "Logic", numbers: "Math", lines: "Trails", words: "Spells", teasers: "Curious", quick: "Kitten Play", travels: "Travels"};
for (const [key, title] of G.GROUPS) {
  if (!G.GAMES.some(g => g[4] === key)) continue;
  const a = document.createElement("a"); a.href = `#shelf-${key}`; a.textContent = SHORT[key] || title; a.title = title;
  a.style.setProperty("--dot", SHELF_COLOUR[key]); $("jump").append(a);
}
// Search: show only the games that match, on their shelves (Favorites hides while searching).
$("find").oninput = () => {
  const q = $("find").value.trim();
  $("daily").hidden = !!q; $("jump").hidden = !!q;
  drawFavs();
  for (const sh of shelves) {
    let any = false;
    for (const w of sh.tiles) { const hit = !q || G.matches(G.GAMES.find(g => g[1] === w.dataset.slug), q); w.hidden = !hit; any = any || hit; }
    sh.label.hidden = !any;
  }
  $("none").hidden = !q || shelves.some(sh => !sh.label.hidden);
};
function $(id) { return document.getElementById(id); }
</script>
