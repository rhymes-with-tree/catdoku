<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catdoku settings</title>
<script>
// A home-screen app can keep showing an old saved copy of this page. Check for a newer
// version when the page opens, and reload once to get it. Bump BUILD and version.txt together.
(function () {
  var BUILD = "2026-11-12.5"; window.SITE_BUILD = BUILD;
  fetch("../version.txt?t=" + Date.now(), {cache: "no-store"}).then(function (r) { return r.ok ? r.text() : ""; }).then(function (v) {
    v = v.trim(); var tried = null;
    try { tried = sessionStorage.getItem("catdoku.reloadedFor"); } catch (e) {}
    if (v && v !== BUILD && tried !== v) { try { sessionStorage.setItem("catdoku.reloadedFor", v); } catch (e) {} location.reload(); }
  }).catch(function () {});
})();
</script>

<link rel="icon" href="../favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#ECEEE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1C24" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../games.css?v=2026-11-12.5">
<style>
/* Every game's settings on one page, as a grid of small icon buttons (the owner's design, 2026-11-12). The top row
   sets a thing for every game at once, and a tap goes round its three ways (Show · Hide · By game). Under it, a row
   for each shelf, in the front page's order; tapping one opens its games and closes the others. Each game's row has
   an icon for each setting it has, left to right: Timer, Slow, Clutter, Check, Notes, then its own. A tap turns one
   on or off (or goes round a game's own choices). Everything is kept where the games keep it (games.js lists where),
   so a change here is the same as one in the game's ☰ Menu. */
main{max-width:760px;align-items:stretch;gap:14px}
header{align-items:flex-start}
.tagline{text-align:left;max-width:62ch}
.back{position:relative;font-weight:600;color:var(--ink);align-self:flex-start}
.back::after{content:"";position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%)}
.box{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 10px}
.rowHead{font-size:calc(13px*var(--ts));font-weight:800;color:var(--ink-soft);margin:0 0 4px 2px;text-transform:uppercase;letter-spacing:.04em}
.icons{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start}
/* one icon button: the icon, its words small under it */
.sb{display:inline-flex;flex-direction:column;align-items:center;gap:1px;min-width:58px;max-width:84px;min-height:48px;padding:4px 4px 3px;
  border:1.5px solid transparent;border-radius:12px;background:none;color:var(--ink);font:inherit;font-size:calc(11px*var(--ts));line-height:1.1;cursor:pointer;text-align:center}
.sb:hover{background:var(--hover-tint)}
.sb .ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sb .w{font-weight:700}
.sb .w2{color:var(--ink-soft)}
/* on: tinted green; off: faded, the icon crossed through; by game (top row): a dashed outline */
.sb.on{color:var(--ink);background:color-mix(in srgb,var(--sage-green) 22%,transparent);border-color:color-mix(in srgb,var(--sage-green) 55%,transparent)}
.sb.off{color:var(--ink-soft)}
.sb.off .ic{opacity:.55}
.sb .slash{display:none}
.sb.off .slash{display:inline}
.sb.mixed{border:1.5px dashed var(--line)}
.sb.choice{background:color-mix(in srgb,var(--pacific-blue) 18%,transparent);border-color:color-mix(in srgb,var(--pacific-blue) 50%,transparent)}
.sb .wait{font-size:calc(10px*var(--ts));font-weight:800;color:var(--ink)}
.sb .wait[hidden]{display:none}
/* the shelves */
.shelves{display:flex;flex-direction:column;gap:8px}
.shelf{padding:0;overflow:hidden}
.shelf > h2{margin:0;font-size:inherit}
.shelfBtn,.shelfBtn:hover{background:none}
.shelfBtn{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;min-height:48px;background:none;border:0;color:var(--ink);font:inherit;
  font-size:calc(18px*var(--ts));font-weight:800;cursor:pointer;text-align:left}
.shelfBtn i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.shelfBtn small{font-size:calc(13px*var(--ts));font-weight:600;color:var(--ink-soft);margin-left:auto}
.shelfBtn::after{content:"";width:9px;height:9px;border:solid var(--ink-soft);border-width:0 2.5px 2.5px 0;transform:rotate(45deg);margin:0 4px 4px 0;transition:transform .15s}
.shelfBtn[aria-expanded="true"]::after{transform:rotate(-135deg);margin-bottom:-4px}
@media (prefers-reduced-motion:reduce){.shelfBtn::after{transition:none}}
.shelfGames{display:flex;flex-direction:column;border-top:2px solid var(--line)}
.shelfGames[hidden]{display:none}
.game{display:flex;align-items:center;gap:6px 10px;padding:6px 10px;scroll-margin-top:60px}
.game + .game{border-top:1px solid var(--line)}
.game:target,.game.here{background:color-mix(in srgb,var(--c) 14%,transparent)}
.game > a{flex:0 0 8.2em;font-weight:700;color:var(--ink);font-size:calc(15px*var(--ts));line-height:1.2}
@media (max-width:430px){.game{padding:6px 6px;gap:6px}.game > a{flex-basis:6.4em;font-size:calc(14px*var(--ts))}.game .sb{min-width:52px}}
.none{font-size:calc(13px*var(--ts));color:var(--ink-soft)}
</style>
</head>
<body>
<main>
  <a class="back" href="../">← All the games</a>
  <header><h1>Settings</h1><div class="stripe"></div><p class="tagline">Tap an icon to turn it on or off. The top row sets every game at once; open a shelf to set its games one by one.</p></header>
  <section class="box" aria-labelledby="everyHead"><p class="rowHead" id="everyHead">Every game</p><div class="icons" id="every"></div></section>
  <div class="shelves" id="shelves"></div>
</main>

<script src="../games.js?v=2026-11-12.5"></script>
<script>
const $ = G.$;
const syncs = [], syncAll = () => syncs.forEach(f => f());
const SLASH = '<path class="slash" d="M5 5l22 22"/>';
// icons of the page's own (the rest are games.js's, G.icon)
const ICONS = {
  timer: '<circle cx="16" cy="18" r="10"/><path d="M16 18v-5M13 4.5h6M16 4.5v3.5M24.5 9l2-2"/>',
  speed: '<path d="M5 25h19a4 4 0 0 0 3.5-2"/><circle cx="15" cy="17" r="7.5"/><path d="M15 17c0-2 2.5-2.5 3.5-1s-.5 4-3 4.2-5-2-4.5-5"/><path d="M24 22l1-9M27 22l3-8"/>',
  clutter: '<path d="M12 4l2 6.5 6.5 2-6.5 2L12 21l-2-6.5-6.5-2 6.5-2z"/><path d="M23.5 16l1.3 4 4 1.3-4 1.3-1.3 4-1.3-4-4-1.3 4-1.3z"/>',
  check: null, notes: "pencils",
  heart: '<path d="M16 26S5.5 19.5 5.5 12.5a5.2 5.2 0 0 1 10.5-1.6 5.2 5.2 0 0 1 10.5 1.6C26.5 19.5 16 26 16 26z"/>',
  rotate: '<path d="M25 13a10 10 0 1 0 .5 6"/><path d="M26 5v8h-8"/>',
  swap: '<path d="M5 11h20l-5-5M27 21H7l5 5"/>',
  sets: '<path d="M6 10h20M6 16h20M6 22h12"/><circle cx="23.5" cy="22" r="2.4"/>',
};
const iconOf = name => {
  const own = ICONS[name];
  if (typeof own === "string" && own.startsWith("<")) return `<svg class="ic" viewBox="0 0 32 32" aria-hidden="true">${own}${SLASH}</svg>`;
  return G.icon(own || name).replace("</svg>", SLASH + "</svg>");
};
// the five columns: their icon, and what each of the top row's three ways says (in the order a tap goes round them)
const COLS = [
  {row: "timers", icon: "timer", name: "Timer", ways: [[0, "Show"], [2, "Hide"], [1, "By game"]]},
  {row: "speed", icon: "speed", name: "Speed", short: "Slow", ways: [[2, "Slow"], [0, "Fast"], [1, "By game"]]},
  {row: "decor", icon: "clutter", name: "Visual clutter", short: "Clutter", ways: [[2, "Regular"], [0, "Reduced"], [1, "By game"]]},
  {row: "check", icon: "check", name: "Auto check", short: "Check", ways: [[0, "Check"], [2, "No check"], [1, "By game"]]},
  {row: "notes", icon: "notes", name: "Auto Notes", short: "Notes", ways: [[0, "Notes"], [2, "No notes"], [1, "By game"]]},
];
const gameName = slug => G.GAMES.find(g => g[1] === slug)[0];

// a button: icon, then one or two small lines of words
function button(icon, label) {
  const b = document.createElement("button"); b.type = "button"; b.className = "sb";
  b.innerHTML = iconOf(icon) + '<span class="w"></span><span class="w2" hidden></span><span class="wait" hidden>next game</span>';
  b.setAttribute("aria-label", label);
  return b;
}

// the top row: each column's three ways, a tap going on to the next
for (const c of COLS) {
  const b = button(c.icon, c.name), w = b.querySelector(".w"), w2 = b.querySelector(".w2");
  w.textContent = c.name === "Visual clutter" ? "Clutter" : c.name; w2.hidden = false;
  b.onclick = () => {
    const now = G.rowMode(c.row), at = c.ways.findIndex(([m]) => m === now);
    G.setRow(c.row, c.ways[(at + 1) % 3][0]); syncAll();
  };
  syncs.push(() => {
    const m = G.rowMode(c.row), word = c.ways.find(([x]) => x === m)[1];
    w2.textContent = word;
    b.classList.toggle("on", m === c.ways[0][0]); b.classList.toggle("off", m === c.ways[1][0]); b.classList.toggle("mixed", m === 1);
    b.setAttribute("aria-label", `${c.name} for every game: ${word}. Tap for ${c.ways[(c.ways.findIndex(([x]) => x === m) + 1) % 3][1]}`);
  });
  $("every").append(b);
}

// A game's on/off icon for a column: its settings in that row (Junk Drawer has two clutter switches, one icon).
// On means the thing is there: the timer showing, slow speed, the clutter (decorations, no dimming), checking, notes.
function columnButton(slug, c, list) {
  const b = button(c.icon, ""), w = b.querySelector(".w");
  w.textContent = c.short || c.name;
  const shown = e => { const p = G.pendingOf(e); return !!(p === undefined ? G.readSetting(e) : p) !== !!e.inv; };
  b.onclick = () => { const to = !list.some(shown); for (const e of list) G.writeSetting(e, to !== !!e.inv); syncAll(); };
  syncs.push(() => {
    const on = list.some(shown);
    b.classList.toggle("on", on); b.classList.toggle("off", !on); b.setAttribute("aria-pressed", String(on));
    b.setAttribute("aria-label", `${gameName(slug)}: ${c.name}`);
    b.querySelector(".wait").hidden = !list.some(e => G.pendingOf(e) !== undefined);
  });
  return b;
}
// A game's own setting: on/off (its words say which, or it's lit when on), or a choice a tap goes round.
function ownButton(slug, e) {
  const b = button(e.icon || "sliders", ""), w = b.querySelector(".w");
  const now = () => { const p = G.pendingOf(e); return p === undefined ? G.readSetting(e) : p; };
  if (e.opts) {
    const names = e.short || Object.fromEntries(e.opts);
    b.classList.add("choice");
    b.onclick = () => { const vs = e.opts.map(o => o[0]), at = vs.indexOf(now()); G.writeSetting(e, vs[(at + 1) % vs.length]); syncAll(); };
    syncs.push(() => { const v = now(); w.textContent = names[v] || names[e.def]; b.setAttribute("aria-label", `${gameName(slug)}, ${e.name}: ${w.textContent}. Tap to change`); });
  } else if (e.words) {
    b.classList.add("choice");
    b.onclick = () => { G.writeSetting(e, !now()); syncAll(); };
    syncs.push(() => { w.textContent = e.words[now() ? 1 : 0]; b.setAttribute("aria-label", `${gameName(slug)}: ${w.textContent}. Tap for ${e.words[now() ? 0 : 1]}`); });
  } else {
    w.textContent = e.short || e.name;
    b.onclick = () => { G.writeSetting(e, !now()); syncAll(); };
    syncs.push(() => { const on = !!now(); b.classList.toggle("on", on); b.classList.toggle("off", !on); b.setAttribute("aria-pressed", String(on)); b.setAttribute("aria-label", `${gameName(slug)}: ${e.name}`); });
  }
  syncs.push(() => { b.querySelector(".wait").hidden = G.pendingOf(e) === undefined; });
  return b;
}

// the shelves, in the front page's order, each game A to Z as there; one open at a time
const opens = [];
function openShelf(key) { for (const o of opens) o(o.key === key && !o.isOpen()); }
for (const [key, name] of G.GROUPS) {
  const games = G.onShelf(key); if (!games.length) continue;
  const sec = document.createElement("section"); sec.className = "box shelf"; sec.style.setProperty("--c", G.SHELF_COLOUR[key]);
  const h = document.createElement("h2"), btn = document.createElement("button"); btn.type = "button"; btn.className = "shelfBtn";
  btn.innerHTML = `<i></i><span></span><small>${games.length} games</small>`; btn.querySelector("span").textContent = name;
  btn.id = "shelf-" + key; btn.setAttribute("aria-controls", "games-" + key);
  h.append(btn);
  const list = document.createElement("div"); list.className = "shelfGames"; list.id = "games-" + key; list.hidden = true;
  for (const [title, slug] of games) {
    const row = document.createElement("div"); row.className = "game"; row.id = slug;
    const a = document.createElement("a"); a.href = `../${slug}/`; a.textContent = title;
    const icons = document.createElement("div"); icons.className = "icons";
    const all = G.SETTINGS[slug] || [];
    for (const c of COLS) { const mine = all.filter(e => e.row === c.row); if (mine.length) icons.append(columnButton(slug, c, mine)); }
    for (const e of all) if (!e.row) icons.append(ownButton(slug, e));
    if (!icons.children.length) icons.innerHTML = '<span class="none">No settings</span>';
    row.append(a, icons); list.append(row);
  }
  const set = open => { list.hidden = !open; btn.setAttribute("aria-expanded", String(open)); };
  set.key = key; set.isOpen = () => !list.hidden; opens.push(set);
  btn.onclick = () => openShelf(key);
  sec.append(h, list); $("shelves").append(sec);
}
syncAll();
// back from a game (or another tab), the settings may have changed there
addEventListener("pageshow", syncAll); addEventListener("focus", syncAll);
// from a game's ☰ Menu (All settings): that game's shelf, open, with its row lit
function goTo() {
  const t = location.hash && document.getElementById(location.hash.slice(1));
  if (!t || !t.classList.contains("game")) return;
  const key = t.closest(".shelfGames").id.replace("games-", "");
  for (const o of opens) o(o.key === key);
  document.querySelectorAll(".game.here").forEach(x => x.classList.remove("here")); t.classList.add("here");
  t.scrollIntoView({block: "center"});
}
goTo(); addEventListener("hashchange", goTo);
</script>
<script data-goatcounter="https://rhymes-with-tree.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
