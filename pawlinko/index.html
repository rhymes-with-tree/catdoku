<style>
/* Gus and Peanut take turns on the top shelf of a climbing wall, knocking things off (yarn, toys, fluffballs, a mug…) that bounce
   down through sisal posts, perches and springs into the cat beds at the bottom. The score and target sit side by side, and
   the cat waiting for a turn shows with the next thing. */
.title{display:flex;align-items:flex-end;gap:2px}
.title img{display:block;height:50px;width:auto;margin-bottom:-2px}
.title img:first-of-type{margin-left:6px}
@media (max-height:760px){.title img{height:40px}}
.hud{width:var(--board);max-width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}
.next{display:flex;align-items:flex-end;gap:6px;min-width:0;text-align:right;margin-left:auto}
.next img{display:block;height:50px;width:auto}
.next canvas{display:block;width:40px;height:40px}
/* Swap: the next thing, as a button, with how many swaps are left under it */
.swapBtn{display:flex;flex-direction:column;align-items:center;gap:0;min-width:48px;min-height:48px;padding:2px 4px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
.swapBtn .lbl{font-size:calc(11px*var(--ts-big));font-weight:700;line-height:1.1;white-space:nowrap}
.swapBtn:disabled{opacity:.55;cursor:default}
.swapBtn:not(:disabled):hover{background:var(--hover)}
.hud small{display:block;white-space:nowrap;font-size:calc(13px*var(--ts-big));font-weight:600;line-height:1.2;color:var(--ink-soft)}
.hud b{font-size:calc(15px*var(--ts-big));line-height:1.1;white-space:nowrap}
.hud small b{font-size:inherit;color:var(--ink)}
.goal{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
/* the wall's goal, its own line under the score: what it asks and how far along, then a tick once it's met */
.wallgoal{flex-basis:100%;font-size:calc(13px*var(--ts-big));font-weight:600;color:var(--ink-soft);line-height:1.25}
.wallgoal b{color:var(--ink)} .wallgoal.met{color:var(--gold-text)} .wallgoal.met b{color:var(--gold-text)}
/* the message line keeps room for two lines, so the wall doesn't jump down when a message wraps */
.status{min-height:2.7em}
.score{display:inline-flex;align-items:center;height:26px;padding:0 10px;border:2px solid var(--ink);border-radius:999px;
  background:var(--panel);font-variant-numeric:tabular-nums;white-space:nowrap}
.wall{position:relative;margin:0 auto;aspect-ratio:376/498;width:min(100%, calc((100svh - 330px) * 376 / 498));min-width:250px;max-width:100%;
  touch-action:none;user-select:none;-webkit-user-select:none}
.wall canvas{display:block;width:100%;height:100%;outline:none}
.wall canvas:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
.stage{--aspect:1.324}
@media (orientation:landscape) and (max-height:500px){body:not(.full) .wall{width:100%;min-width:0}}
/* Full screen (G.fullScreen): the wall as tall as the screen allows, with Hint and the full screen button under it
   (or in a column beside it on a phone held sideways). */
body.full main{display:grid;grid-template-columns:minmax(0,1fr) auto auto minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;align-items:stretch;gap:6px 8px}
body.full .status,body.full .hud{grid-column:1 / -1;width:100%}
body.full .wrap{grid-column:1 / -1;width:100%;height:auto;min-height:0;display:flex;justify-content:center}
body.full .wall{height:100%;width:auto;min-width:0;max-width:100%}
body.full .actions{width:auto;grid-column:2;grid-row:4;align-self:center;flex-wrap:nowrap;gap:8px}
body.full .actions > :not(#hintBtn),body.full .bar > :not(#fullBtn){display:none}
body.full .bar{width:auto;grid-column:3;grid-row:4;align-self:center}
.bar .fsBtn{padding:4px 10px}
@media (max-width:600px) and (orientation:landscape),(max-height:500px) and (orientation:landscape){
  body.full main{grid-template-columns:minmax(0,1fr) 186px;grid-template-rows:auto auto minmax(0,1fr) auto;gap:4px 8px}
  body.full .wall{height:auto;width:min(100%, calc((100svh - 16px) * 376 / 498))}
  body.full .hud .next img{height:36px}
  body.full .status{grid-column:2;grid-row:1;flex-direction:column;align-items:flex-start;gap:2px}
  body.full .msg{flex:none;text-align:left;font-size:14px}
  body.full .hud{grid-column:2;grid-row:2;flex-direction:column;align-items:flex-start;gap:4px}
  body.full .next{text-align:left}
  body.full .wrap{grid-column:1;grid-row:1 / 5}
  body.full .actions{grid-column:2;grid-row:3;align-self:end;justify-self:start}
  body.full .bar{grid-column:2;grid-row:3;align-self:end;justify-self:end}
}
/* the helpers, each icon in its own colour (greyed while it can't be used), and the one being placed picked out */
#perchBtn .ic{stroke:#BD5538} #wakeBtn .ic{stroke:#8D78AD} #reelBtn .ic{stroke:#B94588} #mopBtn .ic{stroke:#73A7AE} #shakeBtn .ic{stroke:#7885BA}
.helpers .tool .ic{stroke-width:2.4} .helpers .tool:disabled .ic{stroke:currentColor;stroke-width:2}
.helpers .tool.on{background:var(--hover-tint);outline:2px solid var(--ink);outline-offset:-2px;border-radius:10px}
.card img.pic{display:block;width:80%;max-width:260px;height:auto;margin:0 auto 14px}

<main>
  <header><div class="title"><h1>Pawlinko</h1><img src="../cats/gus-12.webp" alt="Gus, a grey tabby, sitting"><img src="../cats/peanut-12.webp" alt="Peanut, a small black cat, sitting"></div><div class="stripe"></div><p class="tagline">Take turns with Gus and Peanut knocking toys down the climbing wall into the cat beds</p></header>
  <nav class="games" id="games" aria-label="Games"></nav>

  <div class="status"><button class="timer" id="timer" hidden></button><span class="msg" id="msg" aria-live="polite"></span></div>

    <div class="goal" id="goal"><span class="score" id="score"></span><span><small>Target <b id="targetTxt"></b></small><small>Gold paw <b id="goldTxt"></b></small><small>Helpers <b id="helpersTxt"></b></small></span></div>

  </div>

  <div class="overlay" id="overlay"><div class="card" id="card"></div></div>

  <div class="actions helpers" aria-label="Helpers">

    <button id="reelBtn">Wind up</button>

    <button id="hintBtn">Hint</button>
    <button id="restartBtn">Restart</button>
    <button id="linkBtn">Share</button>
    <button id="bestBtn">Best times</button>

  <div class="bar">
    <label>Level <select id="levelSel" aria-label="Level"></select></label>
    <button id="newBtn" class="primary">New wall</button>
    <button id="fullBtn"></button>

</main>

<script>
/* ---------- the climbing wall (plain functions: the puzzle maker runs them in a worker too) ---------- */
// World units: the wall is 360 wide and 424 tall. Things knocked off the top shelf bounce down through rows of
// sisal posts (seen end-on, as round pegs), carpeted perches and springs, and land in the cat beds along the bottom.
// The physics is fixed-step and seeded, so a ball dropped from the same spot on the same wall always ends up in the
// same bed: Restart, a shared link and the hint all see the same thing the player does.
function plinkoLevels() {
  // beds: the points for each bed, left to right (the two at the ends always 10, so hugging a side doesn't pay) (0 is a napping cat); naps: which of them are cats; perches, springs
  // and holes (posts left out) come at random places; balls: how many Gus and Peanut have; aim: how far the target is
  // from random dropping toward the best spot (.6 unless given). Levels 1 and 2 are the easy ones: big beds, no perches,
  // springs or gaps, fewer rows of holds (rows; 8 otherwise) so a throw goes about where it's aimed, and a target nearer
// what random dropping makes (added after the first eight, which became 3 to 10). move: on levels 7 to 10, after every
// that-many things land, one of the napping cats gets up and crawls into another bed (plinkoTick).
  return [null,
    {beds: [10, 50, 100, 50, 10], perches: 0, springs: 0, holes: 0, balls: 10, aim: .2, rows: 5},
    {beds: [10, 50, 100, 100, 50, 10], perches: 0, springs: 0, holes: 0, balls: 10, aim: .25, rows: 6},
    {beds: [10, 25, 50, 100, 50, 25, 10], perches: 0, springs: 0, holes: 0, balls: 10},
    {beds: [10, 50, 25, 100, 25, 50, 10], perches: 2, springs: 0, holes: 2, balls: 10},
    {beds: [10, 100, 25, 50, 25, 100, 10], perches: 2, springs: 2, holes: 2, balls: 10},
    {beds: [10, 50, 100, 0, 100, 50, 10], perches: 3, springs: 2, holes: 3, balls: 10, naps: [3]},
    {beds: [10, 100, 25, 0, 50, 25, 10], perches: 3, springs: 3, holes: 3, balls: 10, naps: [3], shuffle: true, move: 3},
    {beds: [10, 0, 50, 25, 100, 50, 0, 10], perches: 4, springs: 3, holes: 4, balls: 10, naps: [1, 6], shuffle: true, move: 3},
    {beds: [10, 50, 0, 25, 100, 0, 25, 50, 10], perches: 4, springs: 4, holes: 4, balls: 10, naps: [2, 5], shuffle: true, move: 3},
    {beds: [10, 0, 25, 100, 0, 50, 0, 25, 10], perches: 5, springs: 4, holes: 5, balls: 10, naps: [1, 4, 6], shuffle: true, move: 3},
  ];
}
// The things Gus and Peanut knock off the shelf, and how each one falls: r its size, g how heavy (gravity's share),
// e how much it bounces off a post, drag how much the air slows it, wob how far each knock turns it aside.
// Yarn is soft (and unwinds as it falls, leaving a strand across the wall), a tennis ball bouncy, a fluffball and a feather drift, a bell or a mug drops like a stone, a wiffle
// ball or a spiky ball flies off any which way. lv: the first level it comes on. spill: what a mug or glass spills.
// soak: yarn, fluff and feathers soak up a spill they pass through, and fall heavier and duller for it.
// grip: how fuzzy it is, so how well it catches on a strand of yarn (1: like Velcro, it rides the strand down; 0 for
// smooth things, which glance off). often: how often it comes, against the others (yarn most, since its strands are the
// heart of the game; a mug, a glass or a coil now and then, so a spill or a tangle is an event).
function plinkoKinds() {
  return {
    yarn:    {name: "ball of yarn", r: 9,  g: 1,    e: .35, drag: 0,   wob: .15, lv: 1, soak: true, grip: .8, often: 4},
    tennis:  {name: "tennis ball",  r: 9,  g: 1,    e: .7,  drag: 0,   wob: .12, lv: 1, grip: .4, often: 2},
    fluff:   {name: "fluffball",    r: 10, g: .72,  e: .55, drag: .9, wob: .35, lv: 2, soak: true, grip: 1, often: 2},
    bell:    {name: "bell",         r: 8,  g: 1.3,  e: .15, drag: 0,   wob: .08, lv: 4, often: 2},
    mouse:   {name: "toy mouse",    r: 9,  g: 1,    e: .2,  drag: .3,  wob: .3,  lv: 4, grip: .4, often: 2},
    wiffle:  {name: "wiffle ball",  r: 10, g: .8,   e: .6,  drag: .8,  wob: .5,  lv: 5, grip: .3, often: 2},
    mug:     {name: "coffee mug",   r: 11, g: 1.35, e: .1,  drag: 0,   wob: .1,  lv: 6, spill: "#6B4A3B", often: 1},
    glass:   {name: "glass of water", r: 10, g: 1.3, e: .08, drag: 0,  wob: .15, lv: 6, spill: "#8EC5E8", often: 1},
    feather: {name: "feather",      r: 10, g: .6,   e: .3,  drag: 1.4, wob: .6,  lv: 4, soak: true, grip: 1, often: 2},
    spiky:   {name: "spiky ball",   r: 9,  g: 1,    e: .45, drag: 0,   wob: .7,  lv: 7, grip: .9, often: 2},
    phone:   {name: "phone",        r: 10, g: 1.2,  e: .05, drag: 0,   wob: .25, lv: 7, often: 1.5},
    plant:   {name: "succulent",    r: 11, g: 1.25, e: .12, drag: 0,   wob: .15, lv: 8, often: 1.5},
    coil:    {name: "coil spring",  r: 10, g: .9,   e: .75, drag: .2,  wob: .4,  lv: 4, grip: .5, often: 1},
  };
}
function plinkoRng(s) { return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function plinkoGeom() { return {W: 360, H: 424, R: 11, PEG: 6, BUMP: 9, SPRING: 10, BED_TOP: 356, ROW0: 66, ROWS: 8, DY: 35, DX: 40, DROP: 16}; }
// The wall for a level and seed: posts, perches, springs and beds.
function makeWall(n, seed) {
  const L = plinkoLevels()[n], C = plinkoGeom(), rnd = plinkoRng(seed);
  const pegs = [], ROWS = L.rows || C.ROWS;
  for (let k = 0; k < ROWS; k++) {
    const y = C.ROW0 + k * C.DY;
    // posts 40 apart, every other row shifted half a gap, never so near a side that a ball could wedge there
    if (k % 2 === 0) for (let j = 1; j < 9; j++) pegs.push({x: j * C.DX, y, k, j});
    else for (let j = 1; j < 8; j++) pegs.push({x: 20 + j * C.DX, y, k, j});
  }
  const pick = ok => { const c = pegs.filter(p => !p.gone && !p.used && ok(p)); return c.length ? c[Math.floor(rnd() * c.length)] : null; };
  const perches = [], springs = [];
  // a perch takes the place of two posts side by side in a row (not the top row or the bottom one), tilted so things roll off
  for (let i = 0; i < L.perches; i++) {
    const a = pick(p => p.k > 0 && p.k < ROWS - 1 && pegs.some(q => q.k === p.k && q.j === p.j + 1 && !q.used && !q.gone));
    if (!a) break;
    const b = pegs.find(q => q.k === a.k && q.j === a.j + 1);
    a.used = b.used = true;
    for (const q of pegs) if (Math.abs(q.k - a.k) === 1 && q.x > a.x - 30 && q.x < b.x + 30) q.used = q.used || "near";
    const tilt = rnd() < .5 ? -1 : 1;
    perches.push({x1: a.x, y1: a.y - 9 * tilt, x2: b.x, y2: b.y + 9 * tilt});
  }
  for (let i = 0; i < L.springs; i++) {
    const p = pick(p => p.k > 1 && p.x > 30 && p.x < C.W - 30);
    if (!p) break;
    p.used = true; springs.push({x: p.x, y: p.y});
  }
  for (let i = 0; i < L.holes; i++) { const p = pick(p => p.k > 0); if (!p) break; p.gone = true; }
  const posts = pegs.filter(p => !p.gone && !(p.used === true)).map(p => ({x: p.x, y: p.y}));
  // a sisal bump on each side wall in every row, so nothing slides straight down a side past everything
  for (let k = 0; k < ROWS; k++) for (const x of [0, C.W]) posts.push({x, y: C.ROW0 + k * C.DY + C.DY / 2, side: true});
  // springs and perches replace the posts they stand for
  const keep = posts.filter(p => !p.side && !springs.some(s => s.x === p.x && s.y === p.y) && !perches.some(q => (q.x1 === p.x || q.x2 === p.x) && Math.abs((q.y1 + q.y2) / 2 - p.y) < 1));
  let values = L.beds.slice(), naps = (L.naps || []).slice();
  if (L.shuffle && rnd() < .5) { values.reverse(); naps = naps.map(i => values.length - 1 - i); }
  // the beds at the ends are two thirds as wide as the rest (wide ones caught a third of everything)
  const nb = values.length, bw = C.W / (nb - 2 + 2 * .66), edge = k => k <= 0 ? 0 : k >= nb ? C.W : bw * .66 + (k - 1) * bw;
  const beds = values.map((v, i) => ({x1: edge(i), x2: edge(i + 1), v, nap: naps.includes(i)}));
  // what each throw is (and, for yarn, its colour), from the things this level has
  const K = plinkoKinds(), pool = Object.keys(K).filter(k => K[k].lv <= n);
  const sum = pool.reduce((a, k) => a + K[k].often, 0);
  const items = Array.from({length: L.balls}, () => { let r = rnd() * sum, k = pool[0]; for (const q of pool) if ((r -= K[q].often) < 0) { k = q; break; } return {k, c: Math.floor(rnd() * 8)}; });
  // the wall's goal (plinkoGoals), worth a bonus when it's met
  const goals = Object.entries(plinkoGoals()).filter(([k, gl]) => gl.fits(values, items)).map(([k]) => k);
  const goal = goals[Math.floor(rnd() * goals.length)];
  return {n, seed, posts: keep.concat(posts.filter(p => p.side)), perches, springs, beds, balls: L.balls, items, goal};
}
// One step of a thing in the air (1/240 s). It bounces off the holds, springs, perches, strands of yarn, the things
// stuck on the wall, the bed walls and the sides; a little seeded wobble at each knock keeps it from being too
// predictable. A stuck thing hit hard enough is knocked loose (marked loose; plinkoWorld sets it moving).
function plinkoStep(t, b, w) {
  const C = plinkoGeom(), h = 1 / 240, G = 900 * b.g, R = b.r;
  const rnd = () => { b.s = (b.s + 0x6D2B79F5) | 0; let q = Math.imul(b.s ^ (b.s >>> 15), 1 | b.s); q = (q + Math.imul(q ^ (q >>> 7), 61 | q)) ^ q; return ((q ^ (q >>> 14)) >>> 0) / 4294967296; };
  b.vy += G * h;
  if (b.drag) { b.vx *= 1 - b.drag * h; b.vy *= 1 - b.drag * h; }
  const sp = Math.hypot(b.vx, b.vy); if (sp > 900) { b.vx *= 900 / sp; b.vy *= 900 / sp; }
  b.x += b.vx * h; b.y += b.vy * h;
  const hitRound = (cx, cy, rr, e, kick) => {
    const dx = b.x - cx, dy = b.y - cy, d2 = dx * dx + dy * dy, s = R + rr;
    if (d2 >= s * s) return false;
    const d = Math.sqrt(d2) || .001, nx = dx / d, ny = dy / d;
    b.x = cx + nx * s; b.y = cy + ny * s;
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) {
      b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
      // a spring throws it off, always a little to one side, so nothing bounces straight up and down on it for ever
      if (kick) { const out = b.vx * nx + b.vy * ny; if (out < kick) { b.vx += (kick - out) * nx; b.vy += (kick - out) * ny; } b.vx += (rnd() < .5 ? -1 : 1) * (70 + rnd() * 80); }
      // the wobble: turn the speed a little
      const a = (rnd() - .5) * b.wob, c = Math.cos(a), s2 = Math.sin(a), vx = b.vx;
      b.vx = vx * c - b.vy * s2; b.vy = vx * s2 + b.vy * c;
      if (-vn > 220) b.hard = (b.hard || 0) + 1;
    }
    return true;
  };
  const hitSeg = (x1, y1, x2, y2, hr, e) => {
    const ex = x2 - x1, ey = y2 - y1, l2 = ex * ex + ey * ey, u = l2 ? Math.max(0, Math.min(1, ((b.x - x1) * ex + (b.y - y1) * ey) / l2)) : 0;
    const px = x1 + ex * u, py = y1 + ey * u, dx = b.x - px, dy = b.y - py, d2 = dx * dx + dy * dy, s = R + hr;
    if (d2 >= s * s) return false;
    const d = Math.sqrt(d2) || .001, nx = dx / d, ny = dy / d;
    b.x = px + nx * s; b.y = py + ny * s;
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) { b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny; b.vx *= .995; if (-vn > 220) b.hard = (b.hard || 0) + 1; }
    return true;
  };
  if (b.y > C.ROW0 - 22 && b.y < C.BED_TOP) {

  }
  const x = xs[Math.round((run[0] + run[1]) / 2)], bed = runs[run[0]].bed, deep = hints.level() > 0;
  const mark = {x, bed, pts: deep ? plinkoRun(t, x, g.i, true, g.w).pts : null};
  const what = `${catOf(g.i).name}'s ${nameOf(t.items[g.i])}`;
  if (best <= 0) hints.show(mark, `Nothing scores with ${what} from anywhere: the gold ring is as good as any.`);
  else hints.show(mark, deep ? `Here's the way it goes from the gold ring: ${best} points.` : `Drop ${what} from the gold ring for ${best} points.`);
  g.hinted = true; save();
};

/* ---------- endings ---------- */
function finish(g) {
  if (game !== g || g.state !== "done") return;
  if (g.w.score >= g.wall.target) win(); else lose();
}
function win() {
  const g = game; g.state = "won"; G.finishClock(g);
  const next = Math.min(MAX_LEVEL, g.level + 1), gold = !g.hinted && !g.wall.restarted && g.w.score >= g.wall.gold;
  settings.level = next; $("levelSel").value = next; save(); status();
  G.track(`Pawlinko won level ${g.level}`);
  const im = new Image(); im.className = "pic"; im.src = src("peanut-7"); im.alt = "Peanut asleep in a round bed";
  const text = `${g.w.score} points, over the target of ${g.wall.target}.` + (g.w.gp && g.w.gp.done ? " Goal met, too!" : "") + (!gold && !g.hinted && !g.wall.restarted ? ` ${g.wall.gold} points with no hints or restarts wins a gold paw.` : "") + (g.level === MAX_LEVEL ? "" : ` Next up: level ${next}.`);
  G.winCard(text, () => startLevel(next), "Admire the wall", g.result,
    {title: "All tucked in!", gold, goldWhy: `${g.wall.gold} points with no hints or restarts!`, goldPic: [im], next: next > g.level ? `Next: level ${next}` : "New wall",
     top: g.level === MAX_LEVEL, after: G.otherSize($("levelSel"), next, startLevel, "Or play a different level:")});
}
function lose() {
  const g = game; g.state = "lost"; status(); save();
  G.breakStreak(); G.track(`Pawlinko missed on level ${g.level}`);
  G.openCard("Not quite!", `${g.w.score} points, ${g.wall.target - g.w.score} short of the target of ${g.wall.target}.`,
    [["Try this wall again", () => { g.wall.restarted = true; startWall(g.wall); }, true], ["New wall", () => { G.closeCard(); newGame(g.level); }],
     ["Admire the wall", () => { G.closeCard(); G.note("Tap Restart to try this wall again.", 0); }], G.homeBtn()],
    null, G.otherSize($("levelSel"), g.level, startLevel, "Or play a different level:"));
}
function startLevel(n) { settings.level = n; $("levelSel").value = n; save(); G.closeCard(); newGame(n); }
// Restart: this wall again, as dealt; once a throw's been made, it costs the gold paw.
$("restartBtn").onclick = () => { if (game) { if (game.i > 0 || game.state !== "ready") game.wall.restarted = true; startWall(game.wall); } };
$("newBtn").onclick = () => { if (game) newGame(game.level); };
// Share: the level and the wall, as built.
$("linkBtn").onclick = () => { if (game) G.shareCard({name: "Pawlinko", what: "wall", won: game.state === "won", puzzle: () => ({g: "pawlinko", N: game.level, s: game.wall.seed, v: 2})}); };
function openShared(d) {
  if (!d.v && Number.isInteger(d.N)) d = {...d, N: d.N + 2};   // a link from before the two easy levels came in front
  if (!(Number.isInteger(d.N) && d.N >= 1 && d.N <= MAX_LEVEL) || !Number.isInteger(d.s)) throw new Error("the shared wall doesn't fit the game");
  settings.level = d.N; $("levelSel").value = d.N; save(); startWall(plinkoTargets(makeWall(d.N, d.s)));
}

/* ---------- how to play ---------- */
function showHelp() { settings.seenHelp = false; helpOnFirstVisit(); if (!document.querySelector(".spot") && !(game && busy(game))) { settings.seenHelp = true; G.helpLater(); } }
function helpOnFirstVisit(n = 0) {
  if (settings.seenHelp || document.querySelector(".spot")) return;
  if (!game || !["ready", "running"].includes(game.state)) return;
  if (busy(game)) { if (n < 40) setTimeout(() => helpOnFirstVisit(n + 1), 300); return; }   // let it land first
  const cols = 8, rows = 10, row = y => Math.min(rows - 1, Math.floor((CAT + y) / (CAT + H + M) * rows)), col = x => Math.max(0, Math.min(cols - 1, Math.floor((x + M) / (W + 2 * M) * cols)));
  const top = [], beds = [];
  for (let x = 0; x < cols; x++) { for (let y = 0; y <= row(C.DROP); y++) top.push([x, y]); for (let y = row(C.BED_TOP); y < rows; y++) beds.push([x, y]); }
  const t = game.wall, at = (x, y) => [[col(x), row(y)]];
  const naps = plinkoNaps(t, game.w).map(k => t.beds[k]).flatMap(b => [...new Set([col(b.x1 + 4), col(b.x2 - 4)])].map(c => [c, rows - 1]));
  const mid = []; for (let x = 1; x < cols - 1; x++) for (let y = row(C.ROW0) + 1; y < row(C.BED_TOP) - 1; y++) mid.push([x, y]);
  const p0 = game.w.perches.length + game.w.springs.length;
  const i0 = game.i, turn = G.yourTurn(() => game, g => { game = g; }, () => { status(); paintHud(); });
  const steps = [
    ...(inSetup(game) && game.setup.length ? [{say: "First, tap the wall to place a piece", lit: mid, try: {done: () => game.w.perches.length + game.w.springs.length > p0, yes: "Placed!"}, ...turn.from}] : []),
    {say: "Throw from the shelf: drag, let go", lit: top, try: {done: () => game.i > i0 && !busy(game), yes: "Nice!"}, ...turn.upTo},
    {say: "Each bed scores its points", lit: beds},
    {say: "Same bed twice running: double!", lit: beds, tone: "ok"},
    {say: "Swap the next thing in, twice a wall", els: [$("swapBtn")], later: true},
    {say: "Off your piece, or riding yarn: bonus!", lit: beds, later: true},
    ...(naps.length ? [{say: "Napping cats score nothing", lit: naps}] : []),
    ...(t.springs.length ? [{say: "Springs bounce things back up", lit: t.springs.flatMap(s => at(s.x, s.y)), later: true}] : []),
    {say: "Yarn leaves a strand to catch on", lit: [3, 4].flatMap(x => [3, 4, 5].map(y => [x, y])), later: true},
    {say: "Stuck things stay till knocked loose", lit: [2, 3, 4, 5].flatMap(x => [4, 5].map(y => [x, y])), later: true},
    {say: "Fuzzy things ride yarn down", lit: [3, 4].flatMap(x => [3, 4, 5].map(y => [x, y])), later: true},
    {say: "Coil springs tangle in yarn", lit: [3, 4].flatMap(x => [3, 4, 5].map(y => [x, y])), later: true},
    {say: "Wet yarn or fluff falls heavier", lit: [2, 3, 4, 5].flatMap(x => [2, 3].map(y => [x, y])), later: true},
    {say: "Reach the target to win", els: [$("goal")]},
    {say: "Meet the wall's goal for +100", els: [$("wallGoal")]},
    ...(LEVELS[t.n].move ? [{say: "Napping cats move every few landings", lit: naps, later: true}] : []),
    {say: "A few helpers on every wall", els: [$("perchBtn")]},
    {say: "Wake a cat: its bed scores 50", els: [$("wakeBtn")], later: true},
    {say: "Wind up a strand you don't want", els: [$("reelBtn")], later: true},
    {say: "Wipe up spills before they soak in", els: [$("mopBtn")], later: true},
    {say: "Shake while something's falling", els: [$("shakeBtn")], later: true},
    {say: "Stuck? Hint shows a good spot", els: [$("hintBtn")]},
  ];
  G.spotlight({grid: cv, w: cols, h: rows, steps, done: () => { settings.seenHelp = true; save(); }});
}
$("helpBtn").onclick = showHelp;

/* ---------- start ---------- */
for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(levelName(n).replace("Level ", "") + (n === MAX_LEVEL ? " (hardest)" : ""), n));
$("levelSel").onchange = e => { startLevel(+e.target.value); $("levelSel").blur(); };
G.nav("pawlinko");
G.fullScreen({btn: $("fullBtn"), name: "Pawlinko", change: () => paint()});
G.setupTimer({name: "pawlinko", game: () => game, playing: g => g.state === "running", save, label: levelName, noun: "level",
  emptyText: "Reach the target on a level and your times will show up here. They're kept on this device only."});
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : settings.level);
if (!(settings.level >= 1 && settings.level <= MAX_LEVEL)) settings.level = 1;
$("levelSel").value = settings.level;
const shared = G.readShare("pawlinko");
let openedShare = false;
if (shared) try { openShared(shared); openedShare = true; G.note("Here's the shared climbing wall. Good luck!", 6000); G.track("Pawlinko shared puzzle opened"); } catch (e) { G.note("That share link didn't work.", 5000); }
if (!openedShare) {
  const s = state.game;
  G.reopen(() => {
    if (!(s && s.level === settings.level && Number.isInteger(s.seed))) { newGame(settings.level); return; }
    const t = makeWall(s.level, s.seed); t.target = s.target; t.gold = s.gold; t.restarted = !!s.restarted;
    const w = s.w;
    if (w && !Array.isArray(w.springs)) w.springs = [];   // saved before you could place springs
    const order = Array.isArray(s.items) && s.items.length === t.items.length && s.items.every(o => Array.isArray(o) && KINDS[o[0]] && Number.isInteger(o[1])) ? s.items.map(([k, c]) => ({k, c})) : null; num = Number.isFinite, okThing = b => b && num(b.x) && num(b.y) && KINDS[b.k] && num(b.i) && t.items[b.i];
    if (!(s.i >= 0 && s.i <= t.balls && w && Array.isArray(w.moving) && Array.isArray(w.stuck) && Array.isArray(w.strands) && Array.isArray(w.landed) && num(w.score) && Array.isArray(w.perches) && Array.isArray(w.awake) && w.perches.every(q => q && [q.x1, q.y1, q.x2, q.y2].every(num)) && w.springs.every(q => q && num(q.x) && num(q.y)) && w.awake.every(k => t.beds[k]) && Array.isArray(w.wet) && w.wet.every(p => p && num(p.x) && num(p.y) && /^#[0-9A-F]{6}$/i.test(p.c)) &&
      w.moving.every(okThing) && w.stuck.every(okThing) && w.landed.every(l => t.beds[l.bed] && t.items[l.i]) && w.strands.every(q => q && num(q.c) && num(q.i) && Array.isArray(q.pts) && q.pts.every(p => Array.isArray(p) && p.every(num)))))
      throw new Error("the saved wall didn't fit");
    startWall(t);
    if (order) t.items = order;   // swapped as it was
    Object.assign(game, {i: s.i, w, swaps: num(s.swaps) ? Math.max(0, Math.min(SWAPS, s.swaps)) : SWAPS, setup: Array.isArray(s.setup) ? s.setup.filter(k => k === "perch" || k === "spring") : [], setting: !!s.setting && s.i === 0, helpers: num(s.helpers) ? Math.max(0, Math.min(HELPERS[s.level], s.helpers)) : HELPERS[s.level], splats: Array.isArray(s.splats) ? s.splats.filter(p => p && num(p.x) && num(p.y) && /^#[0-9A-F]{6}$/i.test(p.c)) : [], aim: s.aim || W / 2, hinted: !!s.hinted,
      ms: s.ms || 0, started: s.started, timed: s.timed !== false, state: s.started ? "running" : "ready"});
    G.checkClock(game); status(); paintHud(); if (inSetup(game)) setupNote();
  }, msg => { newGame(settings.level); G.note(msg, 5000); });
}
window.addEventListener("hashchange", () => { const d = G.readShare("pawlinko"); if (d) G.offerShare(d, {name: "Pawlinko", inProgress: !!(game && game.started && !["won", "lost"].includes(game.state)), open: d => { try { openShared(d); } catch (e) { G.note("That share link didn't work.", 5000); } }}); });
requestAnimationFrame(frame);
</script>
