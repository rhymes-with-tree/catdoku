.status .info{display:flex;align-items:center;gap:10px}

.goals{width:var(--board);display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:44px}
.goals[hidden]{display:none}
.goal{display:inline-flex;align-items:center;gap:4px;padding:2px 12px 2px 4px;border:2px solid var(--ink);border-radius:999px;

.goal.done{background:color-mix(in srgb,#6AA673 50%,#fff)}

.slot.empty{cursor:default}
.slot.nofit svg{opacity:.35;filter:grayscale(.6)}
.slot.picked{border:3px solid var(--ink);background:var(--panel)}
.slot.dragging svg{opacity:.15}
.slot.hint{border:3px solid #ECA818;background:rgba(236,168,24,.18)}
.slot:hover{background:none}
.slot.picked:hover{background:var(--panel)}
.dragpiece{position:fixed;left:0;top:0;z-index:8;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(42,37,48,.3))}

<script>
const $ = G.$;
G.nav("catpile");

/* ---------- the rules (plain functions, no drawing) ---------- */
const N = 9;   // the blanket is 9 × 9, in nine 3 × 3 cushions

// A shape's cells moved so its top-left is 0, 0 and sorted, so the same shape always looks the same.

        const [x, y] = k.split(",").map(Number);
        if (!fits(x, y, w, h)) continue;
        for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) left.delete((x + i) + "," + (y + j));

// Levels: what's to collect, how many toys lie about at once, how full the blanket starts, which shapes come.
const MAX_LEVEL = 15;
function params(n) {

    if (fullLines(f2).length) continue;

    const under = filled.map((f, i) => f ? i : -1).filter(i => i >= 0);
    for (let k = 0; k < Math.min(2, under.length) && st.goals.length; k++) {
      const i = under.splice(Math.floor(rnd() * under.length), 1)[0];
      st.toys[i] = st.goals[k % st.goals.length].k;
    }
  }
  st.out = p.out;

}
const COLOURS_N = 7;
function filledOf(st) {
  const f = new Array(N * N).fill(false);
  for (const c of st.cats) for (let j = 0; j < c.h; j++) for (let i = 0; i < c.w; i++) f[(c.y + j) * N + c.x + i] = true;
  return f;
}
function addShape(st, cells, at, colour) {
  const ax = at % N, ay = Math.floor(at / N);
  const grp = st.nextGroup = (st.nextGroup || 1) + 1;   // the cats of one clump share a blanket
  for (const [x, y, w, h] of catsFor(cells)) st.cats.push({x: x + ax, y: y + ay, w, h, c: colour, id: st.nextId++, g: grp});

// Toys still needed that aren't already lying about, dropped on empty squares (never more than `out` about at once).
function dropToys(st, rnd) {
  const filled = filledOf(st);
  const about = k => Object.values(st.toys).filter(t => t === k).length;
  const empty = filled.map((f, i) => !f && st.toys[i] === undefined ? i : -1).filter(i => i >= 0);
  let total = Object.keys(st.toys).length;
  const want = st.goals.filter(g => g.need - g.got - about(g.k) > 0);
  let turn = 0;
  while (total < st.out && empty.length && want.length) {
    const g = want[turn++ % want.length];
    if (g.need - g.got - about(g.k) <= 0) { want.splice(want.indexOf(g), 1); continue; }

// Put tray shape `t` with its top-left at `at`. Returns what happened, or null if it doesn't fit.
// The full lines clear: their cats wake and leave, taking any toys they were lying on, and cats only partly
// in a cleared line curl up smaller in what's left of their spot.

// A shape turned a quarter turn clockwise, and the ways a shape can lie with up to three turns: [cells, turns] each.

  el(b, "svg", {viewBox: "0 0 500 500", "aria-hidden": "true"});

  const r = document.createElement("button"); r.className = "turnBtn"; r.type = "button"; r.textContent = "↻"; r.hidden = true;
  r.setAttribute("aria-label", `Turn clump ${t + 1}`); r.onclick = () => turn(t);
  w.append(b, r); trayEl.append(w); slots.push(b); turnBtns.push(r);
}
const sizeOf = cells => [Math.max(...cells.map(c => c[0])) + 1, Math.max(...cells.map(c => c[1])) + 1];
function drawTray() {
  if (!S) return;
  const filled = filledOf(S.d), mark = hints.current();
  slots.forEach((b, t) => {
    const cells = S.d.tray[t], svg = b.firstChild; svg.innerHTML = "";
    turnBtns[t].hidden = !turnsOn || !cells || S.over || turnsOf(cells).length < 2;   // nothing to turn on a square
    b.classList.toggle("empty", !cells);
    b.classList.toggle("picked", picked === t);
    b.classList.toggle("dragging", !!drag && drag.t === t && drag.moved);
    b.classList.toggle("hint", !!mark && mark.t === t);
    b.classList.toggle("nofit", !!cells && !(turnsOn ? turnsOf(cells) : [[cells]]).some(([c]) => fitsAnywhere(filled, {cells: c})));
    b.setAttribute("aria-label", cells ? `Clump ${t + 1}: ${cells.length} ${cells.length === 1 ? "square" : "squares"}` : `Clump ${t + 1}: placed`);
    if (!cells) return;
    const [w, h] = sizeOf(cells), s = Math.max(w, h, 3);
    const g = el(svg, "g", {transform: `translate(${250 - w * 500 / s / 2 * .92} ${250 - h * 500 / s / 2 * .92}) scale(${5 / s * .92})`});
    drawClump(g, cells, colourOf(S.d, t), 5000 + S.d.deals * 10 + t * 3);
  });
}
// The clump being dragged or picked, shown where it would go (red where it doesn't fit), and the lines it would fill.
function drawGhost() {
  layers.ghost.innerHTML = ""; layers.clear.innerHTML = "";
  if (!S || S.over || !ghost) return;
  const cells = S.d.tray[ghost.t]; if (!cells) return;
  const ok = fitsAt(filledOf(S.d), {cells}, ghost.at), ax = ghost.at % N, ay = Math.floor(ghost.at / N);
  const g = el(layers.ghost, "g", {class: "ghost" + (ok ? "" : " bad"), transform: `translate(${ax * U} ${ay * U})`});
  drawClump(g, cells.filter(([x, y]) => x + ax < N && y + ay < N), colourOf(S.d, ghost.t), 5000 + S.d.deals * 10 + ghost.t * 3);
  if (!ok) return;
  const f = filledOf(S.d); for (const [x, y] of cells) f[(y + ay) * N + x + ax] = true;
  for (const [kind, k] of fullLines(f)) for (const i of lineCells(kind, k)) el(layers.clear, "rect", {class: "willclear", x: i % N * U, y: Math.floor(i / N) * U, width: U, height: U});
}
function drawMarks() {
  layers.mark.innerHTML = "";
  const m = hints.current();
  if (m && m.at !== undefined && S && S.d.tray[m.t]) for (const [x, y] of cellsOf({cells: m.cells}, m.at)) el(layers.mark, "rect", {class: "hintsq", x: x * U + 3, y: y * U + 3, width: U - 6, height: U - 6, rx: 14});
  if (cursor >= 0) el(layers.mark, "rect", {class: "kbring", x: cursor % N * U + 3, y: Math.floor(cursor / N) * U + 3, width: U - 6, height: U - 6, rx: 12});
}

/* ---------- input ---------- */
// Drag a clump from the tray onto the blanket (on a touch screen it rides above your finger, so you can see
// where it goes). Or tap a clump, then tap the blanket where its middle should go.
const boardBox = () => { const r = board.getBoundingClientRect(), k = r.width / 912; return {x: r.left + 6 * k, y: r.top + 6 * k, cell: U * k}; };
let dragEl = null;
function anchorFor(t, px, py) {   // the top-left square for the clump with its middle at a point on the page
  const cells = S.d.tray[t], [w, h] = sizeOf(cells), b = boardBox();
  const x = Math.round((px - b.x) / b.cell - w / 2), y = Math.round((py - b.y) / b.cell - h / 2);
  if (x < 0 || y < 0 || x + w > N || y + h > N) {
    // a little off the edge still counts, pushed back on
    const cx = Math.max(0, Math.min(N - w, x)), cy = Math.max(0, Math.min(N - h, y));
    if (Math.abs(cx - x) > 1 || Math.abs(cy - y) > 1) return -1;
    return cy * N + cx;
  }
  return y * N + x;
}
trayEl.addEventListener("pointerdown", e => {
  const b = e.target.closest(".slot"); if (!b || !S || S.over) return;
  const t = +b.dataset.t; if (!S.d.tray[t]) return;
  e.preventDefault();
  try { b.setPointerCapture(e.pointerId); } catch (_) {}
  drag = {t, x: e.clientX, y: e.clientY, moved: false, lift: e.pointerType === "touch" ? 1 : 0, id: e.pointerId};
  if (S.timed && !S.started) S.started = true;
  cursor = -1;
});
trayEl.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
  if (!drag.moved) { drag.moved = true; picked = -1; drawTray(); }
  const cells = S.d.tray[drag.t], [w, h] = sizeOf(cells), b = boardBox();
  const px = e.clientX, py = e.clientY - (drag.lift ? b.cell * (h / 2 + 1.1) : 0);
  if (!dragEl) {
    dragEl = el(document.body, "svg", {class: "dragpiece"});
    dragEl.setAttribute("viewBox", `0 0 ${w * U} ${h * U}`);
    drawClump(dragEl, cells, colourOf(S.d, drag.t), 5000 + S.d.deals * 10 + drag.t * 3);
  }
  dragEl.setAttribute("width", w * b.cell); dragEl.setAttribute("height", h * b.cell);
  dragEl.style.transform = `translate(${px - w * b.cell / 2}px, ${py - h * b.cell / 2}px)`;
  const at = anchorFor(drag.t, px, py);
  const next = at >= 0 ? {t: drag.t, at} : null;
  if (JSON.stringify(next) !== JSON.stringify(ghost)) { ghost = next; drawGhost(); }
});
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return;
  const {t, moved} = drag; drag = null;
  if (dragEl) { dragEl.remove(); dragEl = null; }
  if (!moved) { picked = picked === t ? -1 : t; ghost = null; drawTray(); drawGhost(); if (picked >= 0) G.note("Now tap the blanket where it should go.", 2500); return; }
  const g = ghost; ghost = null;
  if (cancel || !g || !drop(t, g.at)) { drawTray(); drawGhost(); if (!cancel && g) G.note("That doesn't fit there.", 1800); }
}
trayEl.addEventListener("pointerup", e => endDrag(e));
trayEl.addEventListener("pointercancel", e => endDrag(e, true));
// tapping the blanket with a clump picked puts it down with its middle there
board.addEventListener("pointerdown", e => {
  if (!S || S.over || picked < 0) return;
  e.preventDefault();
  const at = anchorFor(picked, e.clientX, e.clientY);
  if (at < 0 || !drop(picked, at)) G.note("That doesn't fit there. Tap somewhere else, or tap the clump to put it back.", 2500);
});
// Keys: the arrows move a cursor on the blanket, 1 to 3 pick a clump (shown at the cursor), Space puts it down.
const keys = G.gridKeys({
  on: () => !!S && !S.over, size: () => [N, N], keys: ["1", "2", "3", "r"],
  show(i) { cursor = i; ghost = i >= 0 && picked >= 0 ? {t: picked, at: i} : null; drawGhost(); drawMarks(); },
  act(i, key) {
    if (key === "r") { if (picked >= 0) turn(picked); this.show(i); return; }
    if (key !== " ") { const t = +key - 1; if (!S.d.tray[t]) return; picked = t; drawTray(); this.show(i); return; }
    if (picked < 0) { picked = S.d.tray.findIndex(c => c && fitsAnywhere(filledOf(S.d), {cells: c})); if (picked < 0) return; drawTray(); this.show(i); return; }
    if (!drop(picked, i)) G.note("That doesn't fit there.", 1800); else this.show(i);
  },
  escape() { picked = -1; ghost = null; drawTray(); drawGhost(); },
});

/* ---------- hints ---------- */
// The first hint lights the clump to use; asked again, the squares to put it on.
$("hintBtn").onclick = () => {
  if (!S || S.over || document.querySelector(".spot")) return;
  const mv = bestMove(S.d, turnsOn);
  if (!mv) { G.note("Nothing in the tray fits anywhere.", 3000); return; }
  const [t, at, , k, cells] = mv, times = ["", "once", "twice", "three times"][k];
  if (S.level && !S.d.hinted) S.d.hinted = true;
  save();
  if (hints.level() === 0) hints.show({t}, `Try the clump lit in gold${k ? `, turned ${times} (↻)` : ""}. Tap Hint again to see where.`);
  else hints.show({t, at, cells}, k ? `Turn the gold clump ${times} (↻), then put it on the gold squares.` : `Put the gold clump on the gold squares.`);
};

/* ---------- sharing ---------- */
// The blanket as dealt is its level, its seed and the toy kinds in play; progress is the moves made.
$("linkBtn").onclick = () => { if (S && S.level) G.shareCard({name: "Cat Pile", what: "blanket", won: S.over && won(S.d),
  puzzle: () => ({g: "catpile", N: S.level, s: S.d.seed, k: S.d.kinds.join(".")}),
  progress: () => S.d.moves.map(([t, at]) => t + "." + at).join(",")}); };
function openShared(d) {
  const kinds = String(d.k || "").split(".").map(Number);
  if (!(d.N >= 1 && d.N <= MAX_LEVEL) || !Number.isInteger(d.s) || kinds.length < MIN_COLOURS || kinds.some(k => !KINDS[k]))
    throw new Error("the shared blanket doesn't fit the game");
  const dd = deal(d.N, d.s, kinds), moves = d.p ? String(d.p).split(",").filter(Boolean).map(m => m.split(".").map(Number)) : [];
  start(d.N, dd, {timed: !moves.length});
  for (const [t, at] of moves) if (!(t >= 0 && t < 3 && at >= -1 && at < N * N) || !(at < 0 ? turn(t, true) : drop(t, at))) break;
  if (moves.length) { S.history = []; draw(); save(); }
}

/* ---------- how to play ---------- */
function intro(again) {
  if (!again && G.load(INTRO).seen) return;
  if (!S || document.querySelector(".spot")) return;
  const toys = Object.keys(S.d.toys).map(Number).filter(i => !filledOf(S.d)[i]).map(i => [i % N, Math.floor(i / N)]);
  const row = [...Array(N).keys()].map(x => [x, 4]), cushion = [];
  for (let j = 0; j < 9; j++) cushion.push([6 + j % 3, Math.floor(j / 3)]);
  const steps = [
    {say: "Drag a clump of napping cats onto the blanket", els: [trayEl]},
    {say: "Fill a row or column…", lit: row},
    {say: "…or a whole cushion, and those cats wake up and go", lit: cushion},
  ];
  if (S.level) {
    if (toys.length) steps.push({say: "Get a cat to nap on a toy", lit: toys, outline: toys.map(p => [p])});
    steps.push({say: "Clear its line to collect the toy", els: [[...$("goals").children]]},
      {say: "Collect them all before the cats run out of room", els: [trayEl]});
  }
  steps.push({say: "Stuck? Hint shows a good spot", els: [$("hintBtn")]});
  if (S.level) steps.push({say: "Or play zen: no goals, no end", els: [$("levelSel")]});
  G.spotlight({grid: board, w: N, h: N, steps, map: () => { const b = boardBox(); return {ox: b.x, oy: b.y, cw: b.cell, ch: b.cell}; },
    done: () => G.save(INTRO, {seen: true})});
}
$("helpBtn").onclick = () => { if (drag) return; intro(true); };

/* ---------- toys, times, and opening ---------- */
const toyChest = () => ({kinds: KINDS, off: offToys, min: MIN_COLOURS, src: toySrc, save: off => {
  offToys = off; G.saveToys(off);
  if (S) S.d.look = KINDS.map((_, k) => S.d.look && lookIdx(k).includes(S.d.look[k]) ? S.d.look[k] : lookIdx(k)[0]);
  if (S && S.level && S.d.goals.some(g => !kindsOn().includes(g.k))) { startLevel(S.level); G.note("Here's a new blanket with your toys.", 4000); }
  else { if (S) draw(true); G.note("Saved.", 3000); }
}});
$("toysBtn").onclick = () => G.toyPicker(toyChest());
$("catsTgl").checked = catsOn;
$("catsTgl").onchange = e => {
  catsOn = e.target.checked; G.save(PREFS, {cats: catsOn, turns: turnsOn});
  layers.cats.innerHTML = ""; catEls.clear(); draw(true);
};
$("turnTgl").checked = turnsOn;
$("turnTgl").onchange = e => { turnsOn = e.target.checked; G.save(PREFS, {cats: catsOn, turns: turnsOn}); hints.clear(); draw(); };
G.needToys({...toyChest(), off: () => offToys, game: "Cat Pile"});
G.setupTimer({name: "catpile", game: () => S, playing: g => !g.over, save,
  label: n => `Level ${n}`, noun: "level",
  emptyText: "Finish a level and your times will show up here. They're kept on this device only."});
$("bestBtn").onclick = () => G.showBests("Best times", S && S.level ? S.level : climb);

const saved = G.load(STORE), shared = G.readShare("catpile");
climb = saved.climb || 1; zenBest = saved.zenBest || 0;
const shareOpts = () => ({name: "Cat Pile", inProgress: !!(S && !S.over && S.d.moves.length), open: d => { try { openShared(d); } catch (e) { G.note("That share link didn't work.", 5000); } }});
window.addEventListener("hashchange", () => { const d = G.readShare("catpile"); if (d) G.offerShare(d, shareOpts()); });
let openedShare = false;
if (shared) try { openShared(shared); openedShare = true; G.note(shared.p ? "Here's the shared blanket, with its progress so far. It isn't timed." : "Here's the shared blanket. Good luck!", 6000); G.track("Cat Pile shared puzzle opened"); } catch (e) { G.note("That share link didn't work.", 5000); }
if (!openedShare) G.reopen(() => {
  if (!saved.d) return startLevel(climb);
  const d = saved.d;
  if (!Array.isArray(d.cats) || !Array.isArray(d.tray) || d.tray.length !== 3 || !(saved.level >= 0 && saved.level <= MAX_LEVEL)) throw new Error("the saved blanket is from another version of the game");
  if (saved.over && (!saved.level || won(d))) return startLevel(saved.level ? climb : 0);
  start(saved.level, d, {ms: saved.ms, started: saved.started, timed: saved.timed, over: false});
}, why => { startLevel(climb); G.note(why, 0); });
intro();
</script>
