<script src="../games.js?v=2026-10-09.4"></script>
<script>
const $ = G.$;
G.nav("bubbles");

/* ---------- the rules (plain functions, no drawing) ---------- */
// Bubbles sit in rows under a shelf; every other row is shifted half a bubble along, like a honeycomb.
// Sizes are in bubble widths. A bubble that ends up in row ROWS (counting the rows the shelf has come
// down) is over the cat's line, and the level is lost.
const COLS = 8, ROWS = 12, RH = Math.sqrt(3) / 2, TOP = 0.3;
const LINE = TOP + 1 + (ROWS - 1) * RH, SX = COLS / 2, SY = LINE + 1.15, HT = LINE + 2.8;
const EMPTY = -1, KIT = 10, YARN = 11, PEG = 12;   // 0–9 are kinds of toy; then a kitten, a yarn tangle, a cat-tree post
const ZOOM = 1, BOUNCY = 2, NIP = 3;               // special bubbles the cat can bat
const isToy = k => k >= 0 && k < KIT;
const shifted = (B, r) => ((r + B.par) & 1) === 1;
const rowLen = (B, r) => shifted(B, r) ? COLS - 1 : COLS;
const cellX = (B, r, c) => c + 0.5 + (shifted(B, r) ? 0.5 : 0);
const cellY = (B, r, drops = B.drops) => TOP + drops * RH + 0.5 + r * RH;
const blankRow = () => Array(COLS).fill(EMPTY);
const cloneB = B => ({rows: B.rows.map(r => r.slice()), par: B.par, drops: B.drops});
function nbrs(B, r, c) {
  const s = shifted(B, r), out = [[r, c - 1], [r, c + 1]];
  for (const y of [r - 1, r + 1]) out.push([y, s ? c : c - 1], [y, s ? c + 1 : c]);
  return out.filter(([y, x]) => y >= 0 && y < B.rows.length && x >= 0 && x < rowLen(B, y));
}
function cellsOf(B) {
  const out = [];
  B.rows.forEach((row, r) => row.forEach((k, c) => { if (k !== EMPTY) out.push([r, c, k]); }));
  return out;
}
const overLine = B => cellsOf(B).some(([r]) => r + B.drops >= ROWS);

// Where a bubble batted at `ang` (radians, 0 is straight right, π/2 straight up) goes: the path it
// takes, bouncing off the sides, and the empty spot it sticks in. It sticks once it comes within
// HIT of a bubble (a little under one bubble, so it can slip through a gap) or reaches the shelf.
const HIT = 0.82;
function flight(B, ang) {
  let x = SX, y = SY, dx = Math.cos(ang), dy = -Math.sin(ang), hit = null;
  const path = [[x, y]], top = cellY(B, 0), step = 0.06;
  for (let i = 0; i < 2000 && !hit; i++) {
    x += dx * step; y += dy * step;
    if (x < 0.5 || x > COLS - 0.5) { const wall = x < 0.5 ? 0.5 : COLS - 0.5; x = 2 * wall - x; dx = -dx; path.push([wall, y]); }
    if (y <= top) { hit = {r: -1}; break; }
    const r0 = Math.round((y - top) / RH);
    for (let r = Math.max(0, r0 - 1); r <= Math.min(B.rows.length - 1, r0 + 1) && !hit; r++)
      for (let c = 0; c < rowLen(B, r); c++) {
        if (B.rows[r][c] === EMPTY) continue;
        const ex = cellX(B, r, c) - x, ey = cellY(B, r) - y;
        if (ex * ex + ey * ey < HIT * HIT) { hit = {r, c}; break; }
      }
  }
  if (!hit) return null;
  const spots = hit.r < 0 ? [...Array(rowLen(B, 0)).keys()].map(c => [0, c]) : nbrs(B, hit.r, hit.c);
  let best = null, bd = Infinity;
  for (const [r, c] of spots) {
    if (B.rows[r][c] !== EMPTY) continue;
    const d = (cellX(B, r, c) - x) ** 2 + (cellY(B, r) - y) ** 2;
    if (d < bd) { bd = d; best = [r, c]; }
  }
  if (!best) return null;
  path.push([cellX(B, best[0], best[1]), cellY(B, best[0])]);
  return {path, r: best[0], c: best[1], hitK: hit.r < 0 ? EMPTY : B.rows[hit.r][hit.c]};
}
// Catnip takes the kind of toy it bumps into, or else the commonest toy round about it.
function catnipKind(B, r, c, hitK, kinds) {
  if (isToy(hitK)) return hitK;
  const count = {};
  for (const [y, x] of nbrs(B, r, c)) { const k = B.rows[y][x]; if (isToy(k)) count[k] = (count[k] || 0) + 1; }
  if (!Object.keys(count).length) cellsOf(B).forEach(([, , k]) => { if (isToy(k)) count[k] = (count[k] || 0) + 1; });
  const ks = Object.keys(count);
  return ks.length ? +ks.sort((a, b) => count[b] - count[a])[0] : kinds[0];
}
// A batted bubble {k, sp} sticks at r, c. Pops what it should, then everything no longer hanging from
// the shelf or a cat-tree post falls. Changes B; returns what popped and what fell (each [r, c, kind]).
// Zoomies clear the row they stick in (except along the shelf, where bubbles hold on) and a bouncy bubble everything two bubbles round about (not
// posts); neither stays. A toy pops with every same toy it touches, if that's three or more, and
// yarn tangles touching what pops come apart too.
function land(B, r, c, shot, hitK, kinds) {
  const R = B.rows, out = {pop: [], fall: [], k: shot.k};
  const take = (y, x, list) => { if (R[y][x] !== EMPTY && R[y][x] !== PEG) { list.push([y, x, R[y][x]]); R[y][x] = EMPTY; } };
  if (shot.sp === ZOOM) for (let x = 0; x < rowLen(B, r); x++) { if (r || x === c) take(r, x, out.pop); }
  else if (shot.sp === BOUNCY) {
    let ring = [[r, c]]; const seen = new Set([r * COLS + c]);
    for (let d = 0; d < 2; d++) {
      const next = [];
      for (const [y, x] of ring) for (const [v, u] of nbrs(B, y, x)) if (!seen.has(v * COLS + u)) { seen.add(v * COLS + u); next.push([v, u]); }
      ring = next;
    }
    seen.forEach(i => take(Math.floor(i / COLS), i % COLS, out.pop));
  } else {
    const k = shot.sp === NIP ? catnipKind(B, r, c, hitK, kinds) : shot.k;
    out.k = k; R[r][c] = k;
    const group = [[r, c]], seen = new Set([r * COLS + c]);
    for (let i = 0; i < group.length; i++) for (const [y, x] of nbrs(B, ...group[i]))
      if (!seen.has(y * COLS + x) && R[y][x] === k) { seen.add(y * COLS + x); group.push([y, x]); }
    if (group.length >= 3) {
      const yarn = [];
      for (const [y, x] of group) for (const [v, u] of nbrs(B, y, x)) if (R[v][u] === YARN) yarn.push([v, u]);
      for (const [y, x] of group) take(y, x, out.pop);
      for (const [y, x] of yarn) take(y, x, out.pop);
    }
  }
  const held = new Set(), queue = [];
  cellsOf(B).forEach(([y, x, k]) => { if (y === 0 || k === PEG) { held.add(y * COLS + x); queue.push([y, x]); } });
  while (queue.length) {
    const [y, x] = queue.pop();
    for (const [v, u] of nbrs(B, y, x)) if (R[v][u] !== EMPTY && !held.has(v * COLS + u)) { held.add(v * COLS + u); queue.push([v, u]); }
  }
  cellsOf(B).forEach(([y, x]) => { if (!held.has(y * COLS + x)) take(y, x, out.fall); });
  return out;
}
// The cat only gets toys that are still up there (or any of the level's, once none are).
function dealKind(B, kinds, rnd = Math.random) {
  const on = [...new Set(cellsOf(B).map(x => x[2]).filter(isToy))], from = on.length ? on : kinds;
  return from[Math.floor(rnd() * from.length)];
}
// A new row of bubbles pushed in under the shelf (zen keeps going this way). Bubbles pushed past
// the bottom row are returned.
function pushRow(B, kinds, clump, rnd = Math.random) {
  B.rows.unshift(blankRow()); B.par ^= 1;
  for (let c = 0; c < rowLen(B, 0); c++) {
    const below = nbrs(B, 0, c).map(([y, x]) => B.rows[y][x]).filter(isToy);
    B.rows[0][c] = below.length && rnd() < clump ? below[Math.floor(rnd() * below.length)] : kinds[Math.floor(rnd() * kinds.length)];
  }
  const gone = B.rows.pop();
  return gone.filter(k => k !== EMPTY);
}

// Levels 1 to 20 take turns at three goals: clear every bubble, catch some toys, or free the kittens
// (bubbles with a kitten inside only come down by falling, or in a zoomies or bouncy burst). Later
// levels have more kinds of toy, more rows, yarn tangles (from 5) and cat-tree posts that hold up
// whatever hangs from them (from 10). The shelf comes down a row every EVERY[n] bats. A simulated player
// that knows where every bat lands, but aims a little off now and then, wins nearly every level up to 11 and
// 80–95% of levels 12 to 20 (a person, seeing only the first bounce, finds them harder).
const MAX_LEVEL = 20;
const EVERY = [9, 9, 9, 8, 8, 8, 8, 7, 7, 7, 7, 6, 6, 6, 6, 6, 5, 5, 5, 5];
function params(n) {
  const goal = ["clear", "catch", "kittens"][(n - 1) % 3];
  return {K: n <= 3 ? 4 : n <= 9 ? 5 : 6, rows: Math.min(8, 5 + Math.floor((n - 1) / 4)),
    clump: 0.4 - n * 0.012, goal, goals: n <= 5 ? 1 : n <= 11 ? 2 : 3, need: 99,
    kits: goal === "kittens" ? 2 + Math.floor(n / 7) : 0, yarn: n >= 5 ? 2 + Math.floor((n - 5) / 5) : 0, pegs: n >= 10 ? 2 : 0, every: EVERY[n - 1]};
}
const ZEN = {K: 5, rows: 6, clump: 0.35, goal: "zen", goals: 0, need: 0, kits: 0, yarn: 0, pegs: 0, every: 7};
function makeBoard(p, kinds, rnd = Math.random) {
  for (;;) {
    const B = {rows: Array.from({length: ROWS + 1}, blankRow), par: 0, drops: 0};
    for (let r = 0; r < p.rows; r++) for (let c = 0; c < rowLen(B, r); c++) {
      const near = nbrs(B, r, c).map(([y, x]) => B.rows[y][x]).filter(isToy);
      B.rows[r][c] = near.length && rnd() < p.clump ? near[Math.floor(rnd() * near.length)] : kinds[Math.floor(rnd() * kinds.length)];
    }
    // Posts go high up, kittens low down, and neither next to a kitten (a kitten hanging straight
    // from a post could never fall).
    const spots = (from, to) => { const s = []; for (let r = from; r <= to; r++) for (let c = 0; c < rowLen(B, r); c++) s.push([r, c]); return s.sort(() => rnd() - 0.5); };
    const nearKind = (r, c, ks) => nbrs(B, r, c).some(([y, x]) => ks.includes(B.rows[y][x]));
    let need = p.pegs;
    for (const [r, c] of spots(1, 2)) if (need && !nearKind(r, c, [PEG])) { B.rows[r][c] = PEG; need--; }
    need = p.kits;
    for (const [r, c] of spots(1, Math.max(1, p.rows - 3))) if (need && !nearKind(r, c, [PEG, KIT]) && isToy(B.rows[r][c])) { B.rows[r][c] = KIT; need--; }
    if (need) continue;
    need = p.yarn;
    for (const [r, c] of spots(1, p.rows - 1)) if (need && isToy(B.rows[r][c])) { B.rows[r][c] = YARN; need--; }
    const count = {}; cellsOf(B).forEach(([, , k]) => { count[k] = (count[k] || 0) + 1; });
    if (kinds.every(k => count[k] >= 3)) return B;
  }
}
// Ten kinds of toy, one per colour from the games' palette (the same as Pounce). Each level picks
// some kinds and one picture for each from the shared toy library in ../toys/.
const KINDS = [
  {c: "#BD5538", looks: [["wiffle-red", "red wiffle balls"], ["swirl-red", "red swirl balls"], ["crochet-stars", "star balls"], ["tinsel", "tinsel balls"]]},
  {c: "#ECA818", looks: [["wiffle-yellow", "yellow wiffle balls"]]},
  {c: "#73A7AE", looks: [["wiffle-teal", "teal wiffle balls"], ["fish", "fish"]]},
  {c: "#6AA673", looks: [["lattice", "lattice balls"]]},
  {c: "#B3B94B", looks: [["spiky-lime", "spiky pom-poms"]]},
  {c: "#B94588", looks: [["swirl-purple", "plum swirl balls"], ["bell-purple", "bell balls"]]},
  {c: "#7885BA", looks: [["spring", "springs"], ["rope-blue", "rope balls"]]},
  {c: "#825840", looks: [["cork-paw", "cork paw balls"], ["burlap-paws", "burlap balls"], ["rattan", "rattan balls"]]},
  {c: "#5E5866", looks: [["mouse", "mice"]]},
  {c: "#E16A4A", looks: [["felt-rainbow", "rainbow balls"], ["ribbon-tail", "ribbon balls"], ["spiky-rainbow", "spiky balls"]]},
];
// Catch levels ask for every one of their toys that's up there at the start.
// Level 0 is zen. `off` holds the toy pictures the player has left out; a colour with none left isn't dealt.
function makeLevel(n, rnd = Math.random, off = new Set()) {
  const p = n ? params(n) : ZEN;
  let all = KINDS.map((_, i) => i).filter(k => KINDS[k].looks.some(([f]) => !off.has(f)));
  if (all.length < p.K) all = KINDS.map((_, i) => i);
  for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
  const kinds = all.slice(0, p.K).sort((a, b) => a - b);
  const look = KINDS.map(k => { const ok = k.looks.map((_, j) => j).filter(j => !off.has(k.looks[j][0])), from = ok.length ? ok : k.looks.map((_, j) => j); return from[Math.floor(rnd() * from.length)]; });
  const B = makeBoard(p, kinds, rnd), count = {};
  cellsOf(B).forEach(([, , k]) => { count[k] = (count[k] || 0) + 1; });
  const goals = p.goal !== "catch" ? [] : kinds.slice().sort((a, b) => count[b] - count[a] || rnd() - 0.5).slice(0, p.goals)
    .map(k => ({k, need: Math.min(count[k], p.need), got: 0}));
  return {kinds, look, goal: p.goal, goals, kits: {need: p.goal === "kittens" ? p.kits : 0, got: 0}, every: p.every, clump: p.clump,
    B, queue: [{k: dealKind(B, kinds, rnd), sp: 0}, {k: dealKind(B, kinds, rnd), sp: 0}], since: 0, streak: 0,
    used: {}, helped: false, extra: 0, caught: 0, seed: Math.floor(rnd() * 1e6)};
}
// Is the level won? Kittens left on a kitten level that can't be won any more don't count: kittens only
// stop being on the board by coming down.
function won(d) {
  if (d.goal === "clear") return cellsOf(d.B).every(([, , k]) => k === PEG);
  if (d.goal === "catch") return d.goals.every(gl => gl.got >= gl.need);
  if (d.goal === "kittens") return d.kits.got >= d.kits.need;
  return false;
}
// Count what came down from one bat: toys towards the goals, kittens freed.
function tally(d, res) {
  for (const [, , k] of [...res.pop, ...res.fall]) {
    if (isToy(k)) { d.caught++; for (const gl of d.goals) if (gl.k === k && gl.got < gl.need) gl.got++; }
    if (k === KIT) d.kits.got++;
  }
}
// What happens after a bat besides the pops: a streak of three bats that pop makes the next bubble
// zoomies, six or more falling at once makes it bouncy, and every `every` bats the shelf comes down
// a row (in zen, a new row is pushed in). Returns what changed, for the page to show.
function afterBat(d, res, rnd = Math.random) {
  const B = d.B, ev = {};
  d.streak = res.pop.length ? d.streak + 1 : 0; d.since++;
  const q = d.queue; q.shift();
  if (res.fall.length >= 6) { q[0] = {k: -1, sp: BOUNCY}; ev.earned = BOUNCY; }
  else if (d.streak >= 3) { q[0] = {k: -1, sp: ZOOM}; ev.earned = ZOOM; d.streak = 0; }
  if (d.since >= d.every) {
    d.since = 0;
    if (d.goal === "zen") ev.pushed = pushRow(B, d.kinds, d.clump, rnd).length + 1;
    else { B.drops++; ev.lowered = true; }
  }
  if (d.goal === "zen") while (cellsOf(B).length < 16) { pushRow(B, d.kinds, d.clump, rnd); ev.pushed = (ev.pushed || 0) + 1; }
  // A bubble whose toy has all gone is swapped for one that's still there.
  const on = new Set(cellsOf(B).map(x => x[2]).filter(isToy));
  for (const s of q) if (!s.sp && on.size && !on.has(s.k)) s.k = dealKind(B, d.kinds, rnd);
  while (q.length < 2) q.push({k: dealKind(B, d.kinds, rnd), sp: 0});
  return ev;
}
// For the simulated player and the Shake helper: the spots reachable from the cat (each with an
// angle that gets there), and how good batting a bubble there would be.
function reach(B) {
  const spots = new Map();
  for (let a = 0.16; a < Math.PI - 0.16; a += 0.01) {
    const f = flight(B, a); if (!f) continue;
    const key = f.r * COLS + f.c, s = spots.get(key);
    if (s) s.angs.push(a); else spots.set(key, {r: f.r, c: f.c, hitK: f.hitK, angs: [a]});
  }
  return [...spots.values()];
}
function score(d, spot, shot) {
  const B = cloneB(d.B), res = land(B, spot.r, spot.c, shot, spot.hitK, d.kinds);
  let s = res.pop.length + res.fall.length * 1.5 - spot.r * 0.05;
  for (const [, , k] of [...res.pop, ...res.fall]) {
    if (k === KIT) s += 12;
    if (d.goals.some(gl => gl.k === k && gl.got < gl.need)) s += 1.5;
  }
  if (!res.pop.length) {
    s += nbrs(B, spot.r, spot.c).filter(([y, x]) => B.rows[y][x] === res.k).length * 0.7;
    if (spot.r + B.drops + (d.since + 1 >= d.every ? 1 : 0) >= ROWS - 1) s -= 50;
  }
  return s;
}

/* ---------- pictures ---------- */
const TOY_SRC = {};  // filled with embedded pictures when the page is bundled into one file
const CAT_SRC = {};  // the same for the cat pictures
const toyImgs = {}, catImgs = {};
const catSrc = f => CAT_SRC[f] || `../cats/${f}.webp`;
const toySrc = f => TOY_SRC[f] || `../toys/${f}.webp?v=${window.SITE_BUILD || ""}`;  // a new version gets new pictures

  let walked = 0, gap = (now * 2) % 0.5;
  for (let i = 1; i < pts.length; i++) {
    const [ax, ay] = pts[i - 1], [bx, by] = pts[i], seg = Math.hypot(bx - ax, by - ay);
    for (let t = gap; t < seg; t += 0.5) {
      if (walked + t > limit || (i === pts.length - 1 && seg - t < 0.4)) break;
      circle(ctx, (ax + (bx - ax) * t / seg) * U, (ay + (by - ay) * t / seg) * U, 3.2); ctx.fill();
    }
    walked += seg; gap = (gap - seg % 0.5 + 0.5) % 0.5;
    if (walked > limit) break;
  }
  if (full) { const s = S.d.queue[0]; drawBubble(s.k, s.sp, pts[pts.length - 1][0], pts[pts.length - 1][1], {alpha: 0.4}); }
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (bg) ctx.drawImage(bg, 0, 0);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (!S) return;
  const d = S.d, B = d.B;
  const u = Math.min(1, Math.max(0, (now - shelfT0) / 0.4)), drops = shelfFrom + (B.drops - shelfFrom) * ease(u);
  shelf = u >= 1 ? B.drops : drops;
  if (!S.over && !busy && !fly && !intro) drawAim();
  B.rows.forEach((row, r) => row.forEach((k, c) => {
    if (k === EMPTY) return;
    const w = wob.get(r * COLS + c); let sq = 0;
    if (w) { const t = now - w.t0; if (t > 1.2) wob.delete(r * COLS + c); else if (t > 0) sq = w.amp * Math.sin(t * 22) * Math.exp(-t * 4.5); }
    drawBubble(k, 0, cellX(B, r, c), cellY(B, r, drops), {sq, cat: k === KIT && kitten(r, c)});
  }));
  drawShelf(drops);
  drawCat();
  // the bubble wand with the bubble about to go, and the next one waiting
  const q = d.queue;
  // The ring stays put with the bubble in it; the wand's handle swings round behind it as you aim.
  const wx = SX, wy = SY, ax = Math.cos(aim), ay = -Math.sin(aim);
  ctx.strokeStyle = "#B94588"; ctx.lineCap = "round";
  ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo((wx - ax * 0.56) * U, (wy - ay * 0.56) * U); ctx.lineTo((wx - ax * 1.1) * U, (wy - ay * 1.1) * U); ctx.stroke();
  if (!fly && q[0]) drawBubble(q[0].k, q[0].sp, wx, wy, {sq: 0.03 * Math.sin(now * 3)});
  ctx.lineWidth = 4; circle(ctx, wx * U, wy * U, 0.56 * U); ctx.stroke(); ctx.lineCap = "butt";
  if (q[1]) {
    drawBubble(q[1].k, q[1].sp, 1.25, SY + 0.2, {size: 0.72});
    ctx.font = "600 14px 'Baloo 2', system-ui, sans-serif"; ctx.fillStyle = "#5E5866"; ctx.textAlign = "center";
    ctx.fillText("next", 1.25 * U, (SY - 0.32) * U);
    ctx.fillText("⇄", 2.05 * U, (SY + 0.32) * U);
  }
  if (!batted && !fly && !intro) {   // until the first bat, say how
    ctx.font = "600 17px 'Baloo 2', system-ui, sans-serif"; ctx.fillStyle = "#2A2530"; ctx.textAlign = "center";
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(now * 3);
    ctx.fillText("Point where it should go, let go to bat", COLS / 2 * U, (LINE - 0.35) * U); ctx.globalAlpha = 1;
  }
  if (fly) {
    let dist = (now - fly.t0) * SPEED, p = fly.path, i = 1;
    for (; i < p.length - 1; i++) { const seg = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); if (dist <= seg) break; dist -= seg; }
    const [ax, ay] = p[i - 1], [bx, by] = p[Math.min(i, p.length - 1)], seg = Math.hypot(bx - ax, by - ay) || 1, t = Math.min(1, dist / seg);
    drawBubble(fly.shot.k, fly.shot.sp, ax + (bx - ax) * t, ay + (by - ay) * t);
  }
  effects = effects.filter(e => now < e.t0 + e.dur);
  for (const e of effects) {
    if (now < e.t0) { if (e.type === "pop" || e.type === "fall") drawBubble(e.k, 0, e.x, e.y, {cat: e.kit}); continue; }
    const t = now - e.t0, u = t / e.dur;
    if (e.type === "pop") {   // the bubble swells and bursts into droplets
      if (u < 0.35) drawBubble(e.k, 0, e.x, e.y, {size: 1 + u * 0.7, alpha: 1 - u * 2, cat: e.kit});
      const col = isToy(e.k) ? KINDS[e.k].c : e.k === YARN ? "#B9667A" : "#DD9DAD";
      ctx.fillStyle = col; ctx.globalAlpha = Math.max(0, 1 - u);
      for (let i = 0; i < 7; i++) { const a = i * 2 * PI / 7 + e.x; circle(ctx, (e.x + Math.cos(a) * (0.3 + u * 0.6)) * U, (e.y + Math.sin(a) * (0.3 + u * 0.6)) * U, 3); ctx.fill(); }
      ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 2; circle(ctx, e.x * U, e.y * U, (0.45 + u * 0.4) * U); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (e.type === "fall") {   // drops to the floor; a kitten's bubble pops there and the kitten's free
      const x = e.x + e.vx * t, y = e.y + e.vy * t + 14 * t * t;
      if (e.kit && y >= SY - 0.2) {
        if (!e.done) { e.done = true; effects.push({type: "pop", k: KIT, x, y, t0: now, dur: 0.3}, {type: "freed", cat: e.kit, x, y, t0: now, dur: 1.3}); }
        continue;
      }
      if (y < HT + 1) drawBubble(e.k, 0, x, y, {cat: e.kit, size: y > LINE ? Math.max(0.3, 1 - (y - LINE) * 0.4) : 1});
    } else if (e.type === "freed") {   // a freed kitten floats up with a heart
      const y = e.y - ease(u) * 1.6, img = catImgs[e.cat];
      ctx.globalAlpha = u > 0.6 ? (1 - u) / 0.4 : 1;
      if (img) ctx.drawImage(img, (e.x - 0.45) * U, (y - 0.45) * U, 0.9 * U, 0.9 * U);
      ctx.font = "24px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText("💗", (e.x + 0.45) * U, (y - 0.4) * U);
      ctx.globalAlpha = 1;
    } else if (e.type === ZOOM) {
      const w = U * (0.3 + 0.7 * Math.sin(u * PI));
      ctx.fillStyle = `rgba(255,236,160,${1 - u})`; ctx.fillRect(0, e.y * U - w / 2, COLS * U, w);
    } else if (e.type === BOUNCY) {
      ctx.strokeStyle = `rgba(232,160,19,${1 - u})`; ctx.lineWidth = 8 * (1 - u) + 1; circle(ctx, e.x * U, e.y * U, U * (0.4 + 1.9 * ease(u))); ctx.stroke();
    }
  }
  if (intro) drawIntro();
  for (const e of effects) if (e.type === "cheer" && now >= e.t0) {
    const u = (now - e.t0) / e.dur, sz = 44 * (u < 0.15 ? 0.6 + u / 0.15 * 0.4 : 1), y = (LINE * 0.55 - u * 0.6) * U;
    ctx.save(); ctx.globalAlpha = u > 0.7 ? (1 - u) / 0.3 : 1; ctx.font = `800 ${sz}px 'Baloo 2', system-ui, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    ctx.strokeStyle = "#2A2530"; ctx.lineWidth = 8; ctx.strokeText(e.text, COLS * U / 2, y);
    ctx.fillStyle = "#FFF4D2"; ctx.fillText(e.text, COLS * U / 2, y); ctx.restore();
  }
}
function resize() {
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (!r.width) return;
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  scale = canvas.width / (COLS * U);
  buildBg();
}
new ResizeObserver(resize).observe(canvas);

let last = performance.now();
function loop(t) {
  now += Math.min(0.05, (t - last) / 1000); last = t;
  draw();
  requestAnimationFrame(loop);
}

/* ---------- first-time spotlights ---------- */
// The first time something new turns up on this device (kittens to free, yarn tangles, cat-tree
// posts), everything else dims, the new things glow and the board names what to do. A tap (or
// Space) puts it away; if a level brings two new things, the next one follows. Each is shown once.
const SEEN = "catdoku.bubbles.seen.v1";
const SPOTLIGHTS = [
  {key: "kittens", kind: KIT, title: "Free the Kittens!", when: d => d.goal === "kittens"},
  {key: "yarn", kind: YARN, title: "Watch out for yarn!", when: d => cellsOf(d.B).some(([, , k]) => k === YARN)},
  {key: "posts", kind: PEG, title: "Watch out for posts!", when: d => cellsOf(d.B).some(([, , k]) => k === PEG)},
];
function nextIntro() {
  const seen = G.load(SEEN), sp = S && SPOTLIGHTS.find(x => !seen[x.key] && x.when(S.d));
  return sp ? {...sp, t0: now} : null;
}
function endIntro() {
  const seen = G.load(SEEN); seen[intro.key] = true; G.save(SEEN, seen);
  intro = nextIntro();
  if (!intro) effects.push({type: "cheer", text: "Let's Play!", t0: now, dur: 1.3});
}
function drawIntro() {
  const B = S.d.B, u = Math.min(1, (now - intro.t0) / 0.4), mid = COLS / 2 * U;
  ctx.fillStyle = `rgba(42,37,48,${0.62 * u})`; ctx.fillRect(0, 0, COLS * U, HT * U);
  B.rows.forEach((row, r) => row.forEach((k, c) => {
    if (k !== intro.kind) return;
    const x = cellX(B, r, c), y = cellY(B, r), p = 0.5 + 0.5 * Math.sin(now * 4);
    ctx.fillStyle = `rgba(255,236,160,${(0.35 + 0.25 * p) * u})`; circle(ctx, x * U, y * U, (0.62 + 0.06 * p) * U); ctx.fill();
    drawBubble(k, 0, x, y, {cat: k === KIT && kitten(r, c)});
  }));
  ctx.save(); ctx.globalAlpha = u; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  const low = Math.max(...cellsOf(B).map(([r]) => cellY(B, r))), y = ((low + 0.5 + LINE) / 2 - 0.4) * U;   // in the open space under the bubbles
  let fs = 44; do ctx.font = `800 ${fs}px 'Baloo 2', system-ui, sans-serif`; while (ctx.measureText(intro.title).width > COLS * U - 36 && --fs > 20);
  ctx.strokeStyle = "#2A2530"; ctx.lineWidth = 8;
  ctx.strokeText(intro.title, mid, y); ctx.fillStyle = "#FFF4D2"; ctx.fillText(intro.title, mid, y);
  ctx.globalAlpha = u * (0.6 + 0.4 * Math.sin(now * 3)); ctx.font = "600 16px 'Baloo 2', system-ui, sans-serif";
  ctx.fillText("Tap to go on", mid, y + 46);
  ctx.restore();
}

/* ---------- input ---------- */
// Like Snood: the wand turns to face wherever you point (the mouse, or a finger anywhere on the
// board, dragged to fine-tune) and letting go bats the bubble that way. Letting go on the floor
// below the wand doesn't bat, so a drag can be called off there. Tap the next bubble to swap.
const MIN_AIM = 0.14;   // the shallowest angle
const toUnits = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * COLS, (e.clientY - r.top) / r.width * COLS]; };
function aimAt(x, y) { if (y < SY - 0.2) aim = Math.min(PI - MIN_AIM, Math.max(MIN_AIM, Math.atan2(SY - y, x - SX))); }
const onNext = (x, y) => Math.hypot(x - 1.25, y - SY - 0.1) < 0.75;
function swap() {
  if (!S || S.over || busy || fly) return;
  const q = S.d.queue; [q[0], q[1]] = [q[1], q[0]]; save();
}
canvas.addEventListener("pointerdown", e => {
  if (!S || S.over) return;
  e.preventDefault();
  if (intro) return endIntro();
  const [x, y] = toUnits(e);
  if (onNext(x, y)) return swap();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  aiming = true; aimAt(x, y);
});
canvas.addEventListener("pointermove", e => {
  if (!S || S.over || (!aiming && e.pointerType !== "mouse")) return;
  aimAt(...toUnits(e));
});
canvas.addEventListener("pointerup", e => {
  if (!aiming) return;
  aiming = false;
  const [x, y] = toUnits(e);
  if (y < SY - 0.2) { aimAt(x, y); batted = true; bat(); }
});
canvas.addEventListener("pointercancel", () => { aiming = false; });
canvas.addEventListener("keydown", e => {
  if (!S || S.over) return;
  if (intro) { if (e.key === " " || e.key === "Enter" || e.key === "Escape") { e.preventDefault(); endIntro(); } return; }
  const step = e.shiftKey ? 0.005 : 0.03;
  if (e.key === "ArrowLeft") { e.preventDefault(); aim = Math.min(PI - MIN_AIM, aim + step); }
  else if (e.key === "ArrowRight") { e.preventDefault(); aim = Math.max(MIN_AIM, aim - step); }
  else if (e.key === " " || e.key === "Enter" || e.key === "ArrowUp") { e.preventDefault(); batted = true; bat(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); swap(); }
});

/* ---------- how to play ---------- */
function helpCard() {
  const media = document.createElement("div"), ol = document.createElement("ol"); ol.className = "steps";
  for (const t of ["Point where you want the bubble to go (drag to fine-tune) and the wand turns to face it. The dotted line shows the way. Let go to bat it up; it bounces off the sides.",
                   "When three or more bubbles with the same toy touch, they pop. Anything left hanging falls.",
                   "Each level asks you to pop every bubble, catch some toys, or free the kittens: kittens come down when nothing holds them up.",
                   "Every few bats the shelf comes down a row. Don't let the bubbles reach the cat!",
                   "Pop on three bats in a row for a bubble with the zoomies (it clears its row). Drop six at once for a bouncy one (it pops everything round about)."]) {
    const li = document.createElement("li"); li.textContent = t; ol.append(li);
  }
  const tip = document.createElement("p"); tip.className = "tip";
  tip.textContent = "To call off a shot, drag down onto the floor before letting go. Tap the next bubble to swap it in. Yarn tangles come apart when something next to them pops; cat-tree posts never come down. Arrow keys aim, Space bats.";
  media.append(ol, tip);
  // On a level with kittens, yarn or posts, their spotlights can be shown again.
  const again = S && !S.over ? SPOTLIGHTS.filter(x => x.when(S.d)) : [];
  // "Show me on the board" comes first when this level has something to show
  const btns = again.length ? [["Show me on the board", () => {
    G.closeCard(); const seen = G.load(SEEN); for (const x of again) delete seen[x.key]; G.save(SEEN, seen); intro = nextIntro();
  }, true], ["Got it", G.closeCard]] : [["Got it", G.closeCard, true]];
  G.openCard("How to play", "", btns, media);
}
$("helpBtn").onclick = helpCard;

/* ---------- choosing toys ---------- */
const toyChest = () => ({kinds: KINDS, off: offToys, min: MIN_COLOURS, src: toySrc, save: off => {
  offToys = off; G.saveToys(off);
  if (S && !S.over && S.d.kinds.some(k => off.has(lookOf(k)[0]))) { newBoard(); G.note("Here's a new board with your toys.", 4000); }
  else G.note("Saved. Your toys are used from the next board.", 4000);
}});
$("toysBtn").onclick = () => G.toyPicker(toyChest());
G.needToys({...toyChest(), off: () => offToys, game: "Bubbles"});
G.setupTimer({name: "bubbles", game: () => S, playing: g => !g.over && !intro, save,
  label: n => `Level ${n}`, noun: "level",
  emptyText: "Finish a level and your times will show up here. They're kept on this device only."});
$("bestBtn").onclick = () => G.showBests("Best times", S && S.level ? S.level : climb);

const saved = G.load(STORE), first = saved.level ?? 1;
climb = saved.climb || saved.level || 1;
G.reopen(() => { if (saved.d && first <= MAX_LEVEL) start(first, saved.d); else startLevel(first); },
  why => { startLevel(first); G.note(why, 0); });
if (saved.level === undefined) helpCard();
requestAnimationFrame(loop);
</script>
