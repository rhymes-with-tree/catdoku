  var BUILD = "2026-10-31.13"; window.SITE_BUILD = BUILD;
  fetch("../version.txt?t=" + Date.now(), {cache: "no-store"}).then(function (r) { return r.ok ? r.text() : ""; }).then(function (v) {
    v = v.trim(); var tried = null;
    try { tried = sessionStorage.getItem("catdoku.reloadedFor"); } catch (e) {}
    if (v && v !== BUILD && tried !== v) { try { sessionStorage.setItem("catdoku.reloadedFor", v); } catch (e) {} location.reload(); }

<style>
/* A cat has walked across the keyboard and broken it. Only seven keys still work. Make words with them, always
   using the gold one. */
/* the rank in one short line: its name, the dots, the points */
.rank{display:flex;align-items:center;gap:10px;font-weight:600}
.rankrow{display:contents}
.rankrow b{font-size:18px;order:0}
.rankrow span{order:2;font-size:15px;color:var(--ink-soft);white-space:nowrap}
.dots{order:1;flex:1;position:relative;height:16px;display:flex;justify-content:space-between;align-items:center}
.dots::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:var(--line)}
.dots i{position:relative;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--ink-soft)}
.dots i.on{background:#ECA818;border-color:#2A2530}
.entry{width:var(--board);min-height:46px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.entry .c{color:#C9773F}
.entry .caret{display:inline-block;width:3px;height:34px;background:var(--ink);margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.entry.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.keyboard{--per:10;--gap:5px;width:var(--board);background:#3B3646;border-radius:16px;padding:10px 6px 8px;display:flex;flex-direction:column;gap:6px;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.krow{display:flex;justify-content:center;gap:var(--gap)}
/* --per keys fit across a row: 10 on the whole keyboard, fewer (so bigger keys) once the cat has knocked the rest off */
.key{position:relative;flex:0 0 calc((100% - (var(--per) - 1) * var(--gap)) / var(--per));aspect-ratio:.9;border-radius:8px;border:none;padding:0;background:#F7F1E4;color:#2A2530;font-size:20px;font-weight:800;text-transform:uppercase;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);cursor:default}
.key.works{cursor:pointer}
/* a key the cat knocks off: it tumbles forward off the front of the keyboard */
.key.knocked{animation:knock .5s cubic-bezier(.4,0,.9,.5) forwards;pointer-events:none}
@keyframes knock{to{transform:translate(var(--dx),var(--dy)) rotate(var(--spin));opacity:0}}
/* the seven keys left, closed up into two full rows, wider than tall, with no dark gaps where the others were */
.keyboard.compact{--gap:8px;gap:8px;padding:8px}
.keyboard.compact .key{border-radius:12px;font-size:clamp(22px,7vw,34px);flex:1 1 0;aspect-ratio:auto;height:clamp(52px,16vw,76px)}
.key{isolation:isolate}
.key.centre{background:#ECA818;color:#2A2530}
.keyboard{position:relative}
.catlayer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:6;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.key.works:active,.key.down{transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.3)}
.krow.ctl{gap:var(--gap)}
.ctlkey{flex:1 1 0;height:42px;border-radius:10px;border:none;background:#8D78AD;color:#fff;font-size:16px;font-weight:800;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);cursor:pointer}
.ctlkey.enter{background:#6AA673}
/* What matters is the keys, the word being typed and the word list (with the hints, which work on the list), so
   everything else is kept small. On a phone: the rank, the word, the keys, then the list and the few buttons. */
.play{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.typing{display:contents}
.status:has(> .msg:empty){display:none}
/* on a big screen the word list gets the room: the keys on the left, the list beside them, its words in as many
   columns as fit */
@media (min-width:980px){
  main{max-width:1500px}
  .play{display:grid;grid-template-columns:min(400px,28vw) minmax(0,1fr);grid-template-rows:repeat(4,auto) 1fr;column-gap:36px;row-gap:12px;align-items:start}
  .play>*,.typing>*{grid-column:1;--board:min(400px,28vw)}
  .play>.side{grid-column:2;grid-row:1/span 5;width:100%;min-height:max(100%,calc(100vh - 150px));position:sticky;top:12px}
  .side .words{columns:auto;column-width:150px;font-size:22px}
  .side .words li{line-height:1.5}
}
/* On a phone held sideways: the whole game on one screen. The title, the word, the keys and the few buttons on the
   left; the word list, with the rank and its hints, filling the right and scrolling by itself. */
@media (orientation:landscape) and (max-height:500px){
  html,body{height:100%;overflow:hidden}
  main{--high:calc(100vh - 12px);height:100vh;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,44fr) minmax(0,56fr);
    grid-template-rows:auto minmax(0,1fr) auto;align-items:start;gap:0 14px;max-width:none;
    padding:6px max(12px,env(safe-area-inset-right)) 6px max(12px,env(safe-area-inset-left))}
  @supports (height:100svh){main{--high:calc(100svh - 12px);height:100svh}}
  main > header,main > header.withTools{grid-column:1;grid-row:1;width:100%;grid-template-columns:62px minmax(0,1fr) 62px}
  main > header h1{font-size:24px}
  main > header .stripe{height:4px;margin-top:3px}
  .play{display:contents}
  .play > .typing{grid-column:1;grid-row:2;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;min-height:0;--board:100%}
  .play > .status{grid-column:1;grid-row:2;align-self:end;z-index:5}
  .play > .side{grid-column:2;grid-row:1 / span 3;align-self:stretch;--board:100%;min-height:0;
    border-radius:22px;padding:10px 14px 0;overflow:auto}
  .play > .actions{grid-column:1;grid-row:3;justify-self:center;width:auto}
  main .play > .actions > button.tool{padding:2px 6px;min-width:0}
  main .play > .actions > button.tool .lbl{font-size:11px}
  main .play > .actions > button.tool .ic{width:22px;height:22px}
  #games,.help{display:none}
  .entry{min-height:34px;font-size:26px}
  .entry .caret{height:26px}
  /* the keys as big as fit the height that's left, and no wider than the column */
  .keyboard{flex:1 1 0;min-height:0;width:min(100%,calc((var(--high) - 140px) * 1.9))}
  .keyboard.compact .key{height:auto;font-size:clamp(20px,6vh,30px)}
  .keyboard.compact .krow:not(.ctl){flex:1 1 0}
  .ctlkey{white-space:nowrap;font-size:15px;height:36px}
  .side .words{columns:auto;column-width:110px;font-size:18px}
  .side .words li{line-height:1.55}
  /* the clues and starts small, to keep the room for the words */
  .side .sidetop{font-size:14px;margin-bottom:6px;gap:0 12px}
  .side .rankrow b{font-size:15px}
  .play > .side > .hintbtns > button.tool{min-width:0;padding:2px 6px}
  .play > .side > .hintbtns .lbl{font-size:11px}
  .play > .side > .hintbtns{flex-wrap:nowrap}
  .play > .side > .hintbtns .ic{width:22px;height:22px}
  .side .legend{font-size:13px;padding:2px 8px;margin-bottom:6px}
  .side .legend b{font-size:11px}
  .tapclue{display:none}
}
.choose{display:flex;flex-direction:column;gap:10px;margin:0 0 16px;text-align:left}
.choose label{display:flex;flex-direction:column;gap:4px;font-weight:600}
.choose input{font:inherit;font-size:24px;font-weight:800;letter-spacing:4px;text-transform:uppercase;padding:6px 10px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink)}
.choose input#chooseGold{width:3.2ch;text-align:center;background:#ECA818;color:#2A2530}
.choose .err{margin:0;color:#B4473A;font-size:15px;min-height:1.4em}
.reveal{grid-column:1/-1;justify-self:center;background:none;border:none;padding:2px 6px;font-size:15px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}
.side{width:var(--board);background:var(--panel);border:2px solid var(--ink);border-radius:clamp(22px,6vw,48px);padding:clamp(12px,2.4vw,26px) clamp(14px,3vw,32px);
  display:flex;flex-direction:column}
/* the top of the list: how many found, in a few words, and the hints, small, that work on the list below them */
/* the top of the list: words found, the rank, Full Pounces; where it's narrow, the rank goes on a line of its own */
.sidetop{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 16px;font-weight:600;font-size:16px;margin:0 0 10px}
.sidetop .rank{order:3;flex:1 0 100%}
@media (min-width:980px){.sidetop .rank{order:0;flex:1 1 0;max-width:520px;min-width:260px}}
.sidetop b{font-size:1.15em;font-weight:800}
/* the hints, which work on the list, in its bottom corner; kept in sight while the list runs on */
.side > .hintbtns{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:0;margin:auto 0 0;padding-top:6px;width:100%;
  position:sticky;bottom:0;background:linear-gradient(transparent,var(--panel) 10px)}
.side > .hintbtns .lbl{font-size:12px}
.words{list-style:none;margin:0;padding:0;columns:2;column-gap:24px;font-size:clamp(19px,2.2vw,26px);font-weight:700}
.words li{break-inside:avoid;line-height:1.75;text-transform:capitalize;white-space:nowrap}
.words li.blank{text-transform:uppercase;color:#5A5266}
/* with Starts on: a heading for each pair of first letters, saying how many words left start with it */
.words li.starthead{display:flex;align-items:baseline;gap:8px;break-after:avoid;break-inside:avoid;margin-top:.35em;line-height:1.3;
  font-size:.62em;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--line)}
.words li.starthead:first-child{margin-top:0}
.words li.starthead span{color:var(--ink);font-size:1.15em}
.words li.starthead b{font-weight:700;letter-spacing:0;text-transform:none;color:#C9773F}
.words li.starthead b.done{color:#6AA673}
.words .plus,.legend .plus{font-size:.62em;font-weight:800;color:#2A2530;background:#F6C78E;border-radius:6px;padding:0 4px;vertical-align:.2em}
.words li.blank button{all:unset;cursor:pointer;border-radius:6px;padding:0 4px;margin-left:-4px}
.words li.blank button:hover,.words li.blank button:focus-visible{background:#EDE6F7;outline:none}
.words li.blank small{font-size:.72em;font-weight:600;margin-left:2px}
.wordclue{margin:0 0 16px;text-align:left}
.wordclue .pos{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin:0 0 4px}
.wordclue p{margin:0 0 8px;color:var(--ink)}
.wordclue .from{font-size:20px;font-weight:700}
.wordclue .parts{margin:0 0 8px;padding-left:20px}
.wordclue .note{font-size:14px;color:var(--ink-soft)}
.wordclue .note summary{cursor:pointer}
.wordclue .note p{color:var(--ink-soft);margin-top:4px}
.wordclue:empty{display:none}
.card .source{margin:12px 0 0;font-size:13px;color:var(--ink-soft)}
.wordclue .hide{background:#2A2530;color:#2A2530;border-radius:3px;padding:0 .2em}
.smashes{color:#C9773F}
.words .perfect::after{content:"★";color:#ECA818;font-size:.7em;margin-left:3px;vertical-align:.25em}
.legend{list-style:none;margin:0 auto 12px;padding:6px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font-size:15px;color:var(--ink);border:1px dashed var(--line);border-radius:10px;width:fit-content;max-width:100%}
.legend:empty{display:none}
.legend b{font-weight:700;color:var(--ink);text-transform:uppercase;font-size:13px}
.legend mark{background:#FBE38A;color:inherit;border-radius:3px;padding:0 2px}
.legend .more{background:#F6C78E;border-radius:4px;padding:0 3px}
.legend .ana{box-shadow:inset 0 -.45em 0 #D5C6F2}
.legend .missed{color:#B4473A;font-style:italic}
.legend .star{color:#ECA818}
.tapclue{margin:-4px 0 10px;text-align:center;font-size:14px;color:var(--ink-soft)}
.none{margin:0;column-span:all;text-align:center;color:var(--ink-soft);font-size:17px;font-weight:500}
.words .smash{color:#C9773F}
.words .rare{color:var(--ink-soft);font-style:italic}
.words a{color:inherit;text-decoration:none}
.words a:hover{text-decoration:underline;text-decoration-thickness:2px}
/* words you didn't find, once revealed */
.words .missed{color:#B4473A;font-weight:500;font-style:italic}
/* highlights: an ending more words share (yellow), a word that starts a longer one (orange), a word whose letters
   make another (violet) */
.words mark{background:#FBE38A;color:inherit;border-radius:3px;padding:0 1px}
.words .more{background:#F6C78E;border-radius:4px;padding:0 3px}
.words .ana{box-shadow:inset 0 -.45em 0 #D5C6F2;border-radius:2px}
.words .more.ana{background:linear-gradient(#F6C78E 55%,#D5C6F2 55%);box-shadow:none}
.words .new{animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(1.4)}}
.toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 16px;border-radius:999px;font-weight:700;z-index:5;pointer-events:none;animation:toast 1.4s ease-out forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,6px)}12%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.which{font-size:14px}
@media (prefers-reduced-motion:reduce){.entry .caret{animation:none}}
</style>

<body>
<main>
  <header><h1>Keyboard Cat</h1><div class="stripe"></div><p class="tagline which" id="which"></p></header>
  <nav class="games" id="games" aria-label="Games"></nav>

  <div class="play">
  <div class="typing">
  <div class="entry" id="entry" aria-live="polite"></div>
  <div class="keyboard" id="board" aria-label="Keyboard"></div>
  </div>
  <div class="status"><button class="timer" id="timer" hidden></button><span class="msg" id="msg" aria-live="polite"></span></div>
  <section class="side" aria-label="Your words">
    <div class="sidetop"><span id="foundSum">0 words</span>
      <div class="rank"><div class="rankrow"><b id="rankName">Kitten</b><span id="score"></span></div><div class="dots" id="dots"></div></div>
      <span class="smashes" id="smashes"></span></div>
    <ul class="legend" id="legend"></ul>
    <p class="tapclue" id="tapClue" hidden>Tap a blank for a clue.</p>
    <ul class="words" id="words"></ul>
    <div class="hintbtns tools" id="hintbar"></div>
  </section>
  <div class="actions">
    <button id="linkBtn">Share</button>
    <button id="helpBtn">How to play</button>
    <button id="chooseBtn" data-icon="keyboard">Choose keys</button>
    <button id="newBtn" data-icon="plus" data-label="New">New keyboard</button>
  </div>
  </div>
  <div class="overlay" id="overlay"><div class="card" id="card"></div></div>
  <p class="help">Words from <a href="https://wordlist.aspell.net/">SCOWL</a>, © Kevin Atkinson, and ENABLE.</p>
</main>

<script src="../games.js?v=2026-10-31.13"></script>
<script src="../walkcat.js?v=2026-10-31.13"></script>
<script>
const WORDS_INLINE = null;  // the word list, filled in when the page is bundled into one file

/* ---------- words ---------- */
// words.json: common (the answers), extra (rarer words that count too) and puzzles (every playable keyboard as
// 8 letters: the 7 keys, then the gold one every word needs). See tools/make-words.py.
let W = null, COMMON = null, EXTRA = null;
const lettersOf = w => [...new Set(w)].sort().join("");
const points = w => (w.length === 4 ? 1 : w.length) + (lettersOf(w).length === 7 ? 7 : 0);
function answersFor(keys, centre) {
  const ok = w => w.includes(centre) && [...w].every(ch => keys.includes(ch));
  return {answers: W.common.filter(ok), extra: W.extra.filter(ok)};
}
// Ranks, as a share of the points every common answer is worth; the Cat's Meow means every common answer (and
// the Cat's Pyjamas, every common answer without a hint). Reaching Genius Cat wins the keyboard, with a gold paw.
const RANKS = [["Kitten", 0], ["Curious", .02], ["Playful", .05], ["Pouncer", .1], ["Mouser", .2], ["Prowler", .3], ["Clever Cat", .45], ["Genius Cat", .7], ["The Cat's Meow", 1]];
const PYJAMAS = "The Cat's Pyjamas", GENIUS = RANKS.findIndex(([r]) => r === "Genius Cat");

/* ---------- game ---------- */
// game: {id (index into puzzles), daily (the day number, or null), keys, centre, found (words), revealed, won,
//   hinted (a hint was used before winning),
//   hints: which hints are on, {left, pairs, marks}}
const STORE = "catdoku.keyboardcat.v1", ROWS = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];
const $ = G.$;
let state = G.load(STORE);
let saved = Object.assign({seenHelp: false, games: {}}, state);
let game = null, typed = "", answers = [], extras = [], max = 0;
const save = () => { if (game) saved.games[game.id] = {found: game.found, revealed: game.revealed, won: game.won, hinted: game.hinted, hints: game.hints, t: Date.now()}; prune(); G.save(STORE, saved); };
// keep the last 40 keyboards played
function prune() { const ids = Object.keys(saved.games).sort((a, b) => (saved.games[a].t || 0) - (saved.games[b].t || 0)); for (const id of ids.slice(0, Math.max(0, ids.length - 40))) delete saved.games[id]; }
// Today's keyboard: the same for everyone on the same date, picked from the list in a scattered order.
const dayNumber = () => { const d = new Date(); return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2026, 0, 1)) / 864e5); };
const dailyId = day => ((day * 7919 + 1234) % W.puzzles.length + W.puzzles.length) % W.puzzles.length;

// A keyboard's id is its place in the list, or, for keys you chose yourself that aren't in it, "c:" and its 8 letters.
const lettersFor = id => typeof id === "string" ? id.slice(2) : W.puzzles[id];
function openKeyboard(id, daily) {
  const p = lettersFor(id), keys = p.slice(0, 7), centre = p[7], was = saved.games[id] || {};
  game = {id, daily, keys, centre, found: was.found || [], revealed: !!was.revealed, won: !!was.won, hinted: !!was.hinted, hints: Object.assign({}, was.hints)};
  ({answers, extra: extras} = answersFor(keys, centre));
  COMMON = new Set(answers); EXTRA = new Set(extras);
  max = answers.reduce((s, w) => s + points(w), 0);
  typed = ""; drawKeys(); draw(); save();
  placeCat({done: () => helpOnFirstVisit()});
}
const score = () => game.found.reduce((s, w) => s + points(w), 0);
const commonFound = () => game.found.filter(w => COMMON.has(w)).length;
function rankAt(s) { let r = 0; RANKS.forEach(([, f], i) => { if (s >= Math.ceil(f * max) && (i < RANKS.length - 1 || commonFound() === answers.length)) r = i; }); return r; }

// The whole keyboard (while the cat crosses it), or, once it's knocked the rest off, just the seven keys left, in
// keyboard order, closed up into two rows (four and three) and bigger, with no gaps left where the others were.
function drawKeys(compact) {
  const kb = $("board"); kb.innerHTML = ""; kb.classList.toggle("compact", !!compact);
  const left = ROWS.join("").split("").filter(ch => game.keys.includes(ch)).join(""), half = Math.ceil(left.length / 2);
  const rows = compact ? [left.slice(0, half), left.slice(half)].filter(Boolean) : ROWS;
  kb.style.setProperty("--per", compact ? half : 10);
  rows.forEach(row => {
    const r = document.createElement("div"); r.className = "krow";
    for (const ch of row) {
      const b = document.createElement("button"), on = game.keys.includes(ch);
      b.className = "key" + (on ? " works" : " broke") + (ch === game.centre ? " centre" : ""); b.textContent = ch; b.dataset.k = ch;
      b.setAttribute("aria-label", on ? (ch === game.centre ? `${ch}, the gold key every word must use` : ch) : `${ch}, about to be knocked off`);
      // each key knocked off tumbles its own way (the same way every time): forward, down and spinning
      const t = ch.charCodeAt(0) * 37 % 11 - 5;
      if (!on) b.style.cssText = `--dx:${18 + Math.abs(t) * 9}px;--dy:${110 + (t + 5) * 8}px;--spin:${t * 30 + (t < 0 ? -40 : 40)}deg`;
      if (!on) b.tabIndex = -1;
      r.append(b);
    }
    kb.append(r);
  });
  const c = document.createElement("div"); c.className = "krow ctl";
  c.innerHTML = `<button class="ctlkey" data-k="del">⌫ Delete</button><button class="ctlkey enter" data-k="enter">Enter ⏎</button>`;
  kb.append(c);
}
function draw() {
  const s = score(), r = rankAt(s);
  $("rankName").textContent = r === RANKS.length - 1 && !game.hinted ? PYJAMAS : RANKS[r][0];
  $("score").textContent = `${s} pts`;
  $("dots").innerHTML = RANKS.map((_, i) => `<i class="${i <= r ? "on" : ""}" title="${RANKS[i][0]}"></i>`).join("");
  $("which").textContent = game.daily != null ? `Today's keys · #${game.daily + 1}` : typeof game.id === "string" ? "Your keys" : `Keys #${game.id + 1}`;

}

/* ---------- choosing keyboards ---------- */
function today() { const d = dayNumber(); openKeyboard(dailyId(d), d); }
function newKeyboard() {
  let id; do id = Math.floor(Math.random() * W.puzzles.length); while (game && id === game.id);
  openKeyboard(id, null); G.track("Keyboard Cat new keyboard");
}
/* ---------- choosing your own keys ---------- */
// Type in any seven keys (to play the same letters as another word game, say). Words come from this game's own list,
// so the answers won't always match.
const MIN_WORDS = 5;
// the id for these keys: their place in the list if they're there, otherwise "c:" and the letters
function idFor(keys, centre) {
  const p = [...keys].sort().join("") + centre, at = W.puzzles.indexOf(p);
  return at >= 0 ? at : "c:" + p;
}
// what's wrong with these keys, or null if they'll do
function checkKeys(keys, centre) {
  if (!/^[a-z]$/.test(centre || "")) return "Type the gold key.";
  if (!/^[a-z]{7}$/.test(keys) || new Set(keys).size !== 7) return "Type 6 other keys, all different.";
  if (!keys.includes(centre)) return "The gold key needs to be one of the 7.";
  if (keys.includes("s")) return "Leave out S: like Spelling Bee, this game's word list has no words with S.";
  const n = answersFor(keys, centre).answers.length;
  if (n < MIN_WORDS) return `Those keys only make ${n} everyday word${n === 1 ? "" : "s"}. Try others.`;
  return null;
}
function chooseKeys() {
  const box = document.createElement("div"); box.className = "choose";
  box.innerHTML = `<label>Gold key <input id="chooseGold" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
    <label>The other 6 keys <input id="chooseKeys" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
    <p class="err" id="chooseErr" aria-live="polite"></p>`;
  const go = () => {
    const centre = $("chooseGold").value.toLowerCase().trim(), keys = [...new Set(centre + $("chooseKeys").value.toLowerCase().replace(/[^a-z]/g, ""))].join("");
    const err = checkKeys(keys, centre);
    if (err) { $("chooseErr").textContent = err; return; }
    G.closeCard(); openKeyboard(idFor(keys, centre), null); G.track("Keyboard Cat chose keys");
  };
  G.openCard("Choose keys", "Play any seven letters, like today's Spelling Bee. The words come from this game's list, so they won't all match.", [["Play these keys", go, true], ["Cancel", G.closeCard]], box);
  $("chooseGold").addEventListener("input", e => { e.target.value = e.target.value.replace(/[^a-z]/gi, "").slice(-1); if (e.target.value) $("chooseKeys").focus(); });
  for (const i of [$("chooseGold"), $("chooseKeys")]) i.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); go(); } });
  $("chooseGold").focus();
}
$("chooseBtn").onclick = chooseKeys;
$("newBtn").onclick = () => { G.closeCard(); newKeyboard(); };
// Share: the keys themselves, in the message and in a short link anyone can read (#keys=r-aeilnt: the gold key,
// then the other six), so they can also be typed into Choose keys. With your words, the link lists them too.
const keysLink = () => `${location.origin}${location.pathname}#keys=${game.centre}-${[...game.keys].filter(ch => ch !== game.centre).sort().join("")}`;
const keysText = () => `Gold ${game.centre.toUpperCase()}, with ${[...game.keys].filter(ch => ch !== game.centre).sort().join(" ").toUpperCase()}`;
$("linkBtn").onclick = () => { if (!game) return;
  const send = mine => {
    G.track(`Keyboard Cat shared${mine ? " with progress" : ""}`);
    const text = !mine ? "Try this Keyboard Cat keyboard!" : game.won ? "Here are my Keyboard Cat words!" : "Can you help me with this Keyboard Cat keyboard?";
    G.sendLink("Keyboard Cat", `${text} ${keysText()}.`, keysLink() + (mine ? "&found=" + game.found.join(",") : ""));
  };
  G.openCard("Share this keyboard", `Send its keys (${keysText()}) so someone else can play it too.`, [
    ["Share this keyboard", () => send(false), true],
    ...(game.found.length ? [[game.won ? "Share it with my words" : "Share it with my progress", () => send(true)]] : []),
    ["Cancel", G.closeCard]]);
};
// A #keys= link this page was opened with, as share data (K: the 7 keys, then the gold one), or null; the link is
// tidied off the address.
function readKeysLink() {
  const m = location.hash.match(/^#keys=([a-z])-?([a-z]{6})(?:&found=([a-z,]*))?$/i);
  if (!m) return null;
  history.replaceState(null, "", location.pathname + location.search);
  const centre = m[1].toLowerCase(), keys = [...new Set(centre + m[2].toLowerCase())].sort().join("");
  return {K: keys + centre, ...(m[3] ? {p: {found: m[3].toLowerCase().split(",").filter(Boolean)}} : {})};
}
function openShared(d) {
  const id = typeof d.K === "string" ? idFor(d.K.slice(0, 7), d.K[7]) : d.N - 1;
  if (!(typeof id === "string" ? checkKeys(d.K.slice(0, 7), d.K[7]) === null : id >= 0 && id < W.puzzles.length)) { G.note("That share link didn't work.", 5000); if (!game) today(); return; }
  openKeyboard(id, null);
  if (d.p && Array.isArray(d.p.found)) { for (const w of d.p.found) if (typeof w === "string" && (COMMON.has(w) || EXTRA.has(w)) && !game.found.includes(w)) game.found.push(w); draw(); save(); }
}

/* ---------- how to play ---------- */
function showHelp() { saved.seenHelp = false; helpOnFirstVisit(); }
function helpOnFirstVisit() {
  if (saved.seenHelp || !game || document.querySelector(".spot")) return;
  const keyEls = () => [...document.querySelectorAll(".key.works")], centreEl = () => document.querySelector(".key.centre");
  const steps = [
    {say: "The cat walked across the keyboard and knocked the keys off. Only 7 are left", els: [keyEls]},
    {say: "Every word must use the gold key", els: [centreEl]},
    {say: "Make words of 4 letters or more. Keys can be used again", els: [$("entry")]},
    {say: "Use all 7 keys in one word for a Full Pounce!", els: [keyEls]},
    {say: "Reach Genius Cat for a gold paw; find every everyday word to be the Cat's Meow", els: [$("dots")]},
  ];
  G.spotlight({grid: $("board"), w: 10, h: 4, steps, done: () => { saved.seenHelp = true; save(); }});
}
$("helpBtn").onclick = showHelp;
$("newBtn").classList.remove("lead");   // one of the small buttons here, not the big dark one other games have

/* ---------- start ---------- */
G.nav("keyboardcat");
async function loadWords() {
  if (WORDS_INLINE) return WORDS_INLINE;
  const r = await fetch(`words.json?v=${window.SITE_BUILD || ""}`);
  if (!r.ok) throw new Error("couldn't load the word list");
  return r.json();
}
loadWords().catch(e => { G.note(`The word list didn't load (${e.message}). Check your connection and reload.`, 0); throw e; }).then(w => {
  W = w;
  // a share link: #keys=, or the older #share= kind
  const readLink = () => readKeysLink() || G.readShare("keyboardcat");
  const shared = readLink();
  if (shared) G.offerShare(shared, {name: "Keyboard Cat", inProgress: false, open: openShared}); else today();
  window.addEventListener("hashchange", () => { const d = readLink(); if (d) G.offerShare(d, {name: "Keyboard Cat", inProgress: false, open: openShared}); });
});
</script>
