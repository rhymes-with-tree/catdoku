<style>
/* A cross-stitch sampler: aida cloth held in a wooden embroidery hoop, with a chart's grid on it (a darker line every
   five squares), and the counts for each row down the left and each column along the top. Stitches are crosses in one
   thread while you work; once the sampler's finished, the grid and dots go, each stitch takes its colour, and the
   picture it was stitched from shows through behind it. */
.title{display:flex;align-items:flex-end;gap:6px}
.sitter{display:block;height:64px;width:auto;margin-bottom:-4px}
@media (max-height:760px){.sitter{height:46px;margin-bottom:-3px}}
.sampler{position:relative;width:var(--board);height:var(--board);display:grid;--cell:20px;--band:60px;--fs:12px;
  --pad:8px;--hw:8px;--hr:28px;--edge:calc(var(--pad) + var(--hw));
  grid-template-columns:var(--band) calc(var(--cell) * var(--n) + 2 * var(--edge));grid-template-rows:var(--band) calc(var(--cell) * var(--n) + 2 * var(--edge));
  justify-content:center;align-content:center;user-select:none;-webkit-user-select:none;
  background:var(--paper);border-radius:14px}   /* the board keeps its light colours in Dark Mode, counts and all */
/* the hoop: two wooden rings (a double border) with the cloth caught between them, and its brass screw at the bottom */
.hoop{--wood:color-mix(in srgb,#ECA818 55%,#BD5538);--aida:color-mix(in srgb,#ECA818 9%,#fff);
  grid-column:2;grid-row:2;position:relative;padding:var(--pad);border:var(--hw) double var(--wood);border-radius:var(--hr);background:var(--aida);
  box-shadow:0 0 0 1.5px color-mix(in srgb,var(--wood) 55%,#2A2530),inset 0 0 0 1.5px color-mix(in srgb,var(--wood) 55%,#2A2530),0 3px 8px rgba(42,37,48,.18)}
.hoop::after{content:"";position:absolute;left:50%;bottom:calc(-1 * var(--hw) - 1.5px - var(--hw) * 1.1);width:calc(var(--hw) * 2.6);height:calc(var(--hw) * 1.1);
  transform:translateX(-50%);border-radius:3px;background:#ECA818;border:1.5px solid color-mix(in srgb,#ECA818 45%,#2A2530)}
.sampler .board{--gl:rgba(42,37,48,.14);--gl5:rgba(42,37,48,.42);position:relative;
  background:none;border:none;border-radius:0;
  grid-template-columns:repeat(var(--n),var(--cell));grid-template-rows:repeat(var(--n),var(--cell))}
/* the picture the sampler was stitched from, behind the stitches once it's finished */
.real{position:absolute;pointer-events:none;opacity:0;max-width:none;transition:opacity 1.4s}
.sampler.won .real{opacity:.5}
.cell{position:relative;cursor:pointer;--rx:1px;--by:1px;--lr:var(--gl);--lb:var(--gl);
  box-shadow:inset calc(-1 * var(--rx)) 0 0 var(--lr),inset 0 calc(-1 * var(--by)) 0 var(--lb)}
.cell.x5{--rx:2px;--lr:var(--gl5)} .cell.y5{--by:2px;--lb:var(--gl5)}
.cell.xe{--rx:0px} .cell.ye{--by:0px}
/* a stitch: two strokes of thread, the top one going / as stitchers do */
.cell.st::before,.cell.st::after{content:"";position:absolute;left:50%;top:50%;width:104%;height:19%;border-radius:99px;
  background:var(--th,#4E577D);transform:translate(-50%,-50%) rotate(-45deg);transition:background .8s}
.cell.st::after{transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 0 .6px rgba(42,37,48,.25)}
/* a dot: this square stays empty */
.cell.dot::after{content:"";position:absolute;left:38%;top:38%;width:24%;height:24%;border-radius:50%;background:rgba(42,37,48,.5)}
.cell.cur{background:color-mix(in srgb,#73A7AE 14%,transparent)}
/* the counts */
.clues{display:grid;font-weight:800;color:var(--ink);font-size:var(--fs);line-height:1}
.colClues{grid-column:2;grid-row:1;grid-template-columns:repeat(var(--n),var(--cell));padding:0 var(--edge) 4px}
.rowClues{grid-column:1;grid-row:2;grid-template-rows:repeat(var(--n),var(--cell));padding:var(--edge) 6px var(--edge) 0}
.colClues > div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:calc(var(--fs) * .18)}
.rowClues > div{display:flex;justify-content:flex-end;align-items:center;gap:calc(var(--fs) * .42)}
.clues > div:nth-child(odd){background:color-mix(in srgb,var(--ink) 5%,transparent)}
.colClues > div{border-radius:6px 6px 0 0} .rowClues > div{border-radius:6px 0 0 6px}
.clues > div.done{color:var(--ink-soft);opacity:.45}
.clues > div.cur{background:color-mix(in srgb,#73A7AE 28%,transparent)}
.clues > div.hint{background:color-mix(in srgb,#ECA818 55%,transparent);opacity:1;color:var(--ink)}
.corner{grid-column:1;grid-row:1;display:flex;align-items:center;justify-content:center}
.corner svg{width:min(80%,64px);height:auto;overflow:visible}
/* finished: the chart's grid and the dots go, and each stitch takes its colour */
.sampler.won .cell{box-shadow:none} .sampler.won .cell.dot::after{display:none} .sampler.won .clues{opacity:.35}
@media (prefers-reduced-motion:reduce){.cell.st::before,.cell.st::after,.real{transition:none}}
/* the finished sampler on the win card */
.winSampler{display:block;width:min(230px,70vw);height:auto;margin:0 auto}
.sampler .overlay{grid-column:1 / -1;grid-row:1 / -1}
</style>

<main>
  <header><div class="title"><h1>Cross Stitch</h1><img class="sitter" id="sitter" alt="A cat sitting beside the title"></div><div class="stripe"></div><p class="tagline">Stitch the sampler by the counts to see the picture</p></header>
  <nav class="games" id="games" aria-label="Games"></nav>

  <div class="status"><span id="count"></span><button class="timer" id="timer" hidden></button><span class="msg" id="msg" aria-live="polite"></span></div>

  <div class="sampler stage" id="sampler">
    <div class="corner" id="corner" aria-hidden="true"></div>
    <div class="clues colClues" id="colClues" aria-hidden="true"></div>
    <div class="clues rowClues" id="rowClues" aria-hidden="true"></div>
    <div class="hoop" id="hoop"><div class="board" id="board" role="grid" aria-label="The sampler"></div></div>
  </div>
  <div class="overlay" id="overlay"><div class="card" id="card"></div></div>

  <div class="actions">
    <button id="hintBtn">Hint</button>
    <button id="undoBtn">Undo</button>
    <button id="restartBtn">Restart</button>
    <button id="dotBtn" aria-pressed="false">Dot</button>
    <button id="linkBtn">Share</button>
    <button id="bestBtn">Best times</button>
    <button id="helpBtn">How to play</button>
  </div>
  <div class="bar">
    <label>Level <select id="levelSel" aria-label="Level"></select></label>
    <button id="newBtn" class="primary">New sampler</button>
  </div>

</main>

function layout() {
  const N = game.N, s = $("sampler");
  const W = s.clientWidth, H = G.sideways() ? Math.min(innerHeight - 12, W) : W;
  const room = Math.min(W, H) - 8, pad = Math.max(6, Math.round(room * .022)), hw = Math.max(6, Math.round(room * .02)), screw = Math.round(hw * 1.2);
  const longRow = Math.max(...plan.rows.map(r => r.reduce((t, v) => t + String(v).length * .56, 0) + (r.length - 1) * .42 + .3));
  const longCol = Math.max(...plan.cols.map(c => c.length * 1.18 + .2));
  let cell = 20, fs = 12;
  for (let t = 0; t < 3; t++) {   // the text can't go below 11 pixels, so the band may need more of the room
    const band = Math.max(longRow, longCol) * fs + 8;
    cell = Math.floor((room - band - 2 * (pad + hw) - screw) / N);
    fs = Math.max(11, Math.min(22, cell * .6));
  }
  const band = Math.ceil(Math.max(longRow, longCol) * fs + 8);
  for (const [k, v] of [["--cell", cell], ["--fs", fs], ["--band", band], ["--pad", pad], ["--hw", hw], ["--hr", Math.round(pad * 3.2 + hw)]]) s.style.setProperty(k, v + "px");
  const box = picBox(game.k, game.flip, cell * N), im = $("real");
  if (im) Object.assign(im.style, {left: box.left + "px", top: box.top + "px", width: box.width + "px", height: box.height + "px"});
}

const hints = G.hinter({game: () => game, key: () => game ? game.grid.join("") : "", draw: () => draw()});   // marks {cells, bad, line: "r3" or "c3"}
function draw() {
  const N = game.N, g = game.grid, kids = cellEls, m = hints.current(), marked = new Set(m ? m.cells : []);
  const won = game.won, cx = cursor >= 0 ? cursor % N : -1, cy = cursor >= 0 ? Math.floor(cursor / N) : -1;
  for (let i = 0; i < N * N; i++) {
    const c = kids[i], x = i % N, y = Math.floor(i / N);
    c.classList.toggle("st", g[i] === 1); c.classList.toggle("dot", g[i] === 2 && !won);
    c.classList.toggle("hintcell", marked.has(i)); c.classList.toggle("bad", marked.has(i) && !!m.bad);
    c.classList.toggle("kbcursor", i === cursor);
    c.style.setProperty("--th", won && plan.cells[i] ? THREADS[plan.cells[i]] : "");
    c.setAttribute("aria-label", `Row ${y + 1}, column ${x + 1}: ${g[i] === 1 ? "stitched" : g[i] === 2 ? "dot, stays bare" : "bare"}`);
  }
  [...$("rowClues").children].forEach((d, y) => { d.classList.toggle("done", lineDone(true, y)); d.classList.toggle("cur", y === cy); d.classList.toggle("hint", !!m && m.line === "r" + y); });
  [...$("colClues").children].forEach((d, x) => { d.classList.toggle("done", lineDone(false, x)); d.classList.toggle("cur", x === cx); d.classList.toggle("hint", !!m && m.line === "c" + x); });
  $("sampler").classList.toggle("won", won);
  // VoiceOver: each row's and column's counts go with its squares
  for (let y = 0; y < N; y++) kids[y * N].setAttribute("aria-label", kids[y * N].getAttribute("aria-label") + `. Row ${y + 1} counts ${plan.rows[y].join(" ") || "0"}`);
  for (let x = 0; x < N; x++) kids[x].setAttribute("aria-label", kids[x].getAttribute("aria-label") + `. Column ${x + 1} counts ${plan.cols[x].join(" ") || "0"}`);
  const done = g.filter(v => v === 1).length, total = plan.sol.filter(Boolean).length;
  $("count").textContent = won ? `Finished: ${plan.name}!` : `🧵 ${done} of ${total} stitches`;
  $("dotBtn").setAttribute("aria-pressed", String(dotting));
  $("hintBtn").disabled = won; $("dotBtn").disabled = won;
  undo.sync();
}

/* ---------- playing ---------- */
// A tap stitches a square (or takes its stitch out); with Dot on, it puts a dot in (or takes it out) instead.
// Dragging along a row or column carries the same change to every square passed that was like the first.
const goal = from => dotting ? (from === 2 ? 0 : 2) : (from === 1 ? 0 : 1);
// Undo (G.history): each step is the grid as it was, as a string (the newest 400 kept in game.history). Restart can be
// undone too.
const undo = G.history({game: () => game, take: () => game.grid.join(""), back: (h, g) => { g.grid = h.split("").map(Number); }, cap: 400,
  can: playing, after: () => { draw(); save(); }, restart: true, started: () => game.grid.some(Boolean)});
const snapshot = () => undo.push();
let stroke = null;
const board = $("board");
board.addEventListener("pointerdown", e => {
  if (!playing()) return;
  const i = G.cellAt(e.clientX, e.clientY); if (i < 0) return;
  e.preventDefault();
  try { board.setPointerCapture(e.pointerId); } catch (_) {}
  game.started = true;
  stroke = {start: i, from: game.grid[i], to: goal(game.grid[i]), before: game.grid.slice(), axis: null};
  snapshot(); game.grid[i] = stroke.to; draw();
});
board.addEventListener("pointermove", e => {
  if (!stroke) return;
  const N = game.N, i = G.cellAt(e.clientX, e.clientY); if (i < 0) return;
  const sx = stroke.start % N, sy = Math.floor(stroke.start / N), x = i % N, y = Math.floor(i / N);
  if (!stroke.axis) { if (x === sx && y === sy) return; stroke.axis = Math.abs(x - sx) >= Math.abs(y - sy) ? "row" : "col"; }
  const from = stroke.axis === "row" ? sx : sy, to = stroke.axis === "row" ? x : y;
  game.grid = stroke.before.slice();
  for (let q = Math.min(from, to); q <= Math.max(from, to); q++) {
    const j = stroke.axis === "row" ? sy * N + q : q * N + sx;
    if (stroke.before[j] === stroke.from) game.grid[j] = stroke.to;
  }
  draw();
});
function endStroke() {
  if (!stroke) return;
  stroke = null;
  if (game.history[game.history.length - 1] === game.grid.join("")) game.history.pop();
  afterMove();
}
board.addEventListener("pointerup", endStroke);
board.addEventListener("pointercancel", endStroke);
function afterMove() {
  if (plan.sol.every((v, i) => v ? game.grid[i] === 1 : game.grid[i] !== 1)) { win(); return; }
  draw(); save();
}
function setCell(i, v) { if (game.grid[i] === v) return; game.started = true; snapshot(); game.grid[i] = v; afterMove(); }
// Keys: the arrows move a cursor; Space or Enter stitches, X or . puts a dot, Backspace clears. Shift with an arrow
// carries the square's stitch, dot or bare cloth on to the next.
const keys = G.gridKeys({on: playing, size: () => [game.N, game.N], keys: ["x", ".", "backspace", "delete"],
  show: i => { cursor = i; draw(); },
  move: (i, dx, dy, e) => {
    const N = game.N, x = Math.max(0, Math.min(N - 1, i % N + dx)), y = Math.max(0, Math.min(N - 1, Math.floor(i / N) + dy)), j = y * N + x;
    if (e && e.shiftKey && j !== i) setCell(j, game.grid[i]);
    return j;
  },
  act: (i, key) => {
    if (key === " ") setCell(i, game.grid[i] === 1 ? 0 : 1);
    else if (key === "x" || key === ".") setCell(i, game.grid[i] === 2 ? 0 : 2);
    else setCell(i, 0);
  },
  escape: () => { cursor = -1; draw(); }});
$("restartBtn").onclick = () => {
  if (!undo.restart(g => { g.grid = g.grid.map(() => 0); })) return;
  G.note("Every stitch is out. Undo puts them back.", 3500);
};
$("dotBtn").onclick = () => { if (!game || game.won) return; dotting = !dotting; draw(); G.note(dotting ? "Dot is on: a tap marks a square that stays bare" : "", dotting ? 3500 : 0); };

/* ---------- hints ---------- */
// A hint shows; it never stitches. First a mistake if there is one (a stitch where the picture has bare cloth, or a
// dot on a square the picture stitches). Otherwise a row or column whose counts settle squares not yet done, going by
// your stitches and dots: the first time, the line and its counts glow gold; asked again, the squares it settles.
// Lines that settle a stitch come before ones that only settle bare squares. Any hint keeps you on this level and
// costs the gold paw.
function nextStep() {
  const N = game.N, g = game.grid, known = g.map(v => v === 1 ? 1 : v === 2 ? 0 : -1);
  let best = null;
  for (const isRow of [true, false]) for (let a = 0; a < N; a++) {
    const cells = lineCells(isRow, a), cur = cells.map(i => known[i]), got = lineSolve((isRow ? plan.rows : plan.cols)[a], cur);
    if (!got) continue;
    const on = cells.filter((i, q) => cur[q] < 0 && got[q] === 1), off = cells.filter((i, q) => cur[q] < 0 && got[q] === 0 && g[i] !== 2);
    const score = on.length ? 1000 + on.length : off.length;
    if (score && (!best || score > best.score)) best = {isRow, a, cells, on, off, score};
  }
  return best;
}
function hint() {
  if (!playing()) return;
  const g = game.grid, sol = plan.sol;
  const wrong = g.map((v, i) => (v === 1 && !sol[i]) || (v === 2 && sol[i]) ? i : -1).filter(i => i >= 0);
  if (wrong.length) {
    game.hinted = true; game.started = true; save();
    const i = wrong[0];
    hints.show({cells: [i], bad: true}, (g[i] === 1 ? "That stitch shouldn't be there" : "That square needs a stitch, not a dot") + G.andMore(wrong.length - 1) + ".");
    return;
  }
  const s = nextStep();
  if (!s) { G.note("Couldn't find a hint here. Try Undo.", 4000); return; }
  game.hinted = true; game.started = true; save();
  const line = s.isRow ? `Row ${s.a + 1}` : `Column ${s.a + 1}`, counts = (s.isRow ? plan.rows : plan.cols)[s.a].join(" ") || "0";
  if (!hints.level()) hints.show({cells: s.cells, line: (s.isRow ? "r" : "c") + s.a},
    `${line}'s counts (${counts}) settle ${s.on.length ? "a stitch" : "a bare square"} in the gold ${s.isRow ? "row" : "column"}.`);
  else if (s.on.length) hints.show({cells: s.on, line: (s.isRow ? "r" : "c") + s.a}, `Stitch the gold square${s.on.length > 1 ? "s" : ""}: ${line.toLowerCase()}'s counts only fit that way.`);
  else hints.show({cells: s.off, line: (s.isRow ? "r" : "c") + s.a}, `The gold square${s.off.length > 1 ? "s stay" : " stays"} bare. Dot ${s.off.length > 1 ? "them" : "it"} to keep track.`);
}
$("hintBtn").onclick = hint;

/* ---------- endings ---------- */
// The last stitch: the chart's grid and the dots go, each stitch takes its colour, then the card.
function win() {
  game.won = true; G.finishClock(game); cursor = -1; dotting = false; keys.hide();
  const done = settings.seen[game.level] || [];
  if (!done.includes(key(game))) done.push(key(game));
  settings.seen[game.level] = done;
  const next = game.hinted ? game.level : Math.min(MAX_LEVEL, game.level + 1);
  settings.level = next; $("levelSel").value = next; save();
  draw();
  G.track(`Cross Stitch solved level ${game.level}`);
  const g = game, still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  running = true;
  setTimeout(() => { running = false; if (game === g) finishCard(); }, still ? 1800 : 3400);
}
// The finished sampler, for the win card: the stitches in their colours over the picture they came from.
function samplerPic() {
  const N = game.N, im = picBox(game.k, 0, N);   // laid as drawn, and mirrored with the stitches' grid if the pattern is
  let x = "";
  plan.cells.forEach((t, i) => { if (!t) return; const cx = i % N, cy = Math.floor(i / N);
    x += `<path d="M${cx + .14} ${cy + .14}L${cx + .86} ${cy + .86}M${cx + .86} ${cy + .14}L${cx + .14} ${cy + .86}" stroke="${THREADS[t]}"/>`; });
  const flip = game.flip ? ` transform="translate(${N} 0) scale(-1 1)"` : "";
  const d = document.createElement("div");
  d.innerHTML = `<svg class="winSampler" viewBox="-.6 -.6 ${N + 1.2} ${N + 1.2}" role="img" aria-label="Your finished sampler: ${plan.name}">
    <rect x="-.45" y="-.45" width="${N + .9}" height="${N + .9}" rx="${N * .09}" fill="#FDF7EA" stroke="#D78326" stroke-width=".3"/>
    <clipPath id="winCloth"><rect width="${N}" height="${N}"/></clipPath>
    <g clip-path="url(#winCloth)"><g${flip}>${drawingOf(plan.pic) ? `<g opacity=".5">${drawingOf(plan.pic)}</g>` : `<image href="${picSrc(plan.pic)}" x="${im.left}" y="${im.top}" width="${im.width}" height="${im.height}" opacity=".5"/>`}</g></g>
    <g stroke-width=".2" stroke-linecap="round">${x}</g></svg>`;
  const p = document.createElement("p"); p.className = "catname"; p.textContent = said(plan.name);
  return [d.firstElementChild, p];
}
function finishCard() {
  const next = settings.level, N = game.N;
  let text = `You've stitched ${plan.name} on the ${N} × ${N} sampler.`;
  text += game.hinted ? ` You had a hint, so here's another at level ${next}.` : game.level === MAX_LEVEL ? " That's the biggest; here's another." : ` Next up: level ${next}.`;
  G.winCard(text, () => { G.closeCard(); startLevel(next); }, "Admire my sampler", game.result,
    {title: "Finished!", gold: !game.restarted && !game.hinted, goldWhy: "No hints or restarts!", pic: samplerPic(),
     next: next > game.level ? `Next: level ${next}` : "Next sampler", after: G.otherSize($("levelSel"), next, startLevel, "Or play a different level:")});
}

/* ---------- new samplers ---------- */
// A new sampler is a pattern from the level you haven't finished yet, picked at random; once you've done them all,
// they all come round again.
const key = g => `${g.k}${g.flip ? "m" : ""}`;
function startLevel(n) { settings.level = n; $("levelSel").value = n; save(); newPuzzle(); }
function begin(level, k, flip) {
  const N = PATTERNS[k][2];
  game = {level, k, flip: flip ? 1 : 0, N, grid: new Array(N * N).fill(0), history: [], won: false, ...G.freshClock()};
  cursor = -1; dotting = false; makePlan(); buildBoard();
}
function newPuzzle() {
  const n = settings.level, all = levelPatterns(n), done = settings.seen[n] || [];
  let left = all.filter(([k, f]) => !done.includes(`${k}${f ? "m" : ""}`) && !(game && game.level === n && game.k === k && game.flip === f));
  if (!left.length) { settings.seen[n] = []; left = all.filter(([k, f]) => !(game && game.level === n && game.k === k && game.flip === f)); }
  const [k, f] = left[Math.floor(Math.random() * left.length)];
  begin(n, k, f);
  G.closeCard(); G.note(""); draw(); save();
  G.track(`Cross Stitch new puzzle level ${n}`);
}

/* ---------- sharing ---------- */
$("linkBtn").onclick = () => { if (game) G.shareCard({name: "Cross Stitch", won: game.won,
  puzzle: () => ({g: "crossstitch", N: game.level, k: game.k, f: game.flip}),
  progress: () => ({grid: game.grid.join("")})}); };
// A sampler from a share link: a level, and a pattern of that level's size; its stitches so far if they were sent
// (that isn't timed).
function openShared(d) {
  const ok = Number.isInteger(d.N) && d.N >= 1 && d.N <= MAX_LEVEL && Number.isInteger(d.k) && PATTERNS[d.k] && PATTERNS[d.k][2] === LEVELS[d.N]
    && (d.f === 0 || d.f === 1);
  const N = ok && LEVELS[d.N];
  if (!ok || (d.p && !(typeof d.p.grid === "string" && d.p.grid.length === N * N && /^[012]*$/.test(d.p.grid)))) { G.note("That share link didn't work.", 5000); return; }
  begin(d.N, d.k, d.f);
  if (d.p) { game.grid = d.p.grid.split("").map(Number); game.timed = false; }
  settings.level = d.N; $("levelSel").value = d.N;
  draw(); save();
  if (d.p && plan.sol.every((v, i) => v ? game.grid[i] === 1 : game.grid[i] !== 1)) win();
}

/* ---------- how to play ---------- */
function showHelp() {
  settings.seenHelp = false; helpOnFirstVisit();
  if (!document.querySelector(".spot")) { settings.seenHelp = true; G.helpLater(); }
}
// First visit: the counts on a row and a column of the sampler that's out, then a stitch of your own (taken out
// again afterwards).
function helpOnFirstVisit() {
  if (settings.seenHelp || !game || !playing() || document.querySelector(".spot")) return;
  const N = game.N, xy = i => [i % N, Math.floor(i / N)];
  // the example row and column: the ones with the most counts (two or more runs if there are any), near the middle
  const pick = (list, isRow) => [...list.keys()].sort((a, b) => (list[b].length > 1) - (list[a].length > 1) || Math.abs(a - (N - 1) / 2) - Math.abs(b - (N - 1) / 2))[0];
  const ry = pick(plan.rows, true), cx = pick(plan.cols, false);
  const row = lineCells(true, ry).map(xy), col = lineCells(false, cx).map(xy);
  const rowEl = () => $("rowClues").children[ry], colEl = () => $("colClues").children[cx];
  const counts = plan.rows[ry];
  // a square to stitch: the middle stitch of the example row's longest run, if it's still bare
  const runs = []; { let start = -1; for (let q = 0; q <= N; q++) { const on = q < N && plan.sol[ry * N + q]; if (on && start < 0) start = q; if (!on && start >= 0) { runs.push([start, q - start]); start = -1; } } }
  const long = runs.sort((a, b) => b[1] - a[1])[0], e = long ? ry * N + long[0] + Math.floor(long[1] / 2) : -1;
  const turn = G.yourTurn(() => game, g => { game = g; }, () => draw());
  const steps = [
    {say: counts.length > 1 ? `Runs of ${G.listed(counts.map(String))} stitches, in order` : `A run of ${counts[0] || 0} stitches`, lit: row, els: [rowEl]},
    {say: "Columns count down", lit: col, els: [colEl]},
    {say: "A gap between runs", later: true, lit: row, els: [rowEl]},
    ...(e >= 0 && game.grid[e] !== 1 ? [{say: "Tap to stitch", lit: [xy(e)], try: {done: () => game.grid[e] === 1, yes: "Stitched!"}, ...turn.from, ...turn.upTo}] : []),
    {say: "Drag along a line to stitch a run", later: true, lit: row},
    {say: "Finish it to see who it is 🐱", lit: [...Array(N * N).keys()].map(xy), tone: "ok"},
    {say: "Dot: mark squares that stay bare", els: [$("dotBtn")]},
    {say: "Stuck? Hint shows a line to look at", els: [$("hintBtn")]},
  ];
  { const t = steps.findIndex(st => st.try); if (t > 1) steps.splice(1, 0, ...steps.splice(t, 1)); }
  G.spotlight({grid: $("board"), w: N, h: N, steps, done: () => { settings.seenHelp = true; save(); }});
}

for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(levelName(n).replace("Level ", "") + (n === MAX_LEVEL ? " (hardest)" : ""), n));
$("levelSel").onchange = e => { G.closeCard(); startLevel(+e.target.value); };
$("newBtn").onclick = () => { G.closeCard(); newPuzzle(); };
$("helpBtn").onclick = showHelp;
addEventListener("resize", () => { if (game && plan) layout(); });
$("sitter").src = picSrc("cats/" + SITTERS[Math.floor(Math.random() * SITTERS.length)]);

G.nav("crossstitch");
G.checkClock(game);
G.setupTimer({name: "crossstitch", game: () => game, playing: g => !g.won, save, label: levelName, noun: "level"});
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : settings.level);

if (!(settings.level >= 1 && settings.level <= MAX_LEVEL)) settings.level = 1;
$("levelSel").value = settings.level;
const shared = G.readShare("crossstitch");
const hadSave = !!(game && Array.isArray(game.grid));
if (hadSave) G.reopen(() => {
    if (!PATTERNS[game.k] || PATTERNS[game.k][2] !== LEVELS[game.level] || game.grid.length !== game.N * game.N || game.N !== LEVELS[game.level]) throw new Error("the saved sampler doesn't fit its level");
    makePlan(); buildBoard(); draw();
    if (game.won) finishCard();
    helpOnFirstVisit();
  }, why => { game = null; newPuzzle(); G.note(why, 0); });
else if (!shared) { newPuzzle(); helpOnFirstVisit(); }
const shareOpts = () => ({name: "Cross Stitch", inProgress: !!(game && !game.won && game.history.length), open: openShared, after: helpOnFirstVisit});
if (shared) G.offerShare(shared, {...shareOpts(), fresh: hadSave ? null : why => { newPuzzle(); G.note(why, 6000); helpOnFirstVisit(); }});
window.addEventListener("hashchange", () => { const d = G.readShare("crossstitch"); if (d) G.offerShare(d, shareOpts()); });
</script>
