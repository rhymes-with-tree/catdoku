<style>
/* Bugsy, the star, peeking beside the title */
.title{display:flex;align-items:flex-end;gap:8px}
.bugsy{display:block;height:62px;width:auto;margin-bottom:-6px}
@media (max-height:760px){.bugsy{height:46px;margin-bottom:-4px}}
.card img.bugsypic{display:block;width:70%;max-width:240px;height:auto;margin:0 auto 14px}

/* A quilted blanket seen from above, with slots all round its edge for the feather wand. Cats nap under it; tap a
   slot to slide the feather in and see where it pops out. Lumps (where you think a cat is) and dots (where you're
   sure there's none) are marked on the blanket. Once you lift it, the cats are there, curled up asleep. */
.bed{--quilt-a:#E2DDEA; --quilt-b:#D7DAEA; --stitch:#8D78AD; --binding:#8D78AD; --sheet:#F7F8F3; --lump:#C6BCD6;
  background:color-mix(in srgb,#8D78AD 14%,#F7F8F3);border:3px solid #2A2530;border-radius:12px;overflow:hidden;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.bed .grid{position:absolute;inset:0}
.bed svg{display:block;width:100%;height:100%;outline:none}
.sheet{fill:var(--sheet)}
.sheetline{stroke:color-mix(in srgb,#73A7AE 30%,#fff);stroke-width:3;fill:none}
.patch{stroke:none}
.stitch{fill:none;stroke:var(--stitch);stroke-width:2.5;stroke-dasharray:7 6;opacity:.75;pointer-events:none}
.binding{fill:none;stroke:var(--binding);stroke-width:12}
.quilt{transition:transform .9s cubic-bezier(.5,0,.3,1),opacity .9s ease-in}
.quilt.off{transform:translate(0,-112%) rotate(-4deg);opacity:0}
@media (prefers-reduced-motion:reduce){.quilt{transition:none}}
.sq{cursor:pointer}
/* a lump: something cat-shaped under the blanket, ears and all */
.lump .body{fill:var(--lump);stroke:#7E6C9A;stroke-width:3}
.lump .ear{fill:var(--lump);stroke:#7E6C9A;stroke-width:3;stroke-linejoin:round}
.lump .shade{fill:#7E6C9A;opacity:.22}
.dot{fill:#5E5866;opacity:.65}
/* the slots round the edge */
.slot{cursor:pointer}
.slot .tab{fill:#F7F8F3;stroke:#8D78AD;stroke-width:3}
.slot .tip{fill:none;stroke:#8D78AD;stroke-width:3;stroke-linecap:round;opacity:.8}
.slot.done .tab{stroke:#2A2530}
.slot .num{font:800 46px var(--font);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.slot.bad .ring{display:inline}
.slot .ring{display:none;fill:none;stroke:#C8392B;stroke-width:6}
.slot.flash .tab{animation:flash .5s ease-out 2}
@keyframes flash{50%{stroke-width:9}}
/* the feather wand, sliding in and popping out */
.wand{pointer-events:none}
.napper{pointer-events:none}
.cursor{fill:none;stroke:#73A7AE;stroke-width:6;pointer-events:none}
.tally .tic{width:1.15em;height:1.15em}
.over{color:var(--bad-text)}
</style>

<script src="../games.js?v=2026-11-12.11"></script>
<script>
/* ---------- blanket puzzles (plain functions, also run in a background worker) ---------- */
// The blanket is N × N squares with k cats under it. A feather wand goes in at one of 4N slots round the edge:
// slots 0..N-1 along the top (column by column), N..2N-1 down the right side, 2N..3N-1 along the bottom and
// 3N..4N-1 down the left side. It runs straight until a cat is in the way:
//   a cat straight ahead grabs it (it never comes out: -1);
//   a cat ahead to one side turns it away from that cat, a quarter turn;
//   cats ahead on both sides send it back the way it came;
//   a cat on the edge just beside the slot sends it straight back out.
// It comes out at a slot: its own (sent back) or another, and the way back is the same run backwards.
function ubLevel(n) {
  return [null, {N: 5, k: 2}, {N: 5, k: 3}, {N: 6, k: 3}, {N: 6, k: 4}, {N: 7, k: 4},
    {N: 8, k: 4}, {N: 8, k: 5}, {N: 9, k: 5}, {N: 9, k: 6}, {N: 10, k: 6}][n];
}
// Where slot p starts (just outside the blanket) and which way it heads: [x, y, dx, dy].
function ubSlot(N, p) {
  const s = Math.floor(p / N), j = p % N;
  return [[j, -1, 0, 1], [N, j, -1, 0], [j, N, 0, -1], [-1, j, 1, 0]][s];
}
// The slot at x, y just outside the blanket.
function ubOut(N, x, y) { return y < 0 ? x : x >= N ? N + y : y >= N ? 2 * N + x : 3 * N + y; }
// Run the wand in at slot p. at(x, y) is 1 for a cat, 0 for none, -1 for not known yet (then null comes back).
// Returns the slot it comes out at, or -1 if a cat grabs it.
function ubFire(N, at, p) {
  let [x, y, dx, dy] = ubSlot(N, p);
  const cell = (a, b) => a < 0 || b < 0 || a >= N || b >= N ? 0 : at(a, b);
  // at the slot: a cat in the first square grabs it; a cat beside that square sends it back
  let ah = cell(x + dx, y + dy);
  if (ah < 0) return null;
  if (ah) return -1;
  const l0 = cell(x + dx + dy, y + dy - dx), r0 = cell(x + dx - dy, y + dy + dx);
  if (l0 < 0 || r0 < 0) return null;
  if (l0 || r0) return p;
  x += dx; y += dy;
  for (let steps = 0; steps < 8 * N * N; steps++) {
    ah = cell(x + dx, y + dy);
    if (ah < 0) return null;
    if (ah) return -1;
    // ahead and to the left (as the wand faces), and ahead and to the right
    const l = cell(x + dx + dy, y + dy - dx), r = cell(x + dx - dy, y + dy + dx);
    if (l < 0 || r < 0) return null;
    if (l && r) { dx = -dx; dy = -dy; }
    else if (l) { const t = dx; dx = -dy; dy = t; }        // turn right, away from the cat on the left
    else if (r) { const t = dx; dx = dy; dy = -t; }        // turn left
    else {
      x += dx; y += dy;
      if (x < 0 || y < 0 || x >= N || y >= N) return ubOut(N, x, y);
    }
  }
  return -2;   // can't happen: a run can't go round in a loop
}
// Every way of hiding k cats that gives the same results for the slots in `shots` ([[slot, out]…]), up to limit
// (each a sorted list of squares). Squares are decided from the edge in, ring by ring, so the wands' first squares
// are known early and a wrong guess is caught soon. Null if that takes more than `cap` steps.
function ubSolve(N, k, shots, limit, cap) {
  const NN = N * N, ord = [];
  for (let r = 0; 2 * r < N; r++) for (let i = 0; i < NN; i++) {
    const x = i % N, y = (i - x) / N;
    if (Math.min(x, y, N - 1 - x, N - 1 - y) === r) ord.push(i);
  }
  const g = new Int8Array(NN).fill(-1), at = (x, y) => g[y * N + x], out = [], most = cap || 4e6;
  let work = 0;
  (function go(d, left) {
    if (out.length >= limit || work > most) return;
    for (const s of shots) {
      work++;
      const o = ubFire(N, at, s[0]);
      if (o !== null && o !== s[1]) return;
    }
    if (d === NN) { if (!left) out.push(ord.filter(i => g[i] === 1).sort((a, b) => a - b)); return; }
    const i = ord[d];
    if (NN - d > left) { g[i] = 0; go(d + 1, left); }
    if (left) { g[i] = 1; go(d + 1, left - 1); }
    g[i] = -1;
  })(0, k);
  return work > most ? null : out;
}
function ubShuffle(a) { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
// A blanket: hide the cats at random, and keep it if every slot's result, taken together, leaves only one way the
// cats can be lying. Null to try again.
function makeBlanket(n) {
  const {N, k} = ubLevel(n), NN = N * N;
  const cats = ubShuffle([...Array(NN).keys()]).slice(0, k).sort((a, b) => a - b), has = new Uint8Array(NN);
  for (const i of cats) has[i] = 1;
  const res = [...Array(4 * N).keys()].map(p => ubFire(N, (x, y) => has[y * N + x], p));
  const sols = ubSolve(N, k, res.map((o, p) => [p, o]), 2);
  if (!sols || sols.length !== 1) return null;
  return {N, k, cats, res};
}

/* ---------- game state ---------- */
// game: {level, N, k, cats (the squares the cats are on), res (where each slot's wand comes out: a slot, or -1 when a
//        cat grabs it), shots (the slots tried, in order), marks (each square: 0 nothing, 1 a lump, 2 a dot),
//        history (G.history: [square, what it was], or {marks, shots} for a Restart), won, hinted, restarted,
//        peeked (lifted the blanket with a lump wrong)…}
const STORE = "catdoku.blanket.v1", MAX_LEVEL = 10, M = 80, NS = "http://www.w3.org/2000/svg";
const $ = G.$;
let state = G.load(STORE);
let settings = Object.assign({level: 1, autoCheck: true}, state.settings);
let game = state.game || null, busy = false, running = false;
const line = () => 2 * game.N;   // the gold line: half the slots
G.pawLost(() => !game || game.won || game.hinted || game.restarted || game.peeked || game.autoNoted || game.shots.length > line());
// The tutorial's practice blanket is never saved: while it's out, only the settings are, beside the puzzle already kept.
const save = () => G.save(STORE, {settings, game: game && game.tutorial ? G.load(STORE).game : game});
const playing = () => game && !game.won && !busy && !running && !$("overlay").classList.contains("show");
const levelName = n => { const s = ubLevel(n); return `Level ${n} · ${s.N} × ${s.N}, ${s.k} cats`; };
const build = G.builder([ubLevel, ubSlot, ubOut, ubFire, ubSolve, ubShuffle, makeBlanket], "makeBlanket");
const el = (t, a, parent) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (parent) parent.append(e); return e; };
const catSrc = f => (window.CAT_SRC || {})[f] || `../cats/${f}.webp`;
const has = () => { const h = new Uint8Array(game.N * game.N); for (const i of game.cats) h[i] = 1; return h; };
const lumps = () => game.marks.reduce((a, m, i) => m === 1 ? [...a, i] : a, []);

// What's known at each slot: {kind: "grab" | "back" | "pair", n (the pair's number), other (the slot at the other
// end)}, from the slots tried. A wand that comes out of another slot tells that slot too.
function known() {
  const out = {}; let n = 0;
  for (const p of game.shots) {
    if (out[p]) continue;
    const o = game.res[p];
    if (o < 0) out[p] = {kind: "grab"};
    else if (o === p) out[p] = {kind: "back"};
    else { n++; out[p] = {kind: "pair", n, other: o}; out[o] = {kind: "pair", n, other: p}; }
  }
  return out;
}
// Slot centres, in the board's units (each square is 100).
function slotXY(p) {
  const N = game.N, s = Math.floor(p / N), j = p % N, h = M / 2;
  return [[j * 100 + 50, -h], [N * 100 + h, j * 100 + 50], [j * 100 + 50, N * 100 + h], [-h, j * 100 + 50]][s];
}
const centre = i => [i % game.N * 100 + 50, Math.floor(i / game.N) * 100 + 50];
// Pair colours: the site's palette, darker ones first so white numbers read on them.
// (Gold is kept for a wand that comes back, and brick for one a cat grabs, on the tabs and the runs drawn at the end.)
const PAIRS = ["#4E577D", "#6AA673", "#B94588", "#73A7AE", "#8D78AD", "#B3B94B", "#7885BA"];

/* ---------- drawing ---------- */
let slotEls = [], sqEls = [];
function paw(g, x, y, s, fill) {
  el("ellipse", {cx: x, cy: y + 4 * s, rx: 7 * s, ry: 6 * s, fill}, g);
  for (const [a, b] of [[-8, -4], [-3, -9], [3, -9], [8, -4]]) el("ellipse", {cx: x + a * s, cy: y + b * s, rx: 2.7 * s, ry: 3.3 * s, fill}, g);
}
// The feather wand, pointing along +x from the origin: the feather at the front, the stick behind.
// The feather toy (the owner's picture, feather-wand.webp: 600 × 110, handle on the left, the stick's middle 95.5 down),
// pointing along +x: the feathers' tip at x = 58 and the stick along y = 0, 280 long.
const pic = f => (window.TOY_SRC || {})[f] || `${f}.webp`;
function wand(parent) {
  const g = el("g", {class: "wand"}, parent), W = 280, H = W * 110 / 600;
  el("image", {href: pic("feather-wand"), x: 58 - W, y: -H * 95.5 / 110, width: W, height: H}, g);
  return g;
}
function say() {
  const N = game.N, k = known(), tried = Object.keys(k).map(Number).sort((a, b) => a - b);
  const side = p => { const s = Math.floor(p / N), j = p % N + 1; return [`top ${j}`, `right ${j}`, `bottom ${j}`, `left ${j}`][s]; };
  const words = tried.map(p => `${side(p)}: ${k[p].kind === "grab" ? "grabbed" : k[p].kind === "back" ? "came back" : `pair ${k[p].n}, out at ${side(k[p].other)}`}`);
  const ls = lumps().map(i => G.at(i, N)), dots = game.marks.map((m, i) => m === 2 ? G.at(i, N) : "").filter(Boolean);
  G.describe($("svg"), `Blanket, ${N} by ${N}, with ${game.k} cats under it. ${tried.length ? "Slots tried: " + G.listed(words, "; ") + "." : "No slots tried yet."} ${ls.length ? "Lumps at " + G.listed(ls, "; ") + "." : ""} ${dots.length ? "Dots at " + G.listed(dots, "; ") + "." : ""} Arrow keys move round the blanket and its edge; Space tries a slot or marks a lump, D marks a dot.`);
}
function draw() {
  queueMicrotask(say);
  const N = game.N, S = N * 100, svg = $("svg");
  svg.innerHTML = "";
  svg.setAttribute("viewBox", `${-M} ${-M} ${S + 2 * M} ${S + 2 * M}`);
  const defs = el("defs", {}, svg), mrk = el("marker", {id: "demoArrow", viewBox: "0 0 10 10", refX: 5, refY: 5, markerWidth: 3.2, markerHeight: 3.2, orient: "auto-start-reverse"}, defs);
  el("path", {d: "M0 0 L10 5 L0 10 Z", fill: "#E16A4A", stroke: "#2A2530", "stroke-width": 1}, mrk);
  // the sheet underneath, and the cats asleep on it (seen once the blanket's lifted)
  el("rect", {class: "sheet", x: 0, y: 0, width: S, height: S, rx: 10}, svg);
  let d = ""; for (let x = 25; x < S; x += 50) d += `M${x} 0V${S}`;
  el("path", {class: "sheetline", d}, svg);
  el("g", {id: "under"}, svg);
  el("g", {id: "runs"}, svg);
  // the quilt
  const q = el("g", {class: "quilt" + (game.won ? " off" : ""), id: "quilt"}, svg);
  sqEls = [];
  for (let i = 0; i < N * N; i++) {
    const x = i % N, y = Math.floor(i / N);
    sqEls[i] = el("rect", {class: "patch sq", x: x * 100, y: y * 100, width: 100, height: 100, fill: (x + y) % 2 ? "var(--quilt-b)" : "var(--quilt-a)"}, q);
  }
  d = "";
  for (let i = 0; i < N * N; i++) { const x = i % N * 100, y = Math.floor(i / N) * 100; d += `M${x + 10} ${y + 10}h80v80h-80z`; }
  el("path", {class: "stitch", d}, q);
  el("rect", {class: "binding", x: -4, y: -4, width: S + 8, height: S + 8, rx: 12}, q);
  el("g", {id: "marks"}, q);
  // the slots
  const sl = el("g", {id: "slots"}, svg);
  slotEls = [];
  for (let p = 0; p < 4 * N; p++) {
    const [cx, cy] = slotXY(p), g = el("g", {class: "slot", transform: `translate(${cx} ${cy})`}, sl);
    el("rect", {x: -50, y: -50, width: 100, height: 100, fill: "transparent"}, g);
    slotEls[p] = g;
  }
  // the feather sliding in: over the edge and its slots, but cut off at the blanket, so it goes under
  const clip = el("clipPath", {id: "outside"}, defs);
  el("path", {d: `M${-M} ${-M}h${S + 2 * M}v${S + 2 * M}h${-S - 2 * M}z M4 4v${S - 8}h${S - 8}v${-S + 8}z`, "clip-rule": "evenodd"}, clip);
  el("g", {id: "wands", "clip-path": "url(#outside)"}, svg);
  el("rect", {class: "hintsq", id: "hintsq", x: -999, y: 0, width: 92, height: 92, rx: 12}, svg);
  el("rect", {class: "cursor", id: "cursor", x: -999, y: 0, width: 92, height: 92, rx: 12}, svg);
  if (game.won) { showCats(false); showRuns(false); }
  update();
}
// What a slot shows, in g (centred on the slot): an arrow pointing in while it's untried (rot turns it to face in),
// a brick paw where a cat grabbed the feather, a gold U-turn where it came straight back, or the pair's number.
function slotMark(g, kn, rot) {
  if (!kn) {
    el("circle", {class: "tab", r: 27}, g);
    el("path", {class: "tip", d: "M-9 -11 L5 0 L-9 11", transform: `rotate(${rot})`}, g);
  } else if (kn.kind === "grab") {
    el("circle", {class: "tab", r: 36, style: "fill:#F7F8F3;stroke:#BD5538;stroke-width:6"}, g);
    paw(g, 0, 1, 1.9, "#BD5538");
  } else if (kn.kind === "back") {
    el("circle", {class: "tab", r: 36, style: "fill:#ECA818"}, g);
    el("path", {d: "M-10 -11 H4 A10 10 0 0 1 4 9 H-10 M-4 3 L-11 9 L-4 15", fill: "none", stroke: "#2A2530", "stroke-width": 5.5, "stroke-linecap": "round", "stroke-linejoin": "round", transform: `rotate(${rot + 180}) scale(1.3) translate(0 -2)`}, g);
  } else {
    const c = PAIRS[(kn.n - 1) % PAIRS.length], dark = /B3B94B|73A7AE/.test(c);
    el("circle", {class: "tab", r: 36, style: `fill:${c}`}, g);
    el("text", {class: "num", y: 3, fill: dark ? "#2A2530" : "#fff"}, g).textContent = kn.n;
  }
}
// Marks on the blanket and what's known at each slot; then the status line.
function update() {
  const N = game.N, k = known(), mk = $("marks");
  mk.innerHTML = "";
  // with Auto Notes on, a dot on every square the feathers prove has no cat (not kept in marks: worked out afresh)
  const auto = settings.autoNotes && !game.won ? noCat() : null;
  // Auto Notes costs the gold paw once it has put a dot down on this blanket (never on the tutorial's practice one)
  if (auto && auto.size && !game.tutorial && !game.autoNoted) { game.autoNoted = true; game.started = true; save(); }
  game.marks.forEach((m, i) => {
    if (!m && auto && auto.has(i)) m = 2;
    if (!m) return;
    const [cx, cy] = centre(i);
    if (m === 2) { el("circle", {class: "dot", cx, cy, r: 9}, mk); return; }
    const g = el("g", {class: "lump", transform: `translate(${cx} ${cy + 6})`}, mk);
    for (const s of [-1, 1]) el("path", {class: "ear", d: `M${s * 30} -14 L${s * 27} -40 L${s * 8} -26 Z`}, g);
    el("ellipse", {class: "body", cx: 0, cy: 2, rx: 36, ry: 28}, g);
    el("ellipse", {class: "shade", cx: 8, cy: 12, rx: 24, ry: 13}, g);
  });
  // with Auto check on and every lump down: the slots whose results these lumps wouldn't give turn red
  const bad = new Set(), ls = lumps();
  if (settings.autoCheck && ls.length === game.k && !game.won) {
    const h = new Uint8Array(N * N); for (const i of ls) h[i] = 1;
    for (const p in k) if (ubFire(N, (x, y) => h[y * N + x], +p) !== game.res[p]) bad.add(+p);
  }
  for (let p = 0; p < 4 * N; p++) {
    const g = slotEls[p], kn = k[p];
    while (g.childNodes.length > 1) g.lastChild.remove();
    g.setAttribute("class", "slot" + (kn ? " done" : "") + (bad.has(p) ? " bad" : ""));
    slotMark(g, kn, [90, 180, 270, 0][Math.floor(p / N)]);
    el("circle", {class: "ring", r: 42}, g);
  }
  // the status line: lumps marked of the cats, and feathers used of the gold line
  const used = game.shots.length, over = used > line();
  $("count").innerHTML = game.won ? `All ${game.k} cats found` :

/* ---------- Auto Notes ---------- */

}
/* ---------- the tutorial ---------- */
// The walkthrough plays on a practice blanket the size of the one that's out, with one cat under it, on the right-hand
// edge, two rows down. Your puzzle is put away while it's up (G.yourTurn) and comes back exactly as it was; the practice
// blanket is never saved. The slots it uses, all worked out from N: a clear run down the first column, the cat's own
// column (it grabs the feather), the column beside it (the feather turns away and comes out on the left) and the right
// side's second slot (the cat beside it sends it straight back).
const tut = N => ({cat: 2 * N + N - 1, clear: 0, grab: N - 1, turn: N - 2, back: N + 1});
function tutStart() {
  const N = game.N, t = tut(N), cats = [t.cat], h = new Uint8Array(N * N); h[t.cat] = 1;
  const res = [...Array(4 * N).keys()].map(p => ubFire(N, (x, y) => h[y * N + x], p));
  game = {...JSON.parse(JSON.stringify(game)), tutorial: true, k: 1, cats, res, shots: [], marks: new Array(N * N).fill(0), history: [],
    won: false, hinted: false, peeked: false};
  hints.clear(false); draw();
}
// The slot's place in the walkthrough's (N+2)-square grid.
const slotSq = p => { const N = game.N, s = Math.floor(p / N), j = p % N + 1; return [[j, 0], [N + 1, j], [j, N + 1], [0, j]][s]; };
// The feather toy, shown off over the blanket: a stand-in drawing until the toy's own picture comes.
function showToy() {
  hideToy();
  const S = game.N * 100, W = S * 1.04, H = W * 110 / 600, g = el("g", {id: "tuttoy"}, $("svg"));
  el("image", {href: pic("feather-wand"), x: (S - W) / 2, y: S * 0.5 - H / 2, width: W, height: H}, g);
}
const hideToy = () => { const t = $("tuttoy"); if (t) t.remove(); };
// The blanket turned back over the cat's square, and the cat asleep there.
function tutReveal() {
  const old = $("tutcat"); if (old) old.remove();
  const g = el("g", {id: "tutcat"}, $("svg"));
  game.cats.forEach((i, n) => {
    const [cx, cy] = centre(i);
    el("rect", {x: cx - 48, y: cy - 48, width: 96, height: 96, rx: 14, fill: "#F7F8F3", stroke: "#8D78AD", "stroke-width": 3}, g);
    el("image", {href: catSrc(NAPPERS[n]), x: cx - 46, y: cy - 46, width: 92, height: 92}, g);
  });
}
// The second practice cat, two squares left of the first, for the U-turn with a cat on each side; and taking it away
// again if the walkthrough steps back.
const tutTwo = on => { const t = tut(game.N), two = t.cat - 2; game.cats = on ? [t.cat, two].sort((a, b) => a - b) : [t.cat]; };
// One feather's run drawn over the blanket, as a dotted line with an arrow, and what its slots would show (a pair
// gets the next number up). Returns the squares to light: the run's, its slots' and the cat's.
function tutRun(p, hidden) {
  undemo();
  // the path goes under the slots' marks; the example's own marks go on top (both in #demo, taken away together)
  const N = game.N, {out, pts} = ubTrace(N, game.cats, p), lit = new Set(), demo = el("g", {id: "demo"}, $("svg")), g = el("g", {}, demo);
  const path = el("g", {}); $("svg").insertBefore(path, $("slots")); demo.pathLayer = path;
  const line = runLine(pts, out, p).map(q => q.join(",")).join(" ");
  el("polyline", {points: line, fill: "none", stroke: "#2A2530", "stroke-width": 15, "stroke-linejoin": "round", "stroke-linecap": "round", opacity: .25}, path);
  el("polyline", {points: line, fill: "none", stroke: "#E16A4A", "stroke-width": 9, "stroke-dasharray": "2 16", "stroke-linejoin": "round", "stroke-linecap": "round", "marker-end": "url(#demoArrow)"}, path);
  for (let j = 1; j < pts.length; j++) {
    const [ax, ay] = pts[j - 1], [bx, by] = pts[j], n = Math.ceil(Math.hypot(bx - ax, by - ay) / 25);
    for (let t = 0; t <= n; t++) {
      const x = ax + (bx - ax) * t / n, y = ay + (by - ay) * t / n;
      if (x > 0 && y > 0 && x < N * 100 && y < N * 100) lit.add(`${Math.floor(x / 100) + 1},${Math.floor(y / 100) + 1}`);
    }
  }
  const mk = q => { const [cx, cy] = slotXY(q), s = el("g", {class: "slot done", transform: `translate(${cx} ${cy})`}, g); el("circle", {r: 44, fill: "#F7F8F3"}, s); return s; };
  const rot = q => [90, 180, 270, 0][Math.floor(q / N)], pairs = Object.values(known()).filter(k => k.kind === "pair").length / 2;
  // (a slot already tried shows its own mark)
  if (known()[p]) {}
  else if (out < 0) slotMark(mk(p), {kind: "grab"}, rot(p));
  else if (out === p) slotMark(mk(p), {kind: "back"}, rot(p));
  else { slotMark(mk(p), {kind: "pair", n: pairs + 1}, rot(p)); slotMark(mk(out), {kind: "pair", n: pairs + 1}, rot(out)); }
  lit.add(slotSq(p).join(",")); if (out >= 0) lit.add(slotSq(out).join(","));
  if (!hidden) for (const c of game.cats) lit.add(`${c % N + 1},${Math.floor(c / N) + 1}`);
  return [...lit].map(q => q.split(",").map(Number));
}
const undemo = () => { const d = $("demo"); if (d) { if (d.pathLayer) d.pathLayer.remove(); d.remove(); } };
function helpOnFirstVisit() {
  if (!game || !playing() || document.querySelector(".spot") || settings.seenHelp) return;
  const N = game.N, W = N + 2, sq = [], ring = [], t = tut(N), k = game.k;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) sq.push([x + 1, y + 1]);
  for (let j = 1; j <= N; j++) ring.push([j, 0], [W - 1, j], [j, W - 1], [0, j]);
  const turn = G.yourTurn(() => game, g => { game = g; }, draw);
  const column = [slotSq(t.grab), ...[...Array(N).keys()].map(y => [N, y + 1])];
  // a step whose squares are worked out as it comes up
  // (hidden: the cat stays under the blanket, and its square isn't lit; two: the second cat is there too)
  const run = (p, say, more = {}) => { const st = {say, lit: [], restore: turn.from.restore, ...more,
    enter() { tutTwo(!!more.two); if (!more.hidden) tutReveal(); st.lit.splice(0, st.lit.length, ...tutRun(p, more.hidden)); }}; return st; };
  const steps = [
    {say: "Find the cat under the blanket.", lit: sq, restore: turn.from.restore, enter() { turn.from.enter(); tutStart(); }},
    {say: "The cat loves to play with a long, bendy feather toy.", els: [() => $("tuttoy") || $("svg")], restore: turn.from.restore, enter: showToy, leave: hideToy},
    // each try goes straight on once the feather's in, to a step that says what happened and waits for a tap
    {say: "Place the feather toy under the blanket at any of the spots along the edge. Try this one.", lit: [slotSq(t.clear)], restore: turn.from.restore,
     try: {done: () => game.tutorial && game.shots.includes(t.clear)}},
    run(t.clear, "It went straight through. No cat there!", {hidden: true, leave: undemo}),
    {say: "Now, try this one.", lit: [slotSq(t.grab)], restore: turn.from.restore,
     try: {done: () => game.tutorial && game.shots.includes(t.grab)}},
    {say: "He stole the feather toy! That means he is hiding somewhere in this column.", lit: column, restore: turn.from.restore, enter() { undemo(); tutTwo(false); tutReveal(); }},
    run(t.turn, "A few other things to know: if the cat can bat at the feather toy but isn't close enough to steal it, then it will move like this."),
    run(t.back, "Or like this."),
    // the last practice step: leaving it puts your own blanket back
    run(t.turn, "And with a cat on each side, it comes back too.", {two: true, leave: turn.upTo.leave}),
    {say: `Now find the ${k} cats under this blanket. Tap a square to mark a lump.`, lit: sq},
    {say: `${2 * N} feathers or fewer for a gold paw`, lit: ring, later: true},
    {say: "All lumps down? Lift the blanket!", els: [$("liftBtn")]},
    {say: "Dot: a square with no cat", els: [$("dotBtn")]},
    {say: "Stuck? Hint shows a slot to try", els: [$("hintBtn")]},
  ];
  G.spotlight({grid: $("grid"), w: W, h: W, steps, map, done: () => { undemo(); turn.putBack(); settings.seenHelp = true; save(); }});
}

for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(levelName(n).replace("Level ", ""), n));
$("levelSel").onchange = e => { G.closeCard(); startLevel(+e.target.value); };
$("newBtn").onclick = () => { G.closeCard(); newPuzzle(); };
$("helpBtn").onclick = showHelp;
G.switch({id: "checkTgl", label: "Auto check", line: "Slots that don't fit your lumps turn red", key: "autoCheck", of: () => settings, save,
  tip: "Auto check: slots that don't fit turn red", change: () => { if (game) update(); }});
G.switch({id: "autoTgl", label: "Auto\u00a0Notes\u00a0🔢", line: "A dot on every square the feathers prove has no cat; costs the gold paw", key: "autoNotes", of: () => settings, save, warn: true,
  tip: "Auto Notes: dots for you, but no gold paw", change: () => { if (game) update(); }});

G.nav("blanket");
G.checkClock(game);
G.setupTimer({name: "blanket", game: () => game, playing: g => !g.won, save, label: levelName, noun: "level"});
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : settings.level);

if (!(settings.level >= 1 && settings.level <= MAX_LEVEL)) settings.level = 1;
$("levelSel").value = settings.level;
const shared = G.readShare("blanket");
const hadSave = !!game;
if (hadSave) G.reopen(() => {
    const spec = ubLevel(game.level), NN = game.N * game.N;
    if (!spec || spec.N !== game.N || game.marks.length !== NN || game.res.length !== 4 * game.N || game.cats.length !== game.k) throw new Error("the saved blanket doesn't fit its level");
    draw();
    if (game.won) finishCard();
    build.prefetch(settings.level); helpOnFirstVisit();
  }, why => { game = null; newPuzzle().then(() => G.note(why, 0)); });
else if (!shared) newPuzzle();
const shareOpts = () => ({name: "Under the Blanket", inProgress: !!(game && !game.won && (game.shots.length || game.history.length)), open: openShared, after: helpOnFirstVisit});
if (shared) G.offerShare(shared, {...shareOpts(), fresh: hadSave ? null : why => Promise.resolve(newPuzzle()).then(() => { G.note(why, 6000); })});
window.addEventListener("hashchange", () => { const d = G.readShare("blanket"); if (d) G.offerShare(d, shareOpts()); });
</script>
