<script>
const $ = G.$;
G.nav("pounce");

/* ---------- the rules (plain functions, no drawing) ---------- */
const N = 8;                                   // the mat is 8 × 8
const ROW = 1, COL = 2, BOMB = 3, NIP = 4;     // special toys: clears its row, its column, round about, or catnip
// Every line of three or more of one kind, across or down. Catnip (kind -1) never lines up.
function runsOf(g) {
  const out = [];
  for (let dir = 0; dir < 2; dir++) for (let a = 0; a < N; a++) {
    const at = x => dir ? x * N + a : a * N + x;
    let start = 0;
    for (let b = 1; b <= N; b++) {
      const k = g[at(start)] ? g[at(start)].k : -1;
      if (b < N && k >= 0 && g[at(b)] && g[at(b)].k === k) continue;
      if (k >= 0 && b - start >= 3) { const cells = []; for (let x = start; x < b; x++) cells.push(at(x)); out.push({cells, dir}); }
      start = b;
    }
  }
  return out;
}
// What a set of lines clears, and the special toys they make: four in a line makes a toy that
// clears that line, an L or T a toy that clears round about it, five catnip. A special toy is made
// where the player's toy landed, if it's part of the match.
function planMatches(g, moved) {
  const runs = runsOf(g); if (!runs.length) return null;
  const groups = [];
  for (const run of runs) {   // lines sharing a toy are one shape
    const touch = groups.filter(gr => run.cells.some(i => gr.cells.has(i)));
    const gr = touch[0] || {runs: [], cells: new Set()};
    if (!touch.length) groups.push(gr);
    for (const o of touch.slice(1)) { gr.runs.push(...o.runs); o.cells.forEach(i => gr.cells.add(i)); groups.splice(groups.indexOf(o), 1); }
    gr.runs.push(run); run.cells.forEach(i => gr.cells.add(i));
  }

  for (const gr of groups) {
    const cells = [...gr.cells], k = g[cells[0]].k, long = Math.max(...gr.runs.map(r => r.cells.length));
    const across = gr.runs.some(r => !r.dir), down = gr.runs.some(r => r.dir);
    const sp = long >= 5 ? NIP : across && down ? BOMB : long === 4 ? (across ? ROW : COL) : 0;
    let at = -1;
    if (sp) {
      const plain = i => !g[i].sp, cross = i => gr.runs.filter(r => r.cells.includes(i)).length > 1;
      const best = gr.runs.find(r => r.cells.length === long);
      at = moved.find(i => gr.cells.has(i) && plain(i)) ?? cells.find(i => plain(i) && sp === BOMB && cross(i))
        ?? [best.cells[best.cells.length >> 1], ...cells].find(plain) ?? -1;
      if (at >= 0) make.push({i: at, k: sp === NIP ? -1 : k, sp});

  }
  return {clear, make};
}
// Special toys caught up in a clear go off too, which can set off more. Returns what went off.
function blast(g, clear, keep = new Set()) {

  const add = i => { if (!clear.has(i) && !keep.has(i) && g[i]) { clear.add(i); queue.push(i); } };
  while (queue.length) {
    const i = queue.shift(), t = g[i]; if (!t || !t.sp) continue;
    const r = Math.floor(i / N), c = i % N, f = {i, sp: t.sp};
    if (t.sp === ROW) for (let x = 0; x < N; x++) add(r * N + x);
    if (t.sp === COL) for (let y = 0; y < N; y++) add(y * N + c);
    if (t.sp === BOMB) for (let y = r - 1; y <= r + 1; y++) for (let x = c - 1; x <= c + 1; x++) if (y >= 0 && y < N && x >= 0 && x < N) add(y * N + x);
    if (t.sp === NIP) {  // catnip set off by something else takes the commonest kind
      let k = t.nip;

        const count = {}; g.forEach((s, j) => { if (s && s.k >= 0 && !clear.has(j)) count[s.k] = (count[s.k] || 0) + 1; });
        k = +Object.keys(count).sort((a, b) => count[b] - count[a])[0];
      }
      if (k === -2) g.forEach((s, j) => s && add(j));   // catnip on catnip: everything
      else g.forEach((s, j) => s && s.k === k && add(j));

    }
    fx.push(f);
  }
  return fx;
}
// A swap the rules allow: it lines up three, or uses catnip, or puts two special toys together.
function swapPlan(g, a, b) {
  const A = g[a], B = g[b];
  if (A.sp === NIP || B.sp === NIP) {
    const nip = A.sp === NIP ? a : b, other = nip === a ? B : A;
    g[nip].nip = other.sp === NIP ? -2 : other.k;
    return {clear: new Set(other.sp && other.sp !== NIP ? [a, b] : [nip]), make: []};
  }
  if (A.sp && B.sp) return {clear: new Set([a, b]), make: []};

}
function swapCells(g, a, b) { const t = g[a]; g[a] = g[b]; g[b] = t; }
function findMove(g) {
  for (let i = 0; i < N * N; i++) for (const j of [i % N < N - 1 ? i + 1 : -1, i + N < N * N ? i + N : -1]) {
    if (j < 0) continue;
    if (g[i].sp === NIP || g[j].sp === NIP || (g[i].sp && g[j].sp)) return [i, j];
    swapCells(g, i, j); const ok = runsOf(g).some(r => r.cells.includes(i) || r.cells.includes(j)); swapCells(g, i, j);
    if (ok) return [i, j];
  }
  return null;
}
let nextId = 1;
const piece = (k, sp = 0) => ({id: nextId++, k, sp});
// A fresh mat with nothing lined up yet and at least one swap to make.
function newMat(kinds, rnd = Math.random) {
  for (;;) {
    const g = [];
    for (let i = 0; i < N * N; i++) {
      const r = Math.floor(i / N), c = i % N;
      let k;
      do k = kinds[Math.floor(rnd() * kinds.length)];
      while ((c >= 2 && g[i - 1].k === k && g[i - 2].k === k) || (r >= 2 && g[i - N].k === k && g[i - 2 * N].k === k));
      g.push(piece(k));

}
// Mix the toys up when there's no swap left, keeping every toy (special ones too).
function remix(g, kinds, rnd = Math.random) {
  for (let tries = 0; tries < 300; tries++) {
    const order = g.slice();
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    if (!runsOf(order).length && findMove(order)) return order;

// Toys drop to fill the gaps and new ones fall in from the top. Returns the new toys with how far
// above the mat each starts.
function dropDown(g, kinds, rnd = Math.random) {

    let w = N - 1;
    for (let r = N - 1; r >= 0; r--) { const t = g[r * N + c]; if (t) { g[r * N + c] = null; g[w * N + c] = t; w--; } }
    const gap = w + 1;

  }

}
// Levels 1 to 20: more kinds of toy (so fewer lines line up by luck), more kinds to catch, and more of each.
// How many moves each level gives was tuned with a simulated player that looks one swap ahead, so it
// wins nearly every time at level 1 and about half the time at level 20.
const MAX_LEVEL = 20;
const NEED = [15, 20, 14, 16, 16, 18, 20, 22, 16, 17, 18, 19, 20, 20, 21, 22, 23, 24, 25, 26];
const MOVES = [15, 15, 12, 12, 21, 21, 22, 24, 20, 20, 21, 21, 21, 21, 21, 22, 23, 23, 24, 25];
function params(n) {
  return {K: n <= 4 ? 5 : 6, goals: n <= 2 ? 1 : n <= 8 ? 2 : 3, moves: MOVES[n - 1], need: NEED[n - 1]};
}
// Ten kinds of toy, one per colour from the games' palette, so they're easy to tell apart. Each level
// picks some kinds and one picture for each. Pictures come from the shared toy library in ../toys/.
const KINDS = [
  {c: "#BD5538", looks: [["wiffle-red", "red wiffle balls"], ["swirl-red", "red swirl balls"], ["crochet-stars", "star balls"], ["tinsel", "tinsel balls"]]},
  {c: "#ECA818", looks: [["wiffle-yellow", "yellow wiffle balls"]]},
  {c: "#73A7AE", looks: [["wiffle-teal", "teal wiffle balls"], ["fish", "fish"]]},
  {c: "#6AA673", looks: [["lattice", "lattice balls"]]},
  {c: "#B3B94B", looks: [["spiky-lime", "spiky pom-poms"]]},
  {c: "#B94588", looks: [["swirl-purple", "plum swirl balls"], ["bell-purple", "bell balls"]]},
  {c: "#7885BA", looks: [["spring", "springs"], ["rope-blue", "rope balls"]]},
  {c: "#825840", looks: [["cork-paw", "cork paw balls"], ["burlap-paws", "burlap balls"], ["rattan", "rattan balls"]]},
  {c: "#5E5866", looks: [["mouse", "mice"]]},
  {c: "#E16A4A", looks: [["felt-rainbow", "rainbow balls"], ["ribbon-tail", "ribbon balls"], ["spiky-rainbow", "spiky balls"]]},
];
// Level 0 is zen: six kinds of toy, nothing to catch and no move limit.
// `off` holds the toy pictures the player has left out; a colour with none left isn't dealt.
const lookIdx = (k, off) => { const ok = KINDS[k].looks.map((_, j) => j).filter(j => !off.has(KINDS[k].looks[j][0])); return ok.length ? ok : KINDS[k].looks.map((_, j) => j); };
function makeLevel(n, rnd = Math.random, off = new Set()) {
  const p = n ? params(n) : {K: 6, goals: 0, need: 0, moves: null};
  let all = KINDS.map((_, i) => i).filter(k => KINDS[k].looks.some(([f]) => !off.has(f)));
  if (all.length < p.K) all = KINDS.map((_, i) => i);
  for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
  const kinds = all.slice(0, p.K).sort((a, b) => a - b);
  const look = KINDS.map((_, k) => { const ok = lookIdx(k, off); return ok[Math.floor(rnd() * ok.length)]; });
  const goals = kinds.slice().sort(() => rnd() - 0.5).slice(0, p.goals).map(k => ({k, need: p.need, got: 0}));
  return {kinds, look, goals, moves: p.moves, grid: newMat(kinds, rnd).map(t => [t.k, t.sp]), helped: false, extra: 0, caught: 0};
}

/* ---------- pictures ---------- */
const TOY_SRC = {};  // filled with embedded pictures when the page is bundled into one file
const toyImgs = {};
const toySrc = f => TOY_SRC[f] || `../toys/${f}.webp?v=${window.SITE_BUILD || ""}`;  // a new version gets new pictures
for (const k of KINDS) for (const [f] of k.looks) {
  const img = new Image();
  img.onload = () => { toyImgs[f] = img; };
  img.src = toySrc(f);
}
let S = null;   // the level being played
const lookOf = k => KINDS[k].looks[(S && S.d.look[k]) || 0] || KINDS[k].looks[0];

/* ---------- playing ---------- */
const U = 50, W = N * U;     // drawing units per square; the canvas is scaled to fit
const STORE = "catdoku.pounce.v1";
let climb = 1;   // the level to go back to after zen
// Toy pictures the player has chosen to leave out, kept on this device.
const TOYS_PREF = "catdoku.pounce.toys.v1", MIN_COLOURS = 6;
let offToys = G.toysOff(TOYS_PREF);
const deal = n => makeLevel(n, Math.random, offToys);
let busy = false, picked = -1, cursor = -1, now = 0, effects = [], hintAt = 0, hint = null;
const save = () => { if (S && !S.over) { S.d.grid = S.g.map(t => [t.k, t.sp]); S.d.ms = S.ms; G.save(STORE, {level: S.level, d: S.d, climb}); } };

function start(level, d) {
  if (d.kinds.some(k => !KINDS[k]) || d.grid.length !== N * N) throw new Error("the saved level is from another version of the game");
  const g = d.grid.map(([k, sp]) => piece(k, sp));
  g.forEach((t, i) => { t.x = i % N; t.y = Math.floor(i / N); });
  S = {level, N: level, ...G.freshClock(), d, g, over: false};
  if (level) climb = level; else S.timed = false;   // zen isn't timed
  if (d.ms) { S.ms = d.ms; S.started = true; }
  busy = false; picked = -1; effects = []; hint = null; hintAt = now + 6;
  $("levelSel").value = level;
  G.save(STORE, {level, d, climb}); hud(true);
  $("restartBtn").textContent = level ? "Restart level" : "New board";
  G.note(level ? "" : `Zen: no goals and no move limit. Pick level ${climb} to carry on with the levels.`, level ? 3500 : 8000);
  if (level && !d.moves) outOfMoves();   // saved after the last move ran out
}
function startLevel(level) {
  level = level === 0 ? 0 : Math.min(MAX_LEVEL, Math.max(1, level));

  start(level, deal(level));
}
for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(n === MAX_LEVEL ? `${n} (hardest)` : String(n), n));
$("levelSel").append(new Option("Zen (no goals)", 0));
$("levelSel").onchange = e => { G.closeCard(); startLevel(+e.target.value); };
// A fresh board at this level (zen keeps its count of toys caught).
const newBoard = () => start(S.level, Object.assign(deal(S.level), {helped: S.d.helped, caught: S.level ? 0 : S.d.caught}));
$("restartBtn").onclick = () => { if (S) { G.closeCard(); newBoard(); } };

const left = gl => Math.max(0, gl.need - gl.got);
const toyName = (n, k) => { const many = lookOf(k)[1]; return `${n} ${n !== 1 ? many : {mice: "mouse", fish: "fish"}[many] || many.replace(/s$/, "")}`; };
function hud(rebuild) {

  m.textContent = zen ? `✨ ${c} ${c === 1 ? "toy" : "toys"} caught` : `🐾 ${n} ${n === 1 ? "move" : "moves"}`;
  m.classList.toggle("low", !zen && n > 0 && n <= 3); m.classList.toggle("out", !zen && n === 0);
  const box = $("goals"); box.hidden = zen;
  if (rebuild || box.children.length !== S.d.goals.length) {
    box.innerHTML = "";
    for (const gl of S.d.goals) box.append(goalChip(gl.k));

  S.d.goals.forEach((gl, i) => {
    const el = box.children[i], b = el.querySelector("b"), txt = left(gl) ? String(left(gl)) : "✓";
    if (b.textContent !== txt) { b.textContent = txt; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }

function goalChip(k) {

const sleep = s => new Promise(res => setTimeout(res, s * 1000));
// Slide a toy to its square from wherever it's drawn now.
function slide(t, i, dur, fall) { t.fx = t.x; t.fy = t.y; t.tx = i % N; t.ty = Math.floor(i / N); t.t0 = now; t.dur = dur; t.fall = fall; }

async function trySwap(a, b) {

    swapCells(g, a, b); slide(g[a], a, 0.16); slide(g[b], b, 0.16);
    await sleep(0.17);

// was started meanwhile.
async function settle(plan) {
  const game = S, g = S.g; let round = 0;

    round++;

}
function afterMove() {
  save();

  if (S.level && !S.d.moves) return outOfMoves();
  if (!findMove(S.g)) {
    G.note("No swaps left, so the toys get a shake.", 3000);
    S.g = remix(S.g, S.d.kinds);
    S.g.forEach((t, i) => { if (t.x === undefined) { t.x = i % N; t.y = Math.floor(i / N) - N; } slide(t, i, 0.45); });
    save();
  }
}
function win() {
  S.over = true;
  G.track(`Pounce level ${S.level} done`);
  const result = G.finishClock(S), spare = S.d.moves;
  // A level won without a hint or extra moves moves you up; otherwise you play this level again.
  const helped = S.d.helped, next = helped ? S.level : Math.min(MAX_LEVEL, S.level + 1);
  climb = next; G.save(STORE, {level: next, climb});
  const spareText = spare ? ` with ${spare} ${spare === 1 ? "move" : "moves"} to spare` : " on the very last move";
  const text = helped ? `Level ${S.level} done${spareText}. Next up: another level ${next}.`
    : next > S.level ? `Level ${S.level} done${spareText}. Next up: level ${next}.`
    : `Level ${S.level} done${spareText}. That's the hardest level; next up is another one.`;
  const game = S;
  setTimeout(() => S === game && G.winCard(text, () => { G.closeCard(); startLevel(next); }, "Admire my board", result, {title: "Purr-fect!", gold: !!S.level && !helped, goldWhy: "No hints used!", next: `Next: level ${next}`,
    after: G.otherSize($("levelSel"), next, startLevel, "Or play a different level:")}), 700);
}
function outOfMoves() {
  S.over = true;
  const still = S.d.goals.filter(left).map(gl => toyName(left(gl), gl.k));
  const list = still.length > 1 ? still.slice(0, -1).join(", ") + " and " + still[still.length - 1] : still[0];
  const btns = [];
  if (S.d.extra < 1) btns.push(["5 more moves", () => {
    G.closeCard(); S.d.extra++; S.d.helped = true; S.d.moves += 5; S.over = false; hud(); save(); hintAt = now + 3;
  }, true]);
  btns.push(["Try again", () => { G.closeCard(); start(S.level, Object.assign(deal(S.level), {helped: S.d.helped})); }, !btns.length]);
  G.openCard("Out of moves!", `Still to catch: ${list}.`, btns, null,
    G.otherSize($("levelSel"), S.level, startLevel, "Or play a different level:"));
}

/* ---------- drawing ---------- */
const canvas = $("board"), ctx = canvas.getContext("2d");
let scale = 1, bg = null;
const PI = Math.PI;
const circle = (g, x, y, r) => { g.beginPath(); g.arc(x, y, r, 0, 2 * PI); };
const ease = u => 1 - Math.pow(1 - u, 3);
// A quilted mat: two soft squares in a checker, with stitching.
function buildBg() {
  bg = document.createElement("canvas"); bg.width = canvas.width; bg.height = canvas.height;
  const g = bg.getContext("2d"); g.setTransform(scale, 0, 0, scale, 0, 0);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    g.fillStyle = (r + c) % 2 ? "#E8DCC6" : "#F3EBDC"; g.fillRect(c * U, r * U, U, U);
  }
  g.strokeStyle = "rgba(120,90,55,.28)"; g.lineWidth = 1.2; g.setLineDash([4, 4]);
  for (let k = 1; k < N; k++) {
    g.beginPath(); g.moveTo(k * U, 0); g.lineTo(k * U, W); g.stroke();
    g.beginPath(); g.moveTo(0, k * U); g.lineTo(W, k * U); g.stroke();
  }
  g.setLineDash([]);
}
// A catnip sprig: a bunch of leaves round a flower.
function drawNip(s) {
  for (let a = 0; a < 6; a++) {
    ctx.save(); ctx.rotate(a * PI / 3 + 0.3); ctx.translate(0, -s * 0.42);
    ctx.fillStyle = a % 2 ? "#4E9A3F" : "#2F7A2A"; ctx.beginPath(); ctx.ellipse(0, 0, s * 0.17, s * 0.34, 0, 0, 2 * PI); ctx.fill();
    ctx.strokeStyle = "rgba(220,255,200,.7)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, -s * 0.28); ctx.lineTo(0, s * 0.28); ctx.stroke();
    ctx.restore();
  }
  for (let a = 0; a < 5; a++) { ctx.fillStyle = "#E6D7F5"; circle(ctx, Math.cos(a * 1.257) * s * 0.12, Math.sin(a * 1.257) * s * 0.12, s * 0.1); ctx.fill(); }
  ctx.fillStyle = "#B94588"; circle(ctx, 0, 0, s * 0.08); ctx.fill();
}
// One toy at (x, y) in squares. Special toys get a mark behind them that shows what they do.
function drawToy(k, sp, x, y, size = 1, born = -9) {
  const cx = (x + 0.5) * U, cy = (y + 0.5) * U, grow = now - born < 0.3 ? 1 + 0.4 * Math.sin((now - born) / 0.3 * PI) : 1;
  const s = U * 0.86 * size * grow;
  ctx.save(); ctx.translate(cx, cy);
  if (sp === ROW || sp === COL) {   // zoomies: a bright band along the line it clears, with arrows at the ends
    if (sp === COL) ctx.rotate(PI / 2);
    ctx.fillStyle = "rgba(244,200,74,.85)"; ctx.beginPath(); ctx.roundRect(-U * 0.48, -U * 0.14, U * 0.96, U * 0.28, U * 0.14); ctx.fill();
    ctx.fillStyle = "#2A2530";
    for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(d * U * 0.47, 0); ctx.lineTo(d * U * 0.36, -U * 0.1); ctx.lineTo(d * U * 0.36, U * 0.1); ctx.fill(); }
    if (sp === COL) ctx.rotate(-PI / 2);
  }
  if (sp === BOMB) {                // bouncy: a glowing ring
    const p = 0.5 + 0.5 * Math.sin(now * 5);
    ctx.fillStyle = `rgba(244,200,74,${0.35 + 0.3 * p})`; circle(ctx, 0, 0, U * 0.48); ctx.fill();
    ctx.strokeStyle = "#E8A013"; ctx.lineWidth = 2.5; ctx.setLineDash([5, 4]); ctx.lineDashOffset = -now * 12; circle(ctx, 0, 0, U * 0.45); ctx.stroke(); ctx.setLineDash([]);
  }
  if (sp === NIP) {
    ctx.rotate(Math.sin(now * 2) * 0.15);
    ctx.fillStyle = "rgba(255,255,255,.5)"; circle(ctx, 0, 0, U * 0.46); ctx.fill();
    drawNip(s); ctx.restore(); return;
  }
  ctx.fillStyle = "rgba(60,40,10,.15)"; ctx.beginPath(); ctx.ellipse(1.5, 3, s * 0.4, s * 0.36, 0, 0, 2 * PI); ctx.fill();
  const img = toyImgs[lookOf(k)[0]];
  if (img) ctx.drawImage(img, -s / 2, -s / 2, s, s);
  else {   // a drawn stand-in until the picture loads
    circle(ctx, 0, 0, s * 0.4); ctx.fillStyle = KINDS[k].c; ctx.fill();
    const gr = ctx.createRadialGradient(-s * 0.14, -s * 0.16, 1, 0, 0, s * 0.4);
    gr.addColorStop(0, "rgba(255,255,255,.5)"); gr.addColorStop(0.45, "rgba(255,255,255,0)"); gr.addColorStop(1, "rgba(0,0,0,.2)");
    ctx.fillStyle = gr; ctx.fill();

}
function place(t) {   // where a toy is drawn now, in squares
  if (t.t0 === undefined) return;
  const u = Math.min(1, (now - t.t0) / t.dur);
  // falling toys speed up and land with a little bounce; swapped toys ease
  const e = t.fall ? (u < 0.85 ? Math.pow(u / 0.85, 2) : 1 + Math.sin((u - 0.85) / 0.15 * PI) * 0.06) : ease(u);
  t.x = t.fx + (t.tx - t.fx) * e; t.y = t.fy + (t.ty - t.fy) * e;
  if (u >= 1) { t.x = t.tx; t.y = t.ty; delete t.t0; }
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (bg) ctx.drawImage(bg, 0, 0);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (!S) return;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, W); ctx.clip();   // toys falling in appear from the top edge
  const hl = (i, col) => { ctx.strokeStyle = col; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.roundRect((i % N) * U + 3, Math.floor(i / N) * U + 3, U - 6, U - 6, 10); ctx.stroke(); };
  if (picked >= 0) { ctx.fillStyle = "rgba(115,167,174,.3)"; ctx.fillRect((picked % N) * U, Math.floor(picked / N) * U, U, U); }
  S.g.forEach((t, i) => {
    if (!t) return;
    place(t);
    let wx = 0;
    if (hint && hint.includes(i)) { const o = hint[0] === i ? hint[1] : hint[0], d = Math.sin((now - hintAt) * 9) * 0.06 * Math.max(0, Math.sin((now - hintAt) * 1.6));
      wx = d; t.x += (o % N - i % N) * wx; t.y += (Math.floor(o / N) - Math.floor(i / N)) * wx; }
    drawToy(t.k, t.sp, t.x, t.y, 1, t.born);
    if (wx) { const o = hint[0] === i ? hint[1] : hint[0]; t.x -= (o % N - i % N) * wx; t.y -= (Math.floor(o / N) - Math.floor(i / N)) * wx; }
  });
  if (picked >= 0) hl(picked, "#2A2530");
  if (cursor >= 0 && document.activeElement === canvas) hl(cursor, "#73A7AE");
  effects = effects.filter(e => now < e.t0 + e.dur);
  for (const e of effects) {
    if (now < e.t0) { if (e.type === "pop") drawToy(e.k, e.sp, e.x, e.y); continue; }
    const u = (now - e.t0) / e.dur;
    if (e.type === "pop") {
      const size = u < 0.3 ? 1 + u : 1.3 * (1 - (u - 0.3) / 0.7);
      if (size > 0.02) drawToy(e.k, e.sp, e.x, e.y, size);
      ctx.fillStyle = e.k >= 0 ? KINDS[e.k].c : "#4E9A3F"; ctx.globalAlpha = 1 - u;
      const cx = (e.x + 0.5) * U, cy = (e.y + 0.5) * U;
      for (let i = 0; i < 6; i++) { const a = i * PI / 3 + e.x; circle(ctx, cx + Math.cos(a) * (10 + u * 24), cy + Math.sin(a) * (10 + u * 24), 2.6); ctx.fill(); }
      ctx.globalAlpha = 1;
    } else if (e.type === ROW || e.type === COL) {   // a streak of light along the line
      const r = Math.floor(e.i / N), c = e.i % N, a = 1 - u, w = U * (0.3 + 0.7 * Math.sin(u * PI));
      ctx.fillStyle = `rgba(255,236,160,${a})`;
      if (e.type === ROW) ctx.fillRect(0, (r + 0.5) * U - w / 2, W, w); else ctx.fillRect((c + 0.5) * U - w / 2, 0, w, W);
    } else if (e.type === BOMB) {
      const cx = (e.i % N + 0.5) * U, cy = (Math.floor(e.i / N) + 0.5) * U;
      ctx.strokeStyle = `rgba(232,160,19,${1 - u})`; ctx.lineWidth = 8 * (1 - u) + 1; circle(ctx, cx, cy, U * (0.4 + 1.3 * ease(u))); ctx.stroke();
    } else if (e.type === NIP) {
      ctx.fillStyle = `rgba(110,190,90,${0.35 * (1 - u)})`; ctx.fillRect(0, 0, W, W);
    }
  }
  ctx.restore();
  for (const e of effects) if (e.type === "cheer" && now >= e.t0) {
    const u = (now - e.t0) / e.dur, sz = 44 * (u < 0.15 ? 0.6 + u / 0.15 * 0.4 : 1);
    ctx.save(); ctx.globalAlpha = u > 0.7 ? (1 - u) / 0.3 : 1; ctx.font = `800 ${sz}px 'Baloo 2', system-ui, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    ctx.strokeStyle = "#2A2530"; ctx.lineWidth = 8; ctx.strokeText(e.text, W / 2, W / 2 - u * 30);
    ctx.fillStyle = "#FFF4D2"; ctx.fillText(e.text, W / 2, W / 2 - u * 30); ctx.restore();
  }
}
function resize() {
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (!r.width) return;
  canvas.width = canvas.height = Math.round(r.width * dpr);
  scale = canvas.width / W;
  buildBg();
}
new ResizeObserver(resize).observe(canvas);

let last = performance.now();
function loop(t) {
  now += Math.min(0.05, (t - last) / 1000); last = t;
  draw();
  requestAnimationFrame(loop);
}

/* ---------- input ---------- */
// Drag a toy onto a neighbour, or tap one toy and then the other.
let press = null;
const cellAtPoint = e => {
  const r = canvas.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / r.width * N), y = Math.floor((e.clientY - r.top) / r.height * N);
  return x >= 0 && x < N && y >= 0 && y < N ? y * N + x : -1;
};
canvas.addEventListener("pointerdown", e => {
  if (!S || S.over || busy) return;
  const i = cellAtPoint(e); if (i < 0) return;
  e.preventDefault(); hint = null; hintAt = now + 6; cursor = -1;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  press = {i, x: e.clientX, y: e.clientY};
});
canvas.addEventListener("pointermove", e => {
  if (!press) return;
  const r = canvas.getBoundingClientRect(), dx = e.clientX - press.x, dy = e.clientY - press.y, far = r.width / N * 0.35;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < far) return;
  const i = press.i, c = i % N, j = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? (c < N - 1 ? i + 1 : -1) : (c > 0 ? i - 1 : -1)) : (dy > 0 ? i + N : i - N);
  press = null;
  if (j >= 0 && j < N * N) trySwap(i, j);
});
canvas.addEventListener("pointerup", e => {
  if (!press) return;
  const i = press.i; press = null;
  tapCell(i);
});
canvas.addEventListener("pointercancel", () => { press = null; });
function tapCell(i) {
  if (picked >= 0 && neighbours(picked, i)) return trySwap(picked, i);
  picked = picked === i ? -1 : i;
}
canvas.addEventListener("keydown", e => {
  if (!S || S.over) return;
  const moves = {ArrowLeft: -1, ArrowRight: 1, ArrowUp: -N, ArrowDown: N};
  if (cursor < 0) cursor = picked >= 0 ? picked : 0;
  if (moves[e.key] !== undefined) {
    e.preventDefault(); hint = null; hintAt = now + 6;
    const j = cursor + moves[e.key];
    if (j >= 0 && j < N * N && neighbours(cursor, j)) cursor = j;
  } else if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!busy) tapCell(cursor); }
  else if (e.key === "Escape") picked = -1;
});

/* ---------- how to play ---------- */
function helpCard() {
  const media = document.createElement("div"), ol = document.createElement("ol"); ol.className = "steps";
  for (const t of ["Swap two toys next to each other to line up three or more of a kind.",
                   "Catch the toys shown above the mat before your moves run out.",
                   "Line up four to make a toy with the zoomies (it clears its line), an L or T for a bouncy one (it clears round about it), or five for catnip (swap it with a toy to clear every toy of that kind).",
                   "Stuck? Hint wiggles two toys you can swap.",
                   "Zen, at the end of the level list, has no goals and no move limit."]) {
    const li = document.createElement("li"); li.textContent = t; ol.append(li);
  }
  const tip = document.createElement("p"); tip.className = "tip";
  tip.textContent = "Drag a toy onto its neighbour, or tap one and then the other.";
  media.append(ol, tip);
  G.openCard("How to play", "", [["Show me on the board", () => { G.closeCard(); intro(true); }, true], ["Got it", G.closeCard]], media);
}
$("helpBtn").onclick = helpCard;
// Hint: two toys that can be swapped give a little wiggle. Like any help, it keeps you on this level (not in zen).
$("hintBtn").onclick = () => {
  if (!S || S.over || busy || document.querySelector(".spot")) return;
  hint = findMove(S.g); hintAt = now;
  if (S.level && !S.d.helped) { S.d.helped = true; save(); }
};

/* ---------- first-time spotlight ---------- */
// The first visit (or "Show me on the board") walks through a real swap on the mat that's out: the two
// toys, then the same two swapped (just while that step is up) with the line they make, then the goals
// and the moves.
const INTRO = "catdoku.pounce.intro.v1";
function intro(again) {
  if (!again && G.load(INTRO).seen) return;
  if (!S || S.over || busy || document.querySelector(".spot")) return;
  const mv = findMove(S.g); if (!mv) return;
  const [a, b] = mv, xy = i => [i % N, Math.floor(i / N)];
  const swapOver = () => { swapCells(S.g, a, b); slide(S.g[a], a, 0.2); slide(S.g[b], b, 0.2); };
  let line = [a, b];
  swapCells(S.g, a, b);
  const run = runsOf(S.g).find(r => r.cells.includes(a) || r.cells.includes(b)); if (run) line = run.cells;
  swapCells(S.g, a, b);
  hint = null; hintAt = Infinity;
  // Special toys: lay out a shape in one kind of toy, with the special toy it makes in it, just while
  // the step is up; the mat goes back as it was.
  const r = N >> 1, k0 = S.g[r * N + 2].k >= 0 ? S.g[r * N + 2].k : S.d.kinds[0];
  const shape = (cells, at, sp) => {
    let before;
    return {lit: cells.map(xy),
      enter: () => { before = cells.map(i => [S.g[i].k, S.g[i].sp]); cells.forEach(i => { S.g[i].k = k0; S.g[i].sp = 0; });
                     S.g[at].sp = sp; if (sp === NIP) S.g[at].k = -1; },
      leave: () => { cells.forEach((i, j) => { [S.g[i].k, S.g[i].sp] = before[j]; }); }};
  };
  const row = n => [...Array(n).keys()].map(c => r * N + 2 + c);
  const steps = [
    {say: "Swap two toys next to each other", lit: [xy(a), xy(b)], outline: [[xy(a)], [xy(b)]]},
    {say: "Line up three or more of a kind and they disappear from the board", lit: line.map(xy), enter: swapOver, leave: swapOver},
    {say: "Line up four for a toy with the zoomies: it clears its whole line", ...shape(row(4), r * N + 3, ROW)},
    {say: "Line up an L for a bouncy toy: it clears all around it", ...shape([...row(3), (r - 1) * N + 2, (r - 2) * N + 2], r * N + 2, BOMB)},
    {say: "or a T", ...shape([...row(3), (r + 1) * N + 3, (r + 2) * N + 3], r * N + 3, BOMB)},
    {say: "Line up five for catnip: swap it to clear every toy of one kind", ...shape(row(5), r * N + 4, NIP)},
  ];
  if (S.level) steps.push({say: "Catch the toys shown above", els: [[...$("goals").children]]},
                          {say: "Before your moves run out", els: [$("moves")]},
                          {say: "Or play zen mode", els: [$("levelSel")]});
  G.spotlight({grid: canvas, w: N, h: N, steps, done: () => { G.save(INTRO, {seen: true}); hintAt = now + 6; }});
}

/* ---------- choosing toys ---------- */
const toyChest = () => ({kinds: KINDS, off: offToys, min: MIN_COLOURS, src: toySrc, save: off => {
  offToys = off; G.saveToys(off);
  if (S && !S.over && S.d.kinds.some(k => off.has(lookOf(k)[0]))) { newBoard(); G.note("Here's a new board with your toys.", 4000); }
  else G.note("Saved. Your toys are used from the next board.", 4000);
}});
$("toysBtn").onclick = () => G.toyPicker(toyChest());
G.needToys({...toyChest(), off: () => offToys, game: "Pounce"});
G.setupTimer({name: "pounce", game: () => S, playing: g => !g.over, save,
  label: n => `Level ${n}`, noun: "level",
  emptyText: "Finish a level and your times will show up here. They're kept on this device only."});
$("bestBtn").onclick = () => G.showBests("Best times", S && S.level ? S.level : climb);

const saved = G.load(STORE), first = saved.level ?? 1;
climb = saved.climb || saved.level || 1;
G.reopen(() => { if (saved.d && first <= MAX_LEVEL) start(first, saved.d); else startLevel(first); },
  why => { startLevel(first); G.note(why, 0); });
// Players from before the spotlight had the How to play card instead, so it's only for new players.
if (saved.level !== undefined && !G.load(INTRO).seen) G.save(INTRO, {seen: true});
intro();
requestAnimationFrame(loop);
</script>
