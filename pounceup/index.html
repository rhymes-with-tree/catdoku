<script>
/* ---------- the world ---------- */
// The bookcase is 300 units across; the window onto it is 400 tall and only ever moves up. y counts up from the floor.
// A foot is 30 units (Rayla is about two feet long, nose to tail).
const W = 300, VH = 400, SIDE = 10, FT = 30;
// A pounce clears about 4⅓ feet (a spring about 12½); she lands, crouches a moment (SETTLE seconds), then pounces again.
const GRAV = 800, POUNCE = 456, SPRING = 780, ZOOM = 650, RUN = 210, SETTLE = .45, WALK = 120;
const ENDLESS = 12;
/* ---------- sound ---------- */
// The owner's picks from the listening page (2026-11-14), played through G.sound (games.js; on unless Settings turns it
// off). Knocking over a glass of water has none of its own yet: it's to come from a sound library (TODO.md).
const S = G.sound.kit;
G.sound.define({
  "pounce.pounce": t => S.tone({fs: [[0, 260], [.14, 620]], t, dur: .14, vol: .2, a: .01}),   // a soft boing
  "pounce.land": t => S.thump(t, .4, 140),   // soft paws
  "pounce.swat": t => S.whoosh(t, 900, 2600, .1, .25),   // the swipe, and nothing as it lands far below (the owner, 2026-11-14)
  "pounce.spring": t => S.tone({fs: [[0, 180], [.45, 1400]], t, dur: .5, vol: .18, a: .01, hold: .3, vib: [14, 40, 0]}),   // launch
  "pounce.fish": t => { S.tone({f: 1319, type: "triangle", t, dur: .08, vol: .15}); S.tone({f: 1976, type: "triangle", t: t + .07, dur: .14, vol: .15}); },   // two notes up
  "pounce.tape": t => S.mrrp(t),   // "mrrp?" (tape is a mrrp in every game: the owner, 2026-11-14)
  "pounce.walk": t => { for (let i = 0; i < 4; i++) S.tick(t + i * .11, .08, 1800); },   // tiny ticks
  "pounce.loose": t => { S.noise({t, dur: .03, vol: .6, type: "highpass", f: 1500, a: .001}); S.modal({t, parts: [[200, 1, .15], [520, .4, .1]], vol: .3, click: 0}); S.noise({t: t + .05, dur: .3, vol: .2, type: "lowpass", fs: [[0, 600], [.3, 150]]}); },   // crack
  "pounce.lemon": t => S.hiss(t),   // a hiss
  "pounce.candle": t => S.hiss(t, .35, .3),   // a short hiss
  "pounce.nip": t => S.tone({f: 600, t, dur: 1.0, vol: .12, a: .1, hold: .5, vib: [7, 80]}),   // rolling in catnip: a wobbly slide
  "pounce.zoomies": (t, o) => S.whoosh(t, 300, o.big ? 4000 : 2500, o.big ? .9 : .6, .35),   // a rising whoosh
  "pounce.mellow": t => S.slideDown(t, 700, 350, 1.0, .12),   // too mellow: a slow slide down
  "pounce.miss": t => [659, 523, 440].forEach((f, i) => S.mallet({f, t: t + i * .16, dur: .4, vol: .16})),   // notes down
  "pounce.basket": t => [784, 659, 523].forEach((f, i) => S.musicBox({f, t: t + i * .35, dur: 1.2, vol: .12})),   // a lullaby
  "pounce.best": t => [1047, 1319, 1568].forEach((f, i) => S.bell({f, t: t + i * .08, dur: .6, vol: .08, ratio: 2.01, index: .7})),   // past your best, on Endless
});
const BASKET_X = W / 2 + 70;   // where the basket stands on top of the bookcase
// Level n: the height of the bookcase in feet, and from which level each new thing turns up
const GOALS = [null, 40, 55, 70, 85, 100, 120, 140, 160, 185, 210, 240];
const FROM = {swat: 1, spring: 2, lemon: 3, candle: 5, slide: 7, tape: 8, nip: 9, loose: 10};
const NEW = {swat: "Rayla swats off anything with a gold sparkle: land beside it, or walk into it!", spring: "A spring! Land on it for a big pounce.",
  lemon: "A lemon! Rayla can't stand citrus, so land clear of it.", candle: "A candle! Keep Rayla's whiskers out of the flame.",
  slide: "Some shelves slide from side to side.", tape: "Tape! Rayla won't land on it.",
  loose: "Cracked shelves give way, so don't land on them!", nip: "Catnip! Land on it and Rayla rolls around in it… and then who knows!"};
// Each level's goal, as well as reaching the basket (the owner's idea, 2026-11-11): never the same goal twice, and
// each about the thing that level brings in, a thing to touch (knock off, springs, fish, glasses of water, catnip) or one
// not to (lemons, candles, tape, cracked shelves), with a race on the sliding shelves and a tidy climb to finish.
// A count goal (n) is never more than half of what that bookcase holds (planTask). Touching what a level is about
// avoiding ends the climb; elsewhere those things just give her a fright. On the tidy level a shelf has at most one thing
// to knock off, and only a wide shelf with no lemon, candle or tape on it, so there's always room to land clear of it,
// at least 41 units (checked over 3,000 bookcases; she's about 36 across crouched).
const TASKS = [null, {kind: "knock", n: 5}, {kind: "springs", n: 3}, {kind: "lemons"}, {kind: "fish", n: 8}, {kind: "candles"},
  {kind: "water", n: 6}, {kind: "time", s: 90}, {kind: "tape"}, {kind: "nip", n: 3}, {kind: "loose"}, {kind: "tidy"}];
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const TASK_TEXT = {
  knock: t => [`Knock off ${plural(t.n, "thing", "things")} on the way up!`, `knock off ${t.n}`],
  springs: t => [`Boing! Bounce on ${plural(t.n, "spring", "springs")} on the way up.`, plural(t.n, "spring", "springs")],
  lemons: () => ["Oh no! So many lemons! Rayla gets one warning, then don't touch another.", "so many lemons!"],
  fish: t => [`Get ${plural(t.n, "fish treat", "fish treats")} on the way up!`, `${t.n} fish`],
  candles: () => ["Candles everywhere! Keep Rayla's whiskers out of every flame.", "mind the candles"],
  water: t => [`Splash! Knock over ${plural(t.n, "glass", "glasses")} of water.`, `${plural(t.n, "glass", "glasses")} of water`],
  time: t => [`Quick! Reach the basket in ${t.s} seconds.`, `under ${t.s} s`],
  tape: () => ["Tape everywhere! Don't let Rayla touch any.", "avoid the tape"],
  nip: t => [`Catnip! Roll in it ${plural(t.n, "time", "times")} on the way up.`, `roll in catnip ${plural(t.n, "time", "times")}`],
  loose: () => ["Cracked shelves! Don't land on a single one.", "no cracked shelves"],
  tidy: () => ["Shh! Don't knock anything off.", "knock nothing off"],
};
const taskLine = t => t ? TASK_TEXT[t.kind](t)[0] : "";
const taskShort = t => t ? TASK_TEXT[t.kind](t)[1] : "";
// the count goals: what's counted, and what it's called on the card at the basket
const COUNTED = {knock: ["knocked", "things to knock off", "Not enough knocked off!"], fish: ["fish", "fish treats", "Not enough fish!"],
  water: ["water", "glasses of water", "Not enough splashes!"], springs: ["springs", "springs", "Not enough boings!"],
  nip: ["nips", "rolls in catnip", "Not enough catnip!"]};
const levelName = n => n === ENDLESS ? "Endless" : `Level ${n} · ${GOALS[n]} ft`;
const has = (n, f) => n === ENDLESS || n >= FROM[f];

/* ---------- pictures ---------- */
const pics = {};
const pic = src => { if (!pics[src]) { const im = new Image(); im.src = src; pics[src] = im; } return pics[src]; };
const ready = im => im.complete && im.naturalWidth;
// Rayla's poses, cut from the owner's sheet: all drawn at one scale (SC units per pixel of the sheet), the side views
// facing left
const RAYLA = {leap: "../cats/rayla-leap.webp", bound: "../cats/rayla-bound.webp", crouch: "../cats/rayla-crouch.webp", dive: "../cats/rayla-dive.webp",
  low: "../cats/rayla-low.webp", feet: "../cats/rayla-crouch2.webp", startled: "../cats/rayla-startled.webp", basket: "../cats/rayla-basket.webp"};
const SC = .218;
const FISH = "../toys/fish.webp", MOUSE = "../toys/mouse.webp", SPRING_PIC = "../toys/spring-up.webp";
for (const s of [...Object.values(RAYLA), FISH, MOUSE, SPRING_PIC]) pic(s);
// Knock It Off's things (tablethings.js), each drawn in a 100 × 100 box standing at y = 84
const thingSrc = k => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${TABLE.noShadow(TABLE.ART[k])}</svg>`);
const SWATS = ["m", "g", "s", "v", "y", "L"];   // mug, glass, succulent, vase, ball of yarn, lamp
const THING_SIZE = {m: 42, g: 42, s: 44, v: 46, y: 40, L: 52, b: 46, l: 38, c: 46};
for (const k of Object.keys(THING_SIZE)) pic(thingSrc(k));
// Catnip, as Tail Chase and Knock It Off draw it (tablethings.js)
const CATNIP = TABLE.CATNIP;
const NIP = pic("data:image/svg+xml;charset=utf-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${CATNIP}</svg>`));
// Knock It Off's crash, where a thing swatted off hits the floor far below
const CRASH = pic("data:image/svg+xml;charset=utf-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 18 L57 38 L78 30 L65 48 L84 58 L62 61 L66 82 L50 68 L34 82 L38 61 L16 58 L35 48 L22 30 L43 38 Z" fill="#FFE07A" stroke="#2A2530" stroke-width="2.5"/></svg>`));
// the grey spring, tinted gold once it's loaded
let goldSpring = null;
function springPic() {
  if (goldSpring) return goldSpring;
  const im = pic(SPRING_PIC); if (!ready(im)) return null;
  const c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight;
  const x = c.getContext("2d"); x.drawImage(im, 0, 0);
  x.globalCompositeOperation = "multiply"; x.fillStyle = "#ECA818"; x.fillRect(0, 0, c.width, c.height);
  x.globalCompositeOperation = "destination-in"; x.drawImage(im, 0, 0);
  return goldSpring = c;
}
// book spines, from the site's palette
const SPINES = ["#BD5538", "#E16A4A", "#73A7AE", "#ECA818", "#B3B94B", "#6AA673", "#B94588", "#7885BA", "#4E577D", "#8D78AD"];

/* ---------- making a bookcase ---------- */
// A small seeded random number maker, so Restart (and a share link) build the same bookcase again.
function rand(g) { let t = g.r = (g.r + 0x6D2B79F5) >>> 0; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }
// How hard the bookcase is at height y, from 0 to 1: each level starts a little harder than the last and gets a
// little harder on the way up; Endless gets harder all the way to 450 ft.
function hardness(g, y) {
  if (g.level === ENDLESS) return Math.min(1, y / (450 * FT));
  return Math.min(1, (g.level - 1) / (ENDLESS - 2) * .82 + y / (GOALS[g.level] * FT) * .16);
}
// Shelves are made a little ahead of the window. Every shelf on the way up can be reached from the one below (the
// gap is never more than 3½ feet, and a pounce clears 4⅓), and always has room to land clear of a lemon, a
// candle or tape; cracked shelves are extras, in between, never needed.
function build(g, upto) {
  const goal = g.level === ENDLESS ? Infinity : GOALS[g.level] * FT;
  while (!g.done && g.genY < upto) {
    const d = hardness(g, g.genY), R = () => rand(g), pick = a => a[Math.floor(R() * a.length)];
    let y = g.genY + 32 + 42 * d + R() * (18 + 13 * d);
    if (y > goal - 40) {   // the top of the bookcase, with one more shelf first if it would be out of reach
      if (goal - g.genY <= 100) {
        g.shelves.push({id: g.n++, kind: "top", x: W / 2, y: goal, w: W - 2 * SIDE, things: []}); g.done = true;
        // a few fish treats along the top, on her way to the basket (the owner's idea: she may want them)
        for (let i = 0; i < 3; i++) g.items.push({kind: "fish", x: SIDE + 24 + (i + R() * .6) * (BASKET_X - 52 - SIDE - 24) / 2.6, y: goal + 18, top: true});
        break;
      }
      y = g.genY + (goal - g.genY) / 2;
    }
    const w = Math.round(92 - 34 * d + R() * (36 - 12 * d)), room = W - 2 * SIDE - w;
    const s = {id: g.n++, kind: "plain", x: SIDE + w / 2 + R() * room, y, w, things: [], main: true};   // main: one of the shelves every climb can use
    if (has(g.level, "slide") && R() < (TASKS[g.level] && TASKS[g.level].kind === "time" ? .55 : .1 + .25 * d)) {   // the race is on the sliding level
      s.kind = "slide"; s.range = Math.min(70, room / 2); s.x = SIDE + w / 2 + s.range + R() * (room - 2 * s.range);
      s.speed = 30 + 55 * d; s.phase = R() * 6.28;
    }
    // one end of the shelf may have something in the way: a lemon, a lit candle or a strip of tape
    const end = R() < .5 ? -1 : 1, hz = R();
    let busy = 0;   // how far in from the end that's taken
    const k = kindOf(g);   // a level about one of them has far more of it
    if (w >= 74 && has(g.level, "lemon") && hz < (k === "lemons" ? .5 : .07 + .06 * d)) { s.things.push({k: "l", dx: end * (w / 2 - 16)}); busy = 32; }
    else if (w >= 74 && has(g.level, "candle") && hz < (k === "candles" ? .4 : .16 + .1 * d)) { s.things.push({k: "c", dx: end * (w / 2 - 12)}); busy = 24; }
    else if (w >= 80 && has(g.level, "tape") && hz < (k === "tape" ? .6 : .25 + .1 * d)) { const tw = Math.round(28 + R() * 10); s.tape = {dx: end * (w / 2 - tw / 2 - 2), w: tw}; busy = tw + 4; }
    if (R() < (k === "springs" ? .4 : .1) && has(g.level, "spring")) s.spring = Math.round(-end * (R() * (w / 2 - busy - 14)));
    // at the other end, things to swat off (or a pile of books, which won't budge) and books standing up
    const tidy = k === "tidy", swatK = () => k === "water" && R() < .6 ? "g" : pick(SWATS);   // the splash level: mostly glasses of water
    if (R() < .6 && !(tidy && (busy || w < 80))) s.things.push({k: swatK(), dx: -end * (w / 2 - 14)});
    if (busy === 0 && w >= 90 && R() < .35 && !tidy) s.things.push({k: swatK(), dx: end * (w / 2 - 14)});
    else if (busy === 0 && R() < .5) {
      const n = 1 + Math.floor(R() * 4); let at = w / 2 - 4;
      s.books = [];
      for (let i = 0; i < n && at > 10; i++) { const bw = 6 + Math.round(R() * 4); s.books.push({dx: end * (at - bw / 2), w: bw, h: 20 + Math.round(R() * 14), c: pick(SPINES), lean: i === n - 1 && R() < .3}); at -= bw + .5; }
    }
    g.shelves.push(s);
    // in between: a cracked shelf that gives way, or (low down, on the easy levels) a spare shelf to help
    const mid = (g.genY + y) / 2, mw = Math.round(60 + R() * 30), mx = SIDE + mw / 2 + R() * (W - 2 * SIDE - mw);
    if (has(g.level, "loose") && R() < (k === "loose" ? .45 : .15 + .2 * d) && Math.abs(mx - s.x) > 40) g.shelves.push({id: g.n++, kind: "loose", x: mx, y: mid, w: mw, things: []});
    else if (R() < .35 * (1 - d) && Math.abs(mx - s.x) > 60) g.shelves.push({id: g.n++, kind: "plain", x: mx, y: mid, w: mw, things: R() < .5 ? [{k: pick(SWATS), dx: (R() < .5 ? -1 : 1) * (mw / 2 - 14)}] : []});
    // fish treats to pick up, and now and then a sprig of catnip lying on a shelf (not a sliding one), in the middle
    if (R() < (k === "fish" ? .55 : .3)) g.items.push({kind: "fish", x: Math.max(SIDE + 14, Math.min(W - SIDE - 14, s.x + (R() - .5) * 60)), y: y + 50 + R() * 40});
    else if (has(g.level, "nip") && s.kind === "plain" && R() < (k === "nip" ? .4 : .04)) g.items.push({kind: "nip", x: s.x, y: y + 17});
    g.genY = y;
  }
}
const kindOf = g => TASKS[g.level] && TASKS[g.level].kind;
// A level's goal for this bookcase: a knock or fish goal is cut to half of what this one holds (built ahead
// from the same seed, so it's the same bookcase)
function planTask(n, seed) {
  const t = TASKS[n]; if (!t) return null;
  if (!COUNTED[t.kind]) return {...t};
  const sim = {level: n, r: seed, n: 0, genY: 0, done: false, shelves: [], items: []};
  build(sim, Infinity);
  const have = t.kind === "fish" || t.kind === "nip" ? sim.items.filter(it => it.kind === t.kind).length
    : t.kind === "springs" ? sim.shelves.filter(s => s.spring != null).length
    : sim.shelves.reduce((a, s) => a + s.things.filter(x => t.kind === "water" ? x.k === "g" : SWATS.includes(x.k)).length, 0);
  return {...t, n: Math.max(1, Math.min(t.n, Math.floor(have * .5)))};
}
// Where a shelf is now (the sliding ones go to and fro)
const shelfX = (g, s) => s.kind === "slide" ? s.x + s.range * Math.sin(s.phase + g.t * s.speed / s.range) : s.x;

/* ---------- game ---------- */
// game: {level, seed, r (the random maker's state), t (seconds played), shelves, items, falling (things swatted off),
//        cat {x, y, vx, vy, face, landed, on (the shelf she's crouched on), off (where on it), settle, scared, zoom}, cam (the window's bottom), top (highest she's been), fish,
//        knocked, state ("ready" | "running" | "paused" | "fell" | "won"), clock}
const STORE = "catdoku.pounceup.v1";
const $ = G.$;
let state = G.load(STORE);
let settings = Object.assign({level: 1, tries: {}, best: 0, seen: {}}, state.settings);
let game = null;
G.pawLost(() => !game || game.level === ENDLESS || !!settings.tries[game.level]);
const save = () => G.save(STORE, {settings});
const slow = G.slower("pounceup");
// Rayla waits crouched on each shelf until you tap, then pounces towards the tap (springs still throw her up at once):
// the way she plays unless Pounce by herself is on (the owner's choice, 2026-11-11), when she pounces again each time
// she lands. (Before, tapping was a switch, Pounce when I tap, and off at first.)
const tapMode = () => !settings.autoPounce;

/* ---------- the clock ---------- */

    for (let cx = Math.floor((x - s.w / 2) / SQ); cx <= Math.floor((x + s.w / 2) / SQ); cx++) out.add(`${cx},${row}`);
  }
  return [...out].map(t => t.split(",").map(Number)).filter(([x, y]) => x >= 0 && x < 6 && y >= 0 && y < 8);
}
function showHelp() { pause(); settings.seenHelp = false; helpOnFirstVisit(); if (!document.querySelector(".spot")) { settings.seenHelp = true; G.helpLater(); } }
function helpOnFirstVisit() {
  if (settings.seenHelp || !game || !["ready", "paused"].includes(game.state) || document.querySelector(".spot")) return;
  const turn = G.yourTurn(() => game, g => { game = g; }, paint);
  let from = 0;
  const bottom = []; for (let y = 5; y < 8; y++) for (let x = 0; x < 6; x++) bottom.push([x, y]);
  const all = []; for (let y = 0; y < 8; y++) for (let x = 0; x < 6; x++) all.push([x, y]);
  const steps = [];
  if (game.state === "ready") steps.push({say: "Tap where Rayla should go", lit: bottom, ...turn.upTo,
    enter() { turn.upTo.enter(); from = game.cat.x; },
    try: {done: () => Math.abs(game.cat.x - from) > 45, yes: "Like that!"}});
  steps.push({say: tapMode() ? "Tap again and she pounces there" : "She pounces off every shelf", lit: onScreenSquares(() => true)});
  const swats = onScreenSquares(s => (s.things || []).some(t => SWATS.includes(t.k) && !t.off));
  if (swats.length) steps.push({say: "Swat off things that sparkle", lit: swats});
  steps.push({say: "Tap her shelf to walk along it", lit: all, later: true});
  steps.push({say: game.level === ENDLESS ? "Climb as high as you can" : "Climb to the basket at the top", lit: all, tone: "ok"});
  steps.push({say: "A missed shelf ends the climb", lit: [0, 1, 2, 3, 4, 5].map(x => [x, 7])});
  steps.push({say: "Pause any time", els: [$("pauseBtn")]});
  G.spotlight({grid: $("board"), w: 6, h: 8, steps, done: () => { settings.seenHelp = true; save(); }});
}
$("helpBtn").onclick = showHelp;

/* ---------- VoiceOver ---------- */
setInterval(() => {
  if (!game) return;
  const g = game, c = g.cat, side = x => x < W / 3 ? "on the left" : x > 2 * W / 3 ? "on the right" : "in the middle";
  const next = g.shelves.filter(s => s.kind !== "floor" && !s.gone && s.y > c.y + 5).sort((a, b) => a.y - b.y)[0];
  const ft = Math.floor(c.y / FT);
  G.describe($("board"), `A bookcase. Rayla is ${ft} feet up, ${side(c.x)}` + (next ? `; the next shelf up is ${side(shelfX(g, next))}` : "") +
    (tapMode() ? ". Tap where she should pounce, or use the left and right arrow keys and press Up to pounce." : ". Tap where she should go, or hold the left and right arrow keys."));
}, 500);

/* ---------- start ---------- */
for (let n = 1; n <= ENDLESS; n++) $("levelSel").append(new Option(n === ENDLESS ? "Endless" : `${n} · ${GOALS[n]} ft, ${taskShort(TASKS[n])}`, n));
$("levelSel").onchange = e => { startLevel(+e.target.value); $("levelSel").blur(); };
G.nav("pounceup");
G.setupTimer({name: "pounceup", game: () => game, playing: g => g.state === "running", save, label: levelName, noun: "level",
  emptyText: "Get Rayla to the top of a bookcase and your times will show up here. They're kept on this device only."});
$("bestBtn").onclick = () => { pause(); G.showBests("Best times", game ? game.level : settings.level); };
if (!(settings.level >= 1 && settings.level <= ENDLESS)) settings.level = 1;
$("levelSel").value = settings.level;
const shared = G.readShare("pounceup");
let openedShare = false;
if (shared) try { openShared(shared); openedShare = true; G.note("Here's the shared bookcase. Good luck!", 6000); G.track("Pounce Up shared puzzle opened"); } catch (e) { G.note("That share link didn't work.", 5000); }
if (!openedShare) newRun(settings.level);
window.addEventListener("hashchange", () => { const d = G.readShare("pounceup"); if (d) G.offerShare(d, {name: "Pounce Up", inProgress: !!(game && game.started && !["won", "fell"].includes(game.state)), open: d => { try { openShared(d); } catch (e) { G.note("That share link didn't work.", 5000); } }}); });
setTimeout(helpOnFirstVisit, 300);
</script>
