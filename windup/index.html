<script>
/* ---------- the basket ---------- */
// World units: the basket is W wide and H deep; Gus sits CAT above its rim. Ten sizes of yarn ball, each winding up

const PTS = [0, 1, 3, 6, 10, 15, 21, 28, 36, 45, 55];

// ledges or round corners.
const LV = [null,
  {goal: 6, pool: 4, line: 72, pom: [0, 0], shape: ""},
  {goal: 7, pool: 5, line: 72, pom: [0, 0], shape: "slope"},
  {goal: 8, pool: 5, line: 72, pom: [0, 0], shape: "hump"},
  {goal: 8, pool: 5, line: 100, pom: [.06, 3], shape: "ledge"},
  {goal: 9, pool: 5, line: 100, pom: [.08, 3], shape: "round"},
  {goal: 9, pool: 5, line: 100, pom: [.1, 4], shape: "ledges", tall: 30},
  {goal: 10, pool: 5, line: 90, pom: [.06, 3], shape: "slopeR+ledge", tall: 60},
  {goal: 10, pool: 5, line: 90, pom: [.08, 3], shape: "hump+ledgeR", tall: 70},
  {goal: 10, pool: 5, line: 100, pom: [.08, 3], shape: "round+hump", tall: 90},
  {goal: 10, pool: 5, line: 100, pom: [.0625, 3], shape: "ledges+slope", net: true, tall: 100},
  {goal: 10, pool: 5, line: 110, pom: [.08, 3], shape: "round+ledges", net: true, tall: 120},
  {goal: 10, pool: 5, line: 120, pom: [.09, 3], shape: "ledges+slope", net: true, tall: 140},
  // Past level 12 (the owner's picks, 2026-11-15), one new thing a level, in a basket as deep as level 9's with the floor
  // to drop: catnip, rubber balls, yarn that unravels, springs, sticky tape, a basket that tips, no peeking at the next
  // ball, and Gus in a hurry. Rubber balls, springs and tape ask for a size 9 ball (a bot with no helpers never made a 10 with
  // the tape in 400 drops); the rest for a 10.
  {goal: 10, pool: 5, line: 100, pom: [0, 0], shape: "hump", net: true, tall: 90, nip: .06},
  {goal: 9, pool: 5, line: 100, pom: [0, 0], shape: "slope", net: true, tall: 90, rub: .08},
  {goal: 10, pool: 5, line: 100, pom: [0, 0], shape: "ledge", net: true, tall: 90, unr: .14},
  {goal: 9, pool: 5, line: 100, pom: [0, 0], shape: "springs", net: true, tall: 90},
  {goal: 9, pool: 5, line: 100, pom: [0, 0], shape: "tapeFull+hump", net: true, tall: 90},

  {goal: 10, pool: 5, line: 100, pom: [0, 0], shape: "slope+ledge", net: true, tall: 90, hurry: 3}];
const GOALS = LV.map(v => v && v.goal), MAX_LEVEL = LV.length - 1;
// Endless (the owner's idea, 2026-11-15): no top. Each time the biggest ball there's room for is wound (a 10 at first),
// the basket zooms out a step: every ball keeps its number but is drawn and rolls a size smaller (rad), the smallest
// shrink away to nothing, and the drops start a size higher (2 to 6, then 3 to 7…), with the next zoom at an 11, then
// a 12. It ends when the yarn piles over the line; one Shake to keep going is allowed. g.tier counts the zooms.
const ENDLESS = 99;
// Now and then (the owner's call: occasionally, not often) a catnip, rubber or loose ball comes among the drops, and
// after a zoom one stretch in two brings springs, tape, a tipping basket, no peeking or hurry, until the next zoom.

const rad = l => RAD[Math.max(0, Math.min(MAXL, l - tierOf()))];   // a ball's size on screen and in the basket
const colorOf = l => COLOR[(l - 1) % MAXL + 1];   // past 10 the colours come round again (the size they share is long gone)
const pts = l => l * (l + 1) / 2;
const topL = () => MAXL + tierOf();   // the biggest ball there is now
const goalOf = g => isEndless(g) ? topL() : GOALS[g.level];
const aN = n => (/^(8|11|18)/.test(String(n)) ? "an " : "a ") + n;   // "an 11", "a 12"
// Levels 10 to 12 have a floor that can be dropped: once the yarn in the basket weighs enough, it's a net for a few
// seconds, the basket is shaken, and the small balls (sizes 1 to 3) fall through. It counts as a helper (see FREE).
const hasNet = g => !!LV[g.level].net;
const NET_AT = .36, NET_FOR = 3, NET_HOLE = RAD[3];   // the floor can drop once the basket is this full, is a net this many seconds, and lets balls up to size 3 through
const SHAPE_WORDS = {slope: "sloped floor", slopeR: "sloped floor", hump: "hump", ledge: "ledge", ledgeR: "ledge", ledges: "ledges", round: "round corners", springs: "springs", tape: "sticky tape", tapeFull: "sticky tape"};
const NEW_WORDS = {nip: "catnip", rub: "rubber balls", unr: "unravelling yarn", tip: "a basket that tips", nopeek: "no peeking", hurry: "hurry!"};
const levelName = n => { if (n === ENDLESS) return "Endless"; const v = LV[n], bits = [...new Set(v.shape.split("+").filter(Boolean).map(k => SHAPE_WORDS[k]))]; for (const k in NEW_WORDS) if (v[k]) bits.unshift(NEW_WORDS[k]); if (v.pom[0]) bits.push("fluffballs"); if (v.net && n <= 12) bits.push("drop the floor");

// (net: part of the floor, which turns to net with it when the floor is dropped)
// a polygon to fill. Balls roll off them like the walls.
// Each basket is dealt from its seed (rnd), so the same level comes out a little different every time: a slope
// steeper or gentler, the hump off to one side, ledges higher or lower, longer or shorter, the corners rounder;
// and half the time the whole basket is the other way round. Restart and a shared link get the same basket.
const span = (rnd, a, b) => a + (b - a) * rnd();
const SHAPE = {
  slope: rnd => { const h = span(rnd, 60, 100); return [{pts: [[0, H - h], [W, H]], hr: 3, fill: [[0, H - h], [W, H], [0, H]], net: true}]; },   // the floor higher on the left, so balls roll right
  slopeR: rnd => { const h = span(rnd, 60, 100); return [{pts: [[W, H - h], [0, H]], hr: 3, fill: [[W, H - h], [0, H], [W, H]], net: true}]; },
  hump: rnd => [{pts: [[W / 2 + span(rnd, -70, 70), H + span(rnd, 6, 20)]], hr: span(rnd, 38, 52)}],
  ledge: rnd => { const y = span(rnd, 214, 262), len = span(rnd, 70, 100); return [{pts: [[0, y], [len, y + span(rnd, 16, 34)]], hr: 5}]; },
  ledgeR: rnd => { const y = span(rnd, 228, 276), len = span(rnd, 70, 100); return [{pts: [[W, y], [W - len, y + span(rnd, 16, 34)]], hr: 5}]; },
  ledges: rnd => { const y1 = span(rnd, 196, 220), y2 = y1 + span(rnd, 70, 92);
    return [[0, y1, 1], [W, y2, -1]].map(([x, y, d]) => { const len = span(rnd, 66, 96); return {pts: [[x, y], [x + d * len, y + span(rnd, 16, 34)]], hr: 5}; }); },
  // springs (level 16): one on the floor and one up each wall; a ball that lands on one is mostly bounced off, but
  // now and then it gets tangled in the coil and stays put until a shake or a wind frees it
  springs: rnd => { const fx = span(rnd, 110, 250), y1 = H - span(rnd, 150, 230), y2 = H - span(rnd, 110, 200);
    return [{pts: [[fx - 22, H - 3], [fx + 22, H - 3]], hr: 9, spring: true}, {pts: [[3, y1 - 22], [3, y1 + 22]], hr: 9, spring: true}, {pts: [[W - 3, y2 - 22], [W - 3, y2 + 22]], hr: 9, spring: true}]; },
  // sticky tape (level 17): a strip down each wall that a ball of yarn sticks to; stuck, it unravels a size at a time
  // level 17's tape runs all the way down both walls, from just under the line to the floor (above the line a ball
  // stuck to it would count as over the line straight away)
  tapeFull: rnd => [3, W - 3].map(x => ({pts: [[x, LV[17].line + 12], [x, H - 4]], hr: 4, tape: true})),
  tape: rnd => { const y1 = H - span(rnd, 150, 260), y2 = H - span(rnd, 120, 230);
    return [{pts: [[3, y1], [3, y1 + 70]], hr: 4, tape: true}, {pts: [[W - 3, y2], [W - 3, y2 + 70]], hr: 4, tape: true}]; },
  round: rnd => { const R = span(rnd, 46, 74); return [-1, 1].map(side => {   // a curved corner each side of the floor: an arc of radius R, filled in behind
    const pts = Array.from({length: 9}, (_, k) => { const f = Math.PI / 2 * (k / 8), phi = side < 0 ? Math.PI - f : f; return [(side < 0 ? R : W - R) + R * Math.cos(phi), H - R + R * Math.sin(phi)]; });

  }); },
};
function basketFor(seed, v) {

}
const POM_TOP = 6;   // puffballs wind up to this size; two of the biggest puff away
const SHAKE_FOR = .9;   // seconds the basket wobbles after a shake
const SUB = 6, STEP = 1 / 60, ITER = 4, GRACE = 1.1, LOSE_AFTER = 2.4, COOL = 0.4;

const mulberry = s => () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

function dropFor(seed, i, v) {
  const rnd = mulberry(seed ^ Math.imul(i + 1, 0x9E3779B1)), r = rnd();

  if (v.nip && rnd() < v.nip) return {l: 1, p: false, k: "nip"};
  if (v.rub && rnd() < v.rub) return {l: 4, p: false, k: "rub"};
  if (v.unr && rnd() < v.unr) return {l: 1 + Math.floor(r * r * v.pool), p: false, k: "unr"};
  return {l: 1 + Math.floor(r * r * v.pool), p: false};
}

/* ---------- pictures ---------- */
// Ten balls of yarn, smallest to biggest. The order jumps about on purpose: neighbours differ in colour and in how
// light they are, so no two sizes are easy to mix up. Fluffballs are Spelling String's grey pompom with googly eyes.
const POM_SRC = window.POM_SRC || "../fuzzyspelling/pompom.webp", EYE_SRC = window.EYE_SRC || "../fuzzyspelling/eye.webp";
const spriteSets = {yarn: [], fluff: []};
function fluffSprite(l, set) {

    if (++n < 2) return;

  const g = yarnBall(colorOf(l), 1); g.removeChild(g.firstChild);   // the ground shadow isn't wanted on a ball that turns

const picCache = {};

const STORE = "catdoku.windup.v1";

  g.overT = 0; g.shakeT = SHAKE_FOR; g.shakeCool = 3; G.sound.play("wu.shake");
  if (g.state === "won") return;   // just for fun: nothing more to win or lose
  helped(g, "Shaken!");
  g.shook = true; status(); save();
}
// De-fluff: a lint roller that takes every fluffball off the board, as often as there's fluff to take. It counts as a helper (see FREE).
function defluff() {
  const g = game;
  if (!g || g.state !== "running" || $("overlay").classList.contains("show") || document.querySelector(".spot")) return;
  const fluff = g.balls.filter(b => b.p);
  if (!fluff.length) { G.note("No fluffballs on the board right now.", 2500); return; }
  for (const b of fluff) g.fx.push({puff: true, l: b.l, x: b.x, y: b.y, r: b.r, a: b.a, t: 0, T: .45});
  helped(g, "All the fluff is gone."); G.sound.play("wu.defluff");
  g.balls = g.balls.filter(b => !b.p); g.fluffed = true;
  status(); save();
}
$("fluffBtn").onclick = () => defluff();
$("netBtn").onclick = () => dropFloor();
$("shakeBtn").onclick = () => shake();
function pause() { if (game && game.state === "running") { game.state = "paused"; $("tapgo").hidden = false; $("tapgo").textContent = "Paused · tap to go on"; status(); save(); } }
function resume() { if (game && game.state === "paused") { game.state = "running"; $("tapgo").hidden = true; status(); } }
$("pauseBtn").onclick = () => game && (game.state === "paused" ? resume() : pause());
document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

/* ---------- endings ---------- */
// Going over the line: a card offers Shake or De-fluff to keep going (either costs the gold paw), or starting again.
// The try only counts, and a win streak only ends, once the player gives up on this basket.
function lose() {
  if (isEndless(game)) return endlessOver(game);
  game.state = "lost"; status();
  G.track(`Wind Up overflowed on level ${game.level}`);
  const g = game;
  setTimeout(() => {
    if (game !== g) return;
    const fluff = !!LV[g.level].pom[0] && g.balls.some(b => b.p);
    const keepOn = [["Shake and keep going", () => { closeCard(); revive(g, "shake"); }, true]];
    if (fluff) keepOn.push(["De-fluff and keep going", () => { closeCard(); revive(g, "fluff"); }]);
    if (hasNet(g)) keepOn.push(["Drop the floor and keep going", () => { closeCard(); revive(g, "net"); }]);
    G.loseCard("Over the line!", `The yarn piled up too high, with ${g.score} points and a size ${g.best || 1} ball. ${hasNet(g) ? `Shake, ${fluff ? "De-fluff or " : "or "}drop the floor` : `Shake${fluff ? " or De-fluff" : ""}`} to keep going, or start again.`,
      [...keepOn, ["Try again", () => { closeCard(); giveUp(g); newGame(g.level, g.seed); }], ["New basket", () => { closeCard(); giveUp(g); newGame(g.level); }],
       ["Admire the mess", () => { closeCard(); giveUp(g); G.breakStreak(); G.note("Tap Restart to try again.", 0); }], G.homeBtn()],
      null, G.otherSize($("levelSel"), g.level, n => { giveUp(g); startLevel(n); }, "Or play a different level:"), {result: {n: g.level}});
  }, 700);
}
// Endless: a zoom, and the end of a run
function zoomOut(g) {
  g.tier = (g.tier || 0) + 1;
  const top = g.balls.find(b => b.l === g.best && !b.p);
  for (const b of g.balls.filter(b => b.l <= g.tier)) g.fx.push({puff: true, l: b.l, x: b.x, y: b.y, r: b.r, a: b.a, t: 0, T: .5, yarn: true});   // too small to see now
  g.balls = g.balls.filter(b => b.l > g.tier);
  for (const b of g.balls) { b.r = rad(b.l); b.pop = .75; b.age = Math.min(b.age, 0); }
  if (top) ["#ECA818", "#E16A4A", "#B94588"].forEach((c, k) => g.fx.push({x: top.x, y: top.y, r: top.r, t: -k * .2, T: .9, c, grow: 2}));
  g.overT = 0; G.sound.play("wu.goal"); G.track(`Wind Up endless zoom ${g.tier}`);
  // the stretch until the next zoom: half the time something extra, never the same twice running
  g.shapes = g.shapes.filter(sh => !sh.spring && !sh.tape);
  for (const b of g.balls) if (b.stuck) { b.stuck = false; delete b.tangle; }   // what held them has gone (tape's yarn keeps unravelling)
  g.stage = Math.random() < .5 ? STAGES.filter(k => k !== g.stage)[Math.floor(Math.random() * (STAGES.length - (STAGES.includes(g.stage) ? 1 : 0)))] : "";
  if (g.stage === "springs" || g.stage === "tape") g.shapes.push(...SHAPE[g.stage](Math.random));
  g.tt = 0; g.wait = 0;
  G.note(`Zoomed out! A size ${g.best} ball. Drops now start at size ${g.tier + 1}; next zoom at ${aN(goalOf(g))}.` + (g.stage ? ` ${STAGE_SAY[g.stage]}, until then.` : ""), 5500);
  status(); paintHud(); save();
}
function endlessOver(g) {
  g.state = "lost"; status();
  const best = settings.endlessBest = Math.max(settings.endlessBest || 0, g.score); save();
  G.track(`Wind Up endless over at ${g.tier || 0} zooms`);
  setTimeout(() => {
    if (game !== g) return;
    const btns = [];
    if (!g.revived) btns.push(["Shake and keep going (once a run)", () => { closeCard(); revive(g, "shake"); }, true]);
    btns.push(["New run", () => { closeCard(); G.breakStreak(); newGame(ENDLESS); }, !!g.revived], ["Back to the levels", () => { closeCard(); startLevel(settings.lastLevel || 1); }]);
    G.loseCard("Over the line!", `${g.score} points, up to a size ${g.best || 1} ball${g.tier ? `, zoomed out ${g.tier} time${g.tier > 1 ? "s" : ""}` : ""}. ` + (g.score && g.score >= best ? "Your best yet!" : `Your best is ${best}.`),
      btns, null, null, {result: {n: null}});
  }, 700);
}
function giveUp(g) { if (!g.counted) { g.counted = true; settings.tries[g.level] = (settings.tries[g.level] || 0) + 1; save(); } }
function revive(g, how) {
  if (game !== g || g.state !== "lost") return;
  g.state = "running"; g.overT = 0; $("tapgo").hidden = true; g.revived = true;
  if (how === "shake") { g.shakeCool = 0; shake(); }
  else if (how === "net") { g.netReady = true; g.net = 0; dropFloor(); }
  else { defluff(); for (const b of g.balls) b.age = Math.min(b.age, 0); }   // a moment before anything counts as over the line
  status(); save();
}
function win() {
  game.state = "won"; G.finishClock(game); G.sound.play("wu.goal");
  // a finale: the finished ball pops up and rings of colour spread out from it, before the card
  const top = game.balls.find(b => b.l === GOALS[game.level] && !b.p);
  if (top) { top.pop = .7; top.born = 1; ["#ECA818", "#E16A4A", "#B94588"].forEach((c, k) => game.fx.push({x: top.x, y: top.y, r: top.r, t: -k * .22, T: .9, c, grow: 1.4})); }
  const first = !settings.tries[game.level], next = Math.min(MAX_LEVEL, game.level + 1);
  settings.tries[game.level] = 0; settings.level = next; $("levelSel").value = next; save(); status();
  G.track(`Wind Up won level ${game.level}`);
  const g = game;
  setTimeout(() => {
    if (game !== g) return;
    const im = new Image(); im.className = "pic"; im.src = catSrc("kitten-1"); im.alt = "Gus and Peanut as kittens, sitting side by side";
    const text = `A size ${GOALS[g.level]} ball, with ${g.score} points.` + (g.level === MAX_LEVEL ? " That's the biggest ball there is; here it is again." : ` Next up: level ${next}.`);
    G.winCard(text, () => { closeCard(); startLevel(next); }, "Admire the yarn", g.result,
      {title: "All wound up!", gold: first && !pawGone(g), goldWhy: g.helps ? "First try, with just a little help!" : "First try, no helpers!", goldTitle: "Even Peanut is impressed!", goldPic: [im], next: next > g.level ? `Next: level ${next}` : "Next basket",
       top: g.level === MAX_LEVEL, onAdmire: () => G.note("Shake the basket all you like now, and watch what winds up.", 0), after: G.otherSize($("levelSel"), next, startLevel, "Or play a different level:")});
  }, 1700);
}
function startLevel(n) { if (n !== ENDLESS) settings.lastLevel = n; settings.level = n; $("levelSel").value = n; save(); closeCard(); newGame(n); }
const leave = () => { if (["running", "paused"].includes(game.state)) { settings.tries[game.level] = (settings.tries[game.level] || 0) + 1; save(); } else if (game.state === "lost") giveUp(game); closeCard(); };
$("restartBtn").onclick = () => { if (game) { leave(); newGame(game.level, game.seed); } };
$("newBtn").onclick = () => { if (game) { leave(); newGame(game.level); } };
// Share: the level and the order the yarn comes in, as dealt.
$("linkBtn").onclick = () => { if (game && isEndless(game)) { G.note("An Endless run can't be shared, but any level can.", 3500); return; } if (game) { pause(); G.shareCard({name: "Wind Up", what: "basket", won: game.state === "won", puzzle: () => ({g: "windup", N: game.level, s: game.seed})}); } };
function openShared(d) {
  if (!(d.N >= 1 && d.N <= MAX_LEVEL) || !Number.isInteger(d.s)) throw new Error("the shared basket doesn't fit the game");
  settings.level = d.N; $("levelSel").value = d.N; save(); newGame(d.N, d.s);
}

/* ---------- how to play ---------- */
function showHelp() { pause(); settings.seenHelp = false; helpOnFirstVisit(); if (!document.querySelector(".spot")) { settings.seenHelp = true; G.helpLater(); } }
function helpOnFirstVisit() {
  if (settings.seenHelp || !game || !["ready", "paused", "running"].includes(game.state) || document.querySelector(".spot")) return;
  if (game.state === "running") pause();
  const cols = 9, rows = 12, row = y => Math.floor((CAT + y) / (CAT + H + M) * rows), all = [];
  const line = []; for (let x = 0; x < cols; x++) line.push([x, row(game.line)]);
  const top = []; for (let x = 0; x < cols; x++) top.push([x, 0]);
  const floor = []; for (let x = 0; x < cols; x++) for (let y = rows - 3; y < rows; y++) floor.push([x, y]);
  const steps = [
    {say: "Aim, then let go", lit: top},
    {say: "Two the same wind bigger", lit: floor},
    {say: "Wind the goal ball to win", els: [$("goalCv")]},
    ...(LV[game.level].pom[0] ? [{say: "Fluffballs only wind together", els: [$("nextCv")]}] : []),
    {say: "Stay below the line", lit: line, tone: "ok"},
    {say: "Stuck? Shake the basket", els: [$("shakeBtn")]},
    ...(LV[game.level].pom[0] ? [{later: true, say: "De-fluff clears the fluffballs", els: [$("fluffBtn")]}] : []),
    ...(hasNet(game) ? [{say: "Drop the floor: small balls fall", els: [$("netBtn")]}] : []),
  ];
  G.spotlight({grid: cv, w: cols, h: rows, steps, done: () => { settings.seenHelp = true; save(); }});
}
// The first time each of levels 13 to 20 is played, a step of its own says what's new.
const NEW_SAY = {nip: ["Catnip winds any ball one size up", "nextCv"], rub: ["Rubber balls bounce; two together pop", "nextCv"],
  unr: ["Loose yarn unravels: wind it to save it", "nextCv"], springs: ["Springs bounce balls, but sometimes tangle", null],
  tape: ["Tape catches yarn, and it unravels, even wound", null], tip: ["The basket tips back and forth", null],
  nopeek: ["No peeking: the next ball's a surprise", "nextCv"], hurry: ["Hurry! Wait too long and Gus drops it", null]};
function newThing() {
  if (!game || !settings.seenHelp || game.level <= 12 || isEndless(game) || document.querySelector(".spot") || $("overlay").classList.contains("show")) return;
  const v = LV[game.level], key = Object.keys(NEW_SAY).find(k => v[k] || v.shape.split("+").map(x => x.replace("Full", "")).includes(k));
  if (!key || (settings.seenNew || {})[key]) return;
  if (game.state === "running") pause();
  const [say, el] = NEW_SAY[key];
  G.spotlight({grid: cv, w: 9, h: 12, steps: [el ? {say, els: [$(el)]} : {say, els: [cv]}], done: () => { settings.seenNew = {...settings.seenNew, [key]: true}; save(); }});
}
$("helpBtn").onclick = showHelp;
G.switch({id: "numTgl", label: "Numbers", line: "Each toy shows a number too", key: "numbers", of: () => settings, save, change: () => paintHud()});
const slow = G.slower("windup");   // Slower: everything in the basket moves at two-thirds speed

/* ---------- start ---------- */
for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(levelName(n).replace("Level ", "") + (n === MAX_LEVEL ? " (hardest)" : ""), n));
$("levelSel").append(new Option("∞ Endless: zoom out every time you wind the top size", ENDLESS));
$("levelSel").onchange = e => { if (game) leave(); startLevel(+e.target.value); $("levelSel").blur(); };
G.nav("windup");
// full screen on a line under the basket's corner (G.zoom), where every game has it
G.zoom({at: $("board"), below: $("board").parentElement, full: {name: "Wind Up", change: () => paint()}});
G.setupTimer({name: "windup", game: () => game, playing: g => g.state === "running", save, label: levelName, noun: "level",
  emptyText: "Wind the goal ball on a level and your times will show up here. They're kept on this device only."});
$("bestBtn").onclick = () => { pause(); G.showBests("Best times", game ? game.level : settings.level); };
if (!(settings.level >= 1 && settings.level <= MAX_LEVEL) && settings.level !== ENDLESS) settings.level = 1;
$("levelSel").value = settings.level;
const shared = G.readShare("windup");
let openedShare = false;
if (shared) try { openShared(shared); openedShare = true; G.note("Here's the shared basket. Good luck!", 6000); G.track("Wind Up shared puzzle opened"); } catch (e) { G.note("That share link didn't work.", 5000); }
if (!openedShare) {
  const s = state.game;
  if (s && s.level === settings.level && Array.isArray(s.balls) && s.balls.every(b => Array.isArray(b) && b[2] >= 1 && b[2] <= MAXL + (s.tier | 0))) {
    newGame(s.level, s.seed); game.tier = s.tier | 0;   // before the balls are made, so they come out the right size
    if (s.stage && STAGES.includes(s.stage)) { game.stage = s.stage; if (Array.isArray(s.extra)) game.shapes.push(...s.extra); }
    Object.assign(game, {i: s.i, score: s.score, best: s.best, ms: s.ms || 0, started: s.started, timed: s.timed !== false, shook: !!s.shook, fluffed: !!s.fluffed, dropped: !!s.dropped,
      helps: s.helps !== undefined ? s.helps | 0 : s.shook || s.fluffed || s.dropped ? FREE + 1 : 0, revived: !!s.revived,   // (a basket saved before helpers were counted: one used had cost the paw)
      balls: s.balls.map(([x, y, l, a, p, f]) => mk(x, y, l, {a, age: 5, p: !!p, ...kindsOf(f | 0)})), state: "paused"});
    s.balls.forEach((b, i) => { const h = game.balls[b[6]]; if (b[6] >= 0 && h && h !== game.balls[i]) { game.balls[i].head = h; h.tail = game.balls[i]; } });   // the strands
    G.checkClock && G.checkClock(game);
    $("tapgo").hidden = false; $("tapgo").textContent = "Paused · tap to go on"; status(); paintHud();
  } else newGame(settings.level);
}
window.addEventListener("hashchange", () => { const d = G.readShare("windup"); if (d) G.offerShare(d, {name: "Wind Up", inProgress: !!(game && game.started && !["won", "lost"].includes(game.state)), open: d => { try { openShared(d); } catch (e) { G.note("That share link didn't work.", 5000); } }}); });
requestAnimationFrame(frame);
setTimeout(helpOnFirstVisit, 300);
</script>
