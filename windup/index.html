.gus{display:block;height:54px;width:auto;margin-bottom:-2px}
@media (max-height:760px){.gus{height:42px}}
.hud{width:var(--board);display:flex;align-items:center;justify-content:space-between;gap:10px}
.next{display:flex;align-items:flex-end;gap:6px}
.next img{display:block;height:50px;width:auto}
.next canvas{display:block;width:46px;height:46px}
.hud small{display:block;font-size:calc(13px*var(--ts-big));font-weight:600;line-height:1.1;opacity:.75}
.score{display:inline-flex;align-items:center;height:26px;padding:0 10px;border:2px solid var(--ink);border-radius:999px;

.stage{--aspect:1.332}
@media (orientation:landscape) and (max-height:500px){body:not(.full) .basket{width:100%;min-width:0}}

body.full main{display:grid;grid-template-columns:minmax(0,1fr) auto auto minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;align-items:stretch;gap:6px 8px}

<script>
/* ---------- the basket ---------- */
// World units: the basket is W wide and H deep; Gus sits CAT above its rim. Ten sizes of yarn ball, each winding up
// from two of the one before. Balls are circles with a little physics of their own: gravity, no bounce (yarn is
// soft), a little friction, and pushing apart when they overlap.
const W = 360, H0 = 432, CAT = 64, M = 10, MAXL = 10;
// The basket's depth: H0 on the first levels, and deeper on the later ones (LV's `tall`), where it's drawn smaller to fit
// the same screen, as Tunnel Run's rug is on its bigger levels. Set by setDepth before a basket is dealt.
let H = H0;   // M: the basket's wicker walls round the sides and floor
const RAD = [0, 11, 16, 22, 28, 35, 43, 52, 62, 73, 86];
const PTS = [0, 1, 3, 6, 10, 15, 21, 28, 36, 45, 55];
// Twelve levels, each a little harder: a bigger ball to wind, bigger balls among the drops, a lower line (less room),
// fluffballs that don't wind with yarn (pom: how often one comes, and its biggest size), and a basket with a sloped floor, a hump,
// ledges or round corners.
const LV = [null,
  {goal: 6, pool: 4, line: 72, pom: [0, 0], shape: ""},
  {goal: 7, pool: 5, line: 72, pom: [0, 0], shape: "slope"},
  {goal: 8, pool: 5, line: 72, pom: [0, 0], shape: "hump"},
  {goal: 8, pool: 5, line: 100, pom: [.06, 3], shape: "ledge"},
  {goal: 9, pool: 5, line: 100, pom: [.08, 3], shape: "round"},
  {goal: 9, pool: 5, line: 100, pom: [.1, 4], shape: "ledges", tall: 30},
  // Levels 7 to 12's lines, depths and fluffballs were set from a bot (2026-11-20): a simple player using the free helpers
  // wins about 100% of levels 1 to 5, then 90, 78, 71, 69, 63, 56 and 43% of 6 to 12 (it was 83, 33, 48, 73, 18, 15, 28).
  // Level 7, the first size 10, is deep and has few fluffballs to ease the step up; fluffballs are the biggest lever.
  {goal: 10, pool: 5, line: 72, pom: [.03, 3], shape: "slopeR+ledge", tall: 120},
  {goal: 10, pool: 5, line: 72, pom: [.08, 3], shape: "hump+ledgeR", tall: 80},
  {goal: 10, pool: 5, line: 105, pom: [.08, 3], shape: "round+hump", tall: 90},
  {goal: 10, pool: 5, line: 72, pom: [.03, 3], shape: "ledges+slope", net: true, tall: 130},
  {goal: 10, pool: 5, line: 90, pom: [.03, 3], shape: "round+ledges", net: true, tall: 120},
  {goal: 10, pool: 5, line: 110, pom: [.05, 3], shape: "ledges+slope", net: true, tall: 130},   // line 120 and fluffballs .09 until 2026-11-16: 4 of 6 baskets piled over (GoatCounter)
  // Past level 12 (the owner's picks, 2026-11-15), one new thing a level, in a basket as deep as level 9's with the floor
  // to drop and a few fluffballs (once they've come in at level 4, every level has them: the owner's call, 2026-11-16):
  // catnip, a basket that tips, yarn that unravels, springs, Gus in a hurry, sticky tape and a basket that leans.
  // Levels 13 to 21 were put in order from the same bot as 7 to 12 (2026-11-21): over two runs on different seeds it
  // wins about 88, 77, 66, 58, 61, 46, 45, 38 and 42% of them (neighbours within about 5 are a tie). Before, it won 84, 74, 42, 96, 100, 47, 96, 44 and 61% (loose yarn a cliff, and springs and
  // tape walkovers on a size 9 ball). A size 9 ball is a walkover however tight the basket and a 10 is about half, so
  // springs and tape ask for a 10 now, with more room and fewer fluffballs. The bot drops at once, so it never feels the
  // hurry: level 19 is harder for people than its number says. Saves from before are moved to the new numbers (REORDER).
  {goal: 10, pool: 5, line: 100, pom: [.06, 3], shape: "hump", net: true, tall: 90, nip: .06},
  {goal: 10, pool: 5, line: 100, pom: [.06, 3], shape: "slope+ledge", net: true, tall: 90, nip: .06},
  {goal: 10, pool: 5, line: 100, pom: [.03, 3], shape: "hump", net: true, tall: 90, tip: true},
  {goal: 10, pool: 5, line: 72, pom: [.03, 3], shape: "ledge", net: true, tall: 90, unr: .08},
  {goal: 10, pool: 5, line: 72, pom: [.01, 3], shape: "springs", net: true, tall: 90},
  {goal: 10, pool: 5, line: 85, pom: [.04, 3], shape: "springs", net: true, tall: 90, tip: true},
  {goal: 10, pool: 5, line: 100, pom: [.06, 3], shape: "slope+ledge", net: true, tall: 90, hurry: 3},
  {goal: 10, pool: 5, line: 72, pom: [.03, 3], shape: "tapeFull+hump", net: true, tall: 90},
  // level 21 (the owner's idea, 2026-11-15): the basket balances on a pivot under its middle and leans with the yarn's weight
  {goal: 10, pool: 5, line: 120, pom: [.08, 3], shape: "", net: true, tall: 90, weigh: true},
  // level 22 (the owner's sketch, 2026-11-27): shelves up the basket, tilted so the yarn zigzags down from one to the
  // next, over a wedge of floor with an open net beside it in one corner, always open, that anything up to a size 5 falls through
  {goal: 8, pool: 5, line: 72, pom: [.03, 3], shape: "shelves+pit", net: true, tall: 150}];
const GOALS = LV.map(v => v && v.goal), MAX_LEVEL = LV.length - 1;
// Endless (the owner's idea, 2026-11-15): no top. Each time the biggest ball there's room for is wound (a 10 at first),
// the basket zooms out a step: every ball keeps its number but is drawn and rolls a size smaller (rad), the smallest
// shrink away to nothing, and the drops start a size higher (2 to 6, then 3 to 7…), with the next zoom at an 11, then
// a 12. It ends when the yarn piles over the line, though the helpers can keep it going as often as you like (the owner's
// call, 2026-11-16). g.tier counts the zooms.
const ENDLESS = 99;
// Now and then (the owner's call: occasionally, not often) a catnip or loose ball comes among the drops, a few fluffballs
// too, and after a zoom one stretch in two brings springs, tape, a tipping basket, hurry or a leaning basket, until the
// next zoom. The floor can be dropped, as on every level from 10.
LV[ENDLESS] = {goal: 10, pool: 5, line: 100, pom: [.05, 3], shape: "", net: true, tall: 60, endless: true, nip: .02, unr: .03};
const STAGES = ["springs", "tape", "tip", "hurry", "weigh"], STAGE_SAY = {springs: "Springs in the basket", tape: "Sticky tape on the walls",
  tip: "The basket tips", hurry: "Hurry: Gus drops it after 3 seconds", weigh: "The basket leans with the weight"};
const isEndless = g => !!(g && LV[g.level].endless);
// a level's own thing, or (in Endless) the thing this stretch has: has(g, "tip"), "hurry"
const has = (g, k) => LV[g.level][k] || (g.stage === k ? (k === "hurry" ? 3 : true) : 0);
const tierOf = () => (game && game.tier) || 0;
const rad = l => RAD[Math.max(0, Math.min(MAXL, l - tierOf()))];   // a ball's size on screen and in the basket
// Each size has a colour, in the order the player picked (G.numbers: Style 1, the rainbow, unless they chose Style 2,
// which was Wind Up's own until 2026-11-23 and jumps about so neighbouring sizes differ in colour and lightness).
// Past 10 the colours come round again (the size they share is long gone).
const colorOf = l => G.numbers.colours()[(l - 1) % MAXL];
const pts = l => l * (l + 1) / 2;
const topL = () => MAXL + tierOf();   // the biggest ball there is now
const goalOf = g => isEndless(g) ? topL() : GOALS[g.level];
const aN = n => (/^(8|11|18)/.test(String(n)) ? "an " : "a ") + n;   // "an 11", "a 12"
// Levels 10 to 12 have a floor that can be dropped: once the yarn in the basket weighs enough, it's a net for a few
// seconds, the basket is shaken, and the small balls (sizes 1 to 3) fall through. It counts as a helper (see FREE).
const hasNet = g => !!LV[g.level].net;
const NET_AT = .36, NET_FOR = 3, NET_HOLE = RAD[3];   // the floor can drop once the basket is this full, is a net this many seconds, and lets balls up to size 3 through
const SHAPE_WORDS = {slope: "sloped floor", slopeR: "sloped floor", hump: "hump", ledge: "ledge", ledgeR: "ledge", ledges: "ledges", round: "round corners", shelves: "shelves", pit: "an open net", springs: "springs", tape: "sticky tape", tapeFull: "sticky tape"};
const NEW_WORDS = {nip: "catnip", unr: "unravelling yarn", tip: "a basket that tips", hurry: "hurry!", weigh: "a basket that leans with the weight"};
const levelName = n => { if (n === ENDLESS) return "Endless"; const v = LV[n], bits = [...new Set(v.shape.split("+").filter(Boolean).map(k => SHAPE_WORDS[k]))]; for (const k in NEW_WORDS) if (v[k]) bits.unshift(NEW_WORDS[k]); if (v.pom[0]) bits.push("fluffballs"); if (v.net && n <= 12) bits.push("drop the floor");
  return `Level ${n} · size ${v.goal} ball` + (bits.length ? ", " + bits.join(", ") : ""); };
// The shapes in the basket: a line of points with a half-thickness (a single point is a round peg), and for the corners
// (net: part of the floor, which turns to net with it when the floor is dropped)
// a polygon to fill. Balls roll off them like the walls.
// Each basket is dealt from its seed (rnd), so the same level comes out a little different every time: a slope
// steeper or gentler, the hump off to one side, ledges higher or lower, longer or shorter, the corners rounder;
// and half the time the whole basket is the other way round. Restart and a shared link get the same basket.
const span = (rnd, a, b) => a + (b - a) * rnd();
const SHAPE = {
  slope: rnd => { const h = span(rnd, 60, 100); return [{pts: [[0, H - h], [W, H]], hr: 3, fill: [[0, H - h], [W, H], [0, H]], net: true}]; },   // the floor higher on the left, so balls roll right
  slopeR: rnd => { const h = span(rnd, 60, 100); return [{pts: [[W, H - h], [0, H]], hr: 3, fill: [[W, H - h], [0, H], [W, H]], net: true}]; },
  hump: rnd => [{pts: [[W / 2 + span(rnd, -70, 70), H + span(rnd, 6, 20)]], hr: span(rnd, 38, 52)}],
  // Ledges are placed up from the floor (H), so a deeper basket has them lower, not up by the line, where they trapped
  // the yarn (until 2026-11-20 they were measured down from the top: a bot won level 12 28% of the time, then 40%).
  // On the 432-deep baskets they're where they always were.
  ledge: rnd => { const y = H - 218 + span(rnd, 0, 48), len = span(rnd, 70, 100); return [{pts: [[0, y], [len, y + span(rnd, 16, 34)]], hr: 5}]; },
  ledgeR: rnd => { const y = H - 204 + span(rnd, 0, 48), len = span(rnd, 70, 100); return [{pts: [[W, y], [W - len, y + span(rnd, 16, 34)]], hr: 5}]; },
  ledges: rnd => { const y1 = H - 236 + span(rnd, 0, 24), y2 = y1 + span(rnd, 70, 92);
    return [[0, y1, 1], [W, y2, -1]].map(([x, y, d]) => { const len = span(rnd, 66, 96); return {pts: [[x, y], [x + d * len, y + span(rnd, 16, 34)]], hr: 5}; }); },
  // springs (level 17): one on the floor and one up each wall; a ball that lands on one is mostly bounced off, but
  // now and then it gets tangled in the coil and stays put until a shake or a wind frees it
  springs: rnd => { const fx = span(rnd, 110, 250), y1 = H - span(rnd, 150, 230), y2 = H - span(rnd, 110, 200);
    // a coil standing from its base along its axis (into the basket); its top end is what balls land on (see springTick)
    const coil = (bx, by, ax, ay, len) => ({spring: true, base: [bx, by], axis: [ax, ay], len, hr: 13, comp: 0, pts: [[bx, by], [bx + ax * len, by + ay * len]]});
    return [coil(fx, H, 0, -1, 50), coil(0, y1, 1, 0, 44), coil(W, y2, -1, 0, 44)]; },
  // sticky tape (level 20): a strip down each wall that a ball of yarn sticks to; stuck, it unravels a size at a time
  // level 20's tape runs all the way down both walls, from just under the line to the floor (above the line a ball
  // stuck to it would count as over the line straight away)
  tapeFull: rnd => [3, W - 3].map(x => ({pts: [[x, LV[17].line + 12], [x, H - 4]], hr: 4, tape: true})),
  tape: rnd => { const y1 = H - span(rnd, 150, 260), y2 = H - span(rnd, 120, 230);
    return [{pts: [[3, y1], [3, y1 + 70]], hr: 4, tape: true}, {pts: [[W - 3, y2], [W - 3, y2 + 70]], hr: 4, tape: true}]; },
  // shelves (level 22, from the owner's sketch): planks across the basket, each tilted to tip the yarn off its low end
  // onto the next one down, measured from the top so they keep their places under the line; plain planks with no lip
  // (the owner's call, 2026-11-27), so the yarn goes back and forth and you choose what to send down to the net
  shelves: rnd => { const j = d => span(rnd, -d, d), C = COLUMN, a = j(4), b = j(4), c = j(4);
    // where one hangs over the next there's room under it for a size 5 (the owner's rule, as for the gaps)
    return [[[133 + j(6), 120 + a], [249 + j(6), 141 + a]], [[133 + j(4), 250 + b], [W, 224 + b]],
      [[C + 2, 335 + c], [W - C - 4 + j(6), 377 + c]]].map(pts => ({pts, hr: 5})); },
  // an open net (level 22): a wedge of floor sloping away from one corner, and in the corner a gap in it, always a net, as
  // wide as a size 5 ball, so the small yarn that rolls in falls out (PIT_W)
  pit: rnd => { const h = span(rnd, 50, 66), x = PIT_W;
    return [{pts: [[x, H], [x, H - h], [W, H - 2]], hr: 3, fill: [[x, H], [x, H - h], [W, H - 2], [W, H]], net: true}, {pts: [[0, H], [x - 3, H]], hr: 0, pit: true}]; },
  round: rnd => { const R = span(rnd, 46, 74); return [-1, 1].map(side => {   // a curved corner each side of the floor: an arc of radius R, filled in behind
    const pts = Array.from({length: 9}, (_, k) => { const f = Math.PI / 2 * (k / 8), phi = side < 0 ? Math.PI - f : f; return [(side < 0 ? R : W - R) + R * Math.cos(phi), H - R + R * Math.sin(phi)]; });
    return {pts, hr: 3, fill: [...pts, [side < 0 ? 0 : W, H]], net: true};
  }); },
};
function basketFor(seed, v) {
  const rnd = mulberry(seed ^ 0x5BA5E7), flip = rnd() < .5;
  const shapes = v.shape.split("+").filter(Boolean).flatMap(k => SHAPE[k](rnd));
  if (!flip) return shapes;
  const fx = ([x, y]) => [W - x, y];
  return shapes.map(sh => ({...sh, pts: sh.pts.map(fx), fill: sh.fill && sh.fill.map(fx)}));
}
const PIT_W = RAD[5] * 2 + 4;   // the open net's width: a size 5 falls through it, a 6 can't
// the owner's rule (2026-11-27): the column over the open net is clear of shelves, and every gap a ball rolls off a
// shelf through is at least as wide as the biggest ball Gus drops (a size 5), so a drop can never wedge; a shelf's
// high end either meets the wall or leaves that much room
const COLUMN = PIT_W + 2;
// Two ways to win level 22 (the owner's call, 2026-11-27): wind small yarn at the far end of the wedge, or drop a ball too
// big for the open net (a 5: the net lets up to a 4 through) down the column, where it's stuck over the net, and build on it

$("levelSel").onchange = e => { if (game) leave(); startLevel(+e.target.value); $("levelSel").blur(); };
G.nav("windup");
G.numbers.watch(() => { spriteSets.yarn = []; paintHud(); });   // the number colours: the balls are drawn again if they change, and asked about once
// full screen on a line under the basket's corner (G.zoom), where every game has it
G.zoom({at: $("board"), below: $("board").parentElement, full: {name: "Wind Up", change: () => paint()}});
G.setupTimer({name: "windup", game: () => game, playing: g => g.state === "running", save, label: levelName, noun: "level",
  emptyText: "Wind the goal ball on a level and your times will show up here. They're kept on this device only."});
$("bestBtn").onclick = () => { pause(); G.showBests("Best times", game ? game.level : settings.level); };
if (!(settings.level >= 1 && settings.level <= MAX_LEVEL) && settings.level !== ENDLESS) settings.level = 1;
$("levelSel").value = settings.level;
const shared = G.readShare("windup");
let openedShare = false;
if (shared) try { openShared(shared); openedShare = true; G.note("Here's the shared basket. Good luck!", 6000); G.track("Wind Up shared puzzle opened"); } catch (e) { G.note("That share link didn't work.", 5000); }
if (!openedShare) {
  const s = state.game;
  if (s && s.level === settings.level && Array.isArray(s.balls) && s.balls.every(b => Array.isArray(b) && b[2] >= 1 && b[2] <= MAXL + (s.tier | 0))) {
    newGame(s.level, s.seed); game.tier = s.tier | 0;   // before the balls are made, so they come out the right size
    if (s.stage && STAGES.includes(s.stage)) { game.stage = s.stage; if (Array.isArray(s.extra)) game.shapes.push(...s.extra); }
    Object.assign(game, {i: s.i, score: s.score, best: s.best, ms: s.ms || 0, started: s.started, timed: s.timed !== false, shook: !!s.shook, fluffed: !!s.fluffed, dropped: !!s.dropped,
      helps: s.helps !== undefined ? s.helps | 0 : s.shook || s.fluffed || s.dropped ? FREE + 1 : 0, revived: !!s.revived,   // (a basket saved before helpers were counted: one used had cost the paw)
      balls: s.balls.map(([x, y, l, a, p, f]) => mk(x, y, l, {a, age: 5, p: !!p, ...kindsOf(f | 0)})), state: "paused"});
    s.balls.forEach((b, i) => { const h = game.balls[b[6]]; if (b[6] >= 0 && h && h !== game.balls[i]) { game.balls[i].head = h; h.tail = game.balls[i]; } });   // the strands
    G.checkClock && G.checkClock(game);
    $("tapgo").hidden = false; $("tapgo").textContent = "Paused · tap to go on"; status(); paintHud();
  } else newGame(settings.level);
}
window.addEventListener("hashchange", () => { const d = G.readShare("windup"); if (d) G.offerShare(d, {name: "Wind Up", inProgress: !!(game && game.started && !["won", "lost"].includes(game.state)), open: d => { try { openShared(d); } catch (e) { G.note("That share link didn't work.", 5000); } }}); });
requestAnimationFrame(frame);
setTimeout(helpOnFirstVisit, 300);
</script>
