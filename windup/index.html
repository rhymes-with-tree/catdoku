<style>
/* Gus sits on the rim of a basket and drops balls of yarn into it; two of a kind that touch wind into one bigger
   ball. Peanut watches from the corner with the next ball. Don't let the yarn pile up over the line. */
.title{display:flex;align-items:flex-end;gap:8px}
.gus{display:block;height:54px;width:auto;margin-bottom:-2px}
@media (max-height:760px){.gus{height:42px}}
.hud{width:var(--board);display:flex;align-items:center;justify-content:space-between;gap:10px}
.next{display:flex;align-items:flex-end;gap:6px}
.next img{display:block;height:50px;width:auto}
.next canvas,.goal canvas{display:block;width:46px;height:46px}
.hud small{display:block;font-size:13px;font-weight:600;line-height:1.1;opacity:.75}
.goal{display:flex;align-items:center;gap:8px;text-align:right}
.score{display:inline-flex;align-items:center;height:26px;padding:0 10px;border:2px solid var(--ink);border-radius:999px;
  background:var(--panel);font-variant-numeric:tabular-nums;white-space:nowrap}
.basket{position:relative;margin:0 auto;aspect-ratio:380/506;width:min(100%, calc((100svh - 330px) * 380 / 506));min-width:250px;max-width:100%;
  touch-action:none;user-select:none;-webkit-user-select:none}
.basket canvas{display:block;width:100%;height:100%;outline:none}
.tapgo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-weight:800;font-size:22px;color:var(--ink);text-shadow:0 2px 0 #fff8;text-align:center;padding:0 16px}
.tapgo[hidden]{display:none}
.stage{--aspect:1.332}
@media (orientation:landscape) and (max-height:500px){body:not(.full) .basket{width:100%;min-width:0}}
/* Full screen (G.fullScreen): the basket as tall as the screen allows, with Pause, the helpers (Shake, De-fluff) and the full screen button under it
   (or in a column beside it on a phone held sideways). */
body.full main{display:grid;grid-template-columns:minmax(0,1fr) auto auto minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;align-items:stretch;gap:6px 8px}

  body.full .wrap{grid-column:1;grid-row:1 / 6}
  body.full .helpers{grid-column:2;grid-row:3;align-self:end;justify-self:stretch;display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px}
  body.full .actions:not(.helpers){grid-column:2;grid-row:4;justify-self:start}

  body.full .fsBtn svg{margin:0 auto}
}

<script>
/* ---------- the basket ---------- */
// World units: the basket is W wide and H deep; Gus sits CAT above its rim. Ten sizes of yarn ball, each winding up
// from two of the one before. Balls are circles with a little physics of their own: gravity, no bounce (yarn is
// soft), a little friction, and pushing apart when they overlap.
const W = 360, H = 432, CAT = 64, M = 10, MAXL = 10;   // M: the basket's wicker walls round the sides and floor
const RAD = [0, 11, 16, 22, 28, 35, 43, 52, 62, 73, 86];
const PTS = [0, 1, 3, 6, 10, 15, 21, 28, 36, 45, 55];
const COLOR = ["", "#ECA818", "#4E577D", "#E16A4A", "#73A7AE", "#B94588", "#B3B94B", "#7885BA", "#BD5538", "#8D78AD", "#6AA673"];
// Twelve levels, each a little harder: a bigger ball to wind, bigger balls among the drops, a lower line (less room),
// fluffballs that don't wind with yarn (pom: how often one comes, and its biggest size), and a basket with a sloped floor, a hump,
// ledges or round corners.
const LV = [null,
  {goal: 6, pool: 4, line: 72, pom: [0, 0], shape: ""},
  {goal: 7, pool: 5, line: 72, pom: [0, 0], shape: "slope"},
  {goal: 8, pool: 5, line: 72, pom: [0, 0], shape: "hump"},
  {goal: 8, pool: 5, line: 100, pom: [.06, 3], shape: "ledge"},
  {goal: 9, pool: 5, line: 100, pom: [.08, 3], shape: "round"},
  {goal: 9, pool: 5, line: 120, pom: [.1, 4], shape: "ledges"},
  {goal: 10, pool: 5, line: 90, pom: [.06, 3], shape: "slopeR+ledge"},
  {goal: 10, pool: 5, line: 100, pom: [.08, 3], shape: "hump+ledgeR"},
  {goal: 10, pool: 5, line: 125, pom: [.08, 3], shape: "round+hump"},
  {goal: 10, pool: 5, line: 125, pom: [.0625, 3], shape: "ledges+slope", net: true},
  {goal: 10, pool: 5, line: 140, pom: [.08, 3], shape: "round+ledges", net: true},
  {goal: 10, pool: 5, line: 150, pom: [.09, 3], shape: "ledges+slope", net: true}];
const GOALS = LV.map(v => v && v.goal), MAX_LEVEL = LV.length - 1;
// Levels 10 to 12 have a floor that can be dropped: once the yarn in the basket weighs enough, it's a net for a few
// seconds, the basket is shaken, and the small balls (sizes 1 to 3) fall through. It costs the gold paw.
const hasNet = g => !!LV[g.level].net;
const NET_AT = .36, NET_FOR = 3, NET_HOLE = RAD[3];   // the floor can drop once the basket is this full, is a net this many seconds, and lets balls up to size 3 through
const SHAPE_WORDS = {slope: "sloped floor", slopeR: "sloped floor", hump: "hump", ledge: "ledge", ledgeR: "ledge", ledges: "ledges", round: "round corners"};
const levelName = n => { const v = LV[n], bits = [...new Set(v.shape.split("+").filter(Boolean).map(k => SHAPE_WORDS[k]))]; if (v.pom[0]) bits.push("fluffballs"); if (v.net) bits.push("drop the floor");
  return `Level ${n} · size ${v.goal} ball` + (bits.length ? ", " + bits.join(", ") : ""); };
// The shapes in the basket: a line of points with a half-thickness (a single point is a round peg), and for the corners
// a polygon to fill. Balls roll off them like the walls.
const SHAPE = {
  slope: () => [{pts: [[0, H - 80], [W, H]], hr: 3, fill: [[0, H - 80], [W, H], [0, H]]}],   // the floor higher on the left, so balls roll right
  slopeR: () => [{pts: [[W, H - 80], [0, H]], hr: 3, fill: [[W, H - 80], [0, H], [W, H]]}],
  hump: () => [{pts: [[W / 2, H + 14]], hr: 44}],
  ledge: () => [{pts: [[0, 236], [84, 262]], hr: 5}],
  ledgeR: () => [{pts: [[W, 250], [W - 84, 276]], hr: 5}],
  ledges: () => [{pts: [[0, 200], [80, 226]], hr: 5}, {pts: [[W, 290], [W - 80, 316]], hr: 5}],
  round: () => [-1, 1].map(side => {   // a curved corner each side of the floor: an arc of 60 units, filled in behind
    const pts = Array.from({length: 9}, (_, k) => { const f = Math.PI / 2 * (k / 8), phi = side < 0 ? Math.PI - f : f; return [(side < 0 ? 60 : W - 60) + 60 * Math.cos(phi), H - 60 + 60 * Math.sin(phi)]; });
    return {pts, hr: 3, fill: [...pts, [side < 0 ? 0 : W, H]]};
  }),
};
const POM_TOP = 6;   // puffballs wind up to this size; two of the biggest puff away
const SHAKE_FOR = .9;   // seconds the basket wobbles after a shake
const SUB = 6, STEP = 1 / 60, ITER = 4, GRACE = 1.1, LOSE_AFTER = 2.4, COOL = 0.4;

const mulberry = s => () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
// The drops come in a fixed order for a seed, so Restart and a shared link give the same basket.
function dropFor(seed, i, v) {
  const rnd = mulberry(seed ^ Math.imul(i + 1, 0x9E3779B1)), r = rnd();
  if (v.pom[0] && rnd() < v.pom[0]) return {l: 1 + Math.floor(rnd() * v.pom[1]), p: true};
  return {l: 1 + Math.floor(r * r * v.pool), p: false};
}

/* ---------- pictures ---------- */
// Ten balls of yarn, smallest to biggest. The order jumps about on purpose: neighbours differ in colour and in how
// light they are, so no two sizes are easy to mix up. Fluffballs are Spelling String's grey pompom with googly eyes.
const POM_SRC = window.POM_SRC || "../fuzzyspelling/pompom.webp", EYE_SRC = window.EYE_SRC || "../fuzzyspelling/eye.webp";
const spriteSets = {yarn: [], fluff: []};
function fluffSprite(l, set) {
  const c = document.createElement("canvas"); c.width = c.height = 256; c.ok = false;
  const pom = new Image(), eye = new Image(); let n = 0;
  const done = () => {
    if (++n < 2) return;
    const x = c.getContext("2d");
    x.drawImage(pom, 0, 0, 256, 256);
    for (const dx of [-1, 1]) { x.save(); x.translate(128 + dx * 47, 118); x.rotate(((l * 97 + dx * 13) % 360) * Math.PI / 180); x.drawImage(eye, -39, -39, 78, 78); x.restore(); }
    c.ok = true; paintHud();
  };
  pom.onload = eye.onload = done; pom.src = POM_SRC; eye.src = EYE_SRC;
  return set[l] = c;
}
function sprite(l, p) {
  const set = spriteSets[p ? "fluff" : "yarn"];
  if (set[l]) return set[l];
  if (p) return fluffSprite(l, set);
  const svg = ballEl("svg", {viewBox: "-1.05 -1.05 2.1 2.1", width: 256, height: 256}); svg.append(ballDefs());
  const g = yarnBall(COLOR[l], 1); g.removeChild(g.firstChild);   // the ground shadow isn't wanted on a ball that turns
  svg.append(g);
  const im = new Image(); im.onload = () => { im.ok = true; paintHud(); };
  im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(svg));
  return set[l] = im;
}
const picCache = {};
const pic = src => picCache[src] || (picCache[src] = Object.assign(new Image(), {src}));
const catSrc = f => `../cats/${f}.webp`;

/* ---------- game ---------- */
// game: {level, seed, i (drops so far), balls [{x, y, px, py, vx, vy, l, r, a, w, age, pop}], score, best (biggest made),
//        cool, overT, aim, fx, state ("ready" | "running" | "paused" | "lost" | "won")}
const STORE = "catdoku.windup.v1";
const $ = G.$;
let state = G.load(STORE);
let settings = Object.assign({level: 1, tries: {}, numbers: false}, state.settings);
let game = null;
const cv = $("cv"), ctx = cv.getContext("2d");
const nextOf = g => dropFor(g.seed, g.i, LV[g.level]);   // the ball Gus is holding
const afterOf = g => dropFor(g.seed, g.i + 1, LV[g.level]);   // the one after it, beside Peanut
const save = () => G.save(STORE, {settings, game: game && ["running", "paused"].includes(game.state) ? {
  level: game.level, seed: game.seed, i: game.i, score: game.score, best: game.best, ms: game.ms, started: game.started, timed: game.timed, shook: !!game.shook, fluffed: !!game.fluffed, dropped: !!game.dropped,
  balls: game.balls.map(b => [Math.round(b.x * 10) / 10, Math.round(b.y * 10) / 10, b.l, Math.round(b.a * 100) / 100, b.p ? 1 : 0])} : null});

function newGame(n, seed) {
  closeCard();
  game = {level: n, line: LV[n].line, shapes: LV[n].shape.split("+").filter(Boolean).flatMap(k => SHAPE[k]()), seed: seed || (Math.random() * 2 ** 31) | 0, i: 0, balls: [], score: 0, best: 0, cool: 0, net: 0, netReady: false, fell: 0, shakeT: 0, shakeCool: 0, overT: 0, aim: W / 2, fx: [], state: "ready", ...G.freshClock()};
  $("tapgo").hidden = true; status(); paintHud(); save();
}
function closeCard() { G.closeCard(); }
const aimRange = l => [RAD[l] + 2, W - RAD[l] - 2];
const clampAim = x => { const [a, b] = aimRange(nextOf(game).l); return Math.max(a, Math.min(b, x)); };

function status() {
  $("score").textContent = `${game.score} points`;
  $("goalTxt").textContent = `Wind a size ${GOALS[game.level]} ball`;
  $("bestTxt").textContent = game.best ? `Biggest so far: ${game.best}` : "";
  G.relabel($("pauseBtn"), game.state === "paused" ? "Go on" : "Pause", game.state === "paused" ? "play" : "pause");
  $("shakeBtn").disabled = game.state !== "running";
  $("netBtn").hidden = !hasNet(game);
  $("netBtn").disabled = game.state !== "running" || !game.netReady || game.net > 0;
  $("fluffBtn").hidden = !LV[game.level].pom[0];   // only on levels that have fluffballs
  $("fluffBtn").disabled = game.state !== "running" || !!game.fluffed;
  $("pauseBtn").disabled = !["running", "paused"].includes(game.state);
}

/* ---------- physics ---------- */
// Impulses stop balls moving into each other (and the walls), with no bounce and a little friction; overlaps are then
// eased apart by moving the balls without giving them speed, so a stack settles quietly instead of springing.
// Numbers that set how the balls feel.
const TUNE = {GRAV: 1150, MU: .08, SPIN: 1.5, SPIN_FADE: 4.5, KICK: .3, KICK_MIN: 65, KICK_SPEED: 70, ROLL: .3, STOP_FADE: 25, WIND: .55, WIND_TURNS: 1.2, WIND_SPIN: 2.5, DROP_NUDGE: 46, MERGE_NUDGE: 12, BOUNCE: 0, FLOOR_BOUNCE: .4, YARN_FLOOR_BOUNCE: .2, BOUNCE_MIN: 120};
const SLOP = .25;
// The nearest point of one piece (segment k) of a shape to a ball: how far, and the direction from the shape to the ball.
function nearOnShape(b, sh, k) {
  const [x1, y1] = sh.pts[k], [x2, y2] = sh.pts[Math.min(k + 1, sh.pts.length - 1)], ex = x2 - x1, ey = y2 - y1, len2 = ex * ex + ey * ey;
  const t = len2 ? Math.max(0, Math.min(1, ((b.x - x1) * ex + (b.y - y1) * ey) / len2)) : 0, px = x1 + ex * t, py = y1 + ey * t;
  const dx = b.x - px, dy = b.y - py, d = Math.hypot(dx, dy);
  return d < 160 ? {d, nx: d ? dx / d : 0, ny: d ? dy / d : -1} : null;
}
// The net: while the floor is dropped, a ball small enough to fit through the net has no floor under it; once it's
// gone through it keeps falling even when the floor comes back.
function throughNet(g, b) { return b.falling || (g.net > 0 && b.r <= NET_HOLE + .5); }
function netTick(g) {
  g.load = g.balls.reduce((t, b) => t + Math.PI * b.r * b.r, 0) / (W * H);
  const ready = g.load > NET_AT;
  if (ready !== g.netReady) { g.netReady = ready; if (ready && !g.netNote) { g.netNote = true; G.note("The basket's heavy: you can drop the floor.", 3500); } status(); }
  if (g.net > 0 && (g.net = Math.max(0, g.net - STEP)) === 0) status();
  for (const b of g.balls) if (!b.falling && throughNet(g, b) && b.y > H - b.r + 1) b.falling = true;
  const out = g.balls.filter(b => b.falling && b.y - b.r > H + M + 4);
  if (out.length) { g.balls = g.balls.filter(b => !out.includes(b)); g.fell += out.length; status(); }
}
// Drop the floor (levels 10 to 12): the floor turns into a net for a few seconds and the basket is shaken so the small balls sift
// down, sinking faster than the rest, and fall through.
function dropFloor() {
  const g = game;
  if (!g || !hasNet(g) || g.state !== "running" || g.net > 0 || $("overlay").classList.contains("show") || document.querySelector(".spot")) return;
  if (!g.netReady) { G.note("Not heavy enough yet: wind and drop more yarn first.", 2500); return; }
  g.net = NET_FOR; g.shakeT = SHAKE_FOR;
  // a sifting shake: the big balls are bounced up and the small ones pushed down, so the small ones slip under them
  for (const b of g.balls) {
    if (b.r <= NET_HOLE + .5) { b.vy += 250; b.vx += (Math.random() - .5) * 200; }
    else { b.vy -= 650 * (.7 + Math.random() * .5); b.vx += (Math.random() - .5) * 300; }
    b.age = Math.min(b.age, 0);
  }
  G.note(g.dropped ? "The floor drops: it's a net!" : "The floor drops: it's a net! That costs the gold paw this time.", 3000); g.dropped = true; status(); save();
}
function step(g, h) {
  const B = g.balls, merges = [], cs = [];
  for (const b of B) { b.vy += TUNE.GRAV * h * (g.net > 0 && b.r <= NET_HOLE + .5 ? 2.5 : 1);   // small balls sink through a dropped floor
    const sp = Math.hypot(b.vx, b.vy); if (sp > 1400) { b.vx *= 1400 / sp; b.vy *= 1400 / sp; } }
  // contacts: pairs touching (or within a hair), and the walls. n points from A to C (from a wall, into the ball).
  for (const b of B) b.floor = false;
  const contact = (A, C, nx, ny) => { if (!A && ny < -.5) C.floor = true; const wa = A ? 1 / (A.r * A.r) : 0, wc = 1 / (C.r * C.r); const vn0 = (C.vx - (A ? A.vx : 0)) * nx + (C.vy - (A ? A.vy : 0)) * ny;
    // a hit harder than BOUNCE_MIN springs back a share of its speed (FLOOR_BOUNCE for fluffballs and YARN_FLOOR_BOUNCE for yarn off the floor, BOUNCE between balls and off the sides); gentler contacts don't bounce, so piles stay calm
    cs.push({A, C, nx, ny, wa, wc, k: wa + wc, jn: 0, jt: 0, bias: vn0 < -TUNE.BOUNCE_MIN ? -vn0 * (!A && ny < -.5 ? (C.p ? TUNE.FLOOR_BOUNCE : TUNE.YARN_FLOOR_BOUNCE) : TUNE.BOUNCE) : 0}); };
  for (let i = 0; i < B.length; i++) {
    const a = B[i];

  const first = !settings.tries[game.level], next = Math.min(MAX_LEVEL, game.level + 1);
  settings.tries[game.level] = 0; settings.level = next; $("levelSel").value = next; save(); status();
  G.track(`Wind Up won level ${game.level}`);
  const g = game;
  setTimeout(() => {
    if (game !== g) return;
    const im = new Image(); im.className = "pic"; im.src = catSrc("kitten-1"); im.alt = "Gus and Peanut as kittens, sitting side by side";
    const text = `A size ${GOALS[g.level]} ball, with ${g.score} points.` + (g.level === MAX_LEVEL ? " That's the biggest ball there is; here it is again." : ` Next up: level ${next}.`);
    G.winCard(text, () => { closeCard(); startLevel(next); }, "Admire the yarn", g.result,
      {title: "All wound up!", gold: first && !g.shook && !g.fluffed && !g.dropped, goldWhy: "First try, no helpers!", goldTitle: "Even Peanut is impressed!", goldPic: [im], next: next > g.level ? `Next: level ${next}` : "Next basket",
       top: g.level === MAX_LEVEL, after: G.otherSize($("levelSel"), next, startLevel, "Or play a different level:")});
  }, 1700);
}
function startLevel(n) { settings.level = n; $("levelSel").value = n; save(); closeCard(); newGame(n); }
const leave = () => { if (["running", "paused"].includes(game.state)) { settings.tries[game.level] = (settings.tries[game.level] || 0) + 1; save(); } else if (game.state === "lost") giveUp(game); closeCard(); };
$("restartBtn").onclick = () => { if (game) { leave(); newGame(game.level, game.seed); } };
$("newBtn").onclick = () => { if (game) { leave(); newGame(game.level); } };
// Share: the level and the order the yarn comes in, as dealt.
$("linkBtn").onclick = () => { if (game) { pause(); G.shareCard({name: "Wind Up", what: "basket", won: game.state === "won", puzzle: () => ({g: "windup", N: game.level, s: game.seed})}); } };
function openShared(d) {
  if (!(d.N >= 1 && d.N <= MAX_LEVEL) || !Number.isInteger(d.s)) throw new Error("the shared basket doesn't fit the game");
  settings.level = d.N; $("levelSel").value = d.N; save(); newGame(d.N, d.s);
}

/* ---------- how to play ---------- */
function showHelp() { pause(); settings.seenHelp = false; helpOnFirstVisit(); if (!document.querySelector(".spot")) { settings.seenHelp = true; G.helpLater(); } }
function helpOnFirstVisit() {
  if (settings.seenHelp || !game || !["ready", "paused", "running"].includes(game.state) || document.querySelector(".spot")) return;
  if (game.state === "running") pause();
  const cols = 9, rows = 12, row = y => Math.floor((CAT + y) / (CAT + H + M) * rows), all = [];
  const line = []; for (let x = 0; x < cols; x++) line.push([x, row(game.line)]);
  const top = []; for (let x = 0; x < cols; x++) top.push([x, 0]);
  const floor = []; for (let x = 0; x < cols; x++) for (let y = rows - 3; y < rows; y++) floor.push([x, y]);
  const steps = [
    {say: "Point where Gus drops, then let go", lit: top},
    {say: "Two of a kind wind into a bigger ball", lit: floor},
    {say: "Wind the goal ball to win", els: [$("goalCv")]},
    ...(LV[game.level].pom[0] ? [{say: "Fluffballs wind only with fluffballs", els: [$("nextCv")]}] : []),
    {say: "Don't pile yarn above the line", lit: line, tone: "ok"},
    {say: "Stuck? Shake the basket", els: [$("shakeBtn")]},
    ...(LV[game.level].pom[0] ? [{say: "Once a board, De-fluff clears the fluffballs", els: [$("fluffBtn")]}] : []),
    ...(hasNet(game) ? [{say: "Heavy? Drop the floor: small balls fall through", els: [$("netBtn")]}] : []),
  ];
  G.spotlight({grid: cv, w: cols, h: rows, steps, done: () => { settings.seenHelp = true; save(); }});
}
$("helpBtn").onclick = showHelp;
$("numTgl").checked = !!settings.numbers;
$("numTgl").onchange = e => { settings.numbers = e.target.checked; save(); paintHud(); };

/* ---------- start ---------- */
for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(levelName(n).replace("Level ", "") + (n === MAX_LEVEL ? " (hardest)" : ""), n));
$("levelSel").onchange = e => { startLevel(+e.target.value); $("levelSel").blur(); };
G.nav("windup");
G.fullScreen({btn: $("fullBtn"), name: "Wind Up", change: () => paint()});
G.setupTimer({name: "windup", game: () => game, playing: g => g.state === "running", save, label: levelName, noun: "level",
  emptyText: "Wind the goal ball on a level and your times will show up here. They're kept on this device only."});
$("bestBtn").onclick = () => { pause(); G.showBests("Best times", game ? game.level : settings.level); };
if (!(settings.level >= 1 && settings.level <= MAX_LEVEL)) settings.level = 1;
$("levelSel").value = settings.level;
const shared = G.readShare("windup");
let openedShare = false;
if (shared) try { openShared(shared); openedShare = true; G.note("Here's the shared basket. Good luck!", 6000); G.track("Wind Up shared puzzle opened"); } catch (e) { G.note("That share link didn't work.", 5000); }
if (!openedShare) {
  const s = state.game;
  if (s && s.level === settings.level && Array.isArray(s.balls) && s.balls.every(b => Array.isArray(b) && b[2] >= 1 && b[2] <= MAXL)) {
    newGame(s.level, s.seed);
    Object.assign(game, {i: s.i, score: s.score, best: s.best, ms: s.ms || 0, started: s.started, timed: s.timed !== false, shook: !!s.shook, fluffed: !!s.fluffed, dropped: !!s.dropped,
      balls: s.balls.map(([x, y, l, a, p]) => mk(x, y, l, {a, age: 5, p: !!p})), state: "paused"});
    G.checkClock && G.checkClock(game);
    $("tapgo").hidden = false; $("tapgo").textContent = "Paused · tap to go on"; status(); paintHud();
  } else newGame(settings.level);
}
window.addEventListener("hashchange", () => { const d = G.readShare("windup"); if (d) G.offerShare(d, {name: "Wind Up", inProgress: !!(game && game.started && !["won", "lost"].includes(game.state)), open: d => { try { openShared(d); } catch (e) { G.note("That share link didn't work.", 5000); } }}); });
requestAnimationFrame(frame);
setTimeout(helpOnFirstVisit, 300);
</script>
