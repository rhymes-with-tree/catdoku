<style>
/* A rug covered in pieces of cat tunnel, with the cat's bed in the middle. Turn the pieces until they all join
   into one network; pieces joined to the bed turn purple and crinkly, and when every one is joined the cat runs
   through the lot. */
.rug{--off:#8C98AA; --on:#9874CA; --on-ring:#7C5AB0; --zoom:#ECA818; --zoom-ring:#C98A0E; --edge:#3E3848;
  background:#E8DCC4;border:3px solid var(--ink);border-radius:10px;overflow:hidden;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.rug .grid{position:absolute;inset:0}
.rug svg{display:block;width:100%;height:100%;outline:none}
.piece{cursor:pointer;transform-box:view-box;transition:transform .16s ease-out}
.tube{stroke:var(--off);transition:stroke .2s}
.hub{fill:var(--off);transition:fill .2s}
.ring{stroke:transparent;transition:stroke .2s}
.edge{stroke:var(--edge)} .edgehub{fill:var(--edge)}
.mouth{fill:#3A2F45}
.lit .tube{stroke:var(--on)} .lit .hub{fill:var(--on)} .lit .ring{stroke:var(--on-ring)}
.zoomed .tube{stroke:var(--zoom)} .zoomed .hub{fill:var(--zoom)} .zoomed .ring{stroke:var(--zoom-ring)}
/* tunnels that join up with each other but go round in a loop, never reaching the bed */
.lost .tube{animation:lost .7s ease-in-out infinite alternate}
@keyframes lost{to{stroke:#E16A4A}}
.hintbox{fill:none;stroke:#6AA673;stroke-width:8;pointer-events:none;animation:glow .45s ease-in-out infinite alternate}
@keyframes glow{to{stroke-opacity:.35}}
.cursor{fill:none;stroke:#73A7AE;stroke-width:6;pointer-events:none}
/* The bed is Bowtie's own tunnel, its outside purple like the joined tunnels (gold once Bowtie has run);
   Bowtie climbs out for the winning run and back in at the end. */
.bed,.cat{pointer-events:none}
/* A gold-paw win shows Bowtie in place of the random cat photo */
.card img.bowtiepic{display:block;width:58%;max-width:230px;height:auto;margin:0 auto 14px}
/* Bugsy leans in from the side of the screen, chest hidden behind the top of the rug */
.rugbox{position:relative;width:var(--board);--bw:min(calc(var(--board) * .3), 150px);padding-top:calc(var(--bw) * .66)}
@media (max-height:760px){.rugbox{--bw:min(calc(var(--board) * .2), 96px)}}
.rugbox .rug{z-index:1}
.bugsy{position:absolute;top:0;right:calc(-1 * min(3vw, 20px));width:var(--bw);height:auto;pointer-events:none;user-select:none;
  -webkit-mask-image:linear-gradient(to left,transparent,#000 14%);mask-image:linear-gradient(to left,transparent,#000 14%)}
/* Sliding tracks: striped grooves across the rug, with arrows round the edge; drag a track or tap an arrow */
.rug.tracks,.rug.tracks svg{touch-action:none}
.floor{fill:#E8DCC4;stroke:#CDBC9C;stroke-width:3}
.groove{fill:#D8C6A2;stroke:#BBA57C;stroke-width:2;stroke-dasharray:10 8}
.spin{transform-box:fill-box;transform-origin:center;transition:transform .16s ease-out}
.slider{cursor:pointer}
.slider path{fill:var(--edge);opacity:.4;transition:opacity .15s}
.slider:hover path{opacity:.8}
@media (prefers-reduced-motion:reduce){.piece,.spin,.tube,.hub,.ring{transition:none}.hintbox,.lost .tube{animation:none}.lost .tube{stroke:#E16A4A}}
</style>

<script>
/* ---------- tunnel networks (plain functions, also run in a background worker) ---------- */
// A piece's tunnels are a 4-bit mask of the sides they open onto: 1 up, 2 right, 4 down, 8 left.
// Every network is a tree grown from the bed in the middle, so it joins every piece with no loops.
// Levels: the rug's size, and its sliding tracks. Pieces on a track already lie the right way and can't be
// turned, but the whole row or column slides round (what slides off one end comes back on the other). Levels
// 1–3 have no tracks, 4–8 a few (never through the bed), and on 9 and 10 every row and column slides and
// nothing turns, after S slides.
function levelSpec(n) {
  return [null, {N: 5, rows: 0, cols: 0}, {N: 6, rows: 0, cols: 0}, {N: 7, rows: 0, cols: 0}, {N: 6, rows: 1, cols: 0},
    {N: 6, rows: 1, cols: 1}, {N: 7, rows: 2, cols: 1}, {N: 8, rows: 2, cols: 2}, {N: 8, rows: 3, cols: 2},
    {N: 6, all: true, S: 4}, {N: 7, all: true, S: 6}][n];
}
function rot(m) { return ((m << 1) | (m >> 3)) & 15; }   // a quarter turn clockwise
function opp(d) { return ((d << 2) | (d >> 2)) & 15; }   // the side facing it
function bits(m) { return (m & 1) + (m >> 1 & 1) + (m >> 2 & 1) + (m >> 3 & 1); }
// The square through side d of square i, or -1 off the edge.
function nbr(N, i, d) {
  const x = i % N, y = Math.floor(i / N);
  if (d === 1) return y > 0 ? i - N : -1;
  if (d === 4) return y < N - 1 ? i + N : -1;
  if (d === 8) return x > 0 ? i - 1 : -1;
  return x < N - 1 ? i + 1 : -1;
}
// Every way a piece can lie, as a set of masks (bit m set: mask m).
function turnsOf(m) { let s = 0; for (let k = 0; k < 4; k++) { s |= 1 << m; m = rot(m); } return s; }

// Grow a random network over the whole rug from the middle, with no four-way crossings.
function growTree(N) {
  for (;;) {
    const cells = new Array(N * N).fill(0), inTree = new Array(N * N).fill(false), start = (N >> 1) * N + (N >> 1);
    inTree[start] = true;
    const frontier = []; let count = 1;
    const add = i => { for (const d of [1, 2, 4, 8]) { const j = nbr(N, i, d); if (j >= 0 && !inTree[j]) frontier.push([i, d, j]); } };
    add(start);
    while (count < N * N && frontier.length) {
      const k = Math.floor(Math.random() * frontier.length), [i, d, j] = frontier[k];
      frontier[k] = frontier[frontier.length - 1]; frontier.pop();
      if (inTree[j] || bits(cells[i]) >= 3) continue;
      cells[i] |= d; cells[j] |= opp(d); inTree[j] = true; count++;
      add(j);
    }
    if (count === N * N) return cells;
  }
}

// Find the answers to a set of pieces, stopping at `limit`. Pieces listed in `fixed` (the bed's, and any on a
// track) never turn.
// Each piece keeps a set of ways it could lie; a side every way opens (or none does) settles the neighbour's
// side too. Then: no loop among the tunnels that are certain, everything still able to join up, and two dead
// ends never face each other (they'd be cut off). Where that runs out, try each way for the most settled piece.
function solveNet(N, pieces, limit, fixed) {
  const n = N * N, dom = new Array(n), D = [1, 2, 4, 8], isFixed = new Uint8Array(n);
  for (const i of [].concat(fixed)) isFixed[i] = 1;
  for (let i = 0; i < n; i++) {
    let s = isFixed[i] ? 1 << pieces[i] : turnsOf(pieces[i]);
    for (let m = 0; m < 16; m++) if (s >> m & 1) {
      for (const d of D) if ((m & d) && nbr(N, i, d) < 0) { s &= ~(1 << m); break; }
      if (bits(pieces[i]) === 1 && n > 2) { const j = nbr(N, i, m); if (j >= 0 && bits(pieces[j]) === 1) s &= ~(1 << m); }
    }
    dom[i] = s;
  }
  const sols = [];
  const andOf = s => { let a = 15; for (let m = 0; m < 16; m++) if (s >> m & 1) a &= m; return a; };
  const orOf = s => { let o = 0; for (let m = 0; m < 16; m++) if (s >> m & 1) o |= m; return o; };
  const keep = (s, want) => { let r = 0; for (let m = 0; m < 16; m++) if ((s >> m & 1) && want(m)) r |= 1 << m; return r; };
  function settle(dom, queue) {
    const inQ = new Uint8Array(n); for (const i of queue) inQ[i] = 1;
    while (queue.length) {
      const i = queue.pop(); inQ[i] = 0;
      const must = andOf(dom[i]), may = orOf(dom[i]);
      for (const d of D) {
        const j = nbr(N, i, d); if (j < 0) continue;
        const od = opp(d); let s = dom[j];
        if (!(may & d)) s = keep(s, m => !(m & od));
        if (must & d) s = keep(s, m => (m & od));
        if (s !== dom[j]) { if (!s) return false; dom[j] = s; if (!inQ[j]) { inQ[j] = 1; queue.push(j); } }
      }

  }

    const p1 = Array.from({length: n}, (_, i) => i), p2 = p1.slice();
    const find = (p, a) => { while (p[a] !== a) a = p[a] = p[p[a]]; return a; };
    let parts = n;
    for (let i = 0; i < n; i++) {
      const must = andOf(dom[i]), may = orOf(dom[i]);
      for (const d of [2, 4]) {
        const j = nbr(N, i, d); if (j < 0) continue;
        if (must & d) { const a = find(p1, i), b = find(p1, j); if (a === b) return false; p1[a] = b; }
        if (may & d) { const a = find(p2, i), b = find(p2, j); if (a !== b) { p2[a] = b; parts--; } }

    }
    return parts === 1;
  }

    if (sols.length >= limit || !joinsUp(dom)) return;
    let best = -1, fewest = 99;
    for (let i = 0; i < n; i++) { let c = 0, v = dom[i]; while (v) { v &= v - 1; c++; } if (c > 1 && c < fewest) { fewest = c; best = i; } }
    if (best < 0) {
      const sol = dom.map(s => 31 - Math.clz32(s));
      if (sol.reduce((t, m) => t + bits(m), 0) / 2 === n - 1) sols.push(sol);   // joined, no loops: one network
      return;
    }
    for (let m = 0; m < 16 && sols.length < limit; m++) if (dom[best] >> m & 1) {
      const d2 = dom.slice(); d2[best] = 1 << m;
      if (settle(d2, [best])) search(d2);
    }
  }
  const d0 = dom.slice();
  if (settle(d0, [...Array(n).keys()])) search(d0);
  return sols;
}
// Cut the tunnel on one side of square i, then join the two halves somewhere else.
function reroute(N, tree, i) {
  const ds = [1, 2, 4, 8].filter(d => tree[i] & d), d = ds[Math.floor(Math.random() * ds.length)], j = nbr(N, i, d);
  const t = tree.slice(); t[i] &= ~d; t[j] &= ~opp(d);
  const side = new Uint8Array(N * N), stack = [i]; side[i] = 1;
  while (stack.length) { const c = stack.pop(); for (const e of [1, 2, 4, 8]) if (t[c] & e) { const k = nbr(N, c, e); if (!side[k]) { side[k] = 1; stack.push(k); } } }
  const ways = [];
  for (let c = 0; c < N * N; c++) if (side[c]) for (const e of [1, 2, 4, 8]) {
    const k = nbr(N, c, e);
    if (k < 0 || side[k] || (c === i && e === d) || bits(t[c]) >= 3 || bits(t[k]) >= 3) continue;
    ways.push([c, e, k]);
  }
  if (!ways.length) return null;
  const [c, e, k] = ways[Math.floor(Math.random() * ways.length)];
  t[c] |= e; t[k] |= opp(e);
  return t;
}
// A network whose turning pieces have exactly one answer: while a second answer turns up, re-route a tunnel
// where the two differ.
function makeTree(N, fixed) {
  for (;;) {
    let tree = growTree(N);
    for (let tries = 0; tries < 400; tries++) {
      const sols = solveNet(N, tree, 2, fixed);
      if (sols.length === 1) return tree;
      const diff = [];
      for (let i = 0; i < N * N; i++) if (sols[0][i] !== sols[1][i]) diff.push(i);
      tree = reroute(N, tree, diff[Math.floor(Math.random() * diff.length)]) || tree;
    }
  }
}

// A slide is [axis, line, k]: axis 0 slides row `line` k squares right, axis 1 slides column `line` k squares down.
// `pos` lists which piece (by its square in the answer) is on each square.
function applySlide(N, pos, m) {
  const [a, l, k] = m, out = pos.slice();
  for (let t = 0; t < N; t++) {
    if (a === 0) out[l * N + (t + k) % N] = pos[l * N + t];
    else out[((t + k) % N) * N + l] = pos[t * N + l];
  }
  return out;
}
// The slides that lead from the answer to the rug as it is, kept short: a slide joins an earlier one on the
// same line when only slides the same way (which don't get in each other's way) come between.
function addSlide(N, trail, m) {
  const t = trail.slice();
  for (let j = t.length - 1; j >= 0 && t[j][0] === m[0]; j--) if (t[j][1] === m[1]) {
    const k = (t[j][2] + m[2]) % N;
    if (k) t[j] = [m[0], m[1], k]; else t.splice(j, 1);
    return t;
  }
  t.push(m);
  return t;
}
function posOf(N, trail) { let pos = [...Array(N * N).keys()]; for (const m of trail) pos = applySlide(N, pos, m); return pos; }
// Every slide of the tracks.
function slidesOn(N, rows, cols) {
  const out = [];
  for (const [a, ls] of [[0, rows], [1, cols]]) for (const l of ls) for (let k = 1; k < N; k++) out.push([a, l, k]);
  return out;
}
// The first slide of a way to put `masks` (the tunnels on each square) back as `goal` in at most two slides, or null.
function shortcut(N, masks, goal, moves) {
  const same = a => a.every((v, i) => v === goal[i]);
  for (const m of moves) if (same(applySlide(N, masks, m))) return m;
  for (const m of moves) { const b = applySlide(N, masks, m); for (const m2 of moves) if (same(applySlide(N, b, m2))) return m; }
  return null;
}
// A rug for level n: {N, sol (the answer), rows and cols (the tracks), turns (quarter turns each piece starts
// away from its answer), trail (the slides that muddled the tracks)}.
// With tracks: pick them away from the bed, make a network whose turning pieces have one answer, turn every
// one of those away from it, and slide each track once (so the rug looks different). With every line sliding:
// slide it S times, each slide changing how the rug looks, and keep it only if it can't be put back in fewer
// than two slides less.

  const pick = k => { const ls = [...Array(N).keys()].filter(l => l !== mid); const out = []; while (out.length < k) out.push(ls.splice(Math.floor(Math.random() * ls.length), 1)[0]); return out.sort((a, b) => a - b); };
  const rows = spec.all ? [...Array(N).keys()] : pick(spec.rows), cols = spec.all ? [...Array(N).keys()] : pick(spec.cols);
  const onTrack = i => rows.includes(Math.floor(i / N)) || cols.includes(i % N);
  const sol = spec.all ? growTree(N) : makeTree(N, [...Array(N * N).keys()].filter(i => i === bed || onTrack(i)));
  const turns = sol.map((m, i) => {
    if (i === bed || onTrack(i)) return 0;
    const ks = [1, 2, 3].filter(k => { let r = m; for (let j = 0; j < k; j++) r = rot(r); return r !== m; });
    return ks[Math.floor(Math.random() * ks.length)];

    let tries = 0;
    while (trail.length < spec.S && tries++ < 200) {
      const m = moves[Math.floor(Math.random() * moves.length)], t = addSlide(N, trail, m);
      if (t.length <= trail.length || look(t).join() === look(trail).join()) continue;
      trail = t;
    }
    if (trail.length < spec.S) return null;
  } else {
    const lines = [...rows.map(l => [0, l]), ...cols.map(l => [1, l])].sort(() => Math.random() - 0.5);
    for (const [a, l] of lines) {
      const ks = [...Array(N - 1).keys()].map(k => k + 1).sort(() => Math.random() - 0.5);
      const k = ks.find(k => look(addSlide(N, trail, [a, l, k])).join() !== look(trail).join());
      if (!k) return null;
      trail = addSlide(N, trail, [a, l, k]);
    }
  }
  const masks = look(trail);
  if (moves.length && masks.every((v, i) => v === sol[i])) return null;
  if (spec.all && spec.S > 2 && shortcut(N, masks, sol, moves)) return null;

}

/* ---------- game state ---------- */
// game: {level, N, sol (the answer), rows and cols (the tracks), turns (quarter turns clockwise each piece lies
//        from its answer, by the piece's square in the answer), trail (the slides from the answer to now),
//        pos (which piece is on each square, worked out from trail), start {turns, trail}, history, won…}
const STORE = "catdoku.tunnelrun.v1", MAX_LEVEL = 10;
const $ = G.$;

const playing = () => game && !game.won && !busy && !running && !$("overlay").classList.contains("show");
const tracksOf = n => { const s = levelSpec(n); return s.all ? "all slide" : s.rows + s.cols ? `${s.rows + s.cols} track${s.rows + s.cols > 1 ? "s" : ""}` : ""; };

const build = G.builder([levelSpec, rot, opp, bits, nbr, turnsOf, growTree, solveNet, reroute, makeTree,
  applySlide, addSlide, posOf, slidesOn, shortcut, makeRug], "makeRug");
const bedOf = N => (N >> 1) * N + (N >> 1);

const BED = {play: "bowtie-bed.webp", run: "bowtie-bed-empty.webp", won: "bowtie-bed-gold.webp"};
const bedLook = k => $("bedpic").setAttribute("href", BED[k]);
const rotN = (m, k) => { for (k = ((k % 4) + 4) % 4; k > 0; k--) m = rot(m); return m; };
const hasTracks = () => game.rows.length + game.cols.length > 0;
const onTrack = i => game.rows.includes(Math.floor(i / game.N)) || game.cols.includes(i % game.N);
const allSlide = () => game.rows.length === game.N && game.cols.length === game.N;
// How a piece lies now: the piece on square i, turned from its answer.
const cur = i => { const p = game.pos[i]; return rotN(game.sol[p], game.turns[p]); };
const bedAt = () => game.pos.indexOf(bedOf(game.N));
const turnable = i => !onTrack(i) && i !== bedAt();

/* ---------- drawing ---------- */
// Each piece is drawn the way its answer lies, at the top left, then moved to its square and turned as a
// whole, so turning and sliding animate. `angle` keeps adding up, so a piece always turns the way it was tapped.
// With tracks, a strip round the rug holds an arrow at each end of every track.
const NS = "http://www.w3.org/2000/svg", M = 44;
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
let pieces = [], spins = [], angle = [], placed = [];
function drawPiece(g, m) {
  el("rect", {x: 0, y: 0, width: 100, height: 100, fill: "transparent"}, g);
  const path = [1, 2, 4, 8].filter(d => m & d).map(d => `M50 50L${d === 2 ? 100 : d === 8 ? 0 : 50} ${d === 1 ? 0 : d === 4 ? 100 : 50}`).join("");
  el("circle", {cx: 50, cy: 50, r: 24, class: "edgehub"}, g);
  el("path", {d: path, class: "edge", "stroke-width": 48, fill: "none"}, g);
  el("circle", {cx: 50, cy: 50, r: 20, class: "hub"}, g);
  el("path", {d: path, class: "tube", "stroke-width": 40, fill: "none"}, g);
  // the crinkly ribs, shown once a piece is joined to the bed
  el("path", {d: path, class: "ring", "stroke-width": 40, fill: "none", "stroke-dasharray": "4 10", "stroke-dashoffset": -24}, g);
  el("circle", {cx: 50, cy: 50, r: 20, class: "hub"}, g);
  if (bits(m) === 1) el("circle", {cx: 50, cy: 50, r: 13, class: "mouth"}, g);   // a dead end: the tunnel's open mouth
}
function draw() {
  const svg = $("svg"), N = game.N, bed = bedOf(N), S = N * 100, tracks = hasTracks();
  svg.innerHTML = ""; pieces = []; spins = []; angle = []; placed = [];
  $("board").classList.toggle("tracks", tracks);
  svg.setAttribute("viewBox", tracks ? `${-M} ${-M} ${S + 2 * M} ${S + 2 * M}` : `0 0 ${S} ${S}`);

  const sol = N && ok(d.s) && /^[0-9a-f]+$/.test(d.s) ? [...d.s].map(c => parseInt(c, 16)) : null;
  const lines = (s, k) => { if (spec.all) return [...Array(N).keys()]; if (!k) return s === undefined || s === "" ? [] : null;
    const ls = typeof s === "string" && /^[0-9a-f]+$/.test(s) ? [...s].map(c => parseInt(c, 16)) : [];
    return ls.length === k && new Set(ls).size === k && ls.every(l => l < N && l !== N >> 1) ? ls : null; };
  const rows = sol && lines(d.r, spec.rows), cols = sol && lines(d.c, spec.cols);
  if (!sol || !rows || !cols || !isNet(N, sol)) { fail(); return; }
  const fixedOK = t => t.every((v, i) => !v || (i !== bedOf(N) && !rows.includes(Math.floor(i / N)) && !cols.includes(i % N)));
  const turnsIn = s => { const t = ok(s) && /^[0-3]+$/.test(s) ? [...s].map(Number) : null; return t && fixedOK(t) ? t : null; };
  // the slides may only move tracks
  const trailIn = s => { if (s === undefined) return []; const t = slidesIn(s, N); return t && t.every(m => (m[0] ? cols : rows).includes(m[1])) ? t : null; };
  const turns = d.t === undefined && spec.all ? new Array(N * N).fill(0) : turnsIn(d.t), trail = trailIn(d.m);
  if (!turns || !trail) { fail(); return; }
  begin({N, sol, rows, cols, turns, trail}, d.N);
  // progress: the turns and slides now (links from before tracks sent just the turns)
  const p = typeof d.p === "string" ? {t: d.p} : d.p;
  if (p) { const t = turnsIn(p.t), m = trailIn(p.m); if (t && m) { game.turns = t; game.trail = m; game.pos = posOf(N, m); game.timed = false; } }
  settings.level = d.N; $("levelSel").value = d.N;
  draw(); save(); build.prefetch(d.N);
  if (p && joined().count === N * N) win();
}

/* ---------- how to play ---------- */
// How to play plays the walkthrough on the board (there's no rules card).
function showHelp() {
  settings.seenHelp = false; helpOnFirstVisit();
  if (!document.querySelector(".spot")) { settings.seenHelp = true; G.helpLater(); }
}
// Where the squares are (with tracks, the arrows take a strip round the rug).
function map() {
  const r = $("svg").getBoundingClientRect(), S = game.N * 100, m = hasTracks() ? M : 0, k = r.width / (S + 2 * m);
  return {ox: r.left + m * k, oy: r.top + m * k, cw: 100 * k, ch: 100 * k};
}
// First visit: walk through the rug that's out, with steps for tracks if it has them. After that, the first
// rug with tracks, and the first where every row and column slides, get a few steps of their own.
function helpOnFirstVisit() {
  if (!game || !playing() || document.querySelector(".spot")) return;
  const N = game.N, bed = bedAt(), xy = i => [i % N, Math.floor(i / N)], all = [...Array(N * N).keys()].map(xy);
  const {lit} = joined(), litNow = all.filter(([x, y]) => lit[y * N + x]);
  const trackCells = all.filter(([x, y]) => onTrack(y * N + x));
  const oneTrack = game.rows.length ? all.filter(([, y]) => y === game.rows[0]) : all.filter(([x]) => x === game.cols[0]);
  // a piece next to the bed to show turning
  const by = [1, 2, 4, 8].map(d => nbr(N, bed, d)).filter(j => j >= 0 && turnable(j));
  const one = by.length ? xy(by.find(j => cur(j) !== game.sol[j]) ?? by[0]) : null;
  const trackSteps = allSlide() ? [
    {say: "Now every row and column slides, and nothing turns", lit: all},
    {say: "Drag a row or column, or tap its arrows", lit: oneTrack},
    {say: "The cat's bed slides too", lit: [xy(bed)]},
  ] : hasTracks() ? [
    {say: "Pieces on a striped track can't turn", lit: trackCells},
    {say: "Drag a track to slide it, or tap its arrows", lit: oneTrack},
    {say: "What slides off one end comes back on the other", lit: oneTrack},
  ] : [];
  const tip = allSlide() ? "seenAllSlide" : hasTracks() ? "seenTracks" : null;
  const done = () => { settings.seenHelp = true; if (tip) settings[tip] = true; save(); };
  if (settings.seenHelp) {
    if (tip && !settings[tip]) G.spotlight({grid: $("grid"), w: N, h: N, steps: trackSteps, map, finish: false, done});
    return;
  }
  const steps = [
    {say: "The cat's tunnels are all muddled up 🐈", lit: all},
    ...(one ? [{say: "Tap a piece to turn it", lit: [one]}, {say: "Hold a piece to turn it back", lit: [one]}] : []),
    ...trackSteps,
    {say: "Pieces joined to the cat's bed turn purple", lit: litNow, tone: "ok"},
    ...(allSlide() ? [] : [{say: "The bed's own tunnel never turns", lit: [xy(bed)]}]),
    {say: "Tunnels never run off the edge of the rug", lit: all.filter(([x, y]) => !x || !y || x === N - 1 || y === N - 1)},
    {say: "Join every piece, with no tunnel left open, and the cat runs through them all!", lit: all, tone: "ok"},
    {say: `Stuck? Hint shows a ${hasTracks() ? "track to slide or a " : ""}piece to turn`, els: [$("hintBtn")]},
  ];
  G.spotlight({grid: $("grid"), w: N, h: N, steps, map, done});
}

for (let n = 1; n <= MAX_LEVEL; n++) $("levelSel").append(new Option(levelName(n).replace("Level ", ""), n));
$("levelSel").onchange = e => { G.closeCard(); startLevel(+e.target.value); };
$("newBtn").onclick = () => { G.closeCard(); newPuzzle(); };
$("helpBtn").onclick = showHelp;

G.nav("tunnelrun");
G.checkClock(game);
G.setupTimer({name: "tunnelrun", game: () => game, playing: g => !g.won, save, label: levelName, noun: "level"});
$("bestBtn").onclick = () => G.showBests("Best times", game ? game.level : settings.level);

if (!(settings.level >= 1 && settings.level <= MAX_LEVEL)) settings.level = 1;
$("levelSel").value = settings.level;
// A rug saved before tracks: levels 1–3 are the same, so carry on with it; any other starts afresh.
if (game && !Array.isArray(game.rows)) {
  const old = game, N = old.N;
  game = levelSpec(old.level) && old.level <= 3 && levelSpec(old.level).N === N && Array.isArray(old.turns) && Array.isArray(old.start) && old.turns.length === N * N
    ? {...old, rows: [], cols: [], trail: [], pos: [...Array(N * N).keys()], start: {turns: old.start, trail: []}} : null;
  if (!game) settings.level = Math.min(settings.level, 3);
}
const shared = G.readShare("tunnelrun");
if (game) G.reopen(() => {
    const spec = levelSpec(game.level);
    if (!spec || spec.N !== game.N || game.sol.length !== game.N * game.N || game.turns.length !== game.N * game.N) throw new Error("the saved tunnels don't fit their level");
    game.pos = posOf(game.N, game.trail);
    draw();
    if (game.won) { pieces.forEach(p => p.classList.add("zoomed")); finishCard(); }
    build.prefetch(settings.level); helpOnFirstVisit();
  }, why => { game = null; newPuzzle().then(() => G.note(why, 0)); });
else if (!shared) newPuzzle();
const shareOpts = () => ({name: "Tunnel Run", inProgress: !!(game && !game.won && game.history.length), open: openShared, after: helpOnFirstVisit});
if (shared) G.offerShare(shared, shareOpts());
// A share link opened while this page is already showing only changes the address, so watch for it.
window.addEventListener("hashchange", () => { const d = G.readShare("tunnelrun"); if (d) G.offerShare(d, shareOpts()); });
</script>
